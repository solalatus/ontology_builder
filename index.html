    const crossings = countCrossingsForCenters(centers, state.edges, indexById);
    if (crossings >= best.crossings) break; // no further improvement this way -- stop, keep current best
    const area = boundingBoxAreaForCenters(centers, state.nodes);
    best = { centers, crossings, area };
  }

  state.nodes.forEach((n, i) => {
    n.x = best.centers[i].x - n.w / 2;
    n.y = best.centers[i].y - n.h / 2;
  });

  resolveNodeOverlaps(state.nodes, REPULSION_MARGIN);
  resolveEdgeLabelPositions(state.nodes, state.edges, indexById);
}

// Public entry point -- the toolbar button and the window.__kg.actions test
// hook both call this directly, as its own single, independent undo step
// (see tests/phase8.spec.mjs). The length guard lives here, before the
// snapshot, so a trivial/no-op call never pays for one or creates a
// phantom history entry -- unchanged from before this function was split.
function autoLayout() {
  if (state.nodes.length < 2) return; // nothing to relax
  const before = snapshotState();
  computeAutoLayoutPositions();
  markDirty();
  pushHistory(before, snapshotState());
  fitViewToContent();
}

// ---------------------------------------------------------------------------
// Tier 1 storage (Section 3.2): every edit writes immediately to a private,
// non-visible background store — no prompts, protects against a crashed tab.
//
// Spec Section 3.1 lists OPFS as universally supported, and Section 2 says
// the app "opens directly in a browser" with "no external server required."
// In practice those two claims conflict: OPFS throws SecurityError under a
// file:// origin (confirmed by testing) — it only works when the page is
// actually served over http(s). Since double-clicking index.html is exactly
// the deployment mode Section 2 promises, OPFS-only would silently provide
// zero crash protection in that mode. So this detects OPFS and falls back to
// localStorage (which does work under file://) when OPFS isn't usable,
// keeping "always-on, all platforms" true in both deployment modes at the
// cost of a second code path and localStorage's much smaller size ceiling
// (fine at the spec's own target scale — Section 6 — of ~1,000 nodes).
// ---------------------------------------------------------------------------
const OPFS_FILENAME = "kg-canvas-live.json";
const LOCALSTORAGE_KEY = "kg-canvas-live";

let storageBackend = null; // 'opfs' | 'localStorage' | 'none', decided once

async function detectStorageBackend() {
  if (storageBackend) return storageBackend;
  try {
    if (navigator.storage && navigator.storage.getDirectory) {
      await navigator.storage.getDirectory();
      storageBackend = "opfs";
      return storageBackend;
    }
  } catch (err) {
    // Present but unusable here (e.g. file:// origin) — fall through to localStorage.
  }
  try {
    localStorage.setItem("__kg_probe__", "1");
    localStorage.removeItem("__kg_probe__");
    storageBackend = "localStorage";
  } catch (err) {
    storageBackend = "none";
    console.warn("[KG Canvas] No live-save backend available in this context — Tier 1 disabled:", err);
  }
  return storageBackend;
}

async function writeGraphPayload(payload) {
  const backend = await detectStorageBackend();
  const json = JSON.stringify(payload);
  if (backend === "opfs") {
    try {
      const root = await navigator.storage.getDirectory();
      const fileHandle = await root.getFileHandle(OPFS_FILENAME, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(json);
      await writable.close();
    } catch (err) {
      console.warn("[KG Canvas] OPFS save failed:", err);
    }
  } else if (backend === "localStorage") {
    try {
      localStorage.setItem(LOCALSTORAGE_KEY, json);
    } catch (err) {
      console.warn("[KG Canvas] localStorage save failed:", err);
    }
  }
}

async function readGraphPayload() {
  const backend = await detectStorageBackend();
  if (backend === "opfs") {
    try {
      const root = await navigator.storage.getDirectory();
      const fileHandle = await root.getFileHandle(OPFS_FILENAME, { create: false });
      const file = await fileHandle.getFile();
      const text = await file.text();
      return text ? JSON.parse(text) : null;
    } catch (err) {
      if (!err || err.name !== "NotFoundError") console.warn("[KG Canvas] OPFS load failed:", err);
      return null;
    }
  }
  if (backend === "localStorage") {
    try {
      const text = localStorage.getItem(LOCALSTORAGE_KEY);
      return text ? JSON.parse(text) : null;
    } catch (err) {
      console.warn("[KG Canvas] localStorage load failed:", err);
      return null;
    }
  }
  return null;
}

async function writeGraphToStorage() {
  await writeGraphPayload({
    nodes: state.nodes,
    edges: state.edges,
    nextNodeNum: state.nextNodeNum,
    nextEdgeNum: state.nextEdgeNum,
    graphName: state.graphName,
    graphNameIsDefault: state.graphNameIsDefault,
    meta: state.meta, // so version numbers stay continuous across sessions (Section 9)
    // Agent Ontology (agent_ontology_spec.md §4.4): additive fields, so an
    // older reader loading this payload just ignores them.
    nextRuleNum: state.nextRuleNum,
    nextActionNum: state.nextActionNum,
    rules: state.rules,
    actions: state.actions,
  });
}

// Saves are coalesced, not queued: a burst of edits while a write is already
// in flight collapses into exactly one trailing save of the latest state,
// and writes never run concurrently (avoiding interleaved/corrupt writes).
let saveScheduled = false;
let saveRunning = false;
let saveIdleResolvers = [];

function scheduleSave() {
  saveScheduled = true;
  runSaveLoop();
}

async function runSaveLoop() {
  if (saveRunning) return;
  saveRunning = true;
  while (saveScheduled) {
    saveScheduled = false;
    await writeGraphToStorage();
  }
  saveRunning = false;
  const resolvers = saveIdleResolvers;
  saveIdleResolvers = [];
  resolvers.forEach((resolve) => resolve());
}

// Test/debug hook: resolves once no save is in flight or queued, so tests
// can wait deterministically instead of guessing timing.
function whenSaveIdle() {
  if (!saveRunning && !saveScheduled) return Promise.resolve();
  return new Promise((resolve) => saveIdleResolvers.push(resolve));
}

// A payload saved before Agent Ontology existed has nodes/edges with no
// meaning/aliases/properties fields at all — normalize on load so the rest
// of the app (JSON export, future editor UI) can always assume the full
// shape instead of scattering `n.aliases || []` checks everywhere. Nodes/
// edges created fresh (createNode/createEdge) or via TXT import already
// get this shape directly; this is the one path that deserializes objects
// without going through those constructors.
function normalizeLoadedNode(n) {
  return {
    ...n,
    meaning: typeof n.meaning === "string" ? n.meaning : null,
    aliases: Array.isArray(n.aliases) ? n.aliases : [],
    properties: Array.isArray(n.properties) ? n.properties : [],
  };
}

function normalizeLoadedEdge(e) {
  return {
    ...e,
    meaning: typeof e.meaning === "string" ? e.meaning : null,
    aliases: Array.isArray(e.aliases) ? e.aliases : [],
  };
}

// A malformed rule/action item (e.g. a hand-edited or partially-migrated
// storage payload missing `conditions`/`preconditions`) used to reach
// snapshotState()/restoreSnapshot() unguarded, which spread it with `[...r
// .conditions]` and threw — and since pushHistory(before, snapshotState())
// evaluates snapshotState() before the call, the throw happened *before*
// pushHistory ever ran, silently breaking undo *and* save for the rest of
// the session on the very next edit. Normalizing on load (same pattern as
// normalizeLoadedNode/normalizeLoadedEdge above) closes that off at the
// only path that deserializes these objects rather than constructing them
// via createRule()/createAction().
function normalizeLoadedRule(r) {
  return {
    ...r,
    name: typeof r.name === "string" ? r.name : "",
    conditions: Array.isArray(r.conditions) ? r.conditions : [],
  };
}

function normalizeLoadedAction(a) {
  return {
    ...a,
    name: typeof a.name === "string" ? a.name : "",
    preconditions: Array.isArray(a.preconditions) ? a.preconditions : [],
    effect: typeof a.effect === "string" ? a.effect : "",
    verification: typeof a.verification === "string" ? a.verification : "",
  };
}

async function loadGraphFromStorage() {
  const data = await readGraphPayload();
  if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) return false;
  state.nodes = data.nodes.map(normalizeLoadedNode);
  state.edges = data.edges.map(normalizeLoadedEdge);
  state.nextNodeNum = typeof data.nextNodeNum === "number" ? data.nextNodeNum : state.nextNodeNum;
  state.nextEdgeNum = typeof data.nextEdgeNum === "number" ? data.nextEdgeNum : state.nextEdgeNum;
  state.nextRuleNum = typeof data.nextRuleNum === "number" ? data.nextRuleNum : state.nextRuleNum;
  state.nextActionNum = typeof data.nextActionNum === "number" ? data.nextActionNum : state.nextActionNum;
  state.rules = Array.isArray(data.rules) ? data.rules.map(normalizeLoadedRule) : [];
  state.actions = Array.isArray(data.actions) ? data.actions.map(normalizeLoadedAction) : [];
  if (typeof data.graphName === "string" && data.graphName) state.graphName = data.graphName;
  // Migration fallback for a payload saved before graphNameIsDefault
  // existed: fall back to the old string-equality heuristic rather than
  // assuming either true or false outright.
  state.graphNameIsDefault = typeof data.graphNameIsDefault === "boolean"
    ? data.graphNameIsDefault
    : isDefaultGraphName(state.graphName);
  if (data.meta && typeof data.meta === "object") state.meta = data.meta;
  return true;
}

// Used for viewport culling (Section 6/9) — not group-specific.
function rectsOverlap(a, b) {
  return !(a.x + a.w <= b.x || a.x >= b.x + b.w || a.y + a.h <= b.y || a.y >= b.y + b.h);
}

function selectNode(id) { state.selection = { type: "node", id }; markDirty(); }
function selectEdge(id) { state.selection = { type: "edge", id }; markDirty(); }
function clearSelection() { state.selection = { type: null, id: null }; markDirty(); }

function setMode(mode) {
  state.mode = mode;
  if (mode !== "connect") state.connectSource = null;
  canvas.classList.toggle("mode-addnode", mode === "addNode");
  canvas.classList.toggle("mode-connect", mode === "connect");
  document.getElementById("btn-add-node").setAttribute("aria-pressed", String(mode === "addNode"));
  document.getElementById("btn-connect").setAttribute("aria-pressed", String(mode === "connect"));
  markDirty();
}

// ---------------------------------------------------------------------------
// Geometry helpers: hit-testing and edge anchor points (line clipped to the
// node's rectangle border, so arrows/lines start/end at the box edge).
// ---------------------------------------------------------------------------
// Every node is the same fixed size, so "topmost" for overlapping boxes is
// just creation order — the most recently added node wins an ambiguous
// click. Used both for hit-testing (as-is) and rendering (reversed, so the
// most recent node still paints on top). Optional `rect` filters to nodes
// intersecting it (viewport culling, see visibleWorldRect() below).
function nodesTopmostFirst(rect) {
  const sorted = [...state.nodes].reverse();
  return rect ? sorted.filter((n) => rectsOverlap(n, rect)) : sorted;
}

function findNodeAt(wx, wy) {
  for (const n of nodesTopmostFirst(visibleWorldRect())) {
    if (wx >= n.x && wx <= n.x + n.w && wy >= n.y && wy <= n.y + n.h) return n;
  }
  return null;
}

function nodeHandles(n) {
  return [
    { x: n.x + n.w / 2, y: n.y },
    { x: n.x + n.w / 2, y: n.y + n.h },
    { x: n.x, y: n.y + n.h / 2 },
    { x: n.x + n.w, y: n.y + n.h / 2 },
  ];
}

function findNodeHandleAt(wx, wy) {
  const radius = 10 / camera.scale; // constant ~10 screen px grab target
  for (const n of nodesTopmostFirst(visibleWorldRect())) {
    for (const h of nodeHandles(n)) {
      if (Math.hypot(wx - h.x, wy - h.y) <= radius) return { node: n, point: h };
    }
  }
  return null;
}


function rectBorderPoint(rect, dx, dy) {
  const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
  if (dx === 0 && dy === 0) return { x: cx, y: cy };
  const hw = rect.w / 2, hh = rect.h / 2;
  const sx = dx !== 0 ? hw / Math.abs(dx) : Infinity;
  const sy = dy !== 0 ? hh / Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy);
  return { x: cx + dx * s, y: cy + dy * s };
}

function edgeAnchors(edge) {
  const src = state.nodes.find((n) => n.id === edge.source);
  const tgt = state.nodes.find((n) => n.id === edge.target);
  if (!src || !tgt) return null;
  const scx = src.x + src.w / 2, scy = src.y + src.h / 2;
  const tcx = tgt.x + tgt.w / 2, tcy = tgt.y + tgt.h / 2;
  const a = rectBorderPoint(src, tcx - scx, tcy - scy);
  const b = rectBorderPoint(tgt, scx - tcx, scy - tcy);
  return { a, b };
}

// ---------------------------------------------------------------------------
// Parallel-edge bending (out-of-spec, user-requested): when 2+ (non-auto)
// edges connect the same unordered node pair, they'd otherwise draw as
// perfectly overlapping lines with stacked, unreadable labels. Each edge in
// such a group is bent into a quadratic curve, offset perpendicular to the
// straight line by a multiple of EDGE_BEND_STEP, symmetric around zero
// (e.g. 3 edges bend at -1, 0, +1 steps) so a lone edge between two nodes
// is completely unaffected (bend 0 == a straight line, the common case).
// Endpoints stay exactly where edgeAnchors() would put a straight edge —
// only the path between them bends — so this never changes hit-target
// anchoring at the node border, just how the line/label reach it.
// ---------------------------------------------------------------------------
const EDGE_BEND_STEP = 60; // world units of perpendicular offset per step

function computeEdgeBendInfo() {
  const groups = new Map(); // "id1|id2" (sorted) -> [edge, ...] in encounter order
  for (const edge of state.edges) {
    const key = edge.source < edge.target ? `${edge.source}|${edge.target}` : `${edge.target}|${edge.source}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(edge);
  }
  const info = new Map(); // edge.id -> { index, count }
  for (const group of groups.values()) {
    group.forEach((edge, index) => info.set(edge.id, { index, count: group.length }));
  }
  return info;
}

// Null when there's only one edge for this node pair (the common case) —
// callers draw/hit-test a plain straight line in that case, unchanged from
// before parallel-edge bending existed.
function edgeControlPoint(a, b, edge, bendInfo) {
  const info = bendInfo.get(edge.id);
  if (!info || info.count <= 1) return null;
  // The perpendicular axis must be canonical — independent of which node
  // this particular edge calls "source" vs "target" — or two edges in the
  // same parallel group pointing opposite ways would have their a->b
  // direction (and so their perpendicular) flipped relative to each other,
  // silently mirroring one edge's offset onto another's and landing them
  // on the exact same curve instead of fanning out (found by screenshot
  // spot-check, not just the geometry-only unit tests, which happened not
  // to cover a same-pair, opposite-direction case).
  const flip = edge.source > edge.target ? -1 : 1;
  const dx = flip * (b.x - a.x), dy = flip * (b.y - a.y);
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len; // unit perpendicular to the straight line
  const step = info.index - (info.count - 1) / 2; // symmetric around 0
  const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  return { x: mid.x + nx * step * EDGE_BEND_STEP, y: mid.y + ny * step * EDGE_BEND_STEP };
}

function quadraticBezierPoint(a, control, b, t) {
  const mt = 1 - t;
  return {
    x: mt * mt * a.x + 2 * mt * t * control.x + t * t * b.x,
    y: mt * mt * a.y + 2 * mt * t * control.y + t * t * b.y,
  };
}

// Full render/hit-test geometry for one edge: anchors (always at the node
// border, exactly as a straight edge would be), an optional bend control
// point, and the actual midpoint a label/toolbar/rename-prompt should sit
// at — the bezier-evaluated midpoint when bent, the plain segment midpoint
// otherwise (control is null, so this degrades to the pre-bending formula).
function edgeGeometry(edge, bendInfo) {
  const anchors = edgeAnchors(edge);
  if (!anchors) return null;
  const control = edgeControlPoint(anchors.a, anchors.b, edge, bendInfo);
  // issue #64 iteration 4: `t` defaults to the plain midpoint (0.5) --
  // exactly today's behavior -- for any edge resolveEdgeLabelPositions()
  // hasn't assigned a labelT to yet (never autolaid-out, or created after
  // the last autolayout run).
  const t = edge.labelT ?? 0.5;
  const mid = control
    ? quadraticBezierPoint(anchors.a, control, anchors.b, t)
    : { x: anchors.a.x + (anchors.b.x - anchors.a.x) * t, y: anchors.a.y + (anchors.b.y - anchors.a.y) * t };
  return { a: anchors.a, b: anchors.b, control, mid };
}

function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const lenSq = dx * dx + dy * dy;
  let t = lenSq === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / lenSq;
  t = clamp(t, 0, 1);
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}

// Distance from a point to a bent (or straight) edge: a bent edge is
// sampled into short straight sub-segments and the minimum distance to any
// of them is used — plenty precise at the pixel-scale threshold this is
// compared against, and exact (not an approximation at all) when there's
// no control point, since that's just the single a->b segment.
const EDGE_CURVE_SAMPLES = 16;
function distToEdgePath(px, py, a, control, b) {
  if (!control) return distToSegment(px, py, a.x, a.y, b.x, b.y);
  let prev = a;
  let best = Infinity;
  for (let i = 1; i <= EDGE_CURVE_SAMPLES; i++) {
    const t = i / EDGE_CURVE_SAMPLES;
    const pt = quadraticBezierPoint(a, control, b, t);
    best = Math.min(best, distToSegment(px, py, prev.x, prev.y, pt.x, pt.y));
    prev = pt;
  }
  return best;
}

function findEdgeAt(wx, wy) {
  const threshold = 6 / camera.scale;
  const rect = visibleWorldRect();
  const bendInfo = computeEdgeBendInfo();
  for (let i = state.edges.length - 1; i >= 0; i--) {
    const e = state.edges[i];
    const geo = edgeGeometry(e, bendInfo);
    if (!geo) continue;
    if (!rectsOverlap(edgeBoundingRect(geo, geo.control), rect)) continue;
    if (distToEdgePath(wx, wy, geo.a, geo.control, geo.b) <= threshold) return e;
  }
  return null;
}

// ---------------------------------------------------------------------------
// Canvas sizing (devicePixelRatio-aware)
// ---------------------------------------------------------------------------
let cssWidth = 0, cssHeight = 0, dpr = 1;

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  cssWidth = rect.width;
  cssHeight = rect.height;
  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);
  markDirty();
}

window.addEventListener("resize", resizeCanvas);

// ---------------------------------------------------------------------------
// Viewport culling (Section 6, Section 9): draw/hit-test only what
// intersects the visible camera rect, so cost scales with what's on screen
// rather than total graph size. Padding keeps things that visually extend a
// little past a node/edge's own geometry (connection handles, edge labels)
// from popping in/out right at the screen edge; expressed in world units
// scaled by 1/camera.scale so it reads as a
// constant ~50 screen px margin at any zoom level.
//
// Safe for hit-testing, not just drawing: findNodeAt/findEdgeAt etc. are
// always called with a world point derived from a click inside the canvas,
// which is by definition already inside this same rect — so a node/edge
// that doesn't intersect it can never contain that point either. Filtering
// to the visible subset first is a pure speed optimization there, not a
// behavior change.
// ---------------------------------------------------------------------------
function visibleWorldRect() {
  const pad = 50 / camera.scale;
  const topLeft = screenToWorld(0, 0);
  const bottomRight = screenToWorld(cssWidth, cssHeight);
  return {
    x: topLeft.x - pad,
    y: topLeft.y - pad,
    w: (bottomRight.x - topLeft.x) + 2 * pad,
    h: (bottomRight.y - topLeft.y) + 2 * pad,
  };
}

// `control` (optional): a bent edge's curve is entirely within the convex
// hull of {a, control, b} (a property of quadratic beziers), so including
// it here is exact enough for culling — never excludes any point the curve
// actually reaches, at worst includes a little extra straight-line margin.
function edgeBoundingRect(anchors, control) {
  const xs = [anchors.a.x, anchors.b.x], ys = [anchors.a.y, anchors.b.y];
  if (control) { xs.push(control.x); ys.push(control.y); }
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

// Exposed via window.__kg (see below) so tests can assert culling actually
// shrinks the drawn set when zoomed into a small region of a large graph,
// rather than only inferring it indirectly from wall-clock timing (noisy
// in CI) — see Phase 9 in TODO.md.
const renderStats = { nodesDrawn: 0, nodesTotal: 0, edgesDrawn: 0, edgesTotal: 0 };

// ---------------------------------------------------------------------------
// Render loop — dirty-flag driven, not a constant loop.
// ---------------------------------------------------------------------------
const NODE_FONT_SIZE = 16;
const EDGE_FONT_SIZE = 12;
const ARROWHEAD_SIZE = 10;

// issue #64 ("Crowded graph layout") iteration 3: text is drawn in world
// space and the canvas transform itself is scaled by camera.scale
// (render()'s ctx.setTransform below), so a flat world-space font size
// shrinks right along with everything else when zoomed out to fit a large
// graph — at the overview zoom levels tools/layout-bench-out's screenshots
// are captured at (roughly 0.2x-0.5x for these fixtures), 16px/12px world
// text lands at only 3-8 actual screen pixels. That's a second, distinct
// contributor to "relationships hidden" beyond node/edge crowding:
// legibility, not just occlusion. Below, the *world-space* font size is
// inflated as camera.scale shrinks, just enough to keep the *on-screen*
// size from dropping under a fixed floor — normal/close zoom (where the
// floor is already exceeded) is completely unaffected, only the overview
// end of the range changes. Capped so an extreme zoom-out (e.g. a very
// tall/narrow graph where fit-to-view has to shrink a lot on one axis)
// doesn't inflate letters into something absurd relative to a 60px-tall
// node box.
function effectiveFontSize(baseSize, minScreenPx, maxWorldPx) {
  return clamp(minScreenPx / camera.scale, baseSize, maxWorldPx);
}
const NODE_FONT_MIN_SCREEN_PX = 11;
const NODE_FONT_MAX_WORLD_PX = 42;
const EDGE_FONT_MIN_SCREEN_PX = 10;
const EDGE_FONT_MAX_WORLD_PX = 30;
const BADGE_FONT_SIZE = 10;
const BADGE_FONT_MIN_SCREEN_PX = 9;
const BADGE_FONT_MAX_WORLD_PX = 22;
const BARE_NODE_DASH = [6, 4];

// Design critique (2026-08), point #7: on canvas a node was just a box with
// a label regardless of how much of the ontology it actually captures --
// no visual difference between a placeholder someone typed a name into and
// a class with a real meaning/aliases/properties behind it. This derives
// that distinction from the node's own data (never a separate "kind"
// field -- the data model has no such thing, see createNode()) so drawNodes
// and any test asserting on it read the exact same thing. "Bare" means
// nothing has been added beyond the label yet.
function nodeVisualState(node) {
  const propertyCount = node.properties.length;
  const isBare = !node.meaning && node.aliases.length === 0 && propertyCount === 0;
  return { isBare, propertyCount };
}

// Resolves the current theme's CSS custom properties (see :root and
// :root[data-theme="light"] above) into one palette object, computed once
// per render() call rather than once per node/edge — a canvas fillStyle/
// strokeStyle can't take a CSS var() directly, this is the bridge.
function resolveColors() {
  const cs = getComputedStyle(document.documentElement);
  const v = (name, fallback) => cs.getPropertyValue(name).trim() || fallback;
  return {
    gridDot: v("--grid-dot", "#2a2a2a"),
    emptyFg: v("--empty-fg", "#666"),
    nodeFill: v("--node-fill", "#242424"),
    nodeStroke: v("--node-stroke", "#666666"),
    nodeStrokeSelected: v("--node-stroke-selected", "#4da6ff"),
    nodeStrokeConnected: v("--node-stroke-connected", "#2dd4bf"),
    connectSourceStroke: v("--connect-source-stroke", "#ffb84d"),
    nodeText: v("--node-text", "#e8e8e8"),
    handleFill: v("--handle-fill", "rgba(255,255,255,0.35)"),
    importedStroke: v("--imported-stroke", "#e0b13f"), // TXT import: "flagged as newly added" (Section 5.3)
    edgeStroke: v("--edge-stroke", "#8a8a8a"),
    edgeStrokeSelected: v("--edge-stroke-selected", "#4da6ff"),
    edgeStrokeConnected: v("--edge-stroke-connected", "#2dd4bf"),
    edgeLabelFg: v("--edge-label-fg", "#bbbbbb"),
    ghostStroke: v("--ghost-stroke", "#4da6ff"),
    // Property-count badge (drawNodes) -- reuses existing neutral chrome
    // tokens rather than adding a new hue: the badge is structural
    // information (how much this class is fleshed out), not interaction
    // state, so it deliberately doesn't compete with the selection/
    // connected/imported/connect-source palette above.
    btnBgActive: v("--btn-bg-active", "#4a4a4a"),
    canvasBg: v("--canvas-bg", "#121212"),
  };
}

function drawGrid(colors) {
  // Grid spacing adapts to zoom so it stays visually useful at any scale.
  // Drawn manually in screen space (not via ctx transform) to keep dot
  // density/precision sane at extreme zoom (Section 6).
  const targetPx = 60;
  let worldStep = targetPx / camera.scale;
  const pow10 = Math.pow(10, Math.floor(Math.log10(worldStep)));
  const mantissa = worldStep / pow10;
  const niceMantissa = mantissa < 2 ? 1 : mantissa < 5 ? 2 : 5;
  worldStep = niceMantissa * pow10;

  const topLeft = screenToWorld(0, 0);
  const bottomRight = screenToWorld(cssWidth, cssHeight);

  const startX = Math.floor(topLeft.x / worldStep) * worldStep;
  const startY = Math.floor(topLeft.y / worldStep) * worldStep;

  ctx.fillStyle = colors.gridDot;
  const dotRadius = clamp(1.2 * camera.scale, 0.5, 2);

  for (let wx = startX; wx <= bottomRight.x; wx += worldStep) {
    for (let wy = startY; wy <= bottomRight.y; wy += worldStep) {
      const sx = wx * camera.scale + camera.panX;
      const sy = wy * camera.scale + camera.panY;
      ctx.beginPath();
      ctx.arc(sx, sy, dotRadius, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawEmptyState(colors) {
  ctx.save();
  ctx.fillStyle = colors.emptyFg;
  ctx.font = "16px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(t("emptyCanvasMessage", t("addNode")), cssWidth / 2, cssHeight / 2);
  ctx.restore();
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawArrowhead(x, y, dx, dy, size) {
  const angle = Math.atan2(dy, dx);
  const a1 = angle + Math.PI - 0.4;
  const a2 = angle + Math.PI + 0.4;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + size * Math.cos(a1), y + size * Math.sin(a1));
  ctx.lineTo(x + size * Math.cos(a2), y + size * Math.sin(a2));
  ctx.closePath();
  ctx.fill();
}

// Single click/tap selection has always highlighted only the exact thing
// clicked. This extends it one hop further: selecting a node highlights
// every edge touching it, and selecting an edge highlights the two node
// boxes at its ends -- so a class's whole immediate neighborhood, or a
// relationship's two endpoints, is visible at a glance instead of having
// to trace a thin line by eye through a crowded layout. No new
// interaction wiring needed for touch: the existing click handler (canvas
// "click" listener below) already fires uniformly for a desktop click and
// a mobile tap, and this only changes what render() draws in response to
// the same state.selection it already tracked. Computed once per render
// (not once per node/edge) since it only depends on the current
// selection, never on what's currently being drawn.
function computeHighlightedConnections() {
  const nodeIds = new Set();
  const edgeIds = new Set();
  if (state.selection.type === "node") {
    for (const e of state.edges) {
      if (e.source === state.selection.id || e.target === state.selection.id) edgeIds.add(e.id);
    }
  } else if (state.selection.type === "edge") {
    const edge = state.edges.find((e) => e.id === state.selection.id);
    if (edge) { nodeIds.add(edge.source); nodeIds.add(edge.target); }
  }
  return { nodeIds, edgeIds };
}

function drawEdges(colors, highlighted) {
  const rect = visibleWorldRect();
  const bendInfo = computeEdgeBendInfo();
  let edgesTotal = 0, edgesDrawn = 0;
  for (const edge of state.edges) {
    edgesTotal++;
    const geo = edgeGeometry(edge, bendInfo);
    if (!geo) continue;
    if (!rectsOverlap(edgeBoundingRect(geo, geo.control), rect)) continue; // viewport culling (Section 6/9)
    edgesDrawn++;
    const selected = state.selection.type === "edge" && state.selection.id === edge.id;
    const isConnected = highlighted.edgeIds.has(edge.id);
    ctx.strokeStyle = selected ? colors.edgeStrokeSelected : isConnected ? colors.edgeStrokeConnected : colors.edgeStroke;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = selected || isConnected ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(geo.a.x, geo.a.y);
    if (geo.control) ctx.quadraticCurveTo(geo.control.x, geo.control.y, geo.b.x, geo.b.y);
    else ctx.lineTo(geo.b.x, geo.b.y);
    ctx.stroke();
    if (edge.directed) {
      // Arrowhead follows the curve's actual tangent at the endpoint (the
      // direction from the control point to b), not the straight a->b
      // direction, so it still points the way the bent line is heading —
      // degrades to the old a->b direction exactly when control is null.
      const tailPoint = geo.control || geo.a;
      drawArrowhead(geo.b.x, geo.b.y, geo.b.x - tailPoint.x, geo.b.y - tailPoint.y, ARROWHEAD_SIZE);
    }
    ctx.fillStyle = colors.edgeLabelFg;
    ctx.font = `${effectiveFontSize(EDGE_FONT_SIZE, EDGE_FONT_MIN_SCREEN_PX, EDGE_FONT_MAX_WORLD_PX)}px system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText(edge.relation, geo.mid.x, geo.mid.y - 4);
  }
  renderStats.edgesTotal = edgesTotal;
  renderStats.edgesDrawn = edgesDrawn;
}

function drawNodes(colors, highlighted) {
  const rect = visibleWorldRect();
  // Biggest/outermost first so nested boxes always paint on top of their
  // container, regardless of creation order (mirrors hit-test priority).
  // Culled to the visible rect (Section 6/9) before the sort's more
  // expensive per-node draw calls, not before the cheap O(n log n) sort
  // itself — sorting all nodes is negligible next to the canvas calls.
  const drawOrder = [...nodesTopmostFirst(rect)].reverse();
  renderStats.nodesTotal = state.nodes.length;
  renderStats.nodesDrawn = drawOrder.length;
  for (const node of drawOrder) {
    const selected = state.selection.type === "node" && state.selection.id === node.id;
    const isConnectSource = state.connectSource === node.id;
    const isNewlyImported = newlyImportedIds.has(node.id);
    const isConnected = highlighted.nodeIds.has(node.id);
    const { isBare, propertyCount } = nodeVisualState(node);

    ctx.fillStyle = colors.nodeFill;
    ctx.strokeStyle = isConnectSource ? colors.connectSourceStroke
      : selected ? colors.nodeStrokeSelected
      : isNewlyImported ? colors.importedStroke
      : isConnected ? colors.nodeStrokeConnected
      : colors.nodeStroke;
    ctx.lineWidth = selected || isConnectSource || isNewlyImported || isConnected ? 3 : 1.5;
    // A node nobody has documented yet (no meaning, aliases, or properties
    // -- just a label) reads as a dashed placeholder instead of looking
    // identical to a fully-specified class (design critique, 2026-08 #7).
    // Reset unconditionally each node, not only when true, since canvas
    // line-dash state persists across draw calls otherwise (would leak
    // into whichever node/edge/ghost-edge draws next).
    ctx.setLineDash(isBare ? BARE_NODE_DASH : []);
    roundRectPath(node.x, node.y, node.w, node.h, 8);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.save();
    roundRectPath(node.x, node.y, node.w, node.h, 8);
    ctx.clip();
    ctx.fillStyle = colors.nodeText;
    ctx.font = `${effectiveFontSize(NODE_FONT_SIZE, NODE_FONT_MIN_SCREEN_PX, NODE_FONT_MAX_WORLD_PX)}px system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(node.label, node.x + node.w / 2, node.y + node.h / 2, node.w - 16);
    ctx.restore();

    ctx.fillStyle = colors.handleFill;
    for (const h of nodeHandles(node)) {
      ctx.beginPath();
      ctx.arc(h.x, h.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Property-count badge: a small corner marker signaling "this class
    // carries real structure", not just decoration -- a fuller ontology
    // node should look different from a stub at a glance, without having
    // to open the details dialog to check (design critique, 2026-08 #7).
    if (propertyCount > 0) {
      const badgeFont = effectiveFontSize(BADGE_FONT_SIZE, BADGE_FONT_MIN_SCREEN_PX, BADGE_FONT_MAX_WORLD_PX);
      const badgeRadius = badgeFont * 0.9;
      const bx = node.x + node.w, by = node.y;
      ctx.beginPath();
      ctx.arc(bx, by, badgeRadius, 0, Math.PI * 2);
      ctx.fillStyle = colors.btnBgActive;
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = colors.canvasBg;
      ctx.stroke();
      ctx.fillStyle = colors.nodeText;
      ctx.font = `${badgeFont}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(propertyCount), bx, by + 0.5);
    }
  }
}

function drawGhostEdge(colors) {
  if (dragMode !== "createEdge" || !edgeDragSourceId || !edgeDragCurrentWorld) return;
  const src = state.nodes.find((n) => n.id === edgeDragSourceId);
  if (!src) return;
  const cx = src.x + src.w / 2, cy = src.y + src.h / 2;
  const a = rectBorderPoint(src, edgeDragCurrentWorld.x - cx, edgeDragCurrentWorld.y - cy);
  ctx.save();
  ctx.strokeStyle = colors.ghostStroke;
  ctx.setLineDash([6, 4]);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(edgeDragCurrentWorld.x, edgeDragCurrentWorld.y);
  ctx.stroke();
  ctx.restore();
}

const selToolbar = document.getElementById("sel-toolbar");
const selRenameBtn = document.getElementById("sel-rename");
const selDetailsBtn = document.getElementById("sel-details");
const selToggleDirBtn = document.getElementById("sel-toggle-dir");
const selTrashBtn = document.getElementById("sel-trash");

function updateSelectionToolbar() {
  if (!state.selection.type) { selToolbar.style.display = "none"; return; }
  let anchorWorld;
  if (state.selection.type === "node") {
    const n = state.nodes.find((x) => x.id === state.selection.id);
    if (!n) { selToolbar.style.display = "none"; return; }
    anchorWorld = { x: n.x + n.w, y: n.y };
    selToggleDirBtn.style.display = "none";
  } else {
    const e = state.edges.find((x) => x.id === state.selection.id);
    const geo = e && edgeGeometry(e, computeEdgeBendInfo());
    if (!geo) { selToolbar.style.display = "none"; return; }
    anchorWorld = geo.mid; // the curve's actual midpoint when the edge is bent, not the straight-line one
    selToggleDirBtn.style.display = "";
  }
  const screen = worldToScreen(anchorWorld.x, anchorWorld.y);
  selToolbar.style.display = "flex";
  selToolbar.style.left = `${screen.x}px`;
  selToolbar.style.top = `${screen.y}px`;
}

function updateClearButton() {
  document.getElementById("btn-clear").disabled = state.nodes.length === 0 && state.edges.length === 0;
}

function render() {
  const colors = resolveColors();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawGrid(colors);

  const highlighted = computeHighlightedConnections();
  ctx.save();
  ctx.setTransform(dpr * camera.scale, 0, 0, dpr * camera.scale, dpr * camera.panX, dpr * camera.panY);
  drawEdges(colors, highlighted);
  drawNodes(colors, highlighted);
  drawGhostEdge(colors);
  ctx.restore();

  if (state.nodes.length === 0) drawEmptyState(colors);

  updateSelectionToolbar();
  updateClearButton();
}

function loop() {
  if (dirty) {
    dirty = false;
    render();
  }
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------------
// Inline text input — used for node-label and edge-relation entry instead of
// native prompt()/confirm(), so it's consistent, stylable, and DOM-testable.
// ---------------------------------------------------------------------------
let activeInlineEditor = null;

// Keeps a fixed-position element's *center* (x, y) far enough inside the
// viewport that its own box never spills off-screen or under the toolbar
// overlay — without this, a rename input anchored near a screen edge (e.g.
// a node close to the window border after panning) could render partly
// invisible, which read as "funky"/"distant" even though the anchor point
// itself was correct.
function clampCenterToViewport(x, y, halfW, halfH) {
  const margin = 8;
  const toolbarBottom = document.getElementById("toolbar").getBoundingClientRect().bottom;
  const minX = halfW + margin;
  const maxX = window.innerWidth - halfW - margin;
  const minY = toolbarBottom + halfH + margin;
  const maxY = window.innerHeight - halfH - margin;
  return {
    x: minX <= maxX ? Math.min(Math.max(x, minX), maxX) : (minX + maxX) / 2,
    y: minY <= maxY ? Math.min(Math.max(y, minY), maxY) : (minY + maxY) / 2,
  };
}

function showInlineInput({ x, y, value = "", placeholder = "", onCommit, onCancel }) {
  cancelInlineInput();
  const input = document.createElement("input");
  input.type = "text";
  input.className = "kg-inline-input";
  input.value = value;
  input.placeholder = placeholder;
  input.style.left = `${x}px`;
  input.style.top = `${y}px`;
  document.body.appendChild(input);
  // Re-clamp using the input's real, laid-out size (min-width 140px plus
  // padding/border) now that it's actually in the DOM.
  const clamped = clampCenterToViewport(x, y, input.offsetWidth / 2, input.offsetHeight / 2);
  input.style.left = `${clamped.x}px`;
  input.style.top = `${clamped.y}px`;
  input.focus();
  input.select();

  let done = false;
  function finish(commit) {
    if (done) return;
    done = true;
    input.removeEventListener("keydown", onKey);
    input.removeEventListener("blur", onBlur);
    input.remove();
    activeInlineEditor = null;
    if (commit) onCommit(input.value);
    else if (onCancel) onCancel();
  }
  function onKey(ev) {
    if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
    else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
  }
  function onBlur() { finish(true); }

  input.addEventListener("keydown", onKey);
  input.addEventListener("blur", onBlur);
  activeInlineEditor = { finish };
}

function cancelInlineInput() {
  if (activeInlineEditor) activeInlineEditor.finish(false);
}

// ---------------------------------------------------------------------------
// Confirm dialog — a centered modal for destructive actions (e.g. Clear),
// used instead of native confirm() for the same reason as the inline text
// input: consistent styling and DOM-testability.
// ---------------------------------------------------------------------------
const confirmOverlay = document.getElementById("confirm-overlay");
const confirmMessageEl = document.getElementById("confirm-message");
const confirmOkBtn = document.getElementById("confirm-ok");
const confirmCancelBtn = document.getElementById("confirm-cancel");
let activeConfirm = null;

// Guards against stacking a second modal on top of one that's already open
// — nothing here traps focus, so Tab can reach an unrelated toolbar button
// while e.g. the Details dialog is open, and Enter on it would otherwise
// open Domain Model underneath the still-open Details overlay with no way
// to tell (Escape only closes the top one; the bottom one then blocks the
// whole canvas/toolbar once the top one's dismissed). Checked fresh via
// getElementById, not the module-level overlay consts, so it works
// regardless of where in the file it's called from relative to those
// consts' own declaration order.
function isAnyModalOpen() {
  return ["confirm-overlay", "details-overlay", "domain-model-overlay", "import-overlay"]
    .some((id) => document.getElementById(id).style.display === "flex");
}

function showConfirmDialog({ message, confirmLabel = t("ok"), onConfirm, onCancel }) {
  if (isAnyModalOpen()) return;
  cancelInlineInput();
  confirmMessageEl.textContent = message;
  confirmOkBtn.textContent = confirmLabel;
  confirmOverlay.style.display = "flex";
  activeConfirm = { onConfirm, onCancel };
}

function closeConfirmDialog(confirmed) {
  if (!activeConfirm) return;
  const { onConfirm, onCancel } = activeConfirm;
  activeConfirm = null;
  confirmOverlay.style.display = "none";
  if (confirmed) { if (onConfirm) onConfirm(); }
  else if (onCancel) onCancel();
}

confirmOkBtn.addEventListener("click", () => closeConfirmDialog(true));
confirmCancelBtn.addEventListener("click", () => closeConfirmDialog(false));
confirmOverlay.addEventListener("click", (e) => {
  if (e.target === confirmOverlay) closeConfirmDialog(false); // click outside the dialog = cancel
});

// ---------------------------------------------------------------------------
// Agent Ontology (agent_ontology_spec.md §7): Class/Relationship details
// dialog. One shared overlay; aliases/properties sections toggle visibility
// depending on whether the target is a node or an edge. Committing is one
// undo step, same as every other discrete action — and, like the rename
// flow right above, a no-op save (nothing actually changed) doesn't push a
// history entry at all.
// ---------------------------------------------------------------------------
const detailsOverlay = document.getElementById("details-overlay");
const detailsTitleEl = document.getElementById("details-title");
const detailsMeaningEl = document.getElementById("details-meaning");
const detailsAliasesSection = document.getElementById("details-aliases-section");
const detailsAliasesList = document.getElementById("details-aliases-list");
const detailsPropertiesSection = document.getElementById("details-properties-section");
const detailsPropertiesList = document.getElementById("details-properties-list");
const detailsAddAliasBtn = document.getElementById("details-add-alias");
const detailsAddPropertyBtn = document.getElementById("details-add-property");
const detailsCancelBtn = document.getElementById("details-cancel");
const detailsSaveBtn = document.getElementById("details-save");

let detailsEditingTarget = null; // { kind: "node" | "edge", id } | null

// Re-derives the dialog's own heading from whatever's currently being
// edited — called both when opening and from applyLanguage(), so a language
// toggle mid-edit doesn't leave a stale-language title. A no-op when the
// dialog isn't open.
function updateDetailsTitle() {
  if (!detailsEditingTarget) return;
  detailsTitleEl.textContent = detailsEditingTarget.kind === "edge"
    ? t("editRelationshipDetailsTitle")
    : t("editClassDetailsTitle"); // every node is a Class now — groups were removed entirely
}

function createDetailsRemoveButton(onRemove) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "details-row-remove";
  btn.setAttribute("aria-label", t("removeRow"));
  btn.textContent = "✕";
  btn.addEventListener("click", onRemove);
  return btn;
}

function createAliasRow(value) {
  const row = document.createElement("div");
  row.className = "details-row";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "details-alias-input";
  input.placeholder = t("aliasPlaceholder");
  input.value = value;
  row.append(input, createDetailsRemoveButton(() => row.remove()));
  return row;
}

const PROPERTY_TYPES = ["text", "number", "date", "boolean"];

// prop.id is preserved from existing state; a brand-new row (from "+ Add
// property") gets one generated here so every row has a stable id at all
// times — Property.id isn't referenced by anything yet (agent_ontology_spec.md
// §4.1 marks it "reserved for Import"), so a short random suffix is enough,
// no global counter needed the way node/edge/rule/action ids have one.
// Two sub-rows per property, not one flat 5-cell row: at this dialog's
// width, name+type+unit+allowed+remove-button don't fit on one line and
// wrap unpredictably — the remove button was landing on its own visual
// line, looking like it belonged to a different (empty) row. A deliberate
// two-line "card" per property reads correctly regardless of exact widths.
function createPropertyRow(prop) {
  const row = document.createElement("div");
  row.className = "details-property-row";
  row.dataset.propId = prop.id || `p_${Math.random().toString(36).slice(2, 9)}`;

  const topRow = document.createElement("div");
  topRow.className = "details-property-row-top";
  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.className = "details-property-name";
  nameInput.placeholder = t("propertyNamePlaceholder");
  nameInput.value = prop.name || "";
  topRow.append(nameInput, createDetailsRemoveButton(() => row.remove()));

  const bottomRow = document.createElement("div");
  bottomRow.className = "details-property-row-bottom";
  const typeSelect = document.createElement("select");
  typeSelect.className = "details-property-type";
  for (const type of PROPERTY_TYPES) {
    const opt = document.createElement("option");
    opt.value = type;
    opt.textContent = t(`propertyType${type[0].toUpperCase()}${type.slice(1)}`);
    typeSelect.appendChild(opt);
  }
  typeSelect.value = prop.type || "text";

  const unitInput = document.createElement("input");
  unitInput.type = "text";
  unitInput.className = "details-property-unit";
  unitInput.placeholder = t("propertyUnitPlaceholder");
  unitInput.value = prop.unit || "";

  const allowedInput = document.createElement("input");
  allowedInput.type = "text";
  allowedInput.className = "details-property-allowed";
  allowedInput.placeholder = t("propertyAllowedPlaceholder");
  allowedInput.value = (prop.allowed || []).join(", ");

  function syncUnitVisibility() {
    unitInput.style.display = typeSelect.value === "number" ? "" : "none";
  }
  typeSelect.addEventListener("change", syncUnitVisibility);
  syncUnitVisibility();

  bottomRow.append(typeSelect, unitInput, allowedInput);
  row.append(topRow, bottomRow);
  return row;
}

function openDetailsDialog(kind, id) {
  if (isAnyModalOpen()) return;
  cancelInlineInput();
  const target = kind === "node" ? state.nodes.find((n) => n.id === id) : state.edges.find((e) => e.id === id);
  if (!target) return;
  detailsEditingTarget = { kind, id };
  updateDetailsTitle();
  detailsMeaningEl.value = target.meaning || "";

  const isNode = kind === "node";
  detailsAliasesSection.style.display = ""; // aliases are shared by both nodes and edges now
  detailsPropertiesSection.style.display = isNode ? "" : "none"; // properties remain node-only
  detailsAliasesList.textContent = "";
  detailsPropertiesList.textContent = "";
  for (const alias of target.aliases) detailsAliasesList.appendChild(createAliasRow(alias));
  if (isNode) {
    for (const prop of target.properties) detailsPropertiesList.appendChild(createPropertyRow(prop));
  }

  detailsOverlay.style.display = "flex";
  detailsMeaningEl.focus();
}

function closeDetailsDialog() {
  detailsOverlay.style.display = "none";
  detailsEditingTarget = null;
}

function collectAliasesFromDom() {
  return [...detailsAliasesList.querySelectorAll(".details-alias-input")]
    .map((input) => input.value.trim())
    .filter(Boolean);
}

function collectPropertiesFromDom() {
  return [...detailsPropertiesList.children]
    .map((row) => {
      const type = row.querySelector(".details-property-type").value;
      const unitRaw = row.querySelector(".details-property-unit").value.trim();
      const allowedRaw = row.querySelector(".details-property-allowed").value.trim();
      return {
        id: row.dataset.propId,
        name: row.querySelector(".details-property-name").value.trim(),
        type,
        unit: type === "number" && unitRaw ? unitRaw : null,
        allowed: allowedRaw ? allowedRaw.split(",").map((s) => s.trim()).filter(Boolean) : null,
      };
    })
    .filter((p) => p.name); // a row added then left nameless (add-then-cancel-typing) isn't saved as a property
}

function saveDetailsDialog() {
  if (!detailsEditingTarget) return;
  const { kind, id } = detailsEditingTarget;
  const target = kind === "node" ? state.nodes.find((n) => n.id === id) : state.edges.find((e) => e.id === id);
  if (!target) { closeDetailsDialog(); return; }

  const before = snapshotState();
  const meaning = detailsMeaningEl.value.trim() || null;
  let changed = meaning !== target.meaning;
  target.meaning = meaning;
  const aliases = collectAliasesFromDom();
  if (JSON.stringify(aliases) !== JSON.stringify(target.aliases)) changed = true;
  target.aliases = aliases;
  if (kind === "node") {
    const properties = collectPropertiesFromDom();
    if (JSON.stringify(properties) !== JSON.stringify(target.properties)) changed = true;
    target.properties = properties;
  }
  closeDetailsDialog();
  if (changed) {
    pushHistory(before, snapshotState());
    markDirty();
  }
}

detailsAddAliasBtn.addEventListener("click", () => {
  const row = createAliasRow("");
  detailsAliasesList.appendChild(row);
  row.querySelector("input").focus();
});
detailsAddPropertyBtn.addEventListener("click", () => {
  const row = createPropertyRow({ name: "", type: "text", unit: null, allowed: null });
  detailsPropertiesList.appendChild(row);
  row.querySelector(".details-property-name").focus();
});
detailsSaveBtn.addEventListener("click", saveDetailsDialog);
detailsCancelBtn.addEventListener("click", () => closeDetailsDialog());
detailsOverlay.addEventListener("click", (e) => {
  if (e.target === detailsOverlay) closeDetailsDialog(); // click outside the dialog = cancel
});

// ---------------------------------------------------------------------------
// Agent Ontology (agent_ontology_spec.md §7, Decision #5): Rules/Actions
// manager. Whole-dialog draft-then-commit, same philosophy as the details
// dialog above — every add/remove/edit here happens against DOM elements
// only; state.rules/state.actions are read once on open and written once
// on Save (as a single undo step), never touched while the dialog is open.
//
// New rows (from "+ Add rule"/"+ Add action") don't have a real id yet —
// they get a `draft_`-prefixed placeholder id, good only for this editing
// session, so an action's preconditions <select> can still reference a
// rule added in the same session before either has been saved. Save()
// mints real ids (genRuleId()/genActionId()) only for rows still carrying
// a draft id; existing rows keep their real id untouched, unchanged
// whether or not anything on them was actually edited.
// ---------------------------------------------------------------------------
const domainModelOverlay = document.getElementById("domain-model-overlay");
const domainModelRulesList = document.getElementById("domain-model-rules-list");
const domainModelActionsList = document.getElementById("domain-model-actions-list");
const domainModelRulesLabel = document.getElementById("domain-model-rules-label");
const domainModelActionsLabel = document.getElementById("domain-model-actions-label");
const domainModelRulesFilter = document.getElementById("domain-model-rules-filter");
const domainModelActionsFilter = document.getElementById("domain-model-actions-filter");
const domainModelAddRuleBtn = document.getElementById("domain-model-add-rule");
const domainModelAddActionBtn = document.getElementById("domain-model-add-action");
const domainModelSaveBtn = document.getElementById("domain-model-save");
const domainModelCancelBtn = document.getElementById("domain-model-cancel");

let domainModelOpen = false;

// A dozen-plus rules/actions used to have no way to tell how many there
// were short of scrolling to the bottom and counting, and no way to jump
// to one by name short of scrolling and reading every card. This adds
// both: a live "(N)" count appended to each section's label (kept current
// on open, add, remove, and language toggle -- see call sites below), and
// a plain substring/case-insensitive filter over each section's name
// field that shows/hides cards without touching the underlying draft data
// (a hidden card is still saved on Save; the filter is purely a view).
function updateDomainModelCounts() {
  domainModelRulesLabel.textContent = `${t("rulesLabel")} (${domainModelRulesList.children.length})`;
  domainModelActionsLabel.textContent = `${t("actionsLabel")} (${domainModelActionsList.children.length})`;
}

function filterDomainModelCards(listEl, nameSelector, query) {
  const q = query.trim().toLowerCase();
  for (const card of listEl.children) {
    const name = card.querySelector(nameSelector).value.toLowerCase();
    card.style.display = !q || name.includes(q) ? "" : "none";
  }
}

domainModelRulesFilter.addEventListener("input", () =>
  filterDomainModelCards(domainModelRulesList, ".dm-rule-name", domainModelRulesFilter.value));
domainModelActionsFilter.addEventListener("input", () =>
  filterDomainModelCards(domainModelActionsList, ".dm-action-name", domainModelActionsFilter.value));

function genDraftId() { return `draft_${Math.random().toString(36).slice(2, 9)}`; }

function createConditionRow(text) {
  const row = document.createElement("div");
  row.className = "details-row";
  // A textarea, not a single-line input: conditions are free-text
  // sentences (see agent_ontology_spec.md's own worked examples), and a
  // 640px-wide dialog still isn't wide enough to show a full sentence on
  // one line without truncating it — this wraps instead, same as the
  // "Meaning" field already does via .details-textarea.
  const textarea = document.createElement("textarea");
  textarea.className = "dm-rule-condition-input details-textarea";
  textarea.rows = 2;
  textarea.placeholder = t("conditionPlaceholder");
  textarea.value = text || "";
  row.append(textarea, createDetailsRemoveButton(() => row.remove()));
  return row;
}

// Rebuilds every action card's preconditions checkbox list from the rules
// list's *current* DOM state (id + live name-input value) — called after
// anything that can invalidate that option list: opening the dialog,
// adding/removing a rule, or typing in a rule's name. Preserves each
// card's currently-checked values across the rebuild, except on an action
// card's very first population (right after it's created from an existing
// action), where its saved `preconditions` (real rule ids) seed the
// initial selection instead — see createActionCard()'s own comment.
//
// A checkbox list, not a <select multiple>: the old native multi-select
// required holding Ctrl/Cmd while clicking to select more than one option
// -- an interaction with no on-screen hint of its own beyond a text label
// next to the field, no touch equivalent, and no visible "this one's
// selected" state beyond a subtle highlight inside a cramped, fixed-height
// scroll box. A plain checked/unchecked checkbox per rule is discoverable
// and touch-friendly with no modifier key, and reads correctly at a glance.
function refreshActionPreconditionOptions() {
  const ruleOptions = [...domainModelRulesList.children].map((card) => ({
    value: card.dataset.ruleId,
    label: card.querySelector(".dm-rule-name").value.trim() || t("untitledRulePlaceholder"),
  }));
  for (const actionCard of domainModelActionsList.children) {
    const container = actionCard.querySelector(".dm-action-preconditions");
    let selectedValues;
    if (actionCard.dataset.pendingPreconditions !== undefined) {
      selectedValues = new Set(JSON.parse(actionCard.dataset.pendingPreconditions));
      delete actionCard.dataset.pendingPreconditions;
    } else {
      selectedValues = new Set(
        [...container.querySelectorAll(".dm-precondition-checkbox:checked")].map((cb) => cb.value),
      );
    }
    container.textContent = "";
    if (ruleOptions.length === 0) {
      const empty = document.createElement("span");
      empty.className = "dm-preconditions-empty";
      empty.textContent = t("noRulesYet");
      container.appendChild(empty);
      continue;
    }
    for (const { value, label } of ruleOptions) {
      const optionLabel = document.createElement("label");
      optionLabel.className = "dm-precondition-option";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "dm-precondition-checkbox";
      checkbox.value = value;
      checkbox.checked = selectedValues.has(value);
      const text = document.createElement("span");
      text.textContent = label;
      optionLabel.append(checkbox, text);
      container.appendChild(optionLabel);
    }
  }
}

// A small persistent label above a rule/action card's sub-field — unlike
// the field's own placeholder text, this stays visible once the field is
// filled in, so e.g. a filled-in Effect input and a filled-in Verification
// input (both plain text boxes) stay distinguishable at a glance.
// Takes a STRINGS *key*, not pre-translated text — unlike most of this
// dialog's other one-off labels, rule/action cards can stay open across a
// language toggle (the dialog itself isn't modal-exclusive with the toolbar
// language button), and applyLanguage() only refreshes *static*, always-
// present elements (see its own comment). Tagging the key here lets
// applyLanguage() retranslate every currently-rendered sublabel generically,
// instead of every already-open card silently keeping its stale-language text.
function createSublabel(key) {
  const label = document.createElement("span");
  label.className = "details-field-sublabel";
  label.dataset.i18nKey = key;
  label.textContent = t(key);
  return label;
}

// Hover tooltip mirroring a single-line input's own current value. Rule
// and action names are the one field left as a single-line <input> in
// this dialog after the free-text fields above became textareas (names
// are short identifiers by convention) -- but a long one can still
// overflow the input's width, and this is the fallback for reading it
// without clicking in and scrolling the cursor through it.
function bindTitleTooltip(input) {
  const sync = () => { input.title = input.value; };
  sync();
  input.addEventListener("input", sync);
}

function createRuleCard(rule) {
  const card = document.createElement("div");
  card.className = "domain-model-rule-card";
  card.dataset.ruleId = rule ? rule.id : genDraftId();

  const topRow = document.createElement("div");
  topRow.className = "details-property-row-top";
  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.className = "dm-rule-name";
  nameInput.placeholder = t("ruleNamePlaceholder");
  nameInput.value = rule ? rule.name : "";
  bindTitleTooltip(nameInput);
  nameInput.addEventListener("input", refreshActionPreconditionOptions);
  topRow.append(nameInput, createDetailsRemoveButton(() => { card.remove(); refreshActionPreconditionOptions(); updateDomainModelCounts(); }));

  const conditionsList = document.createElement("div");
  conditionsList.className = "dm-rule-conditions details-list";
  for (const cond of (rule ? rule.conditions : [])) conditionsList.appendChild(createConditionRow(cond));

  const addConditionBtn = document.createElement("button");
  addConditionBtn.type = "button";
  addConditionBtn.className = "details-add-btn";
  addConditionBtn.textContent = t("addCondition");
  addConditionBtn.addEventListener("click", () => {
    const row = createConditionRow("");
    conditionsList.appendChild(row);
    row.querySelector("textarea").focus();
  });

  card.append(topRow, createSublabel("conditionsLabel"), conditionsList, addConditionBtn);
  return card;
}

function createActionCard(action) {
  const card = document.createElement("div");
  card.className = "domain-model-action-card";
  card.dataset.actionId = action ? action.id : genDraftId();
  // Seeds the *first* call to refreshActionPreconditionOptions() with this
  // action's saved preconditions (real rule ids) — the options don't exist
  // yet at card-creation time (they're built from sibling rule cards), so
  // the initial selection has to be applied after that first population,
  // not here.
  if (action) card.dataset.pendingPreconditions = JSON.stringify(action.preconditions || []);

  const topRow = document.createElement("div");
  topRow.className = "details-property-row-top";
  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.className = "dm-action-name";
  nameInput.placeholder = t("actionNamePlaceholder");
  nameInput.value = action ? action.name : "";
  bindTitleTooltip(nameInput);
  topRow.append(nameInput, createDetailsRemoveButton(() => { card.remove(); updateDomainModelCounts(); }));

  const classSelect = document.createElement("select");
  classSelect.className = "dm-action-input-class";
  const blankOpt = document.createElement("option");
  blankOpt.value = "";
  blankOpt.textContent = t("noClassSelected");
  classSelect.appendChild(blankOpt);
  // A static snapshot of state.nodes at modal-open time: canvas nodes can't
  // change while this dialog is open (nothing else is interactive), so
  // there's no live-refresh concern here the way there is for rule options.
  for (const n of state.nodes) {
    const opt = document.createElement("option");
    opt.value = n.id;
    opt.textContent = n.label;
    classSelect.appendChild(opt);
  }
  classSelect.value = (action && action.inputClassId) || "";

  const preconditionsList = document.createElement("div");
  preconditionsList.className = "dm-action-preconditions";
  preconditionsList.setAttribute("role", "group");
  // Checkbox rows populated by refreshActionPreconditionOptions(), called
  // by the caller right after this card is appended to the DOM.

  // Free-text sentences, same reasoning as createConditionRow() above --
  // textareas so a full effect/verification sentence is readable without
  // truncating.
  const effectInput = document.createElement("textarea");
  effectInput.className = "dm-action-effect details-textarea";
  effectInput.rows = 2;
  effectInput.placeholder = t("effectPlaceholder");
  effectInput.value = action ? action.effect : "";

  const verificationInput = document.createElement("textarea");
  verificationInput.className = "dm-action-verification details-textarea";
  verificationInput.rows = 2;
  verificationInput.placeholder = t("verificationPlaceholder");
  verificationInput.value = action ? action.verification : "";

  card.append(
    topRow,
    createSublabel("inputClassLabel"), classSelect,
    createSublabel("preconditionsLabel"), preconditionsList,
    createSublabel("effectLabel"), effectInput,
    createSublabel("verificationLabel"), verificationInput,
  );
  return card;
}

function openDomainModelDialog() {
  if (isAnyModalOpen()) return;
  cancelInlineInput();
  domainModelOpen = true;
  domainModelRulesList.textContent = "";
  domainModelActionsList.textContent = "";
  domainModelRulesFilter.value = "";
  domainModelActionsFilter.value = "";
  for (const rule of state.rules) domainModelRulesList.appendChild(createRuleCard(rule));
  for (const action of state.actions) domainModelActionsList.appendChild(createActionCard(action));
  refreshActionPreconditionOptions();
  updateDomainModelCounts();
  domainModelOverlay.style.display = "flex";
}

function closeDomainModelDialog() {
  domainModelOverlay.style.display = "none";
  domainModelOpen = false;
}

function saveDomainModelDialog() {
  const before = snapshotState();
  const draftIdToRealId = new Map();

  const newRules = [...domainModelRulesList.children].map((card) => {
    const draftId = card.dataset.ruleId;
    const realId = draftId.startsWith("draft_") ? genRuleId() : draftId;
    draftIdToRealId.set(draftId, realId);
    const name = card.querySelector(".dm-rule-name").value.trim();
    const conditions = [...card.querySelectorAll(".dm-rule-condition-input")].map((i) => i.value.trim()).filter(Boolean);
    return { id: realId, name, conditions };
  }).filter((r) => r.name); // a nameless rule card isn't saved, same discipline as nameless properties (Phase B)
  const survivingRuleIds = new Set(newRules.map((r) => r.id));

  const newActions = [...domainModelActionsList.children].map((card) => {
    const draftId = card.dataset.actionId;
    const realId = draftId.startsWith("draft_") ? genActionId() : draftId;
    const name = card.querySelector(".dm-action-name").value.trim();
    const inputClassId = card.querySelector(".dm-action-input-class").value || null;
    const preconditions = [...card.querySelectorAll(".dm-action-preconditions .dm-precondition-checkbox:checked")]
      .map((cb) => draftIdToRealId.get(cb.value))
      .filter((id) => id && survivingRuleIds.has(id)); // drops a reference to a rule that got deleted or left nameless in this same save
    const effect = card.querySelector(".dm-action-effect").value.trim();
    const verification = card.querySelector(".dm-action-verification").value.trim();
    return { id: realId, name, inputClassId, preconditions, effect, verification };
  }).filter((a) => a.name);

  const changed = JSON.stringify(newRules) !== JSON.stringify(state.rules) || JSON.stringify(newActions) !== JSON.stringify(state.actions);
  closeDomainModelDialog();
  if (changed) {
    state.rules = newRules;
    state.actions = newActions;
    pushHistory(before, snapshotState());
    markDirty();
  }
}

domainModelAddRuleBtn.addEventListener("click", () => {
  const card = createRuleCard(null);
  domainModelRulesList.appendChild(card);
  refreshActionPreconditionOptions();
  updateDomainModelCounts();
  card.querySelector(".dm-rule-name").focus();
});
domainModelAddActionBtn.addEventListener("click", () => {
  const card = createActionCard(null);
  domainModelActionsList.appendChild(card);
  refreshActionPreconditionOptions();
  updateDomainModelCounts();
  card.querySelector(".dm-action-name").focus();
});
domainModelSaveBtn.addEventListener("click", saveDomainModelDialog);
domainModelCancelBtn.addEventListener("click", () => closeDomainModelDialog());
domainModelOverlay.addEventListener("click", (e) => {
  if (e.target === domainModelOverlay) closeDomainModelDialog(); // click outside the dialog = cancel
});
document.getElementById("btn-domain-model").addEventListener("click", openDomainModelDialog);

// ---------------------------------------------------------------------------
// Primary pointer interaction: pan / node-move / edge-creation-drag, plus a
// long-press-to-delete timer. A separate 'click' listener (below) handles
// tap-based flows (select, Add Node placement, Connect mode taps) since
// those are naturally distinguished from drags by the browser's own
// click-vs-drag movement threshold.
// ---------------------------------------------------------------------------
const MOVE_THRESHOLD = 5; // screen px before a press counts as a drag
const LONG_PRESS_MS = 600;

// setPointerCapture/releasePointerCapture throw NotFoundError if the given
// pointer id isn't currently recognized as active (spec-documented, not
// hypothetical) — a bare call left the rest of a handler's cleanup
// (dragMode/panPointerId resets, pinchStartDist) unreachable whenever that
// happened, which could silently break the very next pinch gesture. Wrapped
// so a capture failure is a no-op rather than a derailed handler.
function safeSetPointerCapture(id) {
  try { canvas.setPointerCapture(id); } catch (err) { /* pointer no longer active — nothing to capture */ }
}
function safeReleasePointerCapture(id) {
  try { canvas.releasePointerCapture(id); } catch (err) { /* already released or never captured — nothing to clean up */ }
}

let panPointerId = null;
let panLast = { x: 0, y: 0 };

let dragMode = null; // 'pan' | 'moveNode' | 'createEdge' | null
let movingNodeId = null;
let moveOffset = { x: 0, y: 0 };
let edgeDragSourceId = null;
let edgeDragCurrentWorld = null;
let dragBeforeSnapshot = null; // captured at drag-start, for moveNode undo steps
let longPressTimer = null;
let pointerDownScreen = null;
let suppressNextClick = false;
// The pointer currently driving pan/moveNode/createEdge. A second
// pointer's own pointerdown must never start an independent second
// interaction through this handler — without this guard, a second touch
// arriving to start a pinch reaches this handler *before* the touch-pinch
// listener below gets a chance to recognize it, and its own hit-test can
// silently reassign dragMode/movingNodeId/panPointerId out from under the
// first pointer's still-active drag, corrupting or losing it entirely
// (see abortActiveDrag()'s doc comment for the concrete failure mode).
let activePointerId = null;

canvas.addEventListener("pointerdown", (e) => {
  if (dragMode !== null && e.pointerId !== activePointerId) return; // an interaction is already owned by another pointer
  if (e.pointerType === "touch" && activeTouches.size >= 2) return; // pinch owns this
  if (e.pointerType === "mouse" && e.button !== 0) return; // primary button only

  if (state.mode !== "idle") return; // addNode/connect: taps handled by 'click'

  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const world = screenToWorld(sx, sy);
  pointerDownScreen = { x: e.clientX, y: e.clientY };

  const handleHit = findNodeHandleAt(world.x, world.y);
  if (handleHit) {
    dragMode = "createEdge";
    activePointerId = e.pointerId;
    edgeDragSourceId = handleHit.node.id;
    edgeDragCurrentWorld = world;
    safeSetPointerCapture(e.pointerId);
    markDirty();
    return;
  }

  const nodeHit = findNodeAt(world.x, world.y);
  if (nodeHit) {
    selectNode(nodeHit.id);
    dragMode = "moveNode";
    activePointerId = e.pointerId;
    movingNodeId = nodeHit.id;
    moveOffset = { x: world.x - nodeHit.x, y: world.y - nodeHit.y };
    dragBeforeSnapshot = snapshotState();
    safeSetPointerCapture(e.pointerId);
    longPressTimer = setTimeout(() => {
      const before = snapshotState();
      deleteNode(nodeHit.id);
      pushHistory(before, snapshotState());
      dragMode = null;
      activePointerId = null;
      movingNodeId = null;
      dragBeforeSnapshot = null;
      longPressTimer = null;
    }, LONG_PRESS_MS);
    markDirty();
    return;
  }

  const edgeHit = findEdgeAt(world.x, world.y);
  if (edgeHit) {
    selectEdge(edgeHit.id);
    longPressTimer = setTimeout(() => {
      const before = snapshotState();
      deleteEdge(edgeHit.id);
      pushHistory(before, snapshotState());
      longPressTimer = null;
    }, LONG_PRESS_MS);
    markDirty();
    return; // no pan/move originates from an edge
  }

  panPointerId = e.pointerId;
  panLast = { x: e.clientX, y: e.clientY };
  safeSetPointerCapture(e.pointerId);
  canvas.classList.add("panning");
  dragMode = "pan";
  activePointerId = e.pointerId;
});

canvas.addEventListener("pointermove", (e) => {
  if (dragMode === "pan") {
    if (e.pointerId !== panPointerId) return;
    const dx = e.clientX - panLast.x, dy = e.clientY - panLast.y;
    panLast = { x: e.clientX, y: e.clientY };
    camera.panX += dx;
    camera.panY += dy;
    markDirty();
    return;
  }

  if (dragMode === "moveNode" || dragMode === "createEdge") {
    if (e.pointerId !== activePointerId) return;
    if (pointerDownScreen && longPressTimer) {
      const moved = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);
      if (moved > MOVE_THRESHOLD) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }
    const rect = canvas.getBoundingClientRect();
    const world = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    if (dragMode === "moveNode") {
      const node = state.nodes.find((n) => n.id === movingNodeId);
      if (node) {
        node.x = world.x - moveOffset.x;
        node.y = world.y - moveOffset.y;
        markDirty();
      }
    } else {
      edgeDragCurrentWorld = world;
      markDirty();
    }
    return;
  }
});

function endPan(e) {
  if (e.pointerId !== panPointerId) return;
  panPointerId = null;
  canvas.classList.remove("panning");
}

canvas.addEventListener("pointerup", (e) => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }

  if (dragMode === "pan") {
    if (e.pointerId !== activePointerId) return;
    // A real pan (movement past the threshold) must not also clear the
    // current selection via the native "click" event the browser still
    // fires after mouseup — without this, panning to look at another part
    // of the graph would silently drop whatever was selected. A plain
    // click with no movement is unaffected and still clears selection via
    // the click handler's fallthrough, exactly as before.
    const moved = pointerDownScreen ? Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y) : 0;
    if (moved > MOVE_THRESHOLD) suppressNextClick = true;
    endPan(e);
    dragMode = null;
    activePointerId = null;
    return;
  }

  if (dragMode === "moveNode") {
    if (e.pointerId !== activePointerId) return;
    const moved = pointerDownScreen ? Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y) : 0;
    if (moved > MOVE_THRESHOLD) {
      suppressNextClick = true;
      if (dragBeforeSnapshot) pushHistory(dragBeforeSnapshot, snapshotState());
    }
    movingNodeId = null;
    dragBeforeSnapshot = null;
    dragMode = null;
    activePointerId = null;
    return;
  }

  if (dragMode === "createEdge") {
    if (e.pointerId !== activePointerId) return;
    const rect = canvas.getBoundingClientRect();
    const world = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    const targetNode = findNodeAt(world.x, world.y);
    suppressNextClick = true;
    const sourceId = edgeDragSourceId;
    edgeDragSourceId = null;
    edgeDragCurrentWorld = null;
    dragMode = null;
    activePointerId = null;
    if (targetNode && targetNode.id !== sourceId) {
      beginAddEdgePrompt(sourceId, targetNode.id, { x: e.clientX, y: e.clientY });
    }
    markDirty();
    return;
  }
});

// A drag interrupted mid-flight — a genuine browser pointercancel, or a
// second touch arriving to start a pinch (see the touch pointerdown
// listener below) — used to just null out dragMode/movingNodeId/etc.
// directly, silently stranding whatever position change had already
// happened: node.x/y stayed mutated, but pushHistory() was never called,
// so the change was both un-undoable and invisible to the next save.
// "Every discrete action = one undo step" (Phase 3) applies here too — an
// interruption commits whatever changed so far, exactly like an ordinary
// drag release would, and is skipped entirely (no empty undo step) if
// nothing actually moved yet.
function commitDragIfChanged() {
  if (!dragBeforeSnapshot) return;
  const after = snapshotState();
  if (JSON.stringify(dragBeforeSnapshot) !== JSON.stringify(after)) pushHistory(dragBeforeSnapshot, after);
}

function abortActiveDrag() {
  // A pending long-press-delete timer must die with the interrupted drag
  // too — otherwise it still fires ~600ms later using its own closed-over
  // node reference, deleting a node the user has already moved on from
  // (e.g. into a pinch gesture) with no warning and no undo step recorded
  // for it.
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  if (dragMode === "moveNode" && movingNodeId) {
    commitDragIfChanged();
  }
  // createEdge has nothing persistent to commit (no edge exists until a
  // target is confirmed) and pan has no undo history at all — both leave
  // no trace once dragMode clears.
  dragMode = null;
  activePointerId = null;
  movingNodeId = null;
  edgeDragSourceId = null;
  edgeDragCurrentWorld = null;
  dragBeforeSnapshot = null;
  markDirty();
}

canvas.addEventListener("pointercancel", (e) => {
  if (dragMode === "pan") endPan(e);
  abortActiveDrag();
});

function beginAddEdgePrompt(sourceId, targetId, screenPos) {
  showInlineInput({
    x: screenPos.x, y: screenPos.y, placeholder: t("relationLabelPlaceholder"),
    onCommit: (text) => {
      const relation = text.trim() || t("defaultRelation");
      const before = snapshotState();
      const edge = createEdge(sourceId, targetId, relation, true);
      pushHistory(before, snapshotState());
      selectEdge(edge.id);
    },
  });
}

function placeNewNodeAt(world, screenPos) {
  showInlineInput({
    x: screenPos.x, y: screenPos.y,
    placeholder: t("nodeLabelPlaceholder"),
    onCommit: (text) => {
      const label = text.trim();
      if (!label) return;
      const before = snapshotState();
      const node = createNode(world.x - DEFAULT_NODE_W / 2, world.y - DEFAULT_NODE_H / 2, label);
      pushHistory(before, snapshotState());
      selectNode(node.id);
    },
  });
}

// ---------------------------------------------------------------------------
// Renaming (out-of-spec, user-requested): double-click an existing node/edge
// on desktop; the floating selection toolbar's rename button (visible for
// both node and edge selections) is the touch-friendly equivalent, since
// there's no reliable double-tap gesture distinct from a fast double-select
// on touch devices. Both reuse the same showInlineInput() pattern as
// creation, pre-filled with the current text — Enter/blur commits, Escape
// cancels. An empty or unchanged submission is a no-op: no history entry,
// matching how an empty label at creation time creates nothing at all.
//
// The anchor position is always derived from the node/edge's own current
// geometry (center for a node, curve midpoint for an edge) — never from
// wherever the triggering click/tap happened to land. A double-click can
// land anywhere inside a (possibly large, post-zoom) node's box, and using
// that raw point made the input pop up far from the node's own rendered
// label, which read as arbitrary/"funky" rather than anchored to anything.
// ---------------------------------------------------------------------------
function beginRenameNodePrompt(nodeId) {
  const node = state.nodes.find((n) => n.id === nodeId);
  if (!node) return;
  const screenPos = worldToScreen(node.x + node.w / 2, node.y + node.h / 2);
  showInlineInput({
