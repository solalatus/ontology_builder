  row.dataset.propId = prop.id || `p_${Math.random().toString(36).slice(2, 9)}`;

  const topRow = document.createElement("div");
  topRow.className = "details-property-row-top";
  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.className = "details-property-name";
  nameInput.placeholder = t("propertyNamePlaceholder");
  nameInput.value = prop.name || "";
  topRow.append(nameInput, createDetailsRemoveButton(() => row.remove()));

  const bottomRow = document.createElement("div");
  bottomRow.className = "details-property-row-bottom";
  const typeSelect = document.createElement("select");
  typeSelect.className = "details-property-type";
  for (const type of PROPERTY_TYPES) {
    const opt = document.createElement("option");
    opt.value = type;
    opt.textContent = t(`propertyType${type[0].toUpperCase()}${type.slice(1)}`);
    typeSelect.appendChild(opt);
  }
  typeSelect.value = prop.type || "text";

  const unitInput = document.createElement("input");
  unitInput.type = "text";
  unitInput.className = "details-property-unit";
  unitInput.placeholder = t("propertyUnitPlaceholder");
  unitInput.value = prop.unit || "";

  const allowedInput = document.createElement("input");
  allowedInput.type = "text";
  allowedInput.className = "details-property-allowed";
  allowedInput.placeholder = t("propertyAllowedPlaceholder");
  allowedInput.value = (prop.allowed || []).join(", ");

  function syncUnitVisibility() {
    unitInput.style.display = typeSelect.value === "number" ? "" : "none";
  }
  typeSelect.addEventListener("change", syncUnitVisibility);
  syncUnitVisibility();

  bottomRow.append(typeSelect, unitInput, allowedInput);
  row.append(topRow, bottomRow);
  return row;
}

function openDetailsDialog(kind, id) {
  if (isAnyModalOpen()) return;
  cancelInlineInput();
  const target = kind === "node" ? state.nodes.find((n) => n.id === id) : state.edges.find((e) => e.id === id);
  if (!target) return;
  detailsEditingTarget = { kind, id };
  updateDetailsTitle();
  detailsMeaningEl.value = target.meaning || "";

  const isNode = kind === "node";
  detailsAliasesSection.style.display = ""; // aliases are shared by both nodes and edges now
  detailsPropertiesSection.style.display = isNode ? "" : "none"; // properties remain node-only
  detailsAliasesList.textContent = "";
  detailsPropertiesList.textContent = "";
  for (const alias of target.aliases) detailsAliasesList.appendChild(createAliasRow(alias));
  if (isNode) {
    for (const prop of target.properties) detailsPropertiesList.appendChild(createPropertyRow(prop));
  }

  detailsOverlay.style.display = "flex";
  detailsMeaningEl.focus();
}

function closeDetailsDialog() {
  detailsOverlay.style.display = "none";
  detailsEditingTarget = null;
}

function collectAliasesFromDom() {
  return [...detailsAliasesList.querySelectorAll(".details-alias-input")]
    .map((input) => input.value.trim())
    .filter(Boolean);
}

function collectPropertiesFromDom() {
  return [...detailsPropertiesList.children]
    .map((row) => {
      const type = row.querySelector(".details-property-type").value;
      const unitRaw = row.querySelector(".details-property-unit").value.trim();
      const allowedRaw = row.querySelector(".details-property-allowed").value.trim();
      return {
        id: row.dataset.propId,
        name: row.querySelector(".details-property-name").value.trim(),
        type,
        unit: type === "number" && unitRaw ? unitRaw : null,
        allowed: allowedRaw ? allowedRaw.split(",").map((s) => s.trim()).filter(Boolean) : null,
      };
    })
    .filter((p) => p.name); // a row added then left nameless (add-then-cancel-typing) isn't saved as a property
}

function saveDetailsDialog() {
  if (!detailsEditingTarget) return;
  const { kind, id } = detailsEditingTarget;
  const target = kind === "node" ? state.nodes.find((n) => n.id === id) : state.edges.find((e) => e.id === id);
  if (!target) { closeDetailsDialog(); return; }

  const before = snapshotState();
  const meaning = detailsMeaningEl.value.trim() || null;
  let changed = meaning !== target.meaning;
  target.meaning = meaning;
  const aliases = collectAliasesFromDom();
  if (JSON.stringify(aliases) !== JSON.stringify(target.aliases)) changed = true;
  target.aliases = aliases;
  if (kind === "node") {
    const properties = collectPropertiesFromDom();
    if (JSON.stringify(properties) !== JSON.stringify(target.properties)) changed = true;
    target.properties = properties;
  }
  closeDetailsDialog();
  if (changed) {
    pushHistory(before, snapshotState());
    markDirty();
  }
}

detailsAddAliasBtn.addEventListener("click", () => {
  const row = createAliasRow("");
  detailsAliasesList.appendChild(row);
  row.querySelector("input").focus();
});
detailsAddPropertyBtn.addEventListener("click", () => {
  const row = createPropertyRow({ name: "", type: "text", unit: null, allowed: null });
  detailsPropertiesList.appendChild(row);
  row.querySelector(".details-property-name").focus();
});
detailsSaveBtn.addEventListener("click", saveDetailsDialog);
detailsCancelBtn.addEventListener("click", () => closeDetailsDialog());
detailsOverlay.addEventListener("click", (e) => {
  if (e.target === detailsOverlay) closeDetailsDialog(); // click outside the dialog = cancel
});

// ---------------------------------------------------------------------------
// Agent Ontology (agent_ontology_spec.md §7, Decision #5): Rules/Actions
// manager. Whole-dialog draft-then-commit, same philosophy as the details
// dialog above — every add/remove/edit here happens against DOM elements
// only; state.rules/state.actions are read once on open and written once
// on Save (as a single undo step), never touched while the dialog is open.
//
// New rows (from "+ Add rule"/"+ Add action") don't have a real id yet —
// they get a `draft_`-prefixed placeholder id, good only for this editing
// session, so an action's preconditions <select> can still reference a
// rule added in the same session before either has been saved. Save()
// mints real ids (genRuleId()/genActionId()) only for rows still carrying
// a draft id; existing rows keep their real id untouched, unchanged
// whether or not anything on them was actually edited.
// ---------------------------------------------------------------------------
const domainModelOverlay = document.getElementById("domain-model-overlay");
const domainModelRulesList = document.getElementById("domain-model-rules-list");
const domainModelActionsList = document.getElementById("domain-model-actions-list");
const domainModelAddRuleBtn = document.getElementById("domain-model-add-rule");
const domainModelAddActionBtn = document.getElementById("domain-model-add-action");
const domainModelSaveBtn = document.getElementById("domain-model-save");
const domainModelCancelBtn = document.getElementById("domain-model-cancel");

let domainModelOpen = false;

function genDraftId() { return `draft_${Math.random().toString(36).slice(2, 9)}`; }

function createConditionRow(text) {
  const row = document.createElement("div");
  row.className = "details-row";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "dm-rule-condition-input";
  input.placeholder = t("conditionPlaceholder");
  input.value = text || "";
  row.append(input, createDetailsRemoveButton(() => row.remove()));
  return row;
}

// Rebuilds every action card's preconditions <select> options from the
// rules list's *current* DOM state (id + live name-input value) — called
// after anything that can invalidate that option list: opening the dialog,
// adding/removing a rule, or typing in a rule's name. Preserves each
// select's currently-selected values across the rebuild, except on an
// action card's very first population (right after it's created from an
// existing action), where its saved `preconditions` (real rule ids) seed
// the initial selection instead — see createActionCard()'s own comment.
function refreshActionPreconditionOptions() {
  const ruleOptions = [...domainModelRulesList.children].map((card) => ({
    value: card.dataset.ruleId,
    label: card.querySelector(".dm-rule-name").value.trim() || t("untitledRulePlaceholder"),
  }));
  for (const actionCard of domainModelActionsList.children) {
    const select = actionCard.querySelector(".dm-action-preconditions");
    let selectedValues;
    if (actionCard.dataset.pendingPreconditions !== undefined) {
      selectedValues = new Set(JSON.parse(actionCard.dataset.pendingPreconditions));
      delete actionCard.dataset.pendingPreconditions;
    } else {
      selectedValues = new Set([...select.selectedOptions].map((o) => o.value));
    }
    select.textContent = "";
    for (const { value, label } of ruleOptions) {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label;
      opt.selected = selectedValues.has(value);
      select.appendChild(opt);
    }
  }
}

// A small persistent label above a rule/action card's sub-field — unlike
// the field's own placeholder text, this stays visible once the field is
// filled in, so e.g. a filled-in Effect input and a filled-in Verification
// input (both plain text boxes) stay distinguishable at a glance.
// Takes a STRINGS *key*, not pre-translated text — unlike most of this
// dialog's other one-off labels, rule/action cards can stay open across a
// language toggle (the dialog itself isn't modal-exclusive with the toolbar
// language button), and applyLanguage() only refreshes *static*, always-
// present elements (see its own comment). Tagging the key here lets
// applyLanguage() retranslate every currently-rendered sublabel generically,
// instead of every already-open card silently keeping its stale-language text.
function createSublabel(key) {
  const label = document.createElement("span");
  label.className = "details-field-sublabel";
  label.dataset.i18nKey = key;
  label.textContent = t(key);
  return label;
}

function createRuleCard(rule) {
  const card = document.createElement("div");
  card.className = "domain-model-rule-card";
  card.dataset.ruleId = rule ? rule.id : genDraftId();

  const topRow = document.createElement("div");
  topRow.className = "details-property-row-top";
  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.className = "dm-rule-name";
  nameInput.placeholder = t("ruleNamePlaceholder");
  nameInput.value = rule ? rule.name : "";
  nameInput.addEventListener("input", refreshActionPreconditionOptions);
  topRow.append(nameInput, createDetailsRemoveButton(() => { card.remove(); refreshActionPreconditionOptions(); }));

  const conditionsList = document.createElement("div");
  conditionsList.className = "dm-rule-conditions details-list";
  for (const cond of (rule ? rule.conditions : [])) conditionsList.appendChild(createConditionRow(cond));

  const addConditionBtn = document.createElement("button");
  addConditionBtn.type = "button";
  addConditionBtn.className = "details-add-btn";
  addConditionBtn.textContent = t("addCondition");
  addConditionBtn.addEventListener("click", () => {
    const row = createConditionRow("");
    conditionsList.appendChild(row);
    row.querySelector("input").focus();
  });

  card.append(topRow, createSublabel("conditionsLabel"), conditionsList, addConditionBtn);
  return card;
}

function createActionCard(action) {
  const card = document.createElement("div");
  card.className = "domain-model-action-card";
  card.dataset.actionId = action ? action.id : genDraftId();
  // Seeds the *first* call to refreshActionPreconditionOptions() with this
  // action's saved preconditions (real rule ids) — the options don't exist
  // yet at card-creation time (they're built from sibling rule cards), so
  // the initial selection has to be applied after that first population,
  // not here.
  if (action) card.dataset.pendingPreconditions = JSON.stringify(action.preconditions || []);

  const topRow = document.createElement("div");
  topRow.className = "details-property-row-top";
  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.className = "dm-action-name";
  nameInput.placeholder = t("actionNamePlaceholder");
  nameInput.value = action ? action.name : "";
  topRow.append(nameInput, createDetailsRemoveButton(() => card.remove()));

  const classSelect = document.createElement("select");
  classSelect.className = "dm-action-input-class";
  const blankOpt = document.createElement("option");
  blankOpt.value = "";
  blankOpt.textContent = t("noClassSelected");
  classSelect.appendChild(blankOpt);
  // A static snapshot of state.nodes at modal-open time: canvas nodes can't
  // change while this dialog is open (nothing else is interactive), so
  // there's no live-refresh concern here the way there is for rule options.
  for (const n of state.nodes) {
    const opt = document.createElement("option");
    opt.value = n.id;
    opt.textContent = n.label;
    classSelect.appendChild(opt);
  }
  classSelect.value = (action && action.inputClassId) || "";

  const preconditionsSelect = document.createElement("select");
  preconditionsSelect.className = "dm-action-preconditions";
  preconditionsSelect.multiple = true;
  // Options populated by refreshActionPreconditionOptions(), called by the
  // caller right after this card is appended to the DOM.

  const effectInput = document.createElement("input");
  effectInput.type = "text";
  effectInput.className = "dm-action-effect";
  effectInput.placeholder = t("effectPlaceholder");
  effectInput.value = action ? action.effect : "";

  const verificationInput = document.createElement("input");
  verificationInput.type = "text";
  verificationInput.className = "dm-action-verification";
  verificationInput.placeholder = t("verificationPlaceholder");
  verificationInput.value = action ? action.verification : "";

  card.append(
    topRow,
    createSublabel("inputClassLabel"), classSelect,
    createSublabel("preconditionsLabel"), preconditionsSelect,
    createSublabel("effectLabel"), effectInput,
    createSublabel("verificationLabel"), verificationInput,
  );
  return card;
}

function openDomainModelDialog() {
  if (isAnyModalOpen()) return;
  cancelInlineInput();
  domainModelOpen = true;
  domainModelRulesList.textContent = "";
  domainModelActionsList.textContent = "";
  for (const rule of state.rules) domainModelRulesList.appendChild(createRuleCard(rule));
  for (const action of state.actions) domainModelActionsList.appendChild(createActionCard(action));
  refreshActionPreconditionOptions();
  domainModelOverlay.style.display = "flex";
}

function closeDomainModelDialog() {
  domainModelOverlay.style.display = "none";
  domainModelOpen = false;
}

function saveDomainModelDialog() {
  const before = snapshotState();
  const draftIdToRealId = new Map();

  const newRules = [...domainModelRulesList.children].map((card) => {
    const draftId = card.dataset.ruleId;
    const realId = draftId.startsWith("draft_") ? genRuleId() : draftId;
    draftIdToRealId.set(draftId, realId);
    const name = card.querySelector(".dm-rule-name").value.trim();
    const conditions = [...card.querySelectorAll(".dm-rule-condition-input")].map((i) => i.value.trim()).filter(Boolean);
    return { id: realId, name, conditions };
  }).filter((r) => r.name); // a nameless rule card isn't saved, same discipline as nameless properties (Phase B)
  const survivingRuleIds = new Set(newRules.map((r) => r.id));

  const newActions = [...domainModelActionsList.children].map((card) => {
    const draftId = card.dataset.actionId;
    const realId = draftId.startsWith("draft_") ? genActionId() : draftId;
    const name = card.querySelector(".dm-action-name").value.trim();
    const inputClassId = card.querySelector(".dm-action-input-class").value || null;
    const preconditions = [...card.querySelector(".dm-action-preconditions").selectedOptions]
      .map((o) => draftIdToRealId.get(o.value))
      .filter((id) => id && survivingRuleIds.has(id)); // drops a reference to a rule that got deleted or left nameless in this same save
    const effect = card.querySelector(".dm-action-effect").value.trim();
    const verification = card.querySelector(".dm-action-verification").value.trim();
    return { id: realId, name, inputClassId, preconditions, effect, verification };
  }).filter((a) => a.name);

  const changed = JSON.stringify(newRules) !== JSON.stringify(state.rules) || JSON.stringify(newActions) !== JSON.stringify(state.actions);
  closeDomainModelDialog();
  if (changed) {
    state.rules = newRules;
    state.actions = newActions;
    pushHistory(before, snapshotState());
    markDirty();
  }
}

domainModelAddRuleBtn.addEventListener("click", () => {
  const card = createRuleCard(null);
  domainModelRulesList.appendChild(card);
  refreshActionPreconditionOptions();
  card.querySelector(".dm-rule-name").focus();
});
domainModelAddActionBtn.addEventListener("click", () => {
  const card = createActionCard(null);
  domainModelActionsList.appendChild(card);
  refreshActionPreconditionOptions();
  card.querySelector(".dm-action-name").focus();
});
domainModelSaveBtn.addEventListener("click", saveDomainModelDialog);
domainModelCancelBtn.addEventListener("click", () => closeDomainModelDialog());
domainModelOverlay.addEventListener("click", (e) => {
  if (e.target === domainModelOverlay) closeDomainModelDialog(); // click outside the dialog = cancel
});
document.getElementById("btn-domain-model").addEventListener("click", openDomainModelDialog);

// ---------------------------------------------------------------------------
// Primary pointer interaction: pan / node-move / edge-creation-drag, plus a
// long-press-to-delete timer. A separate 'click' listener (below) handles
// tap-based flows (select, Add Node placement, Connect mode taps) since
// those are naturally distinguished from drags by the browser's own
// click-vs-drag movement threshold.
// ---------------------------------------------------------------------------
const MOVE_THRESHOLD = 5; // screen px before a press counts as a drag
const LONG_PRESS_MS = 600;

// setPointerCapture/releasePointerCapture throw NotFoundError if the given
// pointer id isn't currently recognized as active (spec-documented, not
// hypothetical) — a bare call left the rest of a handler's cleanup
// (dragMode/panPointerId resets, pinchStartDist) unreachable whenever that
// happened, which could silently break the very next pinch gesture. Wrapped
// so a capture failure is a no-op rather than a derailed handler.
function safeSetPointerCapture(id) {
  try { canvas.setPointerCapture(id); } catch (err) { /* pointer no longer active — nothing to capture */ }
}
function safeReleasePointerCapture(id) {
  try { canvas.releasePointerCapture(id); } catch (err) { /* already released or never captured — nothing to clean up */ }
}

let panPointerId = null;
let panLast = { x: 0, y: 0 };

let dragMode = null; // 'pan' | 'moveNode' | 'createEdge' | null
let movingNodeId = null;
let moveOffset = { x: 0, y: 0 };
let edgeDragSourceId = null;
let edgeDragCurrentWorld = null;
let dragBeforeSnapshot = null; // captured at drag-start, for moveNode undo steps
let longPressTimer = null;
let pointerDownScreen = null;
let suppressNextClick = false;
// The pointer currently driving pan/moveNode/createEdge. A second
// pointer's own pointerdown must never start an independent second
// interaction through this handler — without this guard, a second touch
// arriving to start a pinch reaches this handler *before* the touch-pinch
// listener below gets a chance to recognize it, and its own hit-test can
// silently reassign dragMode/movingNodeId/panPointerId out from under the
// first pointer's still-active drag, corrupting or losing it entirely
// (see abortActiveDrag()'s doc comment for the concrete failure mode).
let activePointerId = null;

canvas.addEventListener("pointerdown", (e) => {
  if (dragMode !== null && e.pointerId !== activePointerId) return; // an interaction is already owned by another pointer
  if (e.pointerType === "touch" && activeTouches.size >= 2) return; // pinch owns this
  if (e.pointerType === "mouse" && e.button !== 0) return; // primary button only

  if (state.mode !== "idle") return; // addNode/connect: taps handled by 'click'

  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const world = screenToWorld(sx, sy);
  pointerDownScreen = { x: e.clientX, y: e.clientY };

  const handleHit = findNodeHandleAt(world.x, world.y);
  if (handleHit) {
    dragMode = "createEdge";
    activePointerId = e.pointerId;
    edgeDragSourceId = handleHit.node.id;
    edgeDragCurrentWorld = world;
    safeSetPointerCapture(e.pointerId);
    markDirty();
    return;
  }

  const nodeHit = findNodeAt(world.x, world.y);
  if (nodeHit) {
    selectNode(nodeHit.id);
    dragMode = "moveNode";
    activePointerId = e.pointerId;
    movingNodeId = nodeHit.id;
    moveOffset = { x: world.x - nodeHit.x, y: world.y - nodeHit.y };
    dragBeforeSnapshot = snapshotState();
    safeSetPointerCapture(e.pointerId);
    longPressTimer = setTimeout(() => {
      const before = snapshotState();
      deleteNode(nodeHit.id);
      pushHistory(before, snapshotState());
      dragMode = null;
      activePointerId = null;
      movingNodeId = null;
      dragBeforeSnapshot = null;
      longPressTimer = null;
    }, LONG_PRESS_MS);
    markDirty();
    return;
  }

  const edgeHit = findEdgeAt(world.x, world.y);
  if (edgeHit) {
    selectEdge(edgeHit.id);
    longPressTimer = setTimeout(() => {
      const before = snapshotState();
      deleteEdge(edgeHit.id);
      pushHistory(before, snapshotState());
      longPressTimer = null;
    }, LONG_PRESS_MS);
    markDirty();
    return; // no pan/move originates from an edge
  }

  panPointerId = e.pointerId;
  panLast = { x: e.clientX, y: e.clientY };
  safeSetPointerCapture(e.pointerId);
  canvas.classList.add("panning");
  dragMode = "pan";
  activePointerId = e.pointerId;
});

canvas.addEventListener("pointermove", (e) => {
  if (dragMode === "pan") {
    if (e.pointerId !== panPointerId) return;
    const dx = e.clientX - panLast.x, dy = e.clientY - panLast.y;
    panLast = { x: e.clientX, y: e.clientY };
    camera.panX += dx;
    camera.panY += dy;
    markDirty();
    return;
  }

  if (dragMode === "moveNode" || dragMode === "createEdge") {
    if (e.pointerId !== activePointerId) return;
    if (pointerDownScreen && longPressTimer) {
      const moved = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);
      if (moved > MOVE_THRESHOLD) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }
    const rect = canvas.getBoundingClientRect();
    const world = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    if (dragMode === "moveNode") {
      const node = state.nodes.find((n) => n.id === movingNodeId);
      if (node) {
        node.x = world.x - moveOffset.x;
        node.y = world.y - moveOffset.y;
        markDirty();
      }
    } else {
      edgeDragCurrentWorld = world;
      markDirty();
    }
    return;
  }
});

function endPan(e) {
  if (e.pointerId !== panPointerId) return;
  panPointerId = null;
  canvas.classList.remove("panning");
}

canvas.addEventListener("pointerup", (e) => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }

  if (dragMode === "pan") {
    if (e.pointerId !== activePointerId) return;
    // A real pan (movement past the threshold) must not also clear the
    // current selection via the native "click" event the browser still
    // fires after mouseup — without this, panning to look at another part
    // of the graph would silently drop whatever was selected. A plain
    // click with no movement is unaffected and still clears selection via
    // the click handler's fallthrough, exactly as before.
    const moved = pointerDownScreen ? Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y) : 0;
    if (moved > MOVE_THRESHOLD) suppressNextClick = true;
    endPan(e);
    dragMode = null;
    activePointerId = null;
    return;
  }

  if (dragMode === "moveNode") {
    if (e.pointerId !== activePointerId) return;
    const moved = pointerDownScreen ? Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y) : 0;
    if (moved > MOVE_THRESHOLD) {
      suppressNextClick = true;
      if (dragBeforeSnapshot) pushHistory(dragBeforeSnapshot, snapshotState());
    }
    movingNodeId = null;
    dragBeforeSnapshot = null;
    dragMode = null;
    activePointerId = null;
    return;
  }

  if (dragMode === "createEdge") {
    if (e.pointerId !== activePointerId) return;
    const rect = canvas.getBoundingClientRect();
    const world = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    const targetNode = findNodeAt(world.x, world.y);
    suppressNextClick = true;
    const sourceId = edgeDragSourceId;
    edgeDragSourceId = null;
    edgeDragCurrentWorld = null;
    dragMode = null;
    activePointerId = null;
    if (targetNode && targetNode.id !== sourceId) {
      beginAddEdgePrompt(sourceId, targetNode.id, { x: e.clientX, y: e.clientY });
    }
    markDirty();
    return;
  }
});

// A drag interrupted mid-flight — a genuine browser pointercancel, or a
// second touch arriving to start a pinch (see the touch pointerdown
// listener below) — used to just null out dragMode/movingNodeId/etc.
// directly, silently stranding whatever position change had already
// happened: node.x/y stayed mutated, but pushHistory() was never called,
// so the change was both un-undoable and invisible to the next save.
// "Every discrete action = one undo step" (Phase 3) applies here too — an
// interruption commits whatever changed so far, exactly like an ordinary
// drag release would, and is skipped entirely (no empty undo step) if
// nothing actually moved yet.
function commitDragIfChanged() {
  if (!dragBeforeSnapshot) return;
  const after = snapshotState();
  if (JSON.stringify(dragBeforeSnapshot) !== JSON.stringify(after)) pushHistory(dragBeforeSnapshot, after);
}

function abortActiveDrag() {
  // A pending long-press-delete timer must die with the interrupted drag
  // too — otherwise it still fires ~600ms later using its own closed-over
  // node reference, deleting a node the user has already moved on from
  // (e.g. into a pinch gesture) with no warning and no undo step recorded
  // for it.
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  if (dragMode === "moveNode" && movingNodeId) {
    commitDragIfChanged();
  }
  // createEdge has nothing persistent to commit (no edge exists until a
  // target is confirmed) and pan has no undo history at all — both leave
  // no trace once dragMode clears.
  dragMode = null;
  activePointerId = null;
  movingNodeId = null;
  edgeDragSourceId = null;
  edgeDragCurrentWorld = null;
  dragBeforeSnapshot = null;
  markDirty();
}

canvas.addEventListener("pointercancel", (e) => {
  if (dragMode === "pan") endPan(e);
  abortActiveDrag();
});

function beginAddEdgePrompt(sourceId, targetId, screenPos) {
  showInlineInput({
    x: screenPos.x, y: screenPos.y, placeholder: t("relationLabelPlaceholder"),
    onCommit: (text) => {
      const relation = text.trim() || t("defaultRelation");
      const before = snapshotState();
      const edge = createEdge(sourceId, targetId, relation, true);
      pushHistory(before, snapshotState());
      selectEdge(edge.id);
    },
  });
}

function placeNewNodeAt(world, screenPos) {
  showInlineInput({
    x: screenPos.x, y: screenPos.y,
    placeholder: t("nodeLabelPlaceholder"),
    onCommit: (text) => {
      const label = text.trim();
      if (!label) return;
      const before = snapshotState();
      const node = createNode(world.x - DEFAULT_NODE_W / 2, world.y - DEFAULT_NODE_H / 2, label);
      pushHistory(before, snapshotState());
      selectNode(node.id);
    },
  });
}

// ---------------------------------------------------------------------------
// Renaming (out-of-spec, user-requested): double-click an existing node/edge
// on desktop; the floating selection toolbar's rename button (visible for
// both node and edge selections) is the touch-friendly equivalent, since
// there's no reliable double-tap gesture distinct from a fast double-select
// on touch devices. Both reuse the same showInlineInput() pattern as
// creation, pre-filled with the current text — Enter/blur commits, Escape
// cancels. An empty or unchanged submission is a no-op: no history entry,
// matching how an empty label at creation time creates nothing at all.
//
// The anchor position is always derived from the node/edge's own current
// geometry (center for a node, curve midpoint for an edge) — never from
// wherever the triggering click/tap happened to land. A double-click can
// land anywhere inside a (possibly large, post-zoom) node's box, and using
// that raw point made the input pop up far from the node's own rendered
// label, which read as arbitrary/"funky" rather than anchored to anything.
// ---------------------------------------------------------------------------
function beginRenameNodePrompt(nodeId) {
  const node = state.nodes.find((n) => n.id === nodeId);
  if (!node) return;
  const screenPos = worldToScreen(node.x + node.w / 2, node.y + node.h / 2);
  showInlineInput({
    x: screenPos.x, y: screenPos.y, value: node.label,
    placeholder: t("nodeLabelPlaceholder"),
    onCommit: (text) => {
      const label = text.trim();
      if (!label || label === node.label) return;
      const before = snapshotState();
      node.label = label;
      pushHistory(before, snapshotState());
      markDirty();
    },
  });
}

function beginRenameEdgePrompt(edgeId) {
  const edge = state.edges.find((e) => e.id === edgeId);
  if (!edge) return;
  const geo = edgeGeometry(edge, computeEdgeBendInfo());
  if (!geo) return;
  const screenPos = worldToScreen(geo.mid.x, geo.mid.y);
  showInlineInput({
    x: screenPos.x, y: screenPos.y, value: edge.relation, placeholder: t("relationLabelPlaceholder"),
    onCommit: (text) => {
      const relation = text.trim();
      if (!relation || relation === edge.relation) return;
      const before = snapshotState();
      edge.relation = relation;
      pushHistory(before, snapshotState());
      markDirty();
    },
  });
}

function renameSelected() {
  if (state.selection.type === "node") {
    beginRenameNodePrompt(state.selection.id);
  } else if (state.selection.type === "edge") {
    beginRenameEdgePrompt(state.selection.id);
  }
}

function handleConnectTap(hitNode, screenPos) {
  if (!hitNode) {
    state.connectSource = null;
    clearSelection();
    return;
  }
  if (!state.connectSource) {
    state.connectSource = hitNode.id;
    selectNode(hitNode.id);
    return;
  }
  if (state.connectSource === hitNode.id) {
    state.connectSource = null;
    clearSelection();
    return;
  }
  const sourceId = state.connectSource;
  state.connectSource = null;
  beginAddEdgePrompt(sourceId, hitNode.id, screenPos);
}

canvas.addEventListener("click", (e) => {
  if (suppressNextClick) { suppressNextClick = false; return; }

  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const world = screenToWorld(sx, sy);

  if (state.mode === "addNode") {
    placeNewNodeAt(world, { x: e.clientX, y: e.clientY });
    setMode("idle");
    return;
  }

  const nodeHit = findNodeAt(world.x, world.y);

  if (state.mode === "connect") {
    handleConnectTap(nodeHit, { x: e.clientX, y: e.clientY });
    return;
  }

  if (nodeHit) { selectNode(nodeHit.id); return; }
  const edgeHit = findEdgeAt(world.x, world.y);
  if (edgeHit) { selectEdge(edgeHit.id); return; }
  clearSelection();
});

canvas.addEventListener("dblclick", (e) => {
  const rect = canvas.getBoundingClientRect();
  const world = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
  const screenPos = { x: e.clientX, y: e.clientY };

  const nodeHit = findNodeAt(world.x, world.y);
  if (nodeHit) { beginRenameNodePrompt(nodeHit.id); return; }
  const edgeHit = findEdgeAt(world.x, world.y);
  if (edgeHit) { beginRenameEdgePrompt(edgeHit.id); return; }

  placeNewNodeAt(world, screenPos);
});

window.addEventListener("keydown", (e) => {
  if (activeConfirm) {
    if (e.key === "Escape") { e.preventDefault(); closeConfirmDialog(false); }
    else if (e.key === "Enter") { e.preventDefault(); closeConfirmDialog(true); }
    return;
  }
  // No Enter-to-save here, unlike activeConfirm above: the meaning field is
  // a textarea (Enter should insert a newline) and Enter while typing an
  // alias/property name is ordinary text editing, not a submit gesture.
  // Escape-to-cancel only. This also guards Delete/Backspace below from
  // deleting the canvas selection while the user is editing dialog text.
  if (detailsEditingTarget) {
    if (e.key === "Escape") { e.preventDefault(); closeDetailsDialog(); }
    return;
  }
  if (domainModelOpen) {
    if (e.key === "Escape") { e.preventDefault(); closeDomainModelDialog(); }
    return;
  }
  if (activeInlineEditor) return; // don't hijack while typing
  if (e.key === "Escape") {
    if (state.mode !== "idle") setMode("idle");
    if (state.connectSource) { state.connectSource = null; markDirty(); }
    return;
  }
  if ((e.key === "Delete" || e.key === "Backspace") && state.selection.id) {
    e.preventDefault();
    const before = snapshotState();
    if (state.selection.type === "node") deleteNode(state.selection.id);
    else if (state.selection.type === "edge") deleteEdge(state.selection.id);
    pushHistory(before, snapshotState());
  }
});

selRenameBtn.addEventListener("click", () => renameSelected());

selDetailsBtn.addEventListener("click", () => {
  if (!state.selection.type) return;
  openDetailsDialog(state.selection.type, state.selection.id);
});

selTrashBtn.addEventListener("click", () => {
  if (!state.selection.type) return;
  const before = snapshotState();
  if (state.selection.type === "node") deleteNode(state.selection.id);
  else if (state.selection.type === "edge") deleteEdge(state.selection.id);
  pushHistory(before, snapshotState());
});

selToggleDirBtn.addEventListener("click", () => {
  if (state.selection.type !== "edge") return;
  const edge = state.edges.find((x) => x.id === state.selection.id);
  if (!edge) return;
  const before = snapshotState();
  edge.directed = !edge.directed;
  pushHistory(before, snapshotState());
  markDirty();
});

// ---------------------------------------------------------------------------
// Zoom — wheel/ctrl+wheel (desktop) and pinch (touch)
// ---------------------------------------------------------------------------
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const factor = Math.pow(1.0015, -e.deltaY);
  zoomAt(sx, sy, factor);
}, { passive: false });

const activeTouches = new Map(); // pointerId -> {x,y}
let pinchStartDist = null;

canvas.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch") return;
  activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activeTouches.size === 2) {
    if (panPointerId !== null) {
      safeReleasePointerCapture(panPointerId);
      panPointerId = null;
      canvas.classList.remove("panning");
    }
    abortActiveDrag(); // a pinch starting cancels any node-move/edge-drag too, committing whatever already changed
    const pts = [...activeTouches.values()];
    pinchStartDist = distance(pts[0], pts[1]);
  }
});

canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "touch" || !activeTouches.has(e.pointerId)) return;
  activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activeTouches.size === 2 && pinchStartDist) {
    const pts = [...activeTouches.values()];
    const dist = distance(pts[0], pts[1]);
    const mid = midpoint(pts[0], pts[1]);
    const rect = canvas.getBoundingClientRect();
    const factor = dist / pinchStartDist;
    zoomAt(mid.x - rect.left, mid.y - rect.top, factor);
    pinchStartDist = dist;
  }
});

function endTouch(e) {
  if (e.pointerType !== "touch") return;
  activeTouches.delete(e.pointerId);
  if (activeTouches.size < 2) pinchStartDist = null;
}
canvas.addEventListener("pointerup", endTouch);
canvas.addEventListener("pointercancel", endTouch);

function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function midpoint(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

// ---------------------------------------------------------------------------
// File formats — export (Section 5.1, 5.2, 5.4). "Save Version" always
// writes both a JSON (canonical, full-fidelity) and a TXT (structure-only
// edge list) file together, via a plain <a download> — the universal Tier 3
// path per Section 3.1's capability matrix (Tier 2's native save dialog is
// Phase 7, a progressive enhancement on top of this, not a replacement).
// ---------------------------------------------------------------------------
function isoTimestampSeconds(date = new Date()) {
  return date.toISOString().replace(/\.\d{3}Z$/, "Z"); // "2026-07-25T14:20:00Z", no ms
}

// "2026-07-25T14:20:00Z" -> "2026-07-25T1420Z" (Section 5.4's filename form —
// no colons/seconds, since colons aren't filename-safe on some filesystems).
function filenameTimestamp(iso) {
  const [datePart, timePart] = iso.split("T");
  return `${datePart}T${timePart.slice(0, 5).replace(":", "")}Z`;
}

// Spec doesn't define graph-name rules (see TODO.md's Open Questions); kept
// conservative since it lands directly in a filename on every platform.
function sanitizeGraphName(raw) {
  const cleaned = raw.trim().replace(/\s+/g, "-").replace(/[^A-Za-z0-9_-]/g, "");
  return cleaned || "graph";
}

function buildJsonExport(savedAt) {
  return {
    meta: {
      format_version: state.meta.format_version,
      graph_id: state.meta.graph_id,
      version: state.meta.version,
      created: state.meta.created,
      saved: savedAt,
    },
    nodes: state.nodes.map((n) => ({
      id: n.id, label: n.label,
      x: n.x, y: n.y, w: n.w, h: n.h,
      // Agent Ontology (agent_ontology_spec.md §4.1) — meaning replaces
      // the old, never-wired notes field; aliases/properties are new.
      meaning: n.meaning,
      aliases: [...n.aliases],
      properties: n.properties.map((p) => ({ ...p })),
    })),
    edges: state.edges.map((e) => ({
      id: e.id, source: e.source, target: e.target,
      relation: e.relation, directed: e.directed,
      meaning: e.meaning, // agent_ontology_spec.md §4.2
      aliases: [...(e.aliases || [])],
    })),
    // agent_ontology_spec.md §4.3 — additive top-level collections, empty
    // arrays when nothing's been authored yet.
    rules: state.rules.map((r) => ({ ...r, conditions: [...r.conditions] })),
    actions: state.actions.map((a) => ({ ...a, preconditions: [...a.preconditions] })),
  };
}

function buildTxtExport(savedAt) {
  const lines = [
    "# KG Canvas export",
    `# format_version: ${state.meta.format_version}`,
    `# graph_id: ${state.meta.graph_id}`,
    `# version: ${state.meta.version}`,
    `# saved: ${savedAt}`,
    "",
    "## NODES",
  ];
  for (const n of state.nodes) lines.push(n.label);
  lines.push("", "## EDGES");
  for (const e of state.edges) {
    const src = state.nodes.find((n) => n.id === e.source);
    const tgt = state.nodes.find((n) => n.id === e.target);
    if (!src || !tgt) continue; // shouldn't happen — deleteNode() always cleans up edges
    const arrow = e.directed ? "->" : "<->";
    lines.push(`${src.label} ${arrow} ${tgt.label} : ${e.relation}`);
  }
  return lines.join("\n") + "\n";
}

// ---------------------------------------------------------------------------
// Domain Model YAML export (agent_ontology_spec.md §5) — a third file
// bundled into "Save Version" alongside the JSON/TXT above. Hand-written,
// block-style-only YAML serializer (no anchors/tags/flow-style at all,
// consistent with the project's zero-external-dependency constraint) plus a
// builder that reshapes canvas state into the howto's classes/relationships/
// rules/actions structure.
// ---------------------------------------------------------------------------

// A plain scalar is only emitted unquoted when it's unambiguous under YAML's
// plain-scalar grammar in both block and (defensively) flow contexts; every
// indicator character, a leading/trailing space, and reserved literals force
// a double-quoted, backslash-escaped form instead.
function yamlScalar(value) {
  if (value === null || value === undefined) return "null";
  if (typeof value === "boolean" || typeof value === "number") return String(value);
  const s = String(value);
  const RESERVED = /^(true|false|null|yes|no|on|off|~)$/i;
  const NUMERIC = /^[-+]?(\d+\.?\d*|\.\d+)$/;
  const plainSafe = s.length > 0
    && !/^\s|\s$/.test(s)
    && !/[:#,[\]{}"'&*!|>%@`\n\t\r]/.test(s)
    && !RESERVED.test(s) && !NUMERIC.test(s);
  if (plainSafe) return s;
  const escaped = s
    .replace(/\\/g, "\\\\")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n")
    .replace(/\t/g, "\\t")
    .replace(/\r/g, "\\r");
  return `"${escaped}"`;
}

// Serializes a plain value (nested plain objects/arrays/scalars only — no
// class instances, no undefined) into an array of YAML lines at the given
// indent depth. An empty array/object renders as the inline `[]`/`{}` token
// — the only concession to flow syntax, since block style has no other way
// to represent "zero items" (see agent_ontology_spec.md §5).
function yamlLines(value, indent) {
  const pad = "  ".repeat(indent);
  if (Array.isArray(value)) {
    if (value.length === 0) return [`${pad}[]`];
    const lines = [];
    for (const item of value) {
      if (item !== null && typeof item === "object") {
        const itemLines = yamlLines(item, indent + 1);
        lines.push(`${pad}- ${itemLines[0].trim()}`, ...itemLines.slice(1));
      } else {
        lines.push(`${pad}- ${yamlScalar(item)}`);
      }
    }
    return lines;
  }
  if (value !== null && typeof value === "object") {
    const keys = Object.keys(value);
    if (keys.length === 0) return [`${pad}{}`];
    const lines = [];
    for (const key of keys) {
      const v = value[key];
      const isEmptyCollection = v !== null && typeof v === "object"
        && (Array.isArray(v) ? v.length === 0 : Object.keys(v).length === 0);
      if (v !== null && typeof v === "object" && !isEmptyCollection) {
        lines.push(`${pad}${yamlScalar(key)}:`, ...yamlLines(v, indent + 1));
      } else if (isEmptyCollection) {
        lines.push(`${pad}${yamlScalar(key)}: ${Array.isArray(v) ? "[]" : "{}"}`);
      } else {
        lines.push(`${pad}${yamlScalar(key)}: ${yamlScalar(v)}`);
      }
    }
    return lines;
  }
  return [`${pad}${yamlScalar(value)}`];
}

function toYaml(rootObject) {
  return yamlLines(rootObject, 0).join("\n") + "\n";
}

// "issued by" -> "issuedBy"; unicode-letter-aware word splitting (not just
// A-Za-z) so accented labels don't get silently mangled. Falls back to a
// fixed name for the (practically unreachable — beginAddEdgePrompt() always
// defaults a blank relation to t("defaultRelation")) case of no word
// characters at all.
//
// Idempotent by construction (toCamelCaseId(toCamelCaseId(x)) === toCamelCaseId(x)
// for realistic input): a lowercase-then-uppercase boundary is treated as a
// word break too, not just non-letter/digit separators, so re-deriving from
// an already-camelCase string (e.g. a relation label Phase G's importer
// already normalized on a prior round trip) doesn't get flattened into one
// giant lowercased word on the next pass — see agent_ontology_todo.md's
// Phase G Log entry for the bug this fixes (a re-import wrongly seeing its
// own previously-normalized edge as a non-match and duplicating it).
//
// Known, accepted limitation: two or more consecutive uppercase letters
// (e.g. a name with back-to-back single-letter words, "isAKindOf") have no
// internal lowercase-then-uppercase boundary for the regex above to find,
// so a second pass through this function can lowercase part of that run
// that a from-scratch derivation would have capitalized ("isAKindOf" ->
// "isAkindOf" on re-derivation). This never affects a *first* derivation
// from a human-typed relation label (the case every real caller hits), and
// the result is still stable after that one lossy step — re-deriving a
// third time reproduces the second result exactly — so it can't cause the
// re-import duplicate-edge bug above; it's pinned by a test precisely so a
// future change can't silently make it worse without a test failing.
function toCamelCaseId(text) {
  const spaced = String(text).replace(/([\p{Ll}\p{N}])(\p{Lu})/gu, "$1 $2");
  const words = spaced.trim().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  if (words.length === 0) return "relationship";
  return words
    .map((w, i) => (i === 0 ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()))
    .join("");
}

// Reshapes canvas state into agent_ontology_spec.md §5's structure. Classes/
// rules/actions are keyed by label/name exactly as typed (last-write-wins on
// a same-key collision — same as the existing JSON export's ids-by-reference
// approach, not specially disambiguated, since only the relationships
// collision case was ever flagged as needing one — see Decision Log #9).
// relationships is a **list**, not a name-keyed map (Decision Log #9,
// resolving Open Question 3) — sidesteps the collision problem outright.
// classes/rules/actions are name/label-keyed maps in the export (unlike
// relationships, kept as a list specifically so two same-derived-name edges
// both survive — see the test right below this comment's sibling in
// tests/agent-ontology-phase-f.spec.mjs). Two nodes/rules/actions can
// perfectly well share a label/name in the live graph (nothing in the UI
// enforces uniqueness), which used to mean the second silently overwrote
// the first's entire entry on export — one whole class/rule/action
// vanishing with no warning. Deterministic, first-occurrence-wins:
// resolves every item to a name that's unique *within this export*,
// appending a numeric suffix on a collision, so nothing is ever dropped.
// Returns a Map from item.id to its resolved export name, used both for
// this map's own keys and by anything elsewhere in the export that
// references the same item by name (relationship endpoints, action inputs/
// preconditions) — so a renamed-on-collision item stays referentially
// consistent throughout the file, not just correct in isolation.
function assignUniqueExportNames(items, getName) {
  const taken = new Set();
  const idToName = new Map();
  for (const item of items) {
    const base = getName(item) || "";
    let candidate = base;
    let suffix = 2;
    while (taken.has(candidate)) {
      candidate = `${base}_${suffix}`;
      suffix++;
    }
    taken.add(candidate);
    idToName.set(item.id, candidate);
  }
  return idToName;
}

function buildDomainModel() {
  const nodeNameById = assignUniqueExportNames(state.nodes, (n) => n.label);
  const ruleNameById = assignUniqueExportNames(state.rules, (r) => r.name);
  const actionNameById = assignUniqueExportNames(state.actions, (a) => a.name);

  const classes = {};
  for (const n of state.nodes) {
    const properties = {};
    for (const p of n.properties) {
      const prop = { type: p.type };
      if (p.unit) prop.unit = p.unit;
      if (p.allowed && p.allowed.length > 0) prop.allowed = [...p.allowed];
      properties[p.name] = prop;
    }
    classes[nodeNameById.get(n.id)] = { meaning: n.meaning, aliases: [...n.aliases], properties };
  }

  const relationships = state.edges.map((e) => {
    const src = state.nodes.find((n) => n.id === e.source);
    const tgt = state.nodes.find((n) => n.id === e.target);
    return {
      name: toCamelCaseId(e.relation),
      from: src ? nodeNameById.get(src.id) : null,
      to: tgt ? nodeNameById.get(tgt.id) : null,
      meaning: e.meaning,
      aliases: [...(e.aliases || [])],
    };
  });

  const rules = {};
  for (const r of state.rules) rules[ruleNameById.get(r.id)] = { conditions: [...r.conditions] };

  const actions = {};
  for (const a of state.actions) {
    const inputNode = state.nodes.find((n) => n.id === a.inputClassId);
    const preconditionNames = a.preconditions
      .map((ruleId) => ruleNameById.get(ruleId))
      .filter(Boolean);
    actions[actionNameById.get(a.id)] = {
      input: inputNode ? nodeNameById.get(inputNode.id) : null,
      preconditions: preconditionNames,
      effect: a.effect,
      verification: a.verification,
    };
  }

  return { classes, relationships, rules, actions };
}

function buildDomainYamlExport() {
  return toYaml(buildDomainModel());
}

function triggerDownload(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------------------------------------------------------------------------
// Tier 2 storage (Section 3.2, progressive enhancement): once a folder is
// granted via showDirectoryPicker, explicit saves write silently into it —
// no further prompts, no browser download — instead of Tier 3's <a download>.
// Chrome/Windows + Chromium/Linux only (Section 3.1); Brave and Android
// don't expose the API at all, so feature-detection alone keeps the opt-in
// hidden there — no separate platform check needed.
// Session-scoped only: the granted handle isn't persisted across a reload
// (the File System Access API supports storing a handle for later re-grant
// via IndexedDB, but spec only requires "no further prompts" once granted,
// not that the grant itself survives a full reload — treated as a possible
// future enhancement, not a gap against what's specified).
// ---------------------------------------------------------------------------
let tier2DirHandle = null;

function updateFolderSyncButton() {
  const btn = document.getElementById("btn-folder-sync");
  if (!btn) return;
  if (tier2DirHandle) {
    btn.textContent = t("folderSynced", tier2DirHandle.name);
    btn.setAttribute("aria-pressed", "true");
  } else {
    btn.textContent = t("folderSync");
    btn.setAttribute("aria-pressed", "false");
  }
}

async function connectFolderSync() {
  try {
    const handle = await window.showDirectoryPicker({ mode: "readwrite" });
    tier2DirHandle = handle;
    updateFolderSyncButton();
  } catch (err) {
    if (!err || err.name !== "AbortError") console.warn("[KG Canvas] Folder Sync grant failed:", err);
  }
}

async function writeFileToFolder(dirHandle, filename, content) {
  const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(content);
  await writable.close();
}

// Test/debug hook: lets tests await the in-flight save (folder write or
// download trigger) rather than guessing timing — same pattern as
// storage.whenIdle() in Phase 4.
let pendingSaveVersion = Promise.resolve();
function waitForSaveVersion() { return pendingSaveVersion; }

function performSaveVersion() {
  if (!state.meta) {
    state.meta = {
      format_version: 1,
      graph_id: crypto.randomUUID(),
      version: 0,
      created: isoTimestampSeconds(),
    };
  }
  state.meta.version += 1;
  const savedAt = isoTimestampSeconds();
  state.meta.saved = savedAt;
  const base = `${sanitizeGraphName(state.graphName)}_v${String(state.meta.version).padStart(4, "0")}_${filenameTimestamp(savedAt)}`;
  const jsonContent = JSON.stringify(buildJsonExport(savedAt), null, 2);
  const txtContent = buildTxtExport(savedAt);
  const yamlContent = buildDomainYamlExport(); // agent_ontology_spec.md §5

  if (tier2DirHandle) {
    pendingSaveVersion = Promise.all([
      writeFileToFolder(tier2DirHandle, `${base}.json`, jsonContent),
      writeFileToFolder(tier2DirHandle, `${base}.txt`, txtContent),
      writeFileToFolder(tier2DirHandle, `${base}.domain.yaml`, yamlContent),
    ]).catch((err) => {
      console.warn("[KG Canvas] Folder Sync write failed, falling back to download:", err);
      triggerDownload(`${base}.json`, jsonContent, "application/json");
      triggerDownload(`${base}.txt`, txtContent, "text/plain");
      triggerDownload(`${base}.domain.yaml`, yamlContent, "application/x-yaml");
    });
  } else {
    triggerDownload(`${base}.json`, jsonContent, "application/json");
    triggerDownload(`${base}.txt`, txtContent, "text/plain");
    triggerDownload(`${base}.domain.yaml`, yamlContent, "application/x-yaml");
    pendingSaveVersion = Promise.resolve();
  }
  scheduleSave(); // persist the incremented version so it survives a reload (Section 9)
}

// ---------------------------------------------------------------------------
// File formats — import (Section 5.3). Parser is a direct port of the
// spec's own reference Python loader (same grammar, same "<->" before "->"
// check order since "<->" also contains "->" as a substring). The app's own
// import additionally does label-matched merge/replace against the live
// graph — the Python snippet is read-only.
//
// UI note: Section 7 lists a single "Import from TXT" entry point (button +
// drag-drop), but Section 5.3 defines two distinct modes and requires a
// confirmation step (with a diff summary) specifically for Replace. Since
// there's no second button to reach Replace with, both modes are offered
// together in one dialog after a file is chosen — Merge stays a single
// undoable, no-extra-confirmation action in spirit (it's presented, not
// gated), while Replace's diff-summary requirement is satisfied by the same
// dialog. This is a necessary UI addition beyond Section 7's literal table.
// ---------------------------------------------------------------------------
function parseTxtImport(text) {
  const nodes = [];
  const edges = [];
  let section = null;
  for (const raw of text.split(/\r\n|\n|\r/)) {
    const line = raw.trim();
    // Section headers first: "## NODES"/"## EDGES" also start with "#", so
    // checking the generic comment-skip first (as spec.md's own reference
    // Python snippet literally does) makes them unreachable dead code —
    // the headers would never be recognized. Confirmed by testing against
    // the spec's own worked example.
    if (line === "## NODES") { section = "nodes"; continue; }
    if (line === "## EDGES") { section = "edges"; continue; }
    if (!line || line.startsWith("#")) continue;
    if (section === "nodes") {
      const label = line.trim();
      if (label) nodes.push({ label });
    } else if (section === "edges") {
      const sepIdx = line.lastIndexOf(" : ");
      if (sepIdx === -1) continue; // malformed — no relation separator, skip
      const conn = line.slice(0, sepIdx);
      const relation = line.slice(sepIdx + 3).trim();
      let directed, src, tgt;
      if (conn.includes("<->")) {
        directed = false;
        [src, tgt] = conn.split("<->");
      } else if (conn.includes("->")) {
        directed = true;
        [src, tgt] = conn.split("->");
      } else {
        continue; // malformed — no connector, skip
      }
      src = (src || "").trim();
      tgt = (tgt || "").trim();
      if (src && tgt && relation) edges.push({ source: src, target: tgt, relation, directed });
    }
  }
  return { nodes, edges };
}

// Shared by the dialog's diff-count preview and the real commit, so the
// numbers shown are guaranteed to match what actually happens. Doesn't
// mutate state — resolves against a label->node map that includes both
// real existing nodes and lightweight "would be created" placeholders.
function planTxtImport(parsed) {
  const labelToNode = new Map();
  for (const n of state.nodes) if (!labelToNode.has(n.label)) labelToNode.set(n.label, n);

  const nodePlans = parsed.nodes.map((pn) => {
    const existing = state.nodes.find((n) => n.label === pn.label);
    if (existing) {
      labelToNode.set(pn.label, existing);
      return { label: pn.label, existing };
    }
    const placeholder = { pending: true, label: pn.label };
    labelToNode.set(pn.label, placeholder);
    return { label: pn.label, existing: null };
  });

  const ordinaryEdgePlans = [];
  for (const pe of parsed.edges) {
    const srcNode = labelToNode.get(pe.source);
    const tgtNode = labelToNode.get(pe.target);
    if (!srcNode || !tgtNode) continue; // references a label not in ## NODES — skip defensively
    const existingEdge = (!srcNode.pending && !tgtNode.pending)
      ? state.edges.find((e) => e.source === srcNode.id && e.target === tgtNode.id &&
          e.relation === pe.relation && e.directed === pe.directed)
      : null;
    ordinaryEdgePlans.push({ ...pe, existing: existingEdge });
  }

  const newNodeCount = nodePlans.filter((np) => !np.existing).length;
  const newEdgeCount = ordinaryEdgePlans.filter((ep) => !ep.existing).length;

  let removedCount = 0;
  if (state.nodes.length || state.edges.length) {
    const matchedIds = new Set(nodePlans.filter((np) => np.existing).map((np) => np.existing.id));
    const nodesToRemove = state.nodes.filter((n) => !matchedIds.has(n.id));
    const removedIds = new Set(nodesToRemove.map((n) => n.id));
    const matchedEdgeIds = new Set(ordinaryEdgePlans.filter((ep) => ep.existing).map((ep) => ep.existing.id));
    const edgesToRemove = state.edges.filter((e) => !removedIds.has(e.source) &&
      !removedIds.has(e.target) && !matchedEdgeIds.has(e.id));
    removedCount = nodesToRemove.length + edgesToRemove.length;
  }

  return { nodePlans, ordinaryEdgePlans, newNodeCount, newEdgeCount, removedCount };
}

// Simple shelf/grid placement for newly-created nodes, starting just below
// the existing content's bounding box (Section 5.3: "not full autolayout").
function computeImportShelf() {
  let originX = 0, originY = 0;
  if (state.nodes.length > 0) {
    originX = Math.min(...state.nodes.map((n) => n.x));
    originY = Math.max(...state.nodes.map((n) => n.y + n.h)) + 80;
  }
  let col = 0, row = 0;
  const COLS = 5, GAP_X = 200, GAP_Y = 100;
  return () => {
    const pos = { x: originX + col * GAP_X, y: originY + row * GAP_Y };
    col += 1;
    if (col >= COLS) { col = 0; row += 1; }
    return pos;
  };
}

let newlyImportedIds = new Set();

function commitTxtImport(text, mode) {
  const before = snapshotState();
  const parsed = parseTxtImport(text);
  const nextShelfPosition = computeImportShelf();

  const labelToNode = new Map();
  for (const n of state.nodes) if (!labelToNode.has(n.label)) labelToNode.set(n.label, n);

  const matchedExistingIds = new Set();
  const createdNodeIds = [];
  for (const pn of parsed.nodes) {
    const existing = state.nodes.find((n) => n.label === pn.label);
    if (existing) {
      matchedExistingIds.add(existing.id);
      labelToNode.set(pn.label, existing);
      continue;
    }
    const pos = nextShelfPosition();
    const node = createNode(pos.x, pos.y, pn.label);
    createdNodeIds.push(node.id);
    labelToNode.set(pn.label, node);
  }

  // Add only if an equivalent edge doesn't already exist.
  for (const pe of parsed.edges) {
    const src = labelToNode.get(pe.source);
    const tgt = labelToNode.get(pe.target);
    if (!src || !tgt) continue;
    const dup = state.edges.some((e) => e.source === src.id && e.target === tgt.id &&
      e.relation === pe.relation && e.directed === pe.directed);
    if (!dup) createEdge(src.id, tgt.id, pe.relation, pe.directed);
  }

  if (mode === "replace") {
    const nodesToRemove = state.nodes.filter((n) => !matchedExistingIds.has(n.id) && !createdNodeIds.includes(n.id));
    for (const n of nodesToRemove) deleteNode(n.id);

    // Remove edges not declared by this TXT.
    const declaredOrdinary = new Set();
    for (const pe of parsed.edges) {
      const src = labelToNode.get(pe.source), tgt = labelToNode.get(pe.target);
      if (src && tgt) declaredOrdinary.add(`${src.id} ${tgt.id} ${pe.relation} ${pe.directed}`);
    }
    const edgesToRemove = state.edges.filter((e) =>
      !declaredOrdinary.has(`${e.source} ${e.target} ${e.relation} ${e.directed}`));
    for (const e of edgesToRemove) deleteEdge(e.id);
  }

  pushHistory(before, snapshotState()); // clears any stale "just imported" highlight first
  newlyImportedIds = new Set(createdNodeIds);
  markDirty();
}

// ---------------------------------------------------------------------------
// Domain Model YAML import (agent_ontology_spec.md §5/§8, Phase G) — the
// inverse of buildDomainYamlExport()/toYaml() above. Hand-written to parse
// exactly the block-style subset that serializer can produce (2-space
// indent, "- item" lists, "key:"/"key: value" maps, double-quoted/escaped
// scalars, inline "[]"/"{}" for empty collections) — not a general YAML
// parser, the same "symmetric to the app's own grammar, not the whole spec"
// posture parseTxtImport() takes for the TXT format. Malformed/truncated
// input degrades gracefully (missing pieces default to empty) rather than
// throwing, matching parseTxtImport()'s own skip-don't-crash discipline.
//
// Import semantics are deliberately more aggressive than TXT's node/edge
// merge: a class/relationship/rule/action matched against something already
// on canvas gets its fields overwritten by the imported values (not left
// untouched) on both Merge and Replace — only Replace additionally removes
// anything not present in the file. This is a real, decided divergence from
// TXT import's "existing entries are never touched" posture, not an
// oversight — see the dated Log entry in agent_ontology_todo.md.
// ---------------------------------------------------------------------------

function yamlUnescapeQuoted(body) {
  return body
    .replace(/\\n/g, "\n")
    .replace(/\\t/g, "\t")
    .replace(/\\r/g, "\r")
    .replace(/\\"/g, '"')
    .replace(/\\\\/g, "\\");
}

// Splits the inside of an inline flow-list ("a, b, \"c, d\"" from
// "[a, b, \"c, d\"]") on top-level commas only — a quoted item's own commas
// don't split it, reusing findYamlClosingQuote's same escape handling so
// this stays consistent with how quoted scalars are unescaped elsewhere in
// this parser.
function splitYamlInlineListItems(inner) {
  const items = [];
  let current = "";
  let i = 0;
  while (i < inner.length) {
    const c = inner[i];
    if (c === '"') {
      const end = findYamlClosingQuote(inner, i);
      if (end === -1) { current += inner.slice(i); break; }
      current += inner.slice(i, end + 1);
      i = end + 1;
      continue;
    }
    if (c === ",") { items.push(current); current = ""; i += 1; continue; }
    current += c;
    i += 1;
  }
  items.push(current);
  return items;
}

// Inverse of yamlScalar()/the empty-collection shorthand — a bare (post
// "key: ") value token back into null / [] / {} / a string.
//
// Real live agent tool calls (helper_agent_todo.md's dated Log entry) were
// found writing short lists as an inline flow-sequence -- e.g.
// `preconditions: [canDeclareMajorIncident]`, `aliases: [ticket, issue]` --
// which is completely idiomatic YAML for a short list, but this parser
// previously only special-cased the *empty* `[]` token; any non-empty one
// fell through to the plain-string branch below, so `Array.isArray(...)`
// checks downstream (commitYamlImport's fieldLevelMerge logic) saw a
// string, treated the field as not-given, and silently created the
// action/class with an empty list instead of what was actually sent. Only
// `[...]` is handled here, not a non-empty inline flow-map `{...}` --
// this app's own exporter (yamlLines) never emits one, and no real
// tool-call payload has been observed using inline-map syntax, so there's
// no evidence yet that it's a live problem worth the extra parsing surface.
function parseYamlValueToken(token) {
  if (token === "[]") return [];
  if (token === "{}") return {};
  if (token === "null" || token === "") return null;
  if (token.length >= 2 && token.startsWith('"') && token.endsWith('"')) {
    return yamlUnescapeQuoted(token.slice(1, -1));
  }
  if (token.length >= 2 && token[0] === "[" && token[token.length - 1] === "]") {
    const inner = token.slice(1, -1).trim();
    if (inner === "") return [];
    return splitYamlInlineListItems(inner).map((item) => parseYamlValueToken(item.trim()));
  }
  return token;
}

function findYamlClosingQuote(s, openIdx) {
  for (let i = openIdx + 1; i < s.length; i++) {
    if (s[i] === "\\") { i += 1; continue; }
    if (s[i] === '"') return i;
  }
  return -1;
}

// Splits a "key: value" or bare "key:" (value continues on nested lines)
// line into [key, valueToken | undefined]. Returns null if the line isn't
// a recognizable key line at all (e.g. a plain scalar list item). A
// possibly-quoted key is resolved first since our own keys are only ever
// quoted when they'd otherwise be ambiguous (e.g. contain ": ").
function splitYamlKeyValue(content) {
  let key, rest;
  if (content.startsWith('"')) {
    const end = findYamlClosingQuote(content, 0);
    if (end === -1) return null;
    key = yamlUnescapeQuoted(content.slice(1, end));
    rest = content.slice(end + 1);
  } else {
    const colon = content.indexOf(":");
    if (colon === -1) return null;
    key = content.slice(0, colon);
    rest = content.slice(colon);
  }
  if (!rest.startsWith(":")) return null;
  rest = rest.slice(1);
  if (rest === "") return [key, undefined];
  if (!rest.startsWith(" ")) return null; // malformed — not "key:" nor "key: value"
  return [key, rest.slice(1)];
}

// Recursively parses one YAML block (a map or a list) starting at `indent`
// (in 2-space units) from `lines[pos.i]` onward, advancing `pos.i` past
// everything it consumes. `lines` is a flat array of {indent, content}
// (blank lines and #-comments already stripped). Mirrors yamlLines() in
// reverse, including its one special case: a list item that's itself a
// mapping (relationships' `- name: ...` entries) has its first key sharing
// the dash's line.
function parseYamlBlock(lines, pos, indent) {
  if (pos.i >= lines.length || lines[pos.i].indent < indent) return undefined;
  const first = lines[pos.i];
  if (first.content === "[]") { pos.i += 1; return []; }
  if (first.content === "{}") { pos.i += 1; return {}; }
  if (first.content === "-" || first.content.startsWith("- ")) {
    const arr = [];
    while (pos.i < lines.length && lines[pos.i].indent === indent &&
      (lines[pos.i].content === "-" || lines[pos.i].content.startsWith("- "))) {
      const itemContent = lines[pos.i].content === "-" ? "" : lines[pos.i].content.slice(2);
      pos.i += 1;
      if (itemContent === "") { arr.push(parseYamlBlock(lines, pos, indent + 1)); continue; }
      const kv = splitYamlKeyValue(itemContent);
      if (!kv) { arr.push(parseYamlValueToken(itemContent)); continue; }
      const obj = {};
      obj[kv[0]] = kv[1] !== undefined ? parseYamlValueToken(kv[1]) : parseYamlBlock(lines, pos, indent + 1);
      while (pos.i < lines.length && lines[pos.i].indent === indent + 1) {
        const kv2 = splitYamlKeyValue(lines[pos.i].content);
        if (!kv2) break;
        pos.i += 1;
        obj[kv2[0]] = kv2[1] !== undefined ? parseYamlValueToken(kv2[1]) : parseYamlBlock(lines, pos, indent + 2);
      }
      arr.push(obj);
    }
    return arr;
  }
  const obj = {};
  while (pos.i < lines.length && lines[pos.i].indent === indent) {
    const kv = splitYamlKeyValue(lines[pos.i].content);
    if (!kv) break; // not a key line — stop this block defensively rather than crash
    pos.i += 1;
    obj[kv[0]] = kv[1] !== undefined ? parseYamlValueToken(kv[1]) : parseYamlBlock(lines, pos, indent + 1);
  }
  return obj;
}

function parseDomainYamlImport(text) {
  const lines = [];
  for (const raw of text.split(/\r\n|\n|\r/)) {
    const noTrailing = raw.replace(/[ \t]+$/, "");
    const trimmed = noTrailing.trim();
    if (trimmed === "" || trimmed.startsWith("#")) continue;
    const indentSpaces = noTrailing.length - noTrailing.trimStart().length;
    if (indentSpaces % 2 !== 0) continue; // malformed indentation — skip defensively
    lines.push({ indent: indentSpaces / 2, content: noTrailing.trimStart() });
  }
  const root = parseYamlBlock(lines, { i: 0 }, 0) || {};
  const asMap = (v) => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
  const asList = (v) => Array.isArray(v) ? v : [];
  return {
    classes: asMap(root.classes),
    relationships: asList(root.relationships),
    rules: asMap(root.rules),
    actions: asMap(root.actions),
  };
}

// Shared by the dialog's diff-count preview and the real commit (mirrors
// planTxtImport()'s own "compute once, reuse for both" shape) — resolves
// against label/name maps that include both real existing entries and
// lightweight "would be created" placeholders, so relationships/actions
// referencing a class or rule declared earlier in the same file resolve
// correctly even before anything is actually created.
function planYamlImport(parsed) {
  const classLabels = Object.keys(parsed.classes);
  const ruleNames = Object.keys(parsed.rules);
  const actionNames = Object.keys(parsed.actions);

  const classPlans = classLabels.map((label) => ({
    label, existing: state.nodes.find((n) => n.label === label) || null,
  }));
  const rulePlans = ruleNames.map((name) => ({
    name, existing: state.rules.find((r) => r.name === name) || null,
  }));
  const actionPlans = actionNames.map((name) => ({
    name, existing: state.actions.find((a) => a.name === name) || null,
  }));

  const labelIsKnown = new Set(classLabels);
  for (const n of state.nodes) labelIsKnown.add(n.label);
  const relationshipPlans = [];
  for (const rel of parsed.relationships) {
    if (!rel || typeof rel !== "object") continue;
    if (!labelIsKnown.has(rel.from) || !labelIsKnown.has(rel.to)) continue; // dangling reference — skip
    const existing = state.edges.find((e) => {
      const src = state.nodes.find((n) => n.id === e.source);
      const tgt = state.nodes.find((n) => n.id === e.target);
      return src && tgt && src.label === rel.from && tgt.label === rel.to &&
        toCamelCaseId(e.relation) === rel.name;
    });
    relationshipPlans.push({ rel, existing: existing || null });
  }

  const addedCount = classPlans.filter((p) => !p.existing).length +
    relationshipPlans.filter((p) => !p.existing).length +
    rulePlans.filter((p) => !p.existing).length +
    actionPlans.filter((p) => !p.existing).length;
  const changedCount = classPlans.filter((p) => p.existing).length +
    relationshipPlans.filter((p) => p.existing).length +
    rulePlans.filter((p) => p.existing).length +
    actionPlans.filter((p) => p.existing).length;

  let removedCount = 0;
  if (state.nodes.length || state.edges.length || state.rules.length || state.actions.length) {
    const matchedNodeIds = new Set(classPlans.filter((p) => p.existing).map((p) => p.existing.id));
    const matchedEdgeIds = new Set(relationshipPlans.filter((p) => p.existing).map((p) => p.existing.id));
    const matchedRuleIds = new Set(rulePlans.filter((p) => p.existing).map((p) => p.existing.id));
    const matchedActionIds = new Set(actionPlans.filter((p) => p.existing).map((p) => p.existing.id));
    const removedNodes = state.nodes.filter((n) => !matchedNodeIds.has(n.id)).length;
    const removedEdges = state.edges.filter((e) => !matchedEdgeIds.has(e.id) &&
      !state.nodes.some((n) => (n.id === e.source || n.id === e.target) && !matchedNodeIds.has(n.id))).length;
    const removedRules = state.rules.filter((r) => !matchedRuleIds.has(r.id)).length;
    const removedActions = state.actions.filter((a) => !matchedActionIds.has(a.id)).length;
    removedCount = removedNodes + removedEdges + removedRules + removedActions;
  }

  return { classPlans, relationshipPlans, rulePlans, actionPlans, addedCount, changedCount, removedCount };
}

// Upserts incoming properties (name -> {type, unit, allowed}) into an
// existing property array by name, leaving properties the caller didn't
// mention untouched -- only used by "agent-merge" (see commitYamlImport's
// own comment on why this exists as a separate mode from the manual
// dialog's "merge").
function mergePropertiesByName(existingProperties, incomingByName) {
  const result = existingProperties.map((p) => ({ ...p }));
  for (const [name, p] of Object.entries(incomingByName)) {
    const merged = {
      id: `p_${Math.random().toString(36).slice(2, 9)}`, name,
      type: (p && p.type) || "text",
      unit: (p && p.unit) || null,
      allowed: (p && Array.isArray(p.allowed)) ? p.allowed : null,
    };
    const idx = result.findIndex((ep) => ep.name === name);
    if (idx >= 0) {
      merged.id = result[idx].id;
      result[idx] = merged;
    } else {
      result.push(merged);
    }
  }
  return result;
}

// mode is "merge" (manual Import dialog's own Merge button — matched
// classes/rules/relationships/actions have every field wholesale replaced
// by whatever this one file specifies, including clearing fields the file
// omits; tests/agent-ontology-phase-g.spec.mjs's own tests document this as
// deliberate: a human re-uploading a self-contained file expects it to be
// authoritative for what it lists), "replace" (also deletes anything
// unmatched), or "agent-merge" (apply_ontology_yaml only, see
// handleAgentToolCall) -- a third mode added after a live, real
// conversation (tests/evals/ontology-recovery.eval.spec.mjs's first full
// run, see helper_agent_todo.md's Log) showed the agent tool's own
// documented contract ("only include entries that are new or have changed
// -- this merges against the existing model, it does not need to restate
// everything") was silently violated by reusing plain "merge" semantics: a
// real model correctly sending a minimal diff (e.g. just one new property)
// had every field it didn't restate -- meaning, aliases, other properties
// -- wiped, and had to notice and manually re-send them to recover. Under
// "agent-merge", a field that's absent from this call's parsed YAML for an
// *existing, matched* entity is left exactly as it was, not cleared;
// `properties` specifically upserts by name (see mergePropertiesByName)
// instead of replacing the whole array. Newly-created entities are
// unaffected by any of this -- there's nothing to preserve yet.
function commitYamlImport(text, mode) {
  const before = snapshotState();
  const parsed = parseDomainYamlImport(text);
  const nextShelfPosition = computeImportShelf();
  const fieldLevelMerge = mode === "agent-merge";

  const labelToNode = new Map();
  for (const n of state.nodes) labelToNode.set(n.label, n);
  const matchedNodeIds = new Set();
  for (const [label, cls] of Object.entries(parsed.classes)) {
    const propertiesByName = cls && cls.properties && typeof cls.properties === "object" ? cls.properties : {};
    const meaningGiven = cls && typeof cls.meaning === "string";
    const aliasesGiven = cls && Array.isArray(cls.aliases);
    const existing = state.nodes.find((n) => n.label === label);
    if (existing) {
      if (!fieldLevelMerge || meaningGiven) existing.meaning = meaningGiven ? cls.meaning : null;
      if (!fieldLevelMerge || aliasesGiven) existing.aliases = aliasesGiven ? [...cls.aliases] : [];
      existing.properties = fieldLevelMerge
        ? mergePropertiesByName(existing.properties, propertiesByName)
        : Object.entries(propertiesByName).map(([name, p]) => ({
            id: `p_${Math.random().toString(36).slice(2, 9)}`, name, // matches the property-id convention createPropertyRow() uses
            type: (p && p.type) || "text",
            unit: (p && p.unit) || null,
            allowed: (p && Array.isArray(p.allowed)) ? p.allowed : null,
          }));
      matchedNodeIds.add(existing.id);
      labelToNode.set(label, existing);
    } else {
      const pos = nextShelfPosition();
      const node = createNode(pos.x, pos.y, label);
      node.meaning = meaningGiven ? cls.meaning : null;
      node.aliases = aliasesGiven ? [...cls.aliases] : [];
      node.properties = mergePropertiesByName([], propertiesByName);
      matchedNodeIds.add(node.id);
      labelToNode.set(label, node);
    }
  }

  const nameToRule = new Map();
  for (const r of state.rules) nameToRule.set(r.name, r);
  const matchedRuleIds = new Set();
  for (const [name, rule] of Object.entries(parsed.rules)) {
    const conditionsGiven = rule && Array.isArray(rule.conditions);
    const existing = state.rules.find((r) => r.name === name);
    if (existing) {
      if (!fieldLevelMerge || conditionsGiven) existing.conditions = conditionsGiven ? [...rule.conditions] : [];
      matchedRuleIds.add(existing.id);
      nameToRule.set(name, existing);
    } else {
      const r = createRule(name, conditionsGiven ? [...rule.conditions] : []);
      matchedRuleIds.add(r.id);
      nameToRule.set(name, r);
    }
  }

  const matchedEdgeIds = new Set();
  for (const rel of parsed.relationships) {
    if (!rel || typeof rel !== "object") continue;
    const src = labelToNode.get(rel.from);
    const tgt = labelToNode.get(rel.to);
    if (!src || !tgt) continue; // references a class not in this file/on canvas — skip defensively
    const relationName = rel.name || toCamelCaseId("");
    const meaningGiven = typeof rel.meaning === "string";
    const aliasesGiven = Array.isArray(rel.aliases);
    const existing = state.edges.find((e) => {
      const s = state.nodes.find((n) => n.id === e.source);
      const t = state.nodes.find((n) => n.id === e.target);
      return s && t && s.label === rel.from && t.label === rel.to && toCamelCaseId(e.relation) === relationName;
    });
    if (existing) {
      existing.relation = relationName; // aggressive overwrite normalizes the label to the imported name
      if (!fieldLevelMerge || meaningGiven) existing.meaning = meaningGiven ? rel.meaning : null;
      if (!fieldLevelMerge || aliasesGiven) existing.aliases = aliasesGiven ? [...rel.aliases] : [];
      matchedEdgeIds.add(existing.id);
    } else {
      const edge = createEdge(src.id, tgt.id, relationName, true);
      edge.meaning = meaningGiven ? rel.meaning : null;
      edge.aliases = aliasesGiven ? [...rel.aliases] : [];
      matchedEdgeIds.add(edge.id);
    }
  }

  const matchedActionIds = new Set();
  for (const [name, action] of Object.entries(parsed.actions)) {
    const inputGiven = action && typeof action.input === "string";
    const inputNode = inputGiven ? labelToNode.get(action.input) : null;
    const preconditionsGiven = action && Array.isArray(action.preconditions);
    const preconditionIds = preconditionsGiven
      ? action.preconditions.map((n) => nameToRule.get(n)).filter(Boolean).map((r) => r.id)
      : [];
    const effectGiven = action && typeof action.effect === "string";
    const verificationGiven = action && typeof action.verification === "string";
    const existing = state.actions.find((a) => a.name === name);
    if (existing) {
      if (!fieldLevelMerge || inputGiven) existing.inputClassId = inputNode ? inputNode.id : null;
      if (!fieldLevelMerge || preconditionsGiven) existing.preconditions = preconditionIds;
      if (!fieldLevelMerge || effectGiven) existing.effect = effectGiven ? action.effect : "";
      if (!fieldLevelMerge || verificationGiven) existing.verification = verificationGiven ? action.verification : "";
