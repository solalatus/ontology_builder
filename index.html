<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Knowledge Graph Canvas</title>
<style>
  :root {
    color-scheme: light dark;
    --toolbar-bg: #1e1e1e;
    --toolbar-fg: #e8e8e8;
    --toolbar-border: #333;
    --btn-bg: #2c2c2c;
    --btn-bg-hover: #3a3a3a;
    --btn-bg-active: #4a4a4a;
    --canvas-bg: #121212;
    --grid-dot: #2a2a2a;
    --empty-fg: #666;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  #toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    background: var(--toolbar-bg);
    color: var(--toolbar-fg);
    border-bottom: 1px solid var(--toolbar-border);
  }

  #toolbar button {
    font-size: 14px;
    line-height: 1;
    padding: 8px 12px;
    color: var(--toolbar-fg);
    background: var(--btn-bg);
    border: 1px solid var(--toolbar-border);
    border-radius: 4px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }

  #toolbar button:hover {
    background: var(--btn-bg-hover);
  }

  #toolbar button:active,
  #toolbar button[aria-pressed="true"] {
    background: var(--btn-bg-active);
  }

  #toolbar .spacer {
    flex: 1 1 auto;
  }

  #toolbar .zoom-group {
    display: flex;
    gap: 2px;
  }

  #canvas-wrap {
    position: fixed;
    inset: 0;
    background: var(--canvas-bg);
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }

  #canvas.panning {
    cursor: grabbing;
  }

  #import-file-input {
    display: none;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-add-node" type="button">Add Node</button>
  <button id="btn-connect" type="button" aria-pressed="false">Connect</button>
  <button id="btn-autolayout" type="button">Auto-layout</button>
  <button id="btn-undo" type="button">Undo</button>
  <button id="btn-redo" type="button">Redo</button>
  <button id="btn-save-version" type="button">Save Version</button>
  <button id="btn-import-txt" type="button">Import from TXT</button>
  <input id="import-file-input" type="file" accept=".txt">
  <div class="spacer"></div>
  <div class="zoom-group">
    <button id="btn-zoom-out" type="button" aria-label="Zoom out">&minus;</button>
    <button id="btn-zoom-in" type="button" aria-label="Zoom in">&plus;</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Camera: pan offset (screen px at scale=1) + zoom scale. World -> screen:
//   screenX = worldX * scale + panX
//   screenY = worldY * scale + panY
// ---------------------------------------------------------------------------
const camera = { panX: 0, panY: 0, scale: 1 };
const MIN_SCALE = 0.01;
const MAX_SCALE = 100;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let dirty = true;
function markDirty() { dirty = true; }

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

function screenToWorld(sx, sy) {
  return { x: (sx - camera.panX) / camera.scale, y: (sy - camera.panY) / camera.scale };
}

function zoomAt(screenX, screenY, factor) {
  const newScale = clamp(camera.scale * factor, MIN_SCALE, MAX_SCALE);
  if (newScale === camera.scale) return;
  const world = screenToWorld(screenX, screenY);
  camera.scale = newScale;
  camera.panX = screenX - world.x * newScale;
  camera.panY = screenY - world.y * newScale;
  markDirty();
}

// ---------------------------------------------------------------------------
// Canvas sizing (devicePixelRatio-aware)
// ---------------------------------------------------------------------------
let cssWidth = 0, cssHeight = 0, dpr = 1;

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  cssWidth = rect.width;
  cssHeight = rect.height;
  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);
  markDirty();
}

window.addEventListener("resize", resizeCanvas);

// ---------------------------------------------------------------------------
// Render loop — dirty-flag driven, not a constant loop.
// ---------------------------------------------------------------------------
function drawGrid() {
  // Grid spacing adapts to zoom so it stays visually useful at any scale.
  const targetPx = 60; // desired on-screen spacing
  let worldStep = targetPx / camera.scale;
  const pow10 = Math.pow(10, Math.floor(Math.log10(worldStep)));
  const mantissa = worldStep / pow10;
  const niceMantissa = mantissa < 2 ? 1 : mantissa < 5 ? 2 : 5;
  worldStep = niceMantissa * pow10;

  const topLeft = screenToWorld(0, 0);
  const bottomRight = screenToWorld(cssWidth, cssHeight);

  const startX = Math.floor(topLeft.x / worldStep) * worldStep;
  const startY = Math.floor(topLeft.y / worldStep) * worldStep;

  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--grid-dot").trim() || "#2a2a2a";
  const dotRadius = clamp(1.2 * camera.scale, 0.5, 2);

  for (let wx = startX; wx <= bottomRight.x; wx += worldStep) {
    for (let wy = startY; wy <= bottomRight.y; wy += worldStep) {
      const sx = wx * camera.scale + camera.panX;
      const sy = wy * camera.scale + camera.panY;
      ctx.beginPath();
      ctx.arc(sx, sy, dotRadius, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawEmptyState() {
  ctx.save();
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--empty-fg").trim() || "#666";
  ctx.font = "16px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Canvas is empty — use “Add Node” to begin", cssWidth / 2, cssHeight / 2);
  ctx.restore();
}

function render() {
  // Reset to identity (device pixels) before clearing.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Device-pixel-ratio scale as the base transform; camera pan/zoom on top,
  // both applied in CSS-pixel (screen) space.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawGrid();
  drawEmptyState(); // placeholder until Phase 1 adds real node/edge rendering
}

function loop() {
  if (dirty) {
    dirty = false;
    render();
  }
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------------
// Pan (mouse drag / single-touch drag via Pointer Events)
// ---------------------------------------------------------------------------
let panPointerId = null;
let panLast = { x: 0, y: 0 };

canvas.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "touch" && activeTouches.size >= 2) return; // pinch owns this
  panPointerId = e.pointerId;
  panLast = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add("panning");
});

canvas.addEventListener("pointermove", (e) => {
  if (e.pointerId !== panPointerId) return;
  const dx = e.clientX - panLast.x;
  const dy = e.clientY - panLast.y;
  panLast = { x: e.clientX, y: e.clientY };
  camera.panX += dx;
  camera.panY += dy;
  markDirty();
});

function endPan(e) {
  if (e.pointerId !== panPointerId) return;
  panPointerId = null;
  canvas.classList.remove("panning");
}
canvas.addEventListener("pointerup", endPan);
canvas.addEventListener("pointercancel", endPan);

// ---------------------------------------------------------------------------
// Zoom — wheel/ctrl+wheel (desktop) and pinch (touch)
// ---------------------------------------------------------------------------
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const factor = Math.pow(1.0015, -e.deltaY);
  zoomAt(sx, sy, factor);
}, { passive: false });

const activeTouches = new Map(); // pointerId -> {x,y}
let pinchStartDist = null;
let pinchStartMid = null;

canvas.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch") return;
  activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activeTouches.size === 2) {
    // A pinch is starting: cancel any single-finger pan in progress.
    if (panPointerId !== null) {
      canvas.releasePointerCapture(panPointerId);
      panPointerId = null;
      canvas.classList.remove("panning");
    }
    const pts = [...activeTouches.values()];
    pinchStartDist = distance(pts[0], pts[1]);
    pinchStartMid = midpoint(pts[0], pts[1]);
  }
});

canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "touch" || !activeTouches.has(e.pointerId)) return;
  activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activeTouches.size === 2 && pinchStartDist) {
    const pts = [...activeTouches.values()];
    const dist = distance(pts[0], pts[1]);
    const mid = midpoint(pts[0], pts[1]);
    const rect = canvas.getBoundingClientRect();
    const factor = dist / pinchStartDist;
    zoomAt(mid.x - rect.left, mid.y - rect.top, factor);
    pinchStartDist = dist;
    pinchStartMid = mid;
  }
});

function endTouch(e) {
  if (e.pointerType !== "touch") return;
  activeTouches.delete(e.pointerId);
  if (activeTouches.size < 2) {
    pinchStartDist = null;
    pinchStartMid = null;
  }
}
canvas.addEventListener("pointerup", endTouch);
canvas.addEventListener("pointercancel", endTouch);

function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function midpoint(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

// ---------------------------------------------------------------------------
// Toolbar — zoom buttons are fully functional (camera exists in Phase 0);
// everything else is a stub until its owning phase lands.
// ---------------------------------------------------------------------------
function notImplemented(label) {
  console.warn(`[KG Canvas] "${label}" is not implemented yet (see TODO.md).`);
}

document.getElementById("btn-zoom-in").addEventListener("click", () => {
  zoomAt(cssWidth / 2, cssHeight / 2, 1.25);
});
document.getElementById("btn-zoom-out").addEventListener("click", () => {
  zoomAt(cssWidth / 2, cssHeight / 2, 1 / 1.25);
});

document.getElementById("btn-add-node").addEventListener("click", () => notImplemented("Add Node"));
document.getElementById("btn-connect").addEventListener("click", () => notImplemented("Connect"));
document.getElementById("btn-autolayout").addEventListener("click", () => notImplemented("Auto-layout"));
document.getElementById("btn-undo").addEventListener("click", () => notImplemented("Undo"));
document.getElementById("btn-redo").addEventListener("click", () => notImplemented("Redo"));
document.getElementById("btn-save-version").addEventListener("click", () => notImplemented("Save Version"));

const importInput = document.getElementById("import-file-input");
document.getElementById("btn-import-txt").addEventListener("click", () => importInput.click());
importInput.addEventListener("change", () => {
  if (importInput.files && importInput.files[0]) {
    notImplemented(`Import from TXT (selected "${importInput.files[0].name}")`);
  }
  importInput.value = "";
});

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
resizeCanvas();
requestAnimationFrame(loop);
</script>

</body>
</html>
