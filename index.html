        updateGroupMembership(node); // commit/clear the dragged node's own membership, not on mere click
        if (node.type === "group") updateMembershipForMovedGroup(node); // absorb/release other nodes
      }
      if (dragBeforeSnapshot) pushHistory(dragBeforeSnapshot, snapshotState()); // move + membership: one step
    }
    movingNodeId = null;
    dragBeforeSnapshot = null;
    dragMode = null;
    activePointerId = null;
    return;
  }

  if (dragMode === "createEdge") {
    if (e.pointerId !== activePointerId) return;
    const rect = canvas.getBoundingClientRect();
    const world = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    const targetNode = findNodeAt(world.x, world.y);
    suppressNextClick = true;
    const sourceId = edgeDragSourceId;
    edgeDragSourceId = null;
    edgeDragCurrentWorld = null;
    dragMode = null;
    activePointerId = null;
    if (targetNode && targetNode.id !== sourceId) {
      beginAddEdgePrompt(sourceId, targetNode.id, { x: e.clientX, y: e.clientY });
    }
    markDirty();
    return;
  }

  if (dragMode === "resizeGroup") {
    if (e.pointerId !== activePointerId) return;
    const moved = pointerDownScreen ? Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y) : 0;
    if (moved > MOVE_THRESHOLD) {
      suppressNextClick = true;
      if (dragBeforeSnapshot) pushHistory(dragBeforeSnapshot, snapshotState());
    }
    resizingNodeId = null;
    dragBeforeSnapshot = null;
    dragMode = null;
    activePointerId = null;
    return;
  }
});

// A drag interrupted mid-flight — a genuine browser pointercancel, or a
// second touch arriving to start a pinch (see the touch pointerdown
// listener below) — used to just null out dragMode/movingNodeId/etc.
// directly, silently stranding whatever position/size change had already
// happened: node.x/y (or w/h) stayed mutated, but pushHistory() was never
// called, so the change was both un-undoable and invisible to the next
// save. "Every discrete action = one undo step" (Phase 3) applies here
// too — an interruption commits whatever changed so far, exactly like an
// ordinary drag release would, and is skipped entirely (no empty undo
// step) if nothing actually moved/resized yet.
function commitDragIfChanged() {
  if (!dragBeforeSnapshot) return;
  const after = snapshotState();
  if (JSON.stringify(dragBeforeSnapshot) !== JSON.stringify(after)) pushHistory(dragBeforeSnapshot, after);
}

function abortActiveDrag() {
  // A pending long-press-delete timer must die with the interrupted drag
  // too — otherwise it still fires ~600ms later using its own closed-over
  // node reference, deleting a node the user has already moved on from
  // (e.g. into a pinch gesture) with no warning and no undo step recorded
  // for it.
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  if (dragMode === "moveNode" && movingNodeId) {
    const node = state.nodes.find((n) => n.id === movingNodeId);
    if (node) {
      updateGroupMembership(node);
      if (node.type === "group") updateMembershipForMovedGroup(node);
    }
    commitDragIfChanged();
  } else if (dragMode === "resizeGroup" && resizingNodeId) {
    commitDragIfChanged(); // resize never cascades membership, same as a normal resize release
  }
  // createEdge has nothing persistent to commit (no edge exists until a
  // target is confirmed) and pan has no undo history at all — both leave
  // no trace once dragMode clears.
  dragMode = null;
  activePointerId = null;
  movingNodeId = null;
  edgeDragSourceId = null;
  edgeDragCurrentWorld = null;
  resizingNodeId = null;
  dragBeforeSnapshot = null;
  markDirty();
}

canvas.addEventListener("pointercancel", (e) => {
  if (dragMode === "pan") endPan(e);
  abortActiveDrag();
});

function beginAddEdgePrompt(sourceId, targetId, screenPos) {
  showInlineInput({
    x: screenPos.x, y: screenPos.y, placeholder: t("relationLabelPlaceholder"),
    onCommit: (text) => {
      const relation = text.trim() || t("defaultRelation");
      const before = snapshotState();
      const edge = createEdge(sourceId, targetId, relation, true, false);
      pushHistory(before, snapshotState());
      selectEdge(edge.id);
    },
  });
}

function placeNewNodeAt(world, screenPos, type) {
  showInlineInput({
    x: screenPos.x, y: screenPos.y,
    placeholder: type === "group" ? t("groupLabelPlaceholder") : t("nodeLabelPlaceholder"),
    onCommit: (text) => {
      const label = text.trim();
      if (!label) return;
      const w = type === "group" ? DEFAULT_GROUP_W : DEFAULT_NODE_W;
      const h = type === "group" ? DEFAULT_GROUP_H : DEFAULT_NODE_H;
      const before = snapshotState();
      const node = createNode(world.x - w / 2, world.y - h / 2, label, type);
      pushHistory(before, snapshotState());
      selectNode(node.id);
    },
  });
}

// ---------------------------------------------------------------------------
// Renaming (out-of-spec, user-requested): double-click an existing node/edge
// on desktop; the floating selection toolbar's rename button (visible for
// both node and edge selections) is the touch-friendly equivalent, since
// there's no reliable double-tap gesture distinct from a fast double-select
// on touch devices. Both reuse the same showInlineInput() pattern as
// creation, pre-filled with the current text — Enter/blur commits, Escape
// cancels. An empty or unchanged submission is a no-op: no history entry,
// matching how an empty label at creation time creates nothing at all.
//
// The anchor position is always derived from the node/edge's own current
// geometry (center for a node, curve midpoint for an edge) — never from
// wherever the triggering click/tap happened to land. A double-click can
// land anywhere inside a (possibly large, post-zoom) node's box, and using
// that raw point made the input pop up far from the node's own rendered
// label, which read as arbitrary/"funky" rather than anchored to anything.
// ---------------------------------------------------------------------------
function beginRenameNodePrompt(nodeId) {
  const node = state.nodes.find((n) => n.id === nodeId);
  if (!node) return;
  const screenPos = worldToScreen(node.x + node.w / 2, node.y + node.h / 2);
  showInlineInput({
    x: screenPos.x, y: screenPos.y, value: node.label,
    placeholder: node.type === "group" ? t("groupLabelPlaceholder") : t("nodeLabelPlaceholder"),
    onCommit: (text) => {
      const label = text.trim();
      if (!label || label === node.label) return;
      const before = snapshotState();
      node.label = label;
      pushHistory(before, snapshotState());
      markDirty();
    },
  });
}

function beginRenameEdgePrompt(edgeId) {
  const edge = state.edges.find((e) => e.id === edgeId);
  if (!edge) return;
  const geo = edgeGeometry(edge, computeEdgeBendInfo());
  if (!geo) return;
  const screenPos = worldToScreen(geo.mid.x, geo.mid.y);
  showInlineInput({
    x: screenPos.x, y: screenPos.y, value: edge.relation, placeholder: t("relationLabelPlaceholder"),
    onCommit: (text) => {
      const relation = text.trim();
      if (!relation || relation === edge.relation) return;
      const before = snapshotState();
      edge.relation = relation;
      pushHistory(before, snapshotState());
      markDirty();
    },
  });
}

function renameSelected() {
  if (state.selection.type === "node") {
    beginRenameNodePrompt(state.selection.id);
  } else if (state.selection.type === "edge") {
    beginRenameEdgePrompt(state.selection.id);
  }
}

function handleConnectTap(hitNode, screenPos) {
  if (!hitNode) {
    state.connectSource = null;
    clearSelection();
    return;
  }
  if (!state.connectSource) {
    state.connectSource = hitNode.id;
    selectNode(hitNode.id);
    return;
  }
  if (state.connectSource === hitNode.id) {
    state.connectSource = null;
    clearSelection();
    return;
  }
  const sourceId = state.connectSource;
  state.connectSource = null;
  beginAddEdgePrompt(sourceId, hitNode.id, screenPos);
}

canvas.addEventListener("click", (e) => {
  if (suppressNextClick) { suppressNextClick = false; return; }

  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const world = screenToWorld(sx, sy);

  if (state.mode === "addNode" || state.mode === "addGroup") {
    placeNewNodeAt(world, { x: e.clientX, y: e.clientY }, state.mode === "addGroup" ? "group" : "entity");
    setMode("idle");
    return;
  }

  const nodeHit = findNodeAt(world.x, world.y);

  if (state.mode === "connect") {
    handleConnectTap(nodeHit, { x: e.clientX, y: e.clientY });
    return;
  }

  if (nodeHit) { selectNode(nodeHit.id); return; }
  const edgeHit = findEdgeAt(world.x, world.y);
  if (edgeHit) { selectEdge(edgeHit.id); return; }
  clearSelection();
});

canvas.addEventListener("dblclick", (e) => {
  const rect = canvas.getBoundingClientRect();
  const world = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
  const screenPos = { x: e.clientX, y: e.clientY };

  const nodeHit = findNodeAt(world.x, world.y);
  if (nodeHit) { beginRenameNodePrompt(nodeHit.id); return; }
  const edgeHit = findEdgeAt(world.x, world.y);
  if (edgeHit) { beginRenameEdgePrompt(edgeHit.id); return; }

  placeNewNodeAt(world, screenPos, "entity"); // spec gesture is entity-only
});

window.addEventListener("keydown", (e) => {
  if (activeConfirm) {
    if (e.key === "Escape") { e.preventDefault(); closeConfirmDialog(false); }
    else if (e.key === "Enter") { e.preventDefault(); closeConfirmDialog(true); }
    return;
  }
  if (activeInlineEditor) return; // don't hijack while typing
  if (e.key === "Escape") {
    if (state.mode !== "idle") setMode("idle");
    if (state.connectSource) { state.connectSource = null; markDirty(); }
    return;
  }
  if ((e.key === "Delete" || e.key === "Backspace") && state.selection.id) {
    e.preventDefault();
    const before = snapshotState();
    if (state.selection.type === "node") deleteNode(state.selection.id);
    else if (state.selection.type === "edge") deleteEdge(state.selection.id);
    pushHistory(before, snapshotState());
  }
});

selRenameBtn.addEventListener("click", () => renameSelected());

selTrashBtn.addEventListener("click", () => {
  if (!state.selection.type) return;
  const before = snapshotState();
  if (state.selection.type === "node") deleteNode(state.selection.id);
  else if (state.selection.type === "edge") deleteEdge(state.selection.id);
  pushHistory(before, snapshotState());
});

selToggleDirBtn.addEventListener("click", () => {
  if (state.selection.type !== "edge") return;
  const edge = state.edges.find((x) => x.id === state.selection.id);
  if (!edge) return;
  const before = snapshotState();
  edge.directed = !edge.directed;
  pushHistory(before, snapshotState());
  markDirty();
});

// ---------------------------------------------------------------------------
// Zoom — wheel/ctrl+wheel (desktop) and pinch (touch)
// ---------------------------------------------------------------------------
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const factor = Math.pow(1.0015, -e.deltaY);
  zoomAt(sx, sy, factor);
}, { passive: false });

const activeTouches = new Map(); // pointerId -> {x,y}
let pinchStartDist = null;

canvas.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch") return;
  activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activeTouches.size === 2) {
    if (panPointerId !== null) {
      safeReleasePointerCapture(panPointerId);
      panPointerId = null;
      canvas.classList.remove("panning");
    }
    abortActiveDrag(); // a pinch starting cancels any node-move/edge-drag too, committing whatever already changed
    const pts = [...activeTouches.values()];
    pinchStartDist = distance(pts[0], pts[1]);
  }
});

canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "touch" || !activeTouches.has(e.pointerId)) return;
  activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activeTouches.size === 2 && pinchStartDist) {
    const pts = [...activeTouches.values()];
    const dist = distance(pts[0], pts[1]);
    const mid = midpoint(pts[0], pts[1]);
    const rect = canvas.getBoundingClientRect();
    const factor = dist / pinchStartDist;
    zoomAt(mid.x - rect.left, mid.y - rect.top, factor);
    pinchStartDist = dist;
  }
});

function endTouch(e) {
  if (e.pointerType !== "touch") return;
  activeTouches.delete(e.pointerId);
  if (activeTouches.size < 2) pinchStartDist = null;
}
canvas.addEventListener("pointerup", endTouch);
canvas.addEventListener("pointercancel", endTouch);

function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function midpoint(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

// ---------------------------------------------------------------------------
// File formats — export (Section 5.1, 5.2, 5.4). "Save Version" always
// writes both a JSON (canonical, full-fidelity) and a TXT (structure-only
// edge list) file together, via a plain <a download> — the universal Tier 3
// path per Section 3.1's capability matrix (Tier 2's native save dialog is
// Phase 7, a progressive enhancement on top of this, not a replacement).
// ---------------------------------------------------------------------------
function isoTimestampSeconds(date = new Date()) {
  return date.toISOString().replace(/\.\d{3}Z$/, "Z"); // "2026-07-25T14:20:00Z", no ms
}

// "2026-07-25T14:20:00Z" -> "2026-07-25T1420Z" (Section 5.4's filename form —
// no colons/seconds, since colons aren't filename-safe on some filesystems).
function filenameTimestamp(iso) {
  const [datePart, timePart] = iso.split("T");
  return `${datePart}T${timePart.slice(0, 5).replace(":", "")}Z`;
}

// Spec doesn't define graph-name rules (see TODO.md's Open Questions); kept
// conservative since it lands directly in a filename on every platform.
function sanitizeGraphName(raw) {
  const cleaned = raw.trim().replace(/\s+/g, "-").replace(/[^A-Za-z0-9_-]/g, "");
  return cleaned || "graph";
}

function buildJsonExport(savedAt) {
  return {
    meta: {
      format_version: state.meta.format_version,
      graph_id: state.meta.graph_id,
      version: state.meta.version,
      created: state.meta.created,
      saved: savedAt,
    },
    nodes: state.nodes.map((n) => {
      const out = {
        id: n.id, label: n.label, type: n.type,
        x: n.x, y: n.y, w: n.w, h: n.h,
        groups: [...n.groups],
        notes: n.notes,
      };
      if (n.type === "group") out.boundary_mode = n.boundary_mode;
      return out;
    }),
    edges: state.edges.map((e) => ({
      id: e.id, source: e.source, target: e.target,
      relation: e.relation, directed: e.directed, auto: e.auto,
    })),
  };
}

function buildTxtExport(savedAt) {
  const lines = [
    "# KG Canvas export",
    `# format_version: ${state.meta.format_version}`,
    `# graph_id: ${state.meta.graph_id}`,
    `# version: ${state.meta.version}`,
    `# saved: ${savedAt}`,
    "",
    "## NODES",
  ];
  for (const n of state.nodes) {
    lines.push(n.type === "group" ? `${n.label} [group]` : n.label);
  }
  lines.push("", "## EDGES");
  for (const e of state.edges) {
    const src = state.nodes.find((n) => n.id === e.source);
    const tgt = state.nodes.find((n) => n.id === e.target);
    if (!src || !tgt) continue; // shouldn't happen — deleteNode() always cleans up edges
    const arrow = e.directed ? "->" : "<->";
    lines.push(`${src.label} ${arrow} ${tgt.label} : ${e.relation}`);
  }
  return lines.join("\n") + "\n";
}

function triggerDownload(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------------------------------------------------------------------------
// Tier 2 storage (Section 3.2, progressive enhancement): once a folder is
// granted via showDirectoryPicker, explicit saves write silently into it —
// no further prompts, no browser download — instead of Tier 3's <a download>.
// Chrome/Windows + Chromium/Linux only (Section 3.1); Brave and Android
// don't expose the API at all, so feature-detection alone keeps the opt-in
// hidden there — no separate platform check needed.
// Session-scoped only: the granted handle isn't persisted across a reload
// (the File System Access API supports storing a handle for later re-grant
// via IndexedDB, but spec only requires "no further prompts" once granted,
// not that the grant itself survives a full reload — treated as a possible
// future enhancement, not a gap against what's specified).
// ---------------------------------------------------------------------------
let tier2DirHandle = null;

function updateFolderSyncButton() {
  const btn = document.getElementById("btn-folder-sync");
  if (!btn) return;
  if (tier2DirHandle) {
    btn.textContent = t("folderSynced", tier2DirHandle.name);
    btn.setAttribute("aria-pressed", "true");
  } else {
    btn.textContent = t("folderSync");
    btn.setAttribute("aria-pressed", "false");
  }
}

async function connectFolderSync() {
  try {
    const handle = await window.showDirectoryPicker({ mode: "readwrite" });
    tier2DirHandle = handle;
    updateFolderSyncButton();
  } catch (err) {
    if (!err || err.name !== "AbortError") console.warn("[KG Canvas] Folder Sync grant failed:", err);
  }
}

async function writeFileToFolder(dirHandle, filename, content) {
  const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(content);
  await writable.close();
}

// Test/debug hook: lets tests await the in-flight save (folder write or
// download trigger) rather than guessing timing — same pattern as
// storage.whenIdle() in Phase 4.
let pendingSaveVersion = Promise.resolve();
function waitForSaveVersion() { return pendingSaveVersion; }

function performSaveVersion() {
  if (!state.meta) {
    state.meta = {
      format_version: 1,
      graph_id: crypto.randomUUID(),
      version: 0,
      created: isoTimestampSeconds(),
    };
  }
  state.meta.version += 1;
  const savedAt = isoTimestampSeconds();
  state.meta.saved = savedAt;
  const base = `${sanitizeGraphName(state.graphName)}_v${String(state.meta.version).padStart(4, "0")}_${filenameTimestamp(savedAt)}`;
  const jsonContent = JSON.stringify(buildJsonExport(savedAt), null, 2);
  const txtContent = buildTxtExport(savedAt);

  if (tier2DirHandle) {
    pendingSaveVersion = Promise.all([
      writeFileToFolder(tier2DirHandle, `${base}.json`, jsonContent),
      writeFileToFolder(tier2DirHandle, `${base}.txt`, txtContent),
    ]).catch((err) => {
      console.warn("[KG Canvas] Folder Sync write failed, falling back to download:", err);
      triggerDownload(`${base}.json`, jsonContent, "application/json");
      triggerDownload(`${base}.txt`, txtContent, "text/plain");
    });
  } else {
    triggerDownload(`${base}.json`, jsonContent, "application/json");
    triggerDownload(`${base}.txt`, txtContent, "text/plain");
    pendingSaveVersion = Promise.resolve();
  }
  scheduleSave(); // persist the incremented version so it survives a reload (Section 9)
}

// ---------------------------------------------------------------------------
// File formats — import (Section 5.3). Parser is a direct port of the
// spec's own reference Python loader (same grammar, same "<->" before "->"
// check order since "<->" also contains "->" as a substring). The app's own
// import additionally does label+type-matched merge/replace against the
// live graph — the Python snippet is read-only.
//
// UI note: Section 7 lists a single "Import from TXT" entry point (button +
// drag-drop), but Section 5.3 defines two distinct modes and requires a
// confirmation step (with a diff summary) specifically for Replace. Since
// there's no second button to reach Replace with, both modes are offered
// together in one dialog after a file is chosen — Merge stays a single
// undoable, no-extra-confirmation action in spirit (it's presented, not
// gated), while Replace's diff-summary requirement is satisfied by the same
// dialog. This is a necessary UI addition beyond Section 7's literal table,
// the same way Add Group's button and the group resize handle were.
// ---------------------------------------------------------------------------
function parseTxtImport(text) {
  const nodes = [];
  const edges = [];
  let section = null;
  for (const raw of text.split(/\r\n|\n|\r/)) {
    const line = raw.trim();
    // Section headers first: "## NODES"/"## EDGES" also start with "#", so
    // checking the generic comment-skip first (as spec.md's own reference
    // Python snippet literally does) makes them unreachable dead code —
    // the headers would never be recognized. Confirmed by testing against
    // the spec's own worked example.
    if (line === "## NODES") { section = "nodes"; continue; }
    if (line === "## EDGES") { section = "edges"; continue; }
    if (!line || line.startsWith("#")) continue;
    if (section === "nodes") {
      const isGroup = line.endsWith("[group]");
      const label = (isGroup ? line.slice(0, -"[group]".length) : line).trim();
      if (label) nodes.push({ label, type: isGroup ? "group" : "entity" });
    } else if (section === "edges") {
      const sepIdx = line.lastIndexOf(" : ");
      if (sepIdx === -1) continue; // malformed — no relation separator, skip
      const conn = line.slice(0, sepIdx);
      const relation = line.slice(sepIdx + 3).trim();
      let directed, src, tgt;
      if (conn.includes("<->")) {
        directed = false;
        [src, tgt] = conn.split("<->");
      } else if (conn.includes("->")) {
        directed = true;
        [src, tgt] = conn.split("->");
      } else {
        continue; // malformed — no connector, skip
      }
      src = (src || "").trim();
      tgt = (tgt || "").trim();
      if (src && tgt && relation) edges.push({ source: src, target: tgt, relation, directed });
    }
  }
  return { nodes, edges };
}

function isContainsDeclaration(edge) {
  return edge.directed && edge.relation === "contains";
}

// Shared by the dialog's diff-count preview and the real commit, so the
// numbers shown are guaranteed to match what actually happens. Doesn't
// mutate state — resolves against a label->node map that includes both
// real existing nodes and lightweight "would be created" placeholders.
function planTxtImport(parsed) {
  const labelToNode = new Map();
  for (const n of state.nodes) if (!labelToNode.has(n.label)) labelToNode.set(n.label, n);

  const nodePlans = parsed.nodes.map((pn) => {
    const existing = state.nodes.find((n) => n.label === pn.label && n.type === pn.type);
    if (existing) {
      labelToNode.set(pn.label, existing);
      return { label: pn.label, type: pn.type, existing };
    }
    const placeholder = { pending: true, label: pn.label, type: pn.type };
    labelToNode.set(pn.label, placeholder);
    return { label: pn.label, type: pn.type, existing: null };
  });

  const containsDecls = [];
  const ordinaryEdgePlans = [];
  for (const pe of parsed.edges) {
    const srcNode = labelToNode.get(pe.source);
    const tgtNode = labelToNode.get(pe.target);
    if (!srcNode || !tgtNode) continue; // references a label not in ## NODES — skip defensively
    if (isContainsDeclaration(pe)) {
      if (srcNode.type === "group") containsDecls.push({ groupLabel: pe.source, memberLabel: pe.target });
      continue; // malformed (source isn't a group) — skip silently either way
    }
    const existingEdge = (!srcNode.pending && !tgtNode.pending)
      ? state.edges.find((e) => !e.auto && e.source === srcNode.id && e.target === tgtNode.id &&
          e.relation === pe.relation && e.directed === pe.directed)
      : null;
    ordinaryEdgePlans.push({ ...pe, existing: existingEdge });
  }

  const newNodeCount = nodePlans.filter((np) => !np.existing).length;
  const newEdgeCount = ordinaryEdgePlans.filter((ep) => !ep.existing).length;

  let removedCount = 0;
  if (state.nodes.length || state.edges.length) {
    const matchedIds = new Set(nodePlans.filter((np) => np.existing).map((np) => np.existing.id));
    const nodesToRemove = state.nodes.filter((n) => !matchedIds.has(n.id));
    const removedIds = new Set(nodesToRemove.map((n) => n.id));
    const matchedEdgeIds = new Set(ordinaryEdgePlans.filter((ep) => ep.existing).map((ep) => ep.existing.id));
    const edgesToRemove = state.edges.filter((e) => !e.auto && !removedIds.has(e.source) &&
      !removedIds.has(e.target) && !matchedEdgeIds.has(e.id));
    removedCount = nodesToRemove.length + edgesToRemove.length;
  }

  return { nodePlans, ordinaryEdgePlans, containsDecls, newNodeCount, newEdgeCount, removedCount };
}

// Simple shelf/grid placement for newly-created nodes, starting just below
// the existing content's bounding box (Section 5.3: "not full autolayout").
function computeImportShelf() {
  let originX = 0, originY = 0;
  if (state.nodes.length > 0) {
    originX = Math.min(...state.nodes.map((n) => n.x));
    originY = Math.max(...state.nodes.map((n) => n.y + n.h)) + 80;
  }
  let col = 0, row = 0;
  const COLS = 5, GAP_X = 200, GAP_Y = 100;
  return (type) => {
    const pos = { x: originX + col * GAP_X, y: originY + row * GAP_Y };
    col += 1;
    if (col >= COLS) { col = 0; row += 1; }
    return pos;
  };
}

let newlyImportedIds = new Set();

function commitTxtImport(text, mode) {
  const before = snapshotState();
  const parsed = parseTxtImport(text);
  const nextShelfPosition = computeImportShelf();

  const labelToNode = new Map();
  for (const n of state.nodes) if (!labelToNode.has(n.label)) labelToNode.set(n.label, n);

  const matchedExistingIds = new Set();
  const createdNodeIds = [];
  for (const pn of parsed.nodes) {
    const existing = state.nodes.find((n) => n.label === pn.label && n.type === pn.type);
    if (existing) {
      matchedExistingIds.add(existing.id);
      labelToNode.set(pn.label, existing);
      continue;
    }
    const pos = nextShelfPosition(pn.type);
    const node = createNode(pos.x, pos.y, pn.label, pn.type);
    createdNodeIds.push(node.id);
    labelToNode.set(pn.label, node);
  }

  // Group-membership declarations (spec: "exactly as if it had been
  // dragged in on canvas" — i.e. groups[] + an auto contains edge), guarded
  // against the same redundant-ancestor case updateGroupMembership() (the
  // drag-based path) guards against: a file can declare both
  // "Outer -> Leaf : contains" and "Inner -> Leaf : contains" with Inner
  // itself declared (or already known) as nested inside Outer — without
  // this, Leaf would end up with a spurious second, direct membership in
  // Outer on top of its real one in Inner, plus a redundant second
  // `contains` edge, even though that containment already holds
  // transitively. Unlike the drag-based path, TXT import has no geometry
  // to check against — "ancestor" here means "declared (or already
  // existing) group-to-group nesting," computed up front so the result is
  // independent of which order the `## EDGES` lines happen to appear in.
  const containsDeclarations = parsed.edges.filter(isContainsDeclaration);

  const groupParents = new Map(); // groupId -> Set<parentGroupId>
  for (const n of state.nodes) if (n.type === "group") groupParents.set(n.id, new Set(n.groups));
  for (const pe of containsDeclarations) {
    const group = labelToNode.get(pe.source);
    const member = labelToNode.get(pe.target);
    if (group && member && group.type === "group" && member.type === "group") {
      if (!groupParents.has(member.id)) groupParents.set(member.id, new Set());
      groupParents.get(member.id).add(group.id);
    }
  }
  function isDeclaredAncestorGroup(candidateId, groupId, seen = new Set()) {
    if (seen.has(groupId)) return false; // guards against a (malformed) cycle
    seen.add(groupId);
    for (const parentId of groupParents.get(groupId) || []) {
      if (parentId === candidateId || isDeclaredAncestorGroup(candidateId, parentId, seen)) return true;
    }
    return false;
  }

  const declaredGroupsByMember = new Map(); // memberId -> Set<groupId> (declared by this file, plus already-existing)
  for (const pe of containsDeclarations) {
    const group = labelToNode.get(pe.source);
    const member = labelToNode.get(pe.target);
    if (!group || !member || group.type !== "group") continue;
    if (!declaredGroupsByMember.has(member.id)) declaredGroupsByMember.set(member.id, new Set(member.groups));
    declaredGroupsByMember.get(member.id).add(group.id);
  }

  for (const pe of containsDeclarations) {
    const group = labelToNode.get(pe.source);
    const member = labelToNode.get(pe.target);
    if (!group || !member || group.type !== "group" || member.groups.includes(group.id)) continue;
    const allDeclared = declaredGroupsByMember.get(member.id) || new Set();
    const redundant = [...allDeclared].some((gid) => gid !== group.id && isDeclaredAncestorGroup(group.id, gid));
    if (redundant) continue;
    member.groups.push(group.id);
    createContainsEdge(group.id, member.id);
  }

  // Ordinary edges: add only if an equivalent one doesn't already exist.
  for (const pe of parsed.edges) {
    if (isContainsDeclaration(pe)) continue;
    const src = labelToNode.get(pe.source);
    const tgt = labelToNode.get(pe.target);
    if (!src || !tgt) continue;
    const dup = state.edges.some((e) => !e.auto && e.source === src.id && e.target === tgt.id &&
      e.relation === pe.relation && e.directed === pe.directed);
    if (!dup) createEdge(src.id, tgt.id, pe.relation, pe.directed, false);
  }

  if (mode === "replace") {
    const nodesToRemove = state.nodes.filter((n) => !matchedExistingIds.has(n.id) && !createdNodeIds.includes(n.id));
    for (const n of nodesToRemove) deleteNode(n.id);

    // Prune any surviving node's group memberships not re-declared by this TXT.
    const declaredMemberships = new Set();
    for (const pe of parsed.edges) {
      if (!isContainsDeclaration(pe)) continue;
      const group = labelToNode.get(pe.source);
      const member = labelToNode.get(pe.target);
      if (group && member) declaredMemberships.add(`${group.id}␀${member.id}`);
    }
    for (const n of state.nodes) {
      const kept = n.groups.filter((gid) => declaredMemberships.has(`${gid}␀${n.id}`));
      if (kept.length !== n.groups.length) {
        for (const gid of n.groups) if (!kept.includes(gid)) removeContainsEdge(gid, n.id);
        n.groups = kept;
      }
    }

    // Remove ordinary edges not declared by this TXT.
    const declaredOrdinary = new Set();
    for (const pe of parsed.edges) {
      if (isContainsDeclaration(pe)) continue;
      const src = labelToNode.get(pe.source), tgt = labelToNode.get(pe.target);
      if (src && tgt) declaredOrdinary.add(`${src.id}␀${tgt.id}␀${pe.relation}␀${pe.directed}`);
    }
    const edgesToRemove = state.edges.filter((e) => !e.auto &&
      !declaredOrdinary.has(`${e.source}␀${e.target}␀${e.relation}␀${e.directed}`));
    for (const e of edgesToRemove) deleteEdge(e.id);
  }

  pushHistory(before, snapshotState()); // clears any stale "just imported" highlight first
  newlyImportedIds = new Set(createdNodeIds);
  markDirty();
}

const importOverlay = document.getElementById("import-overlay");
const importSummaryEl = document.getElementById("import-summary");
const importMergeBtn = document.getElementById("import-merge");
const importReplaceBtn = document.getElementById("import-replace");
const importCancelBtn = document.getElementById("import-cancel");
let pendingImportText = null;

function openImportDialog(text) {
  pendingImportText = text;
  const plan = planTxtImport(parseTxtImport(text));
  const lines = [
    t("importMergeSummary", plan.newNodeCount, plan.newEdgeCount),
  ];
  if (state.nodes.length || state.edges.length) {
    lines.push(t("importReplaceSummary", plan.removedCount));
  } else {
    importReplaceBtn.style.display = "none";
  }
  importSummaryEl.textContent = lines.join("\n\n");
  importOverlay.style.display = "flex";
}

function closeImportDialog() {
  importOverlay.style.display = "none";
  importReplaceBtn.style.display = "";
  pendingImportText = null;
}

importMergeBtn.addEventListener("click", () => {
  const text = pendingImportText;
  closeImportDialog();
  if (text !== null) commitTxtImport(text, "merge");
});
importReplaceBtn.addEventListener("click", () => {
  const text = pendingImportText;
  closeImportDialog();
  if (text !== null) commitTxtImport(text, "replace");
});
importCancelBtn.addEventListener("click", () => closeImportDialog());
importOverlay.addEventListener("click", (e) => { if (e.target === importOverlay) closeImportDialog(); });

// ---------------------------------------------------------------------------
// Toolbar
// ---------------------------------------------------------------------------
function notImplemented(label) {
  console.warn(`[KG Canvas] "${label}" is not implemented yet (see TODO.md).`);
}

document.getElementById("btn-zoom-in").addEventListener("click", () => {
  zoomAt(cssWidth / 2, cssHeight / 2, 1.25);
});
document.getElementById("btn-zoom-out").addEventListener("click", () => {
  zoomAt(cssWidth / 2, cssHeight / 2, 1 / 1.25);
});

document.getElementById("btn-add-node").addEventListener("click", () => {
  setMode(state.mode === "addNode" ? "idle" : "addNode");
});
document.getElementById("btn-add-group").addEventListener("click", () => {
  setMode(state.mode === "addGroup" ? "idle" : "addGroup");
});
document.getElementById("btn-connect").addEventListener("click", () => {
  setMode(state.mode === "connect" ? "idle" : "connect");
});

document.getElementById("btn-autolayout").addEventListener("click", () => autoLayout());
document.getElementById("btn-undo").addEventListener("click", () => undo());
document.getElementById("btn-redo").addEventListener("click", () => redo());
document.getElementById("btn-save-version").addEventListener("click", () => performSaveVersion());
document.getElementById("btn-folder-sync").addEventListener("click", () => connectFolderSync());
document.getElementById("btn-theme-toggle").addEventListener("click", () => toggleTheme());
document.getElementById("btn-lang-toggle").addEventListener("click", () => toggleLanguage());

// Graph name (Section 5.4's Open Question — resolved as an always-visible,
// always-editable title rather than a one-time save-time prompt) is never
// gated behind Save Version; it defaults to "Untitled Graph" and can be
// renamed anytime by clicking the title.
const graphTitleEl = document.getElementById("graph-title");

function openRenameGraphTitle() {
  const rect = graphTitleEl.getBoundingClientRect();
  // Clamp so the centered (translate(-50%,-50%)) input never clips off the
  // left edge — the title sits flush at x=0, so its own midpoint is too
  // close to the edge for a ~140px-wide input.
  const x = Math.max(90, rect.left + rect.width / 2);
  showInlineInput({
    x, y: rect.bottom + 16,
    value: state.graphName, placeholder: t("graphNamePlaceholder"),
    onCommit: (text) => {
      state.graphName = text.trim() || t("untitledGraph");
      graphTitleEl.textContent = state.graphName;
      scheduleSave();
    },
  });
}

graphTitleEl.addEventListener("click", openRenameGraphTitle);
graphTitleEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openRenameGraphTitle(); }
});

const importInput = document.getElementById("import-file-input");
document.getElementById("btn-import-txt").addEventListener("click", () => importInput.click());
importInput.addEventListener("change", async () => {
  const file = importInput.files && importInput.files[0];
  importInput.value = ""; // allow re-selecting the same filename later
  if (!file) return;
  openImportDialog(await file.text());
});

// Drag-and-drop of a .txt file onto the canvas, per Section 7's "where
// supported" accelerator (native file-open dialog above is the baseline).
canvas.addEventListener("dragover", (e) => {
  if ([...e.dataTransfer.items].some((it) => it.kind === "file")) e.preventDefault();
});
canvas.addEventListener("drop", async (e) => {
  const file = [...e.dataTransfer.files].find((f) => f.name.toLowerCase().endsWith(".txt"));
  if (!file) return;
  e.preventDefault();
  openImportDialog(await file.text());
});

document.getElementById("btn-clear").addEventListener("click", () => {
  if (state.nodes.length === 0 && state.edges.length === 0) return; // nothing to clear
  showConfirmDialog({
    message: t("clearConfirmMessage"),
    confirmLabel: t("clearConfirmLabel"),
    onConfirm: () => {
      const before = snapshotState();
      state.nodes = [];
      state.edges = [];
      state.connectSource = null;
      clearSelection();
      pushHistory(before, snapshotState());
      markDirty();
    },
  });
});

// ---------------------------------------------------------------------------
// Debug/test-only introspection hook. Purely additive read/call surface over
// state that already exists for the app's own operation — never required
// for index.html to function, and never itself a source of app behavior.
// ---------------------------------------------------------------------------
window.__kg = {
  state,
  camera,
  history,
  render,
  markDirty,
  worldToScreen,
  screenToWorld,
  zoomAt,
  actions: {
    createNode, createEdge, deleteNode, deleteEdge,
    selectNode, selectEdge, clearSelection, setMode,
    updateGroupMembership, undo, redo, autoLayout,
  },
  storage: {
    detectBackend: detectStorageBackend,
    whenIdle: whenSaveIdle,
    save: scheduleSave,
  },
  tier2: {
    waitForSaveVersion,
    getDirHandle: () => tier2DirHandle,
    // Direct injection lets tests exercise the write path without a real
    // user-gesture-gated picker grant; connectFolderSync() itself is
    // exercised separately by mocking window.showDirectoryPicker.
    setDirHandle: (handle) => {
      tier2DirHandle = handle;
      updateFolderSyncButton();
    },
  },
  getNewlyImportedIds: () => newlyImportedIds, // reassigned, not mutated — needs a getter, not a reference
  theme: {
    get: () => theme,
    toggle: toggleTheme,
  },
  lang: {
    get: () => lang,
    toggle: toggleLanguage,
    t,
  },
  perf: {
    getRenderStats: () => ({ ...renderStats }),
    getVisibleWorldRect: () => visibleWorldRect(),
  },
  // Exposes the exact anchor/control/midpoint geometry a given edge id
  // renders and hit-tests with, so tests can assert bend behavior (offset
  // direction/magnitude, straight-when-alone) precisely instead of only
  // inferring it from pixels.
  getEdgeGeometry: (edgeId) => {
    const edge = state.edges.find((e) => e.id === edgeId);
    return edge ? edgeGeometry(edge, computeEdgeBendInfo()) : null;
  },
  // Mirrors the exact same isMember/isBeingMoved/isBeingResized checks
  // drawNodes() uses to pick a node's fill/stroke color, so tests can
  // assert the color-selection *logic* precisely (including mid-drag,
  // where a real screenshot would need to catch a single in-flight frame)
  // rather than only inferring it from rendered pixels.
  getNodeVisualState: (nodeId) => {
    const node = state.nodes.find((n) => n.id === nodeId);
    if (!node) return null;
    const isGroup = node.type === "group";
    return {
      isMember: !isGroup && node.groups.length > 0,
      isBeingMoved: isGroup && dragMode === "moveNode" && movingNodeId === node.id,
      isBeingResized: isGroup && dragMode === "resizeGroup" && resizingNodeId === node.id,
    };
  },
};

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
async function boot() {
  resizeCanvas();
  updateUndoRedoButtons();
  applyLanguage(); // also refreshes the theme/folder-sync/lang button text
  const restored = await loadGraphFromStorage();
  if (restored) {
    clearSelection();
    markDirty();
  }
  if (isDefaultGraphName(state.graphName)) state.graphName = t("untitledGraph");
  document.getElementById("graph-title").textContent = state.graphName;
  // Tier 2 opt-in (Section 3.1): only Chrome/Windows and Chromium/Linux
  // expose showDirectoryPicker at all — Brave and Chrome/Android don't, so
  // feature detection alone keeps the button hidden there with no separate
  // platform sniff needed.
  if ("showDirectoryPicker" in window) {
    document.getElementById("btn-folder-sync").style.display = "";
    updateFolderSyncButton();
  }
}

boot();
requestAnimationFrame(loop);
</script>
