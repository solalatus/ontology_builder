    clearSelection();
    state.connectSource = null;
    newlyImportedIds = new Set();
  } else {
    const nextShelfPosition = computeImportShelf();
    for (const n of g.nodes) {
      const existing = state.nodes.find((x) => x.label === n.label);
      if (existing) {
        // Matched by label: the file is authoritative for the content it
        // carries, but never for where the user has put the box — same
        // contract as the TXT importer's "existing nodes keep their position".
        existing.meaning = n.meaning;
        existing.aliases = [...n.aliases];
        existing.properties = n.properties.map((p) => ({ ...p }));
        liveNodeByKey.set(n.key, existing);
        continue;
      }
      const pos = importPositionIsFree(n) ? { x: n.x, y: n.y } : nextShelfPosition();
      const node = createNode(pos.x, pos.y, n.label);
      node.w = n.w;
      node.h = n.h;
      node.meaning = n.meaning;
      node.aliases = [...n.aliases];
      node.properties = n.properties.map((p) => ({ ...p }));
      liveNodeByKey.set(n.key, node);
      createdNodeIds.push(node.id);
    }

    for (const e of g.edges) {
      const src = liveNodeByKey.get(e.source);
      const tgt = liveNodeByKey.get(e.target);
      if (!src || !tgt) continue;
      const existing = state.edges.find((x) => x.source === src.id && x.target === tgt.id &&
        x.relation === e.relation && x.directed === e.directed);
      const edge = existing || createEdge(src.id, tgt.id, e.relation, e.directed);
      edge.meaning = e.meaning;
      edge.aliases = [...e.aliases];
    }

    for (const r of g.rules) {
      const existing = state.rules.find((x) => x.name === r.name);
      if (existing) {
        existing.conditions = [...r.conditions];
        liveRuleByKey.set(r.key, existing);
      } else {
        liveRuleByKey.set(r.key, createRule(r.name, r.conditions));
      }
    }

    for (const a of g.actions) {
      const inputNode = a.inputClassId ? liveNodeByKey.get(a.inputClassId) : null;
      const preconditionIds = a.preconditions
        .map((rid) => liveRuleByKey.get(rid)).filter(Boolean).map((r) => r.id);
      const existing = state.actions.find((x) => x.name === a.name);
      if (existing) {
        existing.inputClassId = inputNode ? inputNode.id : null;
        existing.preconditions = preconditionIds;
        existing.effect = a.effect;
        existing.verification = a.verification;
      } else {
        createAction(a.name, inputNode ? inputNode.id : null, preconditionIds, a.effect, a.verification);
      }
    }

    newlyImportedIds = new Set(createdNodeIds);
  }

  pushHistory(before, snapshotState());
  markDirty();
  // No autolayout runs here (the format's own coordinates are the point —
  // see hasAnyGraphContent()'s comment above on fullRestore), but the
  // camera still needs to find the restored/merged content: a restored
  // graph can be centered anywhere, and a merge's newly-placed nodes can
  // land far from wherever the camera already was.
  fitViewToContent();
}

const importOverlay = document.getElementById("import-overlay");
const importSummaryEl = document.getElementById("import-summary");
const importMergeBtn = document.getElementById("import-merge");
const importReplaceBtn = document.getElementById("import-replace");
const importCancelBtn = document.getElementById("import-cancel");
let pendingImportText = null;
// "json" (spec.md §5.5, full-fidelity restore), "txt" (spec.md §5.3,
// node/edge merge-never-touches-matches) or "yaml" (agent_ontology_spec.md
// §11, Phase G — aggressive overwrite-on-match). Set alongside
// pendingImportText so Merge/Replace dispatch to the right parser/commit pair
// without re-sniffing the file content.
let pendingImportKind = "txt";
// The filename the text came from, kept only so a canonical JSON export
// written before `meta.graph_name` existed can still recover its graph name
// from §5.4's filename convention. Null for a paste/drop with no real file.
let pendingImportFilename = null;

function hasAnyGraphContent() {
  return Boolean(state.nodes.length || state.edges.length || state.rules.length || state.actions.length);
}

// Puts the dialog into its no-action state: an explanation, and Cancel as the
// only way out. Before this existed, an unimportable file (a JSON export
// picked through the file dialog's "All files" escape hatch, a mistyped
// extension, a CSV) still opened a dialog offering Merge and Replace, and
// clicking either imported nothing at all with no feedback — Replace on an
// empty parse would happily wipe the graph "to match" a file the app hadn't
// actually understood.
function showImportError(message) {
  importSummaryEl.textContent = message;
  importMergeBtn.style.display = "none";
  importReplaceBtn.style.display = "none";
  importOverlay.style.display = "flex";
}

function openImportDialog(text, kind = "txt", filename = null) {
  if (isAnyModalOpen()) return;
  pendingImportText = text;
  pendingImportKind = kind;
  pendingImportFilename = filename;

  if (kind === "invalid-json") {
    const parsed = parseJsonImport(text);
    showImportError(t("importErrorUnreadableJson", parsed.error || ""));
    return;
  }
  if (kind === "unknown") {
    showImportError(t("importErrorUnrecognized"));
    return;
  }

  const lines = [];
  if (kind === "json") {
    const parsed = parseJsonImport(text);
    // detectImportKind() only returns "json" for text that already parsed, so
    // this can't fire from the normal flow — it guards the test/debug hook
    // (window.__kg.formats.openImportDialog) being handed a kind directly.
    if (!parsed.ok) {
      showImportError(t("importErrorUnreadableJson", parsed.error || ""));
      return;
    }
    const g = parsed.graph;
    if (!g.nodes.length && !g.rules.length && !g.actions.length) {
      showImportError(t("importErrorEmpty"));
      return;
    }
    const plan = planJsonImport(parsed);
    if (hasAnyGraphContent()) {
      lines.push(t("importJsonMergeSummary", plan.addedCount, plan.changedCount));
      lines.push(t("importJsonReplaceSummary", plan.removedCount));
    } else {
      // Reopening a saved file into a fresh session is *the* primary use of
      // this format, and on an empty canvas the Replace button is hidden
      // (there is nothing to replace) — so the one remaining button has to be
      // the full restore, not the label-matched merge, or the round trip
      // would be unreachable in exactly the case people need it most.
      lines.push(t("importJsonRestoreSummary", plan.addedCount));
      importReplaceBtn.style.display = "none";
    }
    if (parsed.warnings.length) lines.push(parsed.warnings.join("\n"));
  } else if (kind === "yaml") {
    const parsedYaml = parseDomainYamlImport(text);
    if (!Object.keys(parsedYaml.classes).length && !parsedYaml.relationships.length &&
        !Object.keys(parsedYaml.rules).length && !Object.keys(parsedYaml.actions).length) {
      showImportError(t("importErrorEmpty"));
      return;
    }
    const plan = planYamlImport(parsedYaml);
    lines.push(t("importYamlMergeSummary", plan.addedCount, plan.changedCount));
    if (hasAnyGraphContent()) lines.push(t("importYamlReplaceSummary", plan.removedCount));
    else importReplaceBtn.style.display = "none";
  } else {
    const parsedTxt = parseTxtImport(text);
    if (!parsedTxt.nodes.length && !parsedTxt.edges.length) {
      showImportError(t("importErrorEmpty"));
      return;
    }
    const plan = planTxtImport(parsedTxt);
    lines.push(t("importMergeSummary", plan.newNodeCount, plan.newEdgeCount));
    if (state.nodes.length || state.edges.length) lines.push(t("importReplaceSummary", plan.removedCount));
    else importReplaceBtn.style.display = "none";
  }
  importSummaryEl.textContent = lines.join("\n\n");
  importOverlay.style.display = "flex";
}

function closeImportDialog() {
  importOverlay.style.display = "none";
  importMergeBtn.style.display = "";
  importReplaceBtn.style.display = "";
  pendingImportText = null;
  pendingImportFilename = null;
}

// Extension-only routing, kept as the primary signal: .json -> the canonical
// importer (spec.md §5.5), .yaml/.yml -> the Domain Model importer
// (agent_ontology_spec.md §11, Phase G), everything else -> the plain
// node/edge TXT importer (spec.md §5.3). Matches the three extensions Save
// Version writes, plus a bare .yaml/.yml for a hand-trimmed or hand-authored
// file. Returns null when the name carries no extension this app claims —
// the caller then falls back to sniffing the content.
function importKindForFilename(name) {
  const lower = String(name || "").toLowerCase();
  if (lower.endsWith(".json")) return "json";
  if (lower.endsWith(".yaml") || lower.endsWith(".yml")) return "yaml";
  if (lower.endsWith(".txt")) return "txt";
  return null;
}

// A canonical export is a JSON *object*; neither an edge list nor this app's
// domain YAML can parse as one, so this test never fires on a file that
// belongs to one of the other two importers.
function contentLooksLikeJson(text) {
  const trimmed = text.trim();
  if (!trimmed.startsWith("{")) return false;
  try {
    const parsed = JSON.parse(trimmed);
    return Boolean(parsed) && typeof parsed === "object" && !Array.isArray(parsed);
  } catch (err) {
    return false;
  }
}

function contentLooksLikeDomainYaml(text) {
  return /^(classes|relationships|rules|actions)\s*:/m.test(text);
}

function contentLooksLikeEdgeList(text) {
  return /^##\s*(NODES|EDGES)\s*$/m.test(text) || /^[^#\n]+(<->|->)[^\n]+ : .+$/m.test(text);
}

// Decides which importer a file goes to, from its name *and* its bytes.
//
// The extension stays authoritative for every case that already worked, so
// nothing about existing .txt/.yaml/.yml behaviour changes. Content only gets
// a vote in the two places the extension is useless or actively wrong:
//
//   - The file picker's own "All files" escape hatch (and drag-drop of any
//     file at all) let a canonical .json through to the TXT parser, which
//     found no "## NODES" header, produced an empty graph, and imported
//     nothing without a word of explanation. JSON content now wins over any
//     extension, because a JSON object is unambiguous.
//   - A file with no extension, or one this app doesn't claim, used to be
//     silently treated as an edge list. It's now sniffed, and reported as
//     unrecognized if it matches nothing.
//
// A `.json` whose content doesn't parse returns "invalid-json" rather than
// quietly degrading to the TXT parser: the user named it JSON, so a JSON
// syntax error is the useful thing to say.
function detectImportKind(filename, text) {
  if (contentLooksLikeJson(text)) return "json";
  const byName = importKindForFilename(filename);
  if (byName === "json") return "invalid-json";
  if (byName) return byName;
  if (contentLooksLikeDomainYaml(text)) return "yaml";
  if (contentLooksLikeEdgeList(text)) return "txt";
  return "unknown";
}

// ---------------------------------------------------------------------------
// Helper Agent (helper_agent_plan.md) — Phase 1: collapsed/expanded panel,
// BYOK connect modal, live GET /v1/models call (doubles as the real CORS
// check per plan §3), default-model heuristic with manual override. No
// chat-turn API calls yet — that's Phase 2.
// ---------------------------------------------------------------------------
const AGENT_KEY_STORAGE_KEY = "kg-agent-key";
const AGENT_MODEL_STORAGE_KEY = "kg-agent-model";
// UI preference, not connection state -- deliberately its own key, same
// reasoning as THEME_STORAGE_KEY/LANG_STORAGE_KEY (issue #55).
const AGENT_PANEL_WIDTH_STORAGE_KEY = "kg-agent-panel-width";
const AGENT_PANEL_WIDTH_DEFAULT = 320; // matches #agent-panel-body's own CSS fallback
const AGENT_PANEL_WIDTH_MIN = 240;
const AGENT_PANEL_WIDTH_MAX = 720;
const OPENAI_MODELS_URL = "https://api.openai.com/v1/models";

// Shared backoff for both real API entry points (model discovery below and
// chat turns, see callAgentChatRaw further down) — a 429 with
// rate_limit_exceeded is an ordinary, transient condition under shared
// account/org rate limits and normally clears within a few seconds, unlike
// insufficient_quota (a permanently exhausted billing balance, distinguished
// by error.code, that no amount of waiting fixes and must never be
// retried). Failing the whole request on the first 429 made every rate
// limit visible to the user as a hard error even though waiting a moment
// would have succeeded.
const AGENT_RATE_LIMIT_MAX_ATTEMPTS = 4; // 1 initial try + 3 retries
function agentRateLimitBackoffMs(attempt) {
  return Math.min(1000 * 2 ** (attempt - 1), 4000); // 1s, 2s, 4s
}
function sleepMs(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

// Reasoning/"thinking" models are the current o-series (o1, o3, o4, ...),
// any GPT major version 5 or above (OpenAI folded reasoning into the
// mainline GPT lineup starting there — confirmed live: a real key's model
// list has no o-series entry newer than mid-2025, while gpt-5.x entries are
// current and would otherwise never be considered), plus any id that says
// so explicitly. Heuristic on purpose (see helper_agent_plan.md §4.1) — the
// naming scheme is OpenAI's to change, and this stays correct without an
// edit as long as future reasoning models keep one of these conventions.
function isLikelyReasoningModel(id) {
  return /^o[0-9]/i.test(id) || /^gpt-[5-9](\.|-|$)/i.test(id) || /think|reason/i.test(id);
}

// Excludes non-chat model families (audio/image/embedding/moderation/base
// completion) so the fallback pool (when no reasoning model is available on
// this key) doesn't default to something that can't hold a conversation.
// deep-research/search-preview/search-api are also excluded even though
// they're otherwise "chat-shaped" ids: they're specialized product
// endpoints (autonomous long-running research jobs; web-search-grounded
// completions) with different interaction models than this panel's
// ordinary turn-by-turn tool-calling chat, not general defaults — found via
// a real key's model list, where the newest-by-created id in the reasoning
// pool was otherwise a "-deep-research-" variant, not a general chat model.
function isLikelyChatModel(id) {
  return !/whisper|tts|dall-e|embedding|moderation|davinci|babbage|curie|ada|realtime|audio|transcribe|image|deep-research|search-preview|search-api/i.test(id);
}

// A "standard tier" id is the bare version string (optionally with a
// dated snapshot suffix, e.g. "gpt-5.5-2026-04-23") -- no -mini/-nano/-pro
// tier suffix, and no bare-word preview-codename suffix either (e.g.
// "gpt-5.6-luna"). Preferred over those for two independent reasons that
// happen to point the same way: the user's own stated preference for a
// medium model over the small/cheap tier, and a real, live-discovered bug
// this excludes as a side effect -- a preview-codename generation
// ("-luna"/"-terra"/"-sol") that returned a real 400 ("Function tools ...
// are not supported ... in /v1/chat/completions") the moment tools were
// attached, which is every real request this app makes. No field in
// OpenAI's own /v1/models response signals this incompatibility ahead of
// time; avoiding non-standard-tier ids by default is the safest bet without
// an extra live capability probe on every connect.
function isStandardTierModel(id) {
  return /^(gpt-[0-9]+(\.[0-9]+)?|o[0-9]+)(-\d{4}-\d{2}-\d{2})?$/i.test(id);
}

function pickDefaultAgentModel(models) {
  const chatModels = models.filter((m) => isLikelyChatModel(m.id));
  const reasoningModels = chatModels.filter((m) => isLikelyReasoningModel(m.id));
  const standardReasoningModels = reasoningModels.filter((m) => isStandardTierModel(m.id));
  const candidates = standardReasoningModels.length ? standardReasoningModels
    : reasoningModels.length ? reasoningModels
    : chatModels;
  if (!candidates.length) return null;
  return [...candidates].sort((a, b) => (b.created || 0) - (a.created || 0))[0].id;
}

const agentState = {
  panelExpanded: false,
  // Restored from localStorage below, right after this object literal --
  // needs `document` to exist first, so it can't be inlined here the way
  // panelExpanded's own static default is.
  panelWidth: AGENT_PANEL_WIDTH_DEFAULT,
  connected: false,
  apiKey: null,
  rememberKey: false,
  model: null,
  models: [], // [{id, created}], newest-first once sorted for display
  // Full UI transcript ({role, text}[]) vs. the API-facing working set
  // ({role, content}[], OpenAI's own shape) diverge once context-length
  // compaction kicks in (helper_agent_plan.md §4.10) — transcript keeps
  // every turn for the user to scroll through; apiMessages is what actually
  // gets resent and shrinks when compacted.
  transcript: [],
  apiMessages: [],
  sending: false,
  // A stable per-connection routing hint for OpenAI's prompt-prefix caching
  // (see callAgentChatRaw's own comment) — generated fresh on connect, not
  // per-request, since reusing one key across a whole connection is what
  // makes it useful; cleared on disconnect so a later connection gets its
  // own fresh key rather than inheriting a stale one.
  promptCacheKey: null,
  // Eval-only, no UI ever sets these — used exclusively by the comparison-
  // condition test harnesses (tests/evals/baseline-b2-generic-interviewer.eval.spec.mjs,
  // baseline-b3-no-commit.eval.spec.mjs) to isolate one factor at a time
  // against the real interactive loop, per EXPERIMENT_BRIEF.md. Both default
  // to values that reproduce exactly today's behavior — a real user, and
  // every existing test, never touches either field, so nothing here changes
  // any existing behavior. Read directly off window.__kg.agent.state (already
  // exposed by reference), no new setter functions needed.
  systemPromptOverride: null, // when set, replaces the real staged interview prompt entirely (B2)
  toolsDisabled: false, // when true, no tools array is sent at all -- nothing can commit mid-conversation (B3)
};

try {
  const stored = Number(localStorage.getItem(AGENT_PANEL_WIDTH_STORAGE_KEY));
  if (Number.isFinite(stored) && stored >= AGENT_PANEL_WIDTH_MIN && stored <= AGENT_PANEL_WIDTH_MAX) {
    agentState.panelWidth = stored;
  }
} catch (err) { /* localStorage unavailable -- stay on the default width */ }

// Panel width (issue #55, "make the chat panel resizable") -- sets the
// inline style (always wins over #agent-panel-body's own CSS fallback),
// persists it, and refreshes the layout offset so the change is visible
// immediately whether it came from a live drag or a restored preference.
function applyAgentPanelWidth(px) {
  const clamped = Math.min(AGENT_PANEL_WIDTH_MAX, Math.max(AGENT_PANEL_WIDTH_MIN, Math.round(px)));
  agentState.panelWidth = clamped;
  document.getElementById("agent-panel-body").style.width = clamped + "px";
  try { localStorage.setItem(AGENT_PANEL_WIDTH_STORAGE_KEY, String(clamped)); } catch (err) { /* best-effort only */ }
  updateAgentPanelOffset();
}

// Single source of truth for how far the toolbar and canvas shift right
// (see --agent-panel-offset in both of their own CSS rules). 0 whenever
// the panel is collapsed -- the default, and every pre-#55 test's state --
// so this is a pure no-op until a real user (or a test) actually expands
// the panel or drags its resize handle.
function updateAgentPanelOffset() {
  const offset = agentState.panelExpanded ? 40 + agentState.panelWidth : 0; // 40 = #agent-panel-toggle's own fixed width
  document.documentElement.style.setProperty("--agent-panel-offset", offset + "px");
  resizeCanvas();
}

// Applies a restored (or default) width as the real inline style before
// the panel is ever expanded -- without this, a returning user with a
// previously-widened panel would see it snap back to the 320px CSS
// fallback until they touched the resize handle again.
applyAgentPanelWidth(agentState.panelWidth);

// ---------------------------------------------------------------------------
// Agent conversation persistence (helper_agent_plan.md §9). A second,
// independent storage channel from the graph's own Tier 1 above -- same
// shape (OPFS-first, localStorage fallback, coalescing save loop), but a
// deliberately separate key/file and a fully separate save-loop instance,
// so a large or malformed conversation record can never threaten the
// ontology's own save reliability, and so the two can never block or
// interleave with each other. Reuses detectStorageBackend() directly
// (already generic/parameterless) rather than detecting the backend twice.
// ---------------------------------------------------------------------------
const AGENT_CONVERSATION_OPFS_FILENAME = "kg-agent-conversation.json";
const AGENT_CONVERSATION_LOCALSTORAGE_KEY = "kg-agent-conversation";

async function writeAgentConversationPayload(payload) {
  const backend = await detectStorageBackend();
  const json = JSON.stringify(payload);
  if (backend === "opfs") {
    try {
      const root = await navigator.storage.getDirectory();
      const fileHandle = await root.getFileHandle(AGENT_CONVERSATION_OPFS_FILENAME, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(json);
      await writable.close();
    } catch (err) {
      console.warn("[KG Canvas] OPFS save failed (agent conversation):", err);
    }
  } else if (backend === "localStorage") {
    try {
      localStorage.setItem(AGENT_CONVERSATION_LOCALSTORAGE_KEY, json);
    } catch (err) {
      console.warn("[KG Canvas] localStorage save failed (agent conversation):", err);
    }
  }
}

async function readAgentConversationPayload() {
  const backend = await detectStorageBackend();
  if (backend === "opfs") {
    try {
      const root = await navigator.storage.getDirectory();
      const fileHandle = await root.getFileHandle(AGENT_CONVERSATION_OPFS_FILENAME, { create: false });
      const file = await fileHandle.getFile();
      const text = await file.text();
      return text ? JSON.parse(text) : null;
    } catch (err) {
      if (!err || err.name !== "NotFoundError") console.warn("[KG Canvas] OPFS load failed (agent conversation):", err);
      return null;
    }
  }
  if (backend === "localStorage") {
    try {
      const text = localStorage.getItem(AGENT_CONVERSATION_LOCALSTORAGE_KEY);
      return text ? JSON.parse(text) : null;
    } catch (err) {
      console.warn("[KG Canvas] localStorage load failed (agent conversation):", err);
      return null;
    }
  }
  return null;
}

async function writeAgentConversationToStorage() {
  await writeAgentConversationPayload({
    transcript: agentState.transcript,
    apiMessages: agentState.apiMessages,
    savedAt: Date.now(),
  });
}

// Coalescing save loop, identical shape to Tier 1's own scheduleSave/
// runSaveLoop above (see that comment) but a fully independent instance —
// its own flags, its own in-flight write — so it can never block on or
// interleave with the graph's own save loop.
let agentConversationSaveScheduled = false;
let agentConversationSaveRunning = false;
let agentConversationSaveIdleResolvers = [];

function scheduleAgentConversationSave() {
  agentConversationSaveScheduled = true;
  runAgentConversationSaveLoop();
}

async function runAgentConversationSaveLoop() {
  if (agentConversationSaveRunning) return;
  agentConversationSaveRunning = true;
  while (agentConversationSaveScheduled) {
    agentConversationSaveScheduled = false;
    await writeAgentConversationToStorage();
  }
  agentConversationSaveRunning = false;
  const resolvers = agentConversationSaveIdleResolvers;
  agentConversationSaveIdleResolvers = [];
  resolvers.forEach((resolve) => resolve());
}

// Test hook, same purpose as whenSaveIdle() above: lets a test await a
// deterministic "no save in flight or queued" point instead of guessing.
function whenAgentConversationSaveIdle() {
  if (!agentConversationSaveRunning && !agentConversationSaveScheduled) return Promise.resolve();
  return new Promise((resolve) => agentConversationSaveIdleResolvers.push(resolve));
}

// A gap under this is treated as "just reloaded, nothing has likely
// changed" and restores silently (still shown via the restore note, just
// without the extra re-check instruction). Above it, a synthetic message is
// spliced into apiMessages telling the agent explicitly that time passed
// and to call get_graph_state before continuing (helper_agent_plan.md
// §9.4) -- nothing else gives the model any way to perceive that a gap
// happened at all, since apiMessages alone carries no wall-clock signal.
const AGENT_RESUME_GAP_THRESHOLD_MS = 5 * 60 * 1000;

function formatAgentResumeGap(ms) {
  const minutes = Math.round(ms / 60000);
  if (minutes < 60) return `${minutes} minute${minutes === 1 ? "" : "s"}`;
  const hours = Math.round(ms / 3600000);
  if (hours < 48) return `${hours} hour${hours === 1 ? "" : "s"}`;
  const days = Math.round(ms / 86400000);
  return `${days} day${days === 1 ? "" : "s"}`;
}

// Loaded at boot, before any BYOK connection is made — mirrors
// loadGraphFromStorage()'s own posture: restoring is silent data
// hydration, never an auto-action. The transcript is rendered as soon as
// the panel is later shown (renderAgentTranscript() runs immediately
// here), but nothing here ever calls the OpenAI API on its own; the user
// still has to click Connect, same as a remembered API key today only
// pre-fills the input, never auto-connects. Returns {restored, gapMs}
// mainly for tests — the actual transcript notes are appended here, not by
// the caller, since they need to already be part of the transcript array
// boot() renders, in order.
async function loadAgentConversationFromStorage() {
  const data = await readAgentConversationPayload();
  if (!data || !Array.isArray(data.transcript) || !Array.isArray(data.apiMessages)) {
    return { restored: false, gapMs: 0 };
  }
  if (!data.transcript.length && !data.apiMessages.length) {
    return { restored: false, gapMs: 0 }; // nothing to restore
  }
  agentState.transcript = data.transcript.filter((m) => m && typeof m.role === "string" && typeof m.text === "string");
  agentState.apiMessages = data.apiMessages.filter((m) => m && typeof m.role === "string");
  const savedAt = typeof data.savedAt === "number" ? data.savedAt : Date.now();
  const gapMs = Math.max(0, Date.now() - savedAt);
  appendTranscriptMessage("system", t("agentConversationRestored", agentState.transcript.length));
  if (agentState.apiMessages.length && gapMs > AGENT_RESUME_GAP_THRESHOLD_MS) {
    const gapText = formatAgentResumeGap(gapMs);
    // Invisible in the transcript by design, same convention as the
    // compaction summary splice above (sendAgentChatMessage/
    // compactAgentHistory) — a real instruction to the model, not
    // something the human said. The separate transcript note right after
    // is what makes the *fact* that this happened visible to the user.
    agentState.apiMessages.push({
      role: "user",
      content: `[Session resumed after a gap of roughly ${gapText} -- the ontology may have changed outside this conversation since the last message. Call get_graph_state before continuing.]`,
    });
    appendTranscriptMessage("system", t("agentConversationResumeGapNote", gapText));
  }
  return { restored: true, gapMs };
}

// Tracks the *kind* of the last connect error (not pre-rendered text) so
// applyAgentLanguage() can re-render it correctly after a language toggle
// instead of leaving a stale-language message on screen.
let agentConnectErrorKind = null; // null | "emptyKey" | "invalidKey" | "network" | "noModels" | {status}

function renderAgentConnectError() {
  const el = document.getElementById("agent-connect-error");
  if (!agentConnectErrorKind) { el.textContent = ""; return; }
  if (agentConnectErrorKind === "emptyKey") el.textContent = t("agentErrorEmptyKey");
  else if (agentConnectErrorKind === "invalidKey") el.textContent = t("agentErrorInvalidKey");
  else if (agentConnectErrorKind === "network") el.textContent = t("agentErrorNetwork");
  else if (agentConnectErrorKind === "noModels") el.textContent = t("agentErrorNoModels");
  else if (agentConnectErrorKind && typeof agentConnectErrorKind === "object") el.textContent = t("agentErrorGeneric", agentConnectErrorKind.status);
  else el.textContent = "";
}

function setAgentConnectError(kind) {
  agentConnectErrorKind = kind;
  renderAgentConnectError();
}

// GET /v1/models with the given key. Returns the parsed model list on
// success ({id, created}[]); throws {kind: "invalidKey"|"network"|{status}}
// on failure, so the caller can drive setAgentConnectError() directly. A
// transient 429 (rate_limit_exceeded) is retried with backoff before that;
// see AGENT_RATE_LIMIT_MAX_ATTEMPTS's own comment.
async function fetchOpenAiModels(apiKey) {
  for (let attempt = 1; attempt <= AGENT_RATE_LIMIT_MAX_ATTEMPTS; attempt++) {
    let res;
    try {
      res = await fetch(OPENAI_MODELS_URL, {
        method: "GET",
        headers: { Authorization: `Bearer ${apiKey}` },
      });
    } catch (err) {
      throw { kind: "network" };
    }
    if (res.status === 401) throw { kind: "invalidKey" };
    if (res.status === 429) {
      let errJson = null;
      try { errJson = await res.json(); } catch (err) { /* some error bodies aren't JSON */ }
      const isPermanentQuotaError = errJson && errJson.error && errJson.error.code === "insufficient_quota";
      if (!isPermanentQuotaError && attempt < AGENT_RATE_LIMIT_MAX_ATTEMPTS) {
        await sleepMs(agentRateLimitBackoffMs(attempt));
        continue;
      }
      throw { kind: { status: 429 } };
    }
    if (!res.ok) throw { kind: { status: res.status } };
    let json;
    try {
      json = await res.json();
    } catch (err) {
      throw { kind: "network" };
    }
    const data = Array.isArray(json && json.data) ? json.data : [];
    return data
      .filter((m) => m && typeof m.id === "string")
      .map((m) => ({ id: m.id, created: typeof m.created === "number" ? m.created : 0 }));
  }
}

function populateAgentModelSelects(models, selectedId) {
  const sorted = [...models].sort((a, b) => (b.created || 0) - (a.created || 0));

    const select = document.getElementById(id);
    select.textContent = "";
    for (const m of sorted) {
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = m.id === selectedId ? `${m.id} ★` : m.id;
      select.appendChild(opt);
    }
    select.disabled = sorted.length === 0;
    if (selectedId) select.value = selectedId;
  }
}

async function submitAgentConnect() {
  const submitBtn = document.getElementById("agent-connect-submit");

  if (agentConnectStage === "key") {

      agentPendingKey = key;
      agentPendingModels = models;

      document.getElementById("agent-model-select-modal").disabled = false;
      agentConnectStage = "model";
    } catch (err) {
      setAgentConnectError((err && err.kind) || "network");
    } finally {
      submitBtn.disabled = false;
      updateAgentConnectSubmitLabel();

    return;

  const chosenModel = document.getElementById("agent-model-select-modal").value;
  const remember = document.getElementById("agent-remember-key").checked;
  agentState.apiKey = agentPendingKey;
  agentState.rememberKey = remember;
  agentState.models = agentPendingModels;
  agentState.model = chosenModel;
  agentState.promptCacheKey = `kg-agent-${crypto.randomUUID()}`;
  agentState.connected = true;

    if (remember) {
      localStorage.setItem(AGENT_KEY_STORAGE_KEY, agentPendingKey);
      localStorage.setItem(AGENT_MODEL_STORAGE_KEY, chosenModel || "");
    } else {
      localStorage.removeItem(AGENT_KEY_STORAGE_KEY);
      localStorage.removeItem(AGENT_MODEL_STORAGE_KEY);

  } catch (err) { /* best-effort only, mirrors the language/theme persistence precedent */ }
  populateAgentModelSelects(agentPendingModels, chosenModel);
  setAgentConnectedUi(true);
  closeAgentConnectModal();
}

// Drag-to-resize (issue #55). Same pointer-capture pattern as the canvas's
// own drag interactions (setPointerCapture on down, release on up/cancel)
// so the drag keeps tracking even if the pointer strays off the 6px handle
// mid-drag. Live width applied on every pointermove -- no throttling needed,
// applyAgentPanelWidth() is just a style write + a cheap resizeCanvas() -- so
// the panel visibly tracks the pointer instead of lagging behind it.
{
  const handle = document.getElementById("agent-panel-resize-handle");
  let dragStartX = 0;
  let dragStartWidth = 0;

  handle.addEventListener("pointerdown", (e) => {
    dragStartX = e.clientX;
    dragStartWidth = agentState.panelWidth;
    handle.classList.add("dragging");
    document.getElementById("toolbar").classList.add("resizing-panel");
    document.getElementById("canvas-wrap").classList.add("resizing-panel");
    try { handle.setPointerCapture(e.pointerId); } catch (err) { /* pointer no longer active -- drag just won't track off-handle */ }
  });

  handle.addEventListener("pointermove", (e) => {
    if (!handle.hasPointerCapture(e.pointerId)) return;
    applyAgentPanelWidth(dragStartWidth + (e.clientX - dragStartX));
  });

  function endResizeDrag(e) {
    handle.classList.remove("dragging");
    document.getElementById("toolbar").classList.remove("resizing-panel");
    document.getElementById("canvas-wrap").classList.remove("resizing-panel");
    try { handle.releasePointerCapture(e.pointerId); } catch (err) { /* already released or never captured */ }
  }
  handle.addEventListener("pointerup", endResizeDrag);
  handle.addEventListener("pointercancel", endResizeDrag);
}

## How to describe a domain for an AI agent

# How to Describe a Domain for an AI Agent

This guide helps you create a small, useful description of your domain without technical modeling knowledge.

The goal is simple: describe only what the agent must **recognize, connect, compare, decide, or change**.

## 1. List the important kinds of things

Write down the main business objects the agent needs to understand.

Examples:

- Invoice
- Supplier
- Employee
- Purchase order

Use familiar singular names. Avoid database table names.

## 2. Give each thing a short meaning

Use one plain sentence.

\`\`\`yaml
Invoice:
  meaning: A request from a supplier to receive payment.
\`\`\`

## 3. Add common alternative names

Include words that users may use for the same concept.

\`\`\`yaml
Supplier:
  meaning: An organization providing goods or services.
  aliases: [vendor]
\`\`\`

Use aliases only when the words mean the same thing in your setting.

## 4. Describe the important connections

Write each connection as:

\`\`\`text
Thing --relationship--> Other thing
\`\`\`

Example:

\`\`\`text
Invoice --issued by--> Supplier
Invoice --matches--> Purchase order
Employee --works for--> Department
\`\`\`

Give every relationship a clear verb phrase.

## 5. Add only decision-relevant properties

A property is a value the agent may need to identify, filter, compare, explain, or change.

Good examples:

- invoice number
- amount
- status
- due date
- risk level
- approval limit

Do not include technical fields that users never ask about.

\`\`\`yaml
Invoice:
  properties:
    invoiceNumber:
      type: text
    amount:
      type: number
      unit: EUR
    status:
      allowed: [draft, matched, disputed, approved, paid]
    dueDate:
      type: date
\`\`\`

## 6. Use fixed choices where possible

When a property has a small set of valid values, list them.

\`\`\`yaml
riskStatus:
  allowed: [clear, review-required, blocked]
\`\`\`

This prevents inconsistent wording.

## 7. Add simple rules only when needed

Write rules as ordinary conditions.

\`\`\`yaml
canApproveInvoice:
  conditions:
    - invoice status is matched
    - supplier risk status is clear
    - invoice amount is within the employee approval limit
\`\`\`

Keep rules separate from descriptions.

## 8. Describe actions separately

For each action, state:

- what it acts on;
- what must be true first;
- what changes;
- how success is checked.

\`\`\`yaml
action: approveInvoice
input: Invoice
preconditions:

effect:

verification:

\`\`\`

classes:

    properties:
      invoiceNumber: {type: text}
      amount: {type: number, unit: EUR}
      status:
        allowed: [draft, matched, disputed, approved, paid]

    meaning: An organization providing goods or services.

relationships:

rules:
  canApproveInvoice:
    conditions:

      - supplier risk status is clear
      - invoice amount is within the employee approval limit

actions:
  approveInvoice:
    input: Invoice
    preconditions: [canApproveInvoice]
    effect: invoice status becomes approved
    verification: confirm the new invoice status
\`\`\`

Before finishing, ask:

1. Does every class represent something users talk about?
2. Does every relationship have a clear direction and verb?
3. Does every property help identify, filter, decide, explain, or act?
4. Are common synonyms included?
5. Are fixed value lists used where appropriate?
6. Are important actions protected by explicit conditions?

If an item does not help the agent perform a real task, leave it out.

## Reference TXT edge-list loader (Python, for describing the .txt export/import format precisely if asked)

\`\`\`python
"""Reference loader for the Knowledge Graph Canvas TXT edge-list format
(spec.md Section 5.2). Standard library only, no dependencies.

This is the exact snippet from spec.md's Appendix, kept in sync by hand —
see tools/test_load_edge_list.py. index.html's own importer (Section 5.3)
additionally does label-matched merge/replace against live graph state;
this module is read-only, for external scripts/pipelines.
"""

import sys


def load_edge_list(path):
    nodes, edges = [], []
    section = None
    # utf-8-sig (not plain utf-8) so a leading BOM — which Windows tools like
    # Notepad/Excel add by default on "Save As UTF-8" — is stripped before
    # line processing. Without this, the BOM prefixes the file's first
    # line, so it never equals "## NODES" literally and every node in the
    # file is silently dropped (edges still parse, since "## EDGES" appears
    # later in the file, past where the BOM's effect only reaches). Decodes
    # identically to plain utf-8 when there's no BOM.
    with open(path, encoding="utf-8-sig") as f:
        for raw in f:
            line = raw.strip()
            # Section headers are checked before the generic "#" comment
            # skip below, since "## NODES"/"## EDGES" also start with "#" —
            # checking the comment rule first would make both headers
            # unreachable and the loader would parse nothing at all.
            if line == "## NODES":
                section = "nodes"
                continue
            if line == "## EDGES":
                section = "edges"
                continue
            if not line or line.startswith("#"):
                continue
            if section == "nodes":
                if line:
                    nodes.append({"label": line})
            elif section == "edges":
                if " : " not in line:
                    continue  # malformed — no relation separator, skip
                conn, relation = line.rsplit(" : ", 1)
                if "<->" in conn:
                    directed = False
                    src, tgt = conn.split("<->", 1)
                elif "->" in conn:
                    directed = True
                    src, tgt = conn.split("->", 1)
                else:
                    continue  # malformed — no connector, skip
                src, tgt, relation = src.strip(), tgt.strip(), relation.strip()
                if src and tgt and relation:
                    edges.append({
                        "source": src,
                        "target": tgt,
                        "relation": relation,
                        "directed": directed,
                    })
    return nodes, edges


if __name__ == "__main__":
    if len(sys.argv) != 2:
        print(f"usage: {sys.argv[0]} <path-to-txt-file>", file=sys.stderr)
        sys.exit(1)
    import json
    parsed_nodes, parsed_edges = load_edge_list(sys.argv[1])
    print(json.dumps({"nodes": parsed_nodes, "edges": parsed_edges}, indent=2))
\`\`\`

## Background: why this model looks the way it does

Condensed from "A Minimal Semantic Representation for Domain-Grounded AI
Agents" (Szabados, 2026), sections 4, 7, and 9 — the operational parts, not
the formal proofs. This tool is the paper's own reference implementation.

### The formalism (paper section 4)

The model is a Minimal Typed Semantic Representation (MTSR): classes,
datatypes/value-sets, predicates, an optional subclass relation, and a
lexical layer (preferred label, aliases, short definition) per class and
relationship.

The key move: a "relationship" and a "property" are not different kinds of
thing. Both are predicates, distinguished only by what they point at — a
predicate whose target is another class (like \`issuedBy: Invoice ->
Supplier\`) is what this tool's YAML calls a relationship; a predicate whose
target is a datatype or a fixed value set (like \`status: Invoice ->
{draft, matched, ...}\`) is what this tool calls a property. That's why the
YAML shape has both \`relationships\` and per-class \`properties\` instead of
forcing everything into one or the other.

Two things earn their place for reasons beyond "seemed useful": the lexical
layer (meaning/aliases) exists because a purely symbolic schema is
invariant under renaming, while a natural-language user's phrasing is not
— so without labels/aliases an LLM can't reliably map "vendor" to \`Supplier\`.
Boundary constraints (required, allowed values, numeric bounds) are kept
separate from the core model because open-world semantic entailment cannot
treat an absent value as invalid — a closed-world check is a genuinely
different kind of thing, evaluated only at query/action boundaries, not
baked into what a class or predicate "means."

Actions in the full paper's formal model are \`<name, inputs, preconditions,
effect, authorization, verification>\` — this tool's own action fields
(input, preconditions, effect, verification) are the operational subset;
authorization/enforcement is deliberately left to systems outside this
tool, same as the paper's own worked example ("the language model may
propose the action; preconditions and authorization checks should be
enforced outside the model").

### Recommended minimal profile (paper section 7)

A practical way to decide how much to model, in increasing order — don't
skip to a higher level than a class actually needs:

- **Level 0 — relation backbone.** Classes and relationships only. Enough
  for an agent that just navigates/retrieves connected entities.
- **Level 1 — decision properties.** Add properties only when they're used
  to identify, filter, compare, decide, explain, or populate a tool call.
  A practical target is 3-10 agent-visible properties per important class
  — not every field a database happens to have.
- **Level 2 — action-boundary constraints.** Add \`required\`/\`allowed\`/
  numeric bounds only where invalid or missing data must actually block an
  action.
- **Level 3 — optional extensions** (subclassing, inverse predicates,
  disjointness, provenance, rule engines, full OWL profiles) are
  deliberately out of scope for this tool. If a domain seems to need them,
  say so plainly rather than trying to approximate them in this format.

### Construction method (paper section 9)

The paper's own recommended sequence for building a model like this one,
which the interview process below mirrors phase-for-phase:

1. Collect 20-50 real questions and 5-15 real actions the agent must
   handle — don't start by documenting every field in every system.
2. Promote a noun to a class only when the agent must identify it,
   retrieve it, connect it to other objects, or pass it to a tool.
3. Promote a verb phrase to a relationship only when it's a stable,
   navigable connection between two classes.
4. Promote a value to a property only when it shows up in a real filter,
   comparison, action precondition, tool parameter, or explanation.
5. Add one preferred label, aliases, and one short definition per class
   and relationship. Treat near-synonyms carefully — two words can mean
   the same thing in one setting and different things in another.
6. Mark a property required or bounded only where its absence or an
   invalid value would actually have to change what the agent does.
7. (Deployment-time, not authoring: record which external system each
   predicate is sourced from, and which source wins on disagreement.)
8. (Runtime, not authoring: an agent should be handed only the relevant
   classes/paths/properties for its current task, not the whole model.)
9. Test every class/property/rule/action against the real questions and
   actions from step 1 — something that doesn't help answer or perform any
   of them shouldn't be in the model.

Steps 7-8 are about production deployment and runtime retrieval, not this
conversation — mentioned here only for completeness; nothing about them
changes how you conduct the interview.
`;
