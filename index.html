<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tudásgráf Vászon</title>
<!-- Empty inline favicon: stops the browser's automatic GET /favicon.ico
     request. Harmless under file://, but that request 404s (and logs a
     console error) when the app is served over http(s) — e.g. Tier 2/3
     real-world usage, or tests/phase4.spec.mjs's OPFS-over-http suite,
     which asserts on zero console errors. Still zero external requests
     (spec.md §2): a data: URI, not a fetched file. -->
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    /* Shared look-and-feel tokens (radius/timing don't need a per-theme
       value, only the colors below do) — one place to retune the overall
       feel instead of a magic number repeated at every call site. */
    --radius-sm: 6px;
    --radius-md: 10px;
    --transition-fast: 120ms ease;
    /* Design critique (2026-08) #1: the app otherwise reads as the generic
       dark-mode-plus-one-accent default with no point of view of its own.
       spec.md §2 rules out a web font (zero external requests, single
       dependency-free file), so the one distinctive choice available is a
       system monospace stack -- fitting for what this tool actually is
       (structured, typed knowledge: classes, relations, rules), and
       spent in exactly one place (the graph name and every dialog's own
       title) rather than diluted across the whole UI. Body text, buttons,
       and canvas labels stay on the existing system-ui stack -- legibility
       for high-frequency reading matters more there than a signature. */
    --font-display: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", "Liberation Mono", monospace;
    --toolbar-bg: #1e1e1e;
    --toolbar-fg: #e8e8e8;
    --toolbar-border: #333;
    --btn-bg: #2c2c2c;
    --btn-bg-hover: #3a3a3a;
    --card-bg: rgba(255, 255, 255, 0.035);
    --btn-bg-active: #4a4a4a;
    --accent: #4da6ff;
    --accent-bg-pressed: rgba(77, 166, 255, 0.16);
    /* Semantic colors split off from --accent (design critique, 2026-08):
       one blue was standing in for "selected", "an interaction mode is
       currently armed", "this persistent setting is on", and "the agent
       touched this" all at once -- indistinguishable from each other in a
       real session. --accent now means selection/focus only; these three
       cover the other meanings. */
    /* Transient canvas mode (Add Node / Connect) -- same hue as
       --connect-source-stroke below, deliberately: both mean "actively
       placing/connecting right now". */
    --mode-armed: #ffb84d;
    --mode-armed-bg: rgba(255, 184, 77, 0.16);
    /* Persistent on/off setting (theme, language, folder sync). */
    --state-active: #5fbf8f;
    --state-active-bg: rgba(95, 191, 143, 0.16);
    /* Helper Agent provenance (chat bubbles, tool-outcome notes). */
    --agent-accent: #b592f0;
    --danger: #a64d4d;
    --danger-fg: #d16a6a;
    --shadow-color: rgba(0, 0, 0, 0.45);
    --shadow-sm: 0 1px 3px var(--shadow-color);
    --shadow-md: 0 6px 20px var(--shadow-color);
    --canvas-bg: #121212;
    --grid-dot: #2a2a2a;
    --empty-fg: #666;
    /* Canvas2D draw colors (Section 6) — read via getComputedStyle at render
       time (see resolveColors() in the script below), since a canvas
       fillStyle/strokeStyle can't reference a CSS var() directly. Keeping
       every themeable color here, dark or canvas, means the toggle has one
       source of truth instead of a parallel JS palette that could drift. */
    --node-fill: #242424;
    --node-stroke: #666666;
    --node-stroke-selected: #4da6ff;
    --node-stroke-connected: #2dd4bf;
    --connect-source-stroke: #ffb84d;
    --node-text: #e8e8e8;
    --handle-fill: rgba(255, 255, 255, 0.35);
    --imported-stroke: #e0b13f;
    --edge-stroke: #8a8a8a;
    --edge-stroke-selected: #4da6ff;
    --edge-stroke-connected: #2dd4bf;
    --edge-label-fg: #bbbbbb;
    --ghost-stroke: #4da6ff;
  }

  /* Explicit user toggle (not prefers-color-scheme) — see toggleTheme() in
     the script. Defaults to dark (root, above) so an untouched app looks
     exactly as it always has; this block only applies once the user opts
     into light mode, and the choice is remembered via localStorage. */
  :root[data-theme="light"] {
    color-scheme: light;
    --toolbar-bg: #f5f5f5;
    --toolbar-fg: #1a1a1a;
    --toolbar-border: #d0d0d0;
    --btn-bg: #ffffff;
    --btn-bg-hover: #e8e8e8;
    --btn-bg-active: #d5d5d5;
    --card-bg: rgba(0, 0, 0, 0.025);
    --accent: #1a73e8;
    --accent-bg-pressed: rgba(26, 115, 232, 0.1);
    --mode-armed: #e67700;
    --mode-armed-bg: rgba(230, 119, 0, 0.1);
    --state-active: #2f8a5c;
    --state-active-bg: rgba(47, 138, 92, 0.1);
    --agent-accent: #7c3aed;
    --shadow-color: rgba(0, 0, 0, 0.15);
    --canvas-bg: #fafafa;
    --grid-dot: #d8d8d8;
    --empty-fg: #999999;
    --node-fill: #ffffff;
    --node-stroke: #999999;
    --node-stroke-selected: #1a73e8;
    --node-stroke-connected: #0f766e;
    --connect-source-stroke: #e67700;
    --node-text: #1a1a1a;
    --handle-fill: rgba(0, 0, 0, 0.35);
    --imported-stroke: #b8860b;
    --edge-stroke: #666666;
    --edge-stroke-selected: #1a73e8;
    --edge-stroke-connected: #0f766e;
    --edge-label-fg: #555555;
    --ghost-stroke: #1a73e8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  #toolbar {
    position: fixed;
    top: 0;
    /* Shifts right by the same amount as #canvas-wrap below when the agent
       panel is expanded (issue #55 -- "shrink the graph area accordingly,
       and I also mean the header menu here"), so the toolbar never sits
       underneath the panel. 0 while collapsed (the default and every
       existing test's state), which is byte-identical to the old fixed
       `left: 0` -- zero layout change for anything that never opens the
       panel or drags its resize handle. */
    left: var(--agent-panel-offset, 0px);
    right: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--toolbar-bg);
    color: var(--toolbar-fg);
    border-bottom: 1px solid var(--toolbar-border);
    box-shadow: var(--shadow-sm);
    transition: left var(--transition-fast);
  }

  #toolbar button {
    font-size: 14px;
    line-height: 1;
    padding: 8px 14px;
    color: var(--toolbar-fg);
    background: var(--btn-bg);
    border: 1px solid var(--toolbar-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    transition: background-color var(--transition-fast), border-color var(--transition-fast),
      transform var(--transition-fast), box-shadow var(--transition-fast);
  }

  #toolbar button:hover {
    background: var(--btn-bg-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  #toolbar button:active {
    background: var(--btn-bg-active);
    transform: translateY(0);
    box-shadow: none;
  }

  /* An "armed" toggle (Add Node, Connect, Theme, Language, Folder
     Sync once connected) reads as a status, not just a slightly-darker
     button — an accent-colored border/tint makes which mode is active
     legible at a glance instead of blending into the row. */
  #toolbar button[aria-pressed="true"] {
    background: var(--accent-bg-pressed);
    border-color: var(--accent);
    color: var(--accent);
  }

  #toolbar button[aria-pressed="true"]:hover {
    background: var(--accent-bg-pressed);
  }

  /* Transient interaction mode (Add Node / Connect) -- a different color
     from plain selection/focus so "the canvas is in a special input mode
     right now" doesn't read as identical to "something is selected"
     elsewhere in the UI. */
  #toolbar button.mode-armed[aria-pressed="true"] {
    background: var(--mode-armed-bg);
    border-color: var(--mode-armed);
    color: var(--mode-armed);
  }

  #toolbar button.mode-armed[aria-pressed="true"]:hover {
    background: var(--mode-armed-bg);
  }

  /* Persistent on/off setting (theme, language, folder sync) -- distinct
     again from both selection and mode-armed, since it's neither. */
  #toolbar button.state-toggle[aria-pressed="true"] {
    background: var(--state-active-bg);
    border-color: var(--state-active);
    color: var(--state-active);
  }

  #toolbar button.state-toggle[aria-pressed="true"]:hover {
    background: var(--state-active-bg);
  }

  #toolbar button.toolbar-danger {
    border-color: var(--danger);
    color: var(--danger-fg);
  }

  #toolbar button:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none;
    box-shadow: none;
  }

  #toolbar button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  #toolbar .spacer {
    flex: 1 1 auto;
  }

  /* Groups related toolbar buttons (edit / data / view / settings) behind a
     thin divider instead of one undifferentiated row -- so scanning the
     toolbar doesn't require reading every label to tell which buttons are
     related. Purely visual: doesn't change any button's id, so nothing
     that clicks a button by id needs to change alongside this. */
  #toolbar .toolbar-group {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 8px;
    margin-right: 4px;
    border-right: 1px solid var(--toolbar-border);
  }

  #toolbar .toolbar-group.toolbar-group-end {
    border-right: none;
    padding-right: 0;
    margin-right: 0;
  }

  #toolbar .zoom-group {
    display: flex;
    gap: 3px;
  }

  #toolbar .zoom-group button {
    width: 36px;
    padding: 8px 0;
    text-align: center;
    font-size: 16px;
  }

  #graph-title {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 10px;
    /* Clears #agent-panel-toggle -- a fixed z-index:25 overlay always
       sitting at page x:[0,40], regardless of the agent panel's
       expand/collapse state (only the panel *body*'s own width is
       conditional; the toggle itself never moves) -- which otherwise sits
       on top of the toolbar's own z-index:10 and covers this element's
       first ~28px whenever the toolbar starts at its default left:0 (i.e.
       whenever --agent-panel-offset is unset, whether because the panel is
       collapsed or JS hasn't run yet on first paint). Without this, the
       graph name's own first couple of characters render invisibly under
       the toggle button at every viewport width. 36px = the toggle's 40px
       width, minus #toolbar's own 12px left padding (already providing
       some clearance), plus an 8px gap -- not tied to --agent-panel-offset
       itself: that variable already handles shifting everything further
       right once the panel *expands* past the toggle's own footprint;
       this is the separate, always-on baseline the toggle needs
       regardless of expand state. */
    margin-left: 36px;
    margin-right: 4px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--toolbar-fg);
    white-space: nowrap;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background-color var(--transition-fast);
  }

  #graph-title:hover,
  #graph-title:focus-visible {
    background: var(--btn-bg-hover);
    outline: none;
  }

  #graph-title:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  #canvas-wrap {
    position: fixed;
    inset: 0;
    /* Overrides just the left edge of `inset: 0` -- see #toolbar's own
       comment on --agent-panel-offset (issue #55). resizeCanvas() is
       called after every change to this value (panel expand/collapse and
       live drag-resize alike) so the canvas's internal buffer and the
       camera's screen-space math stay in sync with the shrunk box; nothing
       here needs its own resize handling beyond that. */
    left: var(--agent-panel-offset, 0px);
    background: var(--canvas-bg);
    transition: left var(--transition-fast);
  }

  /* Suppressed during an active drag (see the resize-handle pointer
     handlers) -- animating every intermediate width during a drag reads as
     laggy instead of responsive; a live user's own hand movement is already
     smoother than any CSS transition could be. */
  #canvas-wrap.resizing-panel,
  #toolbar.resizing-panel {
    transition: none;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }

  #canvas.panning {
    cursor: grabbing;
  }

  #canvas.mode-addnode,
  #canvas.mode-connect {
    cursor: crosshair;
  }

  #import-file-input {
    display: none;
  }

  .kg-inline-input {
    position: fixed;
    transform: translate(-50%, -50%);
    z-index: 20;
    font-size: 14px;
    padding: 7px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--node-stroke-selected);
    background: var(--toolbar-bg);
    color: var(--toolbar-fg);
    min-width: 140px;
    box-shadow: var(--shadow-md);
  }

  #sel-toolbar {
    position: fixed;
    display: none;
    gap: 6px;
    transform: translate(-50%, -170%);
    z-index: 15;
  }

  #sel-toolbar button {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--toolbar-border);
    background: var(--btn-bg);
    color: var(--toolbar-fg);
    cursor: pointer;
    box-shadow: var(--shadow-md);
    transition: background-color var(--transition-fast), transform var(--transition-fast);
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  #sel-toolbar button:hover {
    background: var(--btn-bg-hover);
    transform: scale(1.08);
  }

  #sel-trash:hover {
    border-color: var(--danger);
    color: var(--danger-fg);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
    z-index: 30;
  }

  .modal-dialog {
    max-width: 380px;
    margin: 16px;
    padding: 20px;
    border-radius: var(--radius-md);
    background: var(--toolbar-bg);
    border: 1px solid var(--toolbar-border);
    color: var(--toolbar-fg);
    box-shadow: var(--shadow-md);
  }

  .modal-message {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-line;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .modal-actions button {
    font-size: 14px;
    padding: 8px 16px;
    color: var(--toolbar-fg);
    background: var(--btn-bg);
    border: 1px solid var(--toolbar-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background-color var(--transition-fast);
  }

  .modal-actions button:hover {
    background: var(--btn-bg-hover);
  }

  #confirm-ok,
  #import-replace {
    border-color: var(--danger) !important;
  }

  /* Agent Ontology (agent_ontology_spec.md §7): Class/Relationship details
     dialog, and the Domain Model (Rules/Actions) dialog below it, which
     reuses this same structure. Reuses .modal-overlay/.modal-dialog/
     .modal-actions above — these rules only add what's specific to this
     dialog's form fields.
     A Domain Model dialog holding a few dozen rules/actions can run to
     several thousand pixels of content — this used to be one scrolling
     column with Save/Cancel at the very bottom, meaning saving or
     cancelling required scrolling through everything first. Split into a
     scrollable .details-dialog-body and a non-scrolling
     .details-dialog-footer so the buttons stay reachable regardless of
     how long the content is; padding moves from the dialog itself onto
     the body/footer so the footer's top border can span the full width. */
  .details-dialog {
    max-width: 640px;
    width: 90vw;
    max-height: 85vh;
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* Design critique (2026-08) #6: this dialog (and #domain-model-dialog,
       which reuses this same class) is the actual value-prop editor --
       classes/relationships/rules/actions, the real work of the app --
       but shared the exact same chrome as a plain "are you sure?" confirm
       box, with nothing marking it as the bigger, structured, more
       important screen. A top accent bar (only overriding that one edge
       of .modal-dialog's own uniform 1px border above, not the shorthand
       itself) is the one differentiator; the rest of the chrome -- radius,
       shadow, background -- stays shared with every other dialog so this
       still reads as "the same app," just this screen's own emphasis. */
    border-top: 3px solid var(--accent);
  }

  .details-dialog-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 0; /* let this actually shrink/scroll inside the flex column instead of forcing the dialog to grow */
  }

  .details-dialog-footer {
    flex: 0 0 auto;
    padding: 12px 20px;
    margin: 0;
    border-top: 1px solid var(--toolbar-border);
  }

  .modal-title {
    font-family: var(--font-display);
    margin: 0 0 14px;
    font-size: 16px;
    font-weight: 600;
  }

  .details-field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    opacity: 0.8;
    margin: 14px 0 6px;
  }

  /* Domain Model dialog's per-section Rules/Actions filter — plain text
     search, substring/case-insensitive against the card's name field, pure
     client-side show/hide (see filterDomainModelCards() in the script
     below). Sits right under the section label, above the card list. */
  .details-filter-input {
    width: 100%;
    box-sizing: border-box;
    font: inherit;
    font-size: 13px;
    padding: 6px 9px;
    margin-bottom: 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--toolbar-border);
    background: var(--btn-bg);
    color: var(--toolbar-fg);
  }

  /* Sub-field labels inside a Domain Model rule/action card (Conditions,
     Input class, Preconditions, Effect, Verification). Unlike the
     placeholder text on the fields themselves, these stay visible once a
     field is filled in — without them, a filled-in Effect input and a
     filled-in Verification input are two visually identical text boxes
     with no way to tell which is which at a glance. */
  .details-field-sublabel {
    display: block;
    font-size: 11px;
    font-weight: 600;
    opacity: 0.65;
    margin: 2px 0 0;
  }

  .details-textarea,
  .details-list input,
  .details-list select {
    font: inherit;
    font-size: 14px;
    padding: 7px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--toolbar-border);
    background: var(--btn-bg);
    color: var(--toolbar-fg);
  }

  .details-textarea {
    width: 100%;
    box-sizing: border-box;
    resize: vertical;
  }

  .details-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .details-row {
    display: flex;
    gap: 6px;
    /* top-align rather than stretch: a condition row's remove button
       shouldn't stretch to match its textarea's (possibly multi-line)
       height -- it should just sit at the top corner like it did next to
       a single-line input. */
    align-items: flex-start;
  }

  .details-row input,
  .details-row textarea {
    flex: 1;
    min-width: 0;
  }

  .details-property-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    border: 1px solid var(--toolbar-border);
    border-radius: var(--radius-sm);
  }

  .details-property-row-top,
  .details-property-row-bottom {
    display: flex;
    gap: 6px;
  }

  .details-property-name {
    flex: 1;
    min-width: 0;
  }

  .details-property-type {
    flex: 0 0 auto;
  }

  .details-property-unit,
  .details-property-allowed {
    flex: 1 1 0;
    min-width: 0;
  }

  .details-row-remove {
    flex: 0 0 auto;
    width: 28px;
    /* Matches a single-line input/textarea row's own height (padding +
       border + line-height) so the button doesn't look squished now that
       .details-row top-aligns instead of stretching -- was implicitly
       "whatever height the row stretches it to" before. */
    min-height: 34px;
    padding: 0;
    border-radius: var(--radius-sm);
    border: 1px solid var(--toolbar-border);
    background: var(--btn-bg);
    color: var(--toolbar-fg);
    cursor: pointer;
    transition: background-color var(--transition-fast);
  }

  .details-row-remove:hover {
    background: var(--btn-bg-hover);
  }

  .details-add-btn {
    margin-top: 6px;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    border: 1px dashed var(--toolbar-border);
    background: transparent;
    color: var(--toolbar-fg);
    cursor: pointer;
    transition: background-color var(--transition-fast);
  }

  .details-add-btn:hover {
    background: var(--btn-bg-hover);
  }

  /* Agent Ontology — Rules/Actions manager cards. Same bordered-card
     treatment as .details-property-row above, plus a subtle background
     tint and shadow on top of it -- with a dozen-plus cards stacked in a
     long scrolling list, a 1px border alone reads as one continuous strip
     once you're mid-scroll; the tint gives each card a visible boundary
     even without the border in view. */
  .domain-model-rule-card,
  .domain-model-action-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px;
    border: 1px solid var(--toolbar-border);
    border-radius: var(--radius-sm);
    background: var(--card-bg);
    box-shadow: var(--shadow-sm);
  }

  .dm-rule-conditions {
    margin-left: 8px;
  }

  /* Preconditions checkbox list (replaces a native <select multiple>,
     which needed a held Ctrl/Cmd click to select more than one option --
     see refreshActionPreconditionOptions()'s own comment). Its own
     scrollable box, separate from the dialog body's scroll, so a long
     rule list doesn't force the whole action card to be enormous. */
  .dm-action-preconditions {
    display: flex;
    flex-direction: column;
    max-height: 160px;
    overflow-y: auto;
    border: 1px solid var(--toolbar-border);
    border-radius: var(--radius-sm);
    background: var(--btn-bg);
  }

  .dm-precondition-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 9px;
    font-size: 14px;
    cursor: pointer;
  }

  .dm-precondition-option:hover {
    background: var(--btn-bg-hover);
  }

  .dm-precondition-checkbox {
    flex: 0 0 auto;
    margin: 0;
    cursor: pointer;
  }

  .dm-preconditions-empty {
    padding: 8px 9px;
    font-size: 13px;
    opacity: 0.65;
  }

  #restore-toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(8px);
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    background: var(--toolbar-bg);
    border: 1px solid var(--toolbar-border);
    color: var(--toolbar-fg);
    box-shadow: var(--shadow-md);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-fast), transform var(--transition-fast);
    z-index: 40;
  }

  #restore-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Helper Agent (helper_agent_plan.md §4.2) — collapsed/expanded chat
     panel, fixed to the left edge per the original vision ("a chat bar at
     the left"). Collapsed by default; expanding never resizes the canvas
     underneath it, it just overlays. */
  #agent-panel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 25;
    display: flex;
    align-items: stretch;
    pointer-events: none;
  }

  #agent-panel-toggle {
    pointer-events: auto;
    align-self: flex-start;
    margin: 12px 0 0 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--toolbar-border);
    border-left: none;
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    background: var(--toolbar-bg);
    color: var(--toolbar-fg);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
  }

  /* Design critique (2026-08) #8: gives the agent toggle the same hover
     lift #toolbar buttons already have (translateY + a deeper shadow),
     so the two otherwise-separate fixed-position chrome systems at least
     agree on what "interactive" feels like, not just what colors they
     share (already true before this -- both already read
     var(--toolbar-bg)/var(--btn-bg-hover)/var(--toolbar-border)). */
  #agent-panel-toggle:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
    background: var(--btn-bg-hover);
  }

  #agent-panel-body {
    pointer-events: auto;
    /* Default/fallback for before JS applies the persisted or dragged
       width as an inline style (issue #55) -- an inline style always wins
       over this, so nothing here needs to track that value. */
    width: 320px;
    max-width: 85vw;
    display: none;
    flex-direction: column;
    background: var(--toolbar-bg);
    border-right: 1px solid var(--toolbar-border);
    box-shadow: var(--shadow-md);
    padding: 14px;
    box-sizing: border-box;
    overflow-y: auto;
  }

  #agent-panel.expanded #agent-panel-body {
    display: flex;
  }

  /* Drag-to-resize handle (issue #55 -- "make the chat panel resizable").
     A flex sibling of #agent-panel-body, not an absolutely-positioned
     overlay on top of it: #agent-panel is already `display: flex; align-
     items: stretch`, so a plain flex item naturally sits at the body's
     right edge and spans its full height with no extra positioning rules
     to keep in sync if the body's own height ever changes. */
  #agent-panel-resize-handle {
    display: none;
    pointer-events: auto;
    flex: none;
    width: 6px;
    margin-left: -3px; /* centers the 6px grab target on the body's own border */
    cursor: ew-resize;
    background: transparent;
    transition: background-color var(--transition-fast);
  }

  #agent-panel.expanded #agent-panel-resize-handle {
    display: block;
  }

  #agent-panel-resize-handle:hover,
  #agent-panel-resize-handle.dragging {
    background: var(--accent);
  }

  .agent-panel-intro {
    font-size: 13px;
    line-height: 1.5;
    opacity: 0.85;
    margin: 0 0 14px;
  }

  .agent-panel-header {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 10px;
  }

  /* #agent-connect-open, the two icon buttons in .agent-panel-header, and
     #agent-chat-send had no explicit background/color rule at all, so they
     fell back to the browser's native unstyled button chrome (opaque white
     in most browsers, regardless of color-scheme) while still inheriting
     the panel's light dark-mode text color -- unreadable light-on-white
     (issue #58). Same tokens as every other themed button in the app. */
  #agent-connect-open,
  #agent-chat-send {
    font-size: 14px;
    padding: 7px 9px;
    color: var(--toolbar-fg);
    background: var(--btn-bg);
    border: 1px solid var(--toolbar-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background-color var(--transition-fast);
  }

  #agent-connect-open:hover,
  #agent-chat-send:hover {
    background: var(--btn-bg-hover);
  }

  #agent-chat-send:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .agent-panel-header button {
    width: 28px;
    height: 28px;
    flex: none;
    border-radius: 50%;
    border: 1px solid var(--toolbar-border);
    background: var(--btn-bg);
    color: var(--toolbar-fg);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background-color var(--transition-fast);
  }

  .agent-panel-header button:hover {
    background: var(--btn-bg-hover);
  }

  #agent-model-select {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--toolbar-border);
    background: var(--btn-bg);
    color: var(--toolbar-fg);
  }

  .agent-connect-error {
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.4;
    color: #e08a8a;
    white-space: pre-line;
  }

  .agent-connect-error:empty {
    display: none;
  }

  .agent-remember-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 10px 0 0;
    font-size: 13px;
  }

  #agent-key-input {
    width: 100%;
    box-sizing: border-box;
    font: inherit;
    font-size: 14px;
    padding: 7px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--toolbar-border);
    background: var(--btn-bg);
    color: var(--toolbar-fg);
  }

  .agent-transcript {
    flex: 1;
    min-height: 120px;
    max-height: 40vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 13px;
  }

  .agent-transcript-msg {
    padding: 6px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--toolbar-border);
    background: var(--btn-bg);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* User/assistant bubbles use --agent-accent, not --accent -- a chat
     message and a selected canvas node are different things and shouldn't
     share a color (design critique, 2026-08). */
  .agent-msg-user {
    align-self: flex-end;
    border-color: var(--agent-accent);
  }

  .agent-msg-system {
    font-style: italic;
    opacity: 0.75;
    font-size: 12px;
  }

  /* Tool-outcome notes (applied/skipped/nothing-to-apply/error) get the
     same agent-accent border as a user bubble — a visible, at-a-glance
     signal that this line is about a real (or attempted) canvas edit, not
     just conversation, per the vision's "real time presents what the
     chatbot edited" requirement. */
  .agent-msg-tool {
    border-color: var(--agent-accent);
    font-size: 12px;
    opacity: 0.9;
  }

  .agent-typing-indicator {
    font-size: 12px;
    opacity: 0.6;
    font-style: italic;
    margin: -2px 0 8px;
  }

  .agent-no-tools-note {
    font-size: 12px;
    opacity: 0.7;
    margin: 0 0 10px;
  }

  .agent-input-row {
    display: flex;
    align-items: flex-end; /* keeps Send pinned to the textarea's bottom edge as it grows/resizes */
    gap: 6px;
  }

  /* issue #55: a taller default (rows="2" in the markup, ~2 lines instead
     of the previous single-line <input>), real multi-line wrapping, and a
     manual drag handle (resize: vertical) on top of that -- three separate
     asks in the issue, all satisfied by switching the element itself from
     <input type="text"> to <textarea>. Plain Enter still submits (see the
     keydown handler); Alt+Enter inserts a line break, which is a
     <textarea>'s own native behavior once Enter alone isn't intercepted --
     no extra handling needed for that half of the toggle. */
  #agent-chat-input {
    flex: 1;
    min-width: 0;
    min-height: 52px;
    max-height: 40vh;
    resize: vertical;
    font: inherit;
    font-size: 14px;
    line-height: 1.4;
    padding: 7px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--toolbar-border);
    background: var(--btn-bg);
    color: var(--toolbar-fg);
  }

  .agent-forget-key-row {
    margin: 10px 0 0;
  }

  #agent-forget-key {
    font-size: 12px;
    padding: 5px 9px;
    color: var(--toolbar-fg);
    background: transparent;
    border: 1px dashed var(--toolbar-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }

  #agent-forget-key:hover {
    background: var(--btn-bg-hover);
  }
</style>
</head>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Camera: pan offset (screen px at scale=1) + zoom scale. World -> screen:
//   screenX = worldX * scale + panX
//   screenY = worldY * scale + panY
// ---------------------------------------------------------------------------
const camera = { panX: 0, panY: 0, scale: 1 };
const MIN_SCALE = 0.01;
const MAX_SCALE = 100;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let dirty = true;
function markDirty() { dirty = true; }

// ---------------------------------------------------------------------------
// Dark/light theme toggle (out-of-spec, user-requested, same standing as the
// Clear button). Explicit user choice, not prefers-color-scheme — a manual
// toggle should override the OS setting, not follow it. Applied synchronously
// here, at top-level script scope rather than inside boot(), so the correct
// theme is set on <html> before the first paint/render (no dark-then-light
// flash). Persisted in localStorage under its own key, deliberately separate
// from the graph's own Tier 1 payload (storage.mjs) — this is a UI
// preference, not graph data, and should survive Clear/import/new-graph
// unaffected by any of that. Reading localStorage can throw in some locked-
// down embeds; degrades to the dark default rather than breaking boot.
// ---------------------------------------------------------------------------
const THEME_STORAGE_KEY = "kg-theme";
let theme = "dark";
try {
  if (localStorage.getItem(THEME_STORAGE_KEY) === "light") theme = "light";
} catch (err) { /* localStorage unavailable — stay on the dark default */ }
document.documentElement.dataset.theme = theme;

function updateThemeButton() {
  const btn = document.getElementById("btn-theme-toggle");
  if (!btn) return;
  // Reads as a status ("Theme: Dark"), not a command — a bare "Dark Mode"
  // label would be ambiguous about whether it names the current state or
  // the mode you're about to switch to.
  btn.textContent = theme === "light" ? t("themeLight") : t("themeDark");
  btn.setAttribute("aria-pressed", String(theme === "light"));
}

function toggleTheme() {
  theme = theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch (err) { /* best-effort only */ }
  updateThemeButton();
  markDirty(); // canvas colors (resolveColors()) depend on the theme too
}

// ---------------------------------------------------------------------------
// Hungarian/English localization (out-of-spec, user-requested). Covers UI
// chrome only — toolbar labels, dialog text, placeholders, tooltips, the
// canvas empty-state message — never graph *content* (node labels, edge
// relations, the graph's own name once renamed): those are user data, not
// app interface, and translating them automatically would silently mangle
// what the user actually typed.
//
// Same standing and same pattern as the theme toggle: an explicit toggle
// (never inferred from navigator.language), defaulting to Hungarian per
// the request, persisted under its own localStorage key independent of
// both the theme key and the graph's own Tier 1 payload, and applied
// synchronously at top-level script scope so the correct language is
// already on every element before first paint — no flash of the other
// language on load.
//
// Dynamic strings (ones with a count, or that embed another string) are
// functions rather than plain values, called through the same t() lookup
// as static ones — every call site already asks for its text at the exact
// moment it's needed (opening a dialog, drawing a frame), so those need no
// separate "re-apply on toggle" step the way static DOM text does.
// ---------------------------------------------------------------------------
const STRINGS = {
  en: {
    appTitle: "Knowledge Graph Canvas",
    clickToRename: "Click to rename",
    untitledGraph: "Untitled Graph",
    addNode: "Add Node",
    connect: "Connect",
    autoLayout: "Auto-layout",
    undo: "Undo",
    redo: "Redo",
    saveVersion: "Save Version",
    folderSync: "Folder Sync",
    folderSynced: (name) => `Synced: ${name}`,
    importButton: "Import", // handles both .txt (spec.md §5.3) and .domain.yaml (agent_ontology_spec.md §11, Phase G)
    clear: "Clear",
    zoomOut: "Zoom out",
    zoomIn: "Zoom in",
    fitView: "Fit to view",
    themeDark: "Theme: Dark",
    themeLight: "Theme: Light",
    renameTitle: "Rename",
    toggleDirTitle: "Toggle direction",
    deleteTitle: "Delete",
    cancel: "Cancel",
    ok: "OK",
    replace: "Replace",
    merge: "Merge",
    clearConfirmMessage: "Clear the entire graph? This removes all nodes and edges. This can be undone with the Undo button.",
    clearConfirmLabel: "Clear",
    nodeLabelPlaceholder: "Node label",
    relationLabelPlaceholder: "relation label",
    graphNamePlaceholder: "Graph name",

const LANG_STORAGE_KEY = "kg-lang";
let lang = "hu";
try {
  const stored = localStorage.getItem(LANG_STORAGE_KEY);
  if (stored === "en" || stored === "hu") lang = stored;
} catch (err) { /* localStorage unavailable — stay on the Hungarian default */ }
document.documentElement.lang = lang;

// t("key") for plain strings; t("key", ...args) calls a dynamic entry
// (e.g. t("folderSynced", handle.name)) with those args.
function t(key, ...args) {
  const entry = STRINGS[lang][key];
  return typeof entry === "function" ? entry(...args) : entry;
}

// Best-effort heuristic, used only to migrate a payload saved before
// state.graphNameIsDefault existed (loadGraphFromStorage) — the live app
// itself tracks "never renamed" explicitly instead of inferring it from a
// string match, since a user deliberately renaming to this exact literal
// text is indistinguishable from "never touched" under a match alone (see
// state.graphNameIsDefault's own comment).
function isDefaultGraphName(name) {
  return name === STRINGS.en.untitledGraph || name === STRINGS.hu.untitledGraph;
}

// Refreshes every *static* DOM element's translated text — the button
// labels, dialog copy, and tooltips that exist once and just need updating
// in place on toggle. Placeholders and dialog messages built at the
// moment a prompt opens (showInlineInput/showConfirmDialog/import summary)
// already call t() directly at that moment, so they need no entry here.
function applyLanguage() {
  document.documentElement.lang = lang;
  document.title = t("appTitle");
  const byId = (id) => document.getElementById(id);
  const titleEl = byId("graph-title");
  titleEl.title = t("clickToRename");
  if (state.graphNameIsDefault) {
    state.graphName = t("untitledGraph");
    titleEl.textContent = state.graphName;
  }
  byId("btn-add-node").textContent = t("addNode");
  byId("btn-connect").textContent = t("connect");
  byId("btn-domain-model").textContent = t("domainModel");
  byId("btn-autolayout").textContent = t("autoLayout");
  byId("btn-undo").textContent = t("undo");
  byId("btn-redo").textContent = t("redo");
  byId("btn-save-version").textContent = t("saveVersion");
  byId("btn-import-txt").textContent = t("importButton");
  byId("btn-clear").textContent = t("clear");
  byId("btn-zoom-out").setAttribute("aria-label", t("zoomOut"));
  byId("btn-zoom-in").setAttribute("aria-label", t("zoomIn"));
  byId("btn-fit-view").setAttribute("aria-label", t("fitView"));
  byId("sel-rename").title = t("renameTitle");
  byId("sel-details").title = t("editDetailsTitle");
  byId("sel-toggle-dir").title = t("toggleDirTitle");
  byId("sel-trash").title = t("deleteTitle");
  byId("confirm-cancel").textContent = t("cancel");
  byId("confirm-ok").textContent = t("ok");
  byId("import-cancel").textContent = t("cancel");
  byId("import-replace").textContent = t("replace");
  byId("import-merge").textContent = t("merge");
  byId("details-meaning-label").textContent = t("meaningLabel");
  byId("details-aliases-label").textContent = t("aliasesLabel");
  byId("details-properties-label").textContent = t("propertiesLabel");
  byId("details-add-alias").textContent = t("addAlias");
  byId("details-add-property").textContent = t("addProperty");
  byId("details-cancel").textContent = t("cancel");
  byId("details-save").textContent = t("save");
  updateDetailsTitle(); // no-op if the dialog isn't open — see its own definition
  byId("domain-model-title").textContent = t("domainModel");
  updateDomainModelCounts(); // sets both section labels, including their "(N)" count
  byId("domain-model-rules-filter").placeholder = t("rulesFilterPlaceholder");
  byId("domain-model-actions-filter").placeholder = t("actionsFilterPlaceholder");
  byId("domain-model-add-rule").textContent = t("addRule");
  byId("domain-model-add-action").textContent = t("addAction");
  byId("domain-model-cancel").textContent = t("cancel");
  byId("domain-model-save").textContent = t("save");
  // Unlike this dialog's own top-level labels above, a rule/action card's
  // sub-labels (Conditions/Input class/Preconditions/Effect/Verification)
  // are baked into the DOM once at card-creation time (createSublabel()) —
  // this dialog can stay open across a language toggle, so already-open
  // cards need their own refresh pass, not just the dialog's static chrome.
  for (const el of document.querySelectorAll(".details-field-sublabel[data-i18n-key]")) {
    el.textContent = t(el.dataset.i18nKey);
  }
  updateThemeButton(); // its text depends on theme, not language, but re-set here too for the aria-pressed-adjacent pattern
  updateFolderSyncButton(); // "Folder Sync" / "Synced: X" text is language-dependent
  updateLangButton();
  applyAgentLanguage();
  markDirty(); // the canvas empty-state message is language-dependent too
}

  const byId = (id) => document.getElementById(id);

function updateLangButton() {
  const btn = document.getElementById("btn-lang-toggle");
  if (!btn) return;
  // Bilingual by construction, not looked up via t(): shows the *current*
  // language's own name for itself, in that language, mirroring the
  // status-not-command convention the theme toggle already established.
  btn.textContent = lang === "hu" ? "Nyelv: Magyar" : "Language: English";
  btn.setAttribute("aria-pressed", String(lang === "en"));
}

function toggleLanguage() {
  lang = lang === "hu" ? "en" : "hu";
  try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch (err) { /* best-effort only */ }
  applyLanguage();
}

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

function screenToWorld(sx, sy) {
  return { x: (sx - camera.panX) / camera.scale, y: (sy - camera.panY) / camera.scale };
}

function worldToScreen(wx, wy) {
  return { x: wx * camera.scale + camera.panX, y: wy * camera.scale + camera.panY };
}

function zoomAt(screenX, screenY, factor) {
  const newScale = clamp(camera.scale * factor, MIN_SCALE, MAX_SCALE);
  if (newScale === camera.scale) return;
  const world = screenToWorld(screenX, screenY);
  camera.scale = newScale;
  camera.panX = screenX - world.x * newScale;
  camera.panY = screenY - world.y * newScale;
  markDirty();
}

// Recenters and zooms the camera so every node fits on screen with some
// margin. The camera starts at (and, absent this, never leaves)
// panX:0/panY:0/scale:1 — a freshly imported or laid-out graph can easily
// have a bounding box far larger than one screen, or centered somewhere
// other than world-origin, leaving nodes and their relationships genuinely
// off-screen with no built-in way to find them except manual pan/zoom.
// Camera state isn't part of `state`/history, so calling this has no
// undo/redo implications. Caps zoom-IN at 1 (never past 100%) — a graph
// smaller than the viewport should stay at a natural scale, not balloon up
// to fill it.
function fitViewToContent() {
  if (state.nodes.length === 0 || cssWidth === 0 || cssHeight === 0) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of state.nodes) {
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w);
    maxY = Math.max(maxY, n.y + n.h);
  }
  const PADDING = 80;
  const contentW = Math.max(1, maxX - minX + PADDING * 2);
  const contentH = Math.max(1, maxY - minY + PADDING * 2);
  const scale = clamp(Math.min(cssWidth / contentW, cssHeight / contentH), MIN_SCALE, 1);
  const centerX = (minX + maxX) / 2;
  const centerY = (minY + maxY) / 2;
  camera.scale = scale;
  camera.panX = cssWidth / 2 - centerX * scale;
  camera.panY = cssHeight / 2 - centerY * scale;
  markDirty();
}

// ---------------------------------------------------------------------------
// Data model (spec Section 4). Ids are monotonic counters, never reused.
// ---------------------------------------------------------------------------
const state = {
  nodes: [],
  edges: [],
  selection: { type: null, id: null }, // type: 'node' | 'edge' | null
  mode: "idle", // 'idle' | 'addNode' | 'connect'
  connectSource: null,
  nextNodeNum: 1,
  nextEdgeNum: 1,
  // Always-visible, always-editable (click the toolbar title) — not tied to
  // ever having saved. Used verbatim for display; sanitized only at the
  // point a filename is actually built (Section 5.4).
  graphName: t("untitledGraph"),
  // Tracks "never renamed" explicitly rather than inferring it from
  // `graphName` matching the placeholder text — a string-equality check
  // can't tell "never touched" apart from a user deliberately renaming to
  // that exact literal string, which used to mean *that* choice got
  // silently overwritten on the next language toggle, indistinguishable
  // from having never been renamed at all.
  graphNameIsDefault: true,
  // Set on first "Save Version": {format_version, graph_id, version,
  // created, saved}. null until then — nothing has been exported yet, so
  // there's no version history to speak of.
  meta: null,
  // Agent Ontology (agent_ontology_spec.md §4.3): named condition sets and
  // named operations. Neither is graph-shaped (no source/target, nothing to
  // draw as a box or an arrow), so they live as flat top-level lists rather
  // than nodes/edges — same reasoning that already keeps camera/selection
  // out of the node/edge model.
  nextRuleNum: 1,
  nextActionNum: 1,
  rules: [],
  actions: [],
};

const DEFAULT_NODE_W = 160;
const DEFAULT_NODE_H = 60;

function genNodeId() { return `n${state.nextNodeNum++}`; }
function genEdgeId() { return `e${state.nextEdgeNum++}`; }
function genRuleId() { return `r${state.nextRuleNum++}`; }
function genActionId() { return `a${state.nextActionNum++}`; }

// Every node is a Class (agent_ontology_spec.md §2 — groups were removed
// entirely, see the dated Log entry, so this is no longer a "non-group
// node" qualifier, it's just every node).
function createNode(x, y, label) {
  const node = {
    id: genNodeId(),
    label,
    x, y, w: DEFAULT_NODE_W, h: DEFAULT_NODE_H,
    // `meaning` replaces the old `notes` field (never exposed in any
    // editor, so this is a rename, not new state).
    meaning: null,
    aliases: [],
    properties: [],
  };
  state.nodes.push(node);
  markDirty();
  return node;
}

function createEdge(sourceId, targetId, relation, directed = true) {
  const edge = {
    id: genEdgeId(), source: sourceId, target: targetId, relation, directed,
    meaning: null, // agent_ontology_spec.md §4.2
    // Relationships get aliases the same way classes always have (below) —
    // added after a live ontology-recovery eval found the interviewer
    // routinely eliciting real relationship synonyms from a domain expert
    // ("affects → impacts, degrades, disrupts") with nowhere to store them,
    // since edges had no alias concept at all. See helper_agent_todo.md's
    // dated addendum for the real transcript that surfaced this.
    aliases: [],
  };
  state.edges.push(edge);
  markDirty();
  return edge;
}

// Agent Ontology data-model constructors (agent_ontology_spec.md §4.3).
// Deliberately as bare as createNode()/createEdge() above — no undo-history
// registration here either; that's always the caller's job (see the call
// sites around createNode/createEdge for the pattern), and no UI calls
// these yet (Phase B/C/D/E of agent_ontology_todo.md).
function createRule(name, conditions = []) {
  const rule = { id: genRuleId(), name, conditions: [...conditions] };
  state.rules.push(rule);
  markDirty();
  return rule;
}

function createAction(name, inputClassId, preconditions = [], effect = "", verification = "") {
  const action = {
    id: genActionId(), name, inputClassId,
    preconditions: [...preconditions], effect, verification,
  };
  state.actions.push(action);
  markDirty();
  return action;
}

function deleteRule(id) {
  const idx = state.rules.findIndex((r) => r.id === id);
  if (idx === -1) return;
  state.rules.splice(idx, 1);
  // Same "clean up the reference, don't block or cascade-delete" posture as
  // deleteNode()'s inputClassId cleanup below — preconditions are stored by
  // rule id specifically so a deletion like this stays a non-catastrophic,
  // silent cleanup rather than an orphaned/dangling reference.
  for (const a of state.actions) {
    const pi = a.preconditions.indexOf(id);
    if (pi !== -1) a.preconditions.splice(pi, 1);
  }
  markDirty();
}

function deleteAction(id) {
  const idx = state.actions.findIndex((a) => a.id === id);
  if (idx === -1) return;
  state.actions.splice(idx, 1);
  markDirty();
}

function deleteNode(id) {
  const idx = state.nodes.findIndex((n) => n.id === id);
  if (idx === -1) return;
  state.nodes.splice(idx, 1);
  state.edges = state.edges.filter((e) => e.source !== id && e.target !== id);
  // An Action referencing this node as its input class loses the reference,
  // not the whole action — its effect/verification/preconditions text is
  // still meaningful even without an input class (agent_ontology_spec.md
  // §7's Actions manager treats a null inputClassId as "unset").
  for (const a of state.actions) {
    if (a.inputClassId === id) a.inputClassId = null;
  }
  if (state.selection.type === "node" && state.selection.id === id) clearSelection();
  markDirty();
}

function deleteEdge(id) {
  const idx = state.edges.findIndex((e) => e.id === id);
  if (idx === -1) return;
  state.edges.splice(idx, 1);
  if (state.selection.type === "edge" && state.selection.id === id) clearSelection();
  markDirty();
}

// ---------------------------------------------------------------------------
// Undo/redo (Section 8, Decision #8): command-pattern stack, one entry per
// discrete user action, restored via a full {nodes, edges} snapshot rather
// than tracked per-action deltas — matches the spec's own description of
// autolayout as "one before snapshot," generalized to every action here for
// correctness by construction (no mutation can forget to register its
// inverse). Id counters are intentionally NOT part of the snapshot: ids are never
// reused (Section 4.1), so they must keep incrementing across undo/redo.
// Nothing here is persisted — it's just these two in-memory arrays, so a
// reload always starts with an empty stack (Section 8).
// ---------------------------------------------------------------------------
const history = { past: [], future: [] };

// Agent Ontology's aliases[]/properties[] (nodes) and rules[]/actions[]
// arrays get the same explicit-clone treatment: a shallow `{...n}` would
// leave the array reference shared between snapshots, so a later in-place
// mutation would silently corrupt an already-pushed "before" snapshot. No
// UI mutates rules/actions this way yet, but snapshotState/restoreSnapshot
// are meant to be correct for every field unconditionally, not just the
// ones currently reachable from the UI.
function snapshotState() {
  return {
    nodes: state.nodes.map((n) => ({
      ...n,
      aliases: [...n.aliases],
      properties: n.properties.map((p) => ({ ...p })),
    })),
    // edge.aliases needs the same fresh-array treatment as node.aliases
    // above -- a bare `{ ...e }` shallow-copies the edge object but leaves
    // `aliases` pointing at the *same* array instance, so a later edit that
    // reassigns state.edges[i].aliases is safe, but any future code that
    // ever mutated the array in place (a push/splice instead of a full
    // reassignment) would silently corrupt every past undo/redo snapshot
    // sharing that same array reference.
    edges: state.edges.map((e) => ({ ...e, aliases: [...(e.aliases || [])] })),
    rules: state.rules.map((r) => ({ ...r, conditions: [...r.conditions] })),
    actions: state.actions.map((a) => ({ ...a, preconditions: [...a.preconditions] })),
    // Only the canonical-JSON "Replace (full restore)" path (spec.md §5.5)
    // rewrites these two, but every snapshot carries them so undo/redo of
    // *that* action is one step like every other. Deliberately excludes the
    // nextNodeNum/nextEdgeNum/... counters: those must stay monotonic, since
    // rewinding them would let a later create hand out an id that a redo is
    // about to bring back.
    meta: state.meta ? { ...state.meta } : null,
    graphName: state.graphName,
    graphNameIsDefault: state.graphNameIsDefault,
  };
}

function restoreSnapshot(snap) {
  state.nodes = snap.nodes.map((n) => ({
    ...n,
    aliases: [...n.aliases],
    properties: n.properties.map((p) => ({ ...p })),
  }));
  state.edges = snap.edges.map((e) => ({ ...e, aliases: [...(e.aliases || [])] }));
  state.rules = snap.rules.map((r) => ({ ...r, conditions: [...r.conditions] }));
  state.actions = snap.actions.map((a) => ({ ...a, preconditions: [...a.preconditions] }));
  // Guarded rather than assigned outright: a snapshot taken before these
  // fields existed (one already sitting in the history stack when this
  // shipped) has neither, and clobbering the live name with `undefined`
  // would blank the title bar on the next undo.
  if (snap.meta !== undefined) state.meta = snap.meta ? { ...snap.meta } : null;
  if (typeof snap.graphName === "string") {
    state.graphName = snap.graphName;
    state.graphNameIsDefault = Boolean(snap.graphNameIsDefault);
    syncGraphTitleUi();
  }
}

// The graph title is plain DOM text kept in sync by hand at every write site
// (rename, import, undo/redo) rather than re-rendered from state each frame —
// this is the one shared setter so a new write site can't forget the DOM half.
function syncGraphTitleUi() {
  const el = document.getElementById("graph-title");
  if (el) el.textContent = state.graphName;
}

function pushHistory(before, after) {
  newlyImportedIds = new Set(); // any new discrete action retires the "just imported" highlight
  history.past.push({ before, after });
  history.future = [];
  updateUndoRedoButtons();
  scheduleSave();
}

function undo() {
  if (history.past.length === 0) return;
  const entry = history.past.pop();
  restoreSnapshot(entry.before);
  history.future.push(entry);
  clearSelection();
  updateUndoRedoButtons();
  markDirty();
  scheduleSave();
}

function redo() {
  if (history.future.length === 0) return;
  const entry = history.future.pop();
  restoreSnapshot(entry.after);
  history.past.push(entry);
  clearSelection();
  updateUndoRedoButtons();
  markDirty();
  scheduleSave();
}

function updateUndoRedoButtons() {
  document.getElementById("btn-undo").disabled = history.past.length === 0;
  document.getElementById("btn-redo").disabled = history.future.length === 0;
}

// ---------------------------------------------------------------------------
// Autolayout (Section 8): explicit-only, never automatic. Force-directed
// (Fruchterman-Reingold style) relaxation of node *centers* — repulsion
// between every pair of nodes, not just connected ones, so disconnected
// components still spread apart instead of piling up; attraction along
// edges. Fully deterministic for a given graph — no RNG involved, and
// nothing to seed (see the multi-start note below for what that now means
// in practice). A fixed iteration count with a cooling schedule guarantees
// termination (no risk of hanging) regardless of graph shape.
//
// issue #64 ("Crowded graph layout") iteration 1: the relaxation's "ideal
// distance" used to be one flat constant (150px) shared by every pair,
// completely disconnected from each node's actual footprint
// (DEFAULT_NODE_W/H = 160x60). That constant is *smaller* than the box
// width itself, so two nodes at their own force equilibrium could still
// land with overlapping boxes whenever they happened to end up roughly
// horizontally aligned — not a rare edge case, but the expected outcome
// for a meaningful fraction of pairs in any graph with more than a
// handful of nodes (confirmed during development against a real-world-
// scale (~50 node) ontology: 8 overlapping node-box pairs). The per-pair
// ideal distance is instead derived from each
// node's own bounding-circle radius (half its diagonal) — the smallest
// value that *guarantees* two boxes can't overlap at that separation
// regardless of their relative angle, since each box sits entirely inside
// its own circumscribed circle. It's applied identically to repulsion (all
// pairs) and attraction (edges), so connected nodes still settle near
// their pair's own ideal distance instead of drifting to whatever the flat
// constant used to imply.
//
// iteration 2 (superseding an earlier, reverted attempt at scaling spacing
// by node degree — see git history: it cut crossings on a synthetic
// hub-heavy fixture but *increased* them on a larger real-world-scale test
// ontology, and a gentler version flipped which fixture it helped, meaning
// the effect wasn't a real structural fix, just moving which local
// minimum a single deterministic relaxation happened to land in): rather
// than trying to out-guess the relaxation's local minima with more spacing
// heuristics, run it from a small, fixed set of different deterministic
// starting layouts (today's positions, plus a circular and a grid seed —
// still no randomness anywhere) and keep whichever settled result has the
// fewest edge crossings (ties broken by smaller bounding-box area). This
// is a direct, honest fight against local minima instead of an indirect
// one, and it can only ever do as well as or better than the old
// single-start behavior, since "today's positions" is always one of the
// candidates.
// ---------------------------------------------------------------------------
// Pure position-mutation core, no snapshot/history of its own -- pulled out
// of autoLayout() below (issue #57) so a commit path that wants the reflow
// folded into its OWN single undo step (see commitTxtImport/commitYamlImport)
// can call it directly instead of getting a second, separate history entry
// the way calling the public autoLayout() wrapper would produce. Callers
// are responsible for the `state.nodes.length < 2` guard themselves --
// see autoLayout() below for why that check has to happen before, not
// inside, this function.
const REPULSION_MARGIN = 24; // extra clearance beyond two boxes' circumscribed circles just touching

// Bounded, deterministic post-pass: the FR relaxation above optimizes
// average spacing, not a hard non-overlap guarantee, so a small number of
// dense/awkward pairs can still finish touching or overlapping even with
// size-aware repulsion (a fixed iteration count trades off against
// hanging, not against reaching a perfect equilibrium). This directly
// resolves any node-box pairs still overlapping (beyond REPULSION_MARGIN
// of clearance) by nudging each apart along whichever axis needs the
// least movement to separate their rectangles — same "minimum translation
// vector" technique used for AABB collision resolution. Bounded to
// OVERLAP_PASS_MAX_ITERATIONS so, like the relaxation above, it always
// terminates regardless of graph shape.
const OVERLAP_PASS_MAX_ITERATIONS = 60;

function resolveNodeOverlaps(nodes, margin) {
  for (let iter = 0; iter < OVERLAP_PASS_MAX_ITERATIONS; iter++) {
    let anyOverlap = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const overlapX = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) + margin;
        const overlapY = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) + margin;
        if (overlapX <= 0 || overlapY <= 0) continue; // already clear on at least one axis
        anyOverlap = true;
        // Separate along whichever axis needs less movement to clear —
        // the direction (which node moves which way) follows their
        // current center order on that axis, so neither jumps past the
        // other.
        if (overlapX < overlapY) {
          const dir = (a.x + a.w / 2) < (b.x + b.w / 2) ? -1 : 1;
          a.x += dir * overlapX / 2;
          b.x -= dir * overlapX / 2;
        } else {
          const dir = (a.y + a.h / 2) < (b.y + b.h / 2) ? -1 : 1;
          a.y += dir * overlapY / 2;
          b.y -= dir * overlapY / 2;
        }
      }
    }
    if (!anyOverlap) break;
  }
}

// Runs the FR relaxation itself starting from `initialCenters`, returning a
// fresh array of settled centers — no state.nodes mutation, so the same
// core can be scored and compared across several candidate starting
// layouts before any of them is committed.
// True exactly when every point shares (near enough) the same x, or the
// same y -- i.e. the seed is collinear on one axis, or (at n<=1) trivially
// has no spread to speak of either way.
function isAxisDegenerate(points) {
  if (points.length < 2) return true;
  const xs = points.map((p) => p.x);
  const ys = points.map((p) => p.y);
  const spread = (vals) => Math.max(...vals) - Math.min(...vals);
  return spread(xs) < 1 || spread(ys) < 1;
}

function relaxCenters(initialCenters, radii, indexById, edges) {
  const iterations = 200;
  let temperature = 100; // max displacement per iteration, cooled to ~0
  // A seed that's perfectly collinear (or co-located) on one axis is an
  // unstable equilibrium for pairwise force relaxation: every repulsion/
  // attraction vector stays exactly parallel to that one axis, so no number
  // of iterations can ever introduce the missing axis on its own. This is
  // not hypothetical -- gridSeed() and circularSeed() both collapse to a
  // 2-node line at n<=2, and the "today's positions" seed is exactly
  // collinear whenever computeImportShelf() placed a handful of fresh
  // imports in a single row (the common case for a first import into an
  // empty canvas), which used to relax into a perfectly flat, single-row
  // layout no matter how sparse or cyclic the actual graph was. A
  // deterministic, per-index sub-pixel offset -- applied only when the seed
  // actually needs it, so an already-2D seed (in particular, re-running
  // Auto-layout on its own prior, already-relaxed output) passes through
  // byte-for-byte unchanged and stays idempotent -- guarantees a non-zero
  // second axis for the physics to relax into.
  const centers = isAxisDegenerate(initialCenters)
    ? initialCenters.map((c, i) => ({
        x: c.x + ((i % 5) - 2) * 0.2,
        y: c.y + (((i * 3 + 1) % 5) - 2) * 0.2,
      }))
    : initialCenters.map((c) => ({ x: c.x, y: c.y }));
  const pairIdealDist = (i, j) => radii[i] + radii[j] + REPULSION_MARGIN;

  for (let iter = 0; iter < iterations; iter++) {
    const disp = centers.map(() => ({ x: 0, y: 0 }));

    for (let i = 0; i < centers.length; i++) {
      for (let j = i + 1; j < centers.length; j++) {
        let dx = centers[i].x - centers[j].x;
        let dy = centers[i].y - centers[j].y;
        const dist = Math.hypot(dx, dy) || 0.01; // guard against exact overlap
        const idealDist = pairIdealDist(i, j);
        const force = (idealDist * idealDist) / dist;
        dx = (dx / dist) * force;
        dy = (dy / dist) * force;
        disp[i].x += dx; disp[i].y += dy;
        disp[j].x -= dx; disp[j].y -= dy;
      }
    }

    for (const edge of edges) {
      const i = indexById.get(edge.source);
      const j = indexById.get(edge.target);
      if (i === undefined || j === undefined || i === j) continue;
      let dx = centers[i].x - centers[j].x;
      let dy = centers[i].y - centers[j].y;
      const dist = Math.hypot(dx, dy) || 0.01;
      const idealDist = pairIdealDist(i, j);
      const force = (dist * dist) / idealDist;
      dx = (dx / dist) * force;
      dy = (dy / dist) * force;
      disp[i].x -= dx; disp[i].y -= dy;
      disp[j].x += dx; disp[j].y += dy;
    }

    for (let i = 0; i < centers.length; i++) {
      const dist = Math.hypot(disp[i].x, disp[i].y) || 0.01;
      const capped = Math.min(dist, temperature);
      centers[i].x += (disp[i].x / dist) * capped;
      centers[i].y += (disp[i].y / dist) * capped;
    }

    temperature *= 0.95;
  }

  return centers;
}

// Evenly spaced around a circle, ordered by each node's index in
// state.nodes — fixed and reproducible (not by id string, not by
// position), so the same graph always produces the same seed. Radius is
// picked so the circle's circumference roughly accommodates every node at
// its own ideal spacing from its two ring-neighbors.
function circularSeed(nodes, radii) {
  const n = nodes.length;
  const avgRadius = radii.reduce((s, r) => s + r, 0) / n;
  const circumferenceNeeded = n * (2 * avgRadius + REPULSION_MARGIN);
  const radius = Math.max(100, circumferenceNeeded / (2 * Math.PI));
  return nodes.map((_, i) => {
    const angle = (2 * Math.PI * i) / n;
    return { x: radius * Math.cos(angle), y: radius * Math.sin(angle) };
  });
}

// Same ring layout as circularSeed, but ordered by a breadth-first
// traversal of the graph -- starting from its highest-degree node, ties
// broken by lowest index, so the same graph always produces the same seed
// -- instead of raw node index. issue #64 iteration 5: placing
// graph-adjacent nodes next to each other on the ring is a standard way to
// cut a circular layout's own edge crossings versus an arbitrary order.
// This is an ADDITIONAL candidate alongside circularSeed, not a
// replacement for it -- an earlier version of this iteration replaced the
// index-order circle outright and that regressed a larger real-world-scale
// test ontology's crossing count (58 -> 76): the "smarter" seed happened
// to land the relaxation in a worse local minimum for that graph's shape,
// even though it's a reasonable heuristic in general. Since
// computeAutoLayoutPositions() always picks whichever candidate's relaxed
// result has the fewest crossings, adding a candidate can only ever match
// or beat the previous best -- it's never picked when it's worse -- so
// keeping both circular variants is the safe way to benefit from this
// heuristic without risking exactly the regression the replacement caused.
// Any node BFS doesn't reach (a separate connected component) is appended
// afterward in index order, so every node still gets a ring slot.
function circularSeedByBFS(nodes, radii, edges, indexById) {
  const n = nodes.length;
  const adjacency = nodes.map(() => []);
  for (const e of edges) {
    const i = indexById.get(e.source), j = indexById.get(e.target);
    if (i === undefined || j === undefined || i === j) continue;
    adjacency[i].push(j);
    adjacency[j].push(i);
  }
  let root = 0;
  for (let i = 1; i < n; i++) if (adjacency[i].length > adjacency[root].length) root = i;
  const order = [];
  const visited = new Array(n).fill(false);
  const queue = [root];
  visited[root] = true;
  // A head pointer instead of Array.shift() keeps this O(n) — shift() is
  // O(n) per call (re-indexes the whole remaining array), which would make
  // this BFS O(n^2) on its own before any of the O(n^2)-per-pass relaxation
  // even starts.
  for (let head = 0; head < queue.length; head++) {
    const cur = queue[head];
    order.push(cur);
    for (const next of adjacency[cur]) {
      if (!visited[next]) { visited[next] = true; queue.push(next); }
    }
  }
  for (let i = 0; i < n; i++) if (!visited[i]) order.push(i);

  const avgRadius = radii.reduce((s, r) => s + r, 0) / n;
  const circumferenceNeeded = n * (2 * avgRadius + REPULSION_MARGIN);
  const radius = Math.max(100, circumferenceNeeded / (2 * Math.PI));
  const centers = new Array(n);
  order.forEach((nodeIndex, pos) => {
    const angle = (2 * Math.PI * pos) / n;
    centers[nodeIndex] = { x: radius * Math.cos(angle), y: radius * Math.sin(angle) };
  });
  return centers;
}

// A plain row-major grid, ordered by node index — mirrors
// computeImportShelf()'s "shelf" shape but as a from-scratch seed (not
// anchored to any existing content) so it explores a genuinely different
// starting configuration than the circle or the current layout.
function gridSeed(nodes, radii) {
  const n = nodes.length;
  const cols = Math.max(1, Math.ceil(Math.sqrt(n)));
  const avgDiameter = (radii.reduce((s, r) => s + r, 0) / n) * 2;
  const gap = avgDiameter + REPULSION_MARGIN;
  return nodes.map((_, i) => ({ x: (i % cols) * gap, y: Math.floor(i / cols) * gap }));
}

// Shared by countCrossingsForCenters and nudgeAwayFromCrossings below —
// standard orientation-based segment intersection (proper + collinear
// touching cases).
function segmentsIntersectForLayout(a1, a2, b1, b2) {
  const orient = (ax, ay, bx, by, cx, cy) => (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  const onSeg = (ax, ay, bx, by, px, py) =>
    Math.min(ax, bx) - 1e-9 <= px && px <= Math.max(ax, bx) + 1e-9 &&
    Math.min(ay, by) - 1e-9 <= py && py <= Math.max(ay, by) + 1e-9;
  const d1 = orient(b1.x, b1.y, b2.x, b2.y, a1.x, a1.y);
  const d2 = orient(b1.x, b1.y, b2.x, b2.y, a2.x, a2.y);
  const d3 = orient(a1.x, a1.y, a2.x, a2.y, b1.x, b1.y);
  const d4 = orient(a1.x, a1.y, a2.x, a2.y, b2.x, b2.y);
  if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return true;
  if (d1 === 0 && onSeg(b1.x, b1.y, b2.x, b2.y, a1.x, a1.y)) return true;
  if (d2 === 0 && onSeg(b1.x, b1.y, b2.x, b2.y, a2.x, a2.y)) return true;
  if (d3 === 0 && onSeg(a1.x, a1.y, a2.x, a2.y, b1.x, b1.y)) return true;
  if (d4 === 0 && onSeg(a1.x, a1.y, a2.x, a2.y, b2.x, b2.y)) return true;
  return false;
}

// Edge-endpoint index pairs for every edge, resolved once so both
// countCrossingsForCenters and nudgeAwayFromCrossings can walk the same
// list without re-deriving it.
function edgeIndexPairs(edges, indexById) {
  const pairs = [];
  for (const e of edges) {
    const i = indexById.get(e.source), j = indexById.get(e.target);
    if (i === undefined || j === undefined || i === j) continue;
    pairs.push({ source: e.source, target: e.target, i, j });
  }
  return pairs;
}

// Edge-crossing count used to rank candidate layouts against each other
// (not shown to the user) — center-to-center segments, same simplification
// tools/layout-bench.mjs's metric uses, applied identically to every
// candidate so the comparison between them is still meaningful even though
// it's not the exact border-to-border pixel geometry edgeGeometry() draws.
function countCrossingsForCenters(centers, edges, indexById) {
  const segs = edgeIndexPairs(edges, indexById);
  let crossings = 0;
  for (let i = 0; i < segs.length; i++) {
    for (let j = i + 1; j < segs.length; j++) {
      const s1 = segs[i], s2 = segs[j];
      const sharesEndpoint = s1.source === s2.source || s1.source === s2.target ||
        s1.target === s2.source || s1.target === s2.target;
      if (sharesEndpoint) continue;
      if (segmentsIntersectForLayout(centers[s1.i], centers[s1.j], centers[s2.i], centers[s2.j])) crossings++;
    }
  }
  return crossings;
}

// issue #64 iteration 5, second half: for every pair of edges that are
// still crossing in the current best layout, nudge all four endpoints
// apart perpendicular to their own edge -- a small, targeted push meant to
// swing the crossing pair apart rather than through each other. Returns a
// new seed (not a final layout): the caller re-runs the same full,
// size-aware relaxCenters() on it so normal spacing/attraction forces get
// to re-settle around the nudge instead of leaving raw, un-relaxed
// jitter -- this is a candidate to try, kept only if it actually reduces
// crossings (see the polish loop in computeAutoLayoutPositions), never
// applied unconditionally.
const CROSSING_NUDGE = 30;
function nudgeAwayFromCrossings(centers, edges, indexById) {
  const nudged = centers.map((c) => ({ x: c.x, y: c.y }));
  const segs = edgeIndexPairs(edges, indexById);
  for (let a = 0; a < segs.length; a++) {
    for (let b = a + 1; b < segs.length; b++) {
      const s1 = segs[a], s2 = segs[b];
      const sharesEndpoint = s1.source === s2.source || s1.source === s2.target ||
        s1.target === s2.source || s1.target === s2.target;
      if (sharesEndpoint) continue;
      if (!segmentsIntersectForLayout(centers[s1.i], centers[s1.j], centers[s2.i], centers[s2.j])) continue;
      const dx = centers[s1.j].x - centers[s1.i].x, dy = centers[s1.j].y - centers[s1.i].y;
      const len = Math.hypot(dx, dy) || 1;
      const px = -dy / len, py = dx / len; // unit perpendicular to edge s1
      nudged[s1.i].x += px * CROSSING_NUDGE; nudged[s1.i].y += py * CROSSING_NUDGE;
      nudged[s1.j].x += px * CROSSING_NUDGE; nudged[s1.j].y += py * CROSSING_NUDGE;
      nudged[s2.i].x -= px * CROSSING_NUDGE; nudged[s2.i].y -= py * CROSSING_NUDGE;
      nudged[s2.j].x -= px * CROSSING_NUDGE; nudged[s2.j].y -= py * CROSSING_NUDGE;
    }
  }
  return nudged;
}

function boundingBoxAreaForCenters(centers, nodes) {
  if (centers.length === 0) return 0;
  const xs0 = centers.map((c, i) => c.x - nodes[i].w / 2);
  const xs1 = centers.map((c, i) => c.x + nodes[i].w / 2);
  const ys0 = centers.map((c, i) => c.y - nodes[i].h / 2);
  const ys1 = centers.map((c, i) => c.y + nodes[i].h / 2);
  return (Math.max(...xs1) - Math.min(...xs0)) * (Math.max(...ys1) - Math.min(...ys0));
}

// issue #64 ("Crowded graph layout") iteration 4: an edge's label has
// always sat at a fixed 50% point along its line, so in a crowded layout
// it routinely lands on top of an unrelated third node's box or another
// edge's label (tools/layout-bench-out/*/iter3-*.json's labelCollisions
// count is still nonzero after iterations 1-3, which only ever moved node
// boxes, never the labels). This nudges each edge's label along its OWN
// edge line -- and only along it, never off it, so a label always stays
// recognizably attached to the relationship it names -- away from node
// boxes and other labels it would otherwise collide with. Deterministic
// and bounded, same iterative-pairwise-nudge shape as resolveNodeOverlaps
// above. Result is stored as edge.labelT (0..1 along the edge, from
// source to target; undefined/missing -- e.g. an edge created after the
// last autolayout run -- means "plain midpoint," exactly today's
// behavior) so rendering and the two existing UI anchors that already key
// off the label's position (updateSelectionToolbar, beginRenameEdgePrompt
// -- both go through edgeGeometry()'s `mid`) automatically follow it
// without their own separate logic.
const LABEL_T_MIN = 0.15, LABEL_T_MAX = 0.85; // never slide onto either endpoint's own box
const LABEL_CLEARANCE = 26; // approx. label footprint "radius" for spacing purposes
const LABEL_PASS_ITERATIONS = 40;
const LABEL_STEP = 0.015; // max fractional-t nudge per edge per iteration

function resolveEdgeLabelPositions(nodes, edges, indexById) {
  const t = new Map(edges.map((e) => [e.id, 0.5]));
  const pointAt = (a, b, tt) => ({ x: a.x + (b.x - a.x) * tt, y: a.y + (b.y - a.y) * tt });
  const centerOf = (n) => ({ x: n.x + n.w / 2, y: n.y + n.h / 2 });

  for (let iter = 0; iter < LABEL_PASS_ITERATIONS; iter++) {
    for (const edge of edges) {
      const i = indexById.get(edge.source), j = indexById.get(edge.target);
      if (i === undefined || j === undefined || i === j) continue;
      const a = centerOf(nodes[i]), b = centerOf(nodes[j]);
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const tx = dx / len, ty = dy / len; // unit tangent along the edge
      const p = pointAt(a, b, t.get(edge.id));

      // Signed 1D "push" along the tangent, accumulated from every nearby
      // box/label, then converted to a t-nudge below (dividing by `len`
      // turns a world-px push into a fraction-of-this-edge's-length step).
      let push = 0;

      for (const n of nodes) {
        if (n.id === edge.source || n.id === edge.target) continue; // an edge is allowed to sit near its own endpoints
        const nearestX = clamp(p.x, n.x, n.x + n.w);
        const nearestY = clamp(p.y, n.y, n.y + n.h);
        const ddx = p.x - nearestX, ddy = p.y - nearestY;
        const dist = Math.hypot(ddx, ddy);
        if (dist >= LABEL_CLEARANCE) continue;
        const boxCx = n.x + n.w / 2, boxCy = n.y + n.h / 2;
        const proj = (p.x - boxCx) * tx + (p.y - boxCy) * ty;
        push += (proj >= 0 ? 1 : -1) * (LABEL_CLEARANCE - dist);
      }

      for (const other of edges) {
        if (other.id === edge.id) continue;
        const oi = indexById.get(other.source), oj = indexById.get(other.target);
        if (oi === undefined || oj === undefined) continue;
        const op = pointAt(centerOf(nodes[oi]), centerOf(nodes[oj]), t.get(other.id));
        const ddx = p.x - op.x, ddy = p.y - op.y;
        const dist = Math.hypot(ddx, ddy) || 0.01;
        if (dist >= LABEL_CLEARANCE * 2) continue;
        const proj = ddx * tx + ddy * ty;
        push += (proj >= 0 ? 1 : -1) * (LABEL_CLEARANCE * 2 - dist);
      }

      const nudge = clamp(push / len, -LABEL_STEP, LABEL_STEP);
      t.set(edge.id, clamp(t.get(edge.id) + nudge, LABEL_T_MIN, LABEL_T_MAX));
    }
  }

  for (const edge of edges) edge.labelT = t.get(edge.id);
}

function computeAutoLayoutPositions() {
  const indexById = new Map(state.nodes.map((n, i) => [n.id, i]));
  // Bounding-circle radius (half the box diagonal): the smallest per-node
  // "personal space" radius such that two nodes' boxes provably can't
  // overlap once their centers are at least the sum of their two radii
  // apart, in any relative orientation.
  const radii = state.nodes.map((n) => Math.hypot(n.w, n.h) / 2);

  const seeds = [
    state.nodes.map((n) => ({ x: n.x + n.w / 2, y: n.y + n.h / 2 })), // today's positions
    circularSeed(state.nodes, radii),
    circularSeedByBFS(state.nodes, radii, state.edges, indexById),
    gridSeed(state.nodes, radii),
  ];

  let best = null;
  for (const seed of seeds) {
    const centers = relaxCenters(seed, radii, indexById, state.edges);
    const crossings = countCrossingsForCenters(centers, state.edges, indexById);
    const area = boundingBoxAreaForCenters(centers, state.nodes);
    if (!best || crossings < best.crossings || (crossings === best.crossings && area < best.area)) {
      best = { centers, crossings, area };
    }
  }

  // issue #64 iteration 5, polish pass: try nudging the winning layout's
  // still-crossing edge pairs apart and re-relaxing (nudgeAwayFromCrossings
  // above), a bounded number of times. Each round is only ever kept if it
  // strictly reduces the crossing count -- ties or regressions are
  // discarded and the loop stops there -- so this can only match or beat
  // the plain multi-seed result above, the same one-directional safety
  // property the seed selection itself already has.
  const CROSSING_POLISH_ROUNDS = 5;
  for (let round = 0; round < CROSSING_POLISH_ROUNDS && best.crossings > 0; round++) {
    const nudgedSeed = nudgeAwayFromCrossings(best.centers, state.edges, indexById);
    const centers = relaxCenters(nudgedSeed, radii, indexById, state.edges);
