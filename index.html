<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tudásgráf Vászon</title>
<style>
  :root {
    color-scheme: dark;
    /* Shared look-and-feel tokens (radius/timing don't need a per-theme
       value, only the colors below do) — one place to retune the overall
       feel instead of a magic number repeated at every call site. */
    --radius-sm: 6px;
    --radius-md: 10px;
    --transition-fast: 120ms ease;
    --toolbar-bg: #1e1e1e;
    --toolbar-fg: #e8e8e8;
    --toolbar-border: #333;
    --btn-bg: #2c2c2c;
    --btn-bg-hover: #3a3a3a;
    --btn-bg-active: #4a4a4a;
    --accent: #4da6ff;
    --accent-bg-pressed: rgba(77, 166, 255, 0.16);
    --shadow-color: rgba(0, 0, 0, 0.45);
    --shadow-sm: 0 1px 3px var(--shadow-color);
    --shadow-md: 0 6px 20px var(--shadow-color);
    --canvas-bg: #121212;
    --grid-dot: #2a2a2a;
    --empty-fg: #666;
    /* Canvas2D draw colors (Section 6) — read via getComputedStyle at render
       time (see resolveColors() in the script below), since a canvas
       fillStyle/strokeStyle can't reference a CSS var() directly. Keeping
       every themeable color here, dark or canvas, means the toggle has one
       source of truth instead of a parallel JS palette that could drift. */
    --node-fill: #242424;
    --node-stroke: #666666;
    --node-stroke-selected: #4da6ff;
    --connect-source-stroke: #ffb84d;
    --node-text: #e8e8e8;
    --handle-fill: rgba(255, 255, 255, 0.35);
    --group-fill: rgba(77, 166, 255, 0.06);
    --group-stroke: #4d7fa6;
    --imported-stroke: #e0b13f;
    --edge-stroke: #8a8a8a;
    --edge-stroke-selected: #4da6ff;
    --edge-label-fg: #bbbbbb;
    --ghost-stroke: #4da6ff;
    /* Group-membership hue (entity nodes that belong to >=1 group) and the
       two group-drag highlights (live move vs. live resize) — see Log. */
    --member-fill: rgba(77, 189, 143, 0.07);
    --member-stroke: #4dbd8f;
    --group-move-stroke: #b085f5;
    --group-resize-stroke: #4dd0e1;
  }

  /* Explicit user toggle (not prefers-color-scheme) — see toggleTheme() in
     the script. Defaults to dark (root, above) so an untouched app looks
     exactly as it always has; this block only applies once the user opts
     into light mode, and the choice is remembered via localStorage. */
  :root[data-theme="light"] {
    color-scheme: light;
    --toolbar-bg: #f5f5f5;
    --toolbar-fg: #1a1a1a;
    --toolbar-border: #d0d0d0;
    --btn-bg: #ffffff;
    --btn-bg-hover: #e8e8e8;
    --btn-bg-active: #d5d5d5;
    --accent: #1a73e8;
    --accent-bg-pressed: rgba(26, 115, 232, 0.1);
    --shadow-color: rgba(0, 0, 0, 0.15);
    --canvas-bg: #fafafa;
    --grid-dot: #d8d8d8;
    --empty-fg: #999999;
    --node-fill: #ffffff;
    --node-stroke: #999999;
    --node-stroke-selected: #1a73e8;
    --connect-source-stroke: #e67700;
    --node-text: #1a1a1a;
    --handle-fill: rgba(0, 0, 0, 0.35);
    --group-fill: rgba(26, 115, 232, 0.06);
    --group-stroke: #3f6ea8;
    --imported-stroke: #b8860b;
    --edge-stroke: #666666;
    --edge-stroke-selected: #1a73e8;
    --edge-label-fg: #555555;
    --ghost-stroke: #1a73e8;
    --member-fill: rgba(47, 143, 99, 0.07);
    --member-stroke: #2f8f63;
    --group-move-stroke: #8452c9;
    --group-resize-stroke: #0097a7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  #toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--toolbar-bg);
    color: var(--toolbar-fg);
    border-bottom: 1px solid var(--toolbar-border);
    box-shadow: var(--shadow-sm);
  }

  #toolbar button {
    font-size: 14px;
    line-height: 1;
    padding: 8px 14px;
    color: var(--toolbar-fg);
    background: var(--btn-bg);
    border: 1px solid var(--toolbar-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    transition: background-color var(--transition-fast), border-color var(--transition-fast),
      transform var(--transition-fast), box-shadow var(--transition-fast);
  }

  #toolbar button:hover {
    background: var(--btn-bg-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  #toolbar button:active {
    background: var(--btn-bg-active);
    transform: translateY(0);
    box-shadow: none;
  }

  /* An "armed" toggle (Add Node/Group, Connect, Theme, Language, Folder
     Sync once connected) reads as a status, not just a slightly-darker
     button — an accent-colored border/tint makes which mode is active
     legible at a glance instead of blending into the row. */
  #toolbar button[aria-pressed="true"] {
    background: var(--accent-bg-pressed);
    border-color: var(--accent);
    color: var(--accent);
  }

  #toolbar button[aria-pressed="true"]:hover {
    background: var(--accent-bg-pressed);
  }

  #toolbar button:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none;
    box-shadow: none;
  }

  #toolbar button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  #toolbar .spacer {
    flex: 1 1 auto;
  }

  #toolbar .zoom-group {
    display: flex;
    gap: 3px;
  }

  #toolbar .zoom-group button {
    width: 36px;
    padding: 8px 0;
    text-align: center;
    font-size: 16px;
  }

  #graph-title {
    font-size: 14px;
    font-weight: 600;
    padding: 8px 10px;
    margin-right: 4px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--toolbar-fg);
    white-space: nowrap;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background-color var(--transition-fast);
  }

  #graph-title:hover,
  #graph-title:focus-visible {
    background: var(--btn-bg-hover);
    outline: none;
  }

  #graph-title:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  #canvas-wrap {
    position: fixed;
    inset: 0;
    background: var(--canvas-bg);
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }

  #canvas.panning {
    cursor: grabbing;
  }

  #canvas.mode-addnode,
  #canvas.mode-addgroup,
  #canvas.mode-connect {
    cursor: crosshair;
  }

  #import-file-input {
    display: none;
  }

  .kg-inline-input {
    position: fixed;
    transform: translate(-50%, -50%);
    z-index: 20;
    font-size: 14px;
    padding: 7px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--node-stroke-selected);
    background: var(--toolbar-bg);
    color: var(--toolbar-fg);
    min-width: 140px;
    box-shadow: var(--shadow-md);
  }

  #sel-toolbar {
    position: fixed;
    display: none;
    gap: 6px;
    transform: translate(-50%, -170%);
    z-index: 15;
  }

  #sel-toolbar button {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--toolbar-border);
    background: var(--btn-bg);
    color: var(--toolbar-fg);
    cursor: pointer;
    box-shadow: var(--shadow-md);
    transition: background-color var(--transition-fast), transform var(--transition-fast);
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  #sel-toolbar button:hover {
    background: var(--btn-bg-hover);
    transform: scale(1.08);
  }

  #sel-trash:hover {
    border-color: #a64d4d;
    color: #d16a6a;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
    z-index: 30;
  }

  .modal-dialog {
    max-width: 380px;
    margin: 16px;
    padding: 20px;
    border-radius: var(--radius-md);
    background: var(--toolbar-bg);
    border: 1px solid var(--toolbar-border);
    color: var(--toolbar-fg);
    box-shadow: var(--shadow-md);
  }

  .modal-message {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-line;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .modal-actions button {
    font-size: 14px;
    padding: 8px 16px;
    color: var(--toolbar-fg);
    background: var(--btn-bg);
    border: 1px solid var(--toolbar-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background-color var(--transition-fast);
  }

  .modal-actions button:hover {
    background: var(--btn-bg-hover);
  }

  #confirm-ok,
  #import-replace {
    border-color: #a64d4d !important;
  }
</style>
</head>
<body>

<div id="toolbar">
  <span id="graph-title" tabindex="0" role="button" title="Kattints az átnevezéshez">Névtelen gráf</span>
  <button id="btn-add-node" type="button" aria-pressed="false">Csomópont hozzáadása</button>
  <button id="btn-add-group" type="button" aria-pressed="false">Csoport hozzáadása</button>
  <button id="btn-connect" type="button" aria-pressed="false">Összekapcsolás</button>
  <button id="btn-autolayout" type="button">Automatikus elrendezés</button>
  <button id="btn-undo" type="button">Visszavonás</button>
  <button id="btn-redo" type="button">Újra</button>
  <button id="btn-save-version" type="button">Verzió mentése</button>
  <button id="btn-folder-sync" type="button" aria-pressed="false" style="display:none;">Mappa szinkronizálás</button>
  <button id="btn-import-txt" type="button">Importálás TXT-ből</button>
  <input id="import-file-input" type="file" accept=".txt">
  <button id="btn-clear" type="button">Törlés</button>
  <div class="spacer"></div>
  <div class="zoom-group">
    <button id="btn-zoom-out" type="button" aria-label="Kicsinyítés">&minus;</button>
    <button id="btn-zoom-in" type="button" aria-label="Nagyítás">&plus;</button>
  </div>
  <button id="btn-theme-toggle" type="button" aria-pressed="false">Téma: Sötét</button>
  <button id="btn-lang-toggle" type="button" aria-pressed="false">Nyelv: Magyar</button>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<div id="sel-toolbar">
  <button id="sel-rename" type="button" title="Átnevezés">&#9998;</button>
  <button id="sel-toggle-dir" type="button" title="Irány váltása">&#8646;</button>
  <button id="sel-trash" type="button" title="Törlés">&#128465;</button>
</div>

<div id="confirm-overlay" class="modal-overlay">
  <div id="confirm-dialog" class="modal-dialog" role="alertdialog" aria-modal="true">
    <p id="confirm-message" class="modal-message"></p>
    <div id="confirm-actions" class="modal-actions">
      <button id="confirm-cancel" type="button">Mégse</button>
      <button id="confirm-ok" type="button">OK</button>
    </div>
  </div>
</div>

<div id="import-overlay" class="modal-overlay">
  <div id="import-dialog" class="modal-dialog" role="alertdialog" aria-modal="true">
    <p id="import-summary" class="modal-message"></p>
    <div id="import-actions" class="modal-actions">
      <button id="import-cancel" type="button">Mégse</button>
      <button id="import-replace" type="button">Csere</button>
      <button id="import-merge" type="button">Egyesítés</button>
    </div>
  </div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Camera: pan offset (screen px at scale=1) + zoom scale. World -> screen:
//   screenX = worldX * scale + panX
//   screenY = worldY * scale + panY
// ---------------------------------------------------------------------------
const camera = { panX: 0, panY: 0, scale: 1 };
const MIN_SCALE = 0.01;
const MAX_SCALE = 100;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let dirty = true;
function markDirty() { dirty = true; }

// ---------------------------------------------------------------------------
// Dark/light theme toggle (out-of-spec, user-requested, same standing as the
// Clear button). Explicit user choice, not prefers-color-scheme — a manual
// toggle should override the OS setting, not follow it. Applied synchronously
// here, at top-level script scope rather than inside boot(), so the correct
// theme is set on <html> before the first paint/render (no dark-then-light
// flash). Persisted in localStorage under its own key, deliberately separate
// from the graph's own Tier 1 payload (storage.mjs) — this is a UI
// preference, not graph data, and should survive Clear/import/new-graph
// unaffected by any of that. Reading localStorage can throw in some locked-
// down embeds; degrades to the dark default rather than breaking boot.
// ---------------------------------------------------------------------------
const THEME_STORAGE_KEY = "kg-theme";
let theme = "dark";
try {
  if (localStorage.getItem(THEME_STORAGE_KEY) === "light") theme = "light";
} catch (err) { /* localStorage unavailable — stay on the dark default */ }
document.documentElement.dataset.theme = theme;

function updateThemeButton() {
  const btn = document.getElementById("btn-theme-toggle");
  if (!btn) return;
  // Reads as a status ("Theme: Dark"), not a command — a bare "Dark Mode"
  // label would be ambiguous about whether it names the current state or
  // the mode you're about to switch to.
  btn.textContent = theme === "light" ? t("themeLight") : t("themeDark");
  btn.setAttribute("aria-pressed", String(theme === "light"));
}

function toggleTheme() {
  theme = theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch (err) { /* best-effort only */ }
  updateThemeButton();
  markDirty(); // canvas colors (resolveColors()) depend on the theme too
}

// ---------------------------------------------------------------------------
// Hungarian/English localization (out-of-spec, user-requested). Covers UI
// chrome only — toolbar labels, dialog text, placeholders, tooltips, the
// canvas empty-state message — never graph *content* (node labels, edge
// relations, the graph's own name once renamed): those are user data, not
// app interface, and translating them automatically would silently mangle
// what the user actually typed.
//
// Same standing and same pattern as the theme toggle: an explicit toggle
// (never inferred from navigator.language), defaulting to Hungarian per
// the request, persisted under its own localStorage key independent of
// both the theme key and the graph's own Tier 1 payload, and applied
// synchronously at top-level script scope so the correct language is
// already on every element before first paint — no flash of the other
// language on load.
//
// Dynamic strings (ones with a count, or that embed another string) are
// functions rather than plain values, called through the same t() lookup
// as static ones — every call site already asks for its text at the exact
// moment it's needed (opening a dialog, drawing a frame), so those need no
// separate "re-apply on toggle" step the way static DOM text does.
// ---------------------------------------------------------------------------
const STRINGS = {
  en: {
    appTitle: "Knowledge Graph Canvas",
    clickToRename: "Click to rename",
    untitledGraph: "Untitled Graph",
    addNode: "Add Node",
    addGroup: "Add Group",
    connect: "Connect",
    autoLayout: "Auto-layout",
    undo: "Undo",
    redo: "Redo",
    saveVersion: "Save Version",
    folderSync: "Folder Sync",
    folderSynced: (name) => `Synced: ${name}`,
    importFromTxt: "Import from TXT",
    clear: "Clear",
    zoomOut: "Zoom out",
    zoomIn: "Zoom in",
    themeDark: "Theme: Dark",
    themeLight: "Theme: Light",
    renameTitle: "Rename",
    toggleDirTitle: "Toggle direction",
    deleteTitle: "Delete",
    cancel: "Cancel",
    ok: "OK",
    replace: "Replace",
    merge: "Merge",
    clearConfirmMessage: "Clear the entire graph? This removes all nodes and edges. This can be undone with the Undo button.",
    clearConfirmLabel: "Clear",
    nodeLabelPlaceholder: "Node label",
    groupLabelPlaceholder: "Group label",
    relationLabelPlaceholder: "relation label",
    graphNamePlaceholder: "Graph name",
    emptyCanvasMessage: (addNodeLabel) => `Canvas is empty — use "${addNodeLabel}" to begin`,
    importMergeSummary: (n, m) => `Merge: ${n} node(s) and ${m} edge(s) would be added. Nothing is ever removed.`,
    importReplaceSummary: (n) => `Replace: same additions, plus ${n} node(s)/edge(s) not in this file would be removed.`,
    defaultRelation: "related to",
  },
  hu: {
    appTitle: "Tudásgráf Vászon",
    clickToRename: "Kattints az átnevezéshez",
    untitledGraph: "Névtelen gráf",
    addNode: "Csomópont hozzáadása",
    addGroup: "Csoport hozzáadása",
    connect: "Összekapcsolás",
    autoLayout: "Automatikus elrendezés",
    undo: "Visszavonás",
    redo: "Újra",
    saveVersion: "Verzió mentése",
    folderSync: "Mappa szinkronizálás",
    folderSynced: (name) => `Szinkronizálva: ${name}`,
    importFromTxt: "Importálás TXT-ből",
    clear: "Törlés",
    zoomOut: "Kicsinyítés",
    zoomIn: "Nagyítás",
    themeDark: "Téma: Sötét",
    themeLight: "Téma: Világos",
    renameTitle: "Átnevezés",
    toggleDirTitle: "Irány váltása",
    deleteTitle: "Törlés",
    cancel: "Mégse",
    ok: "OK",
    replace: "Csere",
    merge: "Egyesítés",
    clearConfirmMessage: "Törlöd az egész gráfot? Ez eltávolítja az összes csomópontot és élt. Ez visszavonható a Visszavonás gombbal.",
    clearConfirmLabel: "Törlés",
    nodeLabelPlaceholder: "Csomópont neve",
    groupLabelPlaceholder: "Csoport neve",
    relationLabelPlaceholder: "kapcsolat neve",
    graphNamePlaceholder: "Gráf neve",
    emptyCanvasMessage: (addNodeLabel) => `A vászon üres — kattints a(z) "${addNodeLabel}" gombra a kezdéshez`,
    importMergeSummary: (n, m) => `Egyesítés: ${n} csomópont és ${m} él kerülne hozzáadásra. Semmi nem törlődik.`,
    importReplaceSummary: (n) => `Csere: ugyanazok a hozzáadások, plusz ${n} csomópont/él törlődne, amelyek nincsenek ebben a fájlban.`,
    defaultRelation: "kapcsolódik",
  },
};

const LANG_STORAGE_KEY = "kg-lang";
let lang = "hu";
try {
  const stored = localStorage.getItem(LANG_STORAGE_KEY);
  if (stored === "en" || stored === "hu") lang = stored;
} catch (err) { /* localStorage unavailable — stay on the Hungarian default */ }
document.documentElement.lang = lang;

// t("key") for plain strings; t("key", ...args) calls a dynamic entry
// (e.g. t("folderSynced", handle.name)) with those args.
function t(key, ...args) {
  const entry = STRINGS[lang][key];
  return typeof entry === "function" ? entry(...args) : entry;
}

// True only for an untouched default name (in either language) — never for
// a name the user actually typed, even if it happens to match. Lets the
// still-untitled placeholder track the current language on toggle without
// ever touching a real, user-chosen graph name.
function isDefaultGraphName(name) {
  return name === STRINGS.en.untitledGraph || name === STRINGS.hu.untitledGraph;
}

// Refreshes every *static* DOM element's translated text — the button
// labels, dialog copy, and tooltips that exist once and just need updating
// in place on toggle. Placeholders and dialog messages built at the
// moment a prompt opens (showInlineInput/showConfirmDialog/import summary)
// already call t() directly at that moment, so they need no entry here.
function applyLanguage() {
  document.documentElement.lang = lang;
  document.title = t("appTitle");
  const byId = (id) => document.getElementById(id);
  const titleEl = byId("graph-title");
  titleEl.title = t("clickToRename");
  if (isDefaultGraphName(state.graphName)) {
    state.graphName = t("untitledGraph");
    titleEl.textContent = state.graphName;
  }
  byId("btn-add-node").textContent = t("addNode");
  byId("btn-add-group").textContent = t("addGroup");
  byId("btn-connect").textContent = t("connect");
  byId("btn-autolayout").textContent = t("autoLayout");
  byId("btn-undo").textContent = t("undo");
  byId("btn-redo").textContent = t("redo");
  byId("btn-save-version").textContent = t("saveVersion");
  byId("btn-import-txt").textContent = t("importFromTxt");
  byId("btn-clear").textContent = t("clear");
  byId("btn-zoom-out").setAttribute("aria-label", t("zoomOut"));
  byId("btn-zoom-in").setAttribute("aria-label", t("zoomIn"));
  byId("sel-rename").title = t("renameTitle");
  byId("sel-toggle-dir").title = t("toggleDirTitle");
  byId("sel-trash").title = t("deleteTitle");
  byId("confirm-cancel").textContent = t("cancel");
  byId("confirm-ok").textContent = t("ok");
  byId("import-cancel").textContent = t("cancel");
  byId("import-replace").textContent = t("replace");
  byId("import-merge").textContent = t("merge");
  updateThemeButton(); // its text depends on theme, not language, but re-set here too for the aria-pressed-adjacent pattern
  updateFolderSyncButton(); // "Folder Sync" / "Synced: X" text is language-dependent
  updateLangButton();
  markDirty(); // the canvas empty-state message is language-dependent too
}

function updateLangButton() {
  const btn = document.getElementById("btn-lang-toggle");
  if (!btn) return;
  // Bilingual by construction, not looked up via t(): shows the *current*
  // language's own name for itself, in that language, mirroring the
  // status-not-command convention the theme toggle already established.
  btn.textContent = lang === "hu" ? "Nyelv: Magyar" : "Language: English";
  btn.setAttribute("aria-pressed", String(lang === "en"));
}

function toggleLanguage() {
  lang = lang === "hu" ? "en" : "hu";
  try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch (err) { /* best-effort only */ }
  applyLanguage();
}

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

function screenToWorld(sx, sy) {
  return { x: (sx - camera.panX) / camera.scale, y: (sy - camera.panY) / camera.scale };
}

function worldToScreen(wx, wy) {
  return { x: wx * camera.scale + camera.panX, y: wy * camera.scale + camera.panY };
}

function zoomAt(screenX, screenY, factor) {
  const newScale = clamp(camera.scale * factor, MIN_SCALE, MAX_SCALE);
  if (newScale === camera.scale) return;
  const world = screenToWorld(screenX, screenY);
  camera.scale = newScale;
  camera.panX = screenX - world.x * newScale;
  camera.panY = screenY - world.y * newScale;
  markDirty();
}

// ---------------------------------------------------------------------------
// Data model (spec Section 4). Ids are monotonic counters, never reused.
// ---------------------------------------------------------------------------
const state = {
  nodes: [],
  edges: [],
  selection: { type: null, id: null }, // type: 'node' | 'edge' | null
  mode: "idle", // 'idle' | 'addNode' | 'addGroup' | 'connect'
  connectSource: null,
  nextNodeNum: 1,
  nextEdgeNum: 1,
  // Always-visible, always-editable (click the toolbar title) — not tied to
  // ever having saved. Used verbatim for display; sanitized only at the
  // point a filename is actually built (Section 5.4).
  graphName: t("untitledGraph"),
  // Set on first "Save Version": {format_version, graph_id, version,
  // created, saved}. null until then — nothing has been exported yet, so
  // there's no version history to speak of.
  meta: null,
};

const DEFAULT_NODE_W = 160;
const DEFAULT_NODE_H = 60;
const DEFAULT_GROUP_W = 320;
const DEFAULT_GROUP_H = 220;

function genNodeId() { return `n${state.nextNodeNum++}`; }
function genEdgeId() { return `e${state.nextEdgeNum++}`; }

function createNode(x, y, label, type = "entity") {
  const w = type === "group" ? DEFAULT_GROUP_W : DEFAULT_NODE_W;
  const h = type === "group" ? DEFAULT_GROUP_H : DEFAULT_NODE_H;
  const node = {
    id: genNodeId(),
    label,
    type,
    x, y, w, h,
    groups: [],
    boundary_mode: type === "group" ? "manual" : undefined,
    notes: null,
  };
  state.nodes.push(node);
  markDirty();
  return node;
}

function createEdge(sourceId, targetId, relation, directed = true, auto = false) {
  const edge = { id: genEdgeId(), source: sourceId, target: targetId, relation, directed, auto };
  state.edges.push(edge);
  markDirty();
  return edge;
}

function deleteNode(id) {
  const idx = state.nodes.findIndex((n) => n.id === id);
  if (idx === -1) return;
  state.nodes.splice(idx, 1);
  state.edges = state.edges.filter((e) => e.source !== id && e.target !== id);
  // If the deleted node was a group, drop it from any remaining member's groups[].
  for (const n of state.nodes) {
    const gi = n.groups.indexOf(id);
    if (gi !== -1) n.groups.splice(gi, 1);
  }
  if (state.selection.type === "node" && state.selection.id === id) clearSelection();
  markDirty();
}

function deleteEdge(id) {
  const idx = state.edges.findIndex((e) => e.id === id);
  if (idx === -1) return;
  state.edges.splice(idx, 1);
  if (state.selection.type === "edge" && state.selection.id === id) clearSelection();
  markDirty();
}

// ---------------------------------------------------------------------------
// Undo/redo (Section 8, Decision #8): command-pattern stack, one entry per
// discrete user action, restored via a full {nodes, edges} snapshot rather
// than tracked per-action deltas — matches the spec's own description of
// autolayout as "one before snapshot," generalized to every action here for
// correctness by construction (no mutation can forget to register its
// inverse). `groups[]` arrays are cloned too since they're mutated in place.
// Id counters are intentionally NOT part of the snapshot: ids are never
// reused (Section 4.1), so they must keep incrementing across undo/redo.
// Nothing here is persisted — it's just these two in-memory arrays, so a
// reload always starts with an empty stack (Section 8).
// ---------------------------------------------------------------------------
const history = { past: [], future: [] };

function snapshotState() {
  return {
    nodes: state.nodes.map((n) => ({ ...n, groups: [...n.groups] })),
    edges: state.edges.map((e) => ({ ...e })),
  };
}

function restoreSnapshot(snap) {
  state.nodes = snap.nodes.map((n) => ({ ...n, groups: [...n.groups] }));
  state.edges = snap.edges.map((e) => ({ ...e }));
}

function pushHistory(before, after) {
  newlyImportedIds = new Set(); // any new discrete action retires the "just imported" highlight
  history.past.push({ before, after });
  history.future = [];
  updateUndoRedoButtons();
  scheduleSave();
}

function undo() {
  if (history.past.length === 0) return;
  const entry = history.past.pop();
  restoreSnapshot(entry.before);
  history.future.push(entry);
  clearSelection();
  updateUndoRedoButtons();
  markDirty();
  scheduleSave();
}

function redo() {
  if (history.future.length === 0) return;
  const entry = history.future.pop();
  restoreSnapshot(entry.after);
  history.past.push(entry);
  clearSelection();
  updateUndoRedoButtons();
  markDirty();
  scheduleSave();
}

function updateUndoRedoButtons() {
  document.getElementById("btn-undo").disabled = history.past.length === 0;
  document.getElementById("btn-redo").disabled = history.future.length === 0;
}

// ---------------------------------------------------------------------------
// Autolayout (Section 8): explicit-only, never automatic. Force-directed
// (Fruchterman-Reingold style) relaxation of node *centers* — repulsion
// between every pair of nodes, not just connected ones, so disconnected
// components and floating groups still spread apart instead of piling up;
// attraction along edges, including the auto-generated "contains" edges
// (Section 4.3) — that's what pulls a group and its members toward each
// other in the first place. Starts from the graph's current positions
// (rather than a fresh random scatter), so the result is deterministic for
// a given graph + starting layout — no RNG involved, and nothing to seed.
// A fixed iteration count with a cooling schedule guarantees termination
// (no risk of hanging) regardless of graph shape.
//
// Group boxes are moved exactly like any other node and keep their own
// w/h — boundary_mode is always "manual" (Section 4.3), nothing in this
// app ever auto-fits a group's box to its members, autolayout included.
// But a member must never end up outside the box it belongs to: after each
// iteration's forces are applied, every node with non-empty groups[] is
// clamped back inside each group it belongs to (clampCenterIntoGroup).
// This is an explicit hard constraint, not just the spring pull from the
// contains-edge attraction above — that pull alone doesn't guarantee
// containment (a member's own repulsion from other nodes, or the group's
// own attraction elsewhere, can still push it past the box edge). Multiple
// clamp passes per iteration (GROUP_CONTAINMENT_PASSES) handle nested
// groups (member -> inner group -> outer group) by letting the constraint
// propagate outward; this is a fixed-pass approximation, not a topological
// sort, since real nesting depth in this app is always small. Does not
// touch groups[] membership itself or run outside autolayout — a manual
// drag can still pull a node fully out of a group exactly as before
// (Phase 2's own membership rules are unaffected).
// ---------------------------------------------------------------------------
const GROUP_CONTAINMENT_PASSES = 5;

function clampCenterIntoGroup(center, w, h, groupCenter, groupW, groupH) {
  const minCx = groupCenter.x - groupW / 2 + w / 2;
  const maxCx = groupCenter.x + groupW / 2 - w / 2;
  const minCy = groupCenter.y - groupH / 2 + h / 2;
  const maxCy = groupCenter.y + groupH / 2 - h / 2;
  // min/max can invert when the member is wider/taller than the group's
  // interior (e.g. a member bigger than MIN_GROUP_SIZE) — Math.min/max
  // keeps clamp()'s (lo <= hi) contract intact instead of producing NaN;
  // this is a pre-existing possible state (a manual resize could already
  // make a member larger than its group), not something autolayout creates.
  center.x = clamp(center.x, Math.min(minCx, maxCx), Math.max(minCx, maxCx));
  center.y = clamp(center.y, Math.min(minCy, maxCy), Math.max(minCy, maxCy));
}

function autoLayout() {
  if (state.nodes.length < 2) return; // nothing to relax
  const before = snapshotState();

  const idealDist = 150; // target inter-node spacing
  const iterations = 200;
  let temperature = 100; // max displacement per iteration, cooled to ~0

  const centers = state.nodes.map((n) => ({ x: n.x + n.w / 2, y: n.y + n.h / 2 }));
  const indexById = new Map(state.nodes.map((n, i) => [n.id, i]));

  for (let iter = 0; iter < iterations; iter++) {
    const disp = centers.map(() => ({ x: 0, y: 0 }));

    for (let i = 0; i < centers.length; i++) {
      for (let j = i + 1; j < centers.length; j++) {
        let dx = centers[i].x - centers[j].x;
        let dy = centers[i].y - centers[j].y;
        const dist = Math.hypot(dx, dy) || 0.01; // guard against exact overlap
        const force = (idealDist * idealDist) / dist;
        dx = (dx / dist) * force;
        dy = (dy / dist) * force;
        disp[i].x += dx; disp[i].y += dy;
        disp[j].x -= dx; disp[j].y -= dy;
      }
    }

    for (const edge of state.edges) {
      const i = indexById.get(edge.source);
      const j = indexById.get(edge.target);
      if (i === undefined || j === undefined || i === j) continue;
      let dx = centers[i].x - centers[j].x;
      let dy = centers[i].y - centers[j].y;
      const dist = Math.hypot(dx, dy) || 0.01;
      const force = (dist * dist) / idealDist;
      dx = (dx / dist) * force;
      dy = (dy / dist) * force;
      disp[i].x -= dx; disp[i].y -= dy;
      disp[j].x += dx; disp[j].y += dy;
    }

    for (let i = 0; i < centers.length; i++) {
      const dist = Math.hypot(disp[i].x, disp[i].y) || 0.01;
      const capped = Math.min(dist, temperature);
      centers[i].x += (disp[i].x / dist) * capped;
      centers[i].y += (disp[i].y / dist) * capped;
    }

    for (let pass = 0; pass < GROUP_CONTAINMENT_PASSES; pass++) {
      for (let i = 0; i < state.nodes.length; i++) {
        const node = state.nodes[i];
        for (const gid of node.groups) {
          const gi = indexById.get(gid);
          if (gi === undefined) continue;
          const group = state.nodes[gi];
          clampCenterIntoGroup(centers[i], node.w, node.h, centers[gi], group.w, group.h);
        }
      }
    }

    temperature *= 0.95;
  }

  state.nodes.forEach((n, i) => {
    n.x = centers[i].x - n.w / 2;
    n.y = centers[i].y - n.h / 2;
  });

  markDirty();
  pushHistory(before, snapshotState());
}

// ---------------------------------------------------------------------------
// Tier 1 storage (Section 3.2): every edit writes immediately to a private,
// non-visible background store — no prompts, protects against a crashed tab.
//
// Spec Section 3.1 lists OPFS as universally supported, and Section 2 says
// the app "opens directly in a browser" with "no external server required."
// In practice those two claims conflict: OPFS throws SecurityError under a
// file:// origin (confirmed by testing) — it only works when the page is
// actually served over http(s). Since double-clicking index.html is exactly
// the deployment mode Section 2 promises, OPFS-only would silently provide
// zero crash protection in that mode. So this detects OPFS and falls back to
// localStorage (which does work under file://) when OPFS isn't usable,
// keeping "always-on, all platforms" true in both deployment modes at the
// cost of a second code path and localStorage's much smaller size ceiling
// (fine at the spec's own target scale — Section 6 — of ~1,000 nodes).
// ---------------------------------------------------------------------------
const OPFS_FILENAME = "kg-canvas-live.json";
const LOCALSTORAGE_KEY = "kg-canvas-live";

let storageBackend = null; // 'opfs' | 'localStorage' | 'none', decided once

async function detectStorageBackend() {
  if (storageBackend) return storageBackend;
  try {
    if (navigator.storage && navigator.storage.getDirectory) {
      await navigator.storage.getDirectory();
      storageBackend = "opfs";
      return storageBackend;
    }
  } catch (err) {
    // Present but unusable here (e.g. file:// origin) — fall through to localStorage.
  }
  try {
    localStorage.setItem("__kg_probe__", "1");
    localStorage.removeItem("__kg_probe__");
    storageBackend = "localStorage";
  } catch (err) {
    storageBackend = "none";
    console.warn("[KG Canvas] No live-save backend available in this context — Tier 1 disabled:", err);
  }
  return storageBackend;
}

async function writeGraphPayload(payload) {
  const backend = await detectStorageBackend();
  const json = JSON.stringify(payload);
  if (backend === "opfs") {
    try {
      const root = await navigator.storage.getDirectory();
      const fileHandle = await root.getFileHandle(OPFS_FILENAME, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(json);
      await writable.close();
    } catch (err) {
      console.warn("[KG Canvas] OPFS save failed:", err);
    }
  } else if (backend === "localStorage") {
    try {
      localStorage.setItem(LOCALSTORAGE_KEY, json);
    } catch (err) {
      console.warn("[KG Canvas] localStorage save failed:", err);
    }
  }
}

async function readGraphPayload() {
  const backend = await detectStorageBackend();
  if (backend === "opfs") {
    try {
      const root = await navigator.storage.getDirectory();
      const fileHandle = await root.getFileHandle(OPFS_FILENAME, { create: false });
      const file = await fileHandle.getFile();
      const text = await file.text();
      return text ? JSON.parse(text) : null;
    } catch (err) {
      if (!err || err.name !== "NotFoundError") console.warn("[KG Canvas] OPFS load failed:", err);
      return null;
    }
  }
  if (backend === "localStorage") {
    try {
      const text = localStorage.getItem(LOCALSTORAGE_KEY);
      return text ? JSON.parse(text) : null;
    } catch (err) {
      console.warn("[KG Canvas] localStorage load failed:", err);
      return null;
    }
  }
  return null;
}

async function writeGraphToStorage() {
  await writeGraphPayload({
    nodes: state.nodes,
    edges: state.edges,
    nextNodeNum: state.nextNodeNum,
    nextEdgeNum: state.nextEdgeNum,
    graphName: state.graphName,
    meta: state.meta, // so version numbers stay continuous across sessions (Section 9)
  });
}

// Saves are coalesced, not queued: a burst of edits while a write is already
// in flight collapses into exactly one trailing save of the latest state,
// and writes never run concurrently (avoiding interleaved/corrupt writes).
let saveScheduled = false;
let saveRunning = false;
let saveIdleResolvers = [];

function scheduleSave() {
  saveScheduled = true;
  runSaveLoop();
}

async function runSaveLoop() {
  if (saveRunning) return;
  saveRunning = true;
  while (saveScheduled) {
    saveScheduled = false;
    await writeGraphToStorage();
  }
  saveRunning = false;
  const resolvers = saveIdleResolvers;
  saveIdleResolvers = [];
  resolvers.forEach((resolve) => resolve());
}

// Test/debug hook: resolves once no save is in flight or queued, so tests
// can wait deterministically instead of guessing timing.
function whenSaveIdle() {
  if (!saveRunning && !saveScheduled) return Promise.resolve();
  return new Promise((resolve) => saveIdleResolvers.push(resolve));
}

async function loadGraphFromStorage() {
  const data = await readGraphPayload();
  if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) return false;
  state.nodes = data.nodes;
  state.edges = data.edges;
  state.nextNodeNum = typeof data.nextNodeNum === "number" ? data.nextNodeNum : state.nextNodeNum;
  state.nextEdgeNum = typeof data.nextEdgeNum === "number" ? data.nextEdgeNum : state.nextEdgeNum;
  if (typeof data.graphName === "string" && data.graphName) state.graphName = data.graphName;
  if (data.meta && typeof data.meta === "object") state.meta = data.meta;
  return true;
}

// ---------------------------------------------------------------------------
// Group membership (spec Section 4.3, Decision #2/#3). Directional-by-action:
// only committed/cleared here, at the end of an explicit move-drag — never
// recomputed just because boxes happen to overlap after some other change
// (e.g. resizing or moving the group itself).
// ---------------------------------------------------------------------------
function rectsOverlap(a, b) {
  return !(a.x + a.w <= b.x || a.x >= b.x + b.w || a.y + a.h <= b.y || a.y >= b.y + b.h);
}

function rectFullyContains(outer, inner) {
  return outer.x <= inner.x && outer.y <= inner.y &&
    outer.x + outer.w >= inner.x + inner.w && outer.y + outer.h >= inner.y + inner.h;
}

function createContainsEdge(groupId, memberId) {
  createEdge(groupId, memberId, "contains", true, true);
}

function removeContainsEdge(groupId, memberId) {
  state.edges = state.edges.filter((e) => !(e.auto && e.source === groupId && e.target === memberId));
  markDirty();
}

function updateGroupMembership(node) {
  const stillMember = [];
  for (const gid of node.groups) {
    const group = state.nodes.find((n) => n.id === gid);
    if (group && rectsOverlap(node, group)) {
      stillMember.push(gid);
    } else {
      removeContainsEdge(gid, node.id); // dragged fully outside (or group gone)
    }
  }
  node.groups = stillMember;

  let best = null;
  for (const candidate of state.nodes) {
    if (candidate.id === node.id) continue;
    if (candidate.type !== "group") continue;
    if (node.groups.includes(candidate.id)) continue;
    if (candidate.w * candidate.h <= node.w * node.h) continue; // must be strictly bigger
    if (!rectFullyContains(candidate, node)) continue; // "drop inside" = full containment
    // A candidate that's just a bigger ancestor of a group this node is
    // ALREADY (still) a member of is redundant — that containment already
    // holds transitively through nesting. Without this, dragging a group
    // that already has its own nested member into a bigger outer group
    // would give the member a second, direct membership in the outer
    // group too (plus a second, redundant `contains` edge), breaking
    // "innermost wins" for a cascaded drop the same way it's already
    // enforced for a fresh one. Two same-level, merely-overlapping
    // candidates (neither containing the other) are unaffected — that's
    // the legitimate "member of two separate groups" case.
    const redundant = node.groups.some((gid) => {
      const existing = state.nodes.find((n) => n.id === gid);
      return existing && rectFullyContains(candidate, existing);
    });
    if (redundant) continue;
    if (!best || candidate.w * candidate.h < best.w * best.h) best = candidate; // innermost wins
  }
  if (best) {
    node.groups.push(best.id);
    createContainsEdge(best.id, node.id);
  }
  markDirty();
}

// A dragged GROUP now actively absorbs nodes it's dropped onto, and
// releases members it's dragged away from — symmetric with how dragging a
// member itself already worked. This is a deliberate, later reversal of an
// earlier "moving a group never cascades membership" decision (see the
// dated Log entry): resizing a group still never auto-fits to members
// (Section 4.3 is explicit about that one case), but the group's own drag
// is now treated the same as any member's drag. Reuses
// updateGroupMembership() per other node so the exact same rules
// (strictly-bigger, innermost-wins, overlap-to-keep, full-containment-to-
// join) apply regardless of which side initiated the drag.
function updateMembershipForMovedGroup(group) {
  for (const other of state.nodes) {
    if (other.id === group.id) continue;
    updateGroupMembership(other);
  }
}

// All nodes transitively contained by groupId — direct members, plus
// members of any nested member group, and so on. Used to drag a group's
// whole contents along with it as one rigid unit while it's being moved
// (never during resize — Section 4.3's box is independently resizable and
// must never auto-fit to/drag its members). Membership itself is
// unaffected by this: it's still only ever committed/cleared by
// updateGroupMembership()/updateMembershipForMovedGroup(), evaluated once
// the drag ends, exactly as before.
function collectContainedDescendants(groupId) {
  const result = new Set();
  let frontier = [groupId];
  while (frontier.length) {
    const next = [];
    for (const n of state.nodes) {
      if (result.has(n.id)) continue;
      if (n.groups.some((gid) => frontier.includes(gid))) {
        result.add(n.id);
        next.push(n.id);
      }
    }
    frontier = next;
  }
  return result;
}

function selectNode(id) { state.selection = { type: "node", id }; markDirty(); }
function selectEdge(id) { state.selection = { type: "edge", id }; markDirty(); }
function clearSelection() { state.selection = { type: null, id: null }; markDirty(); }

function setMode(mode) {
  state.mode = mode;
  if (mode !== "connect") state.connectSource = null;
  canvas.classList.toggle("mode-addnode", mode === "addNode");
  canvas.classList.toggle("mode-addgroup", mode === "addGroup");
  canvas.classList.toggle("mode-connect", mode === "connect");
  document.getElementById("btn-add-node").setAttribute("aria-pressed", String(mode === "addNode"));
  document.getElementById("btn-add-group").setAttribute("aria-pressed", String(mode === "addGroup"));
  document.getElementById("btn-connect").setAttribute("aria-pressed", String(mode === "connect"));
  markDirty();
}

// ---------------------------------------------------------------------------
// Geometry helpers: hit-testing and edge anchor points (line clipped to the
// node's rectangle border, so arrows/lines start/end at the box edge).
// ---------------------------------------------------------------------------
// Nodes can now nest (groups), so hit-testing/rendering order can't just be
// creation order any more: the smallest-area box under a point should win
// (it's the visually topmost one), with later-created nodes breaking ties.
// Used both for hit-testing (as-is) and rendering (reversed — biggest/
// outermost drawn first, so nested boxes paint on top of their container).
// Optional `rect` filters to nodes intersecting it (viewport culling, see
// visibleWorldRect() below) — omitted, every call site that needs the full
// unculled list (e.g. group-membership checks, which must consider groups
// regardless of what's currently on screen) keeps working exactly as before.
function nodesTopmostFirst(rect) {
  const sorted = state.nodes
    .map((n, i) => ({ n, i }))
    .sort((a, b) => (a.n.w * a.n.h - b.n.w * b.n.h) || (b.i - a.i))
    .map((x) => x.n);
  return rect ? sorted.filter((n) => rectsOverlap(n, rect)) : sorted;
}

function findNodeAt(wx, wy) {
  for (const n of nodesTopmostFirst(visibleWorldRect())) {
    if (wx >= n.x && wx <= n.x + n.w && wy >= n.y && wy <= n.y + n.h) return n;
  }
  return null;
}

function nodeHandles(n) {
  return [
    { x: n.x + n.w / 2, y: n.y },
    { x: n.x + n.w / 2, y: n.y + n.h },
    { x: n.x, y: n.y + n.h / 2 },
    { x: n.x + n.w, y: n.y + n.h / 2 },
  ];
}

function findNodeHandleAt(wx, wy) {
  const radius = 10 / camera.scale; // constant ~10 screen px grab target
  for (const n of nodesTopmostFirst(visibleWorldRect())) {
    for (const h of nodeHandles(n)) {
      if (Math.hypot(wx - h.x, wy - h.y) <= radius) return { node: n, point: h };
    }
  }
  return null;
}

// Section 4.3 explicitly requires a group's box to be "independently
// resizable" (boundary_mode is always manual, i.e. never auto-fit) — so
// unlike entity nodes, group nodes get a corner resize handle. This is also
// the only way two groups can ever nest: they're all created at the same
// default size, so recursive membership requires shrinking/growing one.
const MIN_GROUP_SIZE = 60;

function groupResizeHandlePoint(n) { return { x: n.x + n.w, y: n.y + n.h }; }

function findGroupResizeHandleAt(wx, wy) {
  const radius = 10 / camera.scale;
  for (const n of nodesTopmostFirst(visibleWorldRect())) {
    if (n.type !== "group") continue;
    const h = groupResizeHandlePoint(n);
    if (Math.hypot(wx - h.x, wy - h.y) <= radius) return n;
  }
  return null;
}

function rectBorderPoint(rect, dx, dy) {
  const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
  if (dx === 0 && dy === 0) return { x: cx, y: cy };
  const hw = rect.w / 2, hh = rect.h / 2;
  const sx = dx !== 0 ? hw / Math.abs(dx) : Infinity;
  const sy = dy !== 0 ? hh / Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy);
  return { x: cx + dx * s, y: cy + dy * s };
}

function edgeAnchors(edge) {
  const src = state.nodes.find((n) => n.id === edge.source);
  const tgt = state.nodes.find((n) => n.id === edge.target);
  if (!src || !tgt) return null;
  const scx = src.x + src.w / 2, scy = src.y + src.h / 2;
  const tcx = tgt.x + tgt.w / 2, tcy = tgt.y + tgt.h / 2;
  const a = rectBorderPoint(src, tcx - scx, tcy - scy);
  const b = rectBorderPoint(tgt, scx - tcx, scy - tcy);
  return { a, b };
}

// ---------------------------------------------------------------------------
// Parallel-edge bending (out-of-spec, user-requested): when 2+ (non-auto)
// edges connect the same unordered node pair, they'd otherwise draw as
// perfectly overlapping lines with stacked, unreadable labels. Each edge in
// such a group is bent into a quadratic curve, offset perpendicular to the
// straight line by a multiple of EDGE_BEND_STEP, symmetric around zero
// (e.g. 3 edges bend at -1, 0, +1 steps) so a lone edge between two nodes
// is completely unaffected (bend 0 == a straight line, the common case).
// Endpoints stay exactly where edgeAnchors() would put a straight edge —
// only the path between them bends — so this never changes hit-target
// anchoring at the node border, just how the line/label reach it.
// ---------------------------------------------------------------------------
const EDGE_BEND_STEP = 60; // world units of perpendicular offset per step

function computeEdgeBendInfo() {
  const groups = new Map(); // "id1|id2" (sorted) -> [edge, ...] in encounter order
  for (const edge of state.edges) {
    if (edge.auto) continue; // contains edges are never drawn/hit-tested, so never bent
    const key = edge.source < edge.target ? `${edge.source}|${edge.target}` : `${edge.target}|${edge.source}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(edge);
  }
  const info = new Map(); // edge.id -> { index, count }
  for (const group of groups.values()) {
    group.forEach((edge, index) => info.set(edge.id, { index, count: group.length }));
  }
  return info;
}

// Null when there's only one edge for this node pair (the common case) —
// callers draw/hit-test a plain straight line in that case, unchanged from
// before parallel-edge bending existed.
function edgeControlPoint(a, b, edge, bendInfo) {
  const info = bendInfo.get(edge.id);
  if (!info || info.count <= 1) return null;
  // The perpendicular axis must be canonical — independent of which node
  // this particular edge calls "source" vs "target" — or two edges in the
  // same parallel group pointing opposite ways would have their a->b
  // direction (and so their perpendicular) flipped relative to each other,
  // silently mirroring one edge's offset onto another's and landing them
  // on the exact same curve instead of fanning out (found by screenshot
  // spot-check, not just the geometry-only unit tests, which happened not
  // to cover a same-pair, opposite-direction case).
  const flip = edge.source > edge.target ? -1 : 1;
  const dx = flip * (b.x - a.x), dy = flip * (b.y - a.y);
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len; // unit perpendicular to the straight line
  const step = info.index - (info.count - 1) / 2; // symmetric around 0
  const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  return { x: mid.x + nx * step * EDGE_BEND_STEP, y: mid.y + ny * step * EDGE_BEND_STEP };
}

function quadraticBezierPoint(a, control, b, t) {
  const mt = 1 - t;
  return {
    x: mt * mt * a.x + 2 * mt * t * control.x + t * t * b.x,
    y: mt * mt * a.y + 2 * mt * t * control.y + t * t * b.y,
  };
}

// Full render/hit-test geometry for one edge: anchors (always at the node
// border, exactly as a straight edge would be), an optional bend control
// point, and the actual midpoint a label/toolbar/rename-prompt should sit
// at — the bezier-evaluated midpoint when bent, the plain segment midpoint
// otherwise (control is null, so this degrades to the pre-bending formula).
function edgeGeometry(edge, bendInfo) {
  const anchors = edgeAnchors(edge);
  if (!anchors) return null;
  const control = edgeControlPoint(anchors.a, anchors.b, edge, bendInfo);
  const mid = control
    ? quadraticBezierPoint(anchors.a, control, anchors.b, 0.5)
    : { x: (anchors.a.x + anchors.b.x) / 2, y: (anchors.a.y + anchors.b.y) / 2 };
  return { a: anchors.a, b: anchors.b, control, mid };
}

function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const lenSq = dx * dx + dy * dy;
  let t = lenSq === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / lenSq;
  t = clamp(t, 0, 1);
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}

// Distance from a point to a bent (or straight) edge: a bent edge is
// sampled into short straight sub-segments and the minimum distance to any
// of them is used — plenty precise at the pixel-scale threshold this is
// compared against, and exact (not an approximation at all) when there's
// no control point, since that's just the single a->b segment.
const EDGE_CURVE_SAMPLES = 16;
function distToEdgePath(px, py, a, control, b) {
  if (!control) return distToSegment(px, py, a.x, a.y, b.x, b.y);
  let prev = a;
  let best = Infinity;
  for (let i = 1; i <= EDGE_CURVE_SAMPLES; i++) {
    const t = i / EDGE_CURVE_SAMPLES;
    const pt = quadraticBezierPoint(a, control, b, t);
    best = Math.min(best, distToSegment(px, py, prev.x, prev.y, pt.x, pt.y));
    prev = pt;
  }
  return best;
}

function findEdgeAt(wx, wy) {
  const threshold = 6 / camera.scale;
  const rect = visibleWorldRect();
  const bendInfo = computeEdgeBendInfo();
  for (let i = state.edges.length - 1; i >= 0; i--) {
    const e = state.edges[i];
    if (e.auto) continue; // contains edges are never drawn, so never hit-testable
    const geo = edgeGeometry(e, bendInfo);
    if (!geo) continue;
    if (!rectsOverlap(edgeBoundingRect(geo, geo.control), rect)) continue;
    if (distToEdgePath(wx, wy, geo.a, geo.control, geo.b) <= threshold) return e;
  }
  return null;
}

// ---------------------------------------------------------------------------
// Canvas sizing (devicePixelRatio-aware)
// ---------------------------------------------------------------------------
let cssWidth = 0, cssHeight = 0, dpr = 1;

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  cssWidth = rect.width;
  cssHeight = rect.height;
  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);
  markDirty();
}

window.addEventListener("resize", resizeCanvas);

// ---------------------------------------------------------------------------
// Viewport culling (Section 6, Section 9): draw/hit-test only what
// intersects the visible camera rect, so cost scales with what's on screen
// rather than total graph size. Padding keeps things that visually extend a
// little past a node/edge's own geometry (resize handles, edge labels, the
// dashed group outline) from popping in/out right at the screen edge;
// expressed in world units scaled by 1/camera.scale so it reads as a
// constant ~50 screen px margin at any zoom level.
//
// Safe for hit-testing, not just drawing: findNodeAt/findEdgeAt etc. are
// always called with a world point derived from a click inside the canvas,
// which is by definition already inside this same rect — so a node/edge
// that doesn't intersect it can never contain that point either. Filtering
// to the visible subset first is a pure speed optimization there, not a
// behavior change.
// ---------------------------------------------------------------------------
function visibleWorldRect() {
  const pad = 50 / camera.scale;
  const topLeft = screenToWorld(0, 0);
  const bottomRight = screenToWorld(cssWidth, cssHeight);
  return {
    x: topLeft.x - pad,
    y: topLeft.y - pad,
    w: (bottomRight.x - topLeft.x) + 2 * pad,
    h: (bottomRight.y - topLeft.y) + 2 * pad,
  };
}

// `control` (optional): a bent edge's curve is entirely within the convex
// hull of {a, control, b} (a property of quadratic beziers), so including
// it here is exact enough for culling — never excludes any point the curve
// actually reaches, at worst includes a little extra straight-line margin.
function edgeBoundingRect(anchors, control) {
  const xs = [anchors.a.x, anchors.b.x], ys = [anchors.a.y, anchors.b.y];
  if (control) { xs.push(control.x); ys.push(control.y); }
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

// Exposed via window.__kg (see below) so tests can assert culling actually
// shrinks the drawn set when zoomed into a small region of a large graph,
// rather than only inferring it indirectly from wall-clock timing (noisy
// in CI) — see Phase 9 in TODO.md.
const renderStats = { nodesDrawn: 0, nodesTotal: 0, edgesDrawn: 0, edgesTotal: 0 };

// ---------------------------------------------------------------------------
// Render loop — dirty-flag driven, not a constant loop.
// ---------------------------------------------------------------------------
const NODE_FONT_SIZE = 16;
const EDGE_FONT_SIZE = 12;
const ARROWHEAD_SIZE = 10;

// Resolves the current theme's CSS custom properties (see :root and
// :root[data-theme="light"] above) into one palette object, computed once
// per render() call rather than once per node/edge — a canvas fillStyle/
// strokeStyle can't take a CSS var() directly, this is the bridge.
function resolveColors() {
  const cs = getComputedStyle(document.documentElement);
  const v = (name, fallback) => cs.getPropertyValue(name).trim() || fallback;
  return {
    gridDot: v("--grid-dot", "#2a2a2a"),
    emptyFg: v("--empty-fg", "#666"),
    nodeFill: v("--node-fill", "#242424"),
    nodeStroke: v("--node-stroke", "#666666"),
    nodeStrokeSelected: v("--node-stroke-selected", "#4da6ff"),
    connectSourceStroke: v("--connect-source-stroke", "#ffb84d"),
    nodeText: v("--node-text", "#e8e8e8"),
    handleFill: v("--handle-fill", "rgba(255,255,255,0.35)"),
    groupFill: v("--group-fill", "rgba(77,166,255,0.06)"),
    groupStroke: v("--group-stroke", "#4d7fa6"),
    importedStroke: v("--imported-stroke", "#e0b13f"), // TXT import: "flagged as newly added" (Section 5.3)
    edgeStroke: v("--edge-stroke", "#8a8a8a"),
    edgeStrokeSelected: v("--edge-stroke-selected", "#4da6ff"),
    edgeLabelFg: v("--edge-label-fg", "#bbbbbb"),
    ghostStroke: v("--ghost-stroke", "#4da6ff"),
    memberFill: v("--member-fill", "rgba(77,189,143,0.07)"),
    memberStroke: v("--member-stroke", "#4dbd8f"),
    groupMoveStroke: v("--group-move-stroke", "#b085f5"),
    groupResizeStroke: v("--group-resize-stroke", "#4dd0e1"),
  };
}

function drawGrid(colors) {
  // Grid spacing adapts to zoom so it stays visually useful at any scale.
  // Drawn manually in screen space (not via ctx transform) to keep dot
  // density/precision sane at extreme zoom (Section 6).
  const targetPx = 60;
  let worldStep = targetPx / camera.scale;
  const pow10 = Math.pow(10, Math.floor(Math.log10(worldStep)));
  const mantissa = worldStep / pow10;
  const niceMantissa = mantissa < 2 ? 1 : mantissa < 5 ? 2 : 5;
  worldStep = niceMantissa * pow10;

  const topLeft = screenToWorld(0, 0);
  const bottomRight = screenToWorld(cssWidth, cssHeight);

  const startX = Math.floor(topLeft.x / worldStep) * worldStep;
  const startY = Math.floor(topLeft.y / worldStep) * worldStep;

  ctx.fillStyle = colors.gridDot;
  const dotRadius = clamp(1.2 * camera.scale, 0.5, 2);

  for (let wx = startX; wx <= bottomRight.x; wx += worldStep) {
    for (let wy = startY; wy <= bottomRight.y; wy += worldStep) {
      const sx = wx * camera.scale + camera.panX;
      const sy = wy * camera.scale + camera.panY;
      ctx.beginPath();
      ctx.arc(sx, sy, dotRadius, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawEmptyState(colors) {
  ctx.save();
  ctx.fillStyle = colors.emptyFg;
  ctx.font = "16px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(t("emptyCanvasMessage", t("addNode")), cssWidth / 2, cssHeight / 2);
  ctx.restore();
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawArrowhead(x, y, dx, dy, size) {
  const angle = Math.atan2(dy, dx);
  const a1 = angle + Math.PI - 0.4;
  const a2 = angle + Math.PI + 0.4;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + size * Math.cos(a1), y + size * Math.sin(a1));
  ctx.lineTo(x + size * Math.cos(a2), y + size * Math.sin(a2));
  ctx.closePath();
  ctx.fill();
}

function drawEdges(colors) {
  const rect = visibleWorldRect();
  const bendInfo = computeEdgeBendInfo();
  let edgesTotal = 0, edgesDrawn = 0;
  for (const edge of state.edges) {
    if (edge.auto) continue; // contains: communicated by nesting only, never drawn
    edgesTotal++;
    const geo = edgeGeometry(edge, bendInfo);
    if (!geo) continue;
    if (!rectsOverlap(edgeBoundingRect(geo, geo.control), rect)) continue; // viewport culling (Section 6/9)
    edgesDrawn++;
    const selected = state.selection.type === "edge" && state.selection.id === edge.id;
    ctx.strokeStyle = selected ? colors.edgeStrokeSelected : colors.edgeStroke;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = selected ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(geo.a.x, geo.a.y);
    if (geo.control) ctx.quadraticCurveTo(geo.control.x, geo.control.y, geo.b.x, geo.b.y);
    else ctx.lineTo(geo.b.x, geo.b.y);
    ctx.stroke();
    if (edge.directed) {
      // Arrowhead follows the curve's actual tangent at the endpoint (the
      // direction from the control point to b), not the straight a->b
      // direction, so it still points the way the bent line is heading —
      // degrades to the old a->b direction exactly when control is null.
      const tailPoint = geo.control || geo.a;
      drawArrowhead(geo.b.x, geo.b.y, geo.b.x - tailPoint.x, geo.b.y - tailPoint.y, ARROWHEAD_SIZE);
    }
    ctx.fillStyle = colors.edgeLabelFg;
    ctx.font = `${EDGE_FONT_SIZE}px system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText(edge.relation, geo.mid.x, geo.mid.y - 4);
  }
  renderStats.edgesTotal = edgesTotal;
  renderStats.edgesDrawn = edgesDrawn;
}

function drawNodes(colors) {
  const rect = visibleWorldRect();
  // Biggest/outermost first so nested boxes always paint on top of their
  // container, regardless of creation order (mirrors hit-test priority).
  // Culled to the visible rect (Section 6/9) before the sort's more
  // expensive per-node draw calls, not before the cheap O(n log n) sort
  // itself — sorting all nodes is negligible next to the canvas calls.
  const drawOrder = [...nodesTopmostFirst(rect)].reverse();
  renderStats.nodesTotal = state.nodes.length;
  renderStats.nodesDrawn = drawOrder.length;
  for (const node of drawOrder) {
    const selected = state.selection.type === "node" && state.selection.id === node.id;
    const isConnectSource = state.connectSource === node.id;
    const isGroup = node.type === "group";
    const isNewlyImported = newlyImportedIds.has(node.id);
    // Group membership hue: any non-group node currently listed in a
    // group's contains (i.e. its own groups[] is non-empty) reads as
    // visually distinct from an ordinary, ungrouped entity — independent
    // of selection, so it stays visible whether or not it's picked.
    const isMember = !isGroup && node.groups.length > 0;
    // The dragged group itself gets a highlight distinguishing a live move
    // (drags its contents along) from a live resize (never does) — only
    // while that specific drag is in flight, reverting to the normal
    // selected/group look the instant the pointer is released.
    const isBeingMoved = isGroup && dragMode === "moveNode" && movingNodeId === node.id;
    const isBeingResized = isGroup && dragMode === "resizeGroup" && resizingNodeId === node.id;

    ctx.fillStyle = isGroup ? colors.groupFill : isMember ? colors.memberFill : colors.nodeFill;
    ctx.strokeStyle = isConnectSource ? colors.connectSourceStroke
      : isBeingMoved ? colors.groupMoveStroke
      : isBeingResized ? colors.groupResizeStroke
      : selected ? colors.nodeStrokeSelected
      : isNewlyImported ? colors.importedStroke
      : isGroup ? colors.groupStroke
      : isMember ? colors.memberStroke
      : colors.nodeStroke;
    ctx.lineWidth = selected || isConnectSource || isNewlyImported || isBeingMoved || isBeingResized ? 3 : 1.5;
    ctx.setLineDash(isGroup ? [8, 5] : []);
    roundRectPath(node.x, node.y, node.w, node.h, 8);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.save();
    roundRectPath(node.x, node.y, node.w, node.h, 8);
    ctx.clip();
    ctx.fillStyle = colors.nodeText;
    ctx.font = `${NODE_FONT_SIZE}px system-ui, sans-serif`;
    if (isGroup) {
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(node.label, node.x + 10, node.y + 8, node.w - 20);
    } else {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(node.label, node.x + node.w / 2, node.y + node.h / 2, node.w - 16);
    }
    ctx.restore();

    ctx.fillStyle = colors.handleFill;
    for (const h of nodeHandles(node)) {
      ctx.beginPath();
      ctx.arc(h.x, h.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    if (isGroup) {
      const rh = groupResizeHandlePoint(node);
      ctx.fillRect(rh.x - 5, rh.y - 5, 10, 10);
    }
  }
}

function drawGhostEdge(colors) {
  if (dragMode !== "createEdge" || !edgeDragSourceId || !edgeDragCurrentWorld) return;
  const src = state.nodes.find((n) => n.id === edgeDragSourceId);
  if (!src) return;
  const cx = src.x + src.w / 2, cy = src.y + src.h / 2;
  const a = rectBorderPoint(src, edgeDragCurrentWorld.x - cx, edgeDragCurrentWorld.y - cy);
  ctx.save();
  ctx.strokeStyle = colors.ghostStroke;
  ctx.setLineDash([6, 4]);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(edgeDragCurrentWorld.x, edgeDragCurrentWorld.y);
  ctx.stroke();
  ctx.restore();
}

const selToolbar = document.getElementById("sel-toolbar");
const selRenameBtn = document.getElementById("sel-rename");
const selToggleDirBtn = document.getElementById("sel-toggle-dir");
const selTrashBtn = document.getElementById("sel-trash");

function updateSelectionToolbar() {
  if (!state.selection.type) { selToolbar.style.display = "none"; return; }
  let anchorWorld;
  if (state.selection.type === "node") {
    const n = state.nodes.find((x) => x.id === state.selection.id);
    if (!n) { selToolbar.style.display = "none"; return; }
    anchorWorld = { x: n.x + n.w, y: n.y };
    selToggleDirBtn.style.display = "none";
  } else {
    const e = state.edges.find((x) => x.id === state.selection.id);
    const geo = e && edgeGeometry(e, computeEdgeBendInfo());
    if (!geo) { selToolbar.style.display = "none"; return; }
    anchorWorld = geo.mid; // the curve's actual midpoint when the edge is bent, not the straight-line one
    selToggleDirBtn.style.display = "";
  }
  const screen = worldToScreen(anchorWorld.x, anchorWorld.y);
  selToolbar.style.display = "flex";
  selToolbar.style.left = `${screen.x}px`;
  selToolbar.style.top = `${screen.y}px`;
}

function updateClearButton() {
  document.getElementById("btn-clear").disabled = state.nodes.length === 0 && state.edges.length === 0;
}

function render() {
  const colors = resolveColors();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawGrid(colors);

  ctx.save();
  ctx.setTransform(dpr * camera.scale, 0, 0, dpr * camera.scale, dpr * camera.panX, dpr * camera.panY);
  drawEdges(colors);
  drawNodes(colors);
  drawGhostEdge(colors);
  ctx.restore();

  if (state.nodes.length === 0) drawEmptyState(colors);

  updateSelectionToolbar();
  updateClearButton();
}

function loop() {
  if (dirty) {
    dirty = false;
    render();
  }
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------------
// Inline text input — used for node-label and edge-relation entry instead of
// native prompt()/confirm(), so it's consistent, stylable, and DOM-testable.
// ---------------------------------------------------------------------------
let activeInlineEditor = null;

// Keeps a fixed-position element's *center* (x, y) far enough inside the
// viewport that its own box never spills off-screen or under the toolbar
// overlay — without this, a rename input anchored near a screen edge (e.g.
// a node close to the window border after panning) could render partly
// invisible, which read as "funky"/"distant" even though the anchor point
// itself was correct.
function clampCenterToViewport(x, y, halfW, halfH) {
  const margin = 8;
  const toolbarBottom = document.getElementById("toolbar").getBoundingClientRect().bottom;
  const minX = halfW + margin;
  const maxX = window.innerWidth - halfW - margin;
  const minY = toolbarBottom + halfH + margin;
  const maxY = window.innerHeight - halfH - margin;
  return {
    x: minX <= maxX ? Math.min(Math.max(x, minX), maxX) : (minX + maxX) / 2,
    y: minY <= maxY ? Math.min(Math.max(y, minY), maxY) : (minY + maxY) / 2,
  };
}

function showInlineInput({ x, y, value = "", placeholder = "", onCommit, onCancel }) {
  cancelInlineInput();
  const input = document.createElement("input");
  input.type = "text";
  input.className = "kg-inline-input";
  input.value = value;
  input.placeholder = placeholder;
  input.style.left = `${x}px`;
  input.style.top = `${y}px`;
  document.body.appendChild(input);
  // Re-clamp using the input's real, laid-out size (min-width 140px plus
  // padding/border) now that it's actually in the DOM.
  const clamped = clampCenterToViewport(x, y, input.offsetWidth / 2, input.offsetHeight / 2);
  input.style.left = `${clamped.x}px`;
  input.style.top = `${clamped.y}px`;
  input.focus();
  input.select();

  let done = false;
  function finish(commit) {
    if (done) return;
    done = true;
    input.removeEventListener("keydown", onKey);
    input.removeEventListener("blur", onBlur);
    input.remove();
    activeInlineEditor = null;
    if (commit) onCommit(input.value);
    else if (onCancel) onCancel();
  }
  function onKey(ev) {
    if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
    else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
  }
  function onBlur() { finish(true); }

  input.addEventListener("keydown", onKey);
  input.addEventListener("blur", onBlur);
  activeInlineEditor = { finish };
}

function cancelInlineInput() {
  if (activeInlineEditor) activeInlineEditor.finish(false);
}

// ---------------------------------------------------------------------------
// Confirm dialog — a centered modal for destructive actions (e.g. Clear),
// used instead of native confirm() for the same reason as the inline text
// input: consistent styling and DOM-testability.
// ---------------------------------------------------------------------------
const confirmOverlay = document.getElementById("confirm-overlay");
const confirmMessageEl = document.getElementById("confirm-message");
const confirmOkBtn = document.getElementById("confirm-ok");
const confirmCancelBtn = document.getElementById("confirm-cancel");
let activeConfirm = null;

function showConfirmDialog({ message, confirmLabel = t("ok"), onConfirm, onCancel }) {
  cancelInlineInput();
  confirmMessageEl.textContent = message;
  confirmOkBtn.textContent = confirmLabel;
  confirmOverlay.style.display = "flex";
  activeConfirm = { onConfirm, onCancel };
}

function closeConfirmDialog(confirmed) {
  if (!activeConfirm) return;
  const { onConfirm, onCancel } = activeConfirm;
  activeConfirm = null;
  confirmOverlay.style.display = "none";
  if (confirmed) { if (onConfirm) onConfirm(); }
  else if (onCancel) onCancel();
}

confirmOkBtn.addEventListener("click", () => closeConfirmDialog(true));
confirmCancelBtn.addEventListener("click", () => closeConfirmDialog(false));
confirmOverlay.addEventListener("click", (e) => {
  if (e.target === confirmOverlay) closeConfirmDialog(false); // click outside the dialog = cancel
});

// ---------------------------------------------------------------------------
// Primary pointer interaction: pan / node-move / edge-creation-drag, plus a
// long-press-to-delete timer. A separate 'click' listener (below) handles
// tap-based flows (select, Add Node placement, Connect mode taps) since
// those are naturally distinguished from drags by the browser's own
// click-vs-drag movement threshold.
// ---------------------------------------------------------------------------
const MOVE_THRESHOLD = 5; // screen px before a press counts as a drag
const LONG_PRESS_MS = 600;

// setPointerCapture/releasePointerCapture throw NotFoundError if the given
// pointer id isn't currently recognized as active (spec-documented, not
// hypothetical) — a bare call left the rest of a handler's cleanup
// (dragMode/panPointerId resets, pinchStartDist) unreachable whenever that
// happened, which could silently break the very next pinch gesture. Wrapped
// so a capture failure is a no-op rather than a derailed handler.
function safeSetPointerCapture(id) {
  try { canvas.setPointerCapture(id); } catch (err) { /* pointer no longer active — nothing to capture */ }
}
function safeReleasePointerCapture(id) {
  try { canvas.releasePointerCapture(id); } catch (err) { /* already released or never captured — nothing to clean up */ }
}

let panPointerId = null;
let panLast = { x: 0, y: 0 };

let dragMode = null; // 'pan' | 'moveNode' | 'createEdge' | 'resizeGroup' | null
let movingNodeId = null;
let moveOffset = { x: 0, y: 0 };
let edgeDragSourceId = null;
let edgeDragCurrentWorld = null;
let resizingNodeId = null;
let resizeStart = { w: 0, h: 0, worldX: 0, worldY: 0 };
let dragBeforeSnapshot = null; // captured at drag-start, for moveNode/resizeGroup undo steps
let longPressTimer = null;
let pointerDownScreen = null;
let suppressNextClick = false;
// The pointer currently driving pan/moveNode/resizeGroup/createEdge. A
// second pointer's own pointerdown must never start an independent second
// interaction through this handler — without this guard, a second touch
// arriving to start a pinch reaches this handler *before* the touch-pinch
// listener below gets a chance to recognize it, and its own hit-test can
// silently reassign dragMode/movingNodeId/panPointerId out from under the
// first pointer's still-active drag, corrupting or losing it entirely
// (see abortActiveDrag()'s doc comment for the concrete failure mode).
let activePointerId = null;

canvas.addEventListener("pointerdown", (e) => {
  if (dragMode !== null && e.pointerId !== activePointerId) return; // an interaction is already owned by another pointer
  if (e.pointerType === "touch" && activeTouches.size >= 2) return; // pinch owns this
  if (e.pointerType === "mouse" && e.button !== 0) return; // primary button only

  if (state.mode !== "idle") return; // addNode/connect: taps handled by 'click'

  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const world = screenToWorld(sx, sy);
  pointerDownScreen = { x: e.clientX, y: e.clientY };

  const resizeHit = findGroupResizeHandleAt(world.x, world.y);
  if (resizeHit) {
    dragMode = "resizeGroup";
    activePointerId = e.pointerId;
    resizingNodeId = resizeHit.id;
    resizeStart = { w: resizeHit.w, h: resizeHit.h, worldX: world.x, worldY: world.y };
    dragBeforeSnapshot = snapshotState();
    selectNode(resizeHit.id);
    safeSetPointerCapture(e.pointerId);
    markDirty();
    return;
  }

  const handleHit = findNodeHandleAt(world.x, world.y);
  if (handleHit) {
    dragMode = "createEdge";
    activePointerId = e.pointerId;
    edgeDragSourceId = handleHit.node.id;
    edgeDragCurrentWorld = world;
    safeSetPointerCapture(e.pointerId);
    markDirty();
    return;
  }

  const nodeHit = findNodeAt(world.x, world.y);
  if (nodeHit) {
    selectNode(nodeHit.id);
    dragMode = "moveNode";
    activePointerId = e.pointerId;
    movingNodeId = nodeHit.id;
    moveOffset = { x: world.x - nodeHit.x, y: world.y - nodeHit.y };
    dragBeforeSnapshot = snapshotState();
    safeSetPointerCapture(e.pointerId);
    longPressTimer = setTimeout(() => {
      const before = snapshotState();
      deleteNode(nodeHit.id);
      pushHistory(before, snapshotState());
      dragMode = null;
      activePointerId = null;
      movingNodeId = null;
      dragBeforeSnapshot = null;
      longPressTimer = null;
    }, LONG_PRESS_MS);
    markDirty();
    return;
  }

  const edgeHit = findEdgeAt(world.x, world.y);
  if (edgeHit) {
    selectEdge(edgeHit.id);
    longPressTimer = setTimeout(() => {
      const before = snapshotState();
      deleteEdge(edgeHit.id);
      pushHistory(before, snapshotState());
      longPressTimer = null;
    }, LONG_PRESS_MS);
    markDirty();
    return; // no pan/move originates from an edge
  }

  panPointerId = e.pointerId;
  panLast = { x: e.clientX, y: e.clientY };
  safeSetPointerCapture(e.pointerId);
  canvas.classList.add("panning");
  dragMode = "pan";
  activePointerId = e.pointerId;
});

canvas.addEventListener("pointermove", (e) => {
  if (dragMode === "pan") {
    if (e.pointerId !== panPointerId) return;
    const dx = e.clientX - panLast.x, dy = e.clientY - panLast.y;
    panLast = { x: e.clientX, y: e.clientY };
    camera.panX += dx;
    camera.panY += dy;
    markDirty();
    return;
  }

  if (dragMode === "moveNode" || dragMode === "createEdge") {
    if (e.pointerId !== activePointerId) return;
    if (pointerDownScreen && longPressTimer) {
      const moved = Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y);
      if (moved > MOVE_THRESHOLD) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }
    const rect = canvas.getBoundingClientRect();
    const world = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    if (dragMode === "moveNode") {
      const node = state.nodes.find((n) => n.id === movingNodeId);
      if (node) {
        const newX = world.x - moveOffset.x, newY = world.y - moveOffset.y;
        const dx = newX - node.x, dy = newY - node.y;
        node.x = newX;
        node.y = newY;
        if (node.type === "group") {
          for (const id of collectContainedDescendants(node.id)) {
            const member = state.nodes.find((n) => n.id === id);
            if (member) { member.x += dx; member.y += dy; }
          }
        }
        markDirty();
      }
    } else {
      edgeDragCurrentWorld = world;
      markDirty();
    }
    return;
  }

  if (dragMode === "resizeGroup") {
    if (e.pointerId !== activePointerId) return;
    const node = state.nodes.find((n) => n.id === resizingNodeId);
    if (node) {
      const rect = canvas.getBoundingClientRect();
      const world = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
      const dx = world.x - resizeStart.worldX, dy = world.y - resizeStart.worldY;
      node.w = Math.max(MIN_GROUP_SIZE, resizeStart.w + dx);
      node.h = Math.max(MIN_GROUP_SIZE, resizeStart.h + dy);
      markDirty();
    }
  }
});

function endPan(e) {
  if (e.pointerId !== panPointerId) return;
  panPointerId = null;
  canvas.classList.remove("panning");
}

canvas.addEventListener("pointerup", (e) => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }

  if (dragMode === "pan") {
    if (e.pointerId !== activePointerId) return;
    // A real pan (movement past the threshold) must not also clear the
    // current selection via the native "click" event the browser still
    // fires after mouseup — without this, panning to look at another part
    // of the graph would silently drop whatever was selected. A plain
    // click with no movement is unaffected and still clears selection via
    // the click handler's fallthrough, exactly as before.
    const moved = pointerDownScreen ? Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y) : 0;
    if (moved > MOVE_THRESHOLD) suppressNextClick = true;
    endPan(e);
    dragMode = null;
    activePointerId = null;
    return;
  }

  if (dragMode === "moveNode") {
    if (e.pointerId !== activePointerId) return;
    const moved = pointerDownScreen ? Math.hypot(e.clientX - pointerDownScreen.x, e.clientY - pointerDownScreen.y) : 0;
    if (moved > MOVE_THRESHOLD) {
      suppressNextClick = true;
      const node = state.nodes.find((n) => n.id === movingNodeId);
      if (node) {
