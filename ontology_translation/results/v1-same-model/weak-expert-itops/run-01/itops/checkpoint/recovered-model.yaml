competency_questions: []
classes:
  Incident:
    meaning: A disruption or degradation requiring managed response and recovery.
    aliases:
      - Issue
    properties:
      startTime:
        type: date
      status:
        type: text
        allowed:
          - New
          - Acknowledged
          - Investigating
          - Contained
          - Recovering
          - Monitoring
          - Resolved
          - Closed
          - Cancelled
      majorIncidentDeclared:
        type: boolean
      category:
        type: text
        allowed:
          - Availability
          - Performance
          - Capacity
          - Network
          - Application
          - Database
          - Infrastructure
          - Data Integrity
          - Cybersecurity
          - Third-Party
          - Change-Induced
          - Other
      affectedArea:
        type: text
        allowed:
          - IT Service
          - Business Service
          - Customer Channel
          - Configuration Item
          - Third-Party Service
      estimatedRecoveryTimeMinutes:
        type: number
        unit: minutes
      estimatedDataLossMinutes:
        type: number
        unit: minutes
      targetRecoveryPoint:
        type: date
      severity:
        type: text
        allowed:
          - Sev1-Critical
          - Sev2-High
          - Sev3-Medium
          - Sev4-Low
      affectedCustomerCount:
        type: number
      urgency:
        type: text
        allowed:
          - Immediate
          - High
          - Normal
          - Low
      postIncidentReviewState:
        type: text
        allowed:
          - Scheduled
          - Completed
          - Not Required
          - Required but Not Yet Scheduled
      restoreStatus:
        type: text
        allowed:
          - Not Started
          - In Progress
          - Succeeded
          - Failed
  ITService:
    meaning: A managed technology service that supports business services or customer channels.
    aliases:
      - Technology Service
      - IT Support Service
    properties:
      currentState:
        type: text
        allowed:
          - Healthy
          - Degraded
          - Partially-Unavailable
          - Unavailable
          - Unknown
  BusinessService:
    meaning: A customer-facing service supported by one or more IT services.
    aliases: []
    properties:
      currentState:
        type: text
        allowed:
          - Healthy
          - Degraded
          - Partially-Unavailable
          - Unavailable
          - Unknown
  CustomerChannel:
    meaning: A way for customers to access banking services that can be affected by an IT service.
    aliases:
      - User Channel
    properties:
      currentState:
        type: text
        allowed:
          - Healthy
          - Degraded
          - Unavailable
          - Unknown
  ConfigurationItem:
    meaning: A managed component that supports one or more IT services or business services.
    aliases:
      - CI
      - Managed Item
    properties:
      currentState:
        type: text
        allowed:
          - Healthy
          - Degraded
          - Partially-Available
          - Unavailable
          - Unknown
  ThirdPartyService:
    meaning: A service provided by an external party that an IT service depends on.
    aliases:
      - External Service
    properties:
      currentState:
        type: text
        allowed:
          - Healthy
          - Degraded
          - Unavailable
          - Unknown
  Alert:
    meaning: A detection signal that may require acknowledgment and can be correlated with an incident.
    aliases: []
    properties:
      acknowledgementState:
        type: text
        allowed:
          - New
          - Acknowledged
          - Suppressed
          - Escalated
          - Closed
  Event:
    meaning: A recorded occurrence that provides context for an incident or may indicate state changes in IT services.
    aliases: []
    properties:
      occurrenceTime:
        type: date
  ServiceOwner:
    meaning: The person accountable for the lifecycle and operational fitness of an IT service.
    aliases: []
    properties: {}
  ResolverGroup:
    meaning: The team responsible for diagnosing and restoring specific technology or service areas.
    aliases:
      - Resolver Team
    properties: {}
  OnCallEngineer:
    meaning: The engineer currently available to handle incidents on behalf of a Resolver Group.
    aliases: []
    properties: {}
  ApplicationOwner:
    meaning: "The person accountable for an application's operational fitness and its alignment with business needs."
    aliases: []
    properties: {}
  TechnicalOwner:
    meaning: "The person responsible for the engineering, maintenance, and operational support of configuration items."
    aliases: []
    properties: {}
  IncidentResponseTeam:
    meaning: The cross-functional team responsible for coordinating the response to significant incidents.
    aliases: []
    properties: {}
  Runbook:
    meaning: "A documented procedure for diagnosis, response, recovery, or verification of incidents."
    aliases: []
    properties:
      currentState:
        type: text
        allowed:
          - Available
          - Under Review
          - Obsolete
          - Not Applicable
  Workaround:
    meaning: "A temporary method that reduces or bypasses an incident's impact on services."
    aliases: []
    properties:
      currentState:
        type: text
        allowed:
          - Active
          - Inactive
          - Obsolete
          - Not Applicable
  BackupSet:
    meaning: A collection of recoverable backup data intended for restoration.
    aliases: []
    properties:
      lastSuccessfulBackupTime:
        type: date
      status:
        type: text
        allowed:
          - Scheduled
          - Running
          - Successful
          - Failed
          - Expired
          - Corrupted
          - Verified
  RecoveryPlan:
    meaning: A documented plan that details the steps for restoring an IT service and its dependencies.
    aliases: []
    properties:
      recoveryTimeObjectiveMinutes:
        type: number
        unit: minutes
      recoveryPointObjectiveMinutes:
        type: number
        unit: minutes
      currentState:
        type: text
        allowed:
          - Activated
          - Available
          - Under Review
          - Not Applicable
  MaterialityAssessment:
    meaning: "An evaluation of an incident's significance and the potential obligation to report it to regulators."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Draft
          - Under Review
          - Completed
      reportabilityConclusion:
        type: text
        allowed:
          - Not Reportable
          - Potentially Reportable
          - Reportable
          - Undetermined
      regulatoryContext:
        type: text
        allowed:
          - Financial Compliance
          - Data Protection
          - Operational Risk Management
          - Regulatory Reporting
  Stakeholder:
    meaning: A person or group with an interest in an affected business service who may require updates during an incident.
    aliases: []
    properties:
      contactInformation:
        type: text
  StakeholderCommunication:
    meaning: "A message about an incident sent to stakeholders, tracked for delivery status and content."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Draft
          - Pending-Approval
          - Approved
          - Submitted
          - Accepted
          - Rejected
          - Withdrawn
      messageContent:
        type: text
      sentTime:
        type: date
  RegulatoryNotification:
    meaning: A formal submission of an incident report to a regulator when reporting is required.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Draft
          - Pending-Approval
          - Approved
          - Submitted
          - Accepted
          - Rejected
          - Withdrawn
      reportContent:
        type: text
  Evidence:
    meaning: "A record or artifact retained to support incident analysis, accountability, and compliance."
    aliases: []
    properties:
      form:
        type: text
        allowed:
          - Document
          - Log
          - Artifact
          - Screenshot
          - Other
  CorrectiveAction:
    meaning: "A tracked measure arising from an incident intended to remove a root cause, reduce risk, or improve response capability."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Open
          - In-progress
          - Blocked
          - Implemented
          - Verified
          - Closed
          - Cancelled
  Change:
    meaning: "A controlled addition, modification, or removal of a component or service that may affect an IT service."
    aliases: []
    properties:
      implementationTime:
        type: date
      isEmergency:
        type: boolean
      status:
        type: text
        allowed:
          - Draft
          - Assessed
          - Approved
          - Scheduled
          - Implementing
          - Implemented
          - Failed
          - Rolled-back
          - Closed
          - Cancelled
      implementationPlan:
        type: text
      backoutPlan:
        type: text
  Deployment:
    meaning: The technical execution that installs or activates a release or change in a system or service.
    aliases: []
    properties:
      executionTime:
        type: date
  Regulator:
    meaning: An authority responsible for receiving incident notifications within its scope of oversight and jurisdiction.
    aliases: []
    properties:
      oversightArea:
        type: text
        allowed:
          - Banking
          - Securities
          - Insurance
          - Consumer Protection
          - Payment Services
      geographicalJurisdiction:
        type: text
        allowed:
          - Domestic
          - European Union
          - International
          - Regional
