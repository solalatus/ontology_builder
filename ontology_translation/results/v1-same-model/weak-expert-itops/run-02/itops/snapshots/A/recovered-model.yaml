competency_questions: []
classes:
  Incident:
    meaning: A disruption or potential disruption being managed through the incident response process.
    aliases: []
    properties:
      currentStatus:
        type: text
        allowed:
          - New
          - Acknowledged
          - Investigation
          - Contained
          - Recovering
          - Monitoring
          - Resolved
          - Closed
          - Cancelled
      severityLevel:
        type: text
        allowed:
          - Sev1 - Critical
          - Sev2 - High
          - Sev3 - Medium
          - Sev4 - Low
      majorIncidentDeclared:
        type: boolean
      expectedResolutionTime:
        type: date
      statusChangedAt:
        type: date
      closedAt:
        type: date
  ITService:
    meaning: A managed technology capability that supports one or more business services and whose operation or recovery may be affected by an incident.
    aliases:
      - Service
    properties:
      currentHealth:
        type: text
        allowed:
          - Healthy
          - Degraded
          - Partially Unavailable
          - Unavailable
          - Recovering
          - Unknown
  ResolverGroup:
    meaning: A team responsible for diagnosing and resolving incidents that affect the IT services it supports.
    aliases:
      - Support Team
    properties: {}
  Stakeholder:
    meaning: "A person, group, or organization that may be affected by or responsible for an operational outcome and may receive incident updates."
    aliases: []
    properties:
      audienceType:
        type: text
        allowed:
          - Technical
          - Management
          - Business
          - Customer
          - Vendor
          - Regulator
          - All Staff
      emailAddress:
        type: text
  OnCallEngineer:
    meaning: A technical engineer available through a resolver group for immediate response to incidents as they occur.
    aliases:
      - On-Call Technician
    properties:
      currentAvailability:
        type: text
        allowed:
          - Available
          - Unavailable
  ServiceOwner:
    meaning: "The person accountable for the overall management, performance, and delivery of an IT service affected by an incident."
    aliases: []
    properties:
      emailAddress:
        type: text
  BusinessOwner:
    meaning: The person responsible for overseeing business outcomes associated with processes supported by an IT service.
    aliases: []
    properties:
      emailAddress:
        type: text
  IncidentResponseTeam:
    meaning: The cross-functional team engaged to coordinate the response and management of a major incident.
    aliases: []
    properties: {}
  SeniorManagement:
    meaning: Leaders involved in major-incident decision-making and updates to ensure alignment with organizational priorities.
    aliases: []
    properties: {}
  Alert:
    meaning: An actionable signal from monitoring that indicates a potential issue with an IT service or its components.
    aliases: []
    properties:
      currentStatus:
        type: text
        allowed:
          - New
          - Acknowledged
          - Suppressed
          - Escalated
          - Closed
      acknowledgedAt:
        type: date
  Event:
    meaning: A time-stamped observation of a noteworthy occurrence that may or may not produce an alert and reflects a significant change in system state.
    aliases: []
    properties:
      currentlyActive:
        type: boolean
  ConfigurationItem:
    meaning: A managed component that supports one or more IT services and is maintained to support their operation.
    aliases: []
    properties:
      currentHealth:
        type: text
        allowed:
          - Active
          - Inactive
          - Under Maintenance
          - Unhealthy
  ThirdPartyService:
    meaning: A service provided by an external organization on which an IT service may rely.
    aliases: []
    properties:
      currentAvailability:
        type: text
        allowed:
          - Available
          - Unavailable
          - Degraded
          - Maintenance Mode
  Workaround:
    meaning: A temporary solution to reduce the impact of an issue or incident without resolving the underlying problem.
    aliases: []
    properties:
      currentlyAvailable:
        type: boolean
  Runbook:
    meaning: "Documented operational steps guiding the diagnosis, response, or recovery of an incident."
    aliases: []
    properties:
      procedure:
        type: text
  RecoveryPlan:
    meaning: Documented procedures and actions required to restore an affected IT service to normal operation.
    aliases: []
    properties:
      currentStatus:
        type: text
        allowed:
          - Draft
          - Approved
          - Implemented
          - Failed
          - Rolled Back
      steps:
        type: text
  KnownError:
    meaning: A documented issue with an identified cause that may help understand or resolve related incidents.
    aliases: []
    properties:
      description:
        type: text
  CorrectiveAction:
    meaning: Follow-up work intended to prevent recurrence or address findings from an incident or post-incident review.
    aliases: []
    properties:
      currentStatus:
        type: text
        allowed:
          - Open
          - In Progress
          - Blocked
          - Implemented
          - Verified
          - Closed
          - Cancelled
  MaterialityAssessment:
    meaning: "An evaluation of an incident's significance that informs whether reporting or other actions are required."
    aliases: []
    properties:
      completionStatus:
        type: text
        allowed:
          - Not Started
          - In Progress
          - Completed
      assessmentOutcome:
        type: text
  RegulatoryNotification:
    meaning: A record of incident information prepared or submitted to a regulator for compliance purposes.
    aliases: []
    properties:
      submissionStatus:
        type: text
        allowed:
          - Draft
          - Pending Approval
          - Approved
          - Submitted
          - Accepted
          - Rejected
          - Withdrawn
      submittedAt:
        type: date
  StakeholderCommunication:
    meaning: A recorded incident update intended for identified recipients to inform them of its status and implications.
    aliases: []
    properties:
      sentStatus:
        type: text
        allowed:
          - Draft
          - Pending Approval
          - Approved
          - Sent
          - Rejected
          - Withdrawn
      sentAt:
        type: date
      communicatedIncidentStatus:
        type: text
      messageText:
        type: text
  Evidence:
    meaning: "Collected material or a reference to material that supports incident analysis, documentation, or accountability."
    aliases: []
    properties:
      descriptionOrReference:
        type: text
  EmergencyChange:
    meaning: "An urgent change linked to an incident to address immediate operational needs, with implementation and backout plans."
    aliases: []
    properties:
      currentStatus:
        type: text
        allowed:
          - Draft
          - Assessed
          - Approved
          - Scheduled
          - Implementing
          - Implemented
          - Failed
          - Rolled Back
          - Closed
      implementationPlan:
        type: text
      backoutPlan:
        type: text
  BackupSet:
    meaning: A stored recovery point available for restoring an IT service or configuration item to a previous state.
    aliases: []
    properties:
      currentStatus:
        type: text
        allowed:
          - Scheduled
          - Running
          - Successful
          - Failed
          - Expired
          - Corrupted
          - Verified
      restorePoint:
        type: text
  PostIncidentReview:
    meaning: "A recorded evaluation of incident response effectiveness, lessons learned, and recommendations for improvement."
    aliases: []
    properties:
      currentStatus:
        type: text
        allowed:
          - Scheduled
          - In Progress
          - Completed
          - Reviewed
  ContainmentMeasure:
    meaning: "An individual action taken to limit an incident's impact on IT services and associated processes."
    aliases: []
    properties:
      executed:
        type: boolean
      currentlyInEffect:
        type: boolean
      actionTaken:
        type: text
  Environment:
    meaning: "An operating context, such as production, testing, or development, in which an IT service operates or an incident occurs."
    aliases: []
    properties: {}
  IncidentCommander:
    meaning: The specifically designated person who leads coordination and declaration of a major incident.
    aliases: []
    properties: {}
relationships:
  - name: impacts
    from: Incident
    to: ITService
    meaning: The incident disrupts or threatens operation of the IT service.
    aliases: []
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: The group recorded as responsible for managing and resolving the incident.
    aliases: []
  - name: supportedBy
    from: ITService
    to: ResolverGroup
    meaning: The group supports the service and can be recommended to handle incidents affecting it.
    aliases: []
  - name: hasOnCallEngineer
    from: ResolverGroup
    to: OnCallEngineer
    meaning: An engineer available through the group for immediate incident response.
    aliases: []
  - name: ownedBy
    from: ITService
    to: ServiceOwner
    meaning: "The person accountable for the service's management, performance, and delivery."
    aliases: []
  - name: overseenBy
    from: ITService
    to: BusinessOwner
    meaning: The person responsible for overseeing the business outcomes supported by the service.
    aliases: []
  - name: engages
    from: Incident
    to: IncidentResponseTeam
    meaning: The team activated to coordinate response and management of the incident.
    aliases: []
  - name: involves
    from: Incident
    to: SeniorManagement
    meaning: Leaders involved in decisions or updates regarding the incident.
    aliases: []
  - name: hasCommunication
    from: Incident
    to: StakeholderCommunication
    meaning: An update prepared or sent about the incident to keep stakeholders informed.
    aliases: []
  - name: sentTo
    from: StakeholderCommunication
    to: Stakeholder
    meaning: A recipient to whom this incident update was sent.
    aliases: []
  - name: affectsStakeholder
