    aliases: []
  - name: dependsOnItservice
    from: ThirdPartyService
    to: ITService
    meaning: null
    aliases: []
  - name: dependsOnItservice
    from: ITService
    to: ThirdPartyService
    meaning: null
    aliases: []
  - name: reliesOnThirdPartyService
    from: ITService
    to: ThirdPartyService
    meaning: An external service on which this IT service depends for operation.
    aliases: []
  - name: hasWorkaround
