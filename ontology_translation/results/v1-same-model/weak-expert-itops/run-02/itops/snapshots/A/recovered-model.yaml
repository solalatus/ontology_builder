    aliases: []
  - name: hasRecoveryPlan
    from: Incident
    to: RecoveryPlan
    meaning: The plan identified to restore the IT service affected by this incident.
    aliases: []
  - name: relatesToKnownError
    from: Incident
    to: KnownError
    meaning: A documented error that may help explain or resolve the incident.
    aliases: []
  - name: hasRunbook
    from: ITService
    to: Runbook
    meaning: Guidance designated for responding to incidents affecting this service.
    aliases: []
  - name: linkedToPreviousIncident
    from: Incident
    to: Incident
    meaning: A prior incident connected to the current one that may provide relevant context.
    aliases: []
  - name: hasCorrectiveAction
    from: Incident
    to: CorrectiveAction
    meaning: Follow-up work associated with this incident to address findings or prevent recurrence.
    aliases: []
  - name: hasMaterialityAssessment
