    aliases: []
rules:
  canAcknowledgeAlert:
    conditions:
      - Alert current status is known and is New.
      - The executing system must confirm operator authorization for the responsible resolver group; alert status alone does not establish authorization.
  canAssignIncident:
    conditions:
      - "Incident current status is known and is New, Acknowledged, Investigation, Contained, Recovering, or Monitoring."
      - The proposed resolver group supports an IT service impacted by the incident.
      - "When multiple resolver groups qualify, a person must choose the group; no recorded primary service or lead-group designation currently resolves the choice."
      - No available on-call engineer does not block group assignment; any staffing warning must be communicated outside the incident record because no field currently records it.
  canContainIncident:
    conditions:
      - Incident current status is known and is Acknowledged or Investigation.
      - A containment measure is linked to the incident.
      - Readiness to execute the measure requires an external or manual check; no recorded readiness status exists.
  canExecuteEmergencyChange:
    conditions:
      - Emergency change current status is known and is Approved.
      - The emergency change has an implementation plan and a backout plan.
      - The emergency change is linked to the incident.
  canSendStakeholderCommunication:
    conditions:
      - Stakeholder communication sent status is known and is Approved.
      - "The communication has message text covering the incident's current status and impact."
      - Intended recipients must be verified externally before sending; communication records currently have no pre-send intended-recipient list.
      - Current records do not reliably match service owners or business owners to stakeholder recipient records; those recipients must be identified externally until owner-to-stakeholder links are populated.
      - Senior Management recipient membership must also be verified externally when applicable; Stakeholder audience type Management is too broad.
  canRestoreBackup:
    conditions:
      - Backup set current status is known and is Verified.
      - "Backup set matches the affected IT service or, for a component-specific restore, a configuration item identified externally as affected by the incident; the current records cannot identify incident-affected configuration items automatically."
  canConductPostIncidentReview:
    conditions:
      - "Incident current status is known and is Monitoring, Resolved, or Closed."
      - Post-incident review current status is Scheduled.
  declarationOperationalPrerequisites:
    conditions:
      - "Incident current status is known and is New, Acknowledged, or Investigation."
      - A specific Incident Commander is designated for the incident and belongs to the Incident Response Team selected for engagement; the team need not yet be engaged.
      - These conditions alone do not establish that the incident qualifies as major.
  notificationSubmissionPrerequisites:
    conditions:
      - "The incident's materiality assessment is Completed."
      - The regulatory notification submission status is Approved.
      - These conditions alone do not establish that regulatory notification is required.
  incidentClosurePrerequisites:
    conditions:
      - Incident current status is known and is Resolved or Monitoring.
      - "Required incident evidence and stakeholder communications must be complete, but there is no approved recorded way to identify all required items yet."
  isActiveCorrelatedAlert:
    conditions:
      - "Alert current status is known and is New, Acknowledged, Suppressed, or Escalated; Closed is not active."
      - The alert signals the incident in question.
  isOutstandingCorrectiveAction:
    conditions:
      - "Corrective action current status is known and is Open, In Progress, or Blocked."
      - The corrective action belongs to a previous incident linked to the current incident.
  impactedServicesFullyHealthy:
    conditions:
      - Every IT service impacted by the incident has current health Healthy.
      - "Every incident-affected configuration item relevant to those services has current health Active; current records do not identify which configuration items are incident-affected, so this check requires external identification and cannot yet pass automatically."
      - Every third-party service on which an impacted IT service relies has current availability Available.
  recoveryPlanInPlace:
    conditions:
      - The incident has a linked recovery plan whose current status is Approved or Implemented.
  currentIncidentStatusCommunicated:
    conditions:
      - A communication linked to the incident has sent status Sent.
      - "Its communicated incident status matches the incident's current status."
      - "Its sentAt time is known and is no earlier than the incident's known statusChangedAt time."
      - The communication has at least one sentTo link to a stakeholder to whom it was dispatched.
      - Confirmed dispatch suffices for this question; actual delivery and coverage of every required recipient are not established.
actions:
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: "After the executing system confirms operator authorization, set alert current status to Acknowledged and record the acknowledgment time."
    verification: Read back the alert and confirm current status is Acknowledged and acknowledgment time is recorded.
  assignIncident:
    input: Incident
    preconditions:
      - canAssignIncident
    effect: "After a person resolves any multiple-group choice, link the incident to the selected resolver group without changing incident status or storing an engineer on the incident; communicate lack of available on-call coverage externally where applicable."
    verification: "Read back the incident's assigned resolver group and confirm it is the selected group and status is unchanged; check on-call availability and flag any lack of coverage outside the incident record."
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: "After the manual measure-readiness check, execute the linked measure, mark it executed, set incident currentStatus to Contained and update statusChangedAt."
    verification: "Read back the incident and measure; confirm status is Contained, statusChangedAt reflects the change and the measure is executed."
  executeEmergencyChange:
    input: EmergencyChange
    preconditions:
      - canExecuteEmergencyChange
    effect: Implement the linked emergency change according to its implementation plan and set its current status to Implemented upon success.
    verification: Read back the emergency change and confirm current status is Implemented; check implementation evidence where required.
  sendStakeholderCommunication:
    input: StakeholderCommunication
    preconditions:
      - canSendStakeholderCommunication
    effect: "Only after external confirmation of intended recipients, send the approved incident update, set sent status to Sent, record sent time and sent-to recipient links."
    verification: "Read back communication status, sent time and sent-to recipients; compare the actual recipients with the externally confirmed intended recipients, including any required Senior Management recipients."
  restoreBackup:
    input: BackupSet
    preconditions:
      - canRestoreBackup
    effect: Restore the matching service or component from the verified backup set and record the incident-to-backup-set used link; do not automatically change service or component health.
    verification: Confirm the restore operation succeeded and read independently assessed health of the affected IT service or configuration item and availability of relevant third-party dependencies; do not infer recovery merely from restore completion.
  conductPostIncidentReview:
    input: PostIncidentReview
    preconditions:
      - canConductPostIncidentReview
    effect: Start the incident-linked post-incident review by changing its current status from Scheduled to In Progress.
    verification: Read back the review; confirm status is In Progress and it is linked to the intended incident.
  declareMajorIncident:
    input: Incident
    preconditions:
      - declarationOperationalPrerequisites
    effect: "After external confirmation that the incident qualifies as major, set majorIncidentDeclared to true and engage the Incident Response Team, without changing incident currentStatus."
    verification: "Read back the incident; confirm majorIncidentDeclared is true, currentStatus is unchanged, the Incident Response Team is engaged, and the designated Incident Commander belongs to that team."
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - notificationSubmissionPrerequisites
    effect: "Only after external confirmation that notification is required, submit the approved notification, set submissionStatus to Submitted and record submission time."
    verification: Read back the notification and confirm status is Submitted and submission time is recorded.
  closeIncident:
    input: Incident
    preconditions:
      - incidentClosurePrerequisites
    effect: "Only after external confirmation that required evidence and communications are complete, set incident currentStatus to Closed, update statusChangedAt and record closedAt."
    verification: "Read back the incident and confirm status is Closed, statusChangedAt and closedAt record closure time; review linked records against externally confirmed requirements."
