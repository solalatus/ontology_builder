      - carries
  - name: freightContainerContainsCargo
    from: FreightContainer
    to: Cargo
    meaning: Identifies the cargo held in the freight container without a duplicate container record.
    aliases:
      - stores
      - carries
  - name: recordsInformationAboutShipment
