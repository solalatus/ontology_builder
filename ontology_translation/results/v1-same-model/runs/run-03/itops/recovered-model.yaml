competency_questions: []
classes:
  ITService:
    meaning: A managed technology capability used to support business services.
    aliases:
      - Informatikai szolgáltatás
      - informatics service
    properties:
      healthState:
        type: text
        allowed:
          - Healthy
          - degraded
          - partially unavailable
          - unavailable
          - recovering
          - unknown
  BusinessService:
    meaning: "A customer- or business-facing capability the bank delivers, which can depend on IT services."
    aliases:
      - Üzleti szolgáltatás
    properties:
      healthState:
        type: text
        allowed:
          - Healthy
          - degraded
          - partially unavailable
          - unavailable
          - recovering
          - unknown
  CustomerChannel:
    meaning: A way customers access a business service.
    aliases:
      - Ügyfélcsatorna
    properties: {}
  ConfigurationItem:
    meaning: A managed component within configuration-management scope that can be investigated or considered for isolation without presuming isolation is safe.
    aliases:
      - CI
      - konfigurációs elem
    properties: {}
  ThirdPartyService:
    meaning: "An external service on which an IT service depends, distinct from its provider."
    aliases:
      - outsourced service
      - külső szolgáltatás
    properties: {}
  Application:
    meaning: A software system providing business or operational functionality that can implement an IT service and whose function may be checked after restoration.
    aliases:
      - App
      - alkalmazás
    properties: {}
  Environment:
    meaning: "A deployment context, including production and disaster recovery, whose type does not establish its current availability."
    aliases:
      - Környezet
    properties:
      type:
        type: text
        allowed:
          - Production
          - disaster recovery
          - pre-production
          - test
          - development
          - management
  Event:
    meaning: A time-stamped observation of a state change or noteworthy occurrence.
    aliases:
      - Esemény
    properties: {}
  Alert:
    meaning: A monitoring or security signal requiring triage or acknowledgement that may indicate an event without necessarily opening an incident.
    aliases:
      - Riasztás
    properties:
      status:
        type: text
        allowed:
          - New
          - acknowledged
          - suppressed
          - escalated
          - closed
      acknowledgedAt:
        type: date
  Incident:
    meaning: "An unplanned interruption, degradation, or security condition requiring managed response."
    aliases:
      - Incidens
      - hibajegy
    properties:
      status:
        type: text
        allowed:
          - New
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      declaredMajorAt:
        type: date
      isMajor:
        type: boolean
      isCybersecurityRelated:
        type: boolean
      impact:
        type: text
      severity:
        type: text
        allowed:
          - Sev 1—critical
          - Sev 2—high
          - Sev 3—medium
          - Sev 4—low
      closedAt:
        type: date
  Change:
    meaning: "A controlled addition, modification, or removal affecting an IT service; an emergency change follows an accelerated path with distinct execution checks."
    aliases:
      - Változás
      - módosítás
    properties:
      status:
        type: text
        allowed:
          - Draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled back
          - closed
          - cancelled
      isEmergency:
        type: boolean
      riskLevel:
        type: text
        allowed:
          - Low
          - medium
          - high
          - critical
      implementationPlan:
        type: text
      backoutPlan:
        type: text
  Deployment:
    meaning: The technical execution that installs or activates a release or change and targets an environment; the recorded change-to-deployment trace passes through a release.
    aliases:
      - Telepítés
      - élesítés
    properties:
      executionStatus:
        type: text
        allowed:
          - Planned
          - running
          - succeeded
          - failed
          - rolled back
          - cancelled
      executedAt:
        type: date
  ServiceOwner:
    meaning: The accountable person for an IT service.
    aliases:
      - Szolgáltatásgazda
    properties: {}
  ResolverGroup:
    meaning: A group assigned to diagnose and restore incidents for services or components it supports.
    aliases:
      - support group
      - megoldócsoport
    properties: {}
  OnCallEngineer:
    meaning: An individual member of a resolver group available for time-critical incident work.
    aliases:
      - on-call
      - ügyeletes mérnök
    properties: {}
  IncidentCommander:
    meaning: "The named person accountable for command, coordination, and decision cadence during a major incident."
    aliases:
      - incident manager
      - MIM lead
      - incidensparancsnok
    properties: {}
  ApplicationOwner:
    meaning: The person accountable for an application affected by an incident or restoration.
    aliases:
      - Alkalmazásgazda
    properties: {}
  TechnicalOwner:
    meaning: The person accountable for the engineering and maintenance of a configuration item.
    aliases:
      - Technikai gazda
    properties: {}
  IncidentResponseTeam:
    meaning: The team coordinating the wider cross-functional response to a major incident.
    aliases:
      - IRT
      - incidenskezelő csapat
    properties: {}
  Runbook:
    meaning: "A maintained procedure for diagnosis, response, recovery, or verification."
    aliases:
      - playbook
      - üzemeltetési eljárás
    properties: {}
  Workaround:
    meaning: "A temporary way to reduce or bypass impact, which may be documented in a runbook."
    aliases:
      - Kerülőmegoldás
    properties: {}
  BackupSet:
    meaning: "A defined collection of recoverable backup data for protected components, without guaranteeing that a particular copy or restore point is usable."
    aliases:
      - backup
      - mentéskészlet
    properties:
      status:
        type: text
        allowed:
          - Scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      lastSuccessfulBackupAt:
        type: date
      lastVerifiedAt:
        type: date
  RecoveryPlan:
    meaning: "A documented approach to restoring an IT service and its dependencies, with objectives that do not by themselves approve a particular recovery action."
    aliases:
      - DR plan
      - helyreállítási terv
    properties:
      lastReviewedAt:
        type: date
      recoveryTimeObjective:
        type: number
      recoveryPointObjective:
        type: number
  MaterialityAssessment:
    meaning: "A documented assessment of an incident's significance and reporting implications, including a result and rationale that may still be undetermined."
    aliases:
      - reportability assessment
      - lényegességi értékelés
    properties:
      result:
        type: text
        allowed:
          - Not reportable
          - potentially reportable
          - reportable
          - undetermined
      rationale:
        type: text
      reportingDueAt:
        type: date
  RegulatoryNotification:
    meaning: An incident-related formal submission record addressed to a competent authority that may exist before approval or submission.
    aliases:
      - supervisory notification
      - felügyeleti bejelentés
    properties:
      status:
        type: text
        allowed:
          - Draft
          - pending approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submittedAt:
        type: date
      dueAt:
        type: date
  Communication:
    meaning: "A controlled message to an operational, business, customer, vendor, or regulatory audience whose approval, sending, and delivery are distinct."
    aliases:
      - Értesítés
      - tájékoztatás
    properties:
      status:
        type: text
        allowed:
          - Draft
          - pending approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      finalMessage:
        type: text
      sentAt:
        type: date
  EvidenceItem:
    meaning: "A preserved record, artifact, or observation supporting analysis and accountability whose collection and integrity can be checked."
    aliases:
      - evidence
      - bizonyíték
    properties:
      integrityStatus:
        type: text
        allowed:
          - Collected
          - hashed
          - verified
          - sealed
          - compromised
      collectedAt:
        type: date
      cryptographicHash:
        type: text
  PostIncidentReview:
    meaning: "A structured review of causes, response effectiveness, lessons, and follow-up work that may be scheduled before it is held."
    aliases:
      - PIR
      - RCA review
      - incidens utóelemzés
    properties:
      heldAt:
        type: date
  CorrectiveAction:
    meaning: "A tracked step to remove a cause, reduce risk, or improve response capability, owned here by an organizational unit and tracked through status and due date."
    aliases:
      - remediation action
      - helyesbítő intézkedés
    properties:
      status:
        type: text
        allowed:
          - Open
          - in progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueAt:
        type: date
  Regulator:
    meaning: A competent authority that supervises the bank or receives required notifications.
    aliases:
      - supervisory authority
      - felügyeleti hatóság
    properties: {}
  Stakeholder:
    meaning: "A person, group, or organization affected by or responsible for an operational outcome."
    aliases:
      - Érintett
    properties: {}
  Release:
    meaning: A governed package of approved changes introduced together and delivered by a deployment.
    aliases:
      - Kiadás
    properties: {}
  InfrastructureComponent:
    meaning: "A technical component providing compute, network, platform, endpoint, or storage capability."
    aliases:
      - Infrastruktúra-elem
    properties: {}
  Database:
    meaning: A managed persistent data store used by an application or service.
    aliases:
      - DB
      - adatbázis
    properties: {}
  KnownError:
    meaning: A diagnosed problem with a documented cause or workaround used to find candidate mitigations.
    aliases:
      - Ismert hiba
    properties: {}
  OrganizationalUnit:
    meaning: A governed unit of the bank with defined responsibilities that can own a corrective action.
    aliases:
      - Szervezeti egység
    properties: {}
