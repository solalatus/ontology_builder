rules:
  canAcknowledgeAlert:
    conditions:
      - Alert status is new and valid.
      - Operator is authorized for the responsible resolver group.
  canAssignIncident:
    conditions:
      - Incident status is not closed or cancelled.
      - An affected IT service or configuration item is identified for the incident.
      - "Approved support-routing information verifies that the candidate resolver group supports that affected service or item; identifying an affected service or item alone is insufficient, and if the match cannot be verified, do not assign."
  canDeclareMajorIncident:
    conditions:
      - "Incident status is verified and is not resolved, closed, or cancelled."
      - Incident severity is verified and is Sev 1—critical or Sev 2—high.
      - At least one impacted IT service is identified.
      - A named incident commander is assigned.
  canContainIncident:
    conditions:
      - Incident status is acknowledged or investigating.
      - Containment scope and expected side effects are recorded.
      - Steps to execute are approved for this containment.
  canIsolateConfigurationItem:
    conditions:
      - The configuration item is linked directly to the incident as affected.
      - The isolation impact has been assessed.
      - A rollback or reconnection method is available.
  canFailOverService:
    conditions:
      - Recovery plan applies to the affected IT service.
      - Target recovery environment is currently available.
      - Proposed data-recovery point is acceptable under the applicable recovery policy.
  canRestoreFromBackup:
    conditions:
      - Backup set status is successful or verified and the set protects the target configuration item.
      - Selected restore point is approved.
      - Target environment is approved.
  canImplementEmergencyChange:
    conditions:
      - The change is verified as an emergency change.
      - The change is linked as justified by an active incident.
      - Configuration items the change modifies are identified.
      - Implementation plan and backout plan are present.
      - Risk acceptance is explicit; recorded status and risk level do not substitute for it.
  canSendCommunication:
    conditions:
      - Communication has a valid recorded approval state and the required approval for sending has actually been verified; approval does not establish delivery.
      - "Audience, message, and owner are verified from the governed communication record or approval process."
      - Content reflects the latest verified incident state.
  canSubmitRegulatoryNotification:
    conditions:
      - Notification status is approved.
      - "Linked materiality assessment result is reportable, not potentially reportable or undetermined."
      - Incident and recipient regulator are identified.
      - Required fields and supporting evidence are complete.
      - "Notification due time is known and valid, and submission strictly precedes it; a late submission does not satisfy this precondition."
  canCloseIncident:
    conditions:
      - Incident status is resolved or monitoring.
      - Resolution and restoration evidence are recorded.
      - Every impacted service is healthy or has an accepted residual condition.
      - Required stakeholder communications are complete.
      - "If the incident is major or cybersecurity-related, a post-incident review is scheduled or completed; both classifications do not automatically require two reviews."
actions:
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: Change alert status to acknowledged and record the acknowledgement timestamp.
    verification: Read the alert back and confirm acknowledged status and the recorded acknowledgement timestamp.
  assignIncident:
    input: Incident
    preconditions:
      - canAssignIncident
    effect: "Record the incident's assignment to the eligible resolver group."
    verification: Read back the incident assignment and confirm the selected resolver group is recorded.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: "Record major classification, named commander, and declaration time; start major-incident coordination and the communication cadence."
    verification: "Read back major classification, commander, and declaration time from governed incident records and inspect the communication record."
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: "Execute approved containment steps, record their results, and set status to contained only after containment is verified."
    verification: "Check containment indicators and remaining service impact, then read back the recorded results and incident status."
  isolateConfigurationItem:
    input: ConfigurationItem
    preconditions:
      - canIsolateConfigurationItem
    effect: Isolate the incident-linked item and retain the isolation record; the rollback or reconnection method was verified available before acting.
    verification: Confirm the item is isolated from the defined networks or dependencies and check remaining service health.
  failOverITService:
    input: ITService
    preconditions:
      - canFailOverService
    effect: Move the affected service workload to the recovery environment under its applicable recovery plan and retain evidence of where it ran.
    verification: Verify service health and critical business transactions in the recovery environment and inspect the retained execution evidence.
  restoreFromBackupSet:
    input: BackupSet
    preconditions:
      - canRestoreFromBackup
    effect: Restore backup data to the approved target using the approved restore point and retain what was restored and where.
    verification: Validate data integrity and application functionality and inspect the retained restoration record.
  implementEmergencyChange:
    input: Change
    preconditions:
      - canImplementEmergencyChange
    effect: "Implement the approved emergency change, update its status, and retain implementation evidence; keep its backout plan available if needed."
    verification: "Run technical checks, verify service health, and read back the change status and retained implementation evidence."
  sendCommunication:
    input: Communication
    preconditions:
      - canSendCommunication
    effect: "Send the approved message to the identified stakeholder, record its sent time, and archive the final message and sending record."
    verification: Confirm delivery status separately from approval or sending; read back communication status and sent time and inspect the archived message.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: "Submit the approved notification to the identified regulator, record its submission time, and retain the submission receipt or rejection record."
    verification: "Confirm acceptance and read back status and submission time; if rejected, record the rejection and required remediation rather than treating submission as success."
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: Set incident status to closed and record the closure time.
    verification: "Read back the incident and linked services and confirm closed status, closure time, and retained evidence; health, communications, and review arrangements were checked before closure."
