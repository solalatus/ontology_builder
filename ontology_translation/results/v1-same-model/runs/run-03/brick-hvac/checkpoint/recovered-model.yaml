competency_questions: []
classes:
  Floor:
    meaning: A level of the building that contains spaces.
    aliases:
      - storey
    properties: {}
  Space:
    meaning: "An individual area of the building, such as an office or meeting room."
    aliases: []
    properties: {}
  Zone:
    meaning: An area controlled together for heating or cooling that may cover one or several spaces.
    aliases: []
    properties:
      occupancyStatus:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  AirHandler:
    meaning: Equipment that conditions and supplies air upstream of terminal units.
    aliases:
      - AHU
      - air handler unit
    properties:
      operatingStatus:
        type: text
        allowed:
          - "on"
          - "off"
          - alarm
  TerminalUnit:
    meaning: Equipment downstream of an air handler that serves a space locally.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - "on"
          - "off"
          - alarm
  Thermostat:
    meaning: A device controlling a zone with an associated temperature reading and setpoint.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - normal
          - fault
          - offline
  TemperatureSensor:
    meaning: An identifiable temperature-reading source associated with a zone thermostat.
    aliases: []
    properties:
      temperatureReading:
        type: number
        unit: °C
  Fan:
    meaning: An air-handler component that moves air.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Filter:
    meaning: An air-handler component that removes material from the air stream.
    aliases: []
    properties:
      conditionStatus:
        type: text
        allowed:
          - clean
          - dirty
          - replacement_due
  Damper:
    meaning: An air-handler component that changes or shuts off airflow.
    aliases: []
    properties:
      position:
        type: number
        unit: "%"
  CoolingValve:
    meaning: "A valve regulating cold-water flow through an air handler's cooling coil."
    aliases: []
    properties:
      position:
        type: number
        unit: "%"
  HeatingValve:
    meaning: "A valve regulating hot-water flow through an air handler's heating coil."
    aliases: []
    properties:
      position:
        type: number
        unit: "%"
  Chiller:
    meaning: Plant equipment supplying the chilled-water path upstream of a cooling valve.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Boiler:
    meaning: Plant equipment supplying the hot-water path upstream of a heating valve.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Pump:
    meaning: Plant equipment that circulates water through a plant loop.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  CoolingTower:
    meaning: Plant equipment that rejects heat from the chiller side.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  AirTemperatureSensor:
    meaning: An identifiable sensor providing an air-temperature reading for an air handler.
    aliases: []
    properties:
      temperatureReading:
        type: number
        unit: °C
  WaterTemperatureSensor:
    meaning: An identifiable sensor providing a plant-loop water-temperature reading.
    aliases: []
    properties:
      temperatureReading:
        type: number
        unit: °C
  Economizer:
    meaning: An air-handler component whose operation can reduce mechanical conditioning when suitable sensed conditions are confirmed.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - disabled
          - enabled
          - active
  CO2Sensor:
    meaning: An identifiable air-handler CO2 measurement point whose particular measurement role is not established.
    aliases: []
    properties:
      concentration:
        type: number
        unit: ppm
  OutsideAirCO2Sensor:
    meaning: A measurement point for outside-air CO2 concentration.
    aliases: []
    properties:
      concentration:
        type: number
        unit: ppm
  ReturnAirCO2Sensor:
    meaning: A measurement point for return-air CO2 concentration.
    aliases: []
    properties:
      concentration:
        type: number
        unit: ppm
  CO2DifferentialSensor:
    meaning: A measurement point reporting the inside–outside CO2 difference directly.
    aliases: []
    properties:
      insideOutsideDifference:
        type: number
        unit: ppm
  ThermostatTemperatureSetpoint:
    meaning: "A control point specifying a thermostat's target temperature for its zone."
    aliases: []
    properties: {}
  AirTemperatureSetpoint:
    meaning: An air-handler control point specifying an air-temperature target.
    aliases: []
    properties:
      targetTemperature:
        type: number
        unit: °C
  CoolingTemperatureSetpoint:
    meaning: An air-handler control point specifying a cooling temperature target.
    aliases: []
    properties:
      targetTemperature:
        type: number
        unit: °C
  HeatingTemperatureSetpoint:
    meaning: An air-handler control point specifying a heating temperature target.
    aliases: []
    properties:
      targetTemperature:
        type: number
        unit: °C
  TemperatureDeadbandSetpoint:
    meaning: An air-handler control point specifying the configured temperature deadband used to leave heating and cooling unchanged.
    aliases: []
    properties:
      temperatureDifference:
        type: number
        unit: °C
  PackagedHeatPump:
    meaning: Equipment that provides heating or cooling upstream of a terminal unit on a non-central-air path.
    aliases: []
    properties:
      operatingMode:
        type: text
        allowed:
          - heating
          - cooling
          - "off"
  SpaceHeater:
    meaning: Equipment that provides heat directly to a space.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Building:
    meaning: The identifiable building that locates its floors and air handlers.
    aliases: []
    properties: {}
  AirPlenum:
    meaning: An identifiable part of air distribution whose upstream air handler can be traced.
    aliases: []
    properties:
      airflowState:
        type: text
        allowed:
          - supply
          - return
          - exhaust
  OccupancySensor:
    meaning: An identifiable source of occupied or unoccupied readings for a space or zone.
    aliases: []
    properties:
      occupancyReading:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  TemperatureSetpoint:
    meaning: An identifiable temperature target associated with a thermostat.
    aliases: []
    properties:
      targetTemperature:
        type: number
        unit: °C
