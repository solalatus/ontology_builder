rules:
  canIncreaseAirHandlerCooling:
    conditions:
      - "The air handler's relevant measured air temperature is reliable and its measurement role is confirmed."
      - The applicable cooling temperature setpoint is identified and reliable.
      - The measured air temperature is above that cooling setpoint.
  canIncreaseAirHandlerHeating:
    conditions:
      - "The air handler's relevant measured air temperature is reliable and its measurement role is confirmed."
      - The applicable heating temperature setpoint is identified and reliable.
      - The measured air temperature is below that heating setpoint.
  isWithinApplicableDeadband:
    conditions:
      - The relevant measured temperature is reliable and its measurement role is confirmed.
      - The active setpoint and configured temperature deadband are identified and reliable.
      - The measured temperature is within the configured deadband around the active setpoint.
  canEnableAirHandlerEconomizer:
    conditions:
      - The target air handler and its economizer are identified.
      - Reliable relevant sensing establishes that economizer operation is suitable for reducing mechanical conditioning; CO2 alone or the mere presence of outside-air and return-air points does not establish suitability.
  canVerifyOccupiedZoneConditioning:
    conditions:
      - "The zone is confirmed occupied, or a relevant space is confirmed occupied with verified membership in that zone; unknown occupancy does not satisfy this condition."
      - "A thermostat serving the zone is verified, or a terminal unit serving the relevant space is verified with confirmed zone-to-space membership."
  canConfirmZoneCoolingCall:
    conditions:
      - "The zone's measured temperature comes from a verified relevant source and is reliable."
      - "The cooling setpoint applicable to this zone is identified and reliable; the thermostat's single temperature setpoint alone does not establish it."
      - The measured temperature supports a cooling call under the confirmed applicable cooling control settings.
  canConfirmZoneHeatingCall:
    conditions:
      - "The zone's measured temperature comes from a verified relevant source and is reliable."
      - "The heating setpoint applicable to this zone is identified and reliable; the thermostat's single temperature setpoint alone does not establish it."
      - The measured temperature supports a heating call under the confirmed applicable heating control settings.
  shouldInvestigateVentilation:
    conditions:
      - The return-air CO2 point and any outside-air or direct inside–outside differential point used for comparison have verified measurement roles and reliable readings.
      - The expected condition for the served air stream is established.
      - The return-air CO2 reading is elevated relative to that expected condition using the identified readings.
      - "Recommend a ventilation check as an investigation, not an emergency solely on this CO2 comparison."
  fanNeedsAttention:
    conditions:
      - "The identified fan's operating status is alarm."
  filterNeedsAttention:
    conditions:
      - "The identified filter's condition status is dirty or replacement_due."
  damperNeedsAttention:
    conditions:
      - The required damper position for current operating conditions is established.
      - "The identified damper's reported position differs from the required position."
actions:
  increaseAirHandlerCooling:
    input: AirHandler
    preconditions:
      - canIncreaseAirHandlerCooling
    effect: "Command the air handler's cooling path to increase cooling; this does not authorize a change to plant equipment or necessarily command a cooling valve directly."
    verification: Check subsequent relevant air-temperature readings for a downward trend toward the applicable cooling setpoint; inspect cooling-valve position if available and report lack of improvement rather than assuming success.
  increaseAirHandlerHeating:
    input: AirHandler
    preconditions:
      - canIncreaseAirHandlerHeating
    effect: "Command the air handler's heating path to increase heating; this does not authorize changing plant equipment or require a direct heating-valve command."
    verification: Check subsequent relevant air-temperature readings for an upward trend toward the applicable heating setpoint; inspect heating-valve position if available and report the result unverified if the trend is absent.
  enableAirHandlerEconomizer:
    input: AirHandler
    preconditions:
      - canEnableAirHandlerEconomizer
    effect: Request economizer operation on the air handler to reduce mechanical cooling after suitable sensed conditions are confirmed.
    verification: Confirm an active economizer status or another unit indication that actually shows economizer operation; enabled alone does not verify operation.
  leaveAirHandlerConditioningUnchanged:
    input: AirHandler
    preconditions:
      - isWithinApplicableDeadband
    effect: Make no heating or cooling adjustment on the basis of this temperature comparison; do not suppress investigation of a separate alarm.
    verification: Check subsequent relevant temperature readings against the active setpoint and configured deadband and confirm they remain within the band.
  verifyOccupiedZoneConditioning:
    input: Zone
    preconditions:
      - canVerifyOccupiedZoneConditioning
    effect: "Check the confirmed serving device's operating status in context and record the evidence and any finding needing investigation; make no equipment command. If its status cannot be confirmed, record the result as unverified rather than passed."
    verification: "Retain evidence of confirmed occupancy and serving assignment and check the assigned device's current operating status in context; only a confirmed appropriate operating state supports a passed check."
