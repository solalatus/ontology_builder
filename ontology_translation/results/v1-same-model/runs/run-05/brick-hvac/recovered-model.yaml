competency_questions: []
classes:
  Building:
    meaning: The office building whose floors and controlled zones the agent tracks.
    aliases: []
    properties: {}
  Floor:
    meaning: A level in the building that contains spaces.
    aliases:
      - storey
    properties: {}
  Space:
    meaning: "A bounded physical area used for a function, which need not be a single room."
    aliases: []
    properties: {}
  Zone:
    meaning: "A control grouping with similar heating or cooling needs maintained under one controlling device, without assuming its member spaces are verified."
    aliases: []
    properties:
      occupancyStatus:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  AirHandler:
    meaning: "An assembly that moves and conditions air, potentially mixing, filtering, heating, or cooling it before feeding a plenum or terminal unit."
    aliases:
      - AHU
      - air handling unit
      - air handler unit
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  TerminalUnit:
    meaning: Equipment that regulates airflow or temperature delivered to the area it serves.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Plenum:
    meaning: "An air-path space that receives air for distribution, return, or exhaust."
    aliases: []
    properties: {}
  Thermostat:
    meaning: "A device assigned to maintain a zone's temperature against a setpoint, with separate recorded mode and status."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - normal
          - fault
          - offline
      mode:
        type: text
        allowed:
          - heating
          - cooling
          - auto
          - "off"
  TemperatureSensor:
    meaning: "A point that measures temperature, with its medium left unspecified unless established."
    aliases: []
    properties:
      reading:
        type: number
        unit: °C
  CO2Sensor:
    meaning: "A point that measures CO₂ in air, without assuming which air stream it measures."
    aliases: []
    properties:
      reading:
        type: number
        unit: ppm
  OccupancySensor:
    meaning: "A point that detects whether an area is occupied and reports occupied, unoccupied, or unknown."
    aliases: []
    properties:
      occupancy:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  Setpoint:
    meaning: "A desired temperature value used for control, whose broad name does not establish whether it is an air, cooling, or heating target."
    aliases: []
    properties:
      value:
        type: number
        unit: °C
  Fan:
    meaning: A component that produces airflow through an air handler.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Filter:
    meaning: "A component that removes material from an air handler's air stream."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - clean
          - dirty
          - replacement due
  Damper:
    meaning: "A component that changes airflow resistance or rate, or shuts airflow off."
    aliases: []
    properties:
      position:
        type: number
        unit: "%"
  HeatingValve:
    meaning: A valve that modulates hot-water flow through a heating coil to control air temperature.
    aliases: []
    properties:
      position:
        type: number
        unit: "%"
  CoolingValve:
    meaning: A valve that modulates chilled-water flow through a cooling coil to control air temperature.
    aliases: []
    properties:
      position:
        type: number
        unit: "%"
  Boiler:
    meaning: "Plant equipment supplying heat to a hot-water heating path, without establishing which particular valve it feeds."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Chiller:
    meaning: "Plant equipment supplying chilled water to a cooling path, without establishing which particular valve it feeds."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Economizer:
    meaning: An air-handler arrangement that uses suitable sensed conditions to reduce mechanical conditioning.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - disabled
          - enabled
          - active
  Pump:
    meaning: "Equipment that moves fluid, without establishing which loop it serves."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  CoolingTower:
    meaning: "Plant equipment that rejects heat from a cooling system, without establishing which cooling path it serves."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  HeatExchanger:
    meaning: "Equipment that transfers heat between media, without establishing its place on a particular path."
    aliases:
      - HX
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  AirTemperatureSensor:
    meaning: A point that measures air temperature.
    aliases: []
    properties:
      reading:
        type: number
        unit: °C
  WaterTemperatureSensor:
    meaning: A point that measures water temperature without itself identifying a loop.
    aliases: []
    properties:
      reading:
        type: number
        unit: °C
  ThermostatTemperatureSensor:
    meaning: null
    aliases: []
    properties: {}
  OutsideAirCO2Sensor:
    meaning: A point that measures CO₂ concentration in the outside-air stream.
    aliases: []
    properties:
      reading:
        type: number
        unit: ppm
  ReturnAirCO2Sensor:
    meaning: A point that measures CO₂ concentration in the return-air stream.
    aliases: []
    properties:
      reading:
        type: number
        unit: ppm
  CO2DifferentialSensor:
    meaning: "A point that directly measures the difference between inside-air and outside-air CO₂, rather than either individual concentration."
    aliases: []
    properties:
      reading:
        type: number
        unit: ppm
  AirTemperatureSetpoint:
    meaning: A point setting a desired air temperature for its associated air handler.
    aliases: []
    properties:
      value:
        type: number
        unit: °C
  CoolingTemperatureSetpoint:
    meaning: A temperature target used for cooling control when applicable.
    aliases: []
    properties:
      value:
        type: number
        unit: °C
  HeatingTemperatureSetpoint:
    meaning: A temperature target used for heating control when applicable.
    aliases: []
    properties:
      value:
        type: number
        unit: °C
  Deadband:
    meaning: "A temperature deadband setpoint defining a width around the active target, applied according to configured control context."
    aliases: []
    properties:
      width:
        type: number
        unit: °C
