rules:
  coolingNeeded:
    conditions:
      - A usable air-temperature reading is obtained from an air-temperature sensor associated with the air handler being checked.
      - "The handler's applicable cooling temperature setpoint and its value are established under the current control context."
      - The measured air temperature is above that applicable cooling setpoint.
  heatingNeeded:
    conditions:
      - A usable air-temperature reading is obtained from an air-temperature sensor associated with the air handler being checked.
      - "The handler's applicable heating temperature setpoint and its value are established under the current control context."
      - The measured air temperature is below that applicable heating setpoint.
  withinDeadband:
    conditions:
      - A usable air-temperature reading is obtained from the sensor associated with the air handler.
      - The active setpoint and its usable value are established for this handler under current control context.
      - "The handler's configured deadband width and the method of applying it to the active setpoint are established."
      - The measured air temperature falls within the resulting allowed band.
  canCheckOccupiedZone:
    conditions:
      - "Occupancy is confirmed as occupied for the zone, not inferred from a sensor associated only with a space."
      - A thermostat is directly assigned to this zone; a terminal unit cannot be used for this first-pass check without verified zone-to-space membership.
  servingDeviceOperating:
    conditions:
      - The thermostat directly assigned to the occupied zone has a usable current status.
      - "A normal status supports a finding that the thermostat appears to be operating; fault or offline is reported as a problem, not a reason to skip the check."
      - Thermostat status alone does not prove temperature-control availability or that the zone has reached temperature.
  economizerSuitable:
    conditions:
      - "The particular air handler's economizer and the sensing required by its configured control strategy are identified and evidenced, rather than inferred from its presence or CO₂ points."
      - "Usable current sensed conditions are established and meet that strategy's criteria for reducing mechanical conditioning."
      - "If required inputs or criteria are not established, suitability is unverified."
  commandPermitted:
    conditions:
      - "Explicit confirmation is available that the agent's approved BAS access permits the specific command on the specific air handler."
      - Explicit confirmation is available that the applicable operating procedure permits the same command on that air handler.
      - "Without both confirmations, do not issue a command; a supported recommendation remains possible."
  thermostatHasControlPoints:
    conditions:
      - "When relying on an assigned thermostat for temperature control, its associated temperature sensor is identified."
      - Its associated temperature setpoint is identified.
      - Presence of both points does not replace the thermostat status check or prove the zone is comfortable.
actions:
  checkOccupiedZoneConditioning:
    input: Zone
    preconditions:
      - canCheckOccupiedZone
    effect: "Read the directly assigned thermostat's recorded status and report whether it appears to be operating, reports a problem, or the check is incomplete; if checking temperature-control availability, identify both its associated temperature sensor and temperature setpoint and report any missing point as incomplete. Retain the occupancy indication, thermostat assignment, and status with the finding. Do not infer a terminal unit from an unverified zone-to-space connection or claim the zone is at temperature."
    verification: "Confirm the assigned thermostat's recorded status and, when checking temperature-control availability, its associated temperature sensor and setpoint; report unavailable evidence as incomplete without claiming the zone is at temperature."
  holdSteadyWithinDeadband:
    input: AirHandler
    preconditions:
      - withinDeadband
    effect: "Leave heating and cooling commands unchanged when withinDeadband is verified; if it cannot be verified, also leave commands unchanged but report unverified, not a successful hold-steady decision. Retain the initial reading, active setpoint, and configured deadband context."
    verification: Obtain a subsequent associated air-temperature reading and check it against the same active setpoint and configured deadband application; retain the follow-up result or report verification unavailable.
  callForMoreCooling:
    input: AirHandler
    preconditions:
      - coolingNeeded
    effect: "Recommend more cooling through the handler's identified cooling path; issue a specific BAS cooling command only if commandPermitted is independently confirmed for this handler and command. Record the starting air-temperature reading, applicable cooling target and control context, and whether the response was recommended or permitted and attempted; do not infer a particular plant fault."
    verification: "Check subsequent associated air-temperature readings for a downward trend toward the applicable cooling setpoint; report a missing or absent trend with the command or recommendation outcome, without issuing another command or diagnosing a component."
  callForMoreHeating:
    input: AirHandler
    preconditions:
      - heatingNeeded
    effect: "Recommend more heating through the handler's identified heating path; issue a specific BAS heating command only if commandPermitted is independently confirmed for this handler and command. Record the starting air-temperature reading, applicable heating target and control context, and whether the response was recommended or permitted and attempted; do not infer a particular plant fault."
    verification: "Check subsequent associated air-temperature readings for an upward trend toward the applicable heating setpoint; report a missing or absent trend with the command or recommendation outcome, without issuing another command or diagnosing a component."
  useEconomizer:
    input: AirHandler
    preconditions:
      - economizerSuitable
    effect: "Recommend economizer operation for this handler only when its identified economizer's sensing, current conditions, and configured strategy support reducing mechanical conditioning; issue an enable command only if commandPermitted is separately confirmed for the specific handler and command. Retain suitability evidence and whether operation was recommended or permitted and commanded."
    verification: "Check the handler's associated economizer status for active; if status is unavailable or only enabled, report operation unverified and retain the follow-up status rather than claiming success."
