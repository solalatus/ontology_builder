rules:
  canPrepareShipment:
    conditions:
      - The particular shipment is identified.
      - Its ship-from and ship-to locations are identified.
      - A preparation process is identified for this shipment.
      - "Either a carrier is identified for that preparation process, or freight forwarding is confirmed as arranged for this particular shipment; a forwarder's name or general service listing is not sufficient evidence."
  canDispatchShipment:
    conditions:
      - The particular shipment to be dispatched is identified.
  canReceiveShipment:
    conditions:
      - The particular shipment is identified and its ship-to location is known.
      - A receiving process is identified for this shipment and occurred at a facility.
      - "Confirm that this receiving facility is the destination facility for this shipment; the evidence for matching the facility to its ship-to location remains unestablished, so do not record receipt if the match cannot be confirmed."
      - A transport process is identified specifically as arrival evidence for this receipt.
      - That transport process is confirmed to have reached its destination node; its named end node alone does not prove arrival.
  canRecordTrackingEvent:
    conditions:
      - "At least one identified target is a shipment, lot, logistic unit, or load."
      - The event time is present as a usable date.
      - The event type is present and known as text.
  canReviewSupplyArrangement:
    conditions:
      - The particular Supply Arrangement (supply relationship) is identified.
      - "It depends on the intended identified supplier, customer, and material trade item."
actions:
  prepareShipment:
    input: Shipment
    preconditions:
      - canPrepareShipment
    effect: "Document the shipment's ship-from and ship-to locations and its identified preparation process, together with the carrier involved in that process or the confirmed forwarding arrangement for this particular shipment; do not mark the preparation process complete."
    verification: "Check both shipping locations, the preparation process identified for this shipment, and the recorded carrier or shipment-specific forwarding confirmation; if forwarding evidence cannot be retrieved, do not claim that route is verified."
  dispatchShipment:
    input: Shipment
    preconditions:
      - canDispatchShipment
    effect: Dispatch the identified shipment for movement; the representation of the dispatch outcome has not yet been established.
    verification: Confirm that the shipment selected for dispatch was the intended one; independent evidence that it was actually sent remains unestablished and must not be claimed.
  receiveShipment:
    input: Shipment
    preconditions:
      - canReceiveShipment
    effect: "Record the identified shipment as received at the destination facility through its identified receiving process, adding the received-at-facility result."
    verification: Confirm receipt of that shipment at that destination facility and completion of its identified receiving process; how completion and arrival are recorded or read back remains open.
  recordTrackingEvent:
    input: TrackingEvent
    preconditions:
      - canRecordTrackingEvent
    effect: "Record the tracking event's event date and event type and its tracks connection to each identified eligible shipment, lot, logistic unit, or load target."
    verification: "Read the recorded event and confirm its event date, event type, and identified tracked target or targets were retained."
  reviewSupplyArrangement:
    input: SupplyArrangement
    preconditions:
      - canReviewSupplyArrangement
    effect: "Read and review the existing supply relationship's supplier, customer, and material trade item dependencies without changing them or creating a review record."
    verification: "Confirm that the reviewed relationship retains links to the intended supplier, customer, and material trade item."
