competency_questions: []
classes:
  Supplier:
    meaning: A trading partner that supplies goods or services.
    aliases: []
    properties: {}
  Customer:
    meaning: A trading partner that receives the goods or services supplied.
    aliases: []
    properties: {}
  Item:
    meaning: "The material trade item, the tradable goods an order or shipment concerns rather than their engineering specification."
    aliases:
      - material trade item
    properties: {}
  SupplyArrangement:
    meaning: "A supply relationship dependent on an identified supplier, customer, and material trade item, distinct from a purchase order or contract."
    aliases:
      - supply relationship
    properties: {}
  PurchaseOrder:
    meaning: A request or agreement for supply that identifies the item concerned.
    aliases:
      - order
    properties: {}
  Shipment:
    meaning: "A traceable goods unit prepared, dispatched, or received."
    aliases: []
    properties: {}
  TransportProcess:
    meaning: "The actual movement associated with a shipment, starting at one supply-chain node and ending at another."
    aliases: []
    properties: {}
  ShipFromLocation:
    meaning: The place a shipment is sent from.
    aliases: []
    properties: {}
  ShipToLocation:
    meaning: The place a shipment is sent to.
    aliases: []
    properties: {}
  Facility:
    meaning: "A physical site used for supply-chain work, such as preparing or receiving shipments."
    aliases: []
    properties: {}
  StorageFacility:
    meaning: A facility used to store goods or traceable units.
    aliases: []
    properties: {}
  SupplyChainNode:
    meaning: "An origin, destination, or operating point that a transport process can run between."
    aliases: []
    properties: {}
  StorageProcess:
    meaning: Planned work that stores goods or traceable units at a storage facility.
    aliases: []
    properties: {}
  Carrier:
    meaning: A supplier that carries or transports shipments.
    aliases: []
    properties: {}
  FreightForwarder:
    meaning: A party that arranges freight forwarding rather than necessarily carrying the shipment itself.
    aliases: []
    properties: {}
  FreightForwardingService:
    meaning: The commercial service that provides freight-forwarding capability and involves a freight forwarder.
    aliases: []
    properties: {}
  Container:
    meaning: A physical item used to hold or transport goods.
    aliases: []
    properties: {}
  Cargo:
    meaning: Goods carried as a load in transport or logistics work.
    aliases: []
    properties: {}
  Lot:
    meaning: A batch-level unit for tracking goods.
    aliases: []
    properties: {}
  Sublot:
    meaning: A subdivision of a lot used in tracking.
    aliases: []
    properties: {}
  LogisticUnit:
    meaning: A handling unit for tracking goods.
    aliases: []
    properties: {}
  Load:
    meaning: A unit prepared for handling or transport.
    aliases: []
    properties: {}
  TrackingEvent:
    meaning: A record of what happened to a tracked thing and when.
    aliases: []
    properties:
      eventTime:
        type: date
      eventType:
        type: text
  ShipmentPreparationProcess:
    meaning: Work that gets an identified shipment ready for dispatch at a facility.
    aliases: []
    properties: {}
  ReceivingProcess:
    meaning: The work of receiving an incoming shipment or goods at a facility.
    aliases: []
    properties: {}
  LogisticsService:
    meaning: A commercial service providing logistics capability for supply-chain work.
    aliases: []
    properties: {}
  TransportationService:
    meaning: The commercial service that provides transport capability for moving goods and involves a carrier.
    aliases: []
    properties: {}
  PackagingService:
    meaning: A commercial service providing packaging capability for goods.
    aliases: []
    properties: {}
  StorageService:
    meaning: A commercial service providing storage capability for goods.
    aliases: []
    properties: {}
