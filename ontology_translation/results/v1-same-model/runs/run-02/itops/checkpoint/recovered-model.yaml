competency_questions: []
classes:
  Incident:
    meaning: "A managed record of an unplanned interruption, degradation, or security condition."
    aliases:
      - incidens
      - hibajegy
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      majorIncident:
        type: boolean
      declarationTime:
        type: date
      category:
        type: text
        allowed:
          - availability
          - performance
          - capacity
          - network
          - application
          - database
          - infrastructure
          - data-integrity
          - cybersecurity
          - third-party
          - change-induced
          - other
      classification:
        type: text
      resolutionTime:
        type: date
      detectedTime:
        type: date
      openedTime:
        type: date
      closedTime:
        type: date
  BusinessService:
    meaning: A capability the bank delivers to customers or the business.
    aliases:
      - üzleti szolgáltatás
    properties:
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  CustomerChannel:
    meaning: A way customers access a business service.
    aliases:
      - ügyfélcsatorna
    properties: {}
  ITService:
    meaning: A managed technology capability supporting a business service.
    aliases:
      - informatikai szolgáltatás
      - informatics service
    properties:
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  ConfigurationItem:
    meaning: A managed component identified for impact analysis and isolation.
    aliases:
      - CI
      - konfigurációs elem
    properties:
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  ThirdPartyService:
    meaning: An externally provided service on which an IT service may depend.
    aliases:
      - outsourced service
      - külső szolgáltatás
    properties: {}
  Event:
    meaning: A time-stamped observation of a state change or other noteworthy occurrence.
    aliases:
      - esemény
    properties:
      observedAt:
        type: date
      eventType:
        type: text
      detectionSource:
        type: text
  Alert:
    meaning: A signal requiring triage or acknowledgement.
    aliases:
      - riasztás
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      raisedAt:
        type: date
      summary:
        type: text
      detectionSource:
        type: text
      severity:
        type: text
      occurrenceCount:
        type: number
  ServiceOwner:
    meaning: The person accountable for an IT service across its lifecycle.
    aliases:
      - szolgáltatásgazda
    properties: {}
  ResolverGroup:
    meaning: A team assigned to diagnose and restore a service or technology area.
    aliases:
      - megoldócsoport
      - support group
    properties: {}
  OnCallEngineer:
    meaning: A member of a resolver group handling time-critical technical response.
    aliases:
      - ügyeletes mérnök
      - on-call
    properties: {}
  IncidentCommander:
    meaning: A member of the incident response team who commands a major incident.
    aliases:
      - incident manager
      - incidensparancsnok
      - MIM lead
    properties: {}
  NetworkOperations:
    meaning: The function that operates monitoring for network and infrastructure services.
    aliases:
      - network operations centre
      - NOC
      - hálózatüzemeltetési központ
    properties: {}
  SecurityOperations:
    meaning: The function that monitors and investigates security events.
    aliases:
      - security operations centre
      - SOC
      - biztonsági műveleti központ
    properties: {}
  IncidentResponseTeam:
    meaning: The function that coordinates significant incident response.
    aliases:
      - IRT
      - incidenskezelő csapat
    properties: {}
  ServiceDesk:
    meaning: "The function that receives, records, triages, and routes user-reported incidents."
    aliases:
      - help desk
      - ügyfélszolgálati IT pult
      - hibabejelentő
    properties: {}
  Runbook:
    meaning: "A maintained procedure for diagnosis, response, recovery, or verification."
    aliases:
      - üzemeltetési eljárás
      - playbook
    properties: {}
  Workaround:
    meaning: A temporary way to reduce or bypass an impact.
    aliases:
      - kerülőmegoldás
    properties: {}
  BackupSet:
    meaning: Recoverable data protecting particular configuration items.
    aliases:
      - mentéskészlet
      - backup
