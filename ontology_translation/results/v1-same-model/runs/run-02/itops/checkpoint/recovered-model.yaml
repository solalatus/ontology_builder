        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      lastSuccessfulBackup:
        type: date
      lastVerification:
        type: date
  RecoveryPlan:
    meaning: A plan for restoring an IT service and its dependencies.
    aliases:
