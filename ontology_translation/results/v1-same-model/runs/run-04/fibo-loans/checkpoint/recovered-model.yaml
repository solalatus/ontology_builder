rules:
  loanSetupReady:
    conditions:
      - The loan has a borrower and a lender.
      - The loan has an applicable fixed or variable interest rate.
      - The loan has interest whose payment is governed by applicable interest payment terms.
  securedLoanCollateralSupported:
    conditions:
      - The input is already identified as a secured loan.
      - That secured loan is linked to collateral; a secured label alone does not satisfy this check.
  variableRateSetupReady:
    conditions:
      - The loan has a variable interest rate.
      - The same loan has an interest rate reset schedule; another kind of schedule does not count.
  paymentRecordComplete:
    conditions:
      - The loan has a payment history.
      - "That payment history has at least one individual actual payment transaction, not only scheduled payments."
  prepaymentPenaltyTimingConfirmed:
    conditions:
      - Evidence establishes that the prepayment terms apply to the input loan; this association is not yet modeled.
      - Those same prepayment terms have a numeric prepayment penalty period recorded in months.
      - "A period on unrelated terms, or a missing association, cannot confirm the check; neither the presence of a period nor this check establishes permission to prepay."
actions:
  checkLoanSetupReadiness:
    input: Loan
    preconditions:
      - loanSetupReady
    effect: "Report core setup confirmed only when the rule is supported; otherwise report unconfirmed and identify missing evidence, without changing loan terms."
    verification: "Re-read the loan's borrower, lender, applicable interest rate, interest obligation and interest payment terms governing that interest, then compare them with the reported result."
  checkSecuredLoanSupport:
    input: SecuredLoan
    preconditions:
      - securedLoanCollateralSupported
    effect: Report collateral support confirmed only when the already identified secured loan has a collateral link; otherwise report unconfirmed without reclassifying the loan or changing its terms.
    verification: "Re-read the secured loan's direct collateral link and compare its presence or absence with the reported result; do not treat a secured label or security agreement as a substitute."
  checkVariableRateSetup:
    input: Loan
    preconditions:
      - variableRateSetupReady
    effect: "Report variable-rate setup confirmed only when the loan has a variable rate and its own rate-reset schedule; otherwise report unconfirmed, without changing terms."
    verification: "Re-read both links on the same loan and confirm the schedule is an interest rate reset schedule, not another schedule kind."
  checkPaymentRecordCompleteness:
    input: Loan
    preconditions:
      - paymentRecordComplete
    effect: "Report payment-record completeness confirmed only when the loan has a payment history with at least one individual actual payment; otherwise report unconfirmed, without changing records."
    verification: "Re-read the loan's payment history and its individual actual payment entries and compare them with the reported result, excluding scheduled payments."
  checkPrepaymentPenaltyTiming:
    input: Loan
    preconditions:
      - prepaymentPenaltyTimingConfirmed
    effect: "Report confirmed only if applicable prepayment terms and their numeric penalty period in months can be established; on the current canvas report unconfirmed with the missing applicability link as the reason, without changing terms."
    verification: "Check evidence connecting the terms to the input loan and re-read the period on those same terms; if applicability is unestablished, verify that the result remains unconfirmed and does not borrow a period from unrelated terms."
