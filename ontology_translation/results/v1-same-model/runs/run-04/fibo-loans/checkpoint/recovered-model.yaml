competency_questions: []
classes:
  Loan:
    meaning: "A debt arrangement in which a lender extends money or credit to a borrower for repayment under the loan's terms, with the agreed principal amount recorded on the loan."
    aliases: []
    properties:
      agreedPrincipalAmount:
        type: number
      currentLoanBalance:
        type: number
      maturityDate:
        type: date
      initialExchangeDate:
        type: date
      interestRateCap:
        type: number
      firstRateChangeTermMonths:
        type: number
        unit: months
      interestOnly:
        type: boolean
      balloonPayment:
        type: boolean
      negativeAmortization:
        type: boolean
  Borrower:
    meaning: "The party obligated to repay what was borrowed, along with interest and applicable fees, under the agreement."
    aliases: []
    properties: {}
  Lender:
    meaning: The party that extends money or credit and expects repayment.
    aliases: []
    properties: {}
  Servicer:
    meaning: "The party that collects principal and interest payments on the lender's behalf and may differ from the lender."
    aliases: []
    properties: {}
  InterestRateArrangement:
    meaning: null
    aliases: []
    properties: {}
  InterestPaymentTerms:
    meaning: Terms governing payment of interest that identify its accrual basis and relevant accrual and payment timing.
    aliases: []
    properties:
      initialInterestAccrualDate:
        type: date
      initialInterestPaymentDate:
        type: date
      finalInterestPaymentDate:
        type: date
      interestPaymentFrequency:
        type: text
      interestPaymentDay:
        type: text
      compoundingFrequency:
        type: text
  PrincipalRepaymentTerms:
    meaning: "Terms specifying the requirements for repayment of principal, not only its payment dates."
    aliases: []
    properties:
      initialPrincipalPaymentDate:
        type: date
      principalRepaymentDate:
        type: date
      principalPaymentFrequency:
        type: text
      principalPaymentDay:
        type: text
  PrepaymentTerms:
    meaning: The early-repayment kind of principal repayment terms that may record a prepayment-penalty period.
    aliases: []
    properties:
      prepaymentPenaltyPeriodMonths:
        type: number
        unit: months
  FixedInterestRate:
    meaning: "A rate that does not fluctuate over the loan's life."
    aliases: []
    properties:
      rate:
        type: number
  VariableInterestRate:
    meaning: "A rate that may change over the loan's life."
    aliases:
      - adjustable rate
    properties:
      rate:
        type: number
  LoanPaymentSchedule:
    meaning: The regular or explicitly stated payment schedule for a particular loan account.
    aliases: []
    properties: {}
  AmortizationSchedule:
    meaning: A schedule setting out periodic payments and expected changes in the debt balance over time.
    aliases: []
    properties:
      anticipatedNumberOfPayments:
        type: number
  PrincipalPaymentSchedule:
    meaning: A schedule setting out when principal payments are due.
    aliases: []
    properties: {}
  InterestPaymentSchedule:
    meaning: A schedule setting out when interest payments are due.
    aliases: []
    properties: {}
  InterestCalculationSchedule:
    meaning: "A schedule setting out when interest is calculated, which need not be when it is paid."
    aliases: []
    properties: {}
  InterestRateResetSchedule:
    meaning: "A schedule setting out when a rate reset and the corresponding actual rate are due to be recalculated, not evidence that a reset has occurred."
    aliases: []
    properties: {}
  Collateral:
    meaning: An asset pledged to support repayment of a secured loan.
    aliases: []
    properties: {}
  SecurityAgreement:
    meaning: An agreement granting a financial interest in collateral to a party that does not own it and setting out rights and duties concerning that collateral.
    aliases: []
    properties: {}
  DatedCollateralValue:
    meaning: The appraised amount of collateral together with the date as of which it was valued.
    aliases: []
    properties:
      appraisedValue:
        type: number
      asOfDate:
        type: date
  CreditEnhancementAgreement:
    meaning: An agreement governing collateral support between parties to reduce counterparty credit risk.
    aliases:
      - collateralization
      - credit support agreement
      - financial collateral arrangement
      - margin arrangement
    properties: {}
  CreditEnhancementBeneficiary:
    meaning: The party protected under a credit enhancement agreement.
    aliases: []
    properties: {}
  PaymentHistory:
    meaning: "A record of actual payments toward a loan's repayment obligation made to the lender or servicer, not a schedule of payments due."
    aliases: []
    properties: {}
  PaymentTransaction:
    meaning: "One actual payment toward principal, interest, fees or another related amount."
    aliases: []
    properties: {}
  CreditFacility:
    meaning: "A credit agreement allowing a borrower to draw funds over time without applying for a new loan each time, with a credit limit and available amount."
    aliases:
      - master commitment
    properties:
      creditLimit:
        type: number
      availableAmount:
        type: number
  SubFacility:
    meaning: A portion of a credit facility that may be set aside for a particular purpose.
    aliases: []
    properties: {}
  AssessedBorrowingCapacity:
    meaning: "The upper bound on the total amount the lender believes the borrower can repay when due, assessed at a point in time."
    aliases: []
    properties:
      assessedAmount:
        type: number
  Principal:
    meaning: "The amount of debt to be repaid, distinct from interest, whose outstanding amount is separate from the loan's agreed principal amount and recorded balance."
    aliases: []
    properties: {}
  Interest:
    meaning: "The cost of using credit, distinct from principal, whose payment obligation is separate from accrued but unpaid interest."
    aliases: []
    properties: {}
  CreditAgreement:
    meaning: "An agreement recording an obligation to repay value received, typically with interest, for which parties, debt amount and dates may be retrieved."
    aliases: []
    properties:
      debtAmount:
        type: number
      maturityDate:
        type: date
      initialExchangeDate:
        type: date
  DayCountConvention:
    meaning: "The accrual basis identified by interest payment terms that determines how days are counted when calculating accrued interest, not a payment schedule or record of paid interest."
    aliases: []
    properties: {}
  SecuredLoan:
    meaning: "A loan secured by pledged collateral or a third-party guarantee, identified as secured independently of the collateral-support check."
    aliases: []
    properties: {}
  CollateralizedLoan:
    meaning: "A secured loan backed by acceptable collateral provided by the borrower, without creating a second loan record."
    aliases: []
    properties: {}
  LoanToValueRatio:
    meaning: "A percentage comparing this collateralized loan's principal amount with the appraised value of its securing asset."
    aliases:
      - LTV
    properties:
      percentage:
        type: number
        unit: percent
  CombinedLoanToValueRatio:
    meaning: A percentage comparing all debt secured by the asset or assets with their appraised value.
    aliases: []
    properties:
      percentage:
        type: number
        unit: percent
  IndividualPaymentTransaction:
    meaning: "One actual payment toward principal, interest, fees or another related amount."
    aliases: []
    properties: {}
