rules:
  canAcknowledgeAlert:
    conditions:
      - Alert status is new.
      - The responsible resolver group for the alert is reliably established; its source is not yet mapped.
      - The person attempting acknowledgement is verified as authorised for that group; on-call membership alone is insufficient and the authorisation source is not yet mapped.
  canAssignIncident:
    conditions:
      - Incident status is neither closed nor cancelled.
      - An affected IT service or configuration item is identified for the incident.
      - Reliable support information verifies that the proposed resolver group supports at least one identified affected target; the support source remains unmapped and unverified suitability blocks assignment.
  canDeclareMajorIncident:
    conditions:
      - "Incident status is not resolved, closed, or cancelled."
      - Incident severity is sev1-critical or sev2-high.
      - At least one impacted IT service is identified for the incident.
      - An incident commander is directly assigned to the incident.
      - "Follow the bank's approved declaration procedure; its authoritative source is not yet mapped."
  canContainIncident:
    conditions:
      - Incident status is acknowledged or investigating.
      - Containment scope and expected side effects have been recorded before executing the steps; their recorded location is not yet mapped.
      - "Approval for the containment steps is established before execution; its source is not yet mapped, and approval does not authorise separate configuration-item isolation."
      - Mark the incident contained only after containment indicators and remaining service impact are verified and results retained as evidence.
  canIsolateConfigurationItem:
    conditions:
      - The specific configuration item is reliably identified as affected by the incident; a name match alone is insufficient.
      - The impact of isolating that component is assessed.
      - A rollback or reconnection method is available.
      - "Follow the applicable operational authorisation procedure; containment approval alone does not authorise isolation, and the procedure's source is not yet mapped."
  canFailOverITService:
    conditions:
      - A recovery plan is linked to and applies to the affected IT service.
      - The specific target recovery environment is reliably identified and verified available; the availability source remains unmapped and environment type alone is insufficient.
      - The proposed data-recovery point is established as acceptable under applicable recovery requirements; the acceptance source and recovery-objective units remain unmapped.
  canRestoreBackup:
    conditions:
      - Backup set status is successful or verified.
      - The backup set protects the reliably identified target configuration item; a similar component name is insufficient.
      - The proposed restore point is identified and explicitly approved for this restore; backup dates do not establish approval.
      - The specific target environment is identified and explicitly approved for this restore; environment type alone does not establish approval.
      - "If required identity or approval cannot be established from reliable sources, restoration stops; approval sources remain unmapped."
  canExecuteEmergencyChange:
    conditions:
      - The change is reliably identified as following the emergency workflow; the designation source is not yet mapped.
      - "The incident directly linked as justification is active, with status not resolved, closed, or cancelled."
      - "Affected configuration items are identified in the change's modification scope with reliable component identity; a name match is insufficient."
      - Both implementation and backout plans are present on the change.
      - Explicit risk acceptance and approval to implement are verified; risk level does not prove acceptance and its authoritative source is not yet mapped.
  canSendCommunication:
    conditions:
      - "The incident and intended stakeholder recipient are identified, with the audience established."
      - The actual message and its owner are reliably established; their recorded sources remain unmapped and a summary alone is insufficient.
      - "The communication's recorded approval state is verified as appropriate for sending; do not assume an exact status label is sufficient without the applicable procedure."
      - The message agrees with the latest verified incident state.
  canSubmitRegulatoryNotification:
    conditions:
      - "The linked materiality assessment's recorded result is reportable; the agent does not determine legal reportability."
      - The notification identifies its reported incident and intended regulator.
      - Required information and included supporting evidence are verified complete and relevant.
      - Notification status is approved.
      - "Submission occurs before the notification's recorded due time."
      - "If any required fact cannot be verified, do not submit; use the approved reporting procedure, whose source is not yet mapped."
