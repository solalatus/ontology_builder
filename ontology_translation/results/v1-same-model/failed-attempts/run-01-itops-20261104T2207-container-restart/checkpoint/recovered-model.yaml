competency_questions: []
classes:
  BusinessService:
    meaning: A capability the bank provides that is delivered through a customer channel and depends on an IT service.
    aliases:
      - üzleti szolgáltatás
    properties: {}
  CustomerChannel:
    meaning: A way customers access a business service.
    aliases: []
    properties: {}
  ITService:
    meaning: A managed technology capability whose health is tracked and that can be a target of service recovery.
    aliases:
      - informatics service
      - informatikai szolgáltatás
    properties:
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  ConfigurationItem:
    meaning: A managed component that can be affected by an incident or targeted by isolation or change.
    aliases:
      - CI
      - konfigurációs elem
    properties: {}
  Event:
    meaning: An observed occurrence that does not necessarily require a managed response.
    aliases:
      - esemény
    properties:
      observedTime:
        type: date
      eventType:
        type: text
      detectionSource:
        type: text
  Alert:
    meaning: A signal requiring triage or acknowledgement that does not automatically become an incident.
    aliases:
      - riasztás
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
  Incident:
    meaning: "An unplanned interruption, degradation, or security condition requiring managed response."
    aliases:
      - incidens
      - hibajegy
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      majorDeclared:
        type: boolean
      declarationTime:
        type: date
      cybersecurityDesignation:
        type: boolean
      detectedTime:
        type: date
      openedTime:
        type: date
      detectionSource:
        type: text
  ServiceOwner:
    meaning: The role accountable for an IT service across its lifecycle.
    aliases:
      - szolgáltatásgazda
    properties: {}
  ITOperationsTeam:
    meaning: The team that operates an IT service day to day.
    aliases:
      - IT üzemeltetés
      - üzemeltetési csapat
    properties: {}
  ResolverGroup:
    meaning: A team assigned technical diagnosis and restoration for a service or technology area.
    aliases:
      - megoldócsoport
      - support group
    properties: {}
  OnCallEngineer:
    meaning: An available resolver-group member who may be directly assigned technical handling of an incident.
    aliases:
      - ügyeletes mérnök
      - on-call
    properties: {}
  IncidentCommander:
    meaning: "The person accountable for command, coordination, and decision cadence during a major incident."
    aliases:
      - incident manager
      - incidensparancsnok
      - MIM lead
    properties: {}
  IncidentResponseTeam:
    meaning: The cross-functional team coordinating the response to a major incident.
    aliases:
      - IRT
      - incidenskezelő csapat
    properties: {}
  ServiceDesk:
    meaning: The function that records incidents reported for managed response and helps route them.
    aliases:
      - help desk
      - ügyfélszolgálati IT pult
      - hibabejelentő
    properties: {}
  NetworkOperationsCentre:
    meaning: The function that operates the monitoring tool used to trace infrastructure alerts.
    aliases:
      - network operations
      - NOC
      - hálózatüzemeltetési központ
    properties: {}
  SecurityOperationsCentre:
    meaning: The function that monitors security events relevant to cybersecurity-incident investigations.
    aliases:
      - security operations
      - SOC
      - biztonsági műveleti központ
    properties: {}
  ThirdPartyService:
    meaning: An externally provided service on which an IT service depends.
    aliases:
      - outsourced service
      - külső szolgáltatás
    properties: {}
  MonitoringTool:
    meaning: A tool that monitors IT services and configuration items to support tracing observations and alerts.
    aliases:
      - monitoring platform
      - felügyeleti eszköz
    properties: {}
  Runbook:
    meaning: "A maintained procedure for incident diagnosis, response, recovery, or verification."
    aliases:
      - üzemeltetési eljárás
      - playbook
    properties: {}
  Workaround:
    meaning: "A temporary way to reduce or bypass an incident's impact that can be documented in a runbook."
    aliases:
      - kerülőmegoldás
    properties: {}
  RecoveryPlan:
    meaning: A plan for recovering an IT service that can use a backup set.
    aliases:
      - helyreállítási terv
      - DR plan
    properties:
      recoveryTimeObjective:
        type: number
      recoveryPointObjective:
        type: number
      lastReviewDate:
        type: date
  BackupSet:
    meaning: A set of recoverable data that protects configuration items and whose suitability must be checked before restoration.
    aliases:
      - mentéskészlet
      - backup
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      lastSuccessfulBackupDate:
        type: date
      lastVerificationDate:
        type: date
  Change:
    meaning: "A controlled modification, including changes handled through an emergency path."
    aliases:
      - változás
      - módosítás
    properties:
      plannedStartTime:
        type: date
      plannedEndTime:
        type: date
      implementationPlan:
        type: text
      backoutPlan:
        type: text
      riskLevel:
        type: text
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled back
          - closed
          - cancelled
  Release:
    meaning: A package of approved changes delivered by a deployment.
    aliases:
      - kiadás
    properties:
      releaseDate:
        type: date
  Deployment:
    meaning: The technical execution that installs or activates a release.
    aliases:
      - telepítés
      - élesítés
    properties:
      actualStartTime:
        type: date
      actualCompletionTime:
        type: date
  MaterialityAssessment:
    meaning: "A record of an incident's significance and reporting implications with its rationale."
    aliases:
      - reportability assessment
      - lényegességi értékelés
    properties:
      assessmentResult:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      assessedTime:
        type: date
      rationale:
        type: text
      reportingDueTime:
        type: date
  RegulatoryNotification:
    meaning: A formal notification prepared for or submitted to a regulator about an incident; approval does not prove acceptance.
    aliases:
      - supervisory notification
      - felügyeleti bejelentés
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueTime:
        type: date
      submissionTime:
        type: date
  Regulator:
    meaning: The authority to which a regulatory notification is submitted.
    aliases:
      - supervisory authority
      - felügyeleti hatóság
    properties: {}
  Communication:
    meaning: A message prepared for or sent to a stakeholder about an incident; preparation and approval do not prove delivery.
    aliases:
      - értesítés
      - tájékoztatás
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      audienceType:
        type: text
      messageSummary:
        type: text
      sentTime:
        type: date
  EvidenceItem:
    meaning: "A preserved record or artifact supporting an incident, including restoration checks."
    aliases:
      - evidence
      - bizonyíték
    properties:
      collectedTime:
        type: date
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      cryptographicHash:
        type: text
  PostIncidentReview:
    meaning: A structured review of an incident and its lessons that can produce corrective actions.
    aliases:
      - PIR
      - RCA review
      - incidens utóelemzés
    properties:
      heldOn:
        type: date
  CorrectiveAction:
    meaning: Tracked follow-up work produced by a post-incident review.
    aliases:
      - remediation action
      - helyesbítő intézkedés
    properties:
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      description:
        type: text
      dueDate:
        type: date
  Environment:
    meaning: A specific operational destination or setting whose availability and suitability are checked for service failover or backup restoration.
    aliases:
      - környezet
    properties:
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
  Problem:
    meaning: "The underlying cause or potential cause of one or more incidents, recorded to support their investigation."
    aliases:
      - probléma
    properties: {}
  KnownError:
    meaning: A diagnosed problem with a documented cause or workaround that may help identify a candidate mitigation.
    aliases:
      - ismert hiba
    properties:
      diagnosedCause:
        type: text
      workaroundSummary:
        type: text
  Vendor:
    meaning: A provider of a third-party service that may receive an incident escalation.
    aliases:
      - supplier
      - szállító
      - beszállító
    properties: {}
  OrganizationalUnit:
    meaning: An organizational group that owns tracked corrective actions.
    aliases:
      - szervezeti egység
    properties: {}
  Stakeholder:
    meaning: An identifiable recipient of incident communications whose required messages can be checked.
    aliases:
      - érintett
    properties: {}
  Application:
    meaning: A distinct technical application implementing an IT service and potentially running on infrastructure components.
    aliases:
      - alkalmazás
      - app
    properties: {}
  InfrastructureComponent:
    meaning: A distinct technical component on which an IT service or application runs.
    aliases:
      - infrastruktúra-elem
    properties: {}
  MonitoringRule:
    meaning: A separately identifiable rule executed by a monitoring tool that generates an alert.
    aliases:
      - alert rule
      - riasztási szabály
    properties: {}
