rules:
  canVerifyActiveControlAvailable:
    conditions:
      - a zone is occupied
      - a thermostat serves that zone
  canVerifyConditioningForOccupiedZone:
    conditions:
      - zone or space is occupied
      - a thermostat or terminal unit serves that zone or space
  shouldIncreaseCooling:
    conditions:
      - air temperature sensor value is above cooling temperature setpoint value
  shouldIncreaseHeating:
    conditions:
      - air temperature sensor value is below heating temperature setpoint value
  shouldHoldWithinDeadband:
    conditions:
      - air temperature sensor value is within the configured deadband around the active setpoint
  canEnableEconomizer:
    conditions:
      - the economizer uses the proper sensing
      - economizer required sensed conditions are satisfied
      - economizer operation is intended to reduce mechanical heating and cooling requirement
actions:
  increaseCooling:
    input: Air Handling Unit
    preconditions:
      - shouldIncreaseCooling
    effect: Increase cooling for the air handling unit by commanding the cooling path to reduce air temperature toward the cooling setpoint.
    verification: Confirm measured air temperature trends downward and moves toward the applicable cooling temperature setpoint.
  increaseHeating:
    input: Air Handling Unit
    preconditions:
      - shouldIncreaseHeating
    effect: Increase heating for the air handling unit by commanding the heating path to raise air temperature toward the heating setpoint.
    verification: Confirm measured air temperature trends upward and moves toward the applicable heating temperature setpoint.
  verifyActiveControlAvailable:
    input: Zone
    preconditions:
      - canVerifyActiveControlAvailable
    effect: The occupied zone is checked to ensure active control is available.
    verification: Confirm a thermostat that serves the zone has normal status.
  verifyConditioningAvailableForOccupiedZone:
    input: Zone
    preconditions:
      - canVerifyConditioningForOccupiedZone
    effect: The occupied zone is checked to ensure active control is available for occupied conditions.
    verification: Confirm a serving thermostat or terminal unit is assigned and operating.
  enableEconomizer:
    input: Air Handling Unit
    preconditions:
      - canEnableEconomizer
    effect: The air handling unit operates in economizer mode so the economizer status shows enabled or active operation and mechanical cooling demand is reduced.
    verification: Confirm the economizer status shows enabled or active operation.
  holdWithinDeadband:
    input: Air Handling Unit
    preconditions:
      - shouldHoldWithinDeadband
    effect: No heating or cooling change is required while temperature remains within the configured deadband.
    verification: Confirm measured temperature remains within the configured deadband around the active setpoint.
