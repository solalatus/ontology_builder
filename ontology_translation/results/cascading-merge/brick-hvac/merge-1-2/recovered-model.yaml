classes:
  Zone:
    meaning: "An area, or group of spaces, controlled together to maintain the same comfort conditions as a control area made up of one space or a group of spaces handled together."
    aliases: []
    properties:
      occupancyState:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  Thermostat:
    meaning: The control device that reads or monitors temperature and maintains the desired setpoint or target condition for a served zone.
    aliases:
      - thermostat
    properties:
      status:
        type: text
        allowed:
          - normal
          - fault
          - offline
  Space:
    meaning: "A physical room or defined area within the building, such as an individual room, office, or open section of floor."
    aliases:
      - space
    properties: {}
  Floor:
    meaning: One level of the building that groups the spaces on that level or a set of spaces.
    aliases:
      - floor
    properties: {}
  Building:
    meaning: "The overall facility that contains the floors, spaces, zones, and HVAC equipment or systems we manage."
    aliases:
      - building
    properties: {}
  Damper:
    meaning: The component or device that regulates or shuts off airflow in the air path.
    aliases:
      - damper
    properties:
      position:
        type: number
        unit: percent
  Fan:
    meaning: The component or part that moves air through the HVAC system.
    aliases:
      - fan
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Filter:
    meaning: "The component or part that removes particulate, unwanted material, or other material from the airstream."
    aliases:
      - filter
    properties:
      status:
        type: text
        allowed:
          - clean
          - dirty
          - replacement due
  Chiller:
    meaning: Plant equipment that produces or provides chilled water for cooling.
    aliases:
      - chiller
    properties: {}
  Boiler:
    meaning: Plant equipment that produces or provides hot water for heating.
    aliases:
      - boiler
    properties: {}
  HVAC Equipment:
    meaning: "Any HVAC device or piece of equipment the building team monitors, locates, or works on."
    aliases: []
    properties: {}
  Temperature Sensor:
    meaning: A sensor that measures temperature.
    aliases: []
    properties: {}
  Temperature Setpoint:
    meaning: A target temperature value used by the control system.
    aliases: []
    properties: {}
  Economizer:
    meaning: The control device or sequence that uses suitable outdoor conditions to reduce mechanical cooling or heating demand.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - disabled
          - enabled
          - active
  Cooling Temperature Setpoint:
    meaning: The temperature threshold that tells the system when cooling should be applied.
    aliases: []
    properties:
      value:
        type: number
        unit: degrees C
  Heating Temperature Setpoint:
    meaning: The temperature threshold that tells the system when heating should be applied.
    aliases: []
    properties:
      value:
        type: number
        unit: degrees C
  Temperature Deadband Setpoint:
    meaning: The allowed temperature range where no heating or cooling change is needed.
    aliases: []
    properties:
      value:
        type: number
        unit: degrees C
  Air Handling Unit:
    meaning: The main air-side assembly that moves and conditions air for distribution through part of the building.
    aliases:
      - air handler
      - AHU
      - air handling unit
    properties:
      economizerStatus:
        type: text
        allowed:
          - disabled
          - enabled
          - active
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Terminal Unit:
    meaning: A downstream device that regulates airflow or air temperature and controls airflow or delivered air conditions for the area it serves.
    aliases:
      - terminal unit
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Plenum:
    meaning: "A section of the air-distribution path or air space/chamber that receives air for supply, return, exhaust, distribution, or return."
    aliases:
      - air plenum
      - plenum
    properties: {}
  Air Temperature Sensor:
    meaning: A sensor that measures air temperature for monitoring or control.
    aliases:
      - air temperature sensor
    properties:
      value:
        type: number
        unit: degrees C
  Air Temperature Setpoint:
    meaning: The target air temperature the control system uses for air temperature control or monitoring in AHU context.
    aliases:
      - temperature setpoint
      - control setpoint
      - air temperature setpoint
    properties:
      setpointKind:
        type: text
        allowed:
          - air
          - cooling
          - heating
          - deadband
      value:
        type: number
  CO2 Sensor:
    meaning: A sensor that measures carbon-dioxide level in air.
    aliases:
      - CO2 sensor
    properties: {}
  Occupancy Sensor:
    meaning: A sensor that indicates whether a space or area is occupied.
    aliases:
      - occupancy sensor
    properties:
      occupiedState:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
      occupancyState:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  Cooling Valve:
    meaning: A valve that controls cooling by adjusting cold-water flow through a coil or chilled-water flow through a cooling coil.
    aliases:
      - cooling valve
    properties:
      position:
        type: number
        unit: percent
  Heating Valve:
    meaning: A valve that controls heating by adjusting hot-water flow through a coil.
    aliases:
      - heating valve
    properties:
      position:
        type: number
        unit: percent
  Packaged Heat Pump:
    meaning: A self-contained unit that can provide both heating and cooling to the area it serves.
    aliases:
      - packaged heat pump
      - heat pump
    properties: {}
  Outside-Air CO2 Sensor:
    meaning: A sensor that measures CO2 level in outside or outdoor air.
    aliases:
      - outside-air CO2 sensor
    properties:
      value:
        type: number
        unit: ppm
  Return-Air CO2 Sensor:
    meaning: A sensor that measures CO2 level in return air coming back through the system.
    aliases:
      - return-air CO2 sensor
    properties:
      value:
        type: number
        unit: ppm
