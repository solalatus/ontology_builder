rules:
  canVerifyConditioningForOccupiedZone:
    conditions:
      - zone or space is occupied
      - a thermostat or terminal unit serves that zone or space
  shouldIncreaseCooling:
    conditions:
      - air temperature sensor value is above cooling temperature setpoint value
  shouldIncreaseHeating:
    conditions:
      - air temperature sensor value is below heating temperature setpoint value
  shouldHoldWithinDeadband:
    conditions:
      - air temperature sensor value is within the configured deadband around the active setpoint
  canUseEconomizer:
    conditions:
      - the air handling unit has an economizer
      - the air handling unit has the outside-air CO2 sensor needed for the comparison
      - the air handling unit has the return-air CO2 sensor needed for the comparison
      - economizer status is enabled or active
  hasActiveZoneControl:
    conditions:
      - the zone occupancy status is occupied
      - "either a thermostat serves the zone and the thermostat status is normal, or the zone has a space served by a terminal unit and the terminal unit status is on"
actions:
  verifyActiveControlAvailable:
    input: Zone
    preconditions: []
    effect: The occupied zone is checked to ensure active control is available.
    verification: Confirm a thermostat that serves the zone has normal status.
  enableEconomizer:
    input: AirHandlingUnit
    preconditions:
      - canUseEconomizer
    effect: The air handling unit operates in economizer mode by setting economizer status so economizer operation is enabled or active and mechanical cooling demand is reduced.
    verification: Confirm the air handling unit has an economizer and the economizer status is enabled or active.
  holdWithinDeadband:
    input: null
    preconditions:
      - shouldHoldWithinDeadband
    effect: No heating or cooling change is required while temperature remains within the configured deadband.
    verification: Confirm measured temperature remains within the configured deadband around the active setpoint.
  identifyUpstreamAirHandlerForTerminalUnit:
    input: TerminalUnit
    preconditions: []
    effect: Identify the upstream air handling unit fed to the terminal unit.
    verification: Confirm the terminal unit is fed by an air handling unit.
  identifyUpstreamAirHandlerForPlenum:
    input: AirPlenum
    preconditions: []
    effect: Identify the upstream air handling unit fed to the plenum.
    verification: Confirm the plenum is fed by an air handling unit.
  recommendAirHandlerTemperatureChecks:
    input: AirHandlingUnit
    preconditions: []
    effect: "Recommend checking the air handler's associated temperature sensors and temperature setpoints."
    verification: Confirm the air handling unit has associated temperature sensors and temperature setpoints in the model.
  identifyRelevantHVACEquipmentByLocation:
    input: Building
    preconditions: []
    effect: "Identify HVAC equipment relevant to the specified building, floor, or space context."
    verification: "Confirm the returned equipment is connected to the requested building, floor, or space by the recorded location relationships."
  verifyThermostatControlContext:
    input: Zone
    preconditions: []
    effect: "Determine whether the zone is served by a thermostat in normal, fault, or offline status."
    verification: Confirm the zone is served by a thermostat and read the thermostat status.
  increaseCoolingForAirHandlingUnit:
    input: AirHandlingUnit
    preconditions:
      - shouldIncreaseCooling
    effect: Increase cooling response for the air handling unit using its cooling path and associated setpoints.
    verification: Confirm the air handling unit has a cooling valve and cooling-related temperature setpoints available for control.
  increaseHeatingForAirHandlingUnit:
    input: AirHandlingUnit
    preconditions:
      - shouldIncreaseHeating
    effect: Increase heating response for the air handling unit using its heating path and associated setpoints.
    verification: Confirm the air handling unit has a heating valve and heating-related temperature setpoints available for control.
  verifyOccupiedZoneConditioningCoverage:
    input: Zone
    preconditions: []
    effect: Determine whether the occupied zone has active control coverage through a serving thermostat or a terminal unit serving a space within the zone.
    verification: Confirm the zone occupancy status is occupied and that either a serving thermostat is normal or a terminal unit serving a space in the zone is on.
