classes:
  Zone:
    meaning: "An area, or group of spaces, controlled together to maintain the same comfort conditions as a control area made up of one space or several spaces handled together under one temperature-control setup."
    aliases: []
    properties:
      occupancyStatus:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  Thermostat:
    meaning: The control device that reads or monitors temperature and maintains the desired setpoint or target condition for a served zone.
    aliases:
      - thermostat
    properties:
      status:
        type: text
        allowed:
          - normal
          - fault
          - offline
  Space:
    meaning: "A physical room or defined area within the building that people occupy, such as an individual room, office, or open section of floor."
    aliases:
      - space
    properties: {}
  Floor:
    meaning: One level of the building that groups the spaces on that level or a set of spaces.
    aliases:
      - floor
    properties: {}
  Building:
    meaning: "The overall facility that contains the floors, spaces, zones, and HVAC equipment or systems we manage or operate."
    aliases:
      - building
    properties: {}
  Damper:
    meaning: "The component, blade, device, or assembly that regulates or shuts off airflow in the air path."
    aliases:
      - damper
    properties: {}
  Fan:
    meaning: The air-moving component or part that pushes or pulls air through the HVAC system.
    aliases:
      - fan
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Filter:
    meaning: "The component or part that removes particulates, unwanted material, or other material from the airstream."
    aliases:
      - filter
    properties:
      status:
        type: text
        allowed:
          - clean
          - dirty
          - replacement due
  Chiller:
    meaning: Plant equipment or device that produces or provides chilled water for cooling service.
    aliases:
      - chiller
    properties:
      status:
        type: text
        allowed:
          - "on"
          - "off"
          - alarm
  Boiler:
    meaning: Plant equipment or device that produces or provides hot water for heating service.
    aliases:
      - boiler
    properties:
      status:
        type: text
        allowed:
          - "on"
          - "off"
          - alarm
  HVAC Equipment:
    meaning: "Any HVAC device or piece of equipment the building team monitors, locates, or works on."
    aliases: []
    properties: {}
  Economizer:
    meaning: "The air-side control device, feature, sequence, or assembly that uses suitable outdoor conditions to reduce mechanical cooling or heating demand."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - disabled
          - enabled
          - active
  Air Temperature Sensor:
    meaning: A sensor that measures air temperature for monitoring or control.
    aliases:
      - air temperature sensor
    properties:
      value:
        type: number
        unit: degrees C
  CO2 Sensor:
    meaning: A sensor that measures carbon-dioxide level in air.
    aliases:
      - CO2 sensor
    properties: {}
  Occupancy Sensor:
    meaning: A sensor that indicates whether a space or area is occupied.
    aliases:
      - occupancy sensor
    properties:
      occupiedState:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
      occupancyState:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  AirHandlingUnit:
    meaning: The main air-side unit that moves and conditions air for part of the building.
    aliases:
      - AHU
      - air handler
    properties: {}
  TerminalUnit:
    meaning: A downstream device that regulates air delivery or conditioning for the area it serves.
    aliases:
      - terminal unit
    properties: {}
  AirPlenum:
    meaning: "A section of the air-distribution path that receives air for supply, return, or exhaust movement."
    aliases:
      - air plenum
      - plenum
    properties:
      airflowState:
        type: text
        allowed:
          - supply
          - return
          - exhaust
  OutsideAirCO2Sensor:
    meaning: A sensor that measures CO2 level in outside or outdoor air being referenced by the air-handling process.
    aliases:
      - outside-air CO2 sensor
    properties: {}
  ReturnAirCO2Sensor:
    meaning: A sensor that measures CO2 level in return air coming back through the air-handling process.
    aliases:
      - return-air CO2 sensor
    properties: {}
  TemperatureSensor:
    meaning: A sensor that measures temperature for monitoring or control.
    aliases: []
    properties: {}
  TemperatureSetpoint:
    meaning: A target temperature value used by the control system.
    aliases: []
    properties: {}
  CoolingValve:
    meaning: A valve that controls cooling by adjusting cold-water or chilled-water flow through a cooling coil.
    aliases:
      - cooling valve
    properties: {}
  HeatingValve:
    meaning: A valve that controls heating by adjusting hot-water flow through a coil.
    aliases:
      - heating valve
    properties: {}
  PackagedHeatPump:
    meaning: A self-contained unit that can provide both heating and cooling to the area it serves.
    aliases:
      - packaged heat pump
      - heat pump
    properties: {}
  AirTemperatureSetpoint:
    meaning: The target air temperature the control system uses for air temperature control or monitoring in AHU context.
    aliases:
      - temperature setpoint
      - control setpoint
      - air temperature setpoint
    properties: {}
  CoolingTemperatureSetpoint:
    meaning: null
    aliases:
      - cooling temperature setpoint
    properties: {}
  HeatingTemperatureSetpoint:
    meaning: null
    aliases:
      - heating temperature setpoint
    properties: {}
  TemperatureDeadbandSetpoint:
    meaning: null
    aliases:
      - temperature deadband setpoint
    properties: {}
