    aliases: []
  - name: hasPrepaymentTerms
    from: Loan
    to: PrepaymentTerms
    meaning: Identifies the prepayment terms that apply to the loan.
    aliases: []
  - name: hasBorrower
    from: CreditFacility
    to: Borrower
    meaning: Identifies the party entitled to draw under the facility and obligated under its terms.
    aliases: []
  - name: hasLender
    from: CreditFacility
    to: Lender
