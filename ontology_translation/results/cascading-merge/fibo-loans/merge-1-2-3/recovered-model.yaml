classes:
  Loan:
    meaning: A loan is money or credit extended by one party to another that must be repaid under agreed terms.
    aliases: []
    properties:
      principalAmount:
        type: number
      maturityDate:
        type: date
      interestRateCap:
        type: text
      interestOnly:
        type: boolean
      negativeAmortization:
        type: boolean
      balloonPayment:
        type: boolean
      firstRateChangeTerm:
        type: text
      prepaymentPenaltyTermMonths:
        type: number
        unit: months
  Borrower:
    meaning: "A borrower is the party that takes the loan or credit, is obligated to repay the amount advanced, and is responsible for interest and any other applicable charges."
    aliases: []
    properties: {}
  Lender:
    meaning: A lender is the party that provides the money or credit and expects repayment.
    aliases: []
    properties: {}
  Servicer:
    meaning: A servicer is the party responsible for collecting principal and interest payments and handling servicing activity on behalf of the lender.
    aliases: []
    properties: {}
  Collateral:
    meaning: Collateral is an asset or other pledged value used to secure repayment of an obligation.
    aliases: []
    properties: {}
  PaymentHistory:
    meaning: A payment history is the record of actual payments made on or against a loan over time.
    aliases: []
    properties: {}
  LoanPaymentSchedule:
    meaning: A loan payment schedule is the schedule of payments associated with a specific loan account.
    aliases: []
    properties: {}
  AmortizationSchedule:
    meaning: An amortization schedule is the schedule showing how the loan balance is expected to change or reduce over time through periodic payments.
    aliases: []
    properties: {}
  PrincipalPaymentSchedule:
    meaning: A principal payment schedule is the schedule showing when some or all principal is due to be repaid.
    aliases: []
    properties: {}
  InterestPaymentSchedule:
    meaning: An interest payment schedule is the schedule showing when interest is due to be paid.
    aliases: []
    properties: {}
  RateResetSchedule:
    meaning: null
    aliases: []
    properties: {}
  InterestCalculationSchedule:
    meaning: An interest calculation schedule shows when interest is calculated for the loan.
    aliases: []
    properties: {}
  InterestTerms:
    meaning: null
    aliases: []
    properties: {}
  SecurityAgreement:
    meaning: "A security agreement is the agreement that creates a lender's or secured party's security interest in collateral and sets the rights and duties around that collateral."
    aliases: []
    properties: {}
  PrincipalRepaymentTerms:
    meaning: Principal repayment terms are the terms that govern how and when principal has to be repaid.
    aliases: []
    properties:
      initialPrincipalPaymentDate:
        type: date
      principalRepaymentDate:
        type: date
      principalPaymentDay:
        type: number
      principalPaymentFrequency:
        type: text
  InterestPaymentTerms:
    meaning: "Interest payment terms are the terms that govern how and when interest is due, calculated, and paid."
    aliases: []
    properties:
      initialInterestAccrualDate:
        type: date
      initialInterestPaymentDate:
        type: date
      finalInterestPaymentDate:
        type: date
      interestPaymentFrequency:
        type: text
      interestPaymentDay:
        type: number
      compoundingFrequency:
        type: text
  PrepaymentTerms:
    meaning: "Prepayment terms are the terms that apply when the borrower pays the loan down before maturity, including any penalty term that may apply."
    aliases: []
    properties: {}
  DebtTerms:
    meaning: null
    aliases: []
    properties: {}
  CreditFacility:
    meaning: A credit facility is a credit agreement or arrangement that lets the borrower draw funds up to an agreed limit over time instead of taking all funds in one advance.
    aliases:
      - master commitment
    properties:
      creditLimit:
        type: number
      availableAmount:
        type: number
      facilityType:
        type: text
        allowed:
          - revolving line of credit
          - committed credit facility
          - uncommitted credit facility
  SubFacility:
    meaning: A sub-facility is a defined portion of a larger credit facility made available for a particular purpose or availability structure under the broader facility.
    aliases: []
    properties: {}
  SecuredLoan:
    meaning: A secured loan is a loan backed by collateral or other credit support tied to repayment.
    aliases: []
    properties: {}
  Interest:
    meaning: "Interest is the cost charged for using borrowed money, payable separately from principal."
    aliases: []
    properties: {}
  Principal:
    meaning: Principal is the amount borrowed that must be repaid apart from interest.
    aliases: []
    properties:
      outstandingAmount:
        type: number
  DayCountConvention:
    meaning: A day count convention is the rule used to calculate how interest accrues over time.
    aliases: []
    properties: {}
  InterestRateResetSchedule:
    meaning: An interest rate reset schedule is the schedule showing when a variable rate is recalculated or reset.
    aliases: []
    properties: {}
  FixedInterestRate:
    meaning: A fixed interest rate is a rate that stays the same over the life of the loan unless the agreement says otherwise.
    aliases: []
    properties:
      rateValue:
        type: number
        unit: percent
  VariableInterestRate:
    meaning: A variable interest rate is an interest rate that can change over the life of the loan based on the loan terms.
    aliases: []
    properties:
      rateValue:
        type: number
        unit: percent
  CollateralizedLoan:
    meaning: A collateralized loan is a secured loan backed specifically by pledged collateral provided under the collateral arrangement and whose value may be tracked against the debt.
    aliases: []
    properties: {}
  CreditAgreement:
    meaning: "An agreement under which a debtor receives value and agrees to repay it, typically with interest, by some future date."
    aliases: []
    properties: {}
  IndividualPaymentTransaction:
    meaning: "An individual payment transaction is one actual payment event made toward the debt, whether for principal, interest, fees, or another related amount."
    aliases:
      - Payment
      - individual payment transaction
    properties: {}
  BorrowingCapacity:
    meaning: The amount a lender has assessed that a borrower can repay as of a given point in time.
    aliases: []
    properties:
      amount:
        type: number
  SupportAgreement:
    meaning: Deprecated placeholder superseded by CreditEnhancementAgreement.
    aliases:
      - replaced by CreditEnhancementAgreement
    properties: {}
  CreditEnhancementAgreement:
    meaning: "The agreement under which collateral, guarantee, or similar support is provided to reduce credit risk."
    aliases:
      - collateralization
      - credit support agreement
      - financial collateral arrangement
      - margin arrangement
    properties: {}
  Beneficiary:
    meaning: The party protected by or entitled to the benefit of the credit enhancement arrangement.
    aliases: []
    properties: {}
  InterestRate:
    meaning: null
    aliases: []
    properties: {}
  CollateralValueAsOfDate:
    meaning: The appraised value recorded for collateral as of a particular date.
    aliases: []
    properties:
      collateralValue:
        type: number
      asOfDate:
        type: date
  LoanToValue:
    meaning: The ratio between the loan amount and the appraised value of the collateral securing it.
    aliases: []
    properties:
      ratio:
        type: number
        unit: percent
  CombinedLoanToValue:
    meaning: The ratio between the total debt secured by the collateral and the appraised value of that collateral.
    aliases: []
    properties:
      ratio:
        type: number
        unit: percent
relationships:
  - name: hasBorrower
    from: Loan
    to: Borrower
    meaning: Identifies the party that owes repayment under the loan or credit arrangement.
    aliases: []
  - name: hasLender
    from: Loan
    to: Lender
    meaning: Identifies the party providing the money or credit.
    aliases: []
  - name: hasPaymentHistory
    from: Loan
    to: PaymentHistory
    meaning: Links a loan to the record of actual payments made on it over time.
    aliases: []
  - name: hasSchedule
