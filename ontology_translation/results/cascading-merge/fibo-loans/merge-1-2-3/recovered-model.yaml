  - name: hasBorrower
    from: CreditAgreement
    to: Borrower
    meaning: null
    aliases: []
  - name: hasLender
    from: CreditAgreement
    to: Lender
    meaning: null
    aliases: []
  - name: hasPrepaymentTerms
