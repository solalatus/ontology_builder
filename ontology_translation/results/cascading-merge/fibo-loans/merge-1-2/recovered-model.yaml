rules:
  reviewPaymentRecordCompletenessReady:
    conditions:
      - loan has payment history
      - payment history has individual payment transaction
  reviewPrepaymentTermsReady:
    conditions:
      - prepayment penalty term months is recorded
  verifySecuredLoanSupportReady:
    conditions:
      - loan has collateral
  reviewVariableRateSetupReady:
    conditions:
      - loan has interest rate
      - loan has schedule of interest rate reset schedule
  assessLoanReadinessReady:
    conditions:
      - loan has borrower
      - loan has lender
      - loan has interest
      - loan has interest rate
      - interest payment terms govern payment of interest
actions:
  reviewPaymentRecordCompleteness:
    input: Loan
    preconditions: []
    effect: Review or confirm whether the loan has payment history recorded and that the history includes individual payment transactions.
    verification: Confirm a payment history exists and contains individual payment entries.
  reviewPrepaymentTerms:
    input: Loan
    preconditions: []
    effect: Review or confirm whether the loan has prepayment terms with the applicable prepayment penalty term recorded.
    verification: Confirm prepayment terms are present and the prepayment penalty term in months is recorded where expected.
  confirmAmortizingLoanTrackingSetup:
    input: Loan
    preconditions: []
    effect: Confirm that an amortizing loan has the repayment structure needed for tracking.
    verification: Confirm an amortization schedule and principal repayment terms are present.
  identifyMissingSetupItems:
    input: Loan
    preconditions: []
    effect: Identify missing setup items that block servicing readiness.
    verification: Confirm the result names the missing items found for the loan.
  produceSetupCompletenessResult:
    input: Loan
    preconditions: []
    effect: Produce a setup or completeness check result with evidence.
    verification: "Confirm the result states what was checked, what passed, what is missing, and what links or fields support it."
  assessLoanReadiness:
    input: Loan
    preconditions:
      - assessLoanReadinessReady
    effect: "Confirm whether the loan has the core setup in place, especially borrower, lender, interest, interest rate, and interest payment terms."
    verification: "Check whether the loan has borrower, lender, interest, interest rate, and interest payment terms that govern payment of interest."
  verifySecuredLoanSupport:
    input: Loan
    preconditions:
      - verifySecuredLoanSupportReady
    effect: Confirm whether the loan has collateral tied to it.
    verification: Check whether the loan has collateral.
  reviewVariableRateSetup:
    input: Loan
    preconditions:
      - reviewVariableRateSetupReady
    effect: Confirm whether the loan has variable-rate setup recorded through an interest rate and an interest rate reset schedule.
    verification: Check whether the loan has interest rate and has schedule of interest rate reset schedule.
