competency_questions:
  - id: cq3
    text: "What are a loan's principal amount, current balance, interest rate, and maturity date?"
  - id: cq4
    text: Is this case a loan or a credit facility?
  - id: cq5
    text: "For a revolving credit facility, what is the credit limit and how much remains available?"
  - id: cq6
    text: "Is a loan's rate fixed or variable?"
  - id: cq7
    text: "For a variable-rate loan, do we have the reset schedule on file?"
  - id: cq8
    text: "For a variable-rate loan, do we have any rate cap on file?"
  - id: cq9
    text: What repayment terms apply to a loan?
  - id: cq10
    text: What payment schedules are tied to a loan?
  - id: cq11
    text: Is a loan interest-only?
  - id: cq12
    text: Is a loan negatively amortizing?
  - id: cq13
    text: Does a loan have a balloon payment feature?
  - id: cq14
    text: Is a loan secured or unsecured?
  - id: cq15
    text: "For a secured loan, what collateral or security support is linked to it?"
  - id: cq16
    text: "What collateral value is on file, as of what date?"
  - id: cq17
    text: What is the loan-to-value or combined loan-to-value?
  - id: cq18
    text: Who is servicing a loan?
  - id: cq19
    text: What payment history do we have for a loan?
  - id: cq20
    text: "Which individual payments make up a loan's payment history?"
  - id: cq21
    text: "If this case is a credit facility, is it revolving?"
  - id: cq22
    text: Who is the borrower on a loan or credit agreement?
  - id: cq23
    text: Who is the lender on a loan or credit agreement?
  - id: cq24
    text: What principal amount applies to a loan or credit agreement?
  - id: cq25
    text: What interest rate applies to a loan or credit agreement?
  - id: cq26
    text: What maturity date applies to a loan or credit agreement?
  - id: cq27
    text: What repayment terms govern principal for a loan or credit agreement?
  - id: cq28
    text: What terms govern interest payments for a loan or credit agreement?
  - id: cq29
    text: "What payment schedules are on file for a loan or credit agreement, including amortization, principal, and interest schedules?"
  - id: cq30
    text: Is a loan or credit agreement secured?
  - id: cq31
    text: What collateral or security support is tied to a loan or credit agreement?
  - id: cq32
    text: Which servicer is responsible for collecting payments on a loan or credit agreement?
  - id: cq33
    text: "If this is a variable-rate loan or credit agreement, what reset setup is on file, including the reset schedule and related rate-change terms?"
classes:
  Loan:
    meaning: A loan is money or credit extended by one party to another that must be repaid under agreed terms.
    aliases: []
    properties:
      principalAmount:
        type: number
      maturityDate:
        type: date
      isInterestOnly:
        type: boolean
      hasNegativeAmortization:
        type: boolean
      hasBalloonPayment:
        type: boolean
      interestRateCap:
        type: number
      firstRateChangeTermMonths:
        type: number
  Borrower:
    meaning: "A borrower is the party that takes the loan or credit, is obligated to repay the amount advanced, and is responsible for interest and any other applicable charges."
    aliases: []
    properties: {}
  Lender:
    meaning: A lender is the party that provides the money or credit and expects repayment.
    aliases: []
    properties: {}
  Servicer:
    meaning: A servicer is the party responsible for collecting principal and interest payments on behalf of the lender.
    aliases: []
    properties: {}
  Collateral:
    meaning: Collateral is an asset or other pledged support used to secure repayment of an obligation.
    aliases: []
    properties: {}
  PaymentHistory:
    meaning: A payment history is the record of payments made on a loan over time.
    aliases: []
    properties: {}
  LoanPaymentSchedule:
    meaning: A loan payment schedule is the schedule of payments associated with a specific loan account.
    aliases: []
    properties: {}
  AmortizationSchedule:
    meaning: An amortization schedule is the schedule showing how the debt balance is expected to reduce over time through payments.
    aliases: []
    properties: {}
  PrincipalPaymentSchedule:
    meaning: A principal payment schedule is the schedule of dates on which some or all principal is due to be repaid.
    aliases: []
    properties: {}
  InterestPaymentSchedule:
    meaning: An interest payment schedule is the schedule of dates on which interest is due to be paid.
    aliases: []
    properties: {}
  RateResetSchedule:
    meaning: null
    aliases: []
    properties: {}
  InterestCalculationSchedule:
    meaning: An interest calculation schedule shows when interest is calculated for the loan.
    aliases: []
    properties: {}
  InterestTerms:
    meaning: null
    aliases: []
    properties: {}
  CollateralValue:
    meaning: Collateral value is the appraised value recorded for collateral as of a particular date.
    aliases: []
    properties:
      valueAmount:
        type: number
      asOfDate:
        type: date
  SecurityAgreement:
    meaning: A security agreement is the agreement that gives a party a security interest in collateral and sets the rights and duties around that collateral.
    aliases: []
    properties: {}
  PrincipalRepaymentTerms:
    meaning: Principal repayment terms are the contract terms that govern how and when principal must be repaid.
    aliases: []
    properties:
      initialPrincipalPaymentDate:
        type: date
      principalRepaymentDate:
        type: date
      principalPaymentDay:
        type: number
      principalPaymentFrequency:
        type: text
  InterestPaymentTerms:
    meaning: Interest payment terms are the contract terms that govern how and when interest is calculated and paid.
    aliases: []
    properties:
      initialInterestAccrualDate:
        type: date
      initialInterestPaymentDate:
        type: date
      finalInterestPaymentDate:
        type: date
      interestPaymentFrequency:
        type: text
      interestPaymentDay:
        type: number
      compoundingFrequency:
        type: text
  PrepaymentTerms:
    meaning: "Prepayment terms are the principal-repayment terms that apply when the borrower pays the loan down before maturity, including any penalty term that may apply."
    aliases: []
    properties:
      prepaymentPenaltyTermMonths:
        type: number
  DebtTerms:
    meaning: null
    aliases: []
    properties: {}
  CreditFacility:
    meaning: A credit facility is a credit agreement or arrangement that lets the borrower draw funds up to an agreed limit over time instead of taking all funds in one advance.
    aliases:
      - master commitment
    properties:
      creditLimit:
        type: number
      availableAmount:
        type: number
      facilityType:
        type: text
        allowed:
          - revolving line of credit
          - committed credit facility
          - uncommitted credit facility
  SubFacility:
    meaning: A sub-facility is a defined portion of a larger credit facility made available for a particular purpose or availability structure under the broader facility.
    aliases: []
    properties: {}
  SecuredLoan:
    meaning: A secured loan is a loan backed by collateral or other credit support for repayment.
    aliases: []
    properties: {}
  Interest:
    meaning: "Interest is the cost of using borrowed money, payable separately from principal."
    aliases: []
    properties: {}
  Principal:
    meaning: Principal is the amount of the debt that must be repaid apart from interest.
    aliases: []
    properties:
      outstandingAmount:
        type: number
  DayCountConvention:
    meaning: A day count convention is the rule used to calculate how interest accrues over time.
    aliases: []
    properties: {}
  InterestRateResetSchedule:
    meaning: An interest rate reset schedule is the schedule that sets out when a variable rate is recalculated or reset.
    aliases: []
    properties: {}
  FixedInterestRate:
    meaning: A fixed interest rate is a rate that stays the same over the life of the loan unless the agreement says otherwise.
    aliases: []
    properties:
      rate:
        type: number
  VariableInterestRate:
    meaning: A variable interest rate is an interest rate that can change over the life of the loan.
    aliases: []
    properties:
      rate:
        type: number
  LoanToValueRatio:
    meaning: A loan-to-value ratio is the ratio of the loan amount to the appraised value of the collateral securing it.
    aliases: []
    properties:
      ratio:
        type: number
  CombinedLoanToValueRatio:
    meaning: A combined loan-to-value ratio is the ratio of the total debt secured by the collateral to the appraised value of that collateral.
    aliases: []
    properties:
      ratio:
        type: number
  CollateralizedLoan:
    meaning: A collateralized loan is a secured loan backed specifically by pledged collateral whose value is tracked against the debt.
    aliases: []
    properties: {}
  CreditAgreement:
    meaning: "An agreement under which a debtor receives value and agrees to repay it, typically with interest, by some future date."
    aliases: []
    properties: {}
  IndividualPaymentTransaction:
    meaning: "An individual payment transaction is one actual payment made toward the debt, whether for principal, interest, fees, or another related amount."
    aliases:
      - Payment
      - individual payment transaction
    properties: {}
