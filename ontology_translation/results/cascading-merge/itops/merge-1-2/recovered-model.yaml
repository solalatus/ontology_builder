rules:
  canSubmitRegulatoryNotification:
    conditions:
      - materiality assessment result is reportable
      - regulatory notification reports the incident
      - regulatory notification is sent to a regulator
      - required fields and supporting evidence are complete
      - regulatory notification status is approved
      - submission happens before regulatory notification due time
  canCloseIncident:
    conditions:
      - incident status is resolved or monitoring
      - impacted IT services are healthy or there is an accepted residual condition
      - resolution and restoration evidence are recorded
      - required stakeholder communications are complete
      - "if the incident is a major incident or a cybersecurity incident, a post-incident review is scheduled or completed"
  canAssignIncidentToResolverGroup:
    conditions:
      - incident status is not closed
      - incident status is not cancelled
      - the affected IT service or affected configuration item is identified
      - the resolver group supports the affected IT service or the affected configuration item
  canFailOverITService:
    conditions:
      - recovery plan recovers the affected IT service
      - target recovery environment is available
      - data-recovery point is acceptable
  canAcknowledgeAlert:
    conditions:
      - alert status is new
      - the operator is authorized for the responsible resolver group
  canContainIncident:
    conditions:
      - incident status is acknowledged or investigating
      - containment scope is recorded
      - expected side effects are recorded
  canIsolateAffectedConfigurationItem:
    conditions:
      - the configuration item is linked to the incident
      - the isolation impact is assessed
      - a rollback or reconnection method is available
  canRestoreDataFromBackup:
    conditions:
      - backup status is successful or verified
      - the backup set protects the target
      - the restore point and target environment are approved
  canSendStakeholderCommunication:
    conditions:
      - communication audience is recorded
      - communication message summary is recorded
      - communication owner is recorded
      - communication status is approved
      - message content matches the latest verified incident state
  canExecuteEmergencyChange:
    conditions:
      - change emergency classification is emergency
      - change is justified by an incident that is not closed or cancelled
      - the implementation plan is present
      - the backout plan is present
      - the affected configuration items are identified
      - the risk is explicitly accepted
  qualifiesAsMajorIncident:
    conditions:
      - incident status is not resolved
      - incident status is not closed
      - incident status is not cancelled
      - incident severity is sev1-critical or sev2-high
      - incident impacts at least one IT service
      - incident is coordinated by an incident commander
      - "major-incident declaration should also follow the bank's approved criteria for business impact, critical services, customer-facing disruption, and possible regulatory significance"
actions:
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: "Acknowledge an alert so it is visibly owned, alert status becomes acknowledged, and the acknowledgement time is recorded."
    verification: Confirm the alert status is acknowledged and the alert shows an acknowledgement time.
  declareMajorIncident:
    input: Incident
    preconditions:
      - qualifiesAsMajorIncident
    effect: "Incident majorIncidentClassification becomes major, incident majorIncidentDeclaredAt is recorded, major-incident coordination is initiated, and communication for the declaration state is initiated."
    verification: "Confirm the incident is classified as major, an incident commander is present, incident majorIncidentDeclaredAt is recorded, and a communication record supports the declaration state."
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: Contain an incident by executing approved containment steps and updating the incident state to contained once containment is verified.
    verification: Confirm the containment steps were executed and the incident state reflects verified containment.
  isolateConfigurationItem:
    input: Incident
    preconditions:
      - canIsolateAffectedConfigurationItem
    effect: "The linked configuration item is isolated from defined networks, key dependencies, or both when that is the safest containment measure."
    verification: Confirm the configuration item is isolated from the intended network path or dependency.
  failOverService:
    input: Incident
    preconditions:
      - canFailOverITService
    effect: The impacted IT service is moved to the recovery environment when the recovery plan supports it and the target environment is available.
    verification: Confirm service health in the recovery environment and confirm the service is operating from the recovery environment.
  executeEmergencyChange:
    input: Change
    preconditions:
      - canExecuteEmergencyChange
    effect: "Execute an emergency change when urgent remediation requires it, update its status, and record implementation evidence."
    verification: "Run technical checks, verify service health, and confirm the emergency change was executed and recorded."
  sendStakeholderCommunication:
    input: Communication
    preconditions:
      - canSendStakeholderCommunication
    effect: "Communication status becomes submitted, communication sentTime is recorded, and the current verified incident state is sent to the intended audience."
    verification: "Confirm the communication was sent to the intended audience, communication status is submitted, and communication sentTime is recorded."
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: "Regulatory notification status becomes submitted, regulatory notification submittedTime is recorded, and the submission is recorded."
    verification: Confirm the regulatory notification status is submitted and regulatory notification submittedTime is recorded.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: "Incident status becomes closed, incident closedTime is recorded, and the closure conditions are recorded."
    verification: "Confirm the incident status is closed, incident closedTime is recorded, and the closure conditions are recorded."
  assignIncident:
    input: Incident
    preconditions:
      - canAssignIncidentToResolverGroup
    effect: Assign an incident to the right resolver group based on the affected service or configuration item.
    verification: Confirm the incident shows the selected resolver group.
  restoreDataFromBackup:
    input: BackupSet
    preconditions:
      - canRestoreDataFromBackup
    effect: Restore data from a backup set to an approved target when recovery requires it.
    verification: Confirm the restore completed to the approved target.
