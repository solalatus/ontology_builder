competency_questions:
  - id: cq1
    text: "Which business services are impacted by this incident, and through which customer channels are customers seeing it?"
  - id: cq2
    text: Which customer channels are impacted by this incident?
  - id: cq3
    text: "What IT services, configuration items, and third-party dependencies sit on the dependency path for the affected service?"
  - id: cq4
    text: Which external dependencies sit on the dependency path for the affected IT service?
  - id: cq5
    text: "Which alerts and events are actually correlated to this incident, and which ones are just noise?"
  - id: cq6
    text: Which active events are correlated with this incident?
  - id: cq7
    text: "Who owns the affected service, and which resolver group or on-call engineer should take this now?"
  - id: cq8
    text: Which resolver group should handle the incident?
  - id: cq9
    text: Which on-call engineer should handle the incident?
  - id: cq10
    text: Does this incident meet the criteria to be treated as a major incident?
  - id: cq11
    text: "What runbook, workaround, backup set, or recovery plan can we safely use for this case?"
  - id: cq12
    text: Which workaround is appropriate and safe to use for this incident?
  - id: cq13
    text: Which backup set is appropriate and safe to use for this incident?
  - id: cq14
    text: Which recovery plan is appropriate and safe to use for this incident?
  - id: cq15
    text: Was this incident likely caused by a recent change or deployment?
  - id: cq16
    text: Was this incident likely caused by a recent deployment?
  - id: cq17
    text: "Has the materiality assessment been completed, and do we need to prepare or submit a regulatory notification?"
  - id: cq18
    text: Do we need to prepare a regulatory notification for this incident?
  - id: cq19
    text: Do we need to send a regulatory notification for this incident?
  - id: cq20
    text: Are the required evidence items complete for this incident?
  - id: cq21
    text: Are the required stakeholder communications complete for this incident?
  - id: cq22
    text: Are the required closure conditions complete for this incident?
  - id: cq23
    text: Which corrective actions from earlier post-incident reviews are still open for the affected service?
classes:
  Incident:
    meaning: "An incident is an unplanned interruption, degradation, or security-related condition that requires managed response."
    aliases:
      - incident ticket
    properties:
      incidentIdentifier:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      openedAt:
        type: date
      summary:
        type: text
      acceptedResidualCondition:
        type: boolean
      majorIncidentDeclaredAt:
        type: date
      cybersecurityIncidentFlag:
        type: boolean
      acknowledgementTime:
        type: date
      detectionSource:
        type: text
      resolvedTime:
        type: date
      detectedTime:
        type: date
      closedTime:
        type: date
      majorIncidentClassification:
        type: text
        allowed:
          - major
          - non-major
  ITService:
    meaning: An IT service is a managed technology capability that supports one or more business services.
    aliases:
      - informatics service
    properties:
      serviceName:
        type: text
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      serviceIdentifier:
        type: text
      criticalityTier:
        type: text
  BusinessService:
    meaning: A business service is a customer-facing or business-facing capability delivered by the bank.
    aliases: []
    properties:
      serviceIdentifier:
        type: text
      serviceName:
        type: text
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  CustomerChannel:
    meaning: A customer channel is a channel through which customers access banking services.
    aliases: []
    properties: {}
  ConfigurationItem:
    meaning: "A managed component within configuration-management scope that matters for operation, support, or recovery."
    aliases:
      - CI
    properties:
      name:
        type: text
      configurationItemType:
        type: text
      configurationItemIdentifier:
        type: text
  Alert:
    meaning: An alert is a monitoring or security signal that requires triage or acknowledgement.
    aliases:
      - alarm
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      raisedAt:
        type: date
      summary:
        type: text
      acknowledgedAt:
        type: date
      alertIdentifier:
        type: text
  Event:
    meaning: An event is a time-stamped observation of a state change or other notable occurrence.
    aliases: []
    properties: {}
  ThirdPartyService:
    meaning: A third-party service is an externally provided service that the bank depends on.
    aliases: []
    properties:
      criticalityTier:
        type: text
  CloudService:
    meaning: A technology capability consumed from an external or group cloud provider.
    aliases: []
    properties: {}
  Vendor:
    meaning: A vendor is an external organization that supplies or supports technology or services.
    aliases:
      - supplier
      - third-party supplier
    properties:
      legalName:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      criticalProvider:
        type: boolean
  ServiceOwner:
    meaning: A service owner is the role accountable for an IT service across its lifecycle.
    aliases: []
    properties: {}
  ResolverGroup:
    meaning: A resolver group is the team assigned to diagnose and restore issues in a specific technology or service area.
    aliases:
      - support group
    properties:
      name:
        type: text
  OnCallEngineer:
    meaning: An on-call engineer is a technical specialist available for time-critical operational response.
    aliases: []
    properties:
      name:
        type: text
  IncidentCommander:
    meaning: "An incident commander is the person accountable for command, coordination, and decision cadence during a major incident."
    aliases: []
    properties: {}
  Runbook:
    meaning: "A runbook is a maintained operational procedure used for diagnosis, response, recovery, or verification."
    aliases:
      - playbook
    properties:
      name:
        type: text
      runbookIdentifier:
        type: text
  Workaround:
    meaning: A workaround is a temporary method that reduces or bypasses the impact of an incident or problem.
    aliases: []
    properties:
      workaroundIdentifier:
        type: text
      summary:
        type: text
  BackupSet:
    meaning: A backup set is a defined collection of recoverable backup data for protected components.
    aliases:
      - backup
    properties:
      lastSuccessfulBackup:
        type: date
      backupIdentifier:
        type: text
      backupStatus:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
  RecoveryPlan:
    meaning: A recovery plan is a documented plan for restoring an IT service and its dependencies.
    aliases:
      - DR plan
    properties:
      recoveryTimeObjective:
        type: text
      recoveryPointObjective:
        type: text
      lastReviewDate:
        type: date
      planIdentifier:
        type: text
  Environment:
    meaning: "An environment is a deployment context such as production, test, development, or disaster recovery."
    aliases: []
    properties:
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
  Change:
    meaning: "A change is a controlled addition, modification, or removal that may affect an IT service."
    aliases:
      - modification
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      changeIdentifier:
        type: text
      emergencyClassification:
        type: text
        allowed:
          - emergency
          - standard
      plannedStart:
        type: date
      plannedEnd:
        type: date
  Deployment:
    meaning: A deployment is the technical execution that installs or activates a release or change.
    aliases:
      - go-live
    properties:
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
      deploymentIdentifier:
        type: text
      startedTime:
        type: date
      completedTime:
        type: date
  MaterialityAssessment:
    meaning: A materiality assessment is a documented determination of incident significance and reporting implications.
    aliases:
      - reportability assessment
    properties:
      assessmentResult:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      assessedTime:
        type: date
  RegulatoryNotification:
    meaning: A regulatory notification is a formal incident-related submission to a competent authority.
    aliases:
      - supervisory notification
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueTime:
        type: date
      notificationIdentifier:
        type: text
      submittedTime:
        type: date
  EvidenceItem:
    meaning: "An evidence item is a preserved record, artifact, or observation that supports incident analysis and accountability."
    aliases:
      - evidence
    properties:
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      evidenceIdentifier:
        type: text
      collectedTime:
        type: date
  Communication:
    meaning: "A communication is a controlled message sent to operational, business, customer, vendor, or regulatory audiences."
    aliases:
      - notification
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      messageSummary:
        type: text
      audience:
        type: text
        allowed:
          - technical
          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
      sentTime:
        type: date
  CorrectiveAction:
    meaning: "A tracked action intended to remove a cause, reduce risk, or improve response capability."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueDate:
        type: date
  CybersecurityIncident:
    meaning: "An incident caused by or involving malicious, unauthorized, or otherwise security-relevant activity."
    aliases: []
    properties: {}
  Application:
    meaning: An application is a software system that implements business or operational functionality.
    aliases: []
    properties:
      name:
        type: text
  SecurityEvent:
    meaning: "An event relevant to confidentiality, integrity, availability, authenticity, or cyber-threat activity."
    aliases: []
    properties: {}
  Problem:
    meaning: "A problem is the underlying cause, or potential underlying cause, of one or more incidents."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - investigating
          - root-cause-known
          - known-error
          - resolved
          - closed
      problemIdentifier:
        type: text
      summary:
        type: text
  KnownError:
    meaning: A known error is a diagnosed problem with a documented cause or workaround.
    aliases: []
    properties:
      diagnosedCause:
        type: text
      workaroundSummary:
        type: text
      knownErrorIdentifier:
        type: text
  PostIncidentReview:
    meaning: "A structured review of causes, response effectiveness, lessons learned, and follow-up work after an incident."
    aliases: []
    properties:
      heldOn:
        type: date
  Release:
    meaning: A release is a governed package of approved changes introduced together.
    aliases: []
    properties:
      version:
        type: text
  Regulator:
    meaning: A regulator is a competent authority that supervises the bank or receives required notifications.
    aliases: []
    properties:
      regulatorName:
        type: text
  EmergencyChange:
    meaning: A change processed under an accelerated path to address an urgent operational need.
    aliases: []
    properties: {}
  ApplicationOwner:
    meaning: An application owner is the role accountable for an application and its operational fitness.
    aliases: []
    properties: {}
  TechnicalOwner:
    meaning: A technical owner is the role accountable for the engineering and maintenance of a configuration item.
    aliases: []
    properties: {}
  Stakeholder:
    meaning: "A stakeholder is a person, group, or organization affected by or responsible for an operational outcome."
    aliases: []
    properties:
      name:
        type: text
  Site:
    meaning: "A site is a physical bank, supplier, or hosting location."
    aliases: []
    properties:
      locationName:
        type: text
  DataCentre:
    meaning: A data centre is a facility that hosts managed technology infrastructure.
    aliases: []
    properties: {}
  BusinessOwner:
    meaning: A business owner is the business role accountable for a business service.
    aliases: []
    properties: {}
  Server:
    meaning: A server is a physical compute host that provides processing capacity.
    aliases: []
    properties:
      name:
        type: text
