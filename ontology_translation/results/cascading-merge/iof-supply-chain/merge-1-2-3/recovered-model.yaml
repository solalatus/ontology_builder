competency_questions:
  - id: cq1
    text: Which shipment is currently being prepared from this ship-from location to this ship-to location?
  - id: cq2
    text: Which carrier is responsible for this transport move?
  - id: cq3
    text: "For this shipment, what traceable unit should we be following?"
  - id: cq4
    text: Where does this transport start in the network?
  - id: cq5
    text: Where does this transport end in the network?
  - id: cq6
    text: At which facility is the receiving work happening?
  - id: cq7
    text: At which facility is the storage work happening?
  - id: cq8
    text: At which facility is the shipment preparation work happening?
  - id: cq9
    text: Which freight forwarder is involved in this freight forwarding service or activity?
  - id: cq10
    text: Which material item is tied to this purchase order?
  - id: cq11
    text: Which material item is tied to this shipment?
  - id: cq12
    text: Which supplier is supplying a given customer for this item?
  - id: cq13
    text: "For this shipment being prepared, which carrier is responsible?"
  - id: cq14
    text: Is the right traceable unit identified for this shipment before we move or receive it?
  - id: cq15
    text: Do we know the correct origin and destination points for this transport?
  - id: cq16
    text: Is the receiving activity happening at the correct facility?
  - id: cq17
    text: Is the shipment preparation activity happening at the correct facility?
  - id: cq18
    text: Has the right freight forwarding party been identified where forwarding is being used?
  - id: cq19
    text: Is the purchase order tied to the correct material item?
  - id: cq20
    text: Is the shipment tied to the correct material item?
  - id: cq21
    text: Which supplier supplies this product to this customer?
  - id: cq22
    text: Which carrier is involved on the transport side or in shipment preparation for this shipment or transport?
  - id: cq23
    text: "For this shipment, what traceable unit should we be following, such as a lot, sublot, logistic unit, load, or container?"
  - id: cq24
    text: "Where does this transport start, and where is it supposed to end?"
  - id: cq25
    text: "Which facility is this receiving, storage, or shipment preparation activity happening at?"
  - id: cq26
    text: Which freight forwarder is handling this forwarding service or process?
  - id: cq27
    text: What material trade item is this purchase order for?
  - id: cq28
    text: What material trade item is this shipment for?
  - id: cq29
    text: Which container or freight container is being used for this shipment?
  - id: cq30
    text: Which tracking events should be recorded to preserve traceability for a shipment or a lot?
  - id: cq31
    text: Which supplier supplies to a given customer for this flow?
  - id: cq32
    text: Which shipment is currently being prepared between a given ship-from location and ship-to location?
  - id: cq33
    text: Which carrier is responsible for a given transport move?
  - id: cq34
    text: Which carrier is responsible for getting a given shipment ready to move?
  - id: cq35
    text: "Which lot, sublot, logistic unit, or load is the relevant traceable unit for a given shipment?"
  - id: cq36
    text: Where does a given transport move start and where does it end?
  - id: cq37
    text: Which facility is a given receiving activity happening at?
  - id: cq38
    text: Which storage facility is a given storage activity happening at?
  - id: cq39
    text: Which facility is a given shipment-preparation activity happening at?
  - id: cq40
    text: Which material item is tied to a given purchase order?
  - id: cq41
    text: Which material item is tied to a given shipment?
  - id: cq42
    text: Which tracking events must be preserved to maintain traceability for a given shipment?
  - id: cq43
    text: Which tracking events must be preserved to maintain traceability for a given lot?
classes:
  Shipment:
    meaning: "A shipment is a traceable unit of goods being prepared, moved, or received through the supply chain."
    aliases: []
    properties: {}
  TransportProcess:
    meaning: A transport process is the material location change process that moves goods from one point in the supply chain to another.
    aliases: []
    properties: {}
  Carrier:
    meaning: A carrier is a supplier that carries or transports shipments.
    aliases: []
    properties: {}
  Facility:
    meaning: A physical facility used in supply-chain operations.
    aliases: []
    properties: {}
  MaterialTradeItem:
    meaning: A material item represented as a tradable item in supply-chain operations.
    aliases:
      - material item
    properties: {}
  PurchaseOrder:
    meaning: A purchase order is an agreement that requests or authorizes the supply of goods or services.
    aliases:
      - order
    properties: {}
  Supplier:
    meaning: A supplier is a trading partner that supplies goods or services in the supply chain.
    aliases: []
    properties: {}
  Customer:
    meaning: A customer is a trading partner that receives supplied goods or services in a supply chain.
    aliases: []
    properties: {}
  FreightForwarder:
    meaning: A freight forwarder is an agent that arranges freight forwarding activities and services.
    aliases: []
    properties:
      status:
        type: text
  FreightForwardingService:
    meaning: A freight forwarding service is a service that provides freight forwarding capability.
    aliases: []
    properties: {}
  Lot:
    meaning: A lot is a traceable production or supply lot used for batch-level control.
    aliases: []
    properties: {}
  Sublot:
    meaning: A traceable subdivision of a lot.
    aliases: []
    properties: {}
  Load:
    meaning: A traceable load unit prepared for handling or transport.
    aliases: []
    properties: {}
  SupplyChainNode:
    meaning: "A node in the supply chain used as an origin, destination, or operating point."
    aliases: []
    properties: {}
  ShipmentPreparationProcess:
    meaning: A shipment preparation process is a process that prepares a shipment for dispatch.
    aliases:
      - shipment preparation activity
    properties: {}
  ReceivingProcess:
    meaning: A receiving process is a business process that receives incoming goods or shipments.
    aliases:
      - receiving activity
    properties: {}
  StorageProcess:
    meaning: A storage process is a planned process that stores goods or traceable units.
    aliases: []
    properties: {}
  TransportationService:
    meaning: A transportation service is a service that provides transportation capability for supply-chain movement.
    aliases: []
    properties: {}
  StorageFacility:
    meaning: A storage facility is a facility used to store goods or traceable units.
    aliases: []
    properties: {}
  SupplyRelationship:
    meaning: "A supply relationship is the supply dependency that connects a supplier, a customer, and the product context."
    aliases: []
    properties: {}
  TrackingEvent:
    meaning: "A tracking event is a recorded event that captures movement, handling, or a state change for something traceable."
    aliases: []
    properties:
      eventTime:
        type: date
      eventType:
        type: text
        allowed:
          - packed
          - shipped
          - arrived
          - received
          - stored
  Shipper:
    meaning: A shipper is the consignor that sends or consigns a shipment.
    aliases:
      - consignor
    properties: {}
  InventoryManagementProcess:
    meaning: An inventory management process is a business process that manages inventory.
    aliases: []
    properties: {}
  ConsigningProcess:
    meaning: A consigning process is a business process in which goods are consigned for shipment.
    aliases: []
    properties: {}
  Consignee:
    meaning: The agent designated to receive a shipment.
    aliases: []
    properties: {}
  Location:
    meaning: A geospatially identified location relevant to supply-chain operations.
    aliases:
      - ship-from location
      - ship-to location
    properties: {}
  LogisticUnit:
    meaning: A traceable logistics handling unit used in storage and transport.
    aliases:
      - container
      - freight container
      - traceable resource unit
    properties: {}
