competency_questions:
  - id: cq1
    text: Which air handling unit serves a given terminal unit or plenum?
  - id: cq2
    text: What spaces are on a given floor?
  - id: cq3
    text: Which floor is a given space on?
  - id: cq4
    text: What HVAC equipment is physically located in this building?
  - id: cq5
    text: What HVAC equipment is physically located on a given floor?
  - id: cq6
    text: What HVAC equipment is physically located in a given space?
  - id: cq7
    text: Which temperature sensors belong to a given air handling unit?
  - id: cq8
    text: Which setpoints belong to a given air handling unit?
  - id: cq9
    text: "If discharge air temperature is off target, which setpoint should be checked?"
  - id: cq10
    text: "If air temperature is off target, which setpoint should be checked?"
  - id: cq11
    text: Which outside-air CO2 sensors are tied to a given air-handling unit?
  - id: cq12
    text: Which return-air CO2 sensors are tied to a given air-handling unit?
  - id: cq13
    text: Which occupancy sensor is used for a given space or zone?
  - id: cq14
    text: Which thermostat serves a given zone or space?
  - id: cq15
    text: Which terminal unit serves a given zone or space?
  - id: cq16
    text: What parts does a given air handling unit have?
  - id: cq17
    text: What equipment is upstream of a given terminal unit or plenum?
  - id: cq18
    text: Which heating valves are fed by a given boiler?
  - id: cq19
    text: Which cooling valves are fed by a given chiller?
  - id: cq20
    text: Can economizer operation be used for a given air handling unit under current conditions?
classes:
  AirHandler:
    meaning: The main air-side unit that moves and conditions air for downstream distribution.
    aliases:
      - air handling unit
      - AHU
    properties: {}
  Zone:
    meaning: "A control area that is regulated together, sometimes one room and sometimes a group of spaces on the same control point."
    aliases: []
    properties:
      occupancyStatus:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  TerminalUnit:
    meaning: The local air-side device that serves a space and helps regulate airflow or delivered conditioning to that area.
    aliases: []
    properties: {}
  Plenum:
    meaning: "An air-distribution section that receives air for supply, return, or exhaust movement."
    aliases: []
    properties: {}
  Space:
    meaning: "A physical area like an office, conference room, lobby, or mechanical room where equipment may be located or comfort is managed."
    aliases: []
    properties: {}
  Floor:
    meaning: A building level that groups the spaces on that level.
    aliases:
      - storey
    properties: {}
  Building:
    meaning: "The overall facility that contains the floors, spaces, zones, and HVAC equipment we are responsible for."
    aliases: []
    properties: {}
  TemperatureSensor:
    meaning: A sensor that measures temperature for control or monitoring.
    aliases: []
    properties:
      value:
        type: number
        unit: degrees C
  AirTemperatureSensor:
    meaning: A temperature sensor specifically measuring air temperature in the air side of the system.
    aliases: []
    properties:
      value:
        type: number
        unit: degrees C
  Setpoint:
    meaning: A target value the control system is trying to maintain.
    aliases: []
    properties: {}
  AirTemperatureSetpoint:
    meaning: The target air temperature an air-side control loop is trying to maintain.
    aliases: []
    properties:
      value:
        type: number
  CoolingTemperatureSetpoint:
    meaning: The temperature target that tells the system when cooling should satisfy the load.
    aliases: []
    properties:
      value:
        type: number
  HeatingTemperatureSetpoint:
    meaning: The temperature target that tells the system when heating should satisfy the load.
    aliases: []
    properties:
      value:
        type: number
  TemperatureDeadbandSetpoint:
    meaning: The allowed temperature range between heating and cooling action so the system is not fighting itself.
    aliases: []
    properties:
      value:
        type: number
  OutsideAirCO2Sensor:
    meaning: A sensor that measures CO2 in outside air for ventilation or economizer-related comparison.
    aliases: []
    properties:
      value:
        type: number
        unit: ppm
  ReturnAirCO2Sensor:
    meaning: A sensor that measures CO2 in return air so we can compare building air back to outside conditions.
    aliases: []
    properties:
      value:
        type: number
        unit: ppm
  OccupancySensor:
    meaning: A device that indicates whether a space or zone is occupied for control purposes.
    aliases: []
    properties:
      occupancyStatus:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  Thermostat:
    meaning: The local control device that reads temperature and works to maintain the desired setpoint for a zone.
    aliases: []
    properties: {}
  Boiler:
    meaning: The plant equipment that provides hot water for the heating side of the system.
    aliases: []
    properties: {}
  Chiller:
    meaning: The plant equipment that provides chilled water for the cooling side of the system.
    aliases: []
    properties: {}
  Fan:
    meaning: The component that moves air through the unit and distribution path.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Filter:
    meaning: The component that removes particulate from the air stream.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - clean
          - dirty
          - replacement due
  Damper:
    meaning: "The air-side component that opens, closes, or modulates to control airflow."
    aliases: []
    properties:
      position:
        type: number
        unit: percent
  Economizer:
    meaning: The AHU function or device that uses suitable air-side conditions to reduce mechanical heating or cooling.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - disabled
          - enabled
          - active
  CoolingValve:
    meaning: The valve that controls chilled-water flow through a cooling coil.
    aliases: []
    properties:
      position:
        type: number
        unit: percent
  HeatingValve:
    meaning: The valve that controls hot-water flow through a heating coil.
    aliases: []
    properties:
      position:
        type: number
        unit: percent
