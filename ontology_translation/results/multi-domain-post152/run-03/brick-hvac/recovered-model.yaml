rules:
  canUseEconomizerInsteadOfMechanicalCooling:
    conditions:
      - the air handling unit has an economizer
      - the economizer status is enabled or active
      - the needed sensed conditions for economizer operation are present and suitable
      - the intent is to reduce mechanical cooling demand
  needsCoolingFromSetpoint:
    conditions:
      - the measured air temperature is above the applicable cooling temperature setpoint
  needsHeatingFromSetpoint:
    conditions:
      - the measured air temperature is below the applicable heating temperature setpoint
  temperatureIsWithinDeadband:
    conditions:
      - the measured temperature is within the configured temperature deadband around the active setpoint
  activeControlAvailableForOccupiedZone:
    conditions:
      - the zone is occupied
      - a thermostat serves that zone
      - the thermostat status shows it is operating normally
actions:
  enableEconomizerOnAirHandlingUnit:
    input: AirHandlingUnit
    preconditions:
      - canUseEconomizerInsteadOfMechanicalCooling
    effect: "Set the economizer status to active on the air handling unit's economizer when conditions support using it instead of mechanical cooling."
    verification: Confirm the economizer status is active after the action.
  increaseCoolingOnAirHandlingUnit:
    input: AirHandlingUnit
    preconditions:
      - needsCoolingFromSetpoint
    effect: Increase cooling on the air handling unit when measured air temperature is above the cooling target.
    verification: Confirm the measured air temperature is above the applicable cooling temperature setpoint and that cooling response is being applied.
  increaseHeatingOnAirHandlingUnit:
    input: AirHandlingUnit
    preconditions:
      - needsHeatingFromSetpoint
    effect: Increase heating on the air handling unit when measured air temperature is below the heating target.
    verification: Confirm the measured air temperature is below the applicable heating temperature setpoint and that heating response is being applied.
  maintainCurrentOperation:
    input: AirHandlingUnit
    preconditions:
      - temperatureIsWithinDeadband
    effect: Maintain the current air handling unit operation when the measured temperature remains within the allowed deadband.
    verification: Confirm the measured temperature remains within the configured deadband around the active setpoint.
  verifyActiveControlForOccupiedZone:
    input: Thermostat
    preconditions:
      - activeControlAvailableForOccupiedZone
    effect: Report whether active control is available for the served zone under occupied conditions.
    verification: "Confirm the thermostat serves a zone, the served zone is occupied, and the thermostat status supports normal operation."
