rules:
  securedLoanHasCollateralSupport:
    conditions:
      - loan is marked as secured
      - loan is linked to collateral
  variableRateLoanHasResetSchedule:
    conditions:
      - the loan has an interest rate whose rate type is variable
      - the loan has an interest rate reset schedule
  paymentTrackingIsComplete:
    conditions:
      - the loan has payment history
      - the payment history has at least one individual payment transaction
  prepaymentPenaltyTimingIsRecorded:
    conditions:
      - the loan has principal repayment terms
      - the principal repayment terms include prepayment terms
      - prepayment penalty timing months is recorded in the prepayment terms
  loanReadyForServicingSetup:
    conditions:
      - the loan has a borrower
      - the loan has a lender
      - "if the loan has an interest rate, the loan also has interest payment terms"
      - "if the loan is marked as secured, the loan is linked to collateral"
      - "if the loan's interest rate type is variable, the loan has an interest rate reset schedule"
actions:
  assessLoanReadinessForServicingSetup:
    input: Loan
    preconditions:
      - loanReadyForServicingSetup
    effect: Determine whether the loan meets the core conditions required for servicing setup.
    verification: Confirm whether the loan satisfies the readiness conditions for servicing setup.
  verifySecuredLoanHasCollateral:
    input: Loan
    preconditions:
      - securedLoanHasCollateralSupport
    effect: Determine whether a loan marked as secured is linked to collateral.
    verification: Confirm whether the secured-loan collateral support conditions are satisfied.
  reviewVariableRateSetup:
    input: Loan
    preconditions:
      - variableRateLoanHasResetSchedule
    effect: Determine whether a variable-rate loan has the required reset schedule on file.
    verification: Confirm whether the variable-rate reset-schedule conditions are satisfied.
  reviewPaymentTrackingCompleteness:
    input: Loan
    preconditions:
      - paymentTrackingIsComplete
    effect: "Determine whether the loan's payment tracking is complete."
    verification: Confirm whether payment history exists and includes at least one individual payment transaction.
  reviewPrepaymentPenaltyTiming:
    input: Loan
    preconditions:
      - prepaymentPenaltyTimingIsRecorded
    effect: Determine whether prepayment penalty timing is recorded where prepayment terms apply.
    verification: "Confirm whether prepayment penalty timing is recorded in the loan's prepayment terms."
