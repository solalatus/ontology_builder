    to: Container
    meaning: The shipment uses the container for handling or transport.
    aliases: []
  - name: usesContainer
    from: Shipment
    to: FreightContainer
    meaning: The shipment uses the freight container for freight transport.
    aliases: []
  - name: hasFreightForwardingService
    from: Shipment
    to: FreightForwardingService
    meaning: The shipment has an arranged freight forwarding service.
    aliases: []
  - name: hasTransportationService
    from: Shipment
    to: TransportationService
    meaning: The shipment has an associated transportation service.
    aliases: []
  - name: hasReceivingProcess
    from: Shipment
    to: ReceivingProcess
    meaning: The shipment has an identified receiving process.
    aliases: []
  - name: stores
