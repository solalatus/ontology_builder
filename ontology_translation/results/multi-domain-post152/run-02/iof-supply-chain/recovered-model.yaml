competency_questions:
  - id: cq1
    text: Which supplier is associated with this supplier-customer-product supply relationship?
  - id: cq2
    text: Which customer is associated with this supplier-customer-product supply relationship?
  - id: cq3
    text: Which product/item is associated with this supplier-customer-product supply relationship?
  - id: cq4
    text: Which shipment is being prepared for this ship-from location and this ship-to location?
  - id: cq5
    text: Which carrier handles this transport?
  - id: cq6
    text: Which carrier handles this shipment preparation?
  - id: cq7
    text: Which lot is tied to this shipment?
  - id: cq8
    text: Which logistic unit is tied to this shipment?
  - id: cq9
    text: Which load is tied to this shipment?
  - id: cq10
    text: Where does this transport start?
  - id: cq11
    text: Where is this transport supposed to end?
  - id: cq12
    text: Which facility is this receiving activity happening at?
  - id: cq13
    text: Which storage facility is this storage activity happening at?
  - id: cq14
    text: Which facility is this shipment preparation activity happening at?
  - id: cq15
    text: Which freight forwarder is involved in this forwarding service?
  - id: cq16
    text: What item is this purchase order for?
  - id: cq17
    text: What item is this shipment moving?
  - id: cq18
    text: What container is used for this shipment?
  - id: cq19
    text: What freight container is used for this shipment?
  - id: cq20
    text: What tracking events do we have for this shipment?
  - id: cq21
    text: What tracking events do we have for this lot?
  - id: cq22
    text: Which logistics service applies to what is happening right now?
  - id: cq23
    text: Which transportation service applies to what is happening right now?
  - id: cq24
    text: Which packaging service applies to what is happening right now?
  - id: cq25
    text: Which storage service applies to what is happening right now?
  - id: cq26
    text: What traceable resource unit is relevant for this shipment?
classes:
  SupplyRelationship:
    meaning: "The supply dependency that ties together a supplier, a customer, and the item being supplied."
    aliases: []
    properties: {}
  Supplier:
    meaning: A trading partner that supplies goods or services in the supply chain.
    aliases: []
    properties: {}
  Customer:
    meaning: A trading partner that receives supplied goods or services in the supply chain.
    aliases: []
    properties: {}
  MaterialTradeItem:
    meaning: A material item treated as something tradable in supply-chain operations.
    aliases: []
    properties: {}
  PurchaseOrder:
    meaning: An agreement that requests or authorizes the supply of goods or services.
    aliases:
      - order
    properties: {}
  Shipment:
    meaning: "A traceable unit of goods being prepared, moved, or received through the supply chain."
    aliases: []
    properties: {}
  TransportProcess:
    meaning: A process that moves goods from one place to another.
    aliases: []
    properties: {}
  Facility:
    meaning: A physical facility used in supply-chain operations.
    aliases: []
    properties: {}
  StorageFacility:
    meaning: A facility used to store goods or traceable units.
    aliases: []
    properties: {}
  ShipmentPreparationProcess:
    meaning: A process that gets a shipment ready for dispatch.
    aliases: []
    properties: {}
  ReceivingProcess:
    meaning: A business process that receives incoming goods or shipments.
    aliases: []
    properties: {}
  StorageProcess:
    meaning: A planned process that stores goods or traceable units.
    aliases: []
    properties: {}
  Carrier:
    meaning: A supplier that carries or transports shipments.
    aliases: []
    properties: {}
  FreightForwarder:
    meaning: An agent that arranges freight forwarding activities and services.
    aliases: []
    properties: {}
  FreightForwardingService:
    meaning: A service that provides freight forwarding capability.
    aliases: []
    properties: {}
  Lot:
    meaning: A traceable production or supply lot used for batch-level control.
    aliases: []
    properties: {}
  LogisticUnit:
    meaning: A traceable logistics handling unit used in storage and transport.
    aliases: []
    properties: {}
  Load:
    meaning: A traceable load unit prepared for handling or transport.
    aliases: []
    properties: {}
  TrackingEvent:
    meaning: "An event recorded to track movement, handling, or state changes of traceable units."
    aliases: []
    properties:
      eventTime:
        type: date
      eventType:
        type: text
        allowed:
          - packed
          - shipped
          - arrived
          - received
          - stored
  TraceableResourceUnit:
    meaning: A material unit that can be traced through supply-chain activities.
    aliases: []
    properties: {}
  Container:
    meaning: A material artifact used to hold or transport goods.
    aliases: []
    properties: {}
  FreightContainer:
    meaning: A container specifically used for freight transport.
    aliases: []
    properties: {}
  LogisticsService:
    meaning: A commercial logistics service used in supply-chain operations.
    aliases: []
    properties: {}
  TransportationService:
    meaning: A service that provides transportation capability for supply-chain movement.
    aliases: []
    properties: {}
  PackagingService:
    meaning: A service that provides packaging capability for goods.
    aliases: []
    properties: {}
  StorageService:
    meaning: A service that provides storage capability for goods.
    aliases: []
    properties: {}
  ShipFromLocation:
    meaning: The location from which a shipment is sent.
    aliases: []
    properties: {}
  ShipToLocation:
    meaning: The location to which a shipment is sent.
    aliases: []
    properties: {}
  SupplyChainNode:
    meaning: "A point in the supply chain used as an origin, destination, or operating point."
    aliases: []
    properties: {}
  PackagingProcess:
    meaning: A process that packages goods for handling or shipment.
    aliases: []
    properties: {}
  LogisticsProcess:
    meaning: A process that coordinates logistics activities.
    aliases: []
    properties: {}
relationships:
