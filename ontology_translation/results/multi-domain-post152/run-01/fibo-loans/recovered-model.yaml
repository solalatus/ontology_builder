    aliases: []
  - name: hasBorrower
    from: SecuredLoan
    to: Borrower
    meaning: This identifies the borrower obligated under the secured loan.
    aliases: []
  - name: hasLender
    from: SecuredLoan
    to: Lender
    meaning: This identifies the lender that extended the secured loan.
    aliases: []
  - name: hasLoanToValueRatio
    from: CollateralizedLoan
    to: LoanToValueRatio
