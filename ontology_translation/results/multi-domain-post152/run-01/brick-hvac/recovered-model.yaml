    aliases:
      - includes
  - name: has
    from: Zone
    to: OccupancySensor
    meaning: The zone includes an occupancy sensor used for control-relevant occupancy detection.
    aliases:
      - includes
  - name: has
    from: AirHandlingUnit
    to: Damper
