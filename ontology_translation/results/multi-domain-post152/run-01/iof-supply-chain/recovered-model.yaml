competency_questions:
  - id: cq1
    text: Which supplier supplies a given item for a given customer?
  - id: cq2
    text: Which shipment is being prepared between a given ship-from location and ship-to location?
  - id: cq3
    text: Which carrier is responsible for a given movement?
  - id: cq4
    text: Which carrier is responsible for getting a given shipment ready to go?
  - id: cq5
    text: What traceable unit is tied to a given shipment?
  - id: cq6
    text: Where did a given transport start?
  - id: cq7
    text: Where is a given transport supposed to end?
  - id: cq8
    text: Which facility is a given receiving activity happening at?
  - id: cq9
    text: Which storage facility is a given storage activity happening at?
  - id: cq10
    text: Which facility is a given shipment-preparation activity happening at?
  - id: cq11
    text: Which freight forwarder is involved in a given forwarding arrangement?
  - id: cq12
    text: What item is a given purchase order for?
  - id: cq13
    text: What item is a given shipment for?
  - id: cq14
    text: What container is a given shipment using?
  - id: cq15
    text: What tracking events do we have for a given shipment?
  - id: cq16
    text: What tracking events do we have for a given lot to preserve traceability?
classes:
  Shipment:
    meaning: "A shipment is the traceable unit of goods being prepared, moved, or received through the supply chain."
    aliases: []
    properties: {}
  Supplier:
    meaning: A supplier is a trading partner that supplies goods or services in the supply chain.
    aliases: []
    properties: {}
  Customer:
    meaning: A customer is a trading partner that receives supplied goods or services in the supply chain.
    aliases: []
    properties: {}
  MaterialTradeItem:
    meaning: A material trade item is a material item treated as a tradable item in supply-chain operations.
    aliases: []
    properties: {}
  PurchaseOrder:
    meaning: A purchase order is the agreement that requests or authorizes supply of goods or services.
    aliases:
      - order
    properties: {}
  Carrier:
    meaning: A carrier is a supplier that carries or transports shipments.
    aliases: []
    properties: {}
  FreightForwarder:
    meaning: A freight forwarder is the agent that arranges freight forwarding activities and services.
    aliases: []
    properties: {}
  TransportProcess:
    meaning: A transport process is the process that moves goods from one place to another.
    aliases: []
    properties: {}
  FreightForwardingService:
    meaning: A freight forwarding service is the service that provides freight forwarding capability.
    aliases: []
    properties: {}
  Facility:
    meaning: A facility is a physical facility used in supply-chain operations.
    aliases: []
    properties: {}
  StorageFacility:
    meaning: A storage facility is a facility used to store goods or traceable units.
    aliases: []
    properties: {}
  ReceivingProcess:
    meaning: A receiving process is the business process that receives incoming goods or shipments.
    aliases: []
    properties: {}
  StorageProcess:
    meaning: A storage process is the planned process that stores goods or traceable units.
    aliases: []
    properties: {}
  ShipmentPreparationProcess:
    meaning: A shipment preparation process is the process that prepares a shipment for dispatch.
    aliases: []
    properties: {}
  TrackingEvent:
    meaning: "A tracking event is the event recorded to track movement, handling, or state changes of traceable units."
    aliases: []
    properties:
      eventTime:
        type: date
      eventType:
        type: text
        allowed:
          - packed
          - shipped
          - arrived
          - received
          - stored
  TraceableResourceUnit:
    meaning: A traceable resource unit is a material unit that can be traced through supply-chain activities.
    aliases: []
    properties: {}
  Lot:
    meaning: A lot is a traceable production or supply lot used for batch-level control.
    aliases: []
    properties: {}
  Sublot:
    meaning: A sublot is a traceable subdivision of a lot.
    aliases: []
    properties: {}
  LogisticUnit:
    meaning: A logistic unit is a traceable logistics handling unit used in storage and transport.
    aliases: []
    properties: {}
  Load:
    meaning: A load is a traceable load unit prepared for handling or transport.
    aliases: []
    properties: {}
  ShipFromLocation:
    meaning: A ship-from location is the location from which a shipment is sent.
    aliases: []
    properties: {}
  ShipToLocation:
    meaning: A ship-to location is the location to which a shipment is sent.
    aliases: []
    properties: {}
  Container:
    meaning: A container is a material artifact used to hold or transport goods.
    aliases: []
    properties: {}
  Shipper:
    meaning: A shipper is the consignor that sends or consigns a shipment.
    aliases:
      - consignor
    properties: {}
  Consignee:
    meaning: A consignee is the agent designated to receive a shipment.
    aliases: []
    properties: {}
  FreightContainer:
    meaning: A freight container is a container specifically used for freight transport.
    aliases: []
    properties: {}
  SupplyRelationship:
    meaning: "A supply relationship is the supply dependency that ties together the supplier, customer, and product context."
    aliases: []
    properties: {}
  SupplyChainNode:
    meaning: "A supply chain node is a node in the supply chain used as an origin, destination, or operating point."
    aliases: []
    properties: {}
  TransportationService:
    meaning: A transportation service is the service that provides transportation capability for supply-chain movement.
    aliases: []
    properties: {}
  ConsigningProcess:
    meaning: A consigning process is the business process in which goods are consigned for shipment.
    aliases: []
    properties: {}
  BillOfLading:
    meaning: A bill of lading is the commercial service agreement documenting shipment carriage details.
    aliases: []
    properties: {}
  Traceability:
    meaning: Traceability is the capability to trace supply-chain resources and events across processes.
    aliases: []
    properties: {}
relationships:
  - name: dependsOnSupplier
    from: SupplyRelationship
    to: Supplier
    meaning: The supply relationship depends on the supplier in scope for that supply context.
    aliases: []
  - name: dependsOnCustomer
    from: SupplyRelationship
    to: Customer
    meaning: The supply relationship depends on the customer in scope for that supply context.
    aliases: []
  - name: dependsOnMaterialTradeItem
    from: SupplyRelationship
    to: MaterialTradeItem
    meaning: The supply relationship depends on the material trade item in scope for that supply context.
    aliases: []
  - name: concernsItem
    from: PurchaseOrder
    to: MaterialTradeItem
    meaning: The order or shipment concerns the material trade item involved.
    aliases: []
  - name: concernsItem
    from: Shipment
    to: MaterialTradeItem
    meaning: The order or shipment concerns the material trade item involved.
    aliases: []
  - name: hasShipFromLocation
    from: Shipment
    to: ShipFromLocation
    meaning: The shipment has the location from which it is sent.
    aliases: []
  - name: hasShipToLocation
    from: Shipment
    to: ShipToLocation
    meaning: The shipment has the location to which it is sent.
    aliases: []
  - name: hasShipmentPreparationProcess
    from: Shipment
    to: ShipmentPreparationProcess
    meaning: The shipment is linked to the process that prepares it for dispatch.
    aliases: []
  - name: hasCarrierAsAgent
    from: ShipmentPreparationProcess
    to: Carrier
    meaning: The shipment preparation process involves the carrier as its agent.
    aliases: []
  - name: occursAtFacility
    from: ShipmentPreparationProcess
    to: Facility
    meaning: The process takes place at the facility where that activity is carried out.
    aliases: []
  - name: startsAtSupplyChainNode
    from: TransportProcess
    to: SupplyChainNode
    meaning: The transport process starts at the supply chain node where the movement begins.
    aliases: []
  - name: endsAtSupplyChainNode
    from: TransportProcess
    to: SupplyChainNode
    meaning: The transport process ends at the supply chain node where the movement is intended to finish.
    aliases: []
  - name: involvesCarrier
    from: TransportationService
    to: Carrier
    meaning: The transportation service involves the carrier providing the transport capability.
    aliases: []
  - name: involvesFreightForwarder
    from: FreightForwardingService
    to: FreightForwarder
    meaning: The freight forwarding service involves the freight forwarder arranging the forwarding capability.
    aliases: []
  - name: occursAtFacility
    from: ReceivingProcess
    to: Facility
    meaning: The process takes place at the facility where that activity is carried out.
    aliases: []
  - name: occursAtStorageFacility
    from: StorageProcess
    to: StorageFacility
    meaning: The storage process takes place at the storage facility where the goods or traceable units are stored.
    aliases: []
  - name: usesContainer
    from: Shipment
    to: Container
    meaning: The shipment uses the container for handling or transport.
    aliases: []
  - name: usesFreightContainer
    from: Shipment
    to: FreightContainer
    meaning: The shipment uses the freight container for freight transport.
    aliases: []
  - name: tracksShipment
    from: TrackingEvent
    to: Shipment
    meaning: The tracking event records information about the shipment.
    aliases: []
  - name: tracksLot
    from: TrackingEvent
    to: Lot
    meaning: The tracking event records information about the lot.
    aliases: []
  - name: isTiedToTraceableResourceUnit
    from: Shipment
    to: TraceableResourceUnit
    meaning: The shipment is linked to the traceable resource unit relevant for traceability.
    aliases: []
  - name: involvesShipper
    from: ConsigningProcess
    to: Shipper
    meaning: The consigning process involves the shipper who sends the shipment.
    aliases: []
  - name: isAssociatedWithTransportProcess
    from: Shipment
    to: TransportProcess
    meaning: The shipment is linked to the transport process involved in moving it.
    aliases: []
  - name: hasReceivingProcess
    from: Shipment
    to: ReceivingProcess
    meaning: The shipment is linked to the receiving process through which it is received.
    aliases: []
  - name: usesTransportationService
    from: TransportProcess
    to: TransportationService
    meaning: The transport process uses the transportation service that provides the movement capability.
    aliases: []
  - name: hasConsignee
    from: Shipment
    to: Consignee
    meaning: The shipment is linked to the designated receiving party.
    aliases: []
  - name: tracksLogisticUnit
    from: TrackingEvent
    to: LogisticUnit
    meaning: The tracking event records information about the logistic unit.
    aliases: []
  - name: tracksLoad
    from: TrackingEvent
    to: Load
    meaning: The tracking event records information about the load.
    aliases: []
  - name: isSubdividedIntoSublot
    from: Lot
    to: Sublot
    meaning: The lot is divided into the sublot used for finer-grained traceability.
    aliases: []
  - name: documentsShipment
    from: BillOfLading
    to: Shipment
    meaning: The bill of lading records the carriage details for the shipment.
    aliases: []
  - name: isPartOfTraceability
    from: TrackingEvent
    to: Traceability
    meaning: The tracking event contributes to the overall traceability capability.
    aliases: []
rules:
  prepareShipmentForDispatchAllowed:
    conditions:
      - shipment has a ship-from location
      - shipment has a ship-to location
      - shipment has an identified shipment preparation process
  receiveShipmentAllowed:
    conditions:
      - shipment has a receiving process
      - the receiving process occurs at a facility
      - shipment has a ship-to location
      - shipment is associated with a transport process
  recordTrackingEventAllowed:
    conditions:
      - "a shipment, lot, logistic unit, or load is identified as the thing being tracked"
      - the tracking event has an event time
      - the tracking event has an event type
actions:
  prepareShipmentForDispatch:
    input: Shipment
    preconditions:
      - prepareShipmentForDispatchAllowed
    effect: "The shipment is documented with its ship-from location, ship-to location, and shipment preparation process for dispatch."
    verification: "Confirm the shipment has a ship-from location, a ship-to location, and an identified shipment preparation process."
  receiveShipment:
    input: Shipment
    preconditions:
      - receiveShipmentAllowed
    effect: "The shipment is documented with its receiving process, ship-to location, and associated transport process for receipt at the facility."
    verification: "Confirm the shipment has a receiving process, that receiving process occurs at a facility, the shipment has a ship-to location, and the shipment is associated with a transport process."
  recordTrackingEvent:
    input: TrackingEvent
    preconditions:
      - recordTrackingEventAllowed
    effect: The tracking event is recorded with its event time and event type and linked to the identified tracked unit.
    verification: "Confirm the tracking event has an event time, has an event type, and is linked to the shipment, lot, logistic unit, or load being tracked."
  evaluateSupplyRelationship:
    input: SupplyRelationship
    preconditions: []
    effect: "The supply relationship is reviewed in terms of its supplier, customer, and material trade item context."
    verification: "Confirm the supply relationship identifies a supplier, a customer, and a material trade item."
  identifyCarrierForMovement:
    input: TransportProcess
    preconditions: []
    effect: The carrier responsible for the transport process is identified through its transportation service.
    verification: Confirm the transport process uses a transportation service and that transportation service involves a carrier.
  identifyCarrierForShipmentPreparation:
    input: ShipmentPreparationProcess
    preconditions: []
    effect: The carrier acting for the shipment preparation process is identified.
    verification: Confirm the shipment preparation process has a carrier as agent.
  identifyFreightForwarderForArrangement:
    input: FreightForwardingService
    preconditions: []
    effect: The freight forwarder involved in the freight forwarding service is identified.
    verification: Confirm the freight forwarding service involves a freight forwarder.
  linkShipmentToTraceableUnit:
    input: Shipment
    preconditions: []
    effect: The shipment is linked to the relevant traceable resource unit.
    verification: Confirm the shipment is tied to the relevant traceable resource unit.
  confirmShipmentPreparationSite:
    input: ShipmentPreparationProcess
    preconditions: []
    effect: The facility where the shipment preparation process occurs is confirmed.
    verification: Confirm the shipment preparation process occurs at a facility.
  confirmReceivingSite:
    input: ReceivingProcess
    preconditions: []
    effect: The facility where the receiving process occurs is confirmed.
    verification: Confirm the receiving process occurs at a facility.
  confirmStorageSite:
    input: StorageProcess
    preconditions: []
    effect: The storage facility where the storage process occurs is confirmed.
    verification: Confirm the storage process occurs at a storage facility.
