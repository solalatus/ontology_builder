    effect: ""
    verification: ""
  checkRequiredFunction:
    input: WorkOrder
    preconditions:
      - functionCheck
    effect: ""
    verification: ""
  closeWorkOrder:
    input: WorkOrder
    preconditions:
      - workOrderReadyForClosure
    effect: ""
    verification: ""
  identifyFurtherWork:
    input: WorkOrder
    preconditions:
      - furtherWorkHandling
    effect: ""
    verification: ""
