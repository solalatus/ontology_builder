rules:
  meetsMajorIncidentCriteria:
    conditions:
      - Incident impact is enterprise-wide or multiple-services.
      - Incident urgency is immediate or high.
      - "An affected IT Service has criticality Tier 1 - Critical or health state Degraded, Partially Unavailable, or Unavailable."
      - "Incident status is not resolved, closed, or cancelled."
  defaultServiceGroupCandidate:
    conditions:
      - Incident impacts an IT Service.
      - Resolver Group supports that IT Service.
  onCallEngineerCandidate:
    conditions:
      - Incident is assigned to a Resolver Group.
      - That Resolver Group has the On-Call Engineer.
      - On-Call Engineer availability is Available or On-Duty.
  restorationOnTrack:
    conditions:
      - Service Restoration tracks a Recovery Milestone whose due date is today or earlier.
      - Service Restoration Progress Indicator and Recovery Milestone expected progress percentage each fall between 0 and 100 inclusive and measure the same overall restoration work.
      - Service Restoration Progress Indicator meets or exceeds the tracked Recovery Milestone expected progress percentage.
      - Tracked Recovery Milestone completion status is Completed.
  restorationNotOnTrack:
    conditions:
      - Service Restoration tracks a Recovery Milestone whose due date is today or earlier.
      - Service Restoration Progress Indicator and Recovery Milestone expected progress percentage each fall between 0 and 100 inclusive and measure the same overall restoration work.
      - "Service Restoration Progress Indicator is below the tracked Recovery Milestone expected progress percentage, even if its completion status is Completed, In Progress, or Not Started; OR progress meets or exceeds the expected percentage but that milestone's completion status is Not Started."
  restorationOnTrackUnconfirmed:
    conditions:
      - "No Recovery Milestone tracked by the Service Restoration has a due date today or earlier; OR a tracked Recovery Milestone is due today or earlier, both percentages are available on the same 0 to 100 scale, Service Restoration Progress Indicator meets or exceeds its expected progress percentage, and that milestone's completion status is In Progress."
  notificationRequired:
    conditions:
      - Incident is evaluated by a Materiality Assessment.
      - Materiality Assessment status is Completed.
      - Materiality Assessment requiresNotification is true.
  notificationUndetermined:
    conditions:
      - "The incident's Materiality Assessment is absent or its status is not Completed or its requiresNotification value is missing."
  backupAgeAcceptable:
    conditions:
      - Backup Set is governed by a Backup Retention Policy; use this directly linked policy if it differs from the policy governing the protected Configuration Item.
      - Backup Set date of last successful backup and the directly linked Backup Retention Policy maximumBackupAge in days are available.
      - The age in days since the Backup Set date of last successful backup does not exceed the directly linked Backup Retention Policy maximumBackupAge.
  backupVersionCompatible:
    conditions:
      - "Configuration Item version and Backup Set version are both available and match exactly; OR, if they differ, the Version Compatibility Matrix linked to the Backup Set explicitly approves that Configuration Item version and Backup Set version pair."
      - "If the matrices linked to the Backup Set and Configuration Item differ, the Backup Set's matrix governs the decision; the existence of a matrix alone does not establish approval."
  backupUsableForRestore:
    conditions:
      - Backup Set status is Successful or Verified and it protects the Configuration Item being restored.
      - backupAgeAcceptable holds for the Backup Set.
      - backupVersionCompatible holds for the Backup Set and Configuration Item.
  dependenciesReadyForRestore:
    conditions:
      - Every Configuration Item on which the Configuration Item being restored depends has status Operational or Degraded.
      - "Current readiness of every required Third-Party Service dependency of the Configuration Item or affected IT Service has been verified using monitoring (including provider alerts), provider communication, or vendor confirmation."
      - "A required Third-Party Service confirmed Operational is ready; if confirmed Degraded, obtain case-specific confirmation directly from the assigned Resolver Group that its reduced functionality will not prevent this restoration."
      - "If a required Third-Party Service's current readiness cannot be verified, or a Degraded service lacks that confirmation, restoration is blocked."
  canImplementEmergencyChange:
    conditions:
      - Emergency Change status is Approved or Scheduled.
      - Emergency Change approvalRequired is known.
      - "If Emergency Change approvalRequired is true, a Technical Owner of the Configuration Item modified by the Emergency Change has approved that Emergency Change."
  canSubmitRegulatoryNotification:
    conditions:
      - Regulatory Notification status is Approved and its due date is available.
      - Regulatory Notification is sent to a Regulator.
      - Its triggering Materiality Assessment has status Completed and requiresNotification true.
      - A passed due date does not block submission; prioritize submission urgently and flag the late submission.
  canSendStakeholderCommunication:
    conditions:
      - Stakeholder Communication status is Approved.
      - Stakeholder Communication is addressed to identified Stakeholders.
      - "The communication about the Incident reflects that Incident's current status."
  canAcknowledgeAlert:
    conditions:
      - Alert status is New.
  canApplyContainmentMeasure:
    conditions:
      - "Incident status is not resolved, closed, or cancelled."
      - The Runbook governing the IT Service affected by the Incident confirms that the selected Containment Measure is applicable to the incident circumstances.
  canExecuteWorkaround:
    conditions:
      - "Incident status is not resolved, closed, or cancelled."
      - The selected Workaround is included by the affected IT Service and its Runbook confirms that it is appropriate for the incident circumstances.
  canConductPostIncidentReview:
    conditions:
      - Post-Incident Review status is Draft.
      - Post-Incident Review examines an Incident whose status is resolved or closed.
  canAssignIncidentToResolverGroup:
    conditions:
      - "Incident status is not resolved, closed, or cancelled."
      - Incident is not already assigned to a Resolver Group.
      - "If the Incident does not implicate a Configuration Item, choose a Resolver Group supporting the affected IT Service."
      - "If the Incident implicates a Configuration Item, wait for explicit confirmation of the IT Service support group's expertise; assign that group if confirmed capable, otherwise assign a Resolver Group supporting the implicated Configuration Item."
      - Do not assign any group for an implicated Configuration Item while the expertise confirmation is unavailable.
  correctiveActionStillOpen:
    conditions:
      - "Corrective Action status is Open, In-Progress, or Blocked."
  canDeclareMajorIncident:
    conditions:
      - meetsMajorIncidentCriteria holds for the Incident.
      - "Incident isMajorIncident is known; if false, declare it, and if already true, confirm the existing declaration without changing it."
  canCompletePostIncidentReview:
    conditions:
      - Post-Incident Review status is Held and its findings text has been documented.
      - Compare Post-Incident Review findings text against its produces links; each Corrective Action identified in the findings has a recorded produces link and can be followed up even if its status is Blocked.
      - "The linked Post-Incident Review Documentation Guidelines requiresFinalizedDocument value is known; if missing, block completion."
      - "If those Guidelines require a Finalized Document, the Post-Incident Review includes one whose status is Finalized; otherwise findings text suffices."
actions:
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: Set Alert status to Acknowledged.
    verification: Read the Alert again and confirm status is Acknowledged.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: "If Incident isMajorIncident is false, set it to true; if already true, make no change."
    verification: Read the Incident again and confirm isMajorIncident is true.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions:
      - canAssignIncidentToResolverGroup
    effect: Record Incident isAssignedTo the selected Resolver Group.
    verification: Read the Incident again and confirm its isAssignedTo link targets the selected Resolver Group.
  containIncident:
    input: Incident
    preconditions:
      - canApplyContainmentMeasure
    effect: Apply the Runbook-confirmed Containment Measure and record Incident isHandledWith that Containment Measure.
    verification: Read the Incident again and confirm its isHandledWith link targets the applied Containment Measure.
  executeWorkaround:
    input: Incident
    preconditions:
      - canExecuteWorkaround
    effect: Execute the Runbook-confirmed Workaround and record Incident isAddressedWith that Workaround.
    verification: Read the Incident again and confirm its isAddressedWith link targets the executed Workaround.
  implementEmergencyChange:
    input: Emergency Change
    preconditions:
      - canImplementEmergencyChange
    effect: Implement the Emergency Change on its linked Configuration Item and set Emergency Change status to Implemented.
    verification: Read the Emergency Change again and confirm status is Implemented and its modifies link targets the Configuration Item changed.
  sendStakeholderCommunication:
    input: Stakeholder Communication
    preconditions:
      - canSendStakeholderCommunication
    effect: Send the Stakeholder Communication to its linked Stakeholders and set its status to Sent.
    verification: Read the Stakeholder Communication again and confirm status is Sent and its isAddressedTo link targets the intended Stakeholders.
  submitRegulatoryNotification:
    input: Regulatory Notification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: "Submit the Regulatory Notification to its linked Regulator, set its status to Submitted, and report in the submission confirmation whether the submission is late by comparison with its due date."
    verification: Read the Regulatory Notification again and confirm status is Submitted and its isSentTo link targets the Regulator.
  restoreDataFromBackupSet:
    input: Service Restoration
    preconditions:
      - backupUsableForRestore
      - dependenciesReadyForRestore
    effect: "After data recovery succeeds, record Service Restoration recoversDataFrom the selected Backup Set; do not set the whole Service Restoration status to Succeeded solely because this restore succeeded."
    verification: Read Service Restoration again and confirm its recoversDataFrom link targets the Backup Set used for the successful recovery.
  conductPostIncidentReview:
    input: Post-Incident Review
    preconditions:
      - canConductPostIncidentReview
    effect: Conduct the Post-Incident Review and set its status from Draft to Held; do not mark it Completed until subsequent formalization and follow-up.
    verification: Read the Post-Incident Review again and confirm status is Held and its examines link still targets the reviewed Incident.
  completePostIncidentReview:
    input: Post-Incident Review
    preconditions:
      - canCompletePostIncidentReview
    effect: Set Post-Incident Review status to Completed; the findings and required linked corrective actions and finalized document have already been checked by canCompletePostIncidentReview and are not changed by this action.
    verification: Read the Post-Incident Review again and confirm its status is Completed.
