competency_questions:
  - id: cq1
    text: "Which configuration items are on the affected IT service's dependency path?"
  - id: cq2
    text: Which third-party services are on the dependency path of the affected IT service?
  - id: cq3
    text: Who owns the affected IT service?
  - id: cq4
    text: Which resolver group should be assigned to the incident?
  - id: cq5
    text: Which on-call engineer should be assigned to the incident?
  - id: cq6
    text: Does the incident meet the criteria for declaring a major incident?
  - id: cq7
    text: Which business services are impacted by this incident?
  - id: cq8
    text: Which customer channels are impacted by this incident?
  - id: cq9
    text: Which business services and customer channels are impacted by this incident?
  - id: cq10
    text: What runbook applies to the incident?
  - id: cq11
    text: Which workaround can be used for the incident?
  - id: cq12
    text: What backup set can be used for recovery from the incident?
  - id: cq13
    text: What recovery plan applies to the incident?
  - id: cq14
    text: Has a materiality assessment been completed for the incident?
  - id: cq15
    text: Is a regulatory notification required based on the assessment of this incident?
  - id: cq16
    text: Which open corrective actions from previous post-incident reviews concern the impacted service?
  - id: cq17
    text: What is the current status and health state of the affected services?
  - id: cq18
    text: "What is the status of restoration efforts, and are they on track?"
classes:
  Incident:
    meaning: An unplanned disruption or degradation that the team investigates and responds to.
    aliases: []
    properties:
      impact:
        type: text
        allowed:
          - enterprise-wide
          - multiple-services
          - single-service
          - limited-users
          - no-observed-impact
      urgency:
        type: text
        allowed:
          - immediate
          - high
          - normal
          - low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      isMajorIncident:
        type: boolean
  IT Service:
    meaning: An operational technology service that supports business services and whose health and dependencies the team manages.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Operational
          - Degraded
          - Maintenance
          - Retired
      health state:
        type: text
        allowed:
          - Healthy
          - Degraded
          - Partially Unavailable
          - Unavailable
          - Recovering
          - Unknown
      criticality:
        type: text
        allowed:
          - Tier 1 - Critical
          - Tier 2 - Important
          - Tier 3 - Standard
          - Tier 4 - Supporting
  Business Service:
    meaning: A business-facing capability that relies on IT services.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - New
          - Active
          - Inactive
          - Under Maintenance
          - Retired
      health state:
        type: text
        allowed:
          - Healthy
          - Degraded
          - Partially Unavailable
          - Unavailable
          - Unknown
  Customer Channel:
    meaning: A means through which customers access a business service.
    aliases: []
    properties: {}
  Configuration Item:
    meaning: A managed technical component used by an application or another configuration item.
    aliases: []
    properties:
      version:
        type: text
      status:
        type: text
        allowed:
          - Operational
          - Degraded
          - Maintenance
          - Retired
  Third-Party Service:
    meaning: "An externally provided service on which an IT service or configuration item depends, affecting overall service performance."
    aliases: []
    properties: {}
  Alert:
    meaning: A monitoring signal concerning an IT service or incident that the agent may acknowledge and that may require action or further investigation.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - New
          - Acknowledged
          - Suppressed
          - Escalated
          - Closed
  Service Owner:
    meaning: The person accountable for an IT service.
    aliases: []
    properties: {}
  Resolver Group:
    meaning: A team designated to support particular IT services or configuration items and address assigned incidents based on their expertise.
    aliases: []
    properties: {}
  On-Call Engineer:
    meaning: "An engineer designated for immediate incident response during a period of availability, generally part of the resolver group."
    aliases:
      - On-Call Rotational Engineer
    properties:
      availability:
        type: text
        allowed:
          - Available
          - Unavailable
          - On-Duty
          - Off-Duty
  Technical Owner:
    meaning: "The person accountable for a configuration item's technical integrity, including its engineering and maintenance responsibilities."
    aliases: []
    properties: {}
  Runbook:
    meaning: A documented procedure that includes specific instructions for handling operational issues affecting an IT service.
    aliases: []
    properties: {}
  Workaround:
    meaning: "A temporary response used to reduce an incident's impact without necessarily providing a permanent fix."
    aliases: []
    properties: {}
  Backup Set:
    meaning: "A trackable backup record from scheduling through execution and verification, used when its completed data is suitable for restoring a protected configuration item."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Scheduled
          - Running
          - Successful
          - Failed
          - Expired
          - Corrupted
          - Verified
      date of last successful backup:
        type: date
      version:
        type: text
  Recovery Plan:
    meaning: "A documented approach that includes specific procedures, timelines, and key resources for restoring an IT service after disruption."
    aliases: []
    properties: {}
  Materiality Assessment:
    meaning: "An evaluation of an incident's significance, considering its impact on business operations and whether notification is required."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Not Started
          - In Progress
          - Completed
      requiresNotification:
        type: boolean
  Regulatory Notification:
    meaning: A formal incident-related submission sent to a regulator that includes necessary documentation and evidence when required.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Draft
          - Pending Approval
          - Approved
          - Submitted
          - Accepted
          - Rejected
          - Withdrawn
      due date:
        type: date
  Post-Incident Review:
    meaning: "A review of a specific incident that records findings, identifies improvements, and tracks follow-up actions and lessons learned."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Draft
          - Held
          - Completed
      findings:
        type: text
  Corrective Action:
    meaning: An improvement measure produced by a post-incident review whose progress can be tracked.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Open
          - In-Progress
          - Blocked
          - Implemented
          - Verified
          - Closed
          - Cancelled
  Service Restoration:
    meaning: "The ongoing work of returning an IT service affected by an incident to operation, including tracking of progress."
    aliases:
      - Restoration Effort
    properties:
      status:
        type: text
        allowed:
          - Planned
          - In-Progress
          - Succeeded
          - Failed
          - Rolled-Back
          - Cancelled
      Progress Indicator:
        type: number
        unit: percent
  Emergency Change:
    meaning: An urgent change prompted by an incident that modifies a configuration item to restore service or mitigate issues caused by the incident.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Draft
          - Approved
          - Scheduled
          - Implementing
          - Implemented
          - Failed
          - Rolled-Back
          - Closed
          - Cancelled
      approvalRequired:
        type: boolean
  Stakeholder Communication:
    meaning: "A message about an incident prepared for and sent to identified stakeholders, which may vary based on the audience type."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Draft
          - Pending Approval
          - Approved
          - Sent
          - Withdrawn
          - Rejected
  Containment Measure:
    meaning: A step applied during an incident to limit further impact and stabilize the situation until a workaround or solution is implemented.
    aliases:
      - Containment
      - Containment Action
    properties: {}
  Stakeholders:
    meaning: "The individuals or groups addressed by a stakeholder communication about an incident, including technical personnel, management, customers, and regulatory bodies."
    aliases: []
    properties: {}
  Application:
    meaning: A software application that implements business or operational functionality related to an IT service.
    aliases: []
    properties: {}
  Regulator:
    meaning: The competent authority that receives a formal regulatory notification.
    aliases: []
    properties: {}
  Recovery Milestone:
    meaning: A dated checkpoint in a recovery plan against which restoration progress is measured.
    aliases: []
    properties:
      due date:
        type: date
      expected progress percentage:
        type: number
        unit: percent
      completion status:
        type: text
        allowed:
          - Not Started
          - In Progress
          - Completed
  Backup Retention Policy:
    meaning: The policy that sets the maximum usable age of a Backup Set.
    aliases: []
    properties:
      maximumBackupAge:
        type: number
        unit: days
  Version Compatibility Matrix:
    meaning: A document identifying approved Configuration Item and Backup Set version pairs for restoration.
    aliases: []
    properties: {}
  Post-Incident Review Documentation Guidelines:
    meaning: The guidelines specifying documentation required to complete a Post-Incident Review.
    aliases: []
    properties:
      requiresFinalizedDocument:
        type: boolean
  Finalized Document:
    meaning: "A review document tracked from Draft through Under Review to Finalized, whose Finalized status is required when the review guidelines call for it."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - Draft
          - Under Review
          - Finalized
