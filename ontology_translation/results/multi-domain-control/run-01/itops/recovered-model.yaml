    aliases: []
  - name: implementedBy
    from: ITService
    to: Application
    meaning: Identifies the concrete application or release through which the higher-level service or change is realized.
    aliases: []
  - name: runsOn
    from: Application
    to: InfrastructureComponent
    meaning: null
    aliases: []
  - name: dependsOn
    from: ITService
    to: ThirdPartyService
