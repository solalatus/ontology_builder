competency_questions:
  - id: cq1
    text: "Which business services are impacted by this incident, and through which customer channels are customers seeing it?"
  - id: cq2
    text: "What IT services, configuration items, and third-party dependencies sit on the dependency path for the affected service?"
  - id: cq3
    text: "Which alerts and events are actually correlated to this incident, and which ones are just noise?"
  - id: cq4
    text: "Who owns the affected service, and which resolver group or on-call engineer should take this now?"
  - id: cq5
    text: Does this incident meet the criteria to be treated as a major incident?
  - id: cq6
    text: "What runbook, workaround, backup set, or recovery plan can we safely use for this case?"
  - id: cq7
    text: Was this incident likely caused by a recent change or deployment?
  - id: cq8
    text: "Has the materiality assessment been completed, and do we need to prepare or submit a regulatory notification?"
classes:
  Incident:
    meaning: "An incident is an unplanned interruption, degradation, or security-related condition that requires managed response."
    aliases:
      - incident ticket
    properties:
      incidentIdentifier:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      majorIncidentClassification:
        type: text
        allowed:
          - major
          - non-major
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      detectedTime:
        type: date
      acknowledgementTime:
        type: date
      closedTime:
        type: date
      summary:
        type: text
      detectionSource:
        type: text
      resolvedTime:
        type: date
  BusinessService:
    meaning: A business service is a customer-facing or business-facing capability delivered by the bank.
    aliases: []
    properties:
      serviceIdentifier:
        type: text
      serviceName:
        type: text
      criticalityTier:
        type: text
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  ITService:
    meaning: An IT service is a managed technology capability that supports one or more business services.
    aliases:
      - informatics service
    properties:
      serviceIdentifier:
        type: text
      serviceName:
        type: text
      criticalityTier:
        type: text
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  CustomerChannel:
    meaning: A customer channel is a channel through which customers access banking services.
    aliases: []
    properties: {}
  ConfigurationItem:
    meaning: A configuration item is a managed component within configuration-management scope.
    aliases:
      - CI
    properties:
      configurationItemIdentifier:
        type: text
      name:
        type: text
  ThirdPartyService:
    meaning: A third-party service is an externally provided service that the bank depends on.
    aliases: []
    properties: {}
  Alert:
    meaning: An alert is a monitoring or security signal that requires triage or acknowledgement.
    aliases:
      - alarm
    properties:
      alertIdentifier:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      summary:
        type: text
  Event:
    meaning: An event is a time-stamped observation of a state change or other notable occurrence.
    aliases: []
    properties: {}
  Change:
    meaning: "A change is a controlled addition, modification, or removal that may affect an IT service."
    aliases:
      - modification
    properties:
      changeIdentifier:
        type: text
      status:
        type: text
      emergencyClassification:
        type: text
        allowed:
          - emergency
          - standard
      plannedStart:
        type: date
      plannedEnd:
        type: date
  Deployment:
    meaning: A deployment is the technical execution that installs or activates a release or change.
    aliases:
      - go-live
    properties:
      deploymentIdentifier:
        type: text
      status:
        type: text
      startedTime:
        type: date
      completedTime:
        type: date
  ServiceOwner:
    meaning: A service owner is the role accountable for an IT service across its lifecycle.
    aliases: []
    properties: {}
  ApplicationOwner:
    meaning: An application owner is the role accountable for an application and its operational fitness.
    aliases: []
    properties: {}
  TechnicalOwner:
    meaning: A technical owner is the role accountable for the engineering and maintenance of a configuration item.
    aliases: []
    properties: {}
  ResolverGroup:
    meaning: A resolver group is the team assigned to diagnose and restore a specific technology or service area.
    aliases: []
    properties:
      name:
        type: text
  OnCallEngineer:
    meaning: An on-call engineer is a technical specialist available for time-critical operational response.
    aliases: []
    properties:
      name:
        type: text
  Stakeholder:
    meaning: "A stakeholder is a person, group, or organization affected by or responsible for an operational outcome."
    aliases: []
    properties:
      name:
        type: text
  Runbook:
    meaning: "A runbook is a maintained operational procedure for diagnosis, response, recovery, or verification."
    aliases:
      - playbook
    properties:
      runbookIdentifier:
        type: text
      name:
        type: text
  Workaround:
    meaning: A workaround is a temporary method that reduces or bypasses the impact of an incident or problem.
    aliases: []
    properties:
      workaroundIdentifier:
        type: text
      summary:
        type: text
  RecoveryPlan:
    meaning: A recovery plan is a documented plan for restoring an IT service and its dependencies.
    aliases:
      - DR plan
    properties:
      planIdentifier:
        type: text
      recoveryTimeObjective:
        type: text
      recoveryPointObjective:
        type: text
  BackupSet:
    meaning: A backup set is a defined collection of recoverable backup data for protected components.
    aliases:
      - backup
    properties:
      backupIdentifier:
        type: text
      lastSuccessfulBackup:
        type: date
      backupStatus:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
  MaterialityAssessment:
    meaning: A materiality assessment is a documented determination of incident significance and reporting implications.
    aliases:
      - reportability assessment
    properties:
      assessmentResult:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      assessedTime:
        type: date
  RegulatoryNotification:
    meaning: A regulatory notification is a formal incident-related submission to a competent authority.
    aliases:
      - supervisory notification
    properties:
      notificationIdentifier:
        type: text
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submittedTime:
        type: date
      dueTime:
        type: date
  EvidenceItem:
    meaning: "An evidence item is a preserved record, artifact, or observation that supports incident analysis and accountability."
    aliases:
      - evidence
    properties:
      evidenceIdentifier:
        type: text
      collectedTime:
        type: date
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
  Communication:
    meaning: "A communication is a controlled message sent to an operational, business, customer, vendor, or regulatory audience."
    aliases: []
    properties:
      audience:
        type: text
        allowed:
          - technical
          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
      sentTime:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      messageSummary:
        type: text
  Application:
    meaning: An application is a software system that provides business or operational functionality.
    aliases: []
    properties:
      name:
        type: text
  Environment:
    meaning: "An environment is a deployment context such as production, test, development, or disaster recovery."
    aliases: []
    properties:
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
  Site:
    meaning: "A site is a physical bank, supplier, or hosting location."
    aliases: []
    properties:
      locationName:
        type: text
  DataCentre:
    meaning: A data centre is a facility that hosts managed technology infrastructure.
    aliases: []
    properties: {}
  BusinessOwner:
    meaning: A business owner is the business role accountable for a business service.
    aliases: []
    properties: {}
  Release:
    meaning: A release is a governed package of approved changes introduced together.
    aliases: []
    properties: {}
  KnownError:
    meaning: A known error is a diagnosed problem with a documented cause or workaround.
    aliases: []
    properties:
      knownErrorIdentifier:
        type: text
      diagnosedCause:
        type: text
      workaroundSummary:
        type: text
  Server:
    meaning: A server is a physical compute host that provides processing capacity.
    aliases: []
    properties:
      name:
        type: text
  Regulator:
    meaning: A regulator is a competent authority that supervises the bank or receives required notifications.
    aliases: []
    properties:
      regulatorName:
        type: text
  Vendor:
    meaning: A vendor is an external organization that supplies or supports technology or services.
    aliases:
      - supplier
      - third-party supplier
    properties:
      legalName:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      criticalProvider:
        type: boolean
  Problem:
    meaning: "A problem is the underlying cause, or potential cause, of one or more incidents."
    aliases: []
    properties:
      problemIdentifier:
        type: text
      status:
        type: text
        allowed:
          - new
          - investigating
          - root-cause-known
          - known-error
          - resolved
          - closed
      summary:
        type: text
  IncidentCommander:
    meaning: An incident commander is the role coordinating an incident response.
    aliases: []
    properties: {}
