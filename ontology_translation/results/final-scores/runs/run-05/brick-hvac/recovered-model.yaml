    aliases: []
  - name: hasPoint
    from: Air Handling Unit
    to: Temperature Deadband Setpoint
    meaning: "The temperature deadband setpoint gives the air handling unit's configured allowable temperature-band size."
    aliases: []
  - name: hasPart
