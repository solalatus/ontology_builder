competency_questions:
  - id: cq1
    text: Which business services are affected by an incident?
  - id: cq2
    text: Through which customer channels are affected business services delivered?
  - id: cq3
    text: "Which applications, infrastructure components, and third-party services are on the affected IT service's recorded technical path?"
  - id: cq4
    text: Which active alerts and observed events are associated with an incident?
  - id: cq5
    text: Who owns an affected IT service?
  - id: cq6
    text: "Which resolver group should handle an incident, based on its affected service or configuration item?"
  - id: cq7
    text: Which on-call engineer in the resolver group should handle an incident?
  - id: cq8
    text: Does an incident meet the approved criteria and operational prerequisites for major-incident declaration?
  - id: cq9
    text: "Which runbook, workaround, backup set, or recovery plan is applicable to an incident?"
  - id: cq10
    text: "Can the applicable runbook, workaround, backup set, or recovery plan be used safely for the incident?"
  - id: cq11
    text: Could a recent change or deployment be a possible cause of an incident?
  - id: cq12
    text: "Has the incident's materiality been assessed, including its determination and rationale?"
  - id: cq13
    text: Is a regulatory notification required for the incident under the applicable procedure?
  - id: cq14
    text: "Is the incident's evidence intact?"
  - id: cq15
    text: Have the necessary stakeholders been informed about the incident?
  - id: cq16
    text: Are the conditions for closing the incident met?
  - id: cq17
    text: Are there open corrective actions from earlier post-incident reviews of incidents affecting the service?
  - id: cq18
    text: Who owns an affected business service?
  - id: cq19
    text: When is a required regulatory notification due under the applicable procedure?
  - id: cq20
    text: Which configuration items are recorded as affected by the incident?
classes:
  Incident:
    meaning: "A managed record of an unplanned interruption, degradation, or security condition."
    aliases:
      - incidens
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - severity 1 — critical
          - severity 2 — high
          - severity 3 — medium
          - severity 4 — low
      majorIncidentFlag:
        type: boolean
      declarationTime:
        type: date
      detectedAt:
        type: date
      openedAt:
        type: date
      closedAt:
        type: date
  BusinessService:
    meaning: A customer- or business-facing capability whose impact needs to be established.
    aliases:
      - üzleti szolgáltatás
    properties:
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially unavailable
          - unavailable
          - recovering
          - unknown
  ITService:
    meaning: "A managed technology capability on which a business service depends, whose dependencies and restoration are managed."
    aliases:
      - informatikai szolgáltatás
    properties:
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially unavailable
          - unavailable
          - recovering
          - unknown
  CustomerChannel:
    meaning: A means by which customers access a business service.
    aliases:
      - ügyfélcsatorna
    properties: {}
  ConfigurationItem:
    meaning: "A managed component that can be associated with an incident, modified through a change, or protected by a backup set."
    aliases:
      - CI
      - konfigurációs elem
    properties: {}
  ThirdPartyService:
    meaning: "An external service on which an IT service depends, distinct from the vendor providing it."
    aliases:
      - külső szolgáltatás
    properties: {}
  Application:
    meaning: "A distinct application implementing an IT service, deployed through a deployment, and able to use other components."
    aliases:
      - alkalmazás
      - app
    properties: {}
  Environment:
    meaning: "An operating context where a service is deployed, configuration items belong, or a deployment or recovery is targeted."
    aliases:
      - deployment environment
      - környezet
    properties:
      environmentType:
        type: text
        allowed:
          - production
          - disaster recovery
          - pre-production
          - test
          - development
          - management
  ServiceOwner:
    meaning: The person accountable for an IT service across its lifecycle.
    aliases:
      - IT service owner
      - szolgáltatásgazda
    properties: {}
  BusinessOwner:
    meaning: The person accountable for a business service.
    aliases:
      - üzleti gazda
    properties: {}
  ResolverGroup:
    meaning: A group supporting an affected service or configuration item to which an incident can be assigned.
    aliases:
      - megoldócsoport
      - support group
    properties: {}
  OnCallEngineer:
    meaning: A person in a resolver group who may handle time-critical incident work.
    aliases:
      - ügyeletes mérnök
      - on-call
    properties: {}
  Event:
    meaning: A time-stamped occurrence or state change that can be observed during an investigation.
    aliases:
      - observed event
      - esemény
    properties:
      observedAt:
        type: date
  Alert:
    meaning: A signal requiring triage or acknowledgement that may indicate an event or lead to an incident.
    aliases:
      - riasztás
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      raisedAt:
        type: date
  Change:
    meaning: "A controlled modification that may affect a service, including an emergency change linked to an active incident."
    aliases:
      - változás
      - módosítás
    properties:
      plannedStart:
        type: date
      plannedEnd:
        type: date
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled back
          - closed
          - cancelled
      implementationPlan:
        type: text
      backoutPlan:
        type: text
      riskLevel:
        type: text
        allowed:
          - low
          - medium
          - high
          - critical
  Deployment:
    meaning: The technical execution that installs or activates a change or release.
    aliases:
      - telepítés
    properties:
      startedAt:
        type: date
      completedAt:
        type: date
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled back
          - cancelled
  Runbook:
    meaning: "A maintained procedure for diagnosis, response, recovery, or verification."
    aliases:
      - üzemeltetési eljárás
      - playbook
    properties: {}
  Workaround:
    meaning: "A temporary means of reducing or bypassing an incident's impact, distinct from a procedure."
    aliases:
      - kerülőmegoldás
    properties: {}
  BackupSet:
    meaning: "A defined collection protecting identified configuration items whose backup may be scheduled, running, or completed, but is usable for restoration only when verified eligible."
    aliases:
      - mentéskészlet
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      lastSuccessfulBackup:
        type: date
      lastVerification:
        type: date
  RecoveryPlan:
    meaning: A plan for restoring an IT service and its dependencies.
    aliases:
      - helyreállítási terv
      - DR plan
    properties:
      recoveryTimeObjective:
        type: number
      recoveryPointObjective:
        type: number
      lastReviewDate:
        type: date
  MaterialityAssessment:
    meaning: "A record of an incident's significance, determination, rationale, and any reporting due time under approved procedure."
    aliases:
      - lényegességi értékelés
      - reportability assessment
    properties:
      assessedAt:
        type: date
      result:
        type: text
        allowed:
          - not reportable
          - potentially reportable
          - reportable
          - undetermined
      rationale:
        type: text
      reportingDueTime:
        type: date
  RegulatoryNotification:
    meaning: "A formal submission about an incident to a regulator, with its own approval, submission status, due time, and supporting evidence."
    aliases:
      - felügyeleti bejelentés
      - supervisory notification
    properties:
      dueAt:
        type: date
      submittedAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  Regulator:
    meaning: The receiving regulatory body for a regulatory notification.
    aliases:
      - felügyeleti hatóság
      - supervisory authority
    properties: {}
  EvidenceItem:
    meaning: A preserved record or artifact whose integrity can be checked and that may support an incident or notification.
    aliases:
      - bizonyíték
      - evidence
    properties:
      collectedAt:
        type: date
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      cryptographicHash:
        type: text
  Stakeholder:
    meaning: An intended recipient or affected party for an incident communication.
    aliases:
      - érintett
    properties: {}
  Communication:
    meaning: "A particular message addressed to an audience, including a stakeholder, vendor, or regulator."
    aliases:
      - stakeholder communication
      - értesítés
      - tájékoztatás
    properties:
      audience:
        type: text
      messageSummary:
        type: text
      status:
        type: text
        allowed:
          - draft
          - pending approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      sentAt:
        type: date
  PostIncidentReview:
    meaning: A record examining an earlier incident that may produce tracked corrective actions.
    aliases:
      - PIR
      - incidens utóelemzés
      - RCA review
    properties: {}
  CorrectiveAction:
    meaning: "A tracked follow-up from a post-incident review with its own owner, status, and due date."
    aliases:
      - helyesbítő intézkedés
      - remediation action
    properties:
      status:
        type: text
        allowed:
          - open
          - in progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
  IncidentCommander:
    meaning: The person assigned to coordinate a declared major incident.
    aliases:
      - incidensparancsnok
      - incident manager
      - MIM lead
    properties: {}
  InfrastructureComponent:
    meaning: A component identified separately when following the recorded infrastructure on which an IT service or application runs.
    aliases:
      - infrastruktúra-elem
    properties: {}
  Release:
    meaning: A release that implements a change and is delivered through a deployment.
    aliases:
      - kiadás
    properties: {}
  Problem:
    meaning: A problem linked to an incident and documented by a known error when one has been established.
    aliases:
      - probléma
    properties: {}
  KnownError:
    meaning: A diagnosed problem with a documented cause or workaround.
    aliases:
      - ismert hiba
    properties: {}
relationships:
  - name: impactsItservice
    from: Incident
    to: ITService
    meaning: The IT service whose impact is recorded for an incident.
    aliases: []
  - name: impactsBusinessService
    from: Incident
    to: BusinessService
    meaning: The business service whose impact is recorded for an incident rather than inferred from a dependency.
    aliases: []
  - name: dependsOnItservice
    from: BusinessService
    to: ITService
    meaning: "The IT service on which a business service depends, without implying that an incident disrupts it."
    aliases: []
  - name: deliveredThrough
    from: BusinessService
    to: CustomerChannel
    meaning: "The customer channel through which a business service is delivered, without asserting that a particular channel is impacted."
    aliases: []
  - name: dependsOnThirdPartyService
