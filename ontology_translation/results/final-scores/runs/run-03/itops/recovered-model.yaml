    to: InfrastructureComponent
    meaning: The infrastructure component on which an IT service runs.
    aliases: []
  - name: runsOn
    from: Application
    to: InfrastructureComponent
    meaning: The infrastructure component on which an application runs.
    aliases: []
  - name: deployedIn
