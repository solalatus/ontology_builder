rules:
  canDeclareMajorIncident:
    conditions:
      - "Incident status is not resolved, closed, or cancelled and is a known allowed status."
      - Incident severity is severity 1 — critical or severity 2 — high.
      - Incident impacts at least one IT Service via impactsItservice.
      - Incident is coordinatedBy an assigned Incident Commander.
  canAssignIncident:
    conditions:
      - "Incident status is new, acknowledged, investigating, contained, recovering, monitoring, or resolved."
      - Incident impacts an IT Service via impactsItservice or affects a Configuration Item via affectsConfigurationItem.
      - "Verify against the bank's authoritative routing information that the proposed Resolver Group supports at least one such affected IT Service or Configuration Item; if support cannot be verified, do not assign."
  canAcknowledgeAlert:
    conditions:
      - Alert status is new.
      - "Consult the bank's authoritative alert-routing information to establish the responsible Resolver Group, whether or not the Alert has a recorded IT Service or Configuration Item target; if the group cannot be verified, do not acknowledge."
      - "Verify the operator is authorized for that responsible Resolver Group; if authorization cannot be verified, do not acknowledge."
  canContainIncident:
    conditions:
      - Incident status is acknowledged or investigating.
      - Incident is supportedBy an Evidence Item whose recorded contents include containment scope and expected side effects.
      - "Verify from the retained record sequence that scope and expected side effects were recorded before execution; an Evidence Item's collectedAt alone does not establish this order."
  canFailOverService:
    conditions:
      - Incident impacts an IT Service via impactsItservice and the selected Recovery Plan recovers that same IT Service via recovers.
      - Verify the proposed target recovery Environment is available; deployedIn and environmentType alone do not establish availability.
      - Verify the proposed data-recovery point is acceptable; do not compare numeric recoveryPointObjective without an authoritative unit convention.
  canRestoreBackup:
    conditions:
      - Backup Set status is successful or verified.
      - Backup Set protects the proposed target Configuration Item via protects.
      - Verify the proposed restore point is approved; lastSuccessfulBackup alone does not establish approval.
      - Verify the proposed target Environment is approved; environmentType and belongsToEnvironment alone do not establish approval.
  canExecuteEmergencyChange:
    conditions:
      - Verify from authoritative change-management information that the Change is classified as emergency; riskLevel does not prove classification.
      - "Change is justifiedBy an Incident; verify that the linked Incident is active under the bank's governing incident procedure. The procedure's definition of active remains external and is not replaced by the assignment rule's permitted statuses."
      - Change modifies at least one identified Configuration Item via modifies.
      - Change implementationPlan and backoutPlan are both recorded and have been checked.
      - Verify explicit risk acceptance from the governing change process; Change riskLevel alone is not evidence of acceptance.
  canSendCommunication:
    conditions:
      - Communication audience is recorded and verified against its addressedTo Stakeholder for stakeholder messages.
      - Verify that the actual message and its owner are recorded in the governing communication record; messageSummary alone is not the actual message.
      - Communication status is approved.
      - Inspect the actual message against the latest verified state of the linked Incident via communicatedThrough before sending.
  canSubmitRegulatoryNotification:
    conditions:
      - "Regulatory Notification reports an Incident via reports, and that Incident is evaluatedBy a Materiality Assessment whose result is reportable."
      - Regulatory Notification status is approved.
      - Regulatory Notification is sentTo the identified recipient Regulator.
      - "Verify that the notification's required information is complete and its supporting Evidence Items are included via includesEvidence and their content and integrity are checked."
      - Regulatory Notification dueAt is reliably established under the approved reporting procedure and submission is before dueAt; do not calculate a replacement deadline.
  canCloseIncident:
    conditions:
      - Incident status is resolved or monitoring.
      - Every IT Service and Business Service impacted via impactsItservice or impactsBusinessService has a verified healthState of healthy or a verified accepted residual condition; unknown healthState alone is not sufficient.
      - "Incident is supportedBy Evidence Items whose inspected contents document resolution, restoration, and the affected service-health checks."
      - "For every Stakeholder in the Incident's required notification scope via notifies, verify its addressed Communication via communicatedThrough and addressedTo is complete and delivery was checked."
      - "If Incident majorIncidentFlag is true or the incident is verified as cybersecurity under the bank's governing incident procedure, its Post-Incident Review via reviewedIn is scheduled or completed; if that review state cannot be established, do not close."
actions:
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: Set Alert status to acknowledged and record the acknowledgement timestamp in the authoritative alert record.
    verification: Read back the Alert; confirm status is acknowledged and the acknowledgement timestamp is recorded in the authoritative alert record.
  assignIncident:
    input: Incident
    preconditions:
      - canAssignIncident
    effect: Record Incident assignedTo the proposed Resolver Group whose support for an affected IT Service or Configuration Item was externally verified.
    verification: Read the Incident back and confirm assignedTo points to the same Resolver Group whose support was verified; no OnCallEngineer is required.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: "Set Incident majorIncidentFlag to true, record declarationTime, start major-incident coordination and communication cadence, and associate the resulting Communication with the Incident via communicatedThrough as the cadence produces it."
    verification: "Read back the Incident and confirm majorIncidentFlag is true, declarationTime is recorded, coordinatedBy still identifies the same assigned IncidentCommander, and a resulting Communication is associated through communicatedThrough."
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: Execute the approved containment steps and retain their outcome in Evidence Items linked via supportedBy; set Incident status to contained only after containment indicators and remaining impact have been verified.
    verification: "Inspect incident-supported Evidence Items for the pre-action scope and side-effects assessment, recorded sequence, steps taken, containment indicators, and remaining service impact; then read back Incident status and confirm contained only if those checks succeeded."
  failOverService:
    input: Incident
    preconditions:
      - canFailOverService
    effect: "Move the impacted IT Service workload to the externally verified available recovery Environment using the applicable Recovery Plan, retaining the recovery outcome with the Incident via supportedBy Evidence Items."
    verification: "Check the IT Service healthState and critical business transactions in the recovery Environment, inspect the Incident-supported Evidence Items for the observed outcome, and do not infer success merely from recoveredWith or deployedIn links."
  restoreBackup:
    input: BackupSet
    preconditions:
      - canRestoreBackup
    effect: Restore Backup Set data to the Configuration Item identified via protects at the externally approved restore point and target Environment; retain restoration checks in the governing recovery record.
    verification: "Verify restored data integrity; obtain and perform the applicable functionality test specified by the approved restoration procedure or responsible technical team for the protected Configuration Item, retain results, and report a verification gap if the test cannot be established. Do not infer the required test from the protects link."
  executeEmergencyChange:
    input: Change
    preconditions:
      - canExecuteEmergencyChange
    effect: Implement the Change verified externally as emergency using its implementationPlan; update Change status to the observed allowed lifecycle result and retain implementation evidence with its linked Incident via justifiedBy and supportedBy.
    verification: "Read back Change status, inspect retained Incident-supported Evidence Items for technical-check results, and verify healthState of affected IT Services through affectsItservice on the justified Incident or affectsItservice on the Change; do not infer that execution caused or resolved the Incident."
  sendStakeholderCommunication:
    input: Incident
    preconditions:
      - canSendCommunication
    effect: "Send the approved Communication associated with the Incident via communicatedThrough, record Communication sentAt and resulting status, and archive the final message in the governing communication record."
    verification: "Read back Communication sentAt and status, inspect the archived final message, and independently confirm delivery to the addressedTo Stakeholder; neither sentAt nor status alone proves delivery."
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: "Submit the approved Regulatory Notification to its sentTo Regulator for the reports Incident before dueAt, set status to submitted, record submittedAt, and retain the submission receipt in the governing reporting record."
    verification: "Read back status and submittedAt, inspect the retained submission receipt, and separately confirm status accepted or record rejected status with remediation needed; submitted status or receipt alone is not acceptance."
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: Set Incident status to closed and record closedAt after all closure checks pass.
    verification: "Read back Incident status closed and closedAt, recheck healthState or verified accepted residual condition of each impacted IT Service and Business Service via impactsItservice and impactsBusinessService, and confirm supporting Evidence Items remain retained via supportedBy."
