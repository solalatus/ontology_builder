rules:
  loanReadinessRecordLinksPresent:
    conditions:
      - The specified Loan hasBorrower a Borrower.
      - The specified Loan hasLender a Lender.
      - "If the specified Loan hasInterestRate a Fixed Interest Rate or a Variable Interest Rate, it hasInterest an Interest and Interest Payment Terms governsPaymentOf that particular Interest."
  securedLoanCollateralLinkPresent:
    conditions:
      - The specified Loan has first been established as secured from governing records; the source of that classification is unresolved.
      - That specified Loan collateralizedBy Collateral must be confirmed for this check to confirm collateral support.
      - "If the collateralizedBy link is absent, collateral support is not confirmed by this check; no conclusion is drawn about guarantee support."
  variableRateSetupLinksPresent:
    conditions:
      - The specified Loan hasInterestRate a Variable Interest Rate.
      - The specified Loan hasInterestRateResetSchedule an Interest Rate Reset Schedule directly linked to it.
      - "If that schedule link is absent, the variable-rate setup is not confirmed by this check."
  paymentRecordContainsEntries:
    conditions:
      - The specified Loan hasPaymentHistory a Payment History.
      - That same Payment History hasIndividualPayments at least one Individual Payment Transaction.
      - "If the history has no such entries, payment-record completeness is not confirmed and no payment is assumed."
  prepaymentPenaltyTimingPresent:
    conditions:
      - The Prepayment Terms applicable to the specified Loan have first been identified from governing records; their navigable mapping to the Loan remains unresolved.
      - "Where a prepayment penalty applies, those applicable Prepayment Terms have a recorded prepayment penalty term in months."
      - "If applicability cannot be established, this review is unconfirmed, not evidence that the Loan has no prepayment penalty."
  securedLoanReviewApplies:
    conditions:
      - "The specified Loan has independently been established as secured from governing records; the classification source remains unresolved, and a collateralizedBy link alone cannot establish this scope condition."
  variableRateReviewApplies:
    conditions:
      - The specified Loan hasInterestRate a Variable Interest Rate.
actions:
  assessLoanReadiness:
    input: Loan
    preconditions: []
    effect: "Inspect the specified Loan and report whether loanReadinessRecordLinksPresent is satisfied; if any required link is absent, report readiness unconfirmed and change no records."
    verification: "Recheck hasBorrower and hasLender on the Loan and, if it hasInterestRate a Fixed Interest Rate or Variable Interest Rate, its particular hasInterest Interest and Interest Payment Terms whose governsPaymentOf link points to that Interest; report any missing evidence."
  verifySecuredLoanSupport:
    input: Loan
    preconditions:
      - securedLoanReviewApplies
    effect: "Inspect the specified secured Loan and report whether securedLoanCollateralLinkPresent is satisfied; if collateralizedBy Collateral is absent, report collateral support unconfirmed by this check without judging guarantee support or changing records."
    verification: "Recheck the independently established secured scope and that Loan's collateralizedBy link to Collateral; report absence as unconfirmed rather than as proof the Loan is unsecured."
  reviewVariableRateSetup:
    input: Loan
    preconditions:
      - variableRateReviewApplies
    effect: "Inspect the variable-rate Loan and report whether variableRateSetupLinksPresent is satisfied; if hasInterestRateResetSchedule is absent, report setup unconfirmed and change no records."
    verification: "Recheck hasInterestRate to Variable Interest Rate and the same Loan's direct hasInterestRateResetSchedule link to Interest Rate Reset Schedule; report any missing schedule."
  reviewPaymentRecordCompleteness:
    input: Loan
    preconditions: []
    effect: "Inspect the specified Loan and report whether paymentRecordContainsEntries is satisfied; if its history is missing or empty, report completeness unconfirmed and change no records."
    verification: Recheck hasPaymentHistory from that Loan and hasIndividualPayments to at least one Individual Payment Transaction from that same Payment History; do not assume payments from an empty history.
  reviewPrepaymentTerms:
    input: Loan
    preconditions: []
    effect: "Inspect governing records for Prepayment Terms applicable to the specified Loan and report whether prepaymentPenaltyTimingPresent is satisfied where a penalty applies; if applicability or timing cannot be established, report review unconfirmed without concluding there is no penalty or changing records."
    verification: "Confirm the inspected Prepayment Terms apply to the specified Loan using governing records and re-read their prepayment penalty term in months where required; if either cannot be established, report unconfirmed without borrowing timing from unrelated terms."
