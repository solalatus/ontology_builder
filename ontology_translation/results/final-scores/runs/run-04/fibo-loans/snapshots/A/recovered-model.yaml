competency_questions:
  - id: cq1
    text: "Who is the borrower on a given loan, credit facility, or credit agreement?"
  - id: cq2
    text: "Who is the lender on a given loan, credit facility, or credit agreement?"
  - id: cq3
    text: "What is the principal amount of a given loan, or the distinct debt amount of a given credit agreement?"
  - id: cq4
    text: What interest rate applies to the loan?
  - id: cq5
    text: What maturity date applies to a given loan or credit agreement?
  - id: cq6
    text: What terms govern repayment of principal under the applicable credit agreement?
  - id: cq7
    text: What separate terms govern payment of interest under the applicable credit agreement?
  - id: cq8
    text: "Which payment schedules are on file for principal, interest, and amortization?"
  - id: cq9
    text: Is the loan secured?
  - id: cq10
    text: What collateral is linked to the secured loan?
  - id: cq11
    text: What security agreement supports the secured loan?
  - id: cq12
    text: Which servicer is responsible for the loan?
  - id: cq13
    text: "Is the loan's interest rate variable?"
  - id: cq14
    text: "For a variable-rate loan, where is its rate reset schedule?"
  - id: cq15
    text: Does a rate cap apply to the loan?
  - id: cq16
    text: What first-rate-change term applies to the loan?
  - id: cq17
    text: What payment history is on file for the loan?
  - id: cq18
    text: Which individual payments make up that payment history?
  - id: cq19
    text: "For a collateralized loan, what appraised collateral value is being used, and as of what date?"
  - id: cq20
    text: What is the loan-to-value ratio for the collateralized loan?
  - id: cq21
    text: What is the combined loan-to-value ratio for the collateralized loan?
  - id: cq22
    text: "What prepayment terms apply to the loan, including any penalty period?"
  - id: cq23
    text: "Is the loan interest-only, does it permit negative amortization, or does it have a balloon payment?"
  - id: cq24
    text: How much credit is available under the credit facility?
  - id: cq25
    text: "What is the borrower's assessed borrowing capacity?"
classes:
  Loan:
    meaning: A debt under which money or credit has been extended and is to be repaid under its terms.
    aliases: []
    properties:
      principal amount:
        type: number
      maturity date:
        type: date
      interest rate cap:
        type: number
      first rate change term in months:
        type: number
        unit: months
      interest only:
        type: boolean
      negative amortization:
        type: boolean
      balloon payment:
        type: boolean
  Credit Facility:
    meaning: An arrangement that lets the borrower draw credit over time without applying for a new loan for each draw.
    aliases:
      - Master commitment
    properties:
      available amount:
        type: number
  Credit Agreement:
    meaning: "An agreement under which a borrower receives value and generally agrees to repay the creditor, usually with interest."
    aliases: []
    properties:
      debt amount:
        type: number
      maturity date:
        type: date
  Borrower:
    meaning: "The party that owes repayment under the agreement's terms, including applicable interest and fees."
    aliases: []
    properties: {}
  Lender:
    meaning: The party that extends credit.
    aliases: []
    properties: {}
  Servicer:
    meaning: "The party responsible for collecting a loan's principal and interest payments on the lender's behalf."
    aliases: []
    properties: {}
  Principal Repayment Terms:
    meaning: Terms governing payment of principal under a credit agreement.
    aliases: []
    properties: {}
  Interest Payment Terms:
    meaning: Terms governing payment of interest under a credit agreement.
    aliases: []
    properties: {}
  Principal Payment Schedule:
    meaning: "The dates when some or all of a loan's principal is due."
    aliases: []
    properties: {}
  Interest Payment Schedule:
    meaning: The dates when interest on a loan is due.
    aliases: []
    properties: {}
  Amortization Schedule:
    meaning: A schedule of periodic payments and how the debt balance changes over time.
    aliases: []
    properties: {}
  Interest Rate Reset Schedule:
    meaning: "The dates when a loan's rate reset and resulting rate are recalculated."
    aliases: []
    properties: {}
  Payment History:
    meaning: "The loan's record of actual payments."
    aliases: []
    properties: {}
  Individual Payment Transaction:
    meaning: "One actual payment toward the debt, such as principal, interest, or fees, recorded in the loan's payment history."
    aliases:
      - Payment Transaction
      - Individual Payment
    properties: {}
  Collateral:
    meaning: An asset pledged to support a secured loan.
    aliases: []
    properties: {}
  Security Agreement:
    meaning: An agreement granting a non-owner a financial interest in collateral and setting out rights and duties concerning that collateral.
    aliases: []
    properties: {}
  Collateral Value As Of A Date:
    meaning: An appraised value associated with collateral together with its as-of date.
    aliases:
      - Dated Collateral Value
    properties:
      value:
        type: number
      as-of date:
        type: date
  Borrowing Capacity:
    meaning: "An assessment as of a point in time of the upper amount the lender believes the borrower can repay, not a promise to lend that amount."
    aliases: []
    properties:
      amount:
        type: number
  Principal:
    meaning: "The amount of the obligation to be repaid, separate from interest."
    aliases: []
    properties: {}
  Interest:
    meaning: "The cost of using the credit, payable to the creditor, separate from principal."
    aliases: []
    properties: {}
  Fixed Interest Rate:
    meaning: A rate that does not fluctuate over the life of the loan.
    aliases: []
    properties:
      rate:
        type: number
  Variable Interest Rate:
    meaning: A rate that may vary over the life of the loan.
    aliases:
      - Adjustable rate
    properties:
      rate:
        type: number
  Prepayment Terms:
    meaning: "A more specific kind of principal repayment terms concerning repayment before maturity, including any penalty timing."
    aliases: []
    properties:
      prepayment penalty term in months:
        type: number
        unit: months
  Loan-to-Value Ratio:
    meaning: "A separate measure for a collateralized loan comparing that loan's principal with the appraised collateral value."
    aliases: []
    properties:
      ratio:
        type: number
  Combined Loan-to-Value Ratio:
    meaning: A separate measure for a collateralized loan comparing all debt secured by the asset or assets with their appraised value.
    aliases: []
    properties:
      ratio:
        type: number
  Day-Count Convention:
    meaning: The accrual basis used by interest payment terms to count days when calculating accrued interest.
    aliases: []
    properties: {}
