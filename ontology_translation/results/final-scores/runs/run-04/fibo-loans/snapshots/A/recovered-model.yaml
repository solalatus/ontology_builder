    to: Lender
    meaning: The lender financing the loan.
    aliases: []
  - name: hasBorrower
    from: Credit Facility
    to: Borrower
    meaning: The borrower who may draw under the credit facility.
    aliases: []
  - name: hasLender
    from: Credit Facility
    to: Lender
    meaning: The lender providing the credit facility.
    aliases: []
  - name: hasBorrower
    from: Credit Agreement
    to: Borrower
    meaning: The borrower who owes under the credit agreement.
    aliases: []
  - name: hasLender
    from: Credit Agreement
    to: Lender
    meaning: The lender financing the credit agreement.
    aliases: []
  - name: hasPrincipal
