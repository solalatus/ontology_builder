competency_questions:
  - id: cq1
    text: Which air handler serves or feeds this terminal unit?
  - id: cq2
    text: Which air handler feeds this plenum?
  - id: cq3
    text: Which zone does this thermostat serve?
  - id: cq4
    text: Which space does this terminal unit serve?
  - id: cq5
    text: Which floor is this equipment located on?
  - id: cq6
    text: Which space is this equipment located in?
  - id: cq7
    text: Which temperature sensors and setpoints are associated with this air handler?
  - id: cq8
    text: Which temperature setpoint should be checked when measured air temperature is off target?
  - id: cq9
    text: Which outside-air CO2 sensor belongs to this air handling system?
  - id: cq10
    text: Which return-air CO2 sensor belongs to this air handling system?
  - id: cq11
    text: Can this air handling system use economizer operation instead of mechanical cooling?
  - id: cq12
    text: "Which valves, dampers, fans, and filters are part of this air handler?"
  - id: cq13
    text: "If a zone is occupied, is there a serving thermostat or terminal unit available and operating for that zone?"
  - id: cq14
    text: What upstream equipment feeds this terminal unit?
  - id: cq15
    text: What upstream equipment feeds this plenum?
  - id: cq16
    text: "Which heating or cooling device is upstream of this cooling, heating, or heat-pump path?"
  - id: cq17
    text: Which equipment is physically located in this building that could be relevant to the issue?
  - id: cq18
    text: Which equipment is physically located on this floor that could be relevant to the issue?
  - id: cq19
    text: Which equipment is physically located in this space that could be relevant to the issue?
classes:
  AirHandlingUnit:
    meaning: The main air-side unit that moves and conditions air for part of the building.
    aliases:
      - AHU
      - air handler
    properties:
      status:
        type: text
        allowed:
          - "on"
          - "off"
          - alarm
  TerminalUnit:
    meaning: A downstream device that regulates air delivery or conditioning for the area it serves.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - "on"
          - "off"
          - alarm
  AirPlenum:
    meaning: "A section of the air-distribution path that receives air for supply, return, or exhaust movement."
    aliases: []
    properties:
      airflowState:
        type: text
        allowed:
          - supply
          - return
          - exhaust
  Thermostat:
    meaning: The control device that reads temperature and holds a zone to its setpoint.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - normal
          - fault
          - offline
  Zone:
    meaning: "The control area kept together under one temperature-control setup, which may be one space or several spaces."
    aliases: []
    properties:
      occupancyStatus:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  Space:
    meaning: The physical room or area people occupy within the building.
    aliases: []
    properties: {}
  Floor:
    meaning: One level of the building that groups the spaces on that level.
    aliases: []
    properties: {}
  Building:
    meaning: "The overall facility that contains the floors, spaces, zones, and HVAC equipment we operate."
    aliases: []
    properties: {}
  OutsideAirCO2Sensor:
    meaning: A sensor that measures CO2 in the outdoor air being referenced by the air-handling process.
    aliases: []
    properties:
      value:
        type: number
  ReturnAirCO2Sensor:
    meaning: A sensor that measures CO2 in the return air coming back through the air-handling process.
    aliases: []
    properties:
      value:
        type: number
  TemperatureSensor:
    meaning: A sensor that measures temperature for monitoring or control.
    aliases: []
    properties:
      value:
        type: number
      status:
        type: text
  TemperatureSetpoint:
    meaning: "A leftover generic class now superseded by the more specific air, cooling, heating, and deadband setpoint types."
    aliases: []
    properties:
      value:
        type: number
  CoolingValve:
    meaning: A valve that modulates chilled-water flow through a cooling coil to bring air temperature down.
    aliases: []
    properties:
      position:
        type: number
  HeatingValve:
    meaning: A valve that modulates hot-water flow through a heating coil to bring air temperature up.
    aliases: []
    properties:
      position:
        type: number
  Damper:
    meaning: A blade or assembly that regulates or shuts off airflow in the air path.
    aliases: []
    properties:
      position:
        type: number
  Fan:
    meaning: The air-moving component that pushes or pulls air through the system.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - "on"
          - "off"
          - alarm
  Filter:
    meaning: The component that removes particulates or other unwanted material from the air stream.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - clean
          - dirty
          - replacement due
  Boiler:
    meaning: The plant device that provides hot water for heating service.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - "on"
          - "off"
          - alarm
  Chiller:
    meaning: The plant device that provides chilled water for cooling service.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - "on"
          - "off"
          - alarm
  PackagedHeatPump:
    meaning: A self-contained unit that can provide either heating or cooling to the area it serves.
    aliases: []
    properties:
      mode:
        type: text
        allowed:
          - heating
          - cooling
          - "off"
  Economizer:
    meaning: The air-side control feature or assembly that uses suitable conditions to reduce mechanical cooling.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - disabled
          - enabled
          - active
  AirTemperatureSetpoint:
    meaning: The target air temperature the system is trying to maintain.
    aliases: []
    properties:
      value:
        type: number
  CoolingTemperatureSetpoint:
    meaning: The temperature target used to decide when cooling should be applied.
    aliases: []
    properties:
      value:
        type: number
  HeatingTemperatureSetpoint:
    meaning: The temperature target used to decide when heating should be applied.
    aliases: []
    properties:
      value:
        type: number
  TemperatureDeadbandSetpoint:
    meaning: The allowed temperature range around the control target where no heating or cooling change is needed.
    aliases: []
    properties:
      value:
        type: number
