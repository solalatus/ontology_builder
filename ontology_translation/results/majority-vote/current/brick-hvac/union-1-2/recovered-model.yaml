competency_questions:
  - id: cq1
    text: Which air handler feeds a given terminal unit?
  - id: cq2
    text: What upstream equipment feeds a given terminal unit or downstream air plenum?
  - id: cq3
    text: Which temperature sensors and setpoints are associated with a given air handler?
  - id: cq4
    text: Which CO2 sensors on a given air handler are outside-air versus return-air sensors?
  - id: cq5
    text: If an air temperature is off target, which setpoint should be checked first?
  - id: cq6
    text: Which occupancy sensor is tied to a given space or zone?
  - id: cq7
    text: Which spaces are on a given floor, and which floor contains a given space?
  - id: cq8
    text: What HVAC equipment is physically located in a given building, floor, or space?
  - id: cq9
    text: Which dampers, fans, filters, and valves are part of a given air handler?
  - id: cq10
    text: Which zones does a given thermostat serve?
  - id: cq11
    text: Which spaces does a given terminal unit serve?
  - id: cq12
    text: What heating or cooling devices are connected to a given boiler or chiller?
  - id: cq13
    text: When can a given air handler use economizer instead of mechanical cooling?
classes:
  AirHandlingUnit:
    meaning: An air handling unit is the assembly that moves and conditions air for part of the building.
    aliases:
      - AHU
      - air handler
    properties:
      status:
        type: text
        allowed:
          - 'off'
          - 'on'
          - alarm
  AirPlenum:
    meaning: An air plenum is the section or chamber that receives air for distribution or return in the air system.
    aliases:
      - plenum
    properties:
      airflowState:
        type: text
        allowed:
          - supply
          - return
          - exhaust
  Boiler:
    meaning: A boiler is the plant equipment that provides hot water for heating.
    aliases: []
    properties: {}
  Building:
    meaning: A building is the overall physical facility that contains the floors, spaces, and HVAC systems.
    aliases: []
    properties: {}
  Chiller:
    meaning: A chiller is the plant equipment that provides chilled water for cooling.
    aliases: []
    properties: {}
  CO2Sensor:
    meaning: A CO2 sensor is a sensor that measures CO2 concentration in air.
    aliases: []
    properties:
      currentCO2:
        type: number
  CoolingTemperatureSetpoint:
    meaning: A cooling temperature setpoint is the temperature target used when the system is trying to cool.
    aliases:
      - cooling temperature setpoint
    properties:
      targetTemperature:
        type: number
      setpointValue:
        type: number
        unit: degrees C
  CoolingValve:
    meaning: A cooling valve is the valve that modulates chilled-water flow to provide cooling at the coil.
    aliases: []
    properties:
      position:
        type: number
  Damper:
    meaning: A damper is the air-side component that opens, closes, or modulates to control airflow.
    aliases: []
    properties: {}
  DeadbandSetpoint:
    meaning: A deadband setpoint is the setting that defines the allowed temperature range where no heating or cooling change is needed.
    aliases:
      - temperature deadband setpoint
    properties:
      value:
        type: number
        unit: temperature
  Economizer:
    meaning: An economizer is the device or control function that uses suitable air-side conditions to reduce mechanical heating or cooling.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - disabled
          - enabled
          - active
  Fan:
    meaning: A fan is the component that moves air through the HVAC system.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - 'off'
          - 'on'
          - alarm
  Filter:
    meaning: A filter is the component that removes particulates or other unwanted material from the airstream.
    aliases: []
    properties:
      filterCondition:
        type: text
        allowed:
          - clean
          - dirty
          - replacement due
  Floor:
    meaning: A floor is one building level that groups a set of spaces.
    aliases: []
    properties: {}
  HeatingTemperatureSetpoint:
    meaning: A heating temperature setpoint is the temperature target used when the system is trying to heat.
    aliases:
      - heating temperature setpoint
    properties:
      targetTemperature:
        type: number
      setpointValue:
        type: number
        unit: degrees C
  HeatingValve:
    meaning: A heating valve is the valve that modulates hot-water flow to provide heating at the coil.
    aliases: []
    properties:
      position:
        type: number
  OccupancySensor:
    meaning: An occupancy sensor is a sensor that detects whether a space or area is occupied.
    aliases: []
    properties: {}
  OutsideAirCO2Sensor:
    meaning: An outside air CO2 sensor is a CO2 sensor that measures the outside-air stream.
    aliases:
      - outside air CO2 sensor
    properties:
      currentCO2:
        type: number
      sensorValue:
        type: number
        unit: ppm
  ReturnAirCO2Sensor:
    meaning: A return air CO2 sensor is a CO2 sensor that measures the return-air stream.
    aliases:
      - return air CO2 sensor
    properties:
      currentCO2:
        type: number
      sensorValue:
        type: number
        unit: ppm
  Space:
    meaning: A space is a room or other bounded area within the building.
    aliases: []
    properties: {}
  TemperatureSensor:
    meaning: A temperature sensor is a sensor that measures temperature.
    aliases: []
    properties:
      currentTemperature:
        type: number
      sensorValue:
        type: number
        unit: degrees C
  TemperatureSetpoint:
    meaning: A temperature setpoint is the desired temperature target used for control.
    aliases: []
    properties:
      targetTemperature:
        type: number
      setpointValue:
        type: number
        unit: degrees C
  TerminalUnit:
    meaning: A terminal unit is the downstream device that regulates airflow or delivered conditioning for the area it serves.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - 'off'
          - 'on'
          - alarm
  Thermostat:
    meaning: A thermostat is the control device that monitors temperature and holds a space or zone to its setpoint.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - normal
          - fault
          - offline
  Zone:
    meaning: A zone is a separately controlled area, or group of spaces, that is maintained by one control point or device.
    aliases: []
    properties:
      occupancyState:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  AirTemperatureSensor:
    meaning: A sensor that measures the temperature of air.
    aliases: []
    properties:
      sensorValue:
        type: number
        unit: degrees C
  AirTemperatureSetpoint:
    meaning: The target air temperature the control sequence is trying to maintain.
    aliases: []
    properties: {}
  CondensingUnit:
    meaning: An outdoor refrigeration component that rejects heat as part of a smaller packaged or direct-expansion system.
    aliases: []
    properties: {}
  CoolingTower:
    meaning: A heat-rejection device used to dump unwanted heat from the cooling side to the atmosphere.
    aliases: []
    properties: {}
  HeatExchanger:
    meaning: A device that transfers heat between two fluid paths without mixing them.
    aliases: []
    properties: {}
  Humidifier:
    meaning: A device that adds moisture to the air.
    aliases: []
    properties: {}
  IsolationValve:
    meaning: null
    aliases: []
    properties: {}
  PackagedHeatPump:
    meaning: A self-contained unit that can provide both heating and cooling to a served area.
    aliases: []
    properties: {}
  Pump:
    meaning: A device that moves water through the heating or cooling loop.
    aliases: []
    properties: {}
  SpaceHeater:
    meaning: A local heater used to warm a specific room or area.
    aliases: []
    properties: {}
  WaterTemperatureSensor:
    meaning: A sensor that measures the temperature of water.
    aliases: []
    properties: {}
