competency_questions:
  - id: cq1
    text: Which business services are impacted by this incident?
  - id: cq2
    text: Which customer channels are impacted by this incident?
  - id: cq3
    text: Which configuration items sit on the dependency path for the affected IT service?
  - id: cq4
    text: Which external dependencies sit on the dependency path for the affected IT service?
  - id: cq5
    text: Which active alerts are correlated with this incident?
  - id: cq6
    text: Which active events are correlated with this incident?
  - id: cq7
    text: Who owns the affected service?
  - id: cq8
    text: Which resolver group should handle the incident?
  - id: cq9
    text: Which on-call engineer should handle the incident?
  - id: cq10
    text: Does this incident meet the criteria to be treated as a major incident?
  - id: cq11
    text: Which runbook is appropriate and safe to use for this incident?
  - id: cq12
    text: Which workaround is appropriate and safe to use for this incident?
  - id: cq13
    text: Which backup set is appropriate and safe to use for this incident?
  - id: cq14
    text: Which recovery plan is appropriate and safe to use for this incident?
  - id: cq15
    text: Was this incident likely caused by a recent change?
  - id: cq16
    text: Was this incident likely caused by a recent deployment?
  - id: cq17
    text: Has a materiality assessment been completed?
  - id: cq18
    text: Do we need to prepare a regulatory notification for this incident?
  - id: cq19
    text: Do we need to send a regulatory notification for this incident?
  - id: cq20
    text: Are the required evidence items complete for this incident?
  - id: cq21
    text: Are the required stakeholder communications complete for this incident?
  - id: cq22
    text: Are the required closure conditions complete for this incident?
  - id: cq23
    text: Which corrective actions from earlier post-incident reviews are still open for the affected service?
classes:
  Alert:
    meaning: A monitoring or security signal that requires triage or acknowledgement.
    aliases: []
    properties:
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      summary:
        type: text
      acknowledgedAt:
        type: date
      raisedAt:
        type: date
      alertIdentifier:
        type: text
  Application:
    meaning: A software system that implements business or operational functionality.
    aliases: []
    properties:
      name:
        type: text
  BackupSet:
    meaning: A defined collection of recoverable backup data for protected components.
    aliases: []
    properties:
      lastSuccessfulBackup:
        type: date
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      backupIdentifier:
        type: text
  BusinessService:
    meaning: A customer-facing or business-facing capability delivered by the bank.
    aliases: []
    properties:
      criticalityTier:
        type: text
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      serviceIdentifier:
        type: text
      serviceName:
        type: text
  Change:
    meaning: A controlled addition, modification, or removal that may affect an IT service.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      changeIdentifier:
        type: text
      emergencyClassification:
        type: text
        allowed:
          - emergency
          - standard
      plannedEnd:
        type: date
      plannedStart:
        type: date
  Communication:
    meaning: A controlled message sent to operational, business, customer, vendor, or regulatory audiences.
    aliases:
      - notification
    properties:
      messageSummary:
        type: text
      sentAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      audience:
        type: text
        allowed:
          - technical
          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
  ConfigurationItem:
    meaning: A managed component that sits within configuration-management scope and matters for operation, support, or recovery.
    aliases:
      - CI
    properties:
      configurationItemType:
        type: text
      name:
        type: text
  CustomerChannel:
    meaning: A channel through which customers access banking services.
    aliases: []
    properties: {}
  Deployment:
    meaning: The technical execution that installs or activates a release or change.
    aliases: []
    properties:
      completedAt:
        type: date
      startedAt:
        type: date
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
      deploymentIdentifier:
        type: text
  Environment:
    meaning: A deployment context such as production, test, development, or disaster recovery.
    aliases: []
    properties:
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
  Event:
    meaning: A time-stamped observation of a state change or other notable occurrence.
    aliases: []
    properties: {}
  EvidenceItem:
    meaning: A preserved record, artifact, or observation that supports incident analysis and accountability.
    aliases: []
    properties:
      collectedAt:
        type: date
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      evidenceIdentifier:
        type: text
  Incident:
    meaning: An unplanned interruption, degradation, or security condition that requires managed response.
    aliases: []
    properties:
      closedAt:
        type: date
      detectedAt:
        type: date
      incidentIdentifier:
        type: text
      majorIncidentFlag:
        type: boolean
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      summary:
        type: text
      acceptedResidualCondition:
        type: boolean
      cybersecurityIncidentFlag:
        type: boolean
      majorIncidentDeclaredAt:
        type: date
      openedAt:
        type: date
      acknowledgementTime:
        type: date
      detectionSource:
        type: text
      resolvedTime:
        type: date
  IncidentCommander:
    meaning: The person accountable for command, coordination, and decision cadence during a major incident.
    aliases: []
    properties: {}
  ITService:
    meaning: A managed technology capability that supports one or more business services.
    aliases: []
    properties:
      criticality:
        type: text
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      serviceName:
        type: text
      serviceIdentifier:
        type: text
  KnownError:
    meaning: A diagnosed problem with a documented cause or workaround.
    aliases: []
    properties:
      diagnosedCause:
        type: text
      workaroundSummary:
        type: text
      knownErrorIdentifier:
        type: text
  MaterialityAssessment:
    meaning: A documented determination of incident significance and reporting implications.
    aliases: []
    properties:
      assessedAt:
        type: date
      result:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
  OnCallEngineer:
    meaning: A technical specialist available for time-critical operational response.
    aliases: []
    properties:
      name:
        type: text
  Problem:
    meaning: The underlying cause, or potential underlying cause, of one or more incidents.
    aliases: []
    properties:
      status:
        type: text
      problemIdentifier:
        type: text
      summary:
        type: text
  RecoveryPlan:
    meaning: A documented plan for restoring an IT service and its dependencies.
    aliases: []
    properties:
      recoveryPointObjective:
        type: text
      recoveryTimeObjective:
        type: text
      lastReviewDate:
        type: date
      planIdentifier:
        type: text
  Regulator:
    meaning: A competent authority that supervises the bank or receives required notifications.
    aliases: []
    properties:
      regulatorName:
        type: text
  RegulatoryNotification:
    meaning: A formal incident-related submission to a competent authority.
    aliases: []
    properties:
      dueTime:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submittedAt:
        type: date
      notificationIdentifier:
        type: text
  Release:
    meaning: A governed package of approved changes introduced together.
    aliases: []
    properties:
      version:
        type: text
  ResolverGroup:
    meaning: The team assigned to diagnose and restore issues in a specific technology or service area.
    aliases:
      - support group
    properties:
      name:
        type: text
  Runbook:
    meaning: A maintained operational procedure used for diagnosis, response, recovery, or verification.
    aliases: []
    properties:
      name:
        type: text
      runbookIdentifier:
        type: text
  ServiceOwner:
    meaning: The role accountable for an IT service across its lifecycle.
    aliases: []
    properties: {}
  ThirdPartyService:
    meaning: An externally provided service that the bank depends on.
    aliases: []
    properties:
      criticalityTier:
        type: text
  Vendor:
    meaning: An external organization that supplies or supports technology or services.
    aliases:
      - supplier
    properties:
      criticalityTier:
        type: text
      legalName:
        type: text
      criticalProvider:
        type: boolean
  Workaround:
    meaning: A temporary method that reduces or bypasses the impact of an incident or problem.
    aliases: []
    properties:
      summary:
        type: text
      workaroundIdentifier:
        type: text
  CloudService:
    meaning: A technology capability consumed from an external or group cloud provider.
    aliases: []
    properties: {}
  CorrectiveAction:
    meaning: A tracked action intended to remove a cause, reduce risk, or improve response capability.
    aliases: []
    properties:
      dueDate:
        type: date
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
  CybersecurityIncident:
    meaning: An incident caused by or involving malicious, unauthorized, or otherwise security-relevant activity.
    aliases: []
    properties: {}
  EmergencyChange:
    meaning: A change processed under an accelerated path to address an urgent operational need.
    aliases: []
    properties: {}
  InfrastructureComponent:
    meaning: null
    aliases: []
    properties: {}
  PostIncidentReview:
    meaning: A structured review of causes, response effectiveness, lessons learned, and follow-up work after an incident.
    aliases: []
    properties:
      heldOn:
        type: date
  SecurityEvent:
    meaning: An event relevant to confidentiality, integrity, availability, authenticity, or cyber-threat activity.
    aliases: []
    properties: {}
  ApplicationOwner:
    meaning: An application owner is the role accountable for an application and its operational fitness.
    aliases: []
    properties: {}
  BusinessOwner:
    meaning: A business owner is the business role accountable for a business service.
    aliases: []
    properties: {}
  DataCentre:
    meaning: A data centre is a facility that hosts managed technology infrastructure.
    aliases: []
    properties: {}
  Server:
    meaning: A server is a physical compute host that provides processing capacity.
    aliases: []
    properties:
      name:
        type: text
  Site:
    meaning: A site is a physical bank, supplier, or hosting location.
    aliases: []
    properties:
      locationName:
        type: text
  Stakeholder:
    meaning: A stakeholder is a person, group, or organization affected by or responsible for an operational outcome.
    aliases: []
    properties:
      name:
        type: text
  TechnicalOwner:
    meaning: A technical owner is the role accountable for the engineering and maintenance of a configuration item.
    aliases: []
    properties: {}
