competency_questions:
  - id: cq1
    text: Which air handler serves a given terminal unit?
  - id: cq2
    text: Which air handler serves a given plenum?
  - id: cq3
    text: Which air temperature sensors are tied to a given air handler?
  - id: cq4
    text: Which air temperature and control setpoints are tied to a given air handler?
  - id: cq5
    text: What HVAC equipment is physically located in a given building?
  - id: cq6
    text: What HVAC equipment is physically located on a given floor?
  - id: cq7
    text: What HVAC equipment is physically located in a given space?
  - id: cq8
    text: Which spaces are on a given floor?
  - id: cq9
    text: Which floors are in a given building?
  - id: cq10
    text: Which CO2 sensors measure outside air for a given air-handling system?
  - id: cq11
    text: Which CO2 sensors measure return air for a given air-handling system?
  - id: cq12
    text: What equipment is upstream of a given terminal unit?
  - id: cq13
    text: What equipment is upstream of a given plenum?
  - id: cq14
    text: If air temperature is off target, which setpoint should be checked?
  - id: cq15
    text: Which occupancy sensor is tied to a given space?
  - id: cq16
    text: Which occupancy sensor is tied to a given zone?
  - id: cq17
    text: Which cooling valves are part of a given air handler?
  - id: cq18
    text: Which heating valves are part of a given air handler?
  - id: cq19
    text: Which dampers are part of a given air handler?
  - id: cq20
    text: Which fans are part of a given air handler?
  - id: cq21
    text: Which filters are part of a given air handler?
  - id: cq22
    text: Which zones are served by a given thermostat?
  - id: cq23
    text: Which spaces are served by a given terminal unit?
  - id: cq24
    text: Which cooling devices are connected upstream of the cooling equipment being checked?
  - id: cq25
    text: Which heating devices are connected upstream of the heating equipment being checked?
  - id: cq26
    text: Under what conditions can the economizer be used instead of mechanical cooling?
classes:
  AirHandlingUnit:
    meaning: A piece of HVAC equipment that moves and conditions air for distribution through the building.
    aliases:
      - AHU
      - air handler
      - air handling unit
    properties:
      economizerStatus:
        type: text
        allowed:
          - disabled
          - enabled
          - active
  AirPlenum:
    meaning: A section of the air-distribution path that receives air for supply, return, or exhaust.
    aliases:
      - air plenum
      - plenum
    properties: {}
  Boiler:
    meaning: Plant equipment that provides hot water for heating.
    aliases:
      - boiler
    properties: {}
  Building:
    meaning: The overall facility that contains the floors, spaces, zones, and HVAC equipment we manage.
    aliases:
      - building
    properties: {}
  Chiller:
    meaning: Plant equipment that provides chilled water for cooling.
    aliases:
      - chiller
    properties: {}
  CoolingValve:
    meaning: A valve that controls cooling by adjusting cold-water flow through a coil.
    aliases:
      - cooling valve
    properties: {}
  Damper:
    meaning: A device that regulates or shuts off airflow in the air path.
    aliases:
      - damper
    properties: {}
  Fan:
    meaning: The part that moves air through the HVAC system.
    aliases:
      - fan
    properties: {}
  Filter:
    meaning: The part that removes unwanted material from the airstream.
    aliases:
      - filter
    properties: {}
  Floor:
    meaning: One level of the building that groups the spaces on that level.
    aliases:
      - floor
    properties: {}
  HeatingValve:
    meaning: A valve that controls heating by adjusting hot-water flow through a coil.
    aliases:
      - heating valve
    properties: {}
  OutsideAirCO2Sensor:
    meaning: A sensor that measures CO2 level in outside air.
    aliases:
      - outside-air CO2 sensor
    properties:
      value:
        type: number
  PackagedHeatPump:
    meaning: A self-contained unit that can provide both heating and cooling.
    aliases:
      - packaged heat pump
    properties: {}
  ReturnAirCO2Sensor:
    meaning: A sensor that measures CO2 level in return air coming back through the system.
    aliases:
      - return-air CO2 sensor
    properties:
      value:
        type: number
  Space:
    meaning: A physical room or defined area within the building.
    aliases:
      - space
    properties: {}
  TemperatureSetpoint:
    meaning: The target temperature value the control system uses for heating, cooling, air temperature control, or deadband logic.
    aliases:
      - temperature setpoint
      - control setpoint
    properties: {}
  TerminalUnit:
    meaning: A downstream device that regulates airflow or air temperature for the area it serves.
    aliases:
      - terminal unit
    properties: {}
  Thermostat:
    meaning: The control device that reads temperature and maintains the desired setpoint for a served zone.
    aliases:
      - thermostat
    properties:
      status:
        type: text
        allowed:
          - normal
          - fault
          - offline
  Zone:
    meaning: An area, or group of spaces, controlled together to maintain the same comfort conditions.
    aliases: []
    properties:
      occupancyStatus:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
relationships:
  - name: feeds
    from: AirHandlingUnit
    to: TerminalUnit
    meaning: The source equipment is upstream and supplies air, heating, or cooling to the downstream thing.
    aliases:
      - is upstream of
      - supplies
  - name: feeds
    from: AirHandlingUnit
    to: AirPlenum
    meaning: The source equipment is upstream and supplies air, heating, or cooling to the downstream thing.
    aliases:
      - is upstream of
      - supplies
  - name: hasPoint
    from: AirHandlingUnit
    to: OutsideAirCO2Sensor
    meaning: The equipment or area has a sensor or setpoint tied to it for monitoring or control.
    aliases:
      - is tied to
  - name: hasPoint
    from: AirHandlingUnit
    to: ReturnAirCO2Sensor
    meaning: The equipment or area has a sensor or setpoint tied to it for monitoring or control.
    aliases:
      - is tied to
  - name: feeds
    from: Chiller
    to: CoolingValve
    meaning: The source equipment is upstream and supplies air, heating, or cooling to the downstream thing.
    aliases:
      - is upstream of
      - supplies
  - name: feeds
    from: Boiler
    to: HeatingValve
    meaning: The source equipment is upstream and supplies air, heating, or cooling to the downstream thing.
    aliases:
      - is upstream of
      - supplies
  - name: feeds
    from: PackagedHeatPump
    to: TerminalUnit
    meaning: The source equipment is upstream and supplies air, heating, or cooling to the downstream thing.
    aliases:
      - is upstream of
      - supplies
  - name: serves
    from: TerminalUnit
    to: Space
    meaning: The equipment or device is responsible for conditioning or controlling the area it is assigned to.
    aliases:
      - conditions
  - name: serves
    from: Thermostat
    to: Zone
    meaning: The equipment or device is responsible for conditioning or controlling the area it is assigned to.
    aliases:
      - controls
  - name: contains
    from: Floor
    to: Space
    meaning: The larger physical area includes the smaller area as part of its layout.
    aliases:
      - has
  - name: contains
    from: Building
    to: Floor
    meaning: The larger physical area includes the smaller area as part of its layout.
    aliases:
      - has
rules:
  canVerifyActiveControlAvailable:
    conditions:
      - a zone is occupied
      - a thermostat serves that zone
actions:
  enableEconomizerOperation:
    input: AirHandlingUnit
    preconditions: []
    effect: The air handling unit economizer status indicates economizer operation so the unit reduces mechanical cooling.
    verification: Confirm the air handling unit economizer status is enabled or active.
  increaseCooling:
    input: AirHandlingUnit
    preconditions: []
    effect: Increase cooling for the air handling unit.
    verification: Confirm measured air temperature moves toward the applicable cooling temperature setpoint.
  increaseHeating:
    input: AirHandlingUnit
    preconditions: []
    effect: Increase heating for the air handling unit.
    verification: Confirm measured air temperature moves toward the applicable heating temperature setpoint.
