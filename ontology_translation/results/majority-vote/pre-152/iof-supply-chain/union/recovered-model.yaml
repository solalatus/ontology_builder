competency_questions:
  - id: cq1
    text: Which shipment is currently being prepared from this ship-from location to this ship-to location?
  - id: cq2
    text: Which carrier is responsible for this transport move?
  - id: cq3
    text: For this shipment, what traceable unit should we be following?
  - id: cq4
    text: Where does this transport start in the network?
  - id: cq5
    text: Where does this transport end in the network?
  - id: cq6
    text: At which facility is the receiving work happening?
  - id: cq7
    text: At which facility is the storage work happening?
  - id: cq8
    text: At which facility is the shipment preparation work happening?
  - id: cq9
    text: Which freight forwarder is involved in this freight forwarding service or activity?
  - id: cq10
    text: Which material item is tied to this purchase order?
  - id: cq11
    text: Which material item is tied to this shipment?
  - id: cq12
    text: Which supplier is supplying a given customer for this item?
  - id: cq13
    text: For this shipment being prepared, which carrier is responsible?
  - id: cq14
    text: Is the right traceable unit identified for this shipment before we move or receive it?
  - id: cq15
    text: Do we know the correct origin and destination points for this transport?
  - id: cq16
    text: Is the receiving activity happening at the correct facility?
  - id: cq17
    text: Is the shipment preparation activity happening at the correct facility?
  - id: cq18
    text: Has the right freight forwarding party been identified where forwarding is being used?
  - id: cq19
    text: Is the purchase order tied to the correct material item?
  - id: cq20
    text: Is the shipment tied to the correct material item?
classes:
  Carrier:
    meaning: A supplier that carries or transports shipments.
    aliases: []
    properties: {}
  Customer:
    meaning: A trading partner that receives supplied goods or services in a supply chain.
    aliases: []
    properties: {}
  Facility:
    meaning: A physical facility used in supply-chain operations.
    aliases: []
    properties: {}
  FreightForwarder:
    meaning: An agent that arranges freight forwarding activities and services.
    aliases: []
    properties:
      status:
        type: text
  FreightForwardingService:
    meaning: A service that provides freight forwarding capability.
    aliases: []
    properties: {}
  Lot:
    meaning: A traceable production or supply lot used for batch-level control.
    aliases: []
    properties: {}
  MaterialTradeItem:
    meaning: A material item represented as a tradable item in supply-chain operations.
    aliases:
      - material item
    properties: {}
  PurchaseOrder:
    meaning: An agreement that requests or authorizes supply of goods or services.
    aliases:
      - order
    properties: {}
  ReceivingProcess:
    meaning: The business process that receives incoming goods or shipments.
    aliases:
      - receiving activity
    properties: {}
  Shipment:
    meaning: A traceable unit of goods being prepared, moved, or received through the supply chain.
    aliases: []
    properties: {}
  ShipmentPreparationProcess:
    meaning: The process that gets a shipment ready for dispatch.
    aliases:
      - shipment preparation activity
    properties: {}
  StorageFacility:
    meaning: A facility used to store goods or traceable units.
    aliases: []
    properties: {}
  StorageProcess:
    meaning: A planned process that stores goods or traceable units.
    aliases: []
    properties: {}
  Supplier:
    meaning: A trading partner that supplies goods or services in a supply chain.
    aliases: []
    properties: {}
  SupplyChainNode:
    meaning: A point in the supply chain used as an origin, destination, or operating point.
    aliases: []
    properties: {}
  SupplyRelationship:
    meaning: A supply dependency connecting supplier, customer, and product context.
    aliases: []
    properties: {}
  TrackingEvent:
    meaning: An event recorded to track movement, handling, or state changes of traceable units.
    aliases: []
    properties:
      eventTime:
        type: date
      eventType:
        type: text
        allowed:
          - packed
          - shipped
          - arrived
          - received
          - stored
  TransportationService:
    meaning: The service that provides transportation capability for supply-chain movement.
    aliases: []
    properties: {}
  TransportProcess:
    meaning: The movement process that changes the location of goods.
    aliases: []
    properties: {}
  Load:
    meaning: A traceable load unit prepared for handling or transport.
    aliases: []
    properties: {}
  LogisticUnit:
    meaning: A traceable logistics handling unit used in storage and transport.
    aliases: []
    properties: {}
  ShipFromLocation:
    meaning: A location from which a shipment is sent.
    aliases: []
    properties: {}
  ShipToLocation:
    meaning: A location to which a shipment is sent.
    aliases: []
    properties: {}
  Sublot:
    meaning: A traceable subdivision of a lot.
    aliases: []
    properties: {}
  TraceableResourceUnit:
    meaning: A material unit that can be traced through supply-chain activities.
    aliases: []
    properties: {}
  ConsigningProcess:
    meaning: A consigning process is a business process in which goods are consigned for shipment.
    aliases: []
    properties: {}
  Shipper:
    meaning: A shipper is the consignor that sends or consigns a shipment.
    aliases: []
    properties: {}
  Container:
    meaning: A container is a material artifact used to hold or transport goods.
    aliases: []
    properties: {}
  InventoryManagementProcess:
    meaning: An inventory management process is a business process that manages inventory.
    aliases: []
    properties: {}
  Consignee:
    meaning: The agent designated to receive a shipment.
    aliases: []
    properties: {}
  Location:
    meaning: A geospatially identified location relevant to supply-chain operations.
    aliases: []
    properties: {}
