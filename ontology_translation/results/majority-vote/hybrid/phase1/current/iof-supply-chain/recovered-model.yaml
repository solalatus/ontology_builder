    to: FreightForwarder
    meaning: The freight forwarding service involves the freight forwarder.
    aliases: []
  - name: hasAgent
    from: TransportationService
    to: Carrier
    meaning: The transportation service involves the carrier.
    aliases: []
  - name: dependsOnProduct
    from: SupplyRelationship
    to: MaterialTradeItem
    meaning: The supply relationship depends on the material trade item being supplied.
    aliases: []
  - name: concernsItem
    from: PurchaseOrder
    to: MaterialTradeItem
    meaning: The purchase order concerns the material trade item being requested or authorized.
    aliases: []
  - name: concernsItem
    from: Shipment
    to: MaterialTradeItem
    meaning: The shipment concerns the material trade item being moved.
    aliases: []
  - name: fulfillsOrder
    from: Shipment
    to: PurchaseOrder
    meaning: The shipment fulfills the purchase order.
    aliases: []
  - name: hasAgent
    from: ShipmentPreparation
    to: Carrier
    meaning: The shipment preparation process involves the carrier.
    aliases: []
  - name: occursAt
    from: ReceivingProcess
    to: Facility
    meaning: The receiving process occurs at the facility.
    aliases: []
  - name: occursAt
