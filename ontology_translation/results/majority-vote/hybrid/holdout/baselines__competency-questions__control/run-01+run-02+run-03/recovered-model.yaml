competency_questions: []
classes:
  EvidenceItem:
    meaning: A record or artifact collected during an incident investigation that supports analysis, accountability, and compliance.
    aliases:
      - evidence
      - proof
    properties:
      evidenceStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      storageLocation:
        type: text
      collectedAt:
        type: date
      evidenceId:
        type: text
      evidenceType:
        type: text
        allowed:
          - document
          - log
          - screenshot
          - data-sample
      integrityValidated:
        type: boolean
      evidenceType2:
        type: text
        allowed:
          - document
          - screenshot
          - log
          - recording
      recordedAt:
        type: date
  Incident:
    meaning: An unplanned interruption or degradation of an IT service that requires managed response to restore normal operations.
    aliases:
      - ticket
      - issue
    properties:
      acknowledgedAt:
        type: date
      containmentMeasures:
        type: text
      priorityLevel:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      severityLevel:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      incidentId:
        type: text
      detectedAt:
        type: date
      impactLevel:
        type: text
        allowed:
          - enterprise-wide
          - multiple-services
          - single-service
          - limited-users
          - no-observed-impact
      businessImpactSummary:
        type: text
      description:
        type: text
      evidenceComplete:
        type: boolean
      lastCommunicationAt:
        type: date
      recoveryTimeline:
        type: text
      serviceRestorationTarget:
        type: text
      summary:
        type: text
      resolvedAt:
        type: date
      urgency:
        type: text
        allowed:
          - immediate
          - high
          - normal
          - low
      acknowledgedBy:
        type: text
      expectedRestoreAt:
        type: date
      impactedServiceCount:
        type: number
      impactedUserCount:
        type: number
      majorIncidentDeclared:
        type: boolean
  ITService:
    meaning: A technology-driven service that supports one or more business services and is managed to ensure optimal performance and availability.
    aliases:
      - technology service
      - IT support
    properties:
      criticalityLevel:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      serviceName:
        type: text
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      recoveryTier:
        type: text
        allowed:
          - high
          - medium
          - low
  PostIncidentReview:
    meaning: A structured evaluation conducted after an incident to assess its causes, responses, and overall effectiveness, leading to recommendations for future improvements.
    aliases:
      - PIR
      - incident review
    properties:
      reviewStatus:
        type: text
        allowed:
          - new
          - in-progress
          - completed
          - closed
      findingsSummary:
        type: text
      reviewDate:
        type: date
      scheduledAt:
        type: date
  RecoveryPlan:
    meaning: A documented procedure outlining the steps to restore an IT service and its dependencies after a disruption.
    aliases:
      - disaster recovery plan
      - contingency plan
    properties:
      planStatus:
        type: text
        allowed:
          - draft
          - approved
          - usable
          - outdated
      lastTestedAt:
        type: date
      lastReviewedDate:
        type: date
      planName:
        type: text
      version:
        type: text
  RegulatoryNotification:
    meaning: A formal communication submitted to a regulatory body to report incidents that meet specific criteria, ensuring compliance with legal obligations.
    aliases: []
    properties:
      notificationStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submittedAt:
        type: date
      isComplete:
        type: boolean
      notificationType:
        type: text
        allowed:
          - reportable
          - non-reportable
          - potentially-reportable
      submissionDeadline:
        type: date
      jurisdiction:
        type: text
      submissionDueAt:
        type: date
  ResolverGroup:
    meaning: A team responsible for diagnosing and resolving incidents related to specific areas of expertise within the IT organization.
    aliases:
      - support team
      - resolution team
    properties:
      groupName:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
      supportScope:
        type: text
  ServiceOwner:
    meaning: The individual accountable for the overall management and performance of a specific IT service throughout its lifecycle.
    aliases:
      - service manager
      - service steward
    properties:
      ownerName:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
      contactMethod:
        type: text
  ApplicationOwner:
    meaning: The person responsible for ensuring the operational fitness and functionality of a specific application within the IT environment.
    aliases:
      - app manager
      - application steward
    properties:
      ownerName:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  BusinessService:
    meaning: A capability delivered to customers or internal users, which is driven by underlying IT services and processes.
    aliases:
      - customer service
      - client service
    properties:
      criticalityLevel:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      serviceName:
        type: text
      currentStatus:
        type: text
        allowed:
          - active
          - inactive
          - disrupted
  ConfigurationItem:
    meaning: Any component within the IT environment that needs to be managed in order to deliver IT services, including hardware, software, and documentation.
    aliases:
      - CI
      - asset
    properties:
      ciName:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
          - under-maintenance
  CorrectiveAction:
    meaning: A tracked effort aimed at eliminating the root cause of an incident or problem to prevent recurrence and improve operational resilience.
    aliases:
      - remedial action
      - fix
    properties:
      actionStatus:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueDate:
        type: date
      actionDescription:
        type: text
      owner:
        type: text
  EmergencyChange:
    meaning: A change that is processed under an expedited path to address an urgent operational need resulting from an incident.
    aliases:
      - urgent change
      - immediate change
    properties:
      changeStatus:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      implementationWindow:
        type: text
      backoutPlan:
        type: text
      implementationPlan:
        type: text
      riskAccepted:
        type: boolean
  IncidentCommander:
    meaning: The individual accountable for leading the response to major incidents, coordinating efforts across teams, and making critical decisions during the incident.
    aliases:
      - incident response lead
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  MajorIncident:
    meaning: A critical incident that requires exceptional coordination and communication across teams due to its significant impact on business operations or services.
    aliases:
      - critical incident
      - high-impact incident
    properties:
      declarationStatus:
        type: text
        allowed:
          - declared
          - not declared
      declaredAt:
        type: date
      status:
        type: text
        allowed:
          - active
          - resolved
          - closed
  MaterialityAssessment:
    meaning: A documented evaluation that determines the significance of an incident and whether it requires regulatory notification or special reporting.
    aliases: []
    properties:
      assessedAt:
        type: date
      assessmentOutcome:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
  TechnicalOwner:
    meaning: The role focused on the engineering, maintenance, and technical governance of a particular configuration item or system component.
    aliases:
      - technical lead
      - tech owner
    properties:
      ownerName:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  Workaround:
    meaning: A temporary solution that reduces or bypasses the impacts of an incident or problem until a permanent fix is implemented.
    aliases:
      - temporary solution
      - bypass
    properties:
      workaroundStatus:
        type: text
        allowed:
          - usable
          - outdated
          - in-review
      workaroundSummary:
        type: text
  Alert:
    meaning: A signal generated by monitoring systems indicating a potential issue that requires attention and may lead to the creation of an incident.
    aliases: []
    properties:
      alertType:
        type: text
      receivedAt:
        type: date
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      alertId:
        type: text
      source:
        type: text
  KnownError:
    meaning: A diagnosed problem with a documented cause and, if available, a workaround that has been identified but not permanently fixed.
    aliases: []
    properties:
      knownErrorId:
        type: text
      status:
        type: text
        allowed:
          - open
          - resolved
          - closed
  BackupSet:
    meaning: A defined collection of backup data that can be used to restore systems or services to a previous state.
    aliases:
      - backup
      - recovery set
    properties:
      backupDate:
        type: date
      backupType:
        type: text
      status:
        type: text
        allowed:
          - successful
          - failed
          - verified
          - expired
          - corrupted
  OnCallEngineer:
    meaning: The technical specialist who is available to respond to incidents outside of regular business hours, ensuring timely resolution of urgent issues.
    aliases:
      - on-call tech
      - duty engineer
    properties:
      engineerName:
        type: text
  RegulatoryRepresentative:
    meaning: The designated individual or entity responsible for receiving and managing regulatory notifications on behalf of the organization.
    aliases: []
    properties:
      representativeName:
        type: text
  Stakeholder:
    meaning: An individual or group that has an interest or role in the outcome of an incident, business service, or IT operation.
    aliases:
      - interested party
      - affected party
    properties:
      communicationChannel:
        type: text
      stakeholderName:
        type: text
  ThirdPartyService:
    meaning: A service provided by an external organization that the bank relies on to support its business operations and IT services.
    aliases:
      - outsourced service
      - external service
    properties:
      serviceName:
        type: text
      status:
        type: text
  BusinessOwner:
    meaning: The role responsible for the overall accountability of a business service or process, ensuring it meets business objectives.
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  Change:
    meaning: A controlled addition, modification, or removal of an IT service or component that could affect its operation.
    aliases: []
    properties:
      changeId:
        type: text
      changeType:
        type: text
        allowed:
          - normal
          - emergency
          - standard
      implementationTime:
        type: date
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  Environment:
    meaning: A defined context in which IT services and applications operate, such as production, testing, or development.
    aliases: []
    properties:
      environmentName:
        type: text
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - unavailable
  Notification:
    meaning: A controlled message sent to stakeholders providing updates or information about incidents or events requiring attention.
    aliases: []
    properties:
      channel:
        type: text
        allowed:
          - email
          - SMS
          - in-app
          - dashboard
          - phone
      notificationType:
        type: text
        allowed:
          - incident-update
          - incident-resolution
          - general-alert
          - compliance-alert
      sentAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  OnCallRole:
    meaning: A designated position responsible for responding to incidents outside regular working hours, usually covering urgent operational needs.
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  RecoveryAction:
    meaning: A specific step or task defined in a recovery plan aimed at mitigating an incident's impact and restoring services.
    aliases: []
    properties:
      actionName:
        type: text
      sequenceNumber:
        type: number
      status:
        type: text
        allowed:
          - pending
          - in-progress
          - completed
          - failed
  Regulator:
    meaning: A competent authority that supervises the bank's operations and ensures compliance with relevant laws and regulations.
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  Vendor:
    meaning: An external organization that provides or supports technology and services utilized by the bank.
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  CustomerChannel:
    meaning: The various pathways through which customers access and interact with banking services.
    aliases: []
    properties:
      channelType:
        type: text
        allowed:
          - online
          - phone
          - in-branch
          - mobile
      currentStatus:
        type: text
        allowed:
          - available
          - unavailable
          - degraded
  Runbook:
    meaning: A detailed document that provides step-by-step procedures for responding to specific operational tasks or incidents.
    aliases: []
    properties:
      lastReviewedAt:
        type: date
      runbookStatus:
        type: text
        allowed:
          - current
          - outdated
          - in-review
  StakeholderCommunication:
    meaning: A controlled message sent to individuals or groups affected by an incident, providing updates and information on the situation.
    aliases: []
    properties:
      communicationStatus:
        type: text
        allowed:
          - draft
          - sent
          - failed
      communicationType:
        type: text
        allowed:
          - operational
          - informational
          - escalation
          - update
      sentAt:
        type: date
