    aliases: []
rules:
  shouldDeclareMajorIncident:
    conditions:
      - incident status is not resolved, closed, or cancelled
      - incident severity level is sev1-critical or sev2-high
      - at least one IT service is affected by the incident
      - incident impact is significant enough to require enhanced coordination and communication
  canAssignToResolverGroup:
    conditions:
      - incident status is not closed or cancelled
      - a resolver group is identified that supports the affected IT service or is assigned to the involved configuration item
      - resolver group is available and capable of addressing the incident
      - incident has been triaged to determine assignment needs
  canImplementEmergencyChange:
    conditions:
      - emergency change is linked to an incident
      - linked incident status is not closed or cancelled
      - emergency change implementationPlan is provided
      - emergency change backoutPlan is provided
      - emergency change riskAccepted is true
  canSubmitRegulatoryNotification:
    conditions:
      - linked incident has a completed materiality assessment
      - materiality assessment outcome is reportable
      - regulatory notification isComplete is true
      - regulatory notification status is approved
  canAssignAndTrackCorrectiveAction:
    conditions:
      - corrective action is recommended by a completed post-incident review
      - corrective action has an assigned owner
      - corrective action actionDescription is provided
  canCommunicateIncidentUpdates:
    conditions:
      - incident has one or more identified stakeholders
      - stakeholder communication channels are available
  canExecuteContainmentMeasures:
    conditions:
      - incident status is acknowledged, investigating, or contained
      - incident containmentMeasures are identified and documented
      - incident impact on affected services has been assessed
  canPerformPostIncidentReview:
    conditions:
      - linked incident status is resolved
      - linked incident evidenceComplete is true
      - relevant stakeholder contributions have been gathered
  canRecordAndAcknowledgeIncident:
    conditions:
      - incident summary is provided
      - incident description is provided
      - incident status is new
  canRestoreServiceFromBackupSet:
    conditions:
      - incident is linked to a backup set through usesBackupSet
      - backup set status is successful or verified
      - incident status is not closed or cancelled
  requiresRegulatoryNotification:
    conditions:
      - materiality assessment outcome is potentially-reportable or reportable
      - incident has significant impact on business operations or regulatory compliance
      - assessment timing falls within applicable regulatory notification timelines or requirements
      - incident involves data breaches, compliance violations, or other regulatory concerns
  containmentCriteriaMet:
    conditions:
      - incident status is contained
      - incident containment status is contained
  determineIncidentPriority:
    conditions:
      - if incident severity is sev1-critical, then incident priority is p1-critical
      - if incident severity is sev2-high, then incident priority is p2-high
      - if incident severity is sev3-medium and incident impact level is in [enterprise-wide, multiple-services], then incident priority is p2-high
      - if incident severity is sev3-medium and incident impact level is in [single-service, limited-users], then incident priority is p3-medium
      - if incident severity is sev4-low, then incident priority is p4-low
      - if incident urgency is immediate, then incident priority is p1-critical
      - if incident urgency is high and incident severity is sev1-critical, then incident priority is p1-critical
      - if incident urgency is high and incident severity is sev2-high, then incident priority is p2-high
      - if incident urgency is high and incident severity is sev3-medium, then incident priority is p2-high
  verifyIncidentResolution:
    conditions:
      - incident status is resolved
      - incident has evidence linked to it
      - evidence integrityValidated is true
      - evidence status is verified
      - affected IT services are functioning normally and marked healthy
      - any workaround previously in place is removed or updated based on the resolution
      - all necessary stakeholder communications confirming resolution are completed
      - a post-incident review is scheduled or completed
  canAcknowledgeAlert:
    conditions:
      - the alert status is new
      - the operator is authorized for the responsible resolver group
  canCloseIncident:
    conditions:
      - the incident status is resolved or monitoring
      - impacted services have a health state of healthy or an accepted residual condition
      - resolution and restoration evidence are recorded
      - required stakeholder communications are complete
      - major and cybersecurity incidents have a scheduled or completed post-incident review
actions:
  assignIncidentToResolverGroup:
    input: Incident
    preconditions:
      - canAssignToResolverGroup
    effect: Incident is assigned to the identified resolver group.
    verification: Confirm the incident is assigned to the resolver group in the incident details.
  declareMajorIncident:
    input: Incident
    preconditions:
      - shouldDeclareMajorIncident
    effect: Create or update the linked MajorIncident record, set MajorIncident.declarationStatus to declared, set MajorIncident.declaredAt, and link the MajorIncident to the assigned IncidentCommander.
    verification: Confirm the incident has a linked MajorIncident with declarationStatus set to declared, declaredAt recorded, and an IncidentCommander linked through the MajorIncident.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: RegulatoryNotification is submitted to the designated RegulatoryRepresentative, notificationStatus becomes submitted, and submittedAt is recorded.
    verification: Confirm notificationStatus is submitted and submittedAt is recorded.
  implementEmergencyChange:
    input: EmergencyChange
    preconditions:
      - canImplementEmergencyChange
    effect: EmergencyChange status becomes implemented.
    verification: Confirm EmergencyChange status is implemented and implementation evidence is documented through linked incident evidence items.
  performPostIncidentReview:
    input: PostIncidentReview
    preconditions:
      - canPerformPostIncidentReview
    effect: PostIncidentReview.findingsSummary is documented and reviewStatus becomes completed.
    verification: Confirm the post-incident review is recorded with findingsSummary documented and reviewStatus marked completed.
  restoreServiceFromBackupSet:
    input: Incident
    preconditions:
      - canRestoreServiceFromBackupSet
    effect: Affected IT services are restored from the linked backup set and IT service status is updated to recovering or healthy as appropriate.
    verification: Confirm the relevant IT service status reflects recovery or restoration and the linked backup set was used successfully.
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: alert status becomes acknowledged and the acknowledgement timestamp is recorded
    verification: read the alert and confirm the status is acknowledged
  containIncident:
    input: Incident
    preconditions: []
    effect: incident status becomes contained and incident containment status becomes contained
    verification: confirm the incident status is contained and the containment status is contained
  assignAndTrackCorrectiveAction:
    input: CorrectiveAction
    preconditions:
      - canAssignAndTrackCorrectiveAction
    effect: CorrectiveAction is recorded, assigned to the designated owner, and actionStatus becomes open.
    verification: Confirm the corrective action is assigned, tracked in the system, and actionStatus is open.
  communicateIncidentUpdates:
    input: Incident
    preconditions:
      - canCommunicateIncidentUpdates
    effect: Incident updates are communicated to the identified stakeholders through their designated communication channels and Incident.lastCommunicationAt is set.
    verification: Confirm incident updates were sent and lastCommunicationAt is recorded.
  executeContainmentMeasures:
    input: Incident
    preconditions:
      - canExecuteContainmentMeasures
    effect: Incident containmentMeasures are implemented and incident status becomes contained.
    verification: Confirm containment measures were executed successfully, incident status is contained, and containment measures are documented.
  recordAndAcknowledgeIncident:
    input: Incident
    preconditions:
      - canRecordAndAcknowledgeIncident
    effect: Incident status becomes acknowledged and Incident.acknowledgedAt is set to the acknowledgment timestamp.
    verification: Confirm the incident status is acknowledged and acknowledgedAt is recorded.
  documentIncidentWorkaround:
    input: Incident
    preconditions: []
    effect: a workaround is documented and linked to the incident
    verification: confirm the incident has the documented workaround linked to it
  documentKnownErrorWorkaround:
    input: KnownError
    preconditions: []
    effect: a workaround is documented and linked to the known error
    verification: confirm the known error has the documented workaround linked to it
  documentWorkaround:
    input: Workaround
    preconditions: []
    effect: workaround is documented and linked to the correct incident or known error
    verification: confirm the workaround is documented and linked to the correct incident or known error
  respondToChangeIncident:
    input: Incident
    preconditions: []
    effect: the linked change is identified and targeted response actions are initiated to address issues arising from it
    verification: confirm the response actions address issues caused by the linked change and are documented
  conductMaterialityAssessment:
    input: Incident
    preconditions: []
    effect: materiality assessment is conducted and recorded for the incident
    verification: review the materiality assessment documentation and confirm it is attached to the incident
  documentEvidenceItem:
    input: Incident
    preconditions: []
    effect: an evidence item is created and associated with the incident
    verification: confirm the evidence item is recorded and linked to the incident
  sendStakeholderCommunications:
    input: Incident
    preconditions: []
    effect: communication is sent and timestamped
    verification: confirm delivery status and archive the final message
