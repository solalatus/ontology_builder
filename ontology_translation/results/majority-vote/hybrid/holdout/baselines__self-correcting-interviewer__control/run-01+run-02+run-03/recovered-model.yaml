competency_questions: []
classes:
  Alert:
    meaning: A notification generated by monitoring tools indicating a condition that requires attention or action, potentially linked to an incident.
    aliases:
      - riasztás
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      acknowledgedAt:
        type: date
  Evidence:
    meaning: A preserved record or artifact collected during incident management that supports analysis and accountability.
    aliases: []
    properties:
      collectedAt:
        type: date
      status:
        type: text
        allowed:
          - collected
          - verified
          - sealed
          - compromised
      description:
        type: text
      evidenceId:
        type: text
      identifier:
        type: text
  Incident:
    meaning: An unplanned interruption or degradation of an IT service that requires a managed response.
    aliases:
      - hibajegy
    properties:
      majorIncidentDeclared:
        type: boolean
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      priorityLevel:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      incidentId:
        type: text
      closedAt:
        type: date
      lastAcknowledgedAt:
        type: date
      openedAt:
        type: date
      workaroundAvailable:
        type: boolean
      materialityAssessmentNeeded:
        type: boolean
  IncidentCommander:
    meaning: The individual responsible for managing and coordinating the response to a major incident, ensuring effective communication and decision-making throughout the incident lifecycle.
    aliases: []
    properties:
      name:
        type: text
  MaterialityAssessment:
    meaning: A documented evaluation determining the significance of an incident and its implications for regulatory reporting and compliance.
    aliases:
      - lényegességi értékelés
    properties:
      status:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      rationale:
        type: text
      assessmentId:
        type: text
      result:
        type: text
      outcome:
        type: text
  OnCallEngineer:
    meaning: A technical specialist available to respond to incidents and operational issues during designated on-call periods.
    aliases: []
    properties:
      name:
        type: text
  PostIncidentReview:
    meaning: A structured analysis conducted after an incident to review what occurred, evaluate the response effectiveness, and identify lessons learned.
    aliases:
      - incidens utóelemzés
    properties:
      scheduledAt:
        type: date
      status:
        type: text
        allowed:
          - scheduled
          - completed
          - cancelled
      outcomeSummary:
        type: text
      reportDocumented:
        type: boolean
  RecoveryPlan:
    meaning: A documented strategy outlining the steps and procedures to restore an IT service and its dependencies after an incident.
    aliases:
      - helyreállítási terv
    properties:
      status:
        type: text
        allowed:
          - draft
          - approved
          - in-progress
          - validated
          - expired
      recoveryTimeObjective:
        type: text
      lastValidatedAt:
        type: date
      targetEnvironmentReady:
        type: boolean
      description:
        type: text
      recoveryPlanId:
        type: text
      recoveryPointObjective:
        type: text
      lastReviewed:
        type: date
  RegulatoryNotification:
    meaning: A formal submission to a regulatory authority regarding an incident that meets specified reporting criteria.
    aliases:
      - felügyeleti bejelentés
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submissionReceipt:
        type: text
      dueDate:
        type: date
      submittedAt:
        type: date
      notificationId:
        type: text
      requiredFieldsComplete:
        type: boolean
  ResolverGroup:
    meaning: A team of technical experts assigned to diagnose and resolve incidents related to specific technology or service areas.
    aliases:
      - megoldócsoport
    properties:
      name:
        type: text
  BackupSet:
    meaning: A defined collection of recoverable backup data, crucial for restoring IT services and ensuring data availability during incidents.
    aliases:
      - mentéskészlet
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      createdAt:
        type: date
      lastVerifiedAt:
        type: date
      restorePointApprovalStatus:
        type: text
        allowed:
          - approved
          - not-approved
      lastSuccessfulBackupTime:
        type: date
  Change:
    meaning: A controlled modification or addition to an IT service or system, which may impact its operation or functionality.
    aliases: []
    properties:
      implementedAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      changeId:
        type: text
  CorrectiveAction:
    meaning: A tracked action intended to address the root causes of an incident or problem, reduce risk, and improve response capabilities.
    aliases:
      - helyesbítő intézkedés
    properties:
      dueDate:
        type: date
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
  ITService:
    meaning: A managed technology service that underpins one or more business services, ensuring operational reliability.
    aliases:
      - informatikai szolgáltatás
    properties:
      healthStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
      recoveryTimeObjective:
        type: text
      availabilityTarget:
        type: text
      criticalityTier:
        type: text
      name:
        type: text
  Stakeholder:
    meaning: An individual or group affected by or responsible for an operational outcome, including internal and external parties involved in the bank's services.
    aliases: []
    properties: {}
  Workaround:
    meaning: A temporary method that reduces or bypasses the impact of an incident or problem without addressing the root cause.
    aliases: []
    properties:
      description:
        type: text
      status:
        type: text
  BusinessService:
    meaning: A customer-facing capability provided by the bank that supports specific business processes.
    aliases:
      - üzleti szolgáltatás
    properties: {}
  CommunicationPlan:
    meaning: A documented strategy outlining the communication processes and protocols for informing stakeholders about incident status, actions being taken, and any impacts on services.
    aliases: []
    properties: {}
  CommunicationUpdate:
    meaning: A controlled message sent to stakeholders to provide information about the status, progress, or resolution of an incident.
    aliases:
      - értesítés
    properties:
      approvalStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - cancelled
      message:
        type: text
      owner:
        type: text
      sentAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - sent
          - cancelled
  Deployment:
    meaning: The technical process of implementing a change or a new release of an IT service to a production environment.
    aliases: []
    properties:
      deployedAt:
        type: date
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
  Impact:
    meaning: A classification that defines the significance of an incident's effects on business operations and regulatory obligations, determining the necessary level of response and communication.
    aliases: []
    properties:
      level:
        type: text
        allowed:
          - high
          - medium
          - low
      status:
        type: text
        allowed:
          - active
          - resolved
  RegulatoryReportingAuthority:
    meaning: The individual or organization responsible for overseeing regulatory compliance and approving submissions related to incidents that require notification to regulators.
    aliases: []
    properties: {}
  RestorationAuthority:
    meaning: The individual or role responsible for authorizing the restoration of backup data to ensure compliance with operational standards and procedures.
    aliases: []
    properties: {}
  ServiceOwner:
    meaning: The individual accountable for the overall management and performance of a particular IT service throughout its lifecycle.
    aliases: []
    properties: {}
  BusinessOwner:
    meaning: The individual responsible for ensuring that a business service aligns with organizational goals and meets stakeholder needs.
    aliases: []
    properties:
      name:
        type: text
  ContainmentSteps:
    meaning: A documented procedure or set of actions that outlines how to contain an incident's impact and restore normal operations.
    aliases: []
    properties:
      approved:
        type: boolean
      description:
        type: text
      stepsId:
        type: text
  Metric:
    meaning: A quantitative measure that provides insights into the performance and health of services or components over time.
    aliases: []
    properties:
      measuredAt:
        type: date
      name:
        type: text
      value:
        type: number
  Regulator:
    meaning: The authoritative body that oversees and receives required notifications from the bank.
    aliases: []
    properties:
      name:
        type: text
  Service:
    meaning: A managed technology capability that supports business functions and customer-facing capabilities.
    aliases:
      - szolgáltatás
    properties:
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      name:
        type: text
      serviceId:
        type: text
  StakeholderCommunication:
    meaning: A controlled message sent to relevant parties providing updates and information about an incident's status and impact.
    aliases: []
    properties:
      approvalState:
        type: text
      audience:
        type: text
      deliveryStatus:
        type: text
      messageContent:
        type: text
      owner:
        type: text
      sentAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  ThirdPartyService:
    meaning: An externally provided service that the bank relies on to deliver its business functions or IT services.
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
  Communication:
    meaning: A controlled message sent to stakeholders, including technical teams, management, and customers, to provide updates or information about incidents, changes, or service status.
    aliases:
      - Notification
    properties:
      approvalStatus:
        type: text
      deliveryStatus:
        type: text
      messageBody:
        type: text
      messageSummary:
        type: text
      owner:
        type: text
      sentTime:
        type: date
  ConfigurationItem:
    meaning: Any component of the infrastructure or applications that is managed and recorded within our IT service management practices, critical to service delivery.
    aliases: []
    properties:
      environment:
        type: text
      name:
        type: text
      version:
        type: text
  EmergencyChange:
    meaning: A rapid modification to a configuration item or service, executed under an accelerated process to address an urgent operational need, often linked to a live incident.
    aliases:
      - Urgent Change
    properties:
      identifier:
        type: text
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  IncidentManager:
    meaning: A team member who supports the incident commander in organizing incident responses, managing progress, and ensuring all actions are aligned with operational protocols.
    aliases:
      - Major Incident Manager
    properties: {}
  Problem:
    meaning: The underlying cause of one or more incidents that requires investigation and resolution to prevent recurrence.
    aliases: []
    properties:
      rootCause:
        type: text
  ResponsePlan:
    meaning: A strategic document outlining the procedures and actions necessary to effectively manage and respond to incidents, guiding teams in their response efforts.
    aliases:
      - Incident Response Procedure
    properties:
      nextSteps:
        type: text
  Runbook:
    meaning: A documented procedure or set of instructions that guides technical teams through the steps necessary for incident resolution, system recovery, or operational tasks.
    aliases:
      - Operational Procedure
      - Playbook
    properties:
      identifier:
        type: text
      title:
        type: text
  ServiceEnvironment:
    meaning: The context in which a service operates, such as production, testing, or development, impacting how incidents and changes are managed.
    aliases: []
    properties: {}
relationships:
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: Refers to the resolver group that is designated to respond to and resolve a specific incident.
    aliases:
      - is assigned to
      - designated for resolution
  - name: hasRecoveryPlan
    from: ITService
    to: RecoveryPlan
    meaning: Indicates that an IT service is associated with a specific recovery plan outlining how to restore it in case of an incident.
    aliases: []
  - name: affects
    from: Incident
    to: ITService
    meaning: Indicates that an incident causes a disruption or degradation to a business or IT service.
    aliases: []
  - name: hasIncidentCommander
    from: Incident
    to: IncidentCommander
    meaning: null
    aliases: []
  - name: hasOnCallEngineer
    from: ResolverGroup
    to: OnCallEngineer
    meaning: null
    aliases: []
  - name: hasPostIncidentReview
    from: Incident
    to: PostIncidentReview
    meaning: Links an incident to the post-incident review conducted to analyze the response and identify lessons learned for future improvements.
    aliases: []
  - name: regardsIncident
    from: RegulatoryNotification
    to: Incident
    meaning: Connects a regulatory notification to the incident it pertains to, ensuring that all reporting obligations are aligned.
    aliases: []
  - name: hasRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: Indicates that an incident is associated with a regulatory notification that may need to be submitted.
    aliases: []
  - name: hasWorkaround
    from: Incident
    to: Workaround
    meaning: Indicates that there is a temporary solution available to mitigate the impact of an incident while a permanent resolution is being sought.
    aliases: []
  - name: hasEvidence
    from: Incident
    to: Evidence
    meaning: Links an incident to the evidence collected that supports the analysis and understanding of the incident.
    aliases: []
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: Connects an incident to the materiality assessment that evaluates its significance and determines whether regulatory reporting is required.
    aliases: []
rules:
  canCloseIncident:
    conditions:
      - incident status is resolved or monitoring
      - affected services have health status healthy or degraded
      - resolution and restoration evidence is documented and available
      - required communication updates for the incident have status sent
      - if the incident is a major incident, a post-incident review is scheduled or completed
  canDeclareMajorIncident:
    conditions:
      - incident status is not resolved, closed, or cancelled
      - incident severity is sev1-critical or sev2-high
      - incident affects at least one IT service
      - incident has an incident commander
      - incident has a communication plan
      - incident has an impact classification defining significant business or regulatory implications
  canSendStakeholderCommunication:
    conditions:
      - communication update has a message
      - communication update has an owner
      - communication update approvalStatus is approved
      - communication update is sent to at least one stakeholder
  canSubmitRegulatoryNotification:
    conditions:
      - regulatory notification is approved by the designated regulatory-reporting authority
      - all required fields and supporting evidence related to the notification are complete
      - the incident associated with the notification is classified as reportable
      - the notification is submitted before the applicable regulatory deadline
  canValidateAndImplementRecoveryPlan:
    conditions:
      - recovery plan status is approved
      - at least one IT service has the recovery plan
      - recovery plan targetEnvironmentReady is true
  canConductMaterialityAssessment:
    conditions:
      - incident status is new, acknowledged, or investigating
      - incident has at least one stakeholder
      - materiality assessment has a rationale
  canRestoreBackup:
    conditions:
      - backup set status is successful or verified
      - backup set restores the IT service that requires restoration
      - the IT service has a recovery plan
      - backup set restorePointApprovalStatus is approved
      - the recovery plan has a restoration authority
      - the recovery plan targetEnvironmentReady is true
  requiresRegulatoryNotification:
    conditions:
      - incident is classified as reportable based on the materiality assessment
      - incident severity is sev1-critical or sev2-high
      - incident has significant business or regulatory impact
      - regulatory notification is approved by the designated regulatory-reporting authority
      - notification is submitted before the applicable regulatory deadline
  canAcknowledgeAlert:
    conditions:
      - The Alert status is new.
  canAssignIncident:
    conditions:
      - The Incident status is not closed or cancelled.
      - At least one Service affected by the Incident is supportedByResolverGroup the target ResolverGroup.
  canContainIncident:
    conditions:
      - The Incident status is acknowledged or investigating.
      - Approved ContainmentSteps are defined for the Incident.
  canDocumentIncidentFindings:
    conditions:
      - Findings from the incident investigation are available to record.
  canExecuteEmergencyChange:
    conditions:
      - The Change is for an Incident whose status is not resolved, closed, or cancelled.
      - The Change status is approved.
  canConductPostIncidentReview:
    conditions:
      - incident status is closed
      - if the incident is major or cybersecurity, a post-incident review is scheduled
actions:
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: alert status becomes acknowledged and acknowledgedAt is recorded
    verification: confirm the alert record shows status acknowledged and the acknowledgment was logged
  assignIncidentToResolverGroup:
    input: Incident
    preconditions: []
    effect: incident is assigned to the designated resolver group
    verification: confirm the incident record shows the correct resolver group assignment
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: incident status becomes closed and closedAt is recorded
    verification: confirm the incident record shows status closed, closedAt, and consistent linked evidence and communication records
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: incident is marked as a major incident and enhanced coordination and communication are initiated
    verification: confirm the incident record shows major-incident declaration, an incident commander, and a communication plan
  executeEmergencyChange:
    input: Change
    preconditions: []
    effect: the emergency change is executed and the change status is updated to reflect the outcome
    verification: confirm the change record shows the execution outcome and the associated incident is updated accordingly
  restoreBackupSet:
    input: BackupSet
    preconditions:
      - canRestoreBackup
    effect: the backup data is restored to the target IT service
    verification: confirm the restoration completed successfully and the restored service passed data-integrity and operational checks
  sendStakeholderCommunication:
    input: CommunicationUpdate
    preconditions:
      - canSendStakeholderCommunication
    effect: the communication is sent to stakeholders and the communication status is updated to sent
    verification: confirm the communication record shows status sent and sentAt, and that delivery to intended stakeholders was recorded
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: notification status becomes submitted and submissionReceipt is recorded
    verification: confirm the regulatory notification record shows status submitted and a submission receipt or submission result
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: The approved containment steps are executed for the incident.
    verification: Confirm that containment indicators are met and assess the service impact.
  conductMaterialityAssessment:
    input: Incident
    preconditions:
      - canConductMaterialityAssessment
    effect: a materiality assessment is produced and its result is documented
    verification: confirm the assessment record exists with the result, timestamp, and required documentation
  validateAndImplementRecoveryPlan:
    input: RecoveryPlan
    preconditions:
      - canValidateAndImplementRecoveryPlan
    effect: the recovery plan is executed and its status is updated accordingly
    verification: confirm the restoration succeeded and the service is operational according to the recovery objectives in the plan
  documentIncidentFindings:
    input: Incident
    preconditions:
      - canDocumentIncidentFindings
    effect: The incident record is updated to include findings and lessons learned.
    verification: Confirm that findings are now recorded in the incident documentation.
  startRegulatoryReportingWorkflow:
    input: Incident
    preconditions:
      - canSubmitRegulatoryNotification
    effect: The regulatory reporting workflow is initiated for the incident's RegulatoryNotification.
    verification: Confirm the RegulatoryNotification workflow has started and is linked to the incident.
  conductPostIncidentReview:
    input: Incident
    preconditions:
      - canConductPostIncidentReview
    effect: a post-incident review is documented and any identified corrective actions are recorded
    verification: check that a post-incident review exists for the incident, that its report is documented, and that any identified corrective actions are linked to the review
