rules:
  qualifiesForMajorIncidentDeclaration:
    conditions:
      - incident is active and not resolved or closed
      - incident severity is critical (sev1) or high (sev2)
      - at least one impacted IT service is identified
      - an incident commander or designated duty manager is assigned to lead the response
  canAssignIncidentToResolverGroup:
    conditions:
      - incident is not closed or cancelled
      - resolver group supports the affected IT service or configuration item
  canSendApprovedStakeholderCommunication:
    conditions:
      - communication is approved by the duty manager or incident commander
      - current incident state is clearly described in the message
  canRestoreBackup:
    conditions:
      - The backup status is successful or verified.
      - The restore point and target environment are approved.
      - An active recovery plan applies to the IT service being restored.
      - The service owner has authorized the restoration.
  canRestoreServiceUsingRecoveryPlan:
    conditions:
      - recovery plan is applicable to the specific IT service being restored
      - target recovery environment is available
  canUseEmergencyChange:
    conditions:
      - change is linked to an active incident requiring immediate action
      - affected configuration items are identified and documented
      - implementation plan and backout plan are prepared and reviewed
      - risks are explicitly accepted by the duty manager
      - authorization is obtained according to bank policy
  requiresMaterialityAssessment:
    conditions:
      - The incident may have potential regulatory impact based on its severity or nature.
      - There is a need to determine whether the incident is reportable under regulatory guidelines.
      - The incident significantly affects customer services or business operations.
  canContainIncident:
    conditions:
      - Incident.status is acknowledged or investigating.
  canExecuteEmergencyChange:
    conditions:
      - EmergencyChange is justified by an Incident.
      - The Incident.status is not resolved, closed, or cancelled.
  canExecuteRecoveryPlan:
    conditions:
      - Incident.status is acknowledged, contained, or recovering.
      - RecoveryPlan.status is active.
      - The Incident uses the RecoveryPlan.
  canSendIncidentCommunication:
    conditions:
      - Incident.status is not closed or cancelled.
  requiresRegulatoryNotificationDecision:
    conditions:
      - The incident has a completed MaterialityAssessment.
      - The MaterialityAssessment.jurisdiction is relevant to the incident.
      - The MaterialityAssessment.outcome is potentially-reportable or reportable.
  requiresRegulatoryReportingDecision:
    conditions:
      - The incident has a completed MaterialityAssessment.
      - The MaterialityAssessment.jurisdiction is relevant to the incident.
      - The MaterialityAssessment.outcome is reportable.
actions:
  assignIncidentToResolverGroup:
    input: Incident
    preconditions:
      - canAssignIncidentToResolverGroup
    effect: The incident is assigned to the specified resolver group for diagnosis and resolution steps to commence.
    verification: Confirm that the incident is now linked to the assigned resolver group in the incident record.
  declareMajorIncident:
    input: Incident
    preconditions:
      - qualifiesForMajorIncidentDeclaration
    effect: The incident is classified as a major incident, triggering enhanced coordination and communication processes.
    verification: Confirm the major-incident flag is set on the incident, along with the assigned incident commander and declaration timestamp.
  sendApprovedStakeholderCommunication:
    input: Communication
    preconditions:
      - canSendApprovedStakeholderCommunication
    effect: The approved communication is sent to the relevant stakeholders, notifying them of the incident status or updates.
    verification: Confirm that the communication record indicates the message has been sent and timestamped, including confirmation of delivery status.
  executeEmergencyChange:
    input: Change
    preconditions:
      - canUseEmergencyChange
    effect: The emergency change is implemented, the affected configuration items are modified as specified in the implementation plan, and the change status is updated accordingly.
    verification: Confirm that the change has been executed successfully and that the status is updated in the change record, including any relevant documentation of the implementation.
  restoreServiceUsingRecoveryPlan:
    input: ITService
    preconditions:
      - canRestoreServiceUsingRecoveryPlan
    effect: The specified IT service is restored using the designated recovery plan, all dependencies and configurations are properly reinstated, and the IT service status is updated to reflect successful restoration.
    verification: Confirm that service health is verified, the service status is updated to reflect successful restoration, and all relevant documentation of the recovery process is recorded.
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: The alert status becomes acknowledged.
    verification: Confirm the alert status is acknowledged.
  conductMaterialityAssessment:
    input: Incident
    preconditions:
      - requiresMaterialityAssessment
    effect: A materiality assessment is completed or updated for the incident.
    verification: Confirm the incident has a materiality assessment with a recorded result.
  containIncident:
    input: Incident
    preconditions: []
    effect: The incident containment summary is recorded and the incident handling reflects containment activity.
    verification: Confirm the incident has a containment summary and shows containment activity.
  restoreBackup:
    input: Backup
    preconditions:
      - canRestoreBackup
    effect: The backup is restored to the approved target environment for the affected IT service.
    verification: Confirm the affected IT service status reflects recovery.
  closeIncident:
    input: Incident
    preconditions: []
    effect: The incident status becomes closed.
    verification: Confirm the incident status is closed.
  executeWorkaroundOrRunbook:
    input: Incident
    preconditions: []
    effect: A linked workaround or runbook is executed for the incident.
    verification: Confirm execution is recorded and the incident state reflects the action.
  isolateConfigurationItem:
    input: Incident
    preconditions: []
    effect: A linked configuration item is isolated from normal operation for the incident.
    verification: Confirm the intended linked configuration item is recorded as isolated.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - requiresRegulatoryNotificationDecision
    effect: RegulatoryNotification.status becomes submitted.
    verification: Confirm RegulatoryNotification.status is submitted.
