competency_questions:
  - id: cq1
    text: Which business services are currently impacted by this incident?
  - id: cq2
    text: What IT services support this business service and what are their dependencies?
  - id: cq3
    text: Which third-party services are crucial for the affected IT service?
  - id: cq4
    text: Which active alerts correlate with this incident, and what are their current statuses?
  - id: cq5
    text: What events preceded the detection of this incident, and how are they related?
  - id: cq6
    text: Who is the service owner for the affected IT service?
  - id: cq7
    text: Which resolver group should be assigned to this incident?
  - id: cq8
    text: Is this incident severe enough to warrant a major-incident declaration?
  - id: cq9
    text: Who has the authority to declare a major incident?
  - id: cq10
    text: What recovery plans are applicable for restoring the affected service?
  - id: cq11
    text: Has there been any recent change that may have caused this incident?
  - id: cq12
    text: What is the emergency change process to address this incident?
  - id: cq13
    text: What evidence is needed to support the incident analysis and subsequent actions?
  - id: cq14
    text: What communications have been sent to stakeholders regarding this incident?
  - id: cq15
    text: Who approved communications sent regarding this incident?
  - id: cq16
    text: Is there an open corrective action from a previous post-incident review that is relevant to this incident?
  - id: cq17
    text: What are the implications of this incident for regulatory reporting?
classes:
  Alert:
    meaning: A notification generated by monitoring systems that indicates a condition requiring attention or action.
    aliases: []
    properties:
      status:
        type: text
      detectedAt:
        type: date
      identifier:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      summary:
        type: text
  BusinessService:
    meaning: A customer-facing capability provided by the bank that facilitates specific business processes.
    aliases: []
    properties:
      availabilityTarget:
        type: number
      criticalityTier:
        type: text
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
  Change:
    meaning: A controlled modification to an IT service or system, including the addition, removal, or alteration of components or configurations.
    aliases: []
    properties:
      implementedAt:
        type: date
      status:
        type: text
      maintenanceWindowStatus:
        type: text
      type:
        type: text
      backoutPlan:
        type: text
      identifier:
        type: text
      riskLevel:
        type: text
      summary:
        type: text
      changeDate:
        type: date
  ConfigurationItem:
    meaning: null
    aliases: []
    properties:
      criticalityTier:
        type: text
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
  CorrectiveAction:
    meaning: A documented measure taken to address the root cause of an incident, reduce risk, or improve response capabilities.
    aliases: []
    properties:
      status:
        type: text
      dueDate:
        type: date
      openDate:
        type: date
      actionDescription:
        type: text
      identifier:
        type: text
  Incident:
    meaning: An unplanned interruption or degradation of an IT service that requires managed response and restoration.
    aliases: []
    properties:
      severity:
        type: text
      status:
        type: text
      declaredAt:
        type: date
      detectedAt:
        type: date
      operatingHoursContext:
        type: text
      containmentSummary:
        type: text
      description:
        type: text
      identifier:
        type: text
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      summary:
        type: text
      declaredMajorIncident:
        type: boolean
  IncidentCommander:
    meaning: The authorized individual responsible for leading the coordinated response and decision-making during a major incident.
    aliases: []
    properties:
      activeStatus:
        type: text
      contactInformation:
        type: text
      identifier:
        type: text
      name:
        type: text
  ITService:
    meaning: A managed technology service that supports one or more business services, ensuring their operational functionality.
    aliases: []
    properties:
      status:
        type: text
      criticalityTier:
        type: text
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
      serviceLevelObjectives:
        type: text
  PostIncidentReview:
    meaning: A structured evaluation conducted after an incident to analyze its causes, assess the effectiveness of the response, and identify lessons learned.
    aliases: []
    properties:
      completedAt:
        type: date
      dateHeld:
        type: date
      findings:
        type: text
      identifier:
        type: text
      status:
        type: text
      summary:
        type: text
  RecoveryPlan:
    meaning: A documented procedure outlining how to restore an IT service and its critical components after an incident.
    aliases: []
    properties:
      status:
        type: text
      recoveryScope:
        type: text
        allowed:
          - criticalServices
          - nonCriticalServices
          - specificIncidentTypes
          - applicationSpecific
          - infrastructureSpecific
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
      recoveryPointObjective:
        type: text
      recoveryTimeObjective:
        type: text
  ResolverGroup:
    meaning: A team of technical experts assigned to diagnose and resolve incidents related to specific technology or service areas.
    aliases: []
    properties:
      activeStatus:
        type: text
      currentIncidents:
        type: number
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
  ServiceOwner:
    meaning: The individual responsible for the overall management and accountability of a specific IT service throughout its lifecycle.
    aliases: []
    properties:
      activeStatus:
        type: text
      contactInformation:
        type: text
      identifier:
        type: text
      name:
        type: text
  ApplicationOwner:
    meaning: The person accountable for the operational fitness and performance of a specific application supporting the IT service.
    aliases: []
    properties:
      activeStatus:
        type: text
      contactInformation:
        type: text
      identifier:
        type: text
      name:
        type: text
  Communication:
    meaning: A controlled message sent to inform relevant stakeholders about incidents, updates, or operational decisions.
    aliases: []
    properties:
      sentAt:
        type: date
      status:
        type: text
      approvalRequired:
        type: boolean
      approvedAt:
        type: date
      audience:
        type: text
      identifier:
        type: text
      summary:
        type: text
  Evidence:
    meaning: A preserved record or artifact that supports incident analysis, accountability, and compliance with operational requirements.
    aliases: []
    properties:
      collectedAt:
        type: date
      requiredForDecision:
        type: boolean
      type:
        type: text
      identifier:
        type: text
      integrityStatus:
        type: text
      storageLocation:
        type: text
  OnCallEngineer:
    meaning: The technical specialist available for immediate response to incidents that occur during off-hours or when regular staff are unavailable.
    aliases: []
    properties:
      activeStatus:
        type: text
      contactInformation:
        type: text
      identifier:
        type: text
      name:
        type: text
  Stakeholder:
    meaning: Any individual or group that is impacted by or has an interest in the outcomes of operational activities and decisions.
    aliases: []
    properties:
      type:
        type: text
  ThirdPartyService:
    meaning: An externally provided service or solution that the bank relies on to support its IT operations and service delivery.
    aliases: []
    properties: {}
  Backup:
    meaning: A defined collection of recoverable data that protects against data loss and supports recovery processes after disruptions.
    aliases: []
    properties:
      status:
        type: text
      identifier:
        type: text
      lastSuccessfulBackupTimestamp:
        type: date
      lastVerificationTimestamp:
        type: date
  CustomerChannel:
    meaning: The medium or platform through which customers interact with the bank to access services, such as online banking, mobile apps, or physical branches.
    aliases: []
    properties: {}
  Deployment:
    meaning: The technical execution that installs or activates a change or new release within the technology environment.
    aliases: []
    properties:
      identifier:
        type: text
      status:
        type: text
      targetEnvironment:
        type: text
      deploymentDate:
        type: date
  MaterialityAssessment:
    meaning: A documented evaluation that determines the significance of an incident and whether it requires reporting to regulatory authorities.
    aliases: []
    properties:
      assessmentDate:
        type: date
      identifier:
        type: text
      rationale:
        type: text
      result:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      completed:
        type: boolean
      jurisdiction:
        type: text
      outcome:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
  Runbook:
    meaning: A documented operational procedure that outlines step-by-step instructions for diagnosing, responding to, and recovering from incidents.
    aliases: []
    properties:
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
      version:
        type: text
  Workaround:
    meaning: A temporary solution employed to reduce or bypass the impact of an incident without addressing its root cause.
    aliases: []
    properties: {}
  DutyManager:
    meaning: The operational manager overseeing day-to-day activities and incidents, ensuring effective service delivery and incident management.
    aliases: []
    properties: {}
  Event:
    meaning: A recorded occurrence within the IT environment that signifies a state change or noteworthy activity relevant to operational performance.
    aliases: []
    properties:
      occurredAt:
        type: date
  MajorIncident:
    meaning: A significant incident that necessitates enhanced coordination and communication due to its high business or regulatory impact.
    aliases: []
    properties: {}
  ServiceCriticality:
    meaning: The classification that indicates the importance and reliability requirements of an IT service to ensure appropriate response and recovery strategies.
    aliases: []
    properties:
      level:
        type: text
  TechnicalOwner:
    meaning: The individual responsible for the engineering, maintenance, and technical integrity of specific configuration items or systems.
    aliases: []
    properties: {}
  BusinessLine:
    meaning: A distinct categorization of services offered by the bank that aligns with specific customer needs, regulatory requirements, or market segments, such as retail banking or corporate banking.
    aliases: []
    properties:
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
  Environment:
    meaning: A deployment context within which IT services and applications operate, such as production, test, development, or disaster recovery.
    aliases: []
    properties:
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
  MessageApprover:
    meaning: The individual responsible for reviewing and authorizing communications related to incidents before they are sent to stakeholders.
    aliases: []
    properties:
      activeStatus:
        type: text
      contactInformation:
        type: text
      identifier:
        type: text
      name:
        type: text
  SeverityTier:
    meaning: A classification that indicates the level of impact an incident may have on business operations, guiding the response and escalation processes.
    aliases: []
    properties:
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
  EmergencyChange:
    meaning: A change that is implemented on an expedited basis due to an urgent need, often resulting from a critical incident requiring immediate action to restore services.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  RegulatoryNotification:
    meaning: A formal submission made to regulatory authorities regarding incidents that meet certain criteria, ensuring compliance with legal obligations.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  RegulatoryReport:
    meaning: A formal document submitted to regulatory authorities that provides information about an incident or operational status, ensuring compliance with legal requirements.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - submitted
          - accepted
          - rejected
