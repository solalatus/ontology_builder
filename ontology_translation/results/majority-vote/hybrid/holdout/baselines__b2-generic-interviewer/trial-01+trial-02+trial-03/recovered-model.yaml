rules:
  postIncidentReviewRequiredCriteria:
    conditions:
      - Post-incident review is required for all incidents with majorIncidentDeclared true.
      - Post-incident review is required for Sev 1 or Sev 2 incidents with substantial customer impact or significant operational response.
      - Post-incident review is required for regulatory incidents with compliance obligations.
      - Post-incident review is required for repeat incidents where unresolved issues reoccur.
  customerCommunicationApprovalCriteria:
    conditions:
      - Customer communication is managed by the Communications Lead and approved by the Incident Commander and Business Lead.
  communicationContentComplete:
    conditions:
      - Communication states impacted services.
      - Communication includes the start time when the incident was first detected or reported.
      - Communication describes current impact.
      - Communication includes workaround information when applicable.
      - Communication includes estimated recovery time when available.
      - Communication includes next update time.
      - Communication includes customer guidance when customers are affected.
      - Communication contains known facts only.
  regulatoryReportingAssessmentRequired:
    conditions:
      - Incident involves customer harm or significant customer dissatisfaction.
      - Incident affects payment processing systems.
      - Incident has cyber involvement that threatens data integrity or confidentiality.
      - Incident compromises customer or financial data integrity.
      - Incident breaches operational resilience thresholds.
      - Incident causes extended unavailability of key services.
      - Incident creates regulatory breach risk.
  auditEvidenceAcceptabilityCriteria:
    conditions:
      - Evidence must be authentic, with integrity supported by timestamps or secure storage.
      - Evidence must be accurate and represent actual events or actions taken.
      - Evidence must be complete enough to support incident assessment and response decisions.
      - Evidence must be traceable to incident records, approvals, and actions taken.
  communicationLifecycleCriteria:
    conditions:
      - Incident communications follow fixed statuses of Drafted, Approved, Issued, Updated, and Withdrawn.
  controlObligationCriteria:
    conditions:
      - Control obligations cover evidence completeness, communication update cadence, escalation timeframes, RTO and RPO compliance, and disaster recovery test frequency.
  correctiveActionTrackingCriteria:
    conditions:
      - Each corrective action has an assigned owner.
      - Each corrective action has a due date.
      - Corrective actions may have risk ratings to evaluate impact and urgency.
      - Corrective actions are tracked through Open, In progress, Implemented, Verified, and Closed statuses.
      - Significant corrective actions affecting high-priority services or business functions may require executive oversight.
  crisisManagementEscalationCriteria:
    conditions:
      - Incident presents evident reputational risk or broader operational impact.
  customerCommunicationGovernanceCriteria:
    conditions:
      - Customer communications use pre-approved templates for common scenarios.
      - Significant customer communications with potential legal implications require legal or compliance review.
      - Channel-specific approval may be required depending on audience and delivery method.
  customerCommunicationTriggerCriteria:
    conditions:
      - Customer communication is triggered by confirmed customer impact.
      - Customer communication is triggered by prolonged outages affecting service availability.
      - Customer communication is triggered by payment-system or transaction impact.
      - Customer communication is triggered by demonstrable reputational risk or loss of customer trust.
      - Customer communication is triggered by regulatory expectations regarding incident communication.
  cyberResponseEscalationCriteria:
    conditions:
      - Incident has a major cybersecurity concern.
  disasterRecoveryInvocationCriteria:
    conditions:
      - Disaster recovery invocation requires Incident Commander and Business Lead involvement, and may involve the Crisis Management Team.
  disasterRecoveryUsageCriteria:
    conditions:
      - Disaster recovery is invoked when a significant incident causes complete service unavailability and requires execution of a predefined recovery plan.
  durationBasedMajorIncidentAssessment:
    conditions:
      - Duration-based escalation thresholds are fixed by criticality tier and service type.
      - A Tier 1 outage lasting over 15 minutes triggers major-incident assessment.
  emergencyChangeApprovalCriteria:
    conditions:
      - Emergency change requires agreement of the Incident Commander and relevant stakeholders, often including the Technical Owner.
  emergencyChangeEvidenceCriteria:
    conditions:
      - Before implementation, emergency change evidence includes incident details and impact, approval, implementation plan, and backout plan.
      - After implementation, emergency change evidence includes successful execution verification, observed service state, performance or stability changes, and stakeholder notifications.
  emergencyChangeImplementationApprovalCriteria:
    conditions:
      - During a live incident, the Incident Commander approves implementation of emergency changes.
      - The Incident Commander may consult the relevant Technical Owner or Service Owner before approving implementation.
  evidenceRetentionCriteria:
    conditions:
      - Evidence retention is influenced by incident severity and regulatory impact.
      - Critical incidents require longer retention, usually a minimum of several years in line with compliance obligations.
  executiveEscalationCriteria:
    conditions:
      - Incident has significant impact on customers or operations.
  failoverUsageCriteria:
    conditions:
      - Failover is used when a secondary environment must be brought online to maintain service continuity during an outage of the primary system.
  governanceForumOversightCriteria:
    conditions:
      - Governance forums oversee incident trends and patterns.
      - Governance forums oversee operational resilience risks and vulnerabilities.
      - Governance forums oversee corrective-action closure.
      - Governance forums oversee regulatory compliance themes and follow-up.
  governanceReportingCriteria:
    conditions:
      - Governance committee reporting includes incident count by severity, time to detect, time unresolved, time to restore, SLA or RTO breaches, repeat incidents, overdue corrective actions, and regulatory notification status.
  incidentClosureCriteria:
    conditions:
      - An incident cannot be closed until the incident timeline is fully documented and complete.
      - An incident cannot be closed until evidence is fully documented and complete.
  legalComplianceEscalationCriteria:
    conditions:
      - Incident has regulatory implications or potential breaches.
  majorIncidentCriteria:
    conditions:
      - Incident has significant impact on customers or business operations.
      - Incident affects a critical or high-tier business service.
      - Incident duration exceeds the bank's escalation threshold.
      - Incident impacts payment systems.
      - Incident meets a regulatory reporting or regulatory concern threshold.
      - Incident presents material reputational risk.
      - Senior executive concern or involvement triggers the major-incident process.
  operationalResilienceExerciseCriteria:
    conditions:
      - Tabletop exercises evaluate response strategies and team readiness using hypothetical scenarios.
      - Failover tests validate disaster recovery readiness and failover procedures.
      - Cyber simulations assess cyber incident response and security measure effectiveness.
      - Regulatory scenario tests test readiness to meet compliance obligations.
  playbookRunbookUsageCriteria:
    conditions:
      - Playbooks and runbooks provide predefined response procedures by service, scenario, and severity level.
      - Incident handlers use playbooks and runbooks to ensure consistent and efficient response to known incident types.
  postIncidentReviewClosureCriteria:
    conditions:
      - A post-incident review cannot be closed until all identified actions have been assigned.
      - A post-incident review cannot be closed until an implementation plan is in place.
  problemRecordCreationCriteria:
    conditions:
      - A problem record is created when root cause is unknown and requires further investigation.
      - A problem record is created when an incident is recurring.
      - A problem record is typically mandatory for major incidents.
  recoveryWorkflowSequence:
    conditions:
      - Incident response normally proceeds through diagnosis, workaround, fix, emergency change when immediate implementation is required, recovery, and monitoring.
  regulatorNotificationTriggerCriteria:
    conditions:
      - Regulator notification is triggered by significant payment-system impact affecting financial transactions.
      - Regulator notification is triggered by confirmed data breach or data integrity issue.
      - Regulator notification is triggered by failure to meet operational resilience thresholds.
      - Regulator notification is triggered by material customer detriment affecting numerous customers or services.
      - Regulator notification is triggered by broad financial stability concern.
      - Regulator notification is triggered by extended incident duration that could raise compliance flags.
  regulatorNotificationWorkflowCriteria:
    conditions:
      - Regulatory notification workflows distinguish initial regulator notification, interim updates, and final report or closure notification.
      - Initial regulator notification outlines initial findings and impacts.
      - Interim updates provide incident status, emerging insights, and ongoing actions.
      - Final report or closure notification provides full incident details, final outcomes, actions taken, and remedial measures once resolved.
  regulatoryNotificationCriteria:
    conditions:
      - Incident nature and extent indicate compliance risk or regulatory notification obligation.
  regulatoryReportingClockCriteria:
    conditions:
      - Communication deadlines and regulatory reporting timelines are tracked to ensure internal and external obligations are met.
  regulatoryReportingClockStartCriteria:
    conditions:
      - Regulatory reporting clocks are typically based on initial detection time.
      - In some cases, major incident declaration time may start the clock for specific reporting requirements.
  residualRiskAcceptanceCriteria:
    conditions:
      - Residual risk acceptance is a business impact decision made by the Business Lead and Executive Sponsor.
  rollbackCriteria:
    conditions:
      - Rollback is evaluated when post-implementation monitoring indicates deterioration rather than improvement.
      - Rollback is evaluated when stakeholder feedback reports unresolved issues or service degradation after the change.
      - Rollback is evaluated when predefined implementation-plan or backout-plan performance criteria are not met.
  serviceIsolationUsageCriteria:
    conditions:
      - Service isolation is used when a component must be disconnected from the network or dependencies to prevent impact to other services.
      - Service isolation is often used for detected security threats or severe malfunctions.
  severityAndPriorityCanDiffer:
    conditions:
      - Severity reflects technical impact while priority reflects required response speed based on business considerations.
      - A workaround may reduce priority even when technical severity remains high.
  emergencyChangeRequired:
    conditions:
      - Immediate action is necessary to restore service or safeguard against further impact.
      - The situation demands deviation from standard change processes due to time constraints.
  evidencePackComplete:
    conditions:
      - Evidence pack includes timeline, bridge notes, decisions, approvals, monitoring data, logs, customer impact analysis, communications, and change records where applicable.
      - Critical decisions are recorded with rationale.
      - Evidence is retained according to regulatory standards and internal governance policies.
      - Incident Commander or Major Incident Manager signs off completeness.
      - Governance or Compliance Team reviews and approves completeness when required.
  internalCommunicationApproved:
    conditions:
      - Internal communications receive required sign-off from stakeholders such as department heads or service owners depending on content.
  majorIncidentEscalationCandidate:
    conditions:
      - Incident state is not resolved, closed, or cancelled.
      - Incident severity level is Sev 1 or Sev 2.
      - At least one Tier 1 - Critical business service is impacted.
      - Customer effect is quantifiable.
      - An incident commander is assigned for coordination.
  recoveryCanBeConfirmed:
    conditions:
      - Technical validation confirms systems and applications are functioning correctly.
      - Business validation confirms the service meets operational needs when business confirmation is required.
      - Customer-impact validation confirms customer functionality has returned to normal when customer impact occurred.
      - Monitoring stability period shows stable service performance.
      - Recovery evidence has been captured.
  regulatoryReportApproved:
    conditions:
      - Regulatory report is endorsed by the Incident Commander, Regulatory Reporting Lead, or equivalent approver for accuracy and completeness.
  regulatoryReportContentComplete:
    conditions:
      - Regulatory report includes incident summary.
      - Regulatory report includes impacted services and their criticality.
      - Regulatory report includes customer impact, including affected users or transactions when known.
      - Regulatory report includes incident start time.
      - Regulatory report includes duration.
      - Regulatory report includes root cause when known.
      - Regulatory report includes mitigation actions.
      - Regulatory report includes recovery status.
      - Regulatory report includes next update timing.
      - Regulatory report includes remediation plan.
  regulatoryReportDeadlineSet:
    conditions:
      - Notification deadline basis is identified as detection time, confirmation time, classification time, or impact threshold breach time according to the applicable regulation.
  sev1CommunicationCadence:
    conditions:
      - Sev 1 incidents require status updates every 30 minutes.
      - Event-driven updates are sent when significant developments occur, even outside the scheduled cadence.
  sev2CommunicationCadence:
    conditions:
      - Sev 2 incidents require status updates every 60 minutes.
      - Event-driven updates are sent when significant developments occur, even outside the scheduled cadence.
  approveEmergencyChangePreconditions:
    conditions:
      - Emergency change is linked to an active incident.
      - Implementation plan is documented.
      - Backout plan is documented.
      - Affected configuration items are identified.
      - Risk acceptance is recorded.
  customerOrRegulatorCommunicationEvidenceRequired:
    conditions:
      - Customer-facing and regulator-facing communications require prior approval evidence.
      - Timestamped copies of sent communications are archived.
      - Feedback or responses are retained, especially for regulatory notifications.
  customerUpdateTiming:
    conditions:
      - Customer updates are issued once impact is confirmed and typically within the first hour after detection.
  declareMajorIncidentPreconditions:
    conditions:
      - Incident severity warrants enhanced coordination.
      - Impacted services are identified.
      - An Incident Commander is assigned.
  emergencyChangeClassification:
    conditions:
      - The action alters configuration, applies an update, or introduces a production fix not already part of the original configuration.
      - A production configuration fix to correct a misconfiguration counts as an emergency change.
  escalatePreconditions:
    conditions:
      - Escalation is required by severity, duration, or need for additional resources.
  evidenceCompletenessAccountability:
    conditions:
      - The Incident Commander is primarily accountable for evidence completeness during and after a major incident.
      - Each role involved in the incident contributes to creating, maintaining, and making relevant records retrievable.
  evidenceQualityRequirements:
    conditions:
      - Each evidence item is timestamped with date and time of creation or action.
      - Each evidence item is attributable to the responsible person or role.
      - Each evidence item is immutable after creation to preserve integrity.
      - Each evidence item is linked to the specific incident it pertains to.
      - Evidence is retained for a minimum of five years unless stricter regulatory requirements apply.
  executiveUpdateTiming:
    conditions:
      - Executive updates are typically required for Sev1 incidents.
  firstUpdateTiming:
    conditions:
      - First incident update is issued within 30 minutes of incident detection.
  heightenedEvidenceRequirements:
    conditions:
      - Sev1 incidents require comprehensive documentation.
      - Major Incident declaration intensifies evidence collection steps.
      - Cyber incidents require additional evidence for tracking and investigation.
      - Customer harm requires rigorous evidence retention.
      - Regulatory impact requires strict evidence standards.
      - Emergency changes require detailed records of justification, execution, and outcomes.
  incidentPromotionCriteria:
    conditions:
      - Alert or ticket severity is assessed as high enough to indicate significant service impact.
      - Confirmed service disruption or confirmed customer impact promotes a ticket or alert toward incident status.
      - Multiple related alerts or tickets indicate a broader service issue or outage.
      - Affected service criticality requires immediate coordinated response.
  invokeRecoveryPlanPreconditions:
    conditions:
      - The service's recovery plan applies.
      - Recovery environments are available.
      - Recovery points are acceptable.
  postIncidentReviewChairAndApproval:
    conditions:
      - Incident Commander or designated Major Incident Manager typically chairs the review.
      - Relevant service owners and management stakeholders approve findings and recommendations.
  postIncidentReviewDeadline:
    conditions:
      - Major Incident and Sev1 reviews are completed within seven days of restoration or incident closure.
      - Sev2 and lower reviews are completed within fourteen days, with flexibility for complexity and participant availability.
  postIncidentReviewOutputsRequired:
    conditions:
      - Review identifies root cause analysis.
      - Review identifies contributing factors.
      - Review identifies control gaps.
      - Review produces corrective actions.
      - Review captures lessons learned.
      - Review assigns owners for corrective actions.
      - Review assigns due dates for corrective actions.
  recoveryActionClassification:
    conditions:
      - The action restores service using a pre-existing procedure or previous functional state.
      - Scripted failover to a disaster recovery site counts as recovery.
      - Reverting to an earlier functional state counts as recovery.
  recurringUpdateTiming:
    conditions:
      - Recurring updates are issued every 60 minutes or when significant changes occur.
  regulatoryReportingDeadlines:
    conditions:
      - Initial notification is typically submitted within 24 hours of determining that a report is needed.
      - Updates are typically submitted every 48 hours until the situation stabilizes or is resolved.
      - Final report is submitted within 10 days after the initial notification or as regulatory specifications require.
  regulatoryReportingWorkflow:
    conditions:
      - Assess materiality.
      - Notify Risk/Compliance.
      - Draft notification with required details and evidence.
      - Approve notification through relevant stakeholders such as Compliance or Legal.
      - Submit notification to the regulator.
      - Track regulator follow-ups and requirements.
  reportabilityFactors:
    conditions:
      - Customer harm influences reportability.
      - Service unavailability duration for critical services influences reportability.
      - Data breach involving personal or sensitive data influences reportability.
      - Cyber impact severity and type influence reportability.
      - Financial market impact influences reportability.
      - Critical service disruption influences reportability.
      - Defined regulator threshold breaches influence reportability.
  requiredTriageActions:
    conditions:
      - Assess impact on services and customers.
      - Identify affected business or IT service.
      - Assign severity such as Sev1 or Sev2.
      - Assign owner such as a resolver group or individual responsible for handling the incident.
      - Start the incident timeline.
      - Escalate to the Major Incident process if major incident criteria are met.
