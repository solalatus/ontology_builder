competency_questions: []
classes:
  ConfigurationItem:
    meaning: A managed technical component or system element that can support services, be affected by incidents, or be changed or isolated.
    aliases:
      - CI
      - component
    properties:
      configurationItemId:
        type: text
      currentStatus:
        type: text
        allowed:
          - operational
          - under-maintenance
          - in-repair
          - decommissioned
          - unknown
      name:
        type: text
      isolationState:
        type: text
        allowed:
          - isolated
          - connected
          - pending-isolation
          - failed-isolation
          - unknown
      type:
        type: text
        allowed:
          - physical device
          - virtual machine
          - application
          - database
          - network device
          - service
  CorrectiveAction:
    meaning: A follow-up action intended to address a finding, weakness, or improvement identified from an incident or review.
    aliases:
      - remediation action
      - follow-up action
    properties:
      actionStatus:
        type: text
        allowed:
          - open
          - in progress
          - implemented
          - verified
          - closed
          - cancelled
      dueDate:
        type: date
      description:
        type: text
      actionId:
        type: text
  EventAlert:
    meaning: A detected signal or notification that may indicate or relate to an incident.
    aliases:
      - alert
      - event
      - monitoring alert
    properties:
      alertId:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      alertTime:
        type: date
      signalType:
        type: text
        allowed:
          - monitoring
          - siem
          - service-desk
          - user-report
          - vendor-report
          - automated-control
          - regulator
          - other
      triggeredAt:
        type: date
  Incident:
    meaning: An unplanned operational event requiring investigation, response, or recovery because it may affect an IT service or configuration item.
    aliases:
      - ticket
      - incident record
    properties:
      incidentId:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      acknowledged:
        type: boolean
      openedAt:
        type: date
      priority:
        type: text
        allowed:
          - P1
          - P2
          - P3
          - P4
      resolvedAt:
        type: date
      commanderActionPlan:
        type: text
      expectedRestorationTime:
        type: date
      impactLevel:
        type: text
        allowed:
          - enterprise-wide
          - multiple-services
          - single-service
          - limited-users
          - no-observed-impact
      incidentType:
        type: text
        allowed:
          - availability
          - performance
          - capacity
          - network
          - application
          - database
          - infrastructure
          - data integrity
          - cybersecurity
          - third-party
          - change-induced
          - other
      nextSteps:
        type: text
      serviceLevelObjectiveDeadline:
        type: date
      closedAt:
        type: date
      majorIncidentDeclared:
        type: boolean
      summary:
        type: text
  ITService:
    meaning: A business-recognized technology service whose availability or performance is governed and managed.
    aliases:
      - service
      - technology service
    properties:
      criticalityTier:
        type: text
        allowed:
