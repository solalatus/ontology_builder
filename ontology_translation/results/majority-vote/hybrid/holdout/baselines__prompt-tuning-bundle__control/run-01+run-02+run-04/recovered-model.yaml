competency_questions:
  - id: cq1
    text: Which business services are impacted by the current incident?
  - id: cq2
    text: Who is the service owner for the affected IT service, and what is their contact information?
  - id: cq3
    text: Which resolver group is assigned to handle this incident, and who is the on-call engineer responsible?
  - id: cq4
    text: What are the recovery objectives and approved recovery plan for the impacted service?
  - id: cq5
    text: Is there a known workaround available for this incident, and how should it be implemented?
  - id: cq6
    text: Has a materiality assessment been performed for this incident, and does it require a regulatory notification?
  - id: cq7
    text: What evidence has been collected for the incident, and what is its integrity status?
  - id: cq8
    text: What are the outcomes of the last post-incident review for the services involved in this incident?
classes:
  Alert:
    meaning: A notification generated by monitoring tools that indicates a condition requiring attention and potential action.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      alertId:
        type: text
      detectionSource:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      summary:
        type: text
      timestampRaised:
        type: date
  BusinessService:
    meaning: A capability delivered by the bank that directly supports customer-facing processes and outcomes.
    aliases: []
    properties:
      availabilityTarget:
        type: text
      currentStatus:
        type: text
      description:
        type: text
      name:
        type: text
      serviceId:
        type: text
  Incident:
    meaning: An unplanned interruption or degradation of service that requires managed response to restore normal operations.
    aliases: []
    properties:
      incidentSeverity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      incidentNature:
        type: text
        allowed:
          - operational
          - cybersecurity
      stakeholderCommunicationStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - sent
          - archived
      closureConditionsComplete:
        type: boolean
      criticalBusinessPeriod:
        type: boolean
      detectedAt:
        type: date
      evidenceChecksComplete:
        type: boolean
      geographicalContext:
        type: text
      majorIncidentCriteriaMet:
        type: boolean
      majorIncidentDeclared:
        type: boolean
      openedTime:
        type: date
      summary:
        type: text
  ITService:
    meaning: A technology service managed by the bank that underpins one or more business services, ensuring their availability and performance.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      serviceTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
      healthState:
        type: text
        allowed:
          - healthy
          - accepted-residual-condition
      availabilityTarget:
        type: text
      description:
        type: text
      name:
        type: text
  MaterialityAssessment:
    meaning: A documented evaluation that determines the significance of an incident and whether it requires formal regulatory reporting.
    aliases: []
    properties:
      requiresRegulatoryNotification:
        type: boolean
      status:
        type: text
        allowed:
          - not-started
          - in-progress
          - completed
          - reviewed
      completed:
        type: boolean
      assessmentId:
        type: text
      assessmentTimestamp:
        type: date
      rationale:
        type: text
      result:
        type: text
        allowed:
          - reportable
          - not-reportable
  OnCallEngineer:
    meaning: A technical specialist available to respond to urgent incidents and operational issues outside of regular business hours.
    aliases: []
    properties:
      contactInformation:
        type: text
      onCallNow:
        type: boolean
      currentStatus:
        type: text
      engineerId:
        type: text
      name:
        type: text
  PostIncidentReview:
    meaning: A structured examination conducted after an incident to analyze its causes, assess response effectiveness, and identify improvements.
    aliases:
      - PIR
    properties:
      outcome:
        type: text
      completed:
        type: boolean
      dateHeld:
        type: date
      findingsSummary:
        type: text
      reviewId:
        type: text
      status:
        type: text
  RegulatoryNotification:
    meaning: A formal communication submitted to regulatory authorities to inform them of an incident that meets mandatory reporting criteria.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueAt:
        type: date
      contentComplete:
        type: boolean
      notificationId:
        type: text
      submissionTimestamp:
        type: date
  ResolverGroup:
    meaning: A designated team responsible for diagnosing, resolving, and restoring services affected by incidents.
    aliases:
      - support group
    properties:
      name:
        type: text
      currentStatus:
        type: text
      expertiseArea:
        type: text
      groupId:
        type: text
  ServiceOwner:
    meaning: The individual accountable for the overall management and performance of a specific IT service throughout its lifecycle.
    aliases: []
    properties:
      contactInformation:
        type: text
      name:
        type: text
      ownerId:
        type: text
  Workaround:
    meaning: A temporary solution implemented to reduce or bypass the impact of an incident without necessarily addressing its root cause.
    aliases: []
    properties:
      implementationInstructions:
        type: text
      description:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
      summary:
        type: text
      workaroundId:
        type: text
  EmergencyChange:
    meaning: A change implemented quickly in response to a critical incident to restore services or mitigate immediate risks.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      changeId:
        type: text
      description:
        type: text
      implementationTimestamp:
        type: date
  IncidentResponseTeam:
    meaning: A cross-functional group tasked with coordinating responses to major incidents to minimize impact and restore services.
    aliases:
      - IRT
    properties:
      currentStatus:
        type: text
      expertiseArea:
        type: text
      name:
        type: text
      teamId:
        type: text
  RecoveryPlan:
    meaning: A documented strategy that outlines the processes and steps necessary to restore an IT service and its dependencies after an incident.
    aliases: []
    properties:
      approvalStatus:
        type: text
        allowed:
          - approved
          - pending approval
          - not approved
          - draft
      recoveryObjective:
        type: text
  BackupSet:
    meaning: A defined collection of recoverable data that is created to ensure data integrity and availability in case of loss or corruption.
    aliases: []
    properties:
      restorable:
        type: boolean
      backupSetId:
        type: text
      description:
        type: text
      lastSuccessfulBackupTimestamp:
        type: date
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
  ConfigurationItem:
    meaning: A managed component within the IT environment that is documented in the configuration management record and supports IT services.
    aliases: []
    properties:
      ciId:
        type: text
      criticalityTier:
        type: text
      currentStatus:
        type: text
      location:
        type: text
      name:
        type: text
      type:
        type: text
  CorrectiveAction:
    meaning: A tracked effort to eliminate the root cause of incidents or problems, aimed at preventing their recurrence and improving processes.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      actionId:
        type: text
      description:
        type: text
      dueDate:
        type: date
  CustomerChannel:
    meaning: The various avenues through which customers access banking services.
    aliases: []
    properties:
      channelId:
        type: text
      currentStatus:
        type: text
      description:
        type: text
      name:
        type: text
  Runbook:
    meaning: A documented operational procedure that outlines the steps to diagnose, respond to, and recover from incidents or problems.
    aliases:
      - playbook
    properties:
      description:
        type: text
      lastUpdated:
        type: date
      runbookId:
        type: text
      title:
        type: text
      version:
        type: text
  ThirdPartyService:
    meaning: An externally provided service that the bank relies on to support its IT services or business operations.
    aliases:
      - outsourced service
    properties:
      criticalityTier:
        type: text
      currentStatus:
        type: text
      description:
        type: text
      name:
        type: text
      serviceId:
        type: text
  ApplicationOwner:
    meaning: The person responsible for the operational fitness and effectiveness of a specific application within the bank's technology landscape.
    aliases: []
    properties: {}
  EvidenceItem:
    meaning: A preserved record or artifact collected during an incident investigation that supports analysis and accountability.
    aliases: []
    properties:
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
  BusinessLine:
    meaning: A distinct operational division within the bank that encapsulates specific customer segments, products, or services offered.
    aliases: []
    properties:
      name:
        type: text
  Change:
    meaning: A controlled modification, addition, or removal of IT infrastructure or services that may affect their operation.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  Deployment:
    meaning: The process of executing and implementing a change, typically involving the installation or activation of new software or system configurations.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
  Event:
    meaning: An observable occurrence in the IT environment that can indicate a change in state or noteworthy activity, which is monitored for potential impact on services.
    aliases: []
    properties: {}
  IncidentCommander:
    meaning: The person accountable for coordinating the response to a major incident, ensuring effective communication and decision-making throughout the incident lifecycle.
    aliases:
      - incident manager
    properties:
      name:
        type: text
  ServiceCriticalityTier:
    meaning: A classification that indicates the importance and urgency of an IT service, guiding priorities for incident response and management.
    aliases: []
    properties:
      name:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  TechnicalOwner:
    meaning: The individual or role responsible for the engineering, maintenance, and operational fitness of a specific configuration item or technology.
    aliases: []
    properties:
      name:
        type: text
  Evidence:
    meaning: Collected records or artifacts supporting the analysis and accountability of incidents, ensuring transparency and compliance.
    aliases: []
    properties:
      collectionTimestamp:
        type: date
      evidenceId:
        type: text
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      storageLocation:
        type: text
  Regulator:
    meaning: An authoritative body that oversees compliance with legal and operational standards within the banking industry, receiving necessary notifications.
    aliases: []
    properties:
      authorityType:
        type: text
      contactInformation:
        type: text
      name:
        type: text
      regulatorId:
        type: text
  Stakeholder:
    meaning: A person or group with an interest or stake in the operational outcomes of an incident or related processes, often requiring communication and updates.
    aliases: []
    properties:
      contactInformation:
        type: text
      name:
        type: text
      stakeholderId:
        type: text
relationships:
  - name: affects
    from: Incident
    to: ITService
    meaning: This relationship shows that an incident can have a direct effect on the performance or availability of an IT service.
    aliases: []
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: This relationship shows that an incident has been evaluated for its significance and potential regulatory reporting implications through a materiality assessment.
    aliases: []
  - name: assignedToOnCallEngineer
    from: Incident
    to: OnCallEngineer
    meaning: This relationship specifies which on-call engineer is directly responsible for managing the incident at a given time.
    aliases: []
  - name: hasRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: This relationship indicates that an incident is linked to a regulatory notification submitted to authorities in response to the incident.
    aliases: []
  - name: ownedBy
    from: ITService
    to: ServiceOwner
    meaning: This relationship designates the individual responsible for overall management and accountability of a specific IT service.
    aliases: []
  - name: supports
    from: ITService
    to: BusinessService
    meaning: This relationship indicates that an IT service provides the necessary technological capabilities that enable the delivery of a business service.
    aliases: []
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: This relationship indicates that an incident has been allocated to a specific resolver group responsible for managing and resolving it.
    aliases: []
  - name: hasWorkaround
    from: Incident
    to: Workaround
    meaning: This relationship indicates that a specific workaround exists to temporarily mitigate the impact of the incident until a permanent resolution is implemented.
    aliases: []
  - name: impacts
    from: Incident
    to: BusinessService
    meaning: This relationship indicates that an incident can disrupt or negatively influence the functioning of a business service.
    aliases: []
  - name: hasRecoveryPlan
    from: ITService
    to: RecoveryPlan
    meaning: This relationship indicates that a specific IT service is linked to a defined recovery plan outlining the steps for restoration after an incident.
    aliases: []
  - name: hasAssociatedPostIncidentReview
    from: ITService
    to: PostIncidentReview
    meaning: This relationship shows that an IT service is connected to a post-incident review aimed at analyzing handling and outcomes of incidents affecting it.
    aliases: []
  - name: coordinatedBy
    from: Incident
    to: IncidentResponseTeam
    meaning: This relationship denotes that an incident is under the guidance and management of the incident response team for effective resolution.
    aliases: []
  - name: supportedByResolverGroup
    from: ITService
    to: ResolverGroup
    meaning: Indicates that a specific resolver group is responsible for providing support and expertise for a particular IT service.
    aliases: []
  - name: hasOnCallEngineer
    from: ResolverGroup
    to: OnCallEngineer
    meaning: Describes the relationship where a resolver group includes specific on-call engineers who are available to assist with incident resolution.
    aliases: []
  - name: usesRunbook
    from: Incident
    to: Runbook
    meaning: Signifies that an incident is being managed using a specific runbook that outlines the procedures for addressing the issue.
    aliases: []
  - name: tracksCorrectiveAction
    from: PostIncidentReview
    to: CorrectiveAction
    meaning: Signifies that a post-incident review documents and monitors the implementation of corrective actions identified to prevent future incidents.
    aliases:
      - monitors corrective action
  - name: dependsOnConfigurationItem
    from: ITService
    to: ConfigurationItem
    meaning: Indicates that an IT service relies on specific configuration items to function effectively and maintain service delivery.
    aliases: []
  - name: dependsOnThirdPartyService
    from: ITService
    to: ThirdPartyService
    meaning: Signifies that an IT service requires external third-party services for its operations and functionality.
    aliases: []
rules:
  declareMajorIncidentAllowed:
    conditions:
      - The incident severity must be either sev1-critical or sev2-high.
      - The incident must affect at least one IT service or impact at least one business service.
      - The incident response team must be identified for coordination efforts.
  submitRegulatoryNotificationAllowed:
    conditions:
      - The incident must have an associated materiality assessment.
      - The status of the materiality assessment must be marked as completed or reviewed.
      - The materiality assessment must indicate that regulatory notification is required.
  restoreFromBackupAllowed:
    conditions:
      - The IT service must have an associated recovery plan.
      - The IT service status must be unavailable, partially-unavailable, or recovering.
  canCloseIncident:
    conditions:
      - The incident status is resolved or monitoring.
      - All impacted IT services have health state healthy or accepted-residual-condition.
      - Incident evidence checks are complete.
      - Incident closure conditions are complete.
      - All required stakeholder communications have been completed.
  canExecuteEmergencyChange:
    conditions:
      - The change is linked to an active incident.
      - The implementation plan for the emergency change is prepared and approved.
      - A backout plan is available to revert the change if necessary.
      - The affected configuration items are identified.
      - The risk associated with the emergency change has been explicitly accepted.
  canAssignIncident:
    conditions:
      - The incident is not closed or cancelled.
  canContainIncident:
    conditions:
      - The incident status is acknowledged or investigating.
  canExecuteEmergencyChange2:
    conditions:
      - The emergency change status is approved.
  canRestoreBackup:
    conditions:
      - The backup set status is successful or verified.
  requiresRegulatoryNotification:
    conditions:
      - The incident has a materiality assessment.
      - The materiality assessment result is reportable.
actions:
  acknowledgeIncomingAlert:
    input: Alert
    preconditions: []
    effect: An incoming alert is acknowledged and marked for review.
    verification: Confirm the alert is recorded as acknowledged and marked for review.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions: []
    effect: The incident is assigned to the appropriate resolver group.
    verification: Confirm the incident shows the intended resolver group assignment.
  containIncident:
    input: Incident
    preconditions: []
    effect: Predefined mitigation steps are implemented to minimize incident impact.
    verification: Confirm the mitigation steps were recorded and the incident impact is reduced or contained.
  declareMajorIncident:
    input: Incident
    preconditions:
      - declareMajorIncidentAllowed
    effect: The incident is declared a major incident and enhanced coordination and communication procedures are initiated.
    verification: Confirm the incident is marked as a major incident and the related coordination procedures have started.
  executeEmergencyChange:
    input: Incident
    preconditions: []
    effect: An emergency change is executed to address a critical issue linked to the active incident.
    verification: Confirm the emergency change was executed and linked to the incident.
  restoreFromBackup:
    input: ITService
    preconditions:
      - restoreFromBackupAllowed
    effect: The recovery plan is executed to restore the affected IT service from backup.
    verification: Confirm the IT service is restored in line with its recovery plan.
  sendStakeholderCommunications:
    input: Incident
    preconditions: []
    effect: Stakeholder communications are sent to relevant parties about the incident status and updates.
    verification: Confirm the communications were sent to the intended parties and logged.
  submitRegulatoryNotification:
    input: Incident
    preconditions:
      - submitRegulatoryNotificationAllowed
    effect: A regulatory notification is submitted when the incident meets reporting criteria.
    verification: Confirm the regulatory notification was submitted and recorded.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: The incident status becomes closed after resolution and completion checks.
    verification: Confirm the incident record shows closed status and completion evidence is present.
  conductPostIncidentReview:
    input: PostIncidentReview
    preconditions: []
    effect: A review session is held, findings are documented, and follow-up actions are identified.
    verification: Verify that all review findings are recorded and corrective actions are tracked.
