competency_questions:
  - id: cq1
    text: Which business services are impacted by the current incident?
  - id: cq2
    text: Who is the service owner for the affected IT service, and what is their contact information?
  - id: cq3
    text: Which resolver group is assigned to handle this incident, and who is the on-call engineer responsible?
  - id: cq4
    text: What are the recovery objectives and approved recovery plan for the impacted service?
  - id: cq5
    text: Is there a known workaround available for this incident, and how should it be implemented?
  - id: cq6
    text: Has a materiality assessment been performed for this incident, and does it require a regulatory notification?
  - id: cq7
    text: What evidence has been collected for the incident, and what is its integrity status?
  - id: cq8
    text: What are the outcomes of the last post-incident review for the services involved in this incident?
classes:
  Alert:
    meaning: A notification generated by monitoring tools that indicates a condition requiring attention and potential action.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      alertId:
        type: text
      detectionSource:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      summary:
        type: text
      timestampRaised:
        type: date
  BusinessService:
    meaning: A capability delivered by the bank that directly supports customer-facing processes and outcomes.
    aliases: []
    properties:
      availabilityTarget:
        type: text
      currentStatus:
        type: text
      description:
        type: text
      name:
        type: text
      serviceId:
        type: text
  Incident:
    meaning: An unplanned interruption or degradation of service that requires managed response to restore normal operations.
    aliases: []
    properties:
      incidentSeverity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      incidentNature:
        type: text
        allowed:
          - operational
          - cybersecurity
      resolutionSummary:
        type: text
      stakeholderCommunicationStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - sent
          - archived
      businessImpactSummary:
        type: text
      closureSummary:
        type: text
      majorIncidentDeclared:
        type: boolean
      stepsTakenSummary:
        type: text
      openedTime:
        type: date
  ITService:
    meaning: A technology service managed by the bank that underpins one or more business services, ensuring their availability and performance.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      serviceTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      availabilityTarget:
        type: text
      description:
        type: text
      name:
        type: text
  MaterialityAssessment:
    meaning: A documented evaluation that determines the significance of an incident and whether it requires formal regulatory reporting.
    aliases: []
    properties:
      requiresRegulatoryNotification:
        type: boolean
      status:
        type: text
        allowed:
          - not-started
          - in-progress
          - completed
          - reviewed
      finding:
        type: text
      assessmentId:
        type: text
      assessmentTimestamp:
        type: date
      rationale:
        type: text
      result:
        type: text
        allowed:
          - reportable
          - not-reportable
  OnCallEngineer:
    meaning: A technical specialist available to respond to urgent incidents and operational issues outside of regular business hours.
    aliases: []
    properties:
      contactInformation:
        type: text
      currentStatus:
        type: text
      engineerId:
        type: text
      name:
        type: text
  PostIncidentReview:
    meaning: A structured examination conducted after an incident to analyze its causes, assess response effectiveness, and identify improvements.
    aliases:
      - PIR
    properties:
      outcome:
        type: text
      dateHeld:
        type: date
      findingsSummary:
        type: text
      reviewId:
        type: text
      status:
        type: text
  ResolverGroup:
    meaning: A designated team responsible for diagnosing, resolving, and restoring services affected by incidents.
    aliases:
      - support group
    properties:
      supportDomain:
        type: text
      currentStatus:
        type: text
      expertiseArea:
        type: text
      groupId:
        type: text
      name:
        type: text
  Workaround:
    meaning: A temporary solution implemented to reduce or bypass the impact of an incident without necessarily addressing its root cause.
    aliases: []
    properties:
      implementationInstructions:
        type: text
      usageSummary:
        type: text
      title:
        type: text
      description:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
      workaroundId:
        type: text
  EmergencyChange:
    meaning: A change implemented quickly in response to a critical incident to restore services or mitigate immediate risks.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      changeId:
        type: text
      description:
        type: text
      implementationTimestamp:
        type: date
  IncidentResponseTeam:
    meaning: A cross-functional group tasked with coordinating responses to major incidents to minimize impact and restore services.
    aliases:
      - IRT
    properties:
      currentStatus:
        type: text
      expertiseArea:
        type: text
      name:
        type: text
      teamId:
        type: text
  RegulatoryNotification:
    meaning: A formal communication submitted to regulatory authorities to inform them of an incident that meets mandatory reporting criteria.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueDate:
        type: date
      notificationId:
        type: text
      submissionTimestamp:
        type: date
  ServiceOwner:
    meaning: The individual accountable for the overall management and performance of a specific IT service throughout its lifecycle.
    aliases: []
    properties:
      contactInformation:
        type: text
      name:
        type: text
      ownerId:
        type: text
  Evidence:
    meaning: A preserved record or artifact collected during incident management to support investigation, analysis, and decision-making.
    aliases: []
    properties:
      collectionSummary:
        type: text
      integrityMaintained:
        type: boolean
      evidenceId:
        type: text
      storageLocation:
        type: text
  Runbook:
    meaning: A set of documented procedures and guidelines for managing, responding to, and recovering from specific operational tasks or incidents.
    aliases: []
    properties:
      title:
        type: text
      usageSummary:
        type: text
      description:
        type: text
      lastUpdated:
        type: date
      runbookId:
        type: text
      version:
        type: text
  ApplicationOwner:
    meaning: The person responsible for the operational fitness and effectiveness of a specific application within the bank's technology landscape.
    aliases: []
    properties: {}
  EvidenceItem:
    meaning: A preserved record or artifact collected during an incident investigation that supports analysis and accountability.
    aliases: []
    properties:
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
  RecoveryPlan:
    meaning: A documented strategy that outlines the processes and steps necessary to restore an IT service and its dependencies after an incident.
    aliases: []
    properties:
      approvalStatus:
        type: text
        allowed:
          - approved
          - pending approval
          - not approved
          - draft
      recoveryObjective:
        type: text
  CommunicationsPersonnel:
    meaning: The staff responsible for preparing and managing communications related to incidents, ensuring clarity and consistency in messaging.
    aliases: []
    properties: {}
  IncidentCommander:
    meaning: The individual responsible for coordinating and managing the response to a major incident, ensuring effective communication and decision-making.
    aliases:
      - incident manager
      - MIM lead
    properties: {}
  KnownError:
    meaning: A documented problem that has been analyzed, identifying its cause and often providing a workaround until a permanent solution is implemented.
    aliases: []
    properties: {}
  Problem:
    meaning: The underlying cause or potential cause of one or more incidents that requires investigation to prevent future occurrences.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - investigating
          - root-cause-known
          - known-error
          - resolved
          - closed
  RegulatoryOfficer:
    meaning: The designated individual responsible for ensuring compliance with regulatory requirements and managing notifications to relevant authorities.
    aliases:
      - compliance officer
    properties: {}
  SecurityEvent:
    meaning: An event that indicates an occurrence relevant to the security of information systems, often associated with potential threats or breaches.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - active
          - resolved
  StakeholderCommunication:
    meaning: A controlled message sent to relevant parties regarding the status and updates of an incident, ensuring transparency and information sharing.
    aliases:
      - notification
      - update
    properties:
      receiptConfirmed:
        type: boolean
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - sent
          - archived
  BackupSet:
    meaning: A defined collection of recoverable data and backups used to restore IT services and data if needed.
    aliases: []
    properties:
      backupSetId:
        type: text
      description:
        type: text
      lastSuccessfulBackupTimestamp:
        type: date
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
  ConfigurationItem:
    meaning: A managed component within the IT infrastructure that is tracked for its role and relationships in supporting IT services.
    aliases:
      - CI
    properties:
      ciId:
        type: text
      criticalityTier:
        type: text
      currentStatus:
        type: text
      location:
        type: text
      name:
        type: text
      type:
        type: text
  CorrectiveAction:
    meaning: A tracked action intended to address the root causes of an incident and prevent recurrence, often resulting from a post-incident review.
    aliases: []
    properties:
      actionId:
        type: text
      description:
        type: text
      dueDate:
        type: date
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
  CustomerChannel:
    meaning: The pathways through which customers interact with the bank to access services and conduct transactions.
    aliases:
      - customer interface
      - service channel
    properties:
      channelId:
        type: text
      currentStatus:
        type: text
      description:
        type: text
      name:
        type: text
  Regulator:
    meaning: An authoritative body that oversees compliance with legal and operational standards within the banking industry, receiving necessary notifications.
    aliases: []
    properties:
      authorityType:
        type: text
      contactInformation:
        type: text
      name:
        type: text
      regulatorId:
        type: text
  Stakeholder:
    meaning: A person or group with an interest or stake in the operational outcomes of an incident or related processes, often requiring communication and updates.
    aliases: []
    properties:
      contactInformation:
        type: text
      name:
        type: text
      stakeholderId:
        type: text
  ThirdPartyService:
    meaning: An external service or solution provided by a vendor that the bank relies on to deliver its own services effectively.
    aliases:
      - external service
      - vendor service
    properties:
      criticalityTier:
        type: text
      currentStatus:
        type: text
      description:
        type: text
      name:
        type: text
      serviceId:
        type: text
relationships:
  - name: impacts
    from: Incident
    to: BusinessService
    meaning: This relationship indicates that an incident can disrupt or negatively influence the functioning of a business service.
    aliases: []
  - name: affects
    from: Incident
    to: ITService
    meaning: This relationship shows that an incident can have a direct effect on the performance or availability of an IT service.
    aliases: []
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: This relationship shows that an incident has been evaluated for its significance and potential regulatory reporting implications through a materiality assessment.
    aliases: []
  - name: assignedToOnCallEngineer
    from: Incident
    to: OnCallEngineer
    meaning: This relationship specifies which on-call engineer is directly responsible for managing the incident at a given time.
    aliases: []
  - name: supports
    from: ITService
    to: BusinessService
    meaning: This relationship indicates that an IT service provides the necessary technological capabilities that enable the delivery of a business service.
    aliases: []
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: This relationship indicates that an incident has been allocated to a specific resolver group responsible for managing and resolving it.
    aliases: []
  - name: hasWorkaround
    from: Incident
    to: Workaround
    meaning: This relationship indicates that a specific workaround exists to temporarily mitigate the impact of the incident until a permanent resolution is implemented.
    aliases: []
  - name: hasRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: This relationship indicates that an incident is linked to a regulatory notification submitted to authorities in response to the incident.
    aliases: []
  - name: hasAssociatedPostIncidentReview
    from: ITService
    to: PostIncidentReview
    meaning: This relationship shows that an IT service is connected to a post-incident review aimed at analyzing handling and outcomes of incidents affecting it.
    aliases: []
  - name: ownedBy
    from: ITService
    to: ServiceOwner
    meaning: This relationship designates the individual responsible for overall management and accountability of a specific IT service.
    aliases: []
  - name: coordinatedBy
    from: Incident
    to: IncidentResponseTeam
    meaning: This relationship denotes that an incident is under the guidance and management of the incident response team for effective resolution.
    aliases: []
  - name: hasRunbook
    from: Incident
    to: Runbook
    meaning: This runbook is relevant to handling this incident.
    aliases:
      - associated with runbook
  - name: hasEvidence
    from: Incident
    to: Evidence
    meaning: This evidence has been collected for this incident.
    aliases:
      - includes evidence collected
  - name: supportedByResolverGroup
    from: ITService
    to: ResolverGroup
    meaning: This service is supported by this resolver group.
    aliases:
      - managed by resolver group
  - name: hasOnCallEngineer
    from: ResolverGroup
    to: OnCallEngineer
    meaning: This resolver group’s current on-call engineer is this engineer.
    aliases: []
rules:
  declareMajorIncidentAllowed:
    conditions:
      - The incident severity must be either sev1-critical or sev2-high.
      - The incident must affect at least one IT service or impact at least one business service.
      - The incident response team must be identified for coordination efforts.
  canSendStakeholderCommunication:
    conditions:
      - stakeholder communication status is approved
      - incident status is not closed or cancelled
  restoreFromBackupAllowed:
    conditions:
      - The IT service must have an associated recovery plan.
      - The IT service status must be unavailable, partially-unavailable, or recovering.
  submitRegulatoryNotificationAllowed:
    conditions:
      - The incident must have an associated materiality assessment.
      - The status of the materiality assessment must be marked as completed or reviewed.
      - The materiality assessment must indicate that regulatory notification is required.
  canCloseIncident:
    conditions:
      - incident status is resolved
      - resolution summary is documented
      - evidence has been recorded
      - all necessary stakeholder communications have status sent or archived
      - impacted services have health state healthy or an accepted residual condition
  canFinalizeIncidentResolution:
    conditions:
      - incident status is resolved
      - resolution summary is documented
  requiresMaterialityAssessment:
    conditions:
      - incident severity is sev1-critical or sev2-high
      - or affected service criticality is tier-1-critical or tier-2-important
      - or incident is linked to a security event
      - or incident impacts multiple IT services
  canContainIncident:
    conditions:
      - The incident status is acknowledged or investigating.
  canExecuteEmergencyChange:
    conditions:
      - The emergency change status is approved.
  canRestoreBackup:
    conditions:
      - The backup set status is successful or verified.
  requiresRegulatoryNotification:
    conditions:
      - The incident has a materiality assessment.
      - The materiality assessment result is reportable.
actions:
  acknowledgeIncomingAlert:
    input: Alert
    preconditions: []
    effect: An incoming alert is acknowledged and marked for review.
    verification: Confirm the alert is recorded as acknowledged and marked for review.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions: []
    effect: The incident is assigned to the appropriate resolver group.
    verification: Confirm the incident shows the intended resolver group assignment.
  containIncident:
    input: Incident
    preconditions: []
    effect: Predefined mitigation steps are implemented to minimize incident impact.
    verification: Confirm the mitigation steps were recorded and the incident impact is reduced or contained.
  declareMajorIncident:
    input: Incident
    preconditions:
      - declareMajorIncidentAllowed
    effect: The incident is declared a major incident and enhanced coordination and communication procedures are initiated.
    verification: Confirm the incident is marked as a major incident and the related coordination procedures have started.
  sendStakeholderCommunications:
    input: Incident
    preconditions: []
    effect: Stakeholder communications are sent to relevant parties about the incident status and updates.
    verification: Confirm the communications were sent to the intended parties and logged.
  executeEmergencyChange:
    input: Incident
    preconditions: []
    effect: An emergency change is executed to address a critical issue linked to the active incident.
    verification: Confirm the emergency change was executed and linked to the incident.
  restoreFromBackup:
    input: ITService
    preconditions:
      - restoreFromBackupAllowed
    effect: The recovery plan is executed to restore the affected IT service from backup.
    verification: Confirm the IT service is restored in line with its recovery plan.
  submitRegulatoryNotification:
    input: Incident
    preconditions:
      - submitRegulatoryNotificationAllowed
    effect: A regulatory notification is submitted when the incident meets reporting criteria.
    verification: Confirm the regulatory notification was submitted and recorded.
  applyWorkaround:
    input: Incident
    preconditions: []
    effect: Mitigation steps are applied, incident stepsTakenSummary is updated, and any incident impact metrics are updated if applicable.
    verification: Confirm mitigation steps are recorded and incident impact is reduced or contained.
  conductMaterialityAssessment:
    input: Incident
    preconditions:
      - requiresMaterialityAssessment
    effect: A materiality assessment is created or updated with required=true and a finding is recorded.
    verification: Confirm Incident -> hasMaterialityAssessment -> MaterialityAssessment exists and the finding is populated.
  conductPostIncidentReview:
    input: Incident
    preconditions: []
    effect: A post-incident review is completed, linked to the incident, and lessons learned are documented.
    verification: Confirm Incident -> hasPostIncidentReview -> PostIncidentReview is present and review outcomes are recorded.
  finalizeIncidentResolution:
    input: Incident
    preconditions:
      - canFinalizeIncidentResolution
    effect: Resolution summary is completed and supporting evidence is recorded.
    verification: Confirm resolution summary is present and incident evidence is linked.
  investigateIncident:
    input: Incident
    preconditions: []
    effect: Investigation findings are documented, relevant evidence is linked, and incident stepsTakenSummary is updated.
    verification: Confirm findings are documented and Incident -> hasEvidence -> Evidence exists where evidence was collected.
