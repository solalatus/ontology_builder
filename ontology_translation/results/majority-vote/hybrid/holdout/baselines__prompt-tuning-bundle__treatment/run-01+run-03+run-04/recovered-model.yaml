competency_questions:
  - id: cq1
    text: Which business services are impacted by this incident?
  - id: cq2
    text: Who is the responsible service owner for the affected IT service?
  - id: cq3
    text: What is the severity level of the current incident?
  - id: cq4
    text: Does this incident meet the criteria for major-incident declaration?
  - id: cq5
    text: Which resolver group should be assigned to investigate this incident?
  - id: cq6
    text: Are there any active alerts that correlate with this incident?
  - id: cq7
    text: Is a materiality assessment needed for this incident, and when is it due?
  - id: cq8
    text: What communications have been sent to stakeholders regarding this incident?
  - id: cq9
    text: What recovery plan is applicable for restoring the affected service?
  - id: cq10
    text: Which configuration items are associated with the impacted IT service?
  - id: cq11
    text: Is there a known error linked to this incident that can provide a workaround?
  - id: cq12
    text: What is the status of the regulatory notification related to this incident?
  - id: cq13
    text: Who is the incident commander assigned to manage this incident response?
classes:
  Alert:
    meaning: An alert is a notification generated by monitoring tools that indicates a condition requiring attention related to IT services.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      identifier:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      triggerTimestamp:
        type: date
      alertSource:
        type: text
      alertTime:
        type: date
      contextAvailable:
        type: boolean
  ConfigurationItem:
    meaning: A configuration item is a managed component within the IT environment that is recorded and tracked for operational purposes.
    aliases:
      - konfigurációs elem
    properties:
      status:
        type: text
        allowed:
          - operational
          - under-maintenance
          - retired
      identifier:
        type: text
      name:
        type: text
      isolationImpactAssessed:
        type: boolean
      reconnectionMethodAvailable:
        type: boolean
  Incident:
    meaning: An incident is an unplanned interruption or degradation of an IT service that requires managed response.
    aliases: []
    properties:
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      detectionTime:
        type: date
      summary:
        type: text
      identifier:
        type: text
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      containmentEffective:
        type: boolean
      majorIncidentDeclared:
        type: boolean
      reviewOutcome:
        type: text
        allowed:
          - assessed
          - actionable improvements
          - no further action needed
          - acknowledgment of lessons learned
  MaterialityAssessment:
    meaning: A materiality assessment is an evaluation that determines the significance of an incident and whether it requires regulatory reporting.
    aliases:
      - lényegességi értékelés
    properties:
      dueDate:
        type: date
      status:
        type: text
        allowed:
          - open
          - completed
          - pending-review
      identifier:
        type: text
      rationale:
        type: text
      assessmentTime:
        type: date
  RegulatoryNotification:
    meaning: A regulatory notification is a formal submission made to a regulatory authority to inform them about incidents with potential compliance implications.
    aliases:
      - felügyeleti bejelentés
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submissionTimestamp:
        type: date
      dueDate:
        type: date
      identifier:
        type: text
  ResolverGroup:
    meaning: A resolver group is a team assigned to diagnose and restore a specific technology or service area affected by an incident.
    aliases:
      - megoldócsoport
    properties:
      status:
        type: text
        allowed:
          - available
          - on-call
          - busy
      identifier:
        type: text
      name:
        type: text
      supportScope:
        type: text
        allowed:
          - application-support
          - infrastructure-support
          - network-support
          - security-support
          - database-support
  BusinessService:
    meaning: A business service is a capability delivered by the bank that directly meets customer or business needs.
    aliases: []
    properties:
      regulatoryRelevant:
        type: boolean
      currentStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
  IncidentCommander:
    meaning: An incident commander is the individual accountable for coordinating the response to a major incident and making operational decisions during the incident lifecycle.
    aliases:
      - incidensparancsnok
    properties: {}
  RecoveryPlan:
    meaning: A recovery plan is a documented strategy outlining the steps to restore an IT service and its dependencies after an incident.
    aliases:
      - helyreállítási terv
    properties:
      status:
        type: text
        allowed:
          - current
          - invoked
          - obsolete
  ServiceOwner:
    meaning: A service owner is the individual responsible for the overall management and performance of an IT service throughout its lifecycle.
    aliases:
      - szolgáltatásgazda
    properties:
      identifier:
        type: text
      name:
        type: text
  BackupSet:
    meaning: A backup set is a defined collection of data that has been backed up and can be restored in case of data loss or system failure.
    aliases:
      - mentéskészlet
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      backupType:
        type: text
        allowed:
          - full
          - incremental
          - differential
      identifier:
        type: text
      lastBackupDate:
        type: date
      verificationTime:
        type: date
  Event:
    meaning: An event is an observable occurrence in the IT environment that may indicate a change in the state of a service or system and can be monitored for potential incidents.
    aliases:
      - esemény
    properties:
      eventType:
        type: text
        allowed:
          - incident
          - maintenance
          - upgrade
          - outage
          - service change
      identifier:
        type: text
      source:
        type: text
      timestamp:
        type: date
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - resolved
          - closed
  EvidenceItem:
    meaning: An evidence item is a preserved record or artifact collected during incident management to support analysis and accountability.
    aliases:
      - bizonyíték
    properties:
      integrityStatus:
        type: text
        allowed:
          - collected
          - verified
          - sealed
          - compromised
      captureDate:
        type: date
      identifier:
        type: text
      link:
        type: text
      collectionTime:
        type: date
      integrityState:
        type: text
        allowed:
          - intact
          - compromised
  Workaround:
    meaning: A workaround is a temporary solution implemented to reduce or bypass the impact of an incident before a permanent fix is available.
    aliases:
      - kerülőmegoldás
    properties:
      status:
        type: text
        allowed:
          - available
          - under-evaluation
          - deprecated
      description:
        type: text
      identifier:
        type: text
      approvalFlag:
        type: boolean
  Communication:
    meaning: A communication is a controlled message sent to stakeholders regarding the status or details of an incident.
    aliases:
      - értesítés
    properties:
      sentTime:
        type: date
      status:
        type: text
        allowed:
          - draft
          - sent
          - failed
          - archived
  ITService:
    meaning: An IT service is a managed technology capability that supports one or more business services.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  KnownError:
    meaning: A known error is a diagnosed issue that has an identified root cause and may have an associated workaround documented.
    aliases:
      - ismert hiba
    properties:
      workaround:
        type: text
  CorrectiveAction:
    meaning: A corrective action is a tracked step aimed at addressing the root cause of an incident to prevent future occurrences.
    aliases:
      - helyesbítő intézkedés
    properties:
      description:
        type: text
      dueDate:
        type: date
      identifier:
        type: text
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
  Regulator:
    meaning: A regulator is a governmental or authoritative body responsible for overseeing and enforcing compliance within the banking sector.
    aliases:
      - felügyeleti hatóság
    properties:
      identifier:
        type: text
      name:
        type: text
  Runbook:
    meaning: A runbook is a documented set of procedures and instructions for responding to specific operational scenarios, incidents, or maintenance tasks.
    aliases:
      - üzemeltetési eljárás
    properties:
      identifier:
        type: text
      name:
        type: text
      version:
        type: text
  SecondaryEnvironment:
    meaning: A secondary environment is an alternate operating setting used for testing, recovery, or operational continuity, such as a disaster recovery site.
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
        allowed:
          - operational
          - in-maintenance
          - out-of-service
  Service:
    meaning: A service is a capability provided by the bank to deliver value to customers, supported by IT and operational processes.
    aliases:
      - szolgáltatás
    properties:
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  Stakeholder:
    meaning: A stakeholder is any individual or group that has an interest in or is affected by the operations and services of the bank, including employees, customers, and regulators.
    aliases:
      - érintett
    properties:
      identifier:
        type: text
      name:
        type: text
      role:
        type: text
  ThirdPartyService:
    meaning: A third-party service is an external capability or service provided by a vendor that the bank relies on to support its operation.
    aliases:
      - külső szolgáltatás
    properties:
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  ApplicationOwner:
    meaning: The individual responsible for the functionality and operational fitness of a specific application.
    aliases: []
    properties: {}
  ChangeManager:
    meaning: The individual responsible for overseeing the change management process, including approvals and implementation of changes.
    aliases: []
    properties: {}
  CommunicationOwner:
    meaning: The person responsible for managing and delivering communication messages related to incidents.
    aliases: []
    properties: {}
  ComplianceOfficer:
    meaning: The individual tasked with ensuring that regulatory obligations are met regarding incidents and operational practices.
    aliases: []
    properties: {}
  ContainmentMeasure:
    meaning: Actions taken to limit the impact of an incident and prevent further degradation of services.
    aliases: []
    properties:
      containmentStatus:
        type: text
        allowed:
          - active
          - inactive
          - under-review
      expectedSideEffects:
        type: text
      scope:
        type: text
  EmergencyChange:
    meaning: A change made under expedited conditions to address urgent operational needs arising from an incident.
    aliases: []
    properties:
      backoutPlanDocumented:
        type: boolean
      changeStatus:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      implementationPlanDocumented:
        type: boolean
      implementationTime:
        type: date
      riskAccepted:
        type: boolean
  MajorIncidentDeclaration:
    meaning: The formal recognition of an incident that has significant impact, requiring enhanced coordination and management efforts.
    aliases: []
    properties:
      declarationStatus:
        type: text
        allowed:
          - active
          - resolved
          - cancelled
      declarationTime:
        type: date
  OnCallEngineer:
    meaning: The technical specialist available for immediate response to incident-related issues during their on-call shift.
    aliases: []
    properties: {}
  RecoveryEnvironment:
    meaning: A designated setting where services can be restored or failover activities occur during recovery efforts.
    aliases: []
    properties:
      currentStatus:
        type: text
        allowed:
          - available
          - unavailable
          - in-use
          - undergoing-maintenance
      environmentType:
        type: text
        allowed:
          - production
          - test
          - development
          - disaster-recovery
  RecoveryLead:
    meaning: The person who oversees the execution of recovery plans and manages restoration efforts following incidents.
    aliases: []
    properties: {}
  RecoveryObjective:
    meaning: A specific target defined to guide the restoration of services following an incident.
    aliases: []
    properties:
      objectiveDescription:
        type: text
      targetTime:
        type: date
  RootCause:
    meaning: The underlying reason identified for one or more incidents that provides insight into what went wrong.
    aliases: []
    properties:
      category:
        type: text
        allowed:
          - software-defect
          - configuration-error
          - capacity-shortage
          - hardware-failure
          - network-failure
          - human-error
          - process-failure
          - third-party-failure
          - cyber-attack
          - unknown
      recurrencePreventionMeasures:
        type: text
      status:
        type: text
        allowed:
          - under-investigation
          - confirmed
          - mitigated
  StakeholderCommunication:
    meaning: A controlled message sent to inform affected parties about the status and details of an incident.
    aliases: []
    properties:
      audience:
        type: text
        allowed:
          - technical
          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
      communicationStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - sent
          - archived
      plannedTime:
        type: date
      sentTime:
        type: date
  TechnicalOwner:
    meaning: The person accountable for the engineering and maintenance of a particular configuration item or service.
    aliases: []
    properties: {}
relationships:
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: The assignedTo relationship means that an incident is formally designated to a resolver group for investigation and resolution.
    aliases: []
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: The hasMaterialityAssessment relationship means that an incident is linked to a formal evaluation of its significance for reporting purposes.
    aliases: []
  - name: hasRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: The hasRegulatoryNotification relationship means that an incident is linked to a formal submission made to regulatory authorities.
    aliases: []
  - name: about
    from: RegulatoryNotification
    to: Incident
    meaning: The about relationship means that a regulatory notification concerns a specific incident.
    aliases: []
  - name: hasEvidenceItem
    from: Incident
    to: EvidenceItem
    meaning: An incident has an evidence item when a record or artifact supporting the incident investigation is collected and documented.
    aliases: []
  - name: triggeredByAlert
    from: Incident
    to: Alert
    meaning: An incident is triggered by an alert when the alert notification initiates the creation or acknowledgment of the incident.
    aliases: []
rules:
  canAcknowledgeAlert:
    conditions:
      - Alert status is new.
  canDeclareMajorIncident:
    conditions:
      - Incident severity is sev1-critical or sev2-high.
      - Incident status is not resolved, closed, or cancelled.
      - Incident affects at least one ITService.
      - Incident is managedBy an IncidentCommander.
  canSubmitRegulatoryNotification:
    conditions:
      - RegulatoryNotification status is pending-approval.
      - The related Incident has a MaterialityAssessment with status completed.
  canAssignIncidentToResolverGroup:
    conditions:
      - Incident status is not closed or cancelled.
      - Incident affects at least one ITService that is supportedBy the ResolverGroup.
  canDocumentReviewOutcome:
    conditions:
      - Incident status is resolved or closed.
  canSendCommunication:
    conditions:
      - The related Incident is managedBy an IncidentCommander.
      - Communication status is draft.
  canContainIncident:
    conditions:
      - incident status is acknowledged or investigating
  canRestoreBackup:
    conditions:
      - service has a backup set
  requiresMaterialityAssessment:
    conditions:
      - Incident severity is sev1-critical or sev2-high.
      - Incident status is new, acknowledged, or investigating.
      - Incident impacts at least one BusinessService where regulatoryRelevant is true.
  canAssignIncident:
    conditions:
      - incident impacts at least one service
  canCloseIncident:
    conditions:
      - incident status is resolved or monitoring
      - all services impacted by the incident are healthy
      - incident has evidence items recorded
  canExecuteServiceFailover:
    conditions:
      - service has a secondary environment
  canExecuteEmergencyChange:
    conditions:
      - Incident status is not resolved, closed, or cancelled.
      - Incident is linked to an EmergencyChange.
      - EmergencyChange implementationPlanDocumented is true.
      - EmergencyChange backoutPlanDocumented is true.
      - EmergencyChange riskAccepted is true.
  canFailOverRecoveryEnvironment:
    conditions:
      - RecoveryEnvironment currentStatus is available.
  canFailOverService:
    conditions:
      - Incident affects a BusinessService.
      - BusinessService has a RecoveryEnvironment whose currentStatus is available.
      - Incident has a RecoveryPlan.
      - BusinessService has a RecoveryObjective.
  canIsolateConfigurationItem:
    conditions:
      - Incident implicates the ConfigurationItem.
      - ConfigurationItem isolationImpactAssessed is true.
      - ConfigurationItem reconnectionMethodAvailable is true.
  canIsolateConfigurationItemDirect:
    conditions:
      - ConfigurationItem isolationImpactAssessed is true.
      - ConfigurationItem reconnectionMethodAvailable is true.
  canRestoreBackup2:
    conditions:
      - Incident uses a BackupSet whose backupStatus is successful or verified.
      - BackupSet restores a ConfigurationItem.
      - Incident implicates the ConfigurationItem.
      - Incident has a RecoveryPlan whose status is approved or in-progress.
  canSendApprovedStakeholderCommunication:
    conditions:
      - StakeholderCommunication communicationStatus is approved.
      - StakeholderCommunication audience is defined.
      - StakeholderCommunication is ownedBy a CommunicationOwner.
  canSubmitApprovedRegulatoryNotification:
    conditions:
      - RegulatoryNotification notificationStatus is approved.
actions:
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: Alert status becomes acknowledged.
    verification: Confirm Alert status is acknowledged.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions:
      - canAssignIncidentToResolverGroup
    effect: Incident is assignedTo the selected ResolverGroup.
    verification: Confirm the Incident is assignedTo the ResolverGroup.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: Incident majorIncidentDeclared becomes true and Incident status remains investigating.
    verification: Confirm Incident majorIncidentDeclared is true and Incident is managedBy an IncidentCommander.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: RegulatoryNotification status becomes submitted.
    verification: Confirm RegulatoryNotification status is submitted.
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: Record containment measures taken to reduce service impact.
    verification: Confirm containment measures are documented and impact is reduced or stabilized.
  restoreBackup:
    input: Service
    preconditions:
      - canRestoreBackup
    effect: Restore service data or components from a backup set.
    verification: Confirm the service or data has been restored from backup and is usable.
  sendStakeholderCommunication:
    input: Incident
    preconditions: []
    effect: Send incident information to relevant stakeholders.
    verification: Confirm the communication was issued to the intended stakeholders.
  documentPostIncidentReviewOutcome:
    input: Incident
    preconditions:
      - canDocumentReviewOutcome
    effect: Incident reviewOutcome is recorded.
    verification: Confirm Incident reviewOutcome is one of the allowed reviewOutcome values.
  notifyStakeholders:
    input: Communication
    preconditions:
      - canSendCommunication
    effect: Communication status becomes sent and Communication sentTime is recorded.
    verification: Confirm Communication status is sent and Communication sentTime is populated.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: Mark the incident as closed after resolution and verification are complete.
    verification: Confirm the incident is marked closed.
  documentEvidenceItem:
    input: Incident
    preconditions:
      - canDocumentReviewOutcome
    effect: Record and preserve evidence associated with an incident.
    verification: Confirm evidence associated with the incident is recorded and preserved.
  executeServiceFailover:
    input: Service
    preconditions:
      - canExecuteServiceFailover
    effect: Shift service operation to a secondary environment.
    verification: Confirm the service is operating from the secondary environment.
  executeEmergencyChange:
    input: EmergencyChange
    preconditions:
      - canExecuteEmergencyChange
    effect: An expedited change is implemented to address the incident.
    verification: Confirm the emergency change is recorded as implemented and linked to the incident.
  failOverService:
    input: RecoveryEnvironment
    preconditions:
      - canFailOverRecoveryEnvironment
    effect: RecoveryEnvironment currentStatus becomes in-use.
    verification: Confirm RecoveryEnvironment currentStatus is in-use.
  isolateConfigurationItem:
    input: ConfigurationItem
    preconditions:
      - canIsolateConfigurationItemDirect
    effect: ConfigurationItem currentStatus becomes affected.
    verification: Confirm ConfigurationItem currentStatus is affected.
