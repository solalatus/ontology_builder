competency_questions:
  - id: cq1
    text: What business services are currently impacted by this incident, and how are they affecting our customers?
  - id: cq2
    text: Can you identify the configuration items involved in the incident and their dependency paths?
  - id: cq3
    text: Can you identify the third-party services involved in the incident and their dependency paths?
  - id: cq4
    text: What alerts are related to this incident, and what are their current statuses?
  - id: cq5
    text: What events are related to this incident, and what are their current statuses?
  - id: cq6
    text: Who is the service owner for the affected IT service?
  - id: cq7
    text: Which resolver group should be assigned to address this incident?
  - id: cq8
    text: Does this incident meet the criteria for declaring it a major incident?
  - id: cq9
    text: If this incident is declared a major incident, what are the next steps?
  - id: cq10
    text: What runbook or workaround can be used to manage this incident effectively right now?
  - id: cq11
    text: Was this incident triggered by a recent change?
  - id: cq12
    text: Was this incident triggered by a recent deployment?
  - id: cq13
    text: How should a recent change or deployment be taken into account for this incident?
  - id: cq14
    text: Does this incident require a materiality assessment?
  - id: cq15
    text: Are any regulatory notifications due for this incident?
  - id: cq16
    text: Have all necessary communications with stakeholders been sent?
  - id: cq17
    text: What was the content of the communications sent about this incident?
  - id: cq18
    text: Are there any corrective actions from previous post-incident reviews that are still open and relevant to the affected service?
classes:
  ConfigurationItem:
    meaning: A managed technical component that can be involved in incidents and dependencies.
    aliases:
      - CI
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - isolated
          - unknown
      identifier:
        type: text
      configurationItemId:
        type: text
      ciType:
        type: text
        allowed:
          - application
          - database
          - server
          - network-device
      currentState:
        type: text
        allowed:
          - active
          - inactive
          - under-maintenance
          - retired
  Incident:
    meaning: A disruption or degradation that affects or threatens services and requires coordinated operational handling.
    aliases:
      - issue
      - ticket
    properties:
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      customerImpactSummary:
        type: text
      incidentId:
        type: text
      majorIncidentState:
        type: text
        allowed:
          - 'true'
          - 'false'
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      declarationAuthorityAssigned:
        type: boolean
      declaredMajorAt:
        type: date
      defaultResolverGroupName:
        type: text
      detectedAt:
        type: date
      hasComplianceImplication:
        type: boolean
      title:
        type: text
      identifier:
        type: text
      currentState:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
  RegulatoryNotification:
    meaning: A formal notification submitted to a regulator about an incident that meets reporting criteria.
    aliases:
      - reporting notification
    properties:
      dueAt:
        type: date
      notificationId:
        type: text
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submittedAt:
        type: date
      identifier:
        type: text
      submissionTimestamp:
        type: date
      currentState:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  ResolverGroup:
    meaning: A team responsible for investigating or resolving incidents affecting supported services or components.
    aliases:
      - support group
    properties:
      name:
        type: text
      resolverGroupId:
        type: text
      identifier:
        type: text
      status:
        type: text
        allowed:
          - available
          - on-call
          - busy
      currentState:
        type: text
        allowed:
          - active
          - inactive
  ServiceOwner:
    meaning: The person accountable for an IT service and its overall service outcomes.
    aliases:
      - service manager
    properties:
      name:
        type: text
      contactChannel:
        type: text
      identifier:
        type: text
      currentState:
        type: text
  Alert:
    meaning: A signal indicating a condition that may require investigation or response in relation to an incident.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      acknowledgedAt:
        type: date
      alertId:
        type: text
      identifier:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      triggerTimestamp:
        type: date
  BackupSet:
    meaning: A recorded backup snapshot or set used for restoration during recovery.
    aliases: []
    properties:
      backupTime:
        type: date
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      backupSetId:
        type: text
      identifier:
        type: text
      lastBackupDate:
        type: date
  BusinessService:
    meaning: A business-facing service whose disruption can affect customers or business operations.
    aliases: []
    properties:
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      name:
        type: text
      businessContext:
        type: text
      businessServiceId:
        type: text
      customerImpactSummary:
        type: text
      currentState:
        type: text
        allowed:
          - operational
          - degraded
          - unavailable
          - retired
  CorrectiveAction:
    meaning: A follow-up action intended to reduce the chance or impact of future incidents.
    aliases:
      - remediation action
    properties:
      dueAt:
        type: date
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      correctiveActionId:
        type: text
      description:
        type: text
      identifier:
        type: text
  Event:
    meaning: An observed occurrence that may help explain, detect, or correlate an incident.
    aliases: []
    properties:
      eventId:
        type: text
      observedAt:
        type: date
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - closed
      identifier:
        type: text
      source:
        type: text
      timestamp:
        type: date
  Evidence:
    meaning: Supporting material collected to substantiate incident handling, assessment, or reporting.
    aliases: []
    properties:
      collectedAt:
        type: date
      evidenceId:
        type: text
      status:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      currentState:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      evidenceType:
        type: text
        allowed:
          - document
          - log
          - screenshot
          - analysis
  ITService:
    meaning: A technical service that supports one or more business services.
    aliases:
      - technical service
    properties:
      name:
        type: text
      isInRecovery:
        type: boolean
      itServiceId:
        type: text
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      currentState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
  MaterialityAssessment:
    meaning: An assessment used to determine the significance of an incident for governance or reporting purposes.
    aliases: []
    properties:
      assessmentId:
        type: text
      status:
        type: text
        allowed:
          - new
          - in_progress
          - completed
      completedAt:
        type: date
      dueAt:
        type: date
      outcome:
        type: text
        allowed:
          - not_reportable
          - potentially_reportable
          - reportable
      identifier:
        type: text
      rationale:
        type: text
  Runbook:
    meaning: A documented operational procedure used to respond to or manage an incident.
    aliases:
      - playbook
      - operational procedure
    properties:
      runbookId:
        type: text
      status:
        type: text
        allowed:
          - active
          - outdated
          - under_review
      title:
        type: text
      identifier:
        type: text
      name:
        type: text
      version:
        type: text
  Stakeholder:
    meaning: A person or group that needs to receive information or updates about an incident.
    aliases: []
    properties:
      name:
        type: text
      contactChannel:
        type: text
      identifier:
        type: text
      role:
        type: text
  ThirdPartyService:
    meaning: An externally provided service that an IT service depends on or that can be involved in an incident.
    aliases:
      - outsourced service
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - unavailable
          - recovering
          - unknown
      thirdPartyServiceId:
        type: text
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      identifier:
        type: text
  Workaround:
    meaning: A temporary operational measure used to reduce incident impact before a permanent fix is in place.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - active
          - deprecated
      title:
        type: text
      workaroundId:
        type: text
      description:
        type: text
      identifier:
        type: text
  ApplicationOwner:
    meaning: The person responsible for the day-to-day operational fitness of an application within an IT service.
    aliases: []
    properties:
      contactChannel:
        type: text
      name:
        type: text
  Change:
    meaning: A controlled modification to the environment that may affect services or incident handling.
    aliases:
      - modification
    properties:
      changeId:
        type: text
      emergencyChangeFlag:
        type: boolean
      implementedAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  Communication:
    meaning: A message created or sent to inform stakeholders about an incident or its handling.
    aliases:
      - notification
      - message
    properties:
      communicationId:
        type: text
      content:
        type: text
      sentAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - sent
          - pending-approval
  Deployment:
    meaning: The release or rollout of a technical change into an environment.
    aliases: []
    properties:
      deployedAt:
        type: date
      deploymentId:
        type: text
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
  OnCallEngineer:
    meaning: The designated engineer available to respond immediately to operational incidents or outages.
    aliases:
      - on-call support engineer
    properties:
      contactChannel:
        type: text
      name:
        type: text
      onCallStatus:
        type: text
        allowed:
          - available
          - unavailable
          - in-progress
  PostIncidentReview:
    meaning: A review conducted after an incident to analyze what happened and define follow-up actions.
    aliases:
      - PIR
      - after-action review
    properties:
      completedAt:
        type: date
      reviewId:
        type: text
      status:
        type: text
        allowed:
          - new
          - in-progress
          - completed
  RecoveryEnvironment:
    meaning: An alternate environment used to restore or continue service during recovery.
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - available
          - unavailable
          - under_maintenance
  EvidenceItem:
    meaning: An evidence item is a preserved record or artifact collected during incident management to support analysis and accountability.
    aliases:
      - bizonyíték
    properties:
      captureDate:
        type: date
      identifier:
        type: text
      integrityStatus:
        type: text
        allowed:
          - collected
          - verified
          - sealed
          - compromised
      link:
        type: text
  Regulator:
    meaning: A regulator is a governmental or authoritative body responsible for overseeing and enforcing compliance within the banking sector.
    aliases:
      - felügyeleti hatóság
    properties:
      identifier:
        type: text
      name:
        type: text
  SecondaryEnvironment:
    meaning: A secondary environment is an alternate operating setting used for testing, recovery, or operational continuity, such as a disaster recovery site.
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
        allowed:
          - operational
          - in-maintenance
          - out-of-service
  Service:
    meaning: A service is a capability provided by the bank to deliver value to customers, supported by IT and operational processes.
    aliases:
      - szolgáltatás
    properties:
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  AlertOrEvent:
    meaning: An alert or event is a time-stamped observation indicating a noteworthy occurrence related to IT services or security.
    aliases: []
    properties:
      alertIdentifier:
        type: text
      alertType:
        type: text
        allowed:
          - performance
          - security
          - availability
          - operational
      currentState:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      detectedAt:
        type: date
  EmergencyChange:
    meaning: An emergency change is a change processed under an accelerated path to address an urgent operational need.
    aliases: []
    properties:
      changeId:
        type: text
      currentState:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      validFrom:
        type: date
      validTo:
        type: date
  RecoveryPlan:
    meaning: A recovery plan is a documented plan for restoring an IT service and its dependencies after an incident.
    aliases: []
    properties:
      currentState:
        type: text
        allowed:
          - active
          - outdated
          - approved
      lastTestedAt:
        type: date
      planId:
        type: text
  StakeholderCommunication:
    meaning: A stakeholder communication is a controlled message sent to relevant parties regarding the status of an incident or service.
    aliases: []
    properties:
      communicationType:
        type: text
        allowed:
          - internal-update
          - customer-notification
          - regulatory-update
      deliveryState:
        type: text
        allowed:
          - pending
          - delivered
          - failed
      required:
        type: boolean
      sentAt:
        type: date
relationships:
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: This incident has been assigned to the resolver group for handling.
    aliases: []
  - name: impacts
    from: Incident
    to: BusinessService
    meaning: This incident affects the operation or availability of the business service.
    aliases: []
  - name: requires
    from: Incident
    to: RegulatoryNotification
    meaning: This incident requires a regulatory notification.
    aliases: []
rules:
  canContainIncident:
    conditions:
      - incident status is not resolved, closed, or cancelled
  canDeclareMajorIncident:
    conditions:
      - incident status is not resolved, closed, or cancelled
      - incident severity is sev1-critical or sev2-high
      - incident involves at least one identified IT service
      - incident declarationAuthorityAssigned is true
  canAcknowledgeAlert:
    conditions:
      - alert status is new
  canExecuteEmergencyChange:
    conditions:
      - change status is approved or scheduled
      - change is linked to an incident whose status is not resolved, closed, or cancelled
  canRestoreBackup:
    conditions:
      - backup set status is successful or verified
      - backup set restores an identified configuration item
  requiredCommunicationsSent:
    conditions:
      - if incident majorIncidentState is true, communications about the incident must be sent to relevant stakeholders and include current status, actions taken, and expected resolution timelines
      - if incident customerImpactSummary indicates customer impact, communications about the incident must be sent to affected stakeholders
      - if incident requires a regulatory notification, the required regulatory communication must be completed
      - otherwise, relevant internal communications about the incident should be documented
  requiresRegulatoryNotification:
    conditions:
      - materiality assessment status is completed
      - materiality assessment outcome is potentially_reportable or reportable
      - incident status is not resolved or closed
  canAssignResolverGroup:
    conditions:
      - if an affected IT service has a resolver group, assign that resolver group
      - otherwise, if an affected configuration item has a resolver group, assign that resolver group
      - otherwise, use incident defaultResolverGroupName
  canFailOverService:
    conditions:
      - IT service failsOverTo a recovery environment
      - recovery environment status is available
  canIsolateConfigurationItem:
    conditions:
      - there exists an incident whose status is not resolved, closed, or cancelled, and that incident involves this configuration item
  canSendStakeholderCommunication:
    conditions:
      - communication status is draft or pending-approval
      - communication is sentTo at least one stakeholder
  canSubmitRegulatoryNotification:
    conditions:
      - requiresRegulatoryNotification
      - regulatory notification status is draft or approved
      - regulatory notification is supported by at least one evidence item
  handleRecentChangeOrDeployment:
    conditions:
      - if a recent change triggered the incident, investigate whether it directly caused the incident and assess its status for outstanding issues or impacts
      - if a recent deployment triggered the incident, investigate whether it directly caused the incident and assess its status for outstanding issues or impacts
      - if a change is linked to the incident, investigate whether it contributed to the incident conditions and assess its status for outstanding issues or impacts
      - unless investigation confirms the change or deployment is unrelated, take it into account for mitigation measures
      - prioritize any corrective actions identified from the change or deployment process in the incident response
  majorIncidentNextSteps:
    conditions:
      - incident majorIncidentState is true
      - establish a major-incident management response
      - set a communication cadence for stakeholder updates
      - conduct a situation assessment of service impact, customer impact, and immediate risks
      - implement containment measures as needed
      - assign responsibilities for communication, technical response, and resolution
      - develop an investigation plan and gather relevant data and evidence
      - monitor progress and adjust response efforts as needed
      - prepare for a post-incident review after resolution
  requiresMaterialityAssessment:
    conditions:
      - if the incident affects critical business processes or customer-facing services, a materiality assessment is required
      - if incident severity is sev1-critical or sev2-high, a materiality assessment is required
      - if incident hasComplianceImplication is true, a materiality assessment is required
      - unless the incident is minor and does not impact operations or compliance, a materiality assessment may not be necessary
  canAssignIncident:
    conditions:
      - incident impacts at least one service
  canCloseIncident:
    conditions:
      - incident status is resolved or monitoring
      - all services impacted by the incident are healthy
      - incident has evidence items recorded
  canExecuteServiceFailover:
    conditions:
      - service has a secondary environment
  communicationSendable:
    conditions:
      - The incident includes at least one StakeholderCommunication.
      - The stakeholder communication deliveryState is not delivered.
  emergencyChangeExecutable:
    conditions:
      - The emergency change currentState is approved.
      - The emergency change validFrom date is current.
  regulatoryNotificationNeeded:
    conditions:
      - The incident requires a RegulatoryNotification.
      - The regulatory notification currentState is pending-approval or approved.
      - The regulatory notification dueDate has not passed.
      - The related regulatory notification notificationRequired is true.
  regulatoryNotificationSubmittable:
    conditions:
      - The regulatory notification currentState is approved.
  validEmergencyChange:
    conditions:
      - The incident hasEmergencyChange at least one EmergencyChange.
      - The emergency change currentState is approved or scheduled.
      - The emergency change validFrom date is current.
actions:
  assignIncident:
    input: Incident
    preconditions:
      - canAssignResolverGroup
    effect: incident is assignedTo the selected resolver group
    verification: Read the incident and confirm the assigned resolver group is recorded.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: incident majorIncidentState becomes true and declaredMajorAt is recorded
    verification: Read the incident and confirm majorIncidentState is true and declaredMajorAt is populated.
  sendStakeholderCommunication:
    input: Communication
    preconditions:
      - canSendStakeholderCommunication
    effect: communication status becomes sent and sentAt is recorded
    verification: Read the communication and confirm status is sent, sentAt is populated, and it is sentTo at least one stakeholder.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: regulatory notification status becomes submitted and submittedAt is recorded
    verification: Read the regulatory notification and confirm status is submitted, submittedAt is populated, and supporting evidence is linked.
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: alert status becomes acknowledged and alert acknowledgedAt is recorded
    verification: Read the alert and confirm status is acknowledged and acknowledgedAt is populated.
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: Containment steps are recorded and the impact of those actions is recorded on the incident.
    verification: Read the incident and confirm containment actions and their impacts are documented.
  executeEmergencyChange:
    input: Change
    preconditions:
      - canExecuteEmergencyChange
    effect: change status becomes implemented
    verification: Read the change and confirm status is implemented.
  restoreBackup:
    input: BackupSet
    preconditions:
      - canRestoreBackup
    effect: backup set is used to restore the linked configuration item, and the linked configuration item status becomes healthy or recovering
    verification: Read the linked configuration item and confirm its status is healthy or recovering, and confirm the restoration is documented.
  failOverService:
    input: ITService
    preconditions:
      - canFailOverService
    effect: IT service is failed over to its recovery environment and IT service isInRecovery becomes true
    verification: Read the IT service and confirm isInRecovery is true and the linked recovery environment is available.
  isolateConfigurationItem:
    input: ConfigurationItem
    preconditions:
      - canIsolateConfigurationItem
    effect: configuration item status becomes isolated and the isolation is documented in the relevant incident context
    verification: Read the configuration item and confirm status is isolated and the isolation is documented in the relevant incident context.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: Mark the incident as closed after resolution and verification are complete.
    verification: Confirm the incident is marked closed.
  documentEvidenceItem:
    input: Incident
    preconditions:
      - canExecuteEmergencyChange
    effect: Record and preserve evidence associated with an incident.
    verification: Confirm evidence associated with the incident is recorded and preserved.
  executeServiceFailover:
    input: Service
    preconditions:
      - canExecuteServiceFailover
    effect: Shift service operation to a secondary environment.
    verification: Confirm the service is operating from the secondary environment.
  initiateRecoveryPlan:
    input: Incident
    preconditions: []
    effect: no direct model change is recorded; the action uses the ITService restoredBy RecoveryPlan relationship to identify the recovery plan to initiate
    verification: confirm the incident impacts an ITService that is restoredBy a RecoveryPlan whose currentState is active
  recordEvidence:
    input: Incident
    preconditions: []
    effect: incident includes an Evidence item
    verification: confirm the incident includes the recorded Evidence item
