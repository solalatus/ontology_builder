competency_questions:
  - id: cq1
    text: Which business services are impacted by this incident?
  - id: cq2
    text: Who is the responsible service owner for the affected IT service?
  - id: cq3
    text: What is the severity level of the current incident?
  - id: cq4
    text: Does this incident meet the criteria for major-incident declaration?
  - id: cq5
    text: Which resolver group should be assigned to investigate this incident?
  - id: cq6
    text: Are there any active alerts that correlate with this incident?
  - id: cq7
    text: Is a materiality assessment needed for this incident, and when is it due?
  - id: cq8
    text: What communications have been sent to stakeholders regarding this incident?
  - id: cq9
    text: What recovery plan is applicable for restoring the affected service?
  - id: cq10
    text: Which configuration items are associated with the impacted IT service?
  - id: cq11
    text: Is there a known error linked to this incident that can provide a workaround?
  - id: cq12
    text: What is the status of the regulatory notification related to this incident?
  - id: cq13
    text: Who is the incident commander assigned to manage this incident response?
classes:
  Alert:
    meaning: An alert is a notification generated by monitoring tools that indicates a condition requiring attention related to IT services.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      alertId:
        type: text
      acknowledgedAt:
        type: date
      alertSource:
        type: text
      contextAvailable:
        type: boolean
  BusinessService:
    meaning: A business service is a capability delivered by the bank that directly meets customer or business needs.
    aliases: []
    properties:
      regulatoryRelevant:
        type: boolean
      businessContext:
        type: text
      businessServiceId:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      customerImpactSummary:
        type: text
      name:
        type: text
      currentStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
  ConfigurationItem:
    meaning: A configuration item is a managed component within the IT environment that is recorded and tracked for operational purposes.
    aliases:
      - konfigurációs elem
    properties:
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - isolated
          - unknown
      configurationItemId:
        type: text
      name:
        type: text
      isolationImpactAssessed:
        type: boolean
      reconnectionMethodAvailable:
        type: boolean
  Incident:
    meaning: An incident is an unplanned interruption or degradation of an IT service that requires managed response.
    aliases: []
    properties:
      detectionTime:
        type: date
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      majorIncidentDeclared:
        type: boolean
      summary:
        type: text
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      containmentEffective:
        type: boolean
      reviewOutcome:
        type: text
        allowed:
          - assessed
          - actionable improvements
          - no further action needed
          - acknowledgment of lessons learned
      declarationAuthorityAssigned:
        type: boolean
      declaredMajorAt:
        type: date
      defaultResolverGroupName:
        type: text
      hasComplianceImplication:
        type: boolean
      incidentId:
        type: text
      title:
        type: text
      identifier:
        type: text
  MaterialityAssessment:
    meaning: A materiality assessment is an evaluation that determines the significance of an incident and whether it requires regulatory reporting.
    aliases:
      - lényegességi értékelés
    properties:
      status:
        type: text
        allowed:
          - open
          - completed
          - pending-review
      dueDate:
        type: date
      assessmentId:
        type: text
      outcome:
        type: text
        allowed:
          - not_reportable
          - potentially_reportable
          - reportable
      completedAt:
        type: date
  RegulatoryNotification:
    meaning: A regulatory notification is a formal submission made to a regulatory authority to inform them about incidents with potential compliance implications.
    aliases:
      - felügyeleti bejelentés
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueAt:
        type: date
      notificationId:
        type: text
      submittedAt:
        type: date
      submissionTime:
        type: date
  ResolverGroup:
    meaning: A resolver group is a team assigned to diagnose and restore a specific technology or service area affected by an incident.
    aliases:
      - megoldócsoport
    properties:
      name:
        type: text
      resolverGroupId:
        type: text
      groupStatus:
        type: text
        allowed:
          - active
          - inactive
          - on-call
          - suspended
      supportScope:
        type: text
        allowed:
          - application-support
          - infrastructure-support
          - network-support
          - security-support
          - database-support
  Communication:
    meaning: A communication is a controlled message sent to stakeholders regarding the status or details of an incident.
    aliases:
      - értesítés
    properties:
      sentTime:
        type: date
      status:
        type: text
        allowed:
          - draft
          - sent
          - failed
          - archived
      communicationId:
        type: text
      content:
        type: text
  IncidentCommander:
    meaning: An incident commander is the individual accountable for coordinating the response to a major incident and making operational decisions during the incident lifecycle.
    aliases:
      - incidensparancsnok
    properties: {}
  ITService:
    meaning: An IT service is a managed technology capability that supports one or more business services.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      isInRecovery:
        type: boolean
      itServiceId:
        type: text
      name:
        type: text
  RecoveryPlan:
    meaning: A recovery plan is a documented strategy outlining the steps to restore an IT service and its dependencies after an incident.
    aliases:
      - helyreállítási terv
    properties:
      status:
        type: text
        allowed:
          - current
          - invoked
          - obsolete
  ServiceOwner:
    meaning: A service owner is the individual responsible for the overall management and performance of an IT service throughout its lifecycle.
    aliases:
      - szolgáltatásgazda
    properties:
      contactChannel:
        type: text
      name:
        type: text
  ApplicationOwner:
    meaning: The person responsible for the day-to-day operational fitness of an application within an IT service.
    aliases: []
    properties:
      contactChannel:
        type: text
      name:
        type: text
  BackupSet:
    meaning: A recorded backup snapshot or set used for restoration during recovery.
    aliases: []
    properties:
      backupTime:
        type: date
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      backupSetId:
        type: text
  Event:
    meaning: An observed occurrence that may help explain, detect, or correlate an incident.
    aliases: []
    properties:
      eventId:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - closed
      observedAt:
        type: date
  OnCallEngineer:
    meaning: The designated engineer available to respond immediately to operational incidents or outages.
    aliases:
      - on-call support engineer
    properties:
      contactChannel:
        type: text
      name:
        type: text
      onCallStatus:
        type: text
        allowed:
          - available
          - unavailable
          - in-progress
  RecoveryEnvironment:
    meaning: An alternate environment used to restore or continue service during recovery.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - available
          - unavailable
          - under_maintenance
      name:
        type: text
      environmentType:
        type: text
        allowed:
          - production
          - test
          - development
          - disaster-recovery
  Workaround:
    meaning: A temporary operational measure used to reduce incident impact before a permanent fix is in place.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - active
          - deprecated
      title:
        type: text
      workaroundId:
        type: text
      approvalFlag:
        type: boolean
  KnownError:
    meaning: A known error is a diagnosed issue that has an identified root cause and may have an associated workaround documented.
    aliases:
      - ismert hiba
    properties:
      workaround:
        type: text
  Change:
    meaning: A controlled modification to the environment that may affect services or incident handling.
    aliases:
      - modification
    properties:
      changeId:
        type: text
      emergencyChangeFlag:
        type: boolean
      implementedAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  CorrectiveAction:
    meaning: A follow-up action intended to reduce the chance or impact of future incidents.
    aliases:
      - remediation action
    properties:
      correctiveActionId:
        type: text
      dueAt:
        type: date
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
  Deployment:
    meaning: The release or rollout of a technical change into an environment.
    aliases: []
    properties:
      deployedAt:
        type: date
      deploymentId:
        type: text
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
  Evidence:
    meaning: Supporting material collected to substantiate incident handling, assessment, or reporting.
    aliases: []
    properties:
      collectedAt:
        type: date
      evidenceId:
        type: text
      status:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
  PostIncidentReview:
    meaning: A review conducted after an incident to analyze what happened and define follow-up actions.
    aliases:
      - PIR
      - after-action review
    properties:
      completedAt:
        type: date
      reviewId:
        type: text
      status:
        type: text
        allowed:
          - new
          - in-progress
          - completed
  Runbook:
    meaning: A documented operational procedure used to respond to or manage an incident.
    aliases:
      - playbook
      - operational procedure
    properties:
      runbookId:
        type: text
      status:
        type: text
        allowed:
          - active
          - outdated
          - under_review
      title:
        type: text
  Stakeholder:
    meaning: A person or group that needs to receive information or updates about an incident.
    aliases: []
    properties:
      contactChannel:
        type: text
      name:
        type: text
  ThirdPartyService:
    meaning: An externally provided service that an IT service depends on or that can be involved in an incident.
    aliases:
      - outsourced service
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - unavailable
          - recovering
          - unknown
      thirdPartyServiceId:
        type: text
  ChangeManager:
    meaning: The individual responsible for overseeing the change management process, including approvals and implementation of changes.
    aliases: []
    properties: {}
  CommunicationOwner:
    meaning: The person responsible for managing and delivering communication messages related to incidents.
    aliases: []
    properties: {}
  ComplianceOfficer:
    meaning: The individual tasked with ensuring that regulatory obligations are met regarding incidents and operational practices.
    aliases: []
    properties: {}
  ContainmentMeasure:
    meaning: Actions taken to limit the impact of an incident and prevent further degradation of services.
    aliases: []
    properties:
      containmentStatus:
        type: text
        allowed:
          - active
          - inactive
          - under-review
      expectedSideEffects:
        type: text
      scope:
        type: text
  EmergencyChange:
    meaning: A change made under expedited conditions to address urgent operational needs arising from an incident.
    aliases: []
    properties:
      backoutPlanDocumented:
        type: boolean
      changeStatus:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      implementationPlanDocumented:
        type: boolean
      implementationTime:
        type: date
      riskAccepted:
        type: boolean
  EvidenceItem:
    meaning: A piece of information collected during an incident that supports analysis and accountability.
    aliases: []
    properties:
      collectionTime:
        type: date
      evidenceStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      integrityState:
        type: text
        allowed:
          - intact
          - compromised
  MajorIncidentDeclaration:
    meaning: The formal recognition of an incident that has significant impact, requiring enhanced coordination and management efforts.
    aliases: []
    properties:
      declarationStatus:
        type: text
        allowed:
          - active
          - resolved
          - cancelled
      declarationTime:
        type: date
  RecoveryLead:
    meaning: The person who oversees the execution of recovery plans and manages restoration efforts following incidents.
    aliases: []
    properties: {}
  RecoveryObjective:
    meaning: A specific target defined to guide the restoration of services following an incident.
    aliases: []
    properties:
      objectiveDescription:
        type: text
      targetTime:
        type: date
  RootCause:
    meaning: The underlying reason identified for one or more incidents that provides insight into what went wrong.
    aliases: []
    properties:
      category:
        type: text
        allowed:
          - software-defect
          - configuration-error
          - capacity-shortage
          - hardware-failure
          - network-failure
          - human-error
          - process-failure
          - third-party-failure
          - cyber-attack
          - unknown
      recurrencePreventionMeasures:
        type: text
      status:
        type: text
        allowed:
          - under-investigation
          - confirmed
          - mitigated
  StakeholderCommunication:
    meaning: A controlled message sent to inform affected parties about the status and details of an incident.
    aliases: []
    properties:
      audience:
        type: text
        allowed:
          - technical
          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
      communicationStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - sent
          - archived
      plannedTime:
        type: date
      sentTime:
        type: date
  TechnicalOwner:
    meaning: The person accountable for the engineering and maintenance of a particular configuration item or service.
    aliases: []
    properties: {}
relationships:
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: The assignedTo relationship means that an incident is formally designated to a resolver group for investigation and resolution.
    aliases: []
  - name: hasRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: The hasRegulatoryNotification relationship means that an incident is linked to a formal submission made to regulatory authorities.
    aliases: []
  - name: about
    from: RegulatoryNotification
    to: Incident
    meaning: The about relationship means that a regulatory notification concerns a specific incident.
    aliases: []
  - name: impacts
    from: Incident
    to: BusinessService
    meaning: The impacts relationship means that an incident directly affects the state or availability of a business service.
    aliases: []
  - name: dependsOn
    from: BusinessService
    to: ITService
    meaning: The dependsOn relationship means that a business service relies on one or more IT services for its operation and delivery.
    aliases: []
  - name: supportedBy
    from: ITService
    to: ResolverGroup
    meaning: The supportedBy relationship means that an IT service is backed by a resolver group that has the expertise to resolve related incidents.
    aliases: []
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: The hasMaterialityAssessment relationship means that an incident is linked to a formal evaluation of its significance for reporting purposes.
    aliases: []
  - name: hasCommunication
    from: Incident
    to: Communication
    meaning: The hasCommunication relationship means that an incident has associated messages or notifications sent to stakeholders.
    aliases: []
  - name: about
    from: Communication
    to: Incident
    meaning: The about relationship means that a communication concerns a specific incident.
    aliases: []
  - name: usesWorkaround
    from: Incident
    to: Workaround
    meaning: This incident is being mitigated using the workaround.
    aliases: []
  - name: restores
    from: BackupSet
    to: ConfigurationItem
    meaning: This backup set is used to restore the configuration item.
    aliases: []
rules:
  canAcknowledgeAlert:
    conditions:
      - Alert status is new.
  canAssignIncidentToResolverGroup:
    conditions:
      - Incident status is not closed or cancelled.
      - Incident affects at least one ITService that is supportedBy the ResolverGroup.
  canDeclareMajorIncident:
    conditions:
      - Incident severity is sev1-critical or sev2-high.
      - Incident status is not resolved, closed, or cancelled.
      - Incident affects at least one ITService.
      - Incident is managedBy an IncidentCommander.
  canDocumentReviewOutcome:
    conditions:
      - Incident status is resolved or closed.
  canSendCommunication:
    conditions:
      - The related Incident is managedBy an IncidentCommander.
      - Communication status is draft.
  canSubmitRegulatoryNotification:
    conditions:
      - RegulatoryNotification status is pending-approval.
      - The related Incident has a MaterialityAssessment with status completed.
  requiresMaterialityAssessment:
    conditions:
      - Incident severity is sev1-critical or sev2-high.
      - Incident status is new, acknowledged, or investigating.
      - Incident impacts at least one BusinessService where regulatoryRelevant is true.
  canExecuteEmergencyChange:
    conditions:
      - change status is approved or scheduled
      - change is linked to an incident whose status is not resolved, closed, or cancelled
  canFailOverService:
    conditions:
      - IT service failsOverTo a recovery environment
      - recovery environment status is available
  canIsolateConfigurationItem:
    conditions:
      - there exists an incident whose status is not resolved, closed, or cancelled, and that incident involves this configuration item
  canRestoreBackup:
    conditions:
      - backup set status is successful or verified
      - backup set restores an identified configuration item
  canSubmitRegulatoryNotification2:
    conditions:
      - requiresRegulatoryNotification
      - regulatory notification status is draft or approved
      - regulatory notification is supported by at least one evidence item
  handleRecentChangeOrDeployment:
    conditions:
      - if a recent change triggered the incident, investigate whether it directly caused the incident and assess its status for outstanding issues or impacts
      - if a recent deployment triggered the incident, investigate whether it directly caused the incident and assess its status for outstanding issues or impacts
      - if a change is linked to the incident, investigate whether it contributed to the incident conditions and assess its status for outstanding issues or impacts
      - unless investigation confirms the change or deployment is unrelated, take it into account for mitigation measures
      - prioritize any corrective actions identified from the change or deployment process in the incident response
  majorIncidentNextSteps:
    conditions:
      - incident majorIncidentState is true
      - establish a major-incident management response
      - set a communication cadence for stakeholder updates
      - conduct a situation assessment of service impact, customer impact, and immediate risks
      - implement containment measures as needed
      - assign responsibilities for communication, technical response, and resolution
      - develop an investigation plan and gather relevant data and evidence
      - monitor progress and adjust response efforts as needed
      - prepare for a post-incident review after resolution
  requiredCommunicationsSent:
    conditions:
      - if incident majorIncidentState is true, communications about the incident must be sent to relevant stakeholders and include current status, actions taken, and expected resolution timelines
      - if incident customerImpactSummary indicates customer impact, communications about the incident must be sent to affected stakeholders
      - if incident requires a regulatory notification, the required regulatory communication must be completed
      - otherwise, relevant internal communications about the incident should be documented
  canFailOverRecoveryEnvironment:
    conditions:
      - RecoveryEnvironment currentStatus is available.
  canIsolateConfigurationItemDirect:
    conditions:
      - ConfigurationItem isolationImpactAssessed is true.
      - ConfigurationItem reconnectionMethodAvailable is true.
  canRestoreFromBackupSet:
    conditions:
      - BackupSet backupStatus is successful or verified.
  canSendApprovedStakeholderCommunication:
    conditions:
      - StakeholderCommunication communicationStatus is approved.
      - StakeholderCommunication audience is defined.
      - StakeholderCommunication is ownedBy a CommunicationOwner.
actions:
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: Alert status becomes acknowledged.
    verification: Confirm Alert status is acknowledged.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions:
      - canAssignIncidentToResolverGroup
    effect: Incident is assignedTo the selected ResolverGroup.
    verification: Confirm the Incident is assignedTo the ResolverGroup.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: Incident majorIncidentDeclared becomes true and Incident status remains investigating.
    verification: Confirm Incident majorIncidentDeclared is true and Incident is managedBy an IncidentCommander.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: RegulatoryNotification status becomes submitted.
    verification: Confirm RegulatoryNotification status is submitted.
  containIncident:
    input: Incident
    preconditions:
      - canDocumentReviewOutcome
    effect: Containment steps are recorded and the impact of those actions is recorded on the incident.
    verification: Read the incident and confirm containment actions and their impacts are documented.
  executeEmergencyChange:
    input: Change
    preconditions:
      - canExecuteEmergencyChange
    effect: change status becomes implemented
    verification: Read the change and confirm status is implemented.
  failOverService:
    input: ITService
    preconditions:
      - canFailOverService
    effect: IT service is failed over to its recovery environment and IT service isInRecovery becomes true
    verification: Read the IT service and confirm isInRecovery is true and the linked recovery environment is available.
  isolateConfigurationItem:
    input: ConfigurationItem
    preconditions:
      - canIsolateConfigurationItem
    effect: configuration item status becomes isolated and the isolation is documented in the relevant incident context
    verification: Read the configuration item and confirm status is isolated and the isolation is documented in the relevant incident context.
  restoreBackup:
    input: BackupSet
    preconditions:
      - canRestoreBackup
    effect: backup set is used to restore the linked configuration item, and the linked configuration item status becomes healthy or recovering
    verification: Read the linked configuration item and confirm its status is healthy or recovering, and confirm the restoration is documented.
  sendStakeholderCommunication:
    input: Communication
    preconditions:
      - canSendCommunication
    effect: communication status becomes sent and sentAt is recorded
    verification: Read the communication and confirm status is sent, sentAt is populated, and it is sentTo at least one stakeholder.
  documentPostIncidentReviewOutcome:
    input: Incident
    preconditions:
      - canDocumentReviewOutcome
    effect: Incident reviewOutcome is recorded.
    verification: Confirm Incident reviewOutcome is one of the allowed reviewOutcome values.
  notifyStakeholders:
    input: Communication
    preconditions:
      - canSendCommunication
    effect: Communication status becomes sent and Communication sentTime is recorded.
    verification: Confirm Communication status is sent and Communication sentTime is populated.
