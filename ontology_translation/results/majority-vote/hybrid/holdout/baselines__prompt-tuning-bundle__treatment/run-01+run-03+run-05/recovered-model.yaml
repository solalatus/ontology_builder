competency_questions:
  - id: cq1
    text: Which business services are impacted by this incident?
  - id: cq2
    text: Who is the responsible service owner for the affected IT service?
  - id: cq3
    text: What is the severity level of the current incident?
  - id: cq4
    text: Does this incident meet the criteria for major-incident declaration?
  - id: cq5
    text: Which resolver group should be assigned to investigate this incident?
  - id: cq6
    text: Are there any active alerts that correlate with this incident?
  - id: cq7
    text: Is a materiality assessment needed for this incident, and when is it due?
  - id: cq8
    text: What communications have been sent to stakeholders regarding this incident?
  - id: cq9
    text: What recovery plan is applicable for restoring the affected service?
  - id: cq10
    text: Which configuration items are associated with the impacted IT service?
  - id: cq11
    text: Is there a known error linked to this incident that can provide a workaround?
  - id: cq12
    text: What is the status of the regulatory notification related to this incident?
  - id: cq13
    text: Who is the incident commander assigned to manage this incident response?
classes:
  ConfigurationItem:
    meaning: A configuration item is a managed component within the IT environment that is recorded and tracked for operational purposes.
    aliases:
      - konfigurációs elem
    properties:
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
        allowed:
          - operational
          - under-maintenance
          - retired
      ciType:
        type: text
        allowed:
          - application
          - database
          - server
          - network-device
      currentState:
        type: text
        allowed:
          - active
          - inactive
          - under-maintenance
          - retired
  Incident:
    meaning: An incident is an unplanned interruption or degradation of an IT service that requires managed response.
    aliases: []
    properties:
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      majorIncidentDeclared:
        type: boolean
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      summary:
        type: text
      containmentEffective:
        type: boolean
      detectionTime:
        type: date
      reviewOutcome:
        type: text
        allowed:
          - assessed
          - actionable improvements
          - no further action needed
          - acknowledgment of lessons learned
      identifier:
        type: text
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      currentState:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      incidentId:
        type: text
  RegulatoryNotification:
    meaning: A regulatory notification is a formal submission made to a regulatory authority to inform them about incidents with potential compliance implications.
    aliases:
      - felügyeleti bejelentés
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueDate:
        type: date
      identifier:
        type: text
      submissionTimestamp:
        type: date
      currentState:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      notificationRequired:
        type: boolean
  ResolverGroup:
    meaning: A resolver group is a team assigned to diagnose and restore a specific technology or service area affected by an incident.
    aliases:
      - megoldócsoport
    properties:
      name:
        type: text
      identifier:
        type: text
      status:
        type: text
        allowed:
          - available
          - on-call
          - busy
      currentState:
        type: text
        allowed:
          - active
          - inactive
  ServiceOwner:
    meaning: A service owner is the individual responsible for the overall management and performance of an IT service throughout its lifecycle.
    aliases:
      - szolgáltatásgazda
    properties:
      name:
        type: text
      identifier:
        type: text
      currentState:
        type: text
  Alert:
    meaning: An alert is a notification generated by monitoring tools that indicates a condition requiring attention related to IT services.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      identifier:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      triggerTimestamp:
        type: date
  BusinessService:
    meaning: A business service is a capability delivered by the bank that directly meets customer or business needs.
    aliases: []
    properties:
      regulatoryRelevant:
        type: boolean
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      currentState:
        type: text
        allowed:
          - operational
          - degraded
          - unavailable
          - retired
      serviceName:
        type: text
  ITService:
    meaning: An IT service is a managed technology capability that supports one or more business services.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      currentState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
      serviceName:
        type: text
  MaterialityAssessment:
    meaning: A materiality assessment is an evaluation that determines the significance of an incident and whether it requires regulatory reporting.
    aliases:
      - lényegességi értékelés
    properties:
      dueDate:
        type: date
      status:
        type: text
        allowed:
          - open
          - completed
          - pending-review
      identifier:
        type: text
      rationale:
        type: text
  RecoveryPlan:
    meaning: A recovery plan is a documented strategy outlining the steps to restore an IT service and its dependencies after an incident.
    aliases:
      - helyreállítási terv
    properties:
      status:
        type: text
        allowed:
          - current
          - invoked
          - obsolete
      currentState:
        type: text
        allowed:
          - active
          - outdated
          - approved
      lastTestedAt:
        type: date
      planId:
        type: text
  Communication:
    meaning: A communication is a controlled message sent to stakeholders regarding the status or details of an incident.
    aliases:
      - értesítés
    properties:
      sentTime:
        type: date
      status:
        type: text
        allowed:
          - draft
          - sent
          - failed
          - archived
  IncidentCommander:
    meaning: An incident commander is the individual accountable for coordinating the response to a major incident and making operational decisions during the incident lifecycle.
    aliases:
      - incidensparancsnok
    properties: {}
  KnownError:
    meaning: A known error is a diagnosed issue that has an identified root cause and may have an associated workaround documented.
    aliases:
      - ismert hiba
    properties:
      workaround:
        type: text
  BackupSet:
    meaning: A backup set is a defined collection of data that has been backed up and can be restored in case of data loss or system failure.
    aliases:
      - mentéskészlet
    properties:
      backupType:
        type: text
        allowed:
          - full
          - incremental
          - differential
      identifier:
        type: text
      lastBackupDate:
        type: date
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
  CorrectiveAction:
    meaning: A corrective action is a tracked step aimed at addressing the root cause of an incident to prevent future occurrences.
    aliases:
      - helyesbítő intézkedés
    properties:
      description:
        type: text
      dueDate:
        type: date
      identifier:
        type: text
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
  Event:
    meaning: An event is an observable occurrence in the IT environment that may indicate a change in the state of a service or system and can be monitored for potential incidents.
    aliases:
      - esemény
    properties:
      eventType:
        type: text
        allowed:
          - incident
          - maintenance
          - upgrade
          - outage
          - service change
      identifier:
        type: text
      source:
        type: text
      timestamp:
        type: date
  EvidenceItem:
    meaning: An evidence item is a preserved record or artifact collected during incident management to support analysis and accountability.
    aliases:
      - bizonyíték
    properties:
      captureDate:
        type: date
      identifier:
        type: text
      integrityStatus:
        type: text
        allowed:
          - collected
          - verified
          - sealed
          - compromised
      link:
        type: text
  Regulator:
    meaning: A regulator is a governmental or authoritative body responsible for overseeing and enforcing compliance within the banking sector.
    aliases:
      - felügyeleti hatóság
    properties:
      identifier:
        type: text
      name:
        type: text
  Runbook:
    meaning: A runbook is a documented set of procedures and instructions for responding to specific operational scenarios, incidents, or maintenance tasks.
    aliases:
      - üzemeltetési eljárás
    properties:
      identifier:
        type: text
      name:
        type: text
      version:
        type: text
  SecondaryEnvironment:
    meaning: A secondary environment is an alternate operating setting used for testing, recovery, or operational continuity, such as a disaster recovery site.
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
        allowed:
          - operational
          - in-maintenance
          - out-of-service
  Service:
    meaning: A service is a capability provided by the bank to deliver value to customers, supported by IT and operational processes.
    aliases:
      - szolgáltatás
    properties:
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      description:
        type: text
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  Stakeholder:
    meaning: A stakeholder is any individual or group that has an interest in or is affected by the operations and services of the bank, including employees, customers, and regulators.
    aliases:
      - érintett
    properties:
      identifier:
        type: text
      name:
        type: text
      role:
        type: text
  ThirdPartyService:
    meaning: A third-party service is an external capability or service provided by a vendor that the bank relies on to support its operation.
    aliases:
      - külső szolgáltatás
    properties:
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      identifier:
        type: text
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  Workaround:
    meaning: A workaround is a temporary solution implemented to reduce or bypass the impact of an incident before a permanent fix is available.
    aliases:
      - kerülőmegoldás
    properties:
      description:
        type: text
      identifier:
        type: text
      status:
        type: text
        allowed:
          - available
          - under-evaluation
          - deprecated
  AlertOrEvent:
    meaning: An alert or event is a time-stamped observation indicating a noteworthy occurrence related to IT services or security.
    aliases: []
    properties:
      alertIdentifier:
        type: text
      alertType:
        type: text
        allowed:
          - performance
          - security
          - availability
          - operational
      currentState:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      detectedAt:
        type: date
  EmergencyChange:
    meaning: An emergency change is a change processed under an accelerated path to address an urgent operational need.
    aliases: []
    properties:
      changeId:
        type: text
      currentState:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      validFrom:
        type: date
      validTo:
        type: date
  Evidence:
    meaning: Evidence is a preserved record or artifact collected during incident management to support analysis and accountability.
    aliases: []
    properties:
      collectedAt:
        type: date
      currentState:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      evidenceId:
        type: text
      evidenceType:
        type: text
        allowed:
          - document
          - log
          - screenshot
          - analysis
  StakeholderCommunication:
    meaning: A stakeholder communication is a controlled message sent to relevant parties regarding the status of an incident or service.
    aliases: []
    properties:
      communicationType:
        type: text
        allowed:
          - internal-update
          - customer-notification
          - regulatory-update
      deliveryState:
        type: text
        allowed:
          - pending
          - delivered
          - failed
      required:
        type: boolean
      sentAt:
        type: date
relationships:
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: The assignedTo relationship means that an incident is formally designated to a resolver group for investigation and resolution.
    aliases: []
  - name: impacts
    from: Incident
    to: BusinessService
    meaning: The impacts relationship means that an incident directly affects the state or availability of a business service.
    aliases: []
  - name: ownedBy
    from: ITService
    to: ServiceOwner
    meaning: The ownedBy relationship means that an IT service is formally managed and accountable to a specific service owner.
    aliases: []
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: The hasMaterialityAssessment relationship means that an incident is linked to a formal evaluation of its significance for reporting purposes.
    aliases: []
  - name: hasRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: The hasRegulatoryNotification relationship means that an incident is linked to a formal submission made to regulatory authorities.
    aliases: []
  - name: about
    from: RegulatoryNotification
    to: Incident
    meaning: The about relationship means that a regulatory notification concerns a specific incident.
    aliases: []
rules:
  canDeclareMajorIncident:
    conditions:
      - Incident severity is sev1-critical or sev2-high.
      - Incident status is not resolved, closed, or cancelled.
      - Incident affects at least one ITService.
      - Incident is managedBy an IncidentCommander.
  canDocumentReviewOutcome:
    conditions:
      - Incident status is resolved or closed.
  canAcknowledgeAlert:
    conditions:
      - Alert status is new.
  canAssignIncidentToResolverGroup:
    conditions:
      - Incident status is not closed or cancelled.
      - Incident affects at least one ITService that is supportedBy the ResolverGroup.
  canSendCommunication:
    conditions:
      - The related Incident is managedBy an IncidentCommander.
      - Communication status is draft.
  canSubmitRegulatoryNotification:
    conditions:
      - RegulatoryNotification status is pending-approval.
      - The related Incident has a MaterialityAssessment with status completed.
  requiresMaterialityAssessment:
    conditions:
      - Incident severity is sev1-critical or sev2-high.
      - Incident status is new, acknowledged, or investigating.
      - Incident impacts at least one BusinessService where regulatoryRelevant is true.
  canAssignIncident:
    conditions:
      - incident impacts at least one service
  canCloseIncident:
    conditions:
      - incident status is resolved or monitoring
      - all services impacted by the incident are healthy
      - incident has evidence items recorded
  canContainIncident:
    conditions:
      - incident status is acknowledged or investigating
  canExecuteServiceFailover:
    conditions:
      - service has a secondary environment
  canRestoreBackup:
    conditions:
      - service has a backup set
  requiresRegulatoryNotification:
    conditions:
      - incident has a materiality assessment
      - materiality assessment status is potentially-reportable or reportable
  communicationSendable:
    conditions:
      - The incident includes at least one StakeholderCommunication.
      - The stakeholder communication deliveryState is not delivered.
  emergencyChangeExecutable:
    conditions:
      - The emergency change currentState is approved.
      - The emergency change validFrom date is current.
  regulatoryNotificationNeeded:
    conditions:
      - The incident requires a RegulatoryNotification.
      - The regulatory notification currentState is pending-approval or approved.
      - The regulatory notification dueDate has not passed.
      - The related regulatory notification notificationRequired is true.
  regulatoryNotificationSubmittable:
    conditions:
      - The regulatory notification currentState is approved.
  requiredCommunicationsSent:
    conditions:
      - The incident includes at least one StakeholderCommunication.
      - The stakeholder communication required is true.
      - The stakeholder communication deliveryState is delivered.
      - The stakeholder communication sentAt is recorded.
  validEmergencyChange:
    conditions:
      - The incident hasEmergencyChange at least one EmergencyChange.
      - The emergency change currentState is approved or scheduled.
      - The emergency change validFrom date is current.
actions:
  assignIncidentToResolverGroup:
    input: Incident
    preconditions:
      - canAssignIncidentToResolverGroup
    effect: Incident is assignedTo the selected ResolverGroup.
    verification: Confirm the Incident is assignedTo the ResolverGroup.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: Incident majorIncidentDeclared becomes true and Incident status remains investigating.
    verification: Confirm Incident majorIncidentDeclared is true and Incident is managedBy an IncidentCommander.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: RegulatoryNotification status becomes submitted.
    verification: Confirm RegulatoryNotification status is submitted.
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: Alert status becomes acknowledged.
    verification: Confirm Alert status is acknowledged.
  sendStakeholderCommunication:
    input: Incident
    preconditions: []
    effect: Send incident information to relevant stakeholders.
    verification: Confirm the communication was issued to the intended stakeholders.
  documentPostIncidentReviewOutcome:
    input: Incident
    preconditions:
      - canDocumentReviewOutcome
    effect: Incident reviewOutcome is recorded.
    verification: Confirm Incident reviewOutcome is one of the allowed reviewOutcome values.
  notifyStakeholders:
    input: Communication
    preconditions:
      - canSendCommunication
    effect: Communication status becomes sent and Communication sentTime is recorded.
    verification: Confirm Communication status is sent and Communication sentTime is populated.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: Mark the incident as closed after resolution and verification are complete.
    verification: Confirm the incident is marked closed.
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: Record containment measures taken to reduce service impact.
    verification: Confirm containment measures are documented and impact is reduced or stabilized.
  documentEvidenceItem:
    input: Incident
    preconditions:
      - canDocumentReviewOutcome
    effect: Record and preserve evidence associated with an incident.
    verification: Confirm evidence associated with the incident is recorded and preserved.
  executeServiceFailover:
    input: Service
    preconditions:
      - canExecuteServiceFailover
    effect: Shift service operation to a secondary environment.
    verification: Confirm the service is operating from the secondary environment.
  restoreBackup:
    input: Service
    preconditions:
      - canRestoreBackup
    effect: Restore service data or components from a backup set.
    verification: Confirm the service or data has been restored from backup and is usable.
  executeEmergencyChange:
    input: EmergencyChange
    preconditions:
      - emergencyChangeExecutable
    effect: emergency change currentState becomes implemented
    verification: confirm emergency change currentState is implemented
  initiateRecoveryPlan:
    input: Incident
    preconditions: []
    effect: no direct model change is recorded; the action uses the ITService restoredBy RecoveryPlan relationship to identify the recovery plan to initiate
    verification: confirm the incident impacts an ITService that is restoredBy a RecoveryPlan whose currentState is active
  recordEvidence:
    input: Incident
    preconditions: []
    effect: incident includes an Evidence item
    verification: confirm the incident includes the recorded Evidence item
