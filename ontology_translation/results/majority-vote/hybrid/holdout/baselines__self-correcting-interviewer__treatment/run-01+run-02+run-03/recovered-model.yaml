competency_questions: []
classes:
  Alert:
    meaning: An alert is a notification generated by monitoring systems indicating a condition that may require attention or action from IT staff.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      acknowledgedAt:
        type: date
      acknowledged:
        type: boolean
      raisedAt:
        type: date
  ConfigurationItem:
    meaning: A configuration item is a managed component, such as hardware or software, that is recorded in the configuration management system and is part of the IT service delivery.
    aliases:
      - Konfigurációs Elem
    properties:
      status:
        type: text
      name:
        type: text
      checkResult:
        type: text
        allowed:
          - passed
          - failed
          - not-completed
      isIsolated:
        type: boolean
      isolationImpact:
        type: text
      lastSuccessfulCheckAt:
        type: date
      rollbackMethod:
        type: text
  EmergencyChange:
    meaning: An emergency change is a change that is processed under an expedited pathway to address urgent operational needs resulting from an incident.
    aliases:
      - Sürgősségi Változás
    properties:
      status:
        type: text
        allowed:
          - draft
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      backoutPlan:
        type: text
      implementationPlan:
        type: text
      implementedAt:
        type: date
      riskAccepted:
        type: boolean
  Incident:
    meaning: An incident is an unplanned interruption or degradation of an IT service that requires managed response to restore normal operations.
    aliases: []
    properties:
      majorIncidentFlag:
        type: boolean
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      closedAt:
        type: date
      majorIncidentReason:
        type: text
      openedAt:
        type: date
      complexityLevel:
        type: text
      customerImpactLevel:
        type: text
        allowed:
          - enterprise-wide
          - multiple-services
          - single-service
          - limited-users
          - no-observed-impact
      resolvedAt:
        type: date
      availabilityImpact:
        type: boolean
      businessImpactSummary:
        type: text
      containmentScope:
        type: text
      dataIntegrityImpact:
        type: boolean
      expectedDuration:
        type: text
      expectedSideEffects:
        type: text
      majorIncidentDeclaredAt:
        type: date
      regulatoryNotificationRequired:
        type: boolean
      resolutionSummary:
        type: text
      vendorInvolvement:
        type: boolean
  IncidentCommander:
    meaning: An incident commander is the individual responsible for leading and coordinating the response to a major incident, ensuring effective communication and decision-making.
    aliases:
      - Incidensparancsnok
      - MIM Lead
    properties:
      availabilityStatus:
        type: text
        allowed:
          - available
          - unavailable
  MaterialityAssessment:
    meaning: A materiality assessment is a documented evaluation that determines the significance of an incident and whether it requires regulatory notification.
    aliases: []
    properties:
      outcome:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      status:
        type: text
        allowed:
          - new
          - in-progress
          - completed
      completed:
        type: boolean
  PostIncidentReview:
    meaning: null
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - in-progress
          - completed
          - reviewed
      scheduledAt:
        type: date
      completedAt:
        type: date
      summary:
        type: text
  RegulatoryNotification:
    meaning: A regulatory notification is a formal report submitted to a competent authority regarding an incident that may have compliance implications for the bank.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueDate:
        type: date
      submissionReceipt:
        type: text
      submittedAt:
        type: date
  ResolverGroup:
    meaning: A resolver group is a team assigned to diagnose and resolve issues related to specific technology or service areas within the bank's IT operations.
    aliases:
      - Megoldócsoport
    properties:
      coverageStatus:
        type: text
        allowed:
          - covered
          - uncovered
      name:
        type: text
      responsePriority:
        type: number
  ServiceOwner:
    meaning: A service owner is the individual accountable for the management and performance of a specific IT service throughout its lifecycle.
    aliases:
      - Szolgáltatásgazda
    properties:
      name:
        type: text
  Workaround:
    meaning: A workaround is a temporary solution implemented to reduce or bypass the impact of an incident until a permanent fix can be applied.
    aliases:
      - Kerülőmegoldás
    properties:
      status:
        type: text
        allowed:
          - active
          - retired
      instructions:
        type: text
      available:
        type: boolean
  BusinessService:
    meaning: A business service is a customer-facing capability delivered by the bank that is supported by one or more IT services.
    aliases:
      - Üzleti Szolgáltatás
    properties:
      status:
        type: text
      name:
        type: text
      communicationCadence:
        type: text
      healthState:
        type: text
      regulatorySensitive:
        type: boolean
      serviceCriticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  CorrectiveAction:
    meaning: A corrective action is a tracked measure intended to address the root cause of an incident, reduce risk, or improve overall incident response capability.
    aliases:
      - Helyesbítő Intézkedés
    properties:
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueDate:
        type: date
  Evidence:
    meaning: Evidence refers to preserved records or artifacts collected during an incident that support analysis, decision-making, and accountability in incident management.
    aliases: []
    properties:
      recordedAt:
        type: date
      status:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      type:
        type: text
        allowed:
          - document
          - artifact
          - observation
  RecoveryPlan:
    meaning: A recovery plan is a documented strategy that outlines the procedures for restoring an IT service and its dependencies after an incident.
    aliases:
      - Helyreállítási Terv
    properties:
      status:
        type: text
        allowed:
          - active
          - inactive
          - under-review
      lastTestedAt:
        type: date
      recoveryObjective:
        type: text
  KnownError:
    meaning: A documented issue with a recognized cause or pattern that may be associated with incidents.
    aliases:
      - documented issue
      - recognized fault
    properties:
      status:
        type: text
        allowed:
          - active
          - retired
      rootCauseSummary:
        type: text
  StakeholderCommunication:
    meaning: A communication sent or prepared to update stakeholders about an incident.
    aliases:
      - stakeholder update
      - stakeholder notice
    properties:
      status:
        type: text
        allowed:
          - draft
          - sent
          - archived
      approvalState:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - sent
          - archived
      archivedMessage:
        type: text
      audience:
        type: text
      deliveryStatus:
        type: text
      messageContent:
        type: text
      owner:
        type: text
      sentAt:
        type: date
  Communication:
    meaning: null
    aliases: []
    properties:
      audienceType:
        type: text
        allowed:
          - technical
          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
      messageSummary:
        type: text
      sentAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - sent
          - archived
  Event:
    meaning: An event is a recorded occurrence within the IT environment that signifies a change or noteworthy activity, which may or may not require further action.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - active
          - inactive
          - acknowledged
  ITService:
    meaning: An IT service is a managed technology capability that supports one or more business services, ensuring their availability and performance.
    aliases:
      - Informatikai Szolgáltatás
    properties:
      name:
        type: text
      status:
        type: text
  OnCallEngineer:
    meaning: An on-call engineer is a technical specialist available to respond to time-sensitive incidents and operational issues as they arise.
    aliases:
      - Ügyeletes Mérnök
    properties:
      availabilityStatus:
        type: text
        allowed:
          - available
          - unavailable
  Runbook:
    meaning: A runbook is a documented operational procedure that outlines specific steps and guidelines for diagnosing, responding to, or recovering from incidents.
    aliases:
      - Üzemeltetési Eljárás
    properties:
      status:
        type: text
        allowed:
          - active
          - inactive
          - retired
  BackupSet:
    meaning: A stored backup that may be available for restoration of an affected component or service.
    aliases:
      - backup collection
      - saved data set
    properties:
      createdAt:
        type: date
      restorePoint:
        type: text
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
  Regulator:
    meaning: A supervisory authority that may receive formal notifications about an incident.
    aliases:
      - supervisory authority
      - oversight body
    properties: {}
  Application Support Specialist:
    meaning: An expert focused on providing support for specific applications, handling incidents, and performing troubleshooting activities to ensure functionality.
    aliases: []
    properties: {}
  Backup:
    meaning: A copy of data stored securely to ensure recovery in the event of data loss or service disruption.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
  Containment Step:
    meaning: A predefined action or measure taken to limit the impact of an incident while it is being resolved.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - pending
          - in-progress
          - completed
  IT Service:
    meaning: A technology capability that is managed and delivered by the bank, supporting one or more business services.
    aliases:
      - technology service
    properties:
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  Major Incident Coordinator:
    meaning: The individual responsible for facilitating and managing the response to significant incidents that require enhanced coordination and communication.
    aliases:
      - incident response lead
    properties: {}
  On-call Coverage:
    meaning: A defined schedule that identifies personnel available to respond to incidents outside of regular business hours, ensuring ongoing support and management.
    aliases: []
    properties: {}
  Service Criticality Tier:
    meaning: A classification that defines the importance of an IT service in terms of its impact on business operations and customer service.
    aliases: []
    properties: {}
  Service Manager:
    meaning: The individual who oversees the performance and delivery of an IT service, ensuring it meets the needs and expectations of its stakeholders.
    aliases:
      - Service Delivery Manager
    properties: {}
  Technical Support Engineer:
    meaning: A technical specialist responsible for diagnosing and resolving issues related to IT services and infrastructure.
    aliases: []
    properties: {}
  Time of Day:
    meaning: A reference to the specific hours during which service operations are conducted, influencing the availability of resources and incident response.
    aliases: []
    properties: {}
relationships:
  - name: usesWorkaround
    from: Incident
    to: Workaround
    meaning: This relationship indicates that an incident applies a specific workaround to minimize its impact on users while a permanent solution is developed.
    aliases:
      - applies workaround
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: This relationship reflects that an incident is associated with a materiality assessment that determines the incident's significance and potential reporting requirements.
    aliases:
      - includes materiality assessment
  - name: assessesIncident
    from: MaterialityAssessment
    to: Incident
    meaning: This relationship indicates that a materiality assessment evaluates a specific incident to determine its significance and reporting implications.
    aliases: []
  - name: hasIncidentCommander
    from: Incident
    to: IncidentCommander
    meaning: This relationship indicates that an incident is assigned an incident commander responsible for leading and coordinating the response efforts during significant incidents.
    aliases:
      - assigned incident commander
  - name: requiresEmergencyChange
    from: Incident
    to: EmergencyChange
    meaning: This relationship reflects that an incident necessitates an emergency change to address urgent operational needs swiftly.
    aliases:
      - needs emergency change
  - name: hasPostIncidentReview
    from: Incident
    to: PostIncidentReview
    meaning: null
    aliases: []
  - name: assignedToResolverGroup
    from: Incident
    to: ResolverGroup
    meaning: This relationship indicates that an incident has been designated to a specific resolver group that is responsible for diagnosing and resolving issues related to the incident.
    aliases: []
  - name: impacts
    from: Incident
    to: BusinessService
    meaning: This relationship indicates that an incident has a direct effect on a business service, potentially causing interruptions or degradation of service quality.
    aliases: []
  - name: hasEvidence
    from: Incident
    to: Evidence
    meaning: This relationship indicates that an incident is linked to collected evidence items that support analysis, accountability, and documentation during incident management.
    aliases:
      - documents evidence
  - name: hasRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: This relationship signifies that an incident has an associated regulatory notification made to a competent authority regarding compliance issues stemming from the incident.
    aliases:
      - linked to regulatory notification
  - name: hasStakeholderCommunication
    from: Incident
    to: StakeholderCommunication
    meaning: A stakeholder communication prepared or sent for the incident.
    aliases:
      - includes stakeholder update
      - has communication notice
  - name: triggersRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: A regulatory notification that the incident triggers or requires.
    aliases:
      - initiates regulatory alert
      - prompts compliance notification
  - name: impactsConfigurationItem
    from: Incident
    to: ConfigurationItem
    meaning: A configuration item impacted by the incident.
    aliases:
      - affects CI
      - relates to configuration item
  - name: impactedByIncident
    from: ConfigurationItem
    to: Incident
    meaning: The incident that impacts the configuration item.
    aliases:
      - affected by incident
      - related to incident
      - linked to incident
      - affected by issue
  - name: hasKnownError
    from: Incident
    to: KnownError
    meaning: A known error associated with the incident.
    aliases:
      - is linked to known issue
      - associated with known error
rules:
  canCloseIncident:
    conditions:
      - Incident status is resolved or monitoring.
      - All impacted IT services have an acceptable status.
      - Evidence is documented and retained.
      - Required stakeholder communications are completed.
      - If the incident is a major incident, a post-incident review is scheduled or completed.
  canExecuteEmergencyChange:
    conditions:
      - the emergency change is linked to an incident whose status is new, acknowledged, investigating, contained, recovering, or monitoring
      - at least one affected configuration item is linked to the emergency change
      - the implementation plan is documented
      - the backout plan is documented
      - riskAccepted is true
  canSendStakeholderCommunication:
    conditions:
      - stakeholder communication audience is recorded
      - stakeholder communication message content is recorded
      - stakeholder communication owner is recorded
      - stakeholder communication approvalState is approved
      - the message content matches the latest verified incident state
  canDeclareMajorIncident:
    conditions:
      - Incident status is not resolved, closed, or cancelled.
      - Incident severity is sev1-critical or sev2-high.
      - At least one impacted IT service is identified.
      - An incident commander is assigned.
  canContainIncident:
    conditions:
      - incident status is acknowledged or investigating
      - containment scope is documented
      - expected side effects are documented
  canIsolateConfigurationItem:
    conditions:
      - the configuration item is linked to an active incident or a known error
      - the isolation impact is documented
      - a rollback or reconnection method is available
  canRestoreBackup:
    conditions:
      - backup set status is successful or verified
      - the backup set protects the target configuration item
      - the restore point is approved for restoration
  canSubmitRegulatoryNotification:
    conditions:
      - the linked materiality assessment outcome is reportable
      - the regulatory notification is linked to an incident and a regulator
      - all required fields and supporting evidence are complete
      - the regulatory notification status is approved
      - the regulatory notification is submitted before its due date
  determineRecommendedResolverGroup:
    conditions:
      - prefer the resolver group supporting the affected configuration item
      - if no configuration-item-supported resolver group is available, prefer the resolver group owning the known error
      - if no known-error-owned resolver group applies, prefer the resolver group supporting the affected business service
      - if multiple candidate resolver groups remain, choose the one with the lowest responsePriority number
      - if candidates still tie, choose the one with the best availabilityStatus in this order: available, partially-available, constrained, unavailable
  determineRequiredServiceOwnerApproval:
    conditions:
      - the primary service owner of each affected business service must approve
      - if multiple business services are affected, all affected services' primary service owners must approve
      - consider the approval context, including emergency change, major-incident declaration, incident closure, or regulatory matters
  meetsMajorIncidentThreshold:
    conditions:
      - either all of the following are true: incident severity level is sev1-critical or sev2-high; at least one impacted business service is identified; and the expected duration indicates significant disruption to services
      - or the incident commander recommends major incident declaration based on incident complexity or business impact
  requiresRegulatoryNotification:
    conditions:
      - materiality assessment outcome is reportable or potentially-reportable
      - at least one affected business service is regulatory-sensitive
      - customer impact is significant
      - incident has data integrity impact or availability impact
      - a regulatory notification has not already been submitted for the incident
  canAcknowledgeAlert:
    conditions:
      - The alert status is new or escalated.
  canAssignIncidentToResolverGroup:
    conditions:
      - The incident must not be in a closed or cancelled state.
  canConductPostIncidentReview:
    conditions:
      - There is a Post-Incident Review linked to the Incident with status open or in-progress.
  canDeclareMajorIncident2:
    conditions:
      - The incident is not already marked as a major incident.
  canRestoreBackupForAffectedService:
    conditions:
      - There is a Backup linked to the IT Service with status verified.
  shouldStartRegulatoryNotificationWorkflow:
    conditions:
      - The materiality assessment is completed.
      - The incident meets the criteria for being reportable to the regulatory authorities.
      - There is a need to create a regulatory notification based on the outcomes of the assessment.
actions:
  acknowledgeAlert:
    input: Incident
    preconditions: []
    effect: The related alert status is updated to acknowledged in the monitoring system, indicating that the issue has been recognized and is being addressed.
    verification: Check the related alert in the monitoring system to confirm its status is acknowledged.
  assignIncident:
    input: Incident
    preconditions: []
    effect: The incident is assigned to the appropriate resolver group based on the impacted IT service.
    verification: Check the incident record in the IT service-management platform to confirm it is linked to the designated resolver group.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: The incident status is updated to closed, completing the incident resolution process and retaining required documentation and evidence for audit purposes.
    verification: Review the incident record to confirm closure conditions were met and the closure timestamp was recorded accurately.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: The incident majorIncidentFlag is set to true, the incident is classified as a major incident, enhanced coordination and communication processes are triggered, and an incident commander is assigned.
    verification: Check the incident record to confirm the majorIncidentFlag is set and the relevant declaration communications were sent.
  executeEmergencyChange:
    input: Incident
    preconditions: []
    effect: An emergency change is implemented to address the urgent issue related to the incident, and the emergency change status is updated to reflect execution.
    verification: Review the emergency change implementation, testing outcomes, and post-deployment service health to confirm the change succeeded and achieved the intended resolution.
  restoreServices:
    input: Incident
    preconditions: []
    effect: Services affected by the incident are restored to normal operation according to the approved recovery plan, and service statuses are updated to reflect availability.
    verification: Monitor and confirm the health and operational status of restored services to ensure functionality is fully restored before incident closure.
  containIncident:
    input: Incident
    preconditions: []
    effect: The incident is contained through approved steps, which may include isolating affected configuration items or applying controls to prevent further impact on business services, and the incident status is updated to contained where applicable.
    verification: Review containment indicators to confirm the incident impact was managed successfully and the incident status is contained where applicable.
  sendStakeholderCommunication:
    input: StakeholderCommunication
    preconditions: []
    effect: The stakeholder communication status is set to sent, the communication is sent, the sentAt timestamp is recorded, and the deliveryStatus is updated to reflect delivery outcome.
    verification: Confirm the stakeholder communication status is sent, the deliveryStatus shows successful delivery, and the final message is archived.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: The regulatory notification status changes to submitted and the submission receipt is stored.
    verification: Confirm the regulatory notification status is submitted and the submission receipt is retained.
  communicateIncidentStatus:
    input: Incident
    preconditions: []
    effect: Stakeholders are informed of the current incident status, impact, and ongoing response actions, and the communication is logged.
    verification: Review the communication log to confirm the update was sent to the appropriate stakeholders and archived.
  implementWorkaround:
    input: Incident
    preconditions: []
    effect: A workaround is applied to mitigate the incident's impact on users while a permanent solution is developed.
    verification: Review the workaround implementation record and monitor indicators to confirm the workaround reduced the incident's impact as intended.
  performMaterialityAssessment:
    input: Incident
    preconditions: []
    effect: A materiality assessment is conducted and documented for the incident, determining its significance and setting the appropriate outcome.
    verification: Review the incident's materiality assessment record to confirm the findings and conclusions are accurate and the outcome was communicated to relevant stakeholders.
  recordIncident:
    input: Incident
    preconditions: []
    effect: The incident is created and recorded in the IT service-management platform with all relevant details captured, including status and associated configuration items.
    verification: Review the incident record in the IT service-management platform to confirm the details are correct and the incident is saved.
  isolateConfigurationItem:
    input: ConfigurationItem
    preconditions:
      - canIsolateConfigurationItem
    effect: The configuration item is isolated from defined networks or dependencies to prevent impact on other services.
    verification: Confirm the configuration item is isolated and service health indicators are checked during or after isolation.
  conductPostIncidentReview:
    input: Incident
    preconditions:
      - canConductPostIncidentReview
    effect: The linked Post-Incident Review status becomes completed.
    verification: Confirm that the linked Post-Incident Review status reflects completed.
