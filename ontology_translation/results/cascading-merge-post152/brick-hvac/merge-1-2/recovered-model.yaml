competency_questions:
  - id: cq1
    text: Which air handler feeds a given terminal unit?
  - id: cq4
    text: Which CO2 sensors on a given air handler are outside-air versus return-air sensors?
  - id: cq7
    text: "Which spaces are on a given floor, and which floor contains a given space?"
  - id: cq8
    text: "What HVAC equipment is physically located in a given building, floor, or space?"
  - id: cq9
    text: "Which dampers, fans, filters, and valves are part of a given air handler?"
  - id: cq10
    text: Which zones does a given thermostat serve?
  - id: cq11
    text: Which spaces does a given terminal unit serve?
  - id: cq12
    text: What heating or cooling devices are connected to a given boiler or chiller?
  - id: cq15
    text: Is an occupied zone covered by active control through a serving thermostat or terminal unit?
  - id: cq16
    text: "Which HVAC equipment is physically located in a given building, floor, or space?"
  - id: cq17
    text: Which spaces are contained within a given floor?
  - id: cq18
    text: Which floors are contained within a given building?
  - id: cq19
    text: What cooling or heating device is upstream of a given cooling or heating path?
  - id: cq14
    text: Which air handling unit serves a given air plenum?
  - id: cq15
    text: What upstream equipment feeds a given terminal unit?
  - id: cq16
    text: Which setpoint should be checked when a measured air temperature is not at the desired value?
  - id: cq17
    text: "Is the measured temperature above the cooling setpoint, below the heating setpoint, or within the configured deadband?"
  - id: cq18
    text: Which CO2 sensor monitors outside air for a given air handling system?
  - id: cq19
    text: Which CO2 sensor monitors return air for a given air handling system?
  - id: cq20
    text: When can the economizer be used instead of mechanical cooling for an air handling process?
  - id: cq21
    text: "Which fans, filters, dampers, and valves are part of a given air handling unit?"
  - id: cq22
    text: Which spaces are served by a given terminal unit?
  - id: cq23
    text: Which zone is served by a given thermostat?
  - id: cq24
    text: Which occupancy sensor is associated with a given space?
classes:
  AirHandlingUnit:
    meaning: An air handling unit is a piece of HVAC equipment that moves and conditions air for distribution through part of the building.
    aliases:
      - AHU
      - air handler
    properties:
      operatingStatus:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  TerminalUnit:
    meaning: A terminal unit is a downstream HVAC device that regulates airflow or delivered conditioning for the served area.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  AirPlenum:
    meaning: "An air plenum is a space or component that receives air for supply, return, or exhaust as part of the air-distribution path."
    aliases:
      - plenum
    properties:
      airflowState:
        type: text
        allowed:
          - supply
          - return
          - exhaust
  Thermostat:
    meaning: A thermostat is a control device that monitors temperature and holds a space or zone to a desired temperature target.
    aliases: []
    properties:
      operatingStatus:
        type: text
        allowed:
          - normal
          - fault
          - offline
  TemperatureSensor:
    meaning: A temperature sensor is a sensor that measures temperature.
    aliases: []
    properties:
      sensorValue:
        type: number
        unit: degrees C
  TemperatureSetpoint:
    meaning: A temperature setpoint is a target temperature value used for control.
    aliases: []
    properties:
      setpointValue:
        type: number
        unit: degrees C
  CO2Sensor:
    meaning: A CO2 sensor is a sensor that measures carbon dioxide level in air.
    aliases: []
    properties:
      currentCO2:
        type: number
      sensorValue:
        type: number
  OccupancySensor:
    meaning: An occupancy sensor is a sensor that indicates whether a space or control area is occupied.
    aliases: []
    properties: {}
  Zone:
    meaning: "A zone is a separately controlled area, or group of spaces or areas, that is managed together by the HVAC controls."
    aliases: []
    properties:
      occupancyStatus:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  Space:
    meaning: A space is a physical room or bounded area in the building where people work or occupy.
    aliases: []
    properties: {}
  Floor:
    meaning: A floor is a building level that groups the spaces on that level.
    aliases: []
    properties: {}
  Building:
    meaning: "A building is the overall physical facility that contains the HVAC-served floors, spaces, and equipment."
    aliases: []
    properties: {}
  Damper:
    meaning: "A damper is a device that opens, closes, or modulates to control airflow."
    aliases: []
    properties: {}
  Fan:
    meaning: A fan is a device that moves air through the HVAC system.
    aliases: []
    properties: {}
  Filter:
    meaning: A filter is a device that removes particulates or other unwanted material from the airstream.
    aliases: []
    properties:
      filterCondition:
        type: text
        allowed:
          - clean
          - dirty
          - replacement due
  Boiler:
    meaning: A boiler is a plant device that provides heated fluid for heating.
    aliases: []
    properties: {}
  Chiller:
    meaning: A chiller is a plant device that produces chilled fluid for cooling.
    aliases:
      - chilled-water machine
    properties: {}
  CoolingValve:
    meaning: A cooling valve is a valve that controls cooling by regulating chilled-water flow through a coil.
    aliases: []
    properties:
      position:
        type: number
  HeatingValve:
    meaning: A heating valve is a valve that controls heating by regulating hot-water flow through a coil.
    aliases: []
    properties:
      position:
        type: number
  Economizer:
    meaning: "An economizer is a device or control function that uses suitable air-side conditions to reduce mechanical cooling and, when applicable, mechanical heating."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - disabled
          - enabled
          - active
  OutsideAirCO2Sensor:
    meaning: An outside air CO2 sensor is a CO2 sensor that measures the carbon dioxide level in outside air.
    aliases:
      - outside air CO2 sensor
    properties:
      sensorValue:
        type: number
        unit: ppm
  ReturnAirCO2Sensor:
    meaning: A return air CO2 sensor is a CO2 sensor that measures the carbon dioxide level in return air.
    aliases:
      - return air CO2 sensor
    properties:
      sensorValue:
        type: number
        unit: ppm
  TemperatureDeadbandSetpoint:
    meaning: A temperature deadband setpoint is the configured temperature gap or range where the system should not switch into more heating or cooling.
    aliases:
      - temperature deadband setpoint
    properties:
      value:
        type: number
        unit: temperature
      setpointValue:
        type: number
        unit: degrees C
  HeatingTemperatureSetpoint:
    meaning: A heating temperature setpoint is the temperature target used when the system is trying to heat.
    aliases:
      - heating temperature setpoint
    properties:
      setpointValue:
        type: number
        unit: degrees C
  CoolingTemperatureSetpoint:
    meaning: A cooling temperature setpoint is the temperature target used when the system is trying to cool.
    aliases:
      - cooling temperature setpoint
    properties:
      setpointValue:
        type: number
        unit: degrees C
  AirTemperatureSensor:
    meaning: A sensor that measures the temperature of air.
    aliases: []
    properties:
      sensorValue:
        type: number
        unit: degrees C
  WaterTemperatureSensor:
    meaning: A sensor that measures the temperature of water.
    aliases: []
    properties: {}
  AirTemperatureSetpoint:
    meaning: The target air temperature the control sequence is trying to maintain.
    aliases: []
    properties: {}
  PackagedHeatPump:
    meaning: A self-contained unit that can provide both heating and cooling to a served area.
    aliases: []
    properties: {}
  CondensingUnit:
    meaning: An outdoor refrigeration component that rejects heat as part of a smaller packaged or direct-expansion system.
    aliases: []
    properties: {}
  CoolingTower:
    meaning: A heat-rejection device used to dump unwanted heat from the cooling side to the atmosphere.
    aliases: []
    properties: {}
  Pump:
    meaning: A device that moves water through the heating or cooling loop.
    aliases: []
    properties: {}
  HeatExchanger:
    meaning: A device that transfers heat between two fluid paths without mixing them.
    aliases: []
    properties: {}
  Humidifier:
    meaning: A device that adds moisture to the air.
    aliases: []
    properties: {}
  SpaceHeater:
    meaning: A local heater used to warm a specific room or area.
    aliases: []
    properties: {}
  IsolationValve:
    meaning: null
    aliases: []
    properties: {}
