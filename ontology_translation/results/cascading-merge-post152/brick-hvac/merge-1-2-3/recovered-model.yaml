    text: Which CO2 sensors on an air handling system are outside air versus return air?
classes:
  AirHandlingUnit:
    meaning: "An air handling unit is an assembly and piece of HVAC equipment that moves, circulates, and conditions air for distribution through part of the building air-distribution system."
    aliases:
      - AHU
      - air handler
      - air handling unit
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  TerminalUnit:
    meaning: A terminal unit is a downstream HVAC device that regulates airflow or delivered air temperature for a served area.
    aliases:
      - terminal unit
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  AirPlenum:
    meaning: "An air plenum is a space or HVAC component that receives air for supply, return, distribution, or exhaust as part of the air-distribution path."
    aliases:
      - plenum
      - air plenum
    properties:
      airflowState:
        type: text
        allowed:
          - supply
          - return
          - exhaust
  Thermostat:
    meaning: A thermostat is an automatic control device that monitors temperature and maintains temperature for a served space or zone to a desired temperature target.
    aliases:
      - thermostat
    properties:
      operatingMode:
        type: text
        allowed:
          - heating
          - cooling
          - auto
          - "off"
      status:
        type: text
        allowed:
          - normal
          - fault
          - offline
  TemperatureSensor:
    meaning: A temperature sensor is a sensor that measures temperature.
    aliases:
      - temperature sensor
    properties:
      measuredTemperatureValue:
        type: number
      status:
        type: text
  TemperatureSetpoint:
    meaning: A temperature setpoint is a desired target temperature value used for control.
    aliases:
      - temperature setpoint
      - setpoint
    properties:
      temperatureSetpointValue:
        type: number
  CO2Sensor:
    meaning: A CO2 sensor is a sensor that measures carbon dioxide level in air.
    aliases: []
    properties:
      currentCO2:
        type: number
  OccupancySensor:
    meaning: An occupancy sensor is a sensor that detects or indicates whether a space or control area is occupied.
    aliases:
      - occupancy sensor
    properties:
      occupancyState:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  Zone:
    meaning: "A zone is a separately controlled area, or group of spaces or areas, treated as one HVAC control grouping and managed together by the HVAC controls."
    aliases:
      - zone
    properties:
      occupancyState:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  Space:
    meaning: "A space is a physical room or bounded area within a floor where people may work or occupy and that may be served, sensed, or controlled."
    aliases: []
    properties: {}
  Floor:
    meaning: A floor is a building level that groups or contains the spaces on that level and may contain HVAC equipment.
    aliases:
      - storey
    properties: {}
  Building:
    meaning: "A building is the overall physical facility or independent built structure that contains the HVAC-served floors, spaces, and HVAC systems in scope."
    aliases: []
    properties: {}
  Damper:
    meaning: "A damper is a device or element in an air-distribution system that opens, closes, modulates, or otherwise changes airflow rate, air resistance, or shuts off airflow."
    aliases:
      - damper
    properties:
      damperPosition:
        type: number
        unit: percent
  Fan:
    meaning: A fan is a device with rotating blades or vanes that moves air through the HVAC system to produce airflow.
    aliases:
      - fan
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Filter:
    meaning: A filter is a device that removes particulates or other unwanted material from an air or fluid stream.
    aliases:
      - filter
    properties:
      conditionStatus:
        type: text
        allowed:
          - clean
          - dirty
          - replacement due
  Boiler:
    meaning: "A boiler is a vessel, plant device, or heating source that provides heated fluid, hot water, or steam for heating applications."
    aliases:
      - boiler
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Chiller:
    meaning: A chiller is a plant device or refrigerating machine that produces chilled fluid and transfers heat between fluids for cooling.
    aliases:
      - chilled-water machine
      - chiller
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  CoolingValve:
    meaning: A cooling valve is a valve that controls cooling or air temperature by regulating or modulating chilled-water flow through a cooling coil.
    aliases:
      - cooling valve
    properties:
      valvePosition:
        type: number
        unit: percent
  HeatingValve:
    meaning: A heating valve is a valve that controls heating or air temperature by regulating or modulating hot-water flow through a heating coil.
    aliases:
      - heating valve
    properties:
      valvePosition:
        type: number
        unit: percent
  Economizer:
    meaning: "An economizer is a device or control function that uses suitable sensed air-side conditions to reduce mechanical cooling and, when applicable, mechanical heating demand."
    aliases:
      - economizer
    properties:
      status:
        type: text
        allowed:
          - disabled
          - enabled
          - active
  OutsideAirCO2Sensor:
    meaning: An outside-air CO2 sensor is a sensor that measures carbon dioxide concentration in outside air.
    aliases:
      - outside air CO2 sensor
      - outside-air CO2 sensor
    properties:
      currentCO2Value:
        type: number
  ReturnAirCO2Sensor:
    meaning: A return-air CO2 sensor is a sensor that measures carbon dioxide concentration in return air.
    aliases:
      - return air CO2 sensor
      - return-air CO2 sensor
    properties:
      sensorValue:
        type: number
        unit: ppm
      currentCO2Value:
        type: number
  TemperatureDeadbandSetpoint:
    meaning: A temperature deadband setpoint is a setpoint that defines the configured size of the allowed temperature deadband or range where the system should not switch into more heating or cooling.
    aliases:
      - temperature deadband setpoint
    properties:
      value:
        type: number
        unit: temperature
      temperatureSetpointValue:
        type: number
  HeatingTemperatureSetpoint:
    meaning: A heating temperature setpoint is a setpoint that defines the temperature target used when the system is trying to heat.
    aliases:
      - heating temperature setpoint
    properties:
      temperatureSetpointValue:
        type: number
        unit: degrees C
  CoolingTemperatureSetpoint:
    meaning: A cooling temperature setpoint is a setpoint that defines the temperature target used when the system is trying to cool.
    aliases:
      - cooling temperature setpoint
    properties:
      temperatureSetpointValue:
        type: number
        unit: degrees C
  AirTemperatureSensor:
    meaning: A sensor that measures the temperature of air.
    aliases:
      - air temperature sensor
    properties:
      measuredTemperatureValue:
        type: number
      status:
        type: text
  WaterTemperatureSensor:
    meaning: A sensor that measures the temperature of water.
    aliases: []
    properties: {}
  AirTemperatureSetpoint:
    meaning: An air temperature setpoint is the target setpoint that sets the temperature of air the control sequence is trying to maintain.
    aliases:
      - air temperature setpoint
    properties:
      temperatureSetpointValue:
        type: number
  PackagedHeatPump:
    meaning: A self-contained unit that can provide both heating and cooling to a served area.
    aliases: []
    properties: {}
  CondensingUnit:
    meaning: An outdoor refrigeration component that rejects heat as part of a smaller packaged or direct-expansion system.
    aliases: []
    properties: {}
  CoolingTower:
    meaning: A heat-rejection device used to dump unwanted heat from the cooling side to the atmosphere.
    aliases: []
    properties: {}
  Pump:
    meaning: A device that moves water through the heating or cooling loop.
    aliases: []
    properties: {}
  HeatExchanger:
    meaning: A device that transfers heat between two fluid paths without mixing them.
    aliases: []
    properties: {}
  Humidifier:
    meaning: A device that adds moisture to the air.
    aliases: []
    properties: {}
  SpaceHeater:
    meaning: A local heater used to warm a specific room or area.
    aliases: []
    properties: {}
  IsolationValve:
    meaning: null
    aliases: []
    properties: {}
