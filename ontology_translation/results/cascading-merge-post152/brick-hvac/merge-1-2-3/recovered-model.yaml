classes:
  AirHandler:
    meaning: An air-side unit that conditions and moves air for distribution to served parts of the building.
    aliases:
      - air handler
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
      name:
        type: text
  Zone:
    meaning: "An area, or group of spaces, that is served and regulated together as one HVAC control zone to maintain similar comfort conditions for heating and cooling."
    aliases:
      - zone
    properties:
      occupancyStatus:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
      name:
        type: text
  TerminalUnit:
    meaning: A downstream HVAC device that regulates air delivery or delivered conditioning for the zone or space it serves.
    aliases:
      - terminal unit
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
      name:
        type: text
  Space:
    meaning: "A physical room or area in the building that can be served, sensed, and located, such as an office, conference room, or open work area."
    aliases:
      - room
      - space
    properties:
      name:
        type: text
      maximumOccupancy:
        type: number
  Floor:
    meaning: A building level that contains spaces and may contain HVAC equipment.
    aliases:
      - floor
    properties:
      name:
        type: text
  Thermostat:
    meaning: A control device that senses conditions and applies zone-level control using a temperature reading and setpoint to maintain the desired condition in the area it controls.
    aliases:
      - stat
      - thermostat
    properties:
      status:
        type: text
        allowed:
          - normal
          - fault
          - offline
      mode:
        type: text
        allowed:
          - heating
          - cooling
          - auto
          - "off"
      name:
        type: text
  OccupancySensor:
    meaning: A sensor used to detect whether a space or area is occupied for HVAC control.
    aliases:
      - occ sensor
      - occupancy sensor
    properties:
      occupied:
        type: text
        allowed:
          - occupied
          - unoccupied
          - unknown
  TemperatureSensor:
    meaning: A sensor that measures temperature for HVAC monitoring or control.
    aliases:
      - temperature sensor
    properties:
      value:
        type: number
  TemperatureSetpoint:
    meaning: The target temperature value a control device is trying to maintain.
    aliases:
      - temperature setpoint
    properties:
      value:
        type: number
  OutsideAirCO2Sensor:
    meaning: A sensor that measures CO2 in outside air for an air handler or related control path.
    aliases:
      - outside-air CO2 sensor
      - outside air CO2 sensor
    properties:
      value:
        type: number
  ReturnAirCO2Sensor:
    meaning: A sensor that measures CO2 in return air for an air handler or related control path.
    aliases:
      - return-air CO2 sensor
      - return air CO2 sensor
    properties:
      value:
        type: number
  Damper:
    meaning: "A device that regulates airflow in the air system by opening, closing, or modulating an HVAC path."
    aliases:
      - damper
    properties:
      position:
        type: number
  Fan:
    meaning: A device or part that moves air as part of HVAC equipment operation.
    aliases:
      - fan
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Filter:
    meaning: A component or part that removes particulates or other unwanted material from the airstream.
    aliases:
      - filter
    properties: {}
  CoolingValve:
    meaning: A valve that controls cooling-medium flow used to regulate HVAC cooling.
    aliases:
      - cooling valve
    properties:
      position:
        type: number
  HeatingValve:
    meaning: A valve that controls heating-medium flow used to regulate HVAC heating.
    aliases:
      - heating valve
    properties:
      position:
        type: number
  Building:
    meaning: "The overall facility that contains floors, spaces, zones, and HVAC equipment."
    aliases:
      - building
    properties:
      name:
        type: text
  Boiler:
    meaning: "Equipment that provides heating to served HVAC paths, typically by heating water for the building's heating side."
    aliases:
      - boiler
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  Chiller:
    meaning: "Equipment that provides cooling to served HVAC paths, typically by cooling water for the building's cooling side."
    aliases:
      - chiller
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  PackagedHeatPump:
    meaning: A self-contained unit that provides heating or cooling to the area or HVAC path it serves.
    aliases:
      - packaged heat pump
      - heat pump
    properties:
      status:
        type: text
        allowed:
          - "off"
          - "on"
          - alarm
  AirTemperatureSensor:
    meaning: A sensor that measures air temperature for HVAC monitoring or control in the air-handling process.
    aliases:
      - air temperature sensor
    properties:
      value:
        type: number
  AirTemperatureSetpoint:
    meaning: The setpoint that defines the target air temperature for control of an air-handling process.
    aliases:
      - air temperature setpoint
    properties:
      value:
        type: number
  CoolingTemperatureSetpoint:
    meaning: The temperature setpoint that defines the cooling target used by HVAC control.
    aliases:
      - cooling temperature setpoint
      - cooling setpoint
    properties:
      value:
        type: number
  HeatingTemperatureSetpoint:
    meaning: The temperature setpoint that defines the heating target used by HVAC control.
    aliases:
      - heating temperature setpoint
      - heating setpoint
    properties:
      value:
        type: number
  DeadbandSetpoint:
    meaning: The setpoint that defines the neutral allowed temperature range or gap around the control target between active heating and active cooling.
    aliases:
      - temperature deadband setpoint
      - deadband setpoint
    properties:
      value:
        type: number
  Economizer:
    meaning: "A control function, air-side capability, or assembly that uses suitable outside-air conditions to reduce mechanical heating or cooling."
    aliases:
      - economizer
    properties:
      status:
        type: text
        allowed:
          - disabled
          - enabled
          - active
  AirPlenum:
    meaning: "A space, chamber, or air-side plenum through which air is distributed or returned as part of a serving path."
    aliases:
      - air plenum
      - plenum
    properties: {}
  WaterTemperatureSensor:
    meaning: A sensor that measures the temperature of water in the heating or cooling system.
    aliases:
      - water temperature sensor
    properties:
      value:
        type: number
  CO2Sensor:
    meaning: A sensor that measures CO2 concentration in air.
    aliases:
      - CO2 sensor
    properties: {}
  Humidifier:
    meaning: A device in an air handler that adds moisture to the air stream.
    aliases:
      - humidifier
    properties: {}
  Pump:
    meaning: A device that moves water through the heating or cooling loop.
    aliases:
      - pump
    properties: {}
  CoolingTower:
    meaning: The heat-rejection equipment that helps the cooling side dump heat outdoors.
    aliases:
      - cooling tower
    properties: {}
  HeatExchanger:
    meaning: A device that transfers heat between separated fluid paths.
    aliases:
      - heat exchanger
    properties: {}
