rules:
  canIncreaseCooling:
    conditions:
      - the air handler has an air temperature sensor with a value above the cooling temperature setpoint value
  canIncreaseHeating:
    conditions:
      - the air handler has an air temperature sensor with a value below the heating temperature setpoint value
  canMaintainWithinDeadband:
    conditions:
      - the air handler has an air temperature sensor with a value within the configured deadband around the active setpoint
  economizerContextAvailable:
    conditions:
      - the air handler has the economizer as a part
      - the air handler has an outside-air CO2 sensor with a value
      - the air handler has a return-air CO2 sensor with a value
  canVerifyOccupiedZoneConditioning:
    conditions:
      - "the zone has an occupancy sensor showing occupied, or the zone contains a space that has an occupancy sensor showing occupied"
      - "the zone is served by a thermostat, or the zone contains a space served by a terminal unit"
  occupiedZoneRequiresControl:
    conditions:
      - the zone occupancy status is occupied
      - a thermostat serves the zone
  investigateAirQuality:
    conditions:
      - an air handler has an outside-air CO2 sensor and a return-air CO2 sensor
      - one of those CO2 readings is elevated relative to the expected condition for that air path
actions:
  enableEconomizer:
    input: AirHandler
    preconditions:
      - economizerContextAvailable
    effect: The air handler operates with the economizer to reduce mechanical cooling.
    verification: Confirm that the economizer status indicates economizer operation.
  increaseCooling:
    input: AirHandler
    preconditions:
      - canIncreaseCooling
    effect: The cooling path is increased on the air handler to reduce air temperature toward the cooling temperature setpoint.
    verification: Confirm that the later air temperature sensor value trends downward toward the cooling temperature setpoint.
  increaseHeating:
    input: AirHandler
    preconditions:
      - canIncreaseHeating
    effect: The heating path is increased on the air handler to raise air temperature toward the heating temperature setpoint.
    verification: Confirm that the later air temperature sensor value trends upward toward the heating temperature setpoint.
  maintainWithinDeadband:
    input: AirHandler
    preconditions:
      - canMaintainWithinDeadband
    effect: No heating or cooling change is required while temperature remains within the configured deadband.
    verification: Confirm temperature remains within the configured deadband.
  verifyOccupiedZoneConditioning:
    input: Zone
    preconditions:
      - canVerifyOccupiedZoneConditioning
    effect: Verify that occupied zone conditioning is available for the zone using its serving control context and any available related equipment status information.
    verification: "Confirm the zone occupancy status and current conditioning state for the occupied zone, including whether a thermostat serves the zone or the zone contains a space served by a terminal unit, using any available related equipment and status information."
