competency_questions:
  - id: cq1
    text: What maintenance state does an item have right now?
  - id: cq18
    text: "If I look at a specific failure event, which failed states did it cause?"
  - id: cq22
    text: What qualification specification is required for this maintenance activity?
  - id: cq24
    text: "What function was the item supposed to perform when the failure happened, or during the process when it was operating?"
  - id: cq25
    text: What failure mode code do we use for this known undesirable disposition?
  - id: cq27
    text: "Which items are currently in an operating state, degraded state, or failed state?"
  - id: cq28
    text: Which failure event put an item into the failed state?
  - id: cq29
    text: What effects resulted from a failure event?
  - id: cq30
    text: Which maintenance process does a work order describe?
  - id: cq31
    text: Which maintenance strategy governs a given maintenance process?
  - id: cq32
    text: Which maintenance activities make up a maintenance process?
  - id: cq33
    text: Which qualified maintenance person can perform a specified maintenance activity?
classes:
  MaintainableItem:
    meaning: "The physical maintainable item we are responsible for maintaining, whose function, condition, failure, and maintenance are tracked."
    aliases: []
    properties: {}
  MaintenanceState:
    meaning: "The condition an item is in while its functions, capabilities, and the grade at which they are realized remain unchanged."
    aliases: []
    properties:
      stateCategory:
        type: text
        allowed:
          - operating
          - degraded
          - failed
  FailureEvent:
    meaning: The event that causes an item to lose its ability to perform its required function.
    aliases:
      - failure
    properties: {}
  FailedState:
    meaning: The condition in which an item cannot perform its required function because a failure event has occurred.
    aliases: []
    properties: {}
  MaintenanceWorkOrderRecord:
    meaning: The maintenance work order record that describes the maintenance process and captures the key information about the work to be carried out.
    aliases:
      - maintenance work order
      - MWO
    properties:
      workOrderDate:
        type: date
      taskDescription:
        type: text
      taskCode:
        type: text
      cost:
        type: number
      performedTaskInformation:
        type: text
  MaintenanceProcess:
    meaning: The work carried out to retain or restore the function of a maintainable item under a maintenance strategy.
    aliases: []
    properties: {}
  MaintenanceStrategy:
    meaning: The maintenance approach used to enable an asset to achieve the intended maintenance objectives.
    aliases: []
    properties: {}
  MaintenanceActivity:
    meaning: "A single maintenance task carried out to retain or restore the function of a maintainable item, whether as part of a maintenance process or as one of its tasks."
    aliases: []
    properties:
      status:
        type: text
  QualificationSpecification:
    meaning: The defined requirement that identifies the need for a person to have an assessed skill for a specific task.
    aliases: []
    properties: {}
  QualifiedMaintenancePerson:
    meaning: A person who is qualified to perform a specified maintenance activity.
    aliases: []
    properties: {}
  RequiredFunction:
    meaning: The function of a maintainable item that it must be able to perform to fulfill what it is needed for.
    aliases:
      - primary function
    properties: {}
  FunctioningProcess:
    meaning: The process in which an item is carrying out its function.
    aliases: []
    properties: {}
  FailureModeCode:
    meaning: The code used to describe a known undesirable disposition in a consistent way.
    aliases: []
    properties:
      code:
        type: text
  UndesirableDisposition:
    meaning: A tendency of an item to undergo a process that leads to an unwanted outcome.
    aliases:
      - failure mode
    properties: {}
  FailureEffect:
    meaning: "The consequence that follows from a failure event, either within the failed item or beyond its boundary."
    aliases: []
    properties: {}
  SupportingMaintenanceActivity:
    meaning: A supporting maintenance activity is a single action carried out in support of executing a maintenance process.
    aliases: []
    properties: {}
relationships:
  - name: hasMaintenanceState
    from: MaintainableItem
    to: MaintenanceState
    meaning: The maintainable item is currently in that maintenance state.
    aliases: []
  - name: requiresQualificationSpecification
    from: MaintenanceActivity
    to: QualificationSpecification
    meaning: That maintenance activity requires that qualification specification to be satisfied before the work can be assigned.
    aliases:
      - prescribed by
  - name: hasRequiredFunction
    from: MaintainableItem
    to: RequiredFunction
    meaning: The item has that required function as part of what it is expected to do.
    aliases: []
  - name: isPerformedOn
    from: MaintenanceProcess
    to: MaintainableItem
    meaning: the maintenance process is carried out on that item.
    aliases: []
  - name: isInFailedState
    from: MaintainableItem
    to: FailedState
    meaning: The item is currently in that failed condition.
    aliases: []
  - name: isQualifiedFor
    from: QualifiedMaintenancePerson
    to: MaintenanceActivity
    meaning: The qualified maintenance person is qualified to perform that maintenance activity.
    aliases: []
  - name: realizes
    from: FunctioningProcess
    to: RequiredFunction
    meaning: The functioning process is the process in which the required function is carried out.
    aliases: []
  - name: isAssignedTo
    from: MaintenanceActivity
    to: QualifiedMaintenancePerson
    meaning: The maintenance activity is assigned to that qualified maintenance person.
    aliases: []
  - name: hasSupportingMaintenanceActivity
    from: MaintenanceProcess
    to: SupportingMaintenanceActivity
    meaning: A maintenance process includes a supporting maintenance activity in its execution.
    aliases: []
  - name: initiatesFailedState
    from: FailureEvent
    to: MaintenanceState
    meaning: A failure event begins a failed state.
    aliases: []
  - name: describesMaintenanceProcess
    from: MaintenanceWorkOrderRecord
    to: MaintenanceProcess
    meaning: The maintenance work order record describes the maintenance process.
    aliases: []
  - name: governedByStrategy
    from: MaintenanceProcess
    to: MaintenanceStrategy
    meaning: The maintenance process is carried out under that maintenance strategy.
    aliases:
      - isGovernedBy
      - prescribed by
  - name: hasMaintenanceActivity
    from: MaintenanceProcess
    to: MaintenanceActivity
    meaning: The maintenance process includes that maintenance activity as one of its tasks.
    aliases: []
  - name: isAssociatedWithRequiredFunction
    from: FailureEvent
    to: RequiredFunction
    meaning: The failure event is associated with the required function that is relevant to the loss of performance.
    aliases: []
  - name: hasFailureEffect
    from: FailureEvent
    to: FailureEffect
    meaning: The failure event has that failure effect as a consequence.
    aliases: []
rules:
  canStartMaintenanceProcess:
    conditions:
      - the maintenance process is governed by a maintenance strategy
      - a maintenance work order record describes the maintenance process
  canClassifyItemAsFailed:
    conditions:
      - a failure event has occurred
      - the item cannot perform its required function
  canAssignQualifiedMaintenancePerson:
    conditions:
      - the maintenance activity requires a qualification specification
      - the qualified maintenance person is qualified for the maintenance activity
  canCloseMaintenanceWorkOrder:
    conditions:
      - the maintenance activities in the maintenance process described by the maintenance work order are completed
      - the maintenance work order record has been updated with the performed task information
  canCreateMaintenanceWorkOrder:
    conditions:
      - a maintenance process is needed to retain or restore function
actions:
  classifyItemAsFailed:
    input: FailureEvent
    preconditions:
      - canClassifyItemAsFailed
    effect: Classify an item as failed after a failure event.
    verification: Confirm the item is recorded as failed following the failure event.
  createMaintenanceWorkOrder:
    input: MaintenanceProcess
    preconditions:
      - canCreateMaintenanceWorkOrder
    effect: Create a maintenance work order record describing the maintenance process.
    verification: Confirm a maintenance work order record exists describing the maintenance process.
  assignQualifiedMaintenancePerson:
    input: MaintenanceActivity
    preconditions:
      - canAssignQualifiedMaintenancePerson
    effect: Assign a qualified maintenance person to a maintenance activity.
    verification: Confirm the maintenance activity is assigned to a qualified maintenance person.
  startMaintenanceProcess:
    input: MaintenanceProcess
    preconditions:
      - canStartMaintenanceProcess
    effect: Start a maintenance process once the strategy and work order are in place.
    verification: "Confirm the maintenance process has started, a maintenance strategy governs it, and a maintenance work order record describes it."
  closeMaintenanceWorkOrder:
    input: MaintenanceWorkOrderRecord
    preconditions:
      - canCloseMaintenanceWorkOrder
    effect: Close a maintenance work order when the activities are completed and the record has been updated with the performed task information.
    verification: Confirm the maintenance work order record reflects closure after all maintenance activities are completed and the performed task information is recorded.
