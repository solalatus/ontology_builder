rules:
  canMaintainTraceability:
    conditions:
      - tracking events are recorded for the relevant shipment or lot
      - "the relevant lot, logistic unit, or load is identified where traceability depends on it"
  canPrepareShipment:
    conditions:
      - the shipment has a ship-from location
      - the shipment has a ship-to location
      - a carrier is identified for the shipment preparation process or a freight forwarding service is arranged
      - a shipment preparation process is identified for the shipment
  canReceiveShipment:
    conditions:
      - a receiving process occurs at a facility
      - a ship-to location is identified for the shipment
      - the shipment is associated with a transport process reaching the destination node
actions:
  prepareShipmentForDispatch:
    input: Shipment
    preconditions:
      - canPrepareShipment
    effect: Prepare a shipment for dispatch.
    verification: Confirm the shipment has been prepared for dispatch.
  dispatchShipment:
    input: Shipment
    preconditions: []
    effect: the shipment is dispatched.
    verification: confirm the shipment has been dispatched.
  receiveShipmentAtDestinationFacility:
    input: Shipment
    preconditions:
      - canReceiveShipment
    effect: The shipment is recorded as received.
    verification: Confirm the shipment is identified and receipt has been recorded.
  evaluateSupplyRelationship:
    input: SupplyRelationship
    preconditions: []
    effect: "the relevant supplier, customer, and material trade item or product context is identified for the supply relationship."
    verification: "confirm the supply relationship can be retrieved with its supplier, customer, and material trade item."
  identifyCarrierForShipmentPreparationProcess:
    input: ShipmentPreparationProcess
    preconditions: []
    effect: the carrier involved in the shipment preparation process is identified.
    verification: confirm the responsible carrier can be retrieved for the shipment preparation process.
  findShipmentForShipFromAndShipToLocation:
    input: Shipment
    preconditions: []
    effect: the shipment for the given ship-from and ship-to location is identified.
    verification: confirm the shipment can be retrieved with those ship-from and ship-to locations.
  checkWhetherShipmentCanBePrepared:
    input: Shipment
    preconditions: []
    effect: A preparation eligibility result is produced for the shipment.
    verification: Confirm the preparation eligibility result was produced.
  checkWhetherShipmentCanBeReceived:
    input: Shipment
    preconditions: []
    effect: A receiving eligibility result is produced for the shipment.
    verification: Confirm the receiving eligibility result was produced.
  checkWhetherTrackingEventHasEnoughInformationToBeRecorded:
    input: TrackingEvent
    preconditions: []
    effect: A tracking event completeness result is produced.
    verification: Confirm the tracking event completeness result was produced.
  checkWhetherTraceabilityCanBeMaintained:
    input: Shipment
    preconditions: []
    effect: The shipment is reviewed for traceability support.
    verification: Confirm the shipment is identified for traceability review.
  recordTrackingEventForShipment:
    input: TrackingEvent
    preconditions: []
    effect: Record a tracking event for a shipment.
    verification: Confirm the tracking event was recorded for the shipment.
  recordTrackingEventForTraceableUnit:
    input: TrackingEvent
    preconditions: []
    effect: "Record a tracking event for a lot, logistic unit, or load."
    verification: "Confirm the tracking event was recorded for the relevant lot, logistic unit, or load."
