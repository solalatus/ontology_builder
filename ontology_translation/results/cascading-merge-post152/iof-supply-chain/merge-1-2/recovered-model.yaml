    aliases: []
  - name: dependsOnProduct
    from: SupplyRelationship
    to: MaterialTradeItem
    meaning: The supply relationship depends on the material trade item or product involved.
    aliases: []
  - name: concernsItem
    from: PurchaseOrder
    to: MaterialTradeItem
    meaning: The purchase order is for the material trade item.
    aliases: []
  - name: concernsItem
    from: Shipment
    to: MaterialTradeItem
    meaning: The shipment concerns the material trade item being moved.
    aliases: []
  - name: shipsFrom
    from: Shipment
    to: ShipFromLocation
