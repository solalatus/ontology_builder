rules:
  canRecordTrackingEvent:
    conditions:
      - "the tracked shipment, lot, logistic unit, or load is identified"
      - tracking event eventTime is present
      - "tracking event eventType is one of packed, shipped, arrived, received, or stored"
  canReceiveShipment:
    conditions:
      - a receiving process occurs at a facility
      - the ship-to location is identified for the shipment
      - the shipment is associated with a transport process that has reached its end point
  canPrepareShipment:
    conditions:
      - the shipment has a ship-from location
      - the shipment has a ship-to location
      - the shipment has a shipment preparation process
      - "either the shipment preparation process involves a carrier, or the shipment has a freight forwarding process associated with a freight forwarding service"
      - the shipment has a transportation service or a freight forwarding service
  canEvaluateSupplyRelationship:
    conditions:
      - the supplier is identified for the supply relationship
      - the customer is identified for the supply relationship
      - the material trade item is identified for the supply relationship
actions:
  prepareShipment:
    input: Shipment
    preconditions:
      - canPrepareShipment
    effect: "The shipment is documented with ship-from and ship-to locations, its shipment preparation process, and either a carrier-backed preparation path or a freight-forwarding-backed preparation path, including transportation service or freight forwarding service where identified."
    verification: "Confirm the shipment has assigned shipping locations and an identified preparation and carrier or freight-forwarding arrangement, with transportation service or freight forwarding service identified as applicable."
  dispatchShipment:
    input: Shipment
    preconditions: []
    effect: Release a shipment for movement after the shipment to be dispatched is identified.
    verification: Confirm the shipment has been identified and released for movement.
  receiveShipment:
    input: Shipment
    preconditions:
      - canReceiveShipment
    effect: "The shipment is recorded as received at the destination facility, linked to its receiving process, and the receiving process is completed."
    verification: "Confirm receipt of the shipment at the destination facility, linkage to the receiving process at a facility, and completion of the receiving process."
  recordTrackingEvent:
    input: TrackingEvent
    preconditions:
      - canRecordTrackingEvent
    effect: "A new tracking event is linked to the relevant tracked unit, with its event time and event type recorded."
    verification: "Confirm the event time, event type, and the linked shipment, lot, logistic unit, or load were recorded."
  evaluateSupplyRelationship:
    input: SupplyRelationship
    preconditions:
      - canEvaluateSupplyRelationship
    effect: "Review the supplier-customer-item dependency to confirm the relationship being relied on, with supplier, customer, and material trade item dependencies identified."
    verification: "Confirm the supply relationship has been reviewed against the relevant supplier, customer, and item dependencies identified."
