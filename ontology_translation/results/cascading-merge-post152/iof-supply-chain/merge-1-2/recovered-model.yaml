  - id: cq15
    text: Which container is being used for this shipment?
  - id: cq16
    text: Which freight container is being used for this shipment?
  - id: cq17
    text: What tracking events have been recorded for this shipment?
  - id: cq18
    text: What tracking events have been recorded for this lot?
  - id: cq19
    text: What must be recorded to keep traceability intact for this shipment or lot?
  - id: cq20
    text: Which logistics service applies to what is happening right now?
  - id: cq21
    text: Which transportation service applies to what is happening right now?
  - id: cq22
    text: Which packaging service applies to what is happening right now?
  - id: cq23
    text: Which storage service applies to what is happening right now?
  - id: cq24
    text: Which transportation service applies to a given activity?
  - id: cq24
    text: "What supply relationship applies to a given supplier, customer, and product combination?"
  - id: cq25
    text: Which shipment is being prepared from a given ship-from location to a given ship-to location?
  - id: cq26
    text: What item is a given purchase order for?
  - id: cq27
    text: What item is a given shipment moving?
  - id: cq28
    text: Which purchase order does a given shipment fulfill?
  - id: cq29
    text: Which carrier is involved in a given transportation service?
  - id: cq30
    text: Which carrier is involved in a given shipment preparation process?
  - id: cq31
