    to: Shipment
    meaning: The tracking event records information about the shipment.
    aliases: []
  - name: tracks
    from: TrackingEvent
    to: Lot
    meaning: The tracking event records information about the lot.
    aliases: []
  - name: tracks
    from: TrackingEvent
    to: LogisticUnit
    meaning: The tracking event records information about the logistic unit.
    aliases: []
  - name: tracks
    from: TrackingEvent
    to: Load
