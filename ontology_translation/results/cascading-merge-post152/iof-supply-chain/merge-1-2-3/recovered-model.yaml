classes:
  Supplier:
    meaning: A trading partner that supplies goods or services in the supply chain.
    aliases:
      - supplier
    properties:
      supplierIdentifier:
        type: text
  Carrier:
    meaning: A supplier responsible for carrying or transporting shipments.
    aliases:
      - carrier
    properties:
      carrierIdentifier:
        type: text
  Customer:
    meaning: A trading partner that receives supplied goods or services in the supply chain.
    aliases:
      - customer
    properties:
      customerIdentifier:
        type: text
  FreightForwarder:
    meaning: An agent that arranges freight forwarding activities and services.
    aliases:
      - freight forwarder
    properties:
      freightForwarderIdentifier:
        type: text
  Shipper:
    meaning: The sending party that consigns a shipment for movement.
    aliases:
      - consignor
    properties: {}
  Consignee:
    meaning: The agent designated to receive a shipment.
    aliases: []
    properties: {}
  Shipment:
    meaning: "A traceable unit of goods being prepared, moved, or received through the supply chain."
    aliases:
      - shipment
    properties:
      shipmentIdentifier:
        type: text
  PurchaseOrder:
    meaning: An agreement that requests or authorizes the supply of goods or services.
    aliases:
      - purchase order
      - order
    properties:
      purchaseOrderIdentifier:
        type: text
  MaterialTradeItem:
    meaning: "A material item treated as something we buy, sell, ship, or otherwise trade in supply-chain operations."
    aliases:
      - material trade item
    properties:
      materialTradeItemIdentifier:
        type: text
  TraceableResourceUnit:
    meaning: A material unit that can be traced through supply-chain activities.
    aliases: []
    properties: {}
  Lot:
    meaning: A traceable production or supply lot used for batch-level control.
    aliases:
      - lot
    properties:
      lotIdentifier:
        type: text
  Sublot:
    meaning: A traceable subdivision of a lot.
    aliases: []
    properties: {}
  LogisticUnit:
    meaning: A traceable logistics handling unit used in storage and transport.
    aliases:
      - logistic unit
    properties:
      logisticUnitIdentifier:
        type: text
  Load:
    meaning: A traceable load unit prepared for handling or transport.
    aliases:
      - load
    properties:
      loadIdentifier:
        type: text
  TransportProcess:
    meaning: A movement process that transports goods from one point in the supply chain to another.
    aliases:
      - transport process
      - transport move
    properties:
      transportIdentifier:
        type: text
  ShipmentPreparationProcess:
    meaning: A process that prepares a shipment for dispatch.
    aliases:
      - shipment preparation process
    properties: {}
  ReceivingProcess:
    meaning: A business process that receives incoming goods or shipments.
    aliases:
      - receiving process
    properties: {}
  StorageProcess:
    meaning: A planned process that stores goods or traceable units.
    aliases:
      - storage process
    properties: {}
  Facility:
    meaning: A physical facility used in supply-chain operations.
    aliases:
      - facility
    properties:
      facilityIdentifier:
        type: text
  ShipFromLocation:
    meaning: The location from which a shipment is sent.
    aliases:
      - ship-from location
    properties:
      shipFromLocationIdentifier:
        type: text
  ShipToLocation:
    meaning: The location to which a shipment is sent.
    aliases:
      - ship-to location
    properties:
      shipToLocationIdentifier:
        type: text
  Container:
    meaning: A material object used to hold or transport goods.
    aliases:
      - container
    properties:
      containerIdentifier:
        type: text
  FreightContainer:
    meaning: A container specifically used for freight transport.
    aliases:
      - freight container
    properties:
      freightContainerIdentifier:
        type: text
  FreightForwardingService:
    meaning: A service that provides freight forwarding capability.
    aliases:
      - freight forwarding service
    properties: {}
  LogisticsService:
    meaning: A commercial logistics service used in supply-chain operations.
    aliases: []
    properties: {}
  TransportationService:
    meaning: A service that provides transportation capability for supply-chain movement.
    aliases:
      - transportation service
    properties: {}
  PackagingService:
    meaning: A service that provides packaging capability for goods.
    aliases: []
    properties: {}
  StorageService:
    meaning: A service that provides storage capability for goods.
    aliases: []
    properties: {}
  InventoryManagement:
    meaning: A business process that manages inventory.
    aliases: []
    properties: {}
  TrackingEvent:
    meaning: "An event recorded to track movement, handling, or state changes of traceable units."
    aliases:
      - tracking event
    properties:
      eventTime:
        type: date
      eventType:
        type: text
        allowed:
          - packed
          - shipped
          - arrived
          - received
          - stored
  SupplyRelationship:
    meaning: "The supply dependency that ties together a supplier, a customer, and the item being supplied."
    aliases:
      - supply relationship
    properties: {}
  FreightForwardingProcess:
    meaning: A process that arranges freight forwarding activities.
    aliases: []
    properties: {}
  SupplyChainNode:
    meaning: "A point in the supply chain used as an origin, destination, or operating point."
    aliases:
      - supply chain node
    properties:
      supplyChainNodeIdentifier:
        type: text
  StorageFacility:
    meaning: A facility used to store goods or traceable units.
    aliases:
      - storage facility
    properties:
      storageFacilityIdentifier:
        type: text
  Traceability:
    meaning: The capability to trace supply-chain resources and events across processes.
    aliases: []
    properties: {}
  ConsigningProcess:
    meaning: A business process in which goods are handed over for shipment.
    aliases: []
    properties: {}
  BillOfLading:
    meaning: "A commercial carriage document that records the shipment's transport details."
    aliases: []
    properties: {}
  PackagingProcess:
    meaning: A process that packages goods for handling or shipment.
    aliases: []
    properties: {}
  LogisticsProcess:
    meaning: A process that coordinates logistics activities.
    aliases: []
    properties: {}
