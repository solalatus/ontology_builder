rules:
  canReceiveShipment:
    conditions:
      - a receiving process occurs at a facility
      - the ship-to location is identified for the shipment
      - the shipment is associated with a transport process that has reached its end point
  canPrepareShipment:
    conditions:
      - the shipment has a ship-from location
      - the shipment has a ship-to location
      - the shipment has a shipment preparation process
      - "either the shipment preparation process involves a carrier, or the shipment has a freight forwarding process associated with a freight forwarding service"
      - the shipment has a transportation service or a freight forwarding service
  canEvaluateSupplyRelationship:
    conditions:
      - the supplier is identified for the supply relationship
      - the customer is identified for the supply relationship
      - the material trade item is identified for the supply relationship
  validTrackingEvent:
    conditions:
      - "a shipment, lot, logistic unit, or load is identified"
      - an event time is available
      - an event type is known
actions:
  prepareShipment:
    input: Shipment
    preconditions:
      - canPrepareShipment
    effect: "The shipment is documented with ship-from and ship-to locations, associated with a shipment preparation process, and supported by either a carrier-backed preparation path or a freight-forwarding-backed preparation path, including transportation service or freight forwarding service where identified."
    verification: "Confirm the shipment has assigned shipping locations, an identified shipment preparation process, and carrier or freight-forwarding arrangements with transportation service or freight forwarding service identified as applicable."
  dispatchShipment:
    input: Shipment
    preconditions: []
    effect: Release a shipment for movement after the shipment to be dispatched is identified.
    verification: Confirm the shipment has been identified and released for movement.
  receiveShipment:
    input: Shipment
    preconditions:
      - canReceiveShipment
    effect: "The shipment is recorded as received at the destination facility through a receiving process, and the receiving process is completed."
    verification: "Confirm receipt of the shipment at the destination facility, linkage to the receiving process, and completion of the receiving process."
  recordTrackingEvent:
    input: TrackingEvent
    preconditions:
      - validTrackingEvent
    effect: "A new tracking event is linked to the relevant tracked unit, with its event time and event type recorded."
    verification: "Confirm the event time, event type, and the linked shipment, lot, logistic unit, or load were recorded."
  evaluateSupplyRelationship:
    input: SupplyRelationship
    preconditions:
      - canEvaluateSupplyRelationship
    effect: "Review the supply relationship against the supplier, customer, and product it depends on, with all three dependencies identified."
    verification: "Confirm the supplier, customer, and material trade item links are all present and have been reviewed."
