classes:
  Supplier:
    meaning: A supplier is a trading partner that supplies goods or services in the supply chain.
    aliases: []
    properties:
      supplierIdentifier:
        type: text
  Customer:
    meaning: A customer is a trading partner that receives supplied goods or services in the supply chain.
    aliases: []
    properties:
      customerIdentifier:
        type: text
  Carrier:
    meaning: A carrier is a supplier that carries or transports shipments.
    aliases: []
    properties:
      carrierIdentifier:
        type: text
  Shipment:
    meaning: "A shipment is the traceable unit of goods being prepared, moved, or received through the supply chain."
    aliases: []
    properties:
      identifier:
        type: text
  MaterialTradeItem:
    meaning: "A material trade item is a material item treated as something bought, sold, ordered, moved, or otherwise represented as traded in supply-chain operations."
    aliases:
      - item
      - material trade item
    properties:
      identifier:
        type: text
  PurchaseOrder:
    meaning: A purchase order is an agreement that requests or authorizes the supply of goods or services.
    aliases:
      - order
      - purchase order
    properties: {}
  Transport:
    meaning: Transport is the movement process that changes the location of goods.
    aliases:
      - transport process
    properties:
      transportIdentifier:
        type: text
  Lot:
    meaning: A lot is a traceable production or supply batch used for batch-level control.
    aliases:
      - lot
    properties:
      lotIdentifier:
        type: text
  LogisticUnit:
    meaning: A logistic unit is a traceable logistics handling unit used in storage and transport.
    aliases:
      - logistic unit
    properties:
      logisticUnitIdentifier:
        type: text
  Load:
    meaning: A load is a traceable load unit prepared for handling or transport.
    aliases:
      - load
    properties:
      loadIdentifier:
        type: text
  Facility:
    meaning: A facility is a physical operating site used in supply-chain operations.
    aliases: []
    properties:
      facilityIdentifier:
        type: text
  StorageFacility:
    meaning: A storage facility is a facility used to store goods or other traceable units.
    aliases:
      - storage facility
    properties:
      storageFacilityIdentifier:
        type: text
  FreightForwarder:
    meaning: A freight forwarder is an agent that arranges freight forwarding activities and services.
    aliases:
      - freight forwarder
    properties:
      freightForwarderIdentifier:
        type: text
  Container:
    meaning: A container is a physical item used to hold or transport goods.
    aliases:
      - container
    properties:
      containerIdentifier:
        type: text
  FreightContainer:
    meaning: A freight container is a container specifically used for freight transport.
    aliases:
      - freight container
    properties:
      freightContainerIdentifier:
        type: text
  TrackingEvent:
    meaning: "A tracking event is an event recorded to capture movement, handling, or state changes of a shipment or other traceable thing."
    aliases:
      - tracking event
    properties:
      eventType:
        type: text
        allowed:
          - packed
          - shipped
          - arrived
          - received
          - stored
      eventTime:
        type: date
  TransportationService:
    meaning: A transportation service is a service that provides transportation capability for supply-chain movement.
    aliases:
      - transportation service
    properties:
      transportationServiceIdentifier:
        type: text
  ShipmentPreparationProcess:
    meaning: A shipment preparation process is the process that prepares a shipment for dispatch.
    aliases:
      - shipment preparation process
    properties:
      shipmentPreparationProcessIdentifier:
        type: text
  ReceivingProcess:
    meaning: A receiving process is a business process that receives incoming goods or shipments.
    aliases:
      - receiving process
    properties:
      receivingProcessIdentifier:
        type: text
  StorageProcess:
    meaning: A storage process is a planned process that stores goods or other traceable units.
    aliases:
      - storage process
    properties:
      storageProcessIdentifier:
        type: text
  SupplyRelationship:
    meaning: "A supply relationship is the dependency that ties together a supplier, a customer, and the product context."
    aliases:
      - supply relationship
    properties:
      supplyRelationshipIdentifier:
        type: text
  ShipFromLocation:
    meaning: A ship-from location is the location from which a shipment is sent.
    aliases:
      - ship-from location
    properties:
      shipFromLocationIdentifier:
        type: text
  ShipToLocation:
    meaning: A ship-to location is the location to which a shipment is sent.
    aliases:
      - ship-to location
    properties:
      shipToLocationIdentifier:
        type: text
  Node:
    meaning: "A node is a supply-chain point used as an origin, destination, or operating point for transport."
    aliases:
      - supply chain node
    properties:
      supplyChainNodeIdentifier:
        type: text
  FreightForwardingService:
    meaning: A freight forwarding service is a service that provides freight forwarding capability.
    aliases:
      - freight forwarding service
    properties:
      freightForwardingServiceIdentifier:
        type: text
  Traceability:
    meaning: The ability to trace supply-chain resources and events across processes.
    aliases: []
    properties: {}
  TraceableResourceUnit:
    meaning: A traceable resource unit is a material unit that can be tracked through supply-chain activity and must stay associated with the right traceable context.
    aliases:
      - traceable resource unit
      - traceable unit
    properties: {}
  Shipper:
    meaning: The consignor that sends or consigns a shipment.
    aliases: []
    properties: {}
  ConsigningProcess:
    meaning: A business process in which goods are consigned for shipment.
    aliases: []
    properties: {}
  Cargo:
    meaning: The goods carried as load in transport and logistics operations.
    aliases: []
    properties: {}
  BillOfLading:
    meaning: A bill of lading is a commercial service agreement documenting shipment carriage details.
    aliases:
      - bill of lading
    properties: {}
  Sublot:
    meaning: A sublot is a traceable subdivision of a lot.
    aliases:
      - sublot
    properties: {}
  LogisticsService:
    meaning: A logistics service is a commercial logistics service used in supply-chain operations.
    aliases:
      - logistics service
    properties: {}
  PackagingService:
    meaning: A packaging service is a service that provides packaging capability for goods.
    aliases:
      - packaging service
    properties: {}
  StorageService:
    meaning: A storage service is a service that provides storage capability for goods.
    aliases:
      - storage service
    properties: {}
  InventoryManagementProcess:
    meaning: "An inventory management process is the business process that manages inventory, including the traceable units you need to keep track of."
    aliases:
      - inventory management process
    properties: {}
