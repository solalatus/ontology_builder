rules:
  majorIncidentDeclarationPreconditions:
    conditions:
      - "the incident is not resolved, closed, or cancelled"
      - the incident severity is sev1-critical or sev2-high
      - at least one impacted IT service has been identified
      - an incident commander has been assigned
  regulatoryNotificationSubmissionPreconditions:
    conditions:
      - the regulatory notification reports an incident
      - the regulatory notification is sent to a regulator
      - the incident reported by the regulatory notification has a materiality assessment whose result is reportable
      - the regulatory notification status is approved
      - the current time is before the regulatory notification due at time
  incidentClosurePreconditions:
    conditions:
      - the incident status is resolved or monitoring
      - "each impacted IT service has health state healthy, or the incident has residual condition accepted set to true"
      - the incident has at least one linked evidence item
      - "if the incident is being handled as a major incident, it has at least one linked post-incident review"
  majorIncidentQualificationRule:
    conditions:
      - "the incident is not already resolved, closed, or cancelled"
      - the incident severity is sev1-critical or sev2-high
      - at least one impacted IT service has been identified
  regulatoryNotificationRequirementRule:
    conditions:
      - the incident has a materiality assessment
      - the materiality assessment result is reportable
  recoveryPlanSafeUseRule:
    conditions:
      - the recovery plan recovers an IT service impacted by the incident
      - the recovery plan uses at least one backup set
      - the recovery plan uses an environment whose availability status is available
      - the incident has recovery point accepted set to true
  backupSetSafeUseRule:
    conditions:
      - the backup set status is successful or verified
      - the backup set protects a configuration item affected by the incident
      - the recovery plan linked to the incident uses an environment with restore approved set to true
  workaroundSafeUseRule:
    conditions:
      - the incident is linked to a problem
      - the problem is documented by a known error
      - the known error has a workaround
  runbookSafeUseRule:
    conditions:
      - the incident is handled with the runbook
      - "the runbook applies to an IT service impacted by the incident, or to a configuration item affected by the incident"
  stakeholderCommunicationSendPreconditions:
    conditions:
      - the communication has an audience recorded
      - the communication has a message summary recorded
      - the communication is linked to an incident
      - the communication is addressed to at least one stakeholder
      - the communication status is approved
  alertAcknowledgementPreconditions:
    conditions:
      - the alert status is new
  incidentAssignmentPreconditions:
    conditions:
      - the incident is not closed or cancelled
      - "the resolver group supports an IT service impacted by the incident, or a configuration item affected by the incident"
  serviceFailoverPreconditions:
    conditions:
      - the incident has a linked recovery plan
      - the recovery plan recovers an IT service impacted by the incident
      - the recovery plan uses an environment whose availability status is available
      - the incident has recovery point accepted set to true
  backupRestorePreconditions:
    conditions:
      - the backup set status is successful or verified
      - the backup set protects a configuration item affected by the incident
      - the recovery plan linked to the incident uses an environment with restore approved set to true
  incidentContainmentPreconditions:
    conditions:
      - the incident status is acknowledged or investigating
  configurationItemIsolationPreconditions:
    conditions:
      - the incident affects at least one configuration item
  emergencyChangeExecutionPreconditions:
    conditions:
      - "the incident is not resolved, closed, or cancelled"
      - the incident is resolved by at least one change
      - that change has an implementation plan
      - that change has a backout plan
      - "that change affects at least one IT service, or modifies at least one configuration item"
      - "that change has a risk level set to low, medium, high, or critical"
actions:
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: The alert is marked as acknowledged and no longer sits untriaged.
    verification: Read the alert record and confirm it is assigned an acknowledged state.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions:
      - incidentAssignmentPreconditions
    effect: The incident is routed to the selected resolver group for diagnosis and restoration.
    verification: Confirm the incident record shows the assigned resolver group.
  declareMajorIncident:
    input: Incident
    preconditions:
      - majorIncidentDeclarationPreconditions
    effect: "The incident is declared and handled as a major incident when business impact and coordination needs justify it, an incident commander is assigned, and major-incident communication cadence is started."
    verification: Confirm the incident is recorded for major-incident handling and that an incident commander is assigned.
  containIncident:
    input: Incident
    preconditions:
      - incidentContainmentPreconditions
    effect: "Containment actions are recorded and the incident is put under control through approved workflows, people, or external tools to stop spread or limit further impact."
    verification: "Confirm containment actions are recorded, impact is no longer increasing, and the incident record shows containment has been performed."
  isolateAffectedConfigurationItem:
    input: Incident
    preconditions:
      - configurationItemIsolationPreconditions
    effect: The affected configuration item is deliberately isolated from relevant networks or dependencies as a containment step for the incident.
    verification: "Confirm the isolation step is recorded against the incident, the intended configuration item is isolated or disconnected as intended, and affected IT service health state is checked."
  failOverAffectedServiceToRecoveryEnvironment:
    input: Incident
    preconditions: []
    effect: A failover workflow is triggered through people or external tools to move service operation to the recovery environment under the applicable recovery plan.
    verification: Confirm the service record or incident record shows failover was initiated or completed under the selected recovery plan.
  restoreDataFromBackup:
    input: BackupSet
    preconditions: []
    effect: A restoration workflow is triggered through people or external tools to restore approved backup data to the intended target from the selected backup set.
    verification: Confirm restoration completed from the selected backup and validate that the restored target is usable.
  executeEmergencyChange:
    input: Incident
    preconditions:
      - emergencyChangeExecutionPreconditions
    effect: The linked change is executed through people or external tools under the accelerated change path to restore service or reduce urgent risk.
    verification: Confirm the linked change record reflects execution and the intended service effect occurred.
  sendStakeholderCommunication:
    input: Communication
    preconditions:
      - stakeholderCommunicationSendPreconditions
    effect: "An approved incident update is issued to the relevant audience based on the latest verified incident state, timestamped, archived, and the communication status becomes submitted."
    verification: "Confirm the communication status is submitted, delivery status is recorded, the final archived message is recorded, and the communication timestamp is recorded."
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - regulatoryNotificationSubmissionPreconditions
    effect: "An approved incident-related regulatory submission is triggered to the relevant authority, and the regulatory notification status becomes submitted."
    verification: "Confirm the notification status is submitted, the submission is recorded, and the intended regulator received it."
  closeIncident:
    input: Incident
    preconditions:
      - incidentClosurePreconditions
    effect: The incident record is formally closed and the incident status becomes closed once closure conditions are satisfied.
    verification: Confirm the incident status is closed and required closure conditions are satisfied.
