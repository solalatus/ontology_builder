competency_questions:
  - id: cq2
    text: Which configuration items and third-party services are on the dependency path of the affected IT service?
  - id: cq6
    text: "Which runbook, workaround, backup set, and recovery plan can be used safely?"
  - id: cq7
    text: Was the incident caused by a recent change or deployment?
  - id: cq8
    text: "Is a materiality assessment complete, and is regulatory notification required and due?"
  - id: cq9
    text: "Are evidence integrity, stakeholder communications, and closure conditions complete?"
  - id: cq10
    text: Which corrective actions from prior post-incident reviews remain open for the affected service?
  - id: cq11
    text: Which runbook can be used for this incident?
  - id: cq12
    text: Which workaround can be used for this incident?
  - id: cq13
    text: Which backup set and recovery plan can be used safely for this incident?
  - id: cq14
    text: Was the incident caused by a recent change or deployment?
  - id: cq15
    text: "Is a materiality assessment complete, and is a regulatory notification required and due?"
  - id: cq16
    text: "Is the incident supported by the necessary evidence, and is that evidence retained with integrity?"
  - id: cq17
    text: "If the incident is security-related, has the required evidence been preserved?"
  - id: cq18
    text: "Are evidence integrity, stakeholder communications, and closure conditions complete for this incident?"
  - id: cq11
    text: Which business services are impacted by this incident?
  - id: cq12
    text: Through which customer channels are those impacted business services delivered?
  - id: cq13
    text: Which IT services are impacted by this incident?
  - id: cq14
    text: Which active alerts and correlated events are tied to this incident?
  - id: cq15
    text: Who owns the affected service?
  - id: cq16
    text: Which resolver group should handle the incident?
  - id: cq17
    text: Which on-call engineer should handle the incident?
  - id: cq18
    text: Does the incident meet the criteria for a major incident?
  - id: cq19
    text: "If the incident is a major incident, who is commanding it?"
classes:
  Incident:
    meaning: "An incident is an unplanned interruption, degradation, or security condition that requires managed operational response."
    aliases:
      - incidens
    properties:
      summary:
        type: text
      description:
        type: text
      detectedAt:
        type: date
      openedAt:
        type: date
      resolvedAt:
        type: date
      closedAt:
        type: date
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      impact:
        type: text
        allowed:
          - enterprise-wide
          - multiple-services
          - single-service
          - limited-users
          - no-observed-impact
      urgency:
        type: text
        allowed:
          - immediate
          - high
          - normal
          - low
      category:
        type: text
        allowed:
          - availability
          - performance
          - capacity
          - network
          - application
          - database
          - infrastructure
          - data-integrity
          - cybersecurity
          - third-party
          - change-induced
          - other
      detectionSource:
        type: text
        allowed:
          - monitoring
          - siem
          - service-desk
          - user-report
          - vendor-report
          - automated-control
          - regulator
          - other
      recurring:
        type: boolean
      timeToAcknowledge:
        type: number
      timeToRestore:
        type: number
      majorIncidentState:
        type: boolean
      incidentId:
        type: text
      currentStatus:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      isMajorIncident:
        type: boolean
      isCybersecurityIncident:
        type: boolean
      declaredMajorAt:
        type: date
  BusinessService:
    meaning: A business service is a customer-facing or business-facing banking capability delivered by the institution.
    aliases:
      - üzleti szolgáltatás
    properties:
      description:
        type: text
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      availabilityTarget:
        type: number
      serviceName:
        type: text
      currentStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  CustomerChannel:
    meaning: "A customer channel is the route through which customers access the bank's services."
    aliases:
      - ügyfélcsatorna
    properties: {}
  ITService:
    meaning: An IT service is a managed technology capability that supports one or more business services.
    aliases:
      - informatics service
      - informatikai szolgáltatás
    properties:
      description:
        type: text
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      availabilityTarget:
        type: number
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  ConfigurationItem:
    meaning: "A configuration item is a managed component that sits within configuration-management scope and may be affected, changed, owned, backed up, or recovered."
    aliases:
      - CI
      - konfigurációs elem
    properties:
      name:
        type: text
      version:
        type: text
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  ThirdPartyService:
    meaning: A third-party service is an externally provided service on which the bank depends operationally.
    aliases:
      - outsourced service
      - külső szolgáltatás
    properties: {}
  Alert:
    meaning: An alert is a monitoring or security signal that requires triage or acknowledgement.
    aliases:
      - riasztás
    properties:
      raisedAt:
        type: date
      summary:
        type: text
      occurrenceCount:
        type: number
      acknowledgedAt:
        type: date
      alertStatus:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      alertSeverity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      alertSource:
        type: text
  Event:
    meaning: An event is a time-stamped observation of a state change or other notable occurrence.
    aliases:
      - esemény
    properties:
      eventType:
        type: text
      eventSource:
        type: text
      eventTime:
        type: date
  ResolverGroup:
    meaning: A resolver group is the team assigned to diagnose and restore a specific service or technology area.
    aliases:
      - support group
      - megoldócsoport
    properties: {}
  OnCallEngineer:
    meaning: An on-call engineer is a technical specialist available for time-critical operational response.
    aliases:
      - on-call
      - ügyeletes mérnök
    properties: {}
  ServiceOwner:
    meaning: A service owner is the role accountable for an IT service across its lifecycle.
    aliases:
      - szolgáltatásgazda
    properties: {}
  BusinessOwner:
    meaning: The business owner is the business role accountable for a business service or process outcome.
    aliases: []
    properties: {}
  IncidentCommander:
    meaning: "The incident commander is the person accountable for command, coordination, and decision cadence during a major incident."
    aliases:
      - incident manager
      - major-incident lead
      - incidensparancsnok
    properties: {}
  ApplicationOwner:
    meaning: The application owner is the role accountable for an application and its operational fitness.
    aliases: []
    properties: {}
  TechnicalOwner:
    meaning: The technical owner is the role accountable for the engineering and maintenance of a configuration item.
    aliases: []
    properties: {}
  Runbook:
    meaning: "A runbook is a maintained operational procedure used for diagnosis, response, recovery, or verification."
    aliases:
      - üzemeltetési eljárás
      - playbook
    properties: {}
  Workaround:
    meaning: A workaround is a temporary method that reduces or bypasses the impact of an incident or problem.
    aliases:
      - kerülőmegoldás
    properties: {}
  BackupSet:
    meaning: A backup set is a defined collection of recoverable backup data for protected components.
    aliases:
      - mentéskészlet
      - backup
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      lastSuccessfulBackup:
        type: date
      lastVerification:
        type: date
  RecoveryPlan:
    meaning: A recovery plan is a documented plan for restoring an IT service and its dependencies.
    aliases:
      - helyreállítási terv
      - DR plan
    properties:
      recoveryTimeObjective:
        type: number
      recoveryPointObjective:
        type: number
      lastReviewDate:
        type: date
  Change:
    meaning: "A change is a controlled addition, modification, or removal that may affect an IT service."
    aliases:
      - változás
      - módosítás
    properties:
      summary:
        type: text
      riskLevel:
        type: text
        allowed:
          - low
          - medium
          - high
          - critical
      plannedStart:
        type: date
      plannedEnd:
        type: date
      implementationPlan:
        type: text
      backoutPlan:
        type: text
      changeStatus:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  Deployment:
    meaning: A deployment is the technical execution that installs or activates a release or change.
    aliases:
      - telepítés
      - élesítés
    properties:
      deploymentStatus:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
  MaterialityAssessment:
    meaning: "A materiality assessment is a documented determination of an incident's significance and reporting implications."
    aliases:
      - reportability assessment
      - lényegességi értékelés
    properties:
      assessedAt:
        type: date
      result:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      rationale:
        type: text
      reportingDueTime:
        type: date
  RegulatoryNotification:
    meaning: A regulatory notification is a formal incident-related submission to a competent authority.
    aliases:
      - supervisory notification
      - felügyeleti bejelentés
    properties:
      dueAt:
        type: date
      submittedAt:
        type: date
      notificationStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  Communication:
    meaning: "A communication is a controlled message sent to operational, business, customer, vendor, or regulatory audiences."
    aliases:
      - értesítés
      - tájékoztatás
    properties:
      sentAt:
        type: date
      audience:
        type: text
        allowed:
          - technical
          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      messageSummary:
        type: text
  EvidenceItem:
    meaning: "An evidence item is a preserved record, artifact, or observation that supports incident analysis, accountability, or verification."
    aliases:
      - evidence
      - bizonyíték
    properties:
      collectedAt:
        type: date
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      cryptographicHash:
        type: text
  CorrectiveAction:
    meaning: "A corrective action is a tracked action intended to remove a cause, reduce risk, or improve response capability."
    aliases: []
    properties:
      actionDescription:
        type: text
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueDate:
        type: date
  PostIncidentReview:
    meaning: "A post-incident review is a structured review of causes, response effectiveness, lessons, and follow-up work."
    aliases:
      - PIR
      - RCA review
    properties:
      heldOn:
        type: date
      findings:
        type: text
  Regulator:
    meaning: A regulator is the competent authority that supervises the bank or receives required notifications.
    aliases: []
    properties: {}
  Application:
    meaning: A application is a software system that implements business or operational functionality.
    aliases: []
    properties:
      externallyAccessible:
        type: boolean
      releaseVersion:
        type: text
  InfrastructureComponent:
    meaning: "An infrastructure component is a technical component that provides compute, network, platform, endpoint, or storage capability."
    aliases:
      - infrastruktúra-elem
    properties: {}
  Environment:
    meaning: "An environment is the deployment context in which services or components operate, such as production, test, development, or disaster recovery."
    aliases:
      - környezet
    properties:
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
  DataAsset:
    meaning: A data asset is a governed collection of information processed or stored by services.
    aliases: []
    properties:
      name:
        type: text
      dataClassification:
        type: text
        allowed:
          - public
          - internal
          - confidential
          - restricted
  IntegrationInterface:
    meaning: An integration interface is a defined technical interface through which systems exchange data or commands.
    aliases: []
    properties:
      protocol:
        type: text
  SecurityEvent:
    meaning: "A security event is an event relevant to confidentiality, integrity, availability, authenticity, or cyber threat activity."
    aliases: []
    properties: {}
  Problem:
    meaning: "A problem is the underlying cause, or potential underlying cause, of one or more incidents."
    aliases:
      - probléma
    properties:
      summary:
        type: text
      status:
        type: text
        allowed:
          - new
          - investigating
          - root-cause-known
          - known-error
          - resolved
          - closed
      rootCauseCategory:
        type: text
        allowed:
          - software-defect
          - configuration-error
          - capacity-shortage
          - hardware-failure
          - network-failure
          - human-error
          - process-failure
          - third-party-failure
          - cyber-attack
          - unknown
  KnownError:
    meaning: A known error is a diagnosed problem or issue with a documented cause or workaround.
    aliases:
      - ismert hiba
    properties:
      diagnosedCause:
        type: text
      workaroundSummary:
        type: text
  Release:
    meaning: A release is a governed package of approved changes introduced together.
    aliases:
      - kiadás
    properties:
      releaseDate:
        type: date
      releaseVersion:
        type: text
  EmergencyChange:
    meaning: An emergency change is a change handled through an accelerated path to address an urgent operational need.
    aliases: []
    properties:
      summary:
        type: text
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      riskLevel:
        type: text
        allowed:
          - low
          - medium
          - high
          - critical
      implementationPlan:
        type: text
      backoutPlan:
        type: text
  CybersecurityIncident:
    meaning: "A cybersecurity incident is an incident caused by or involving malicious, unauthorized, or otherwise security-relevant activity."
    aliases: []
    properties: {}
  LogSource:
    meaning: A log source is a system or component that emits operational or security records.
    aliases: []
    properties:
      sourceType:
        type: text
  Vendor:
    meaning: A vendor is an external organization that supplies or supports technology or services.
    aliases: []
    properties:
      legalName:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      criticalProvider:
        type: boolean
  MonitoringTool:
    meaning: A monitoring tool is a platform that collects telemetry and evaluates operational conditions.
    aliases: []
    properties: {}
  CloudService:
    meaning: A cloud service is a technology capability consumed from an external or group cloud provider.
    aliases: []
    properties: {}
  Bank:
    meaning: The bank is the regulated financial institution whose IT services and incidents are being managed.
    aliases: []
    properties: {}
  IncidentResponseTeam:
    meaning: An incident response team is the cross-functional team that coordinates response to significant incidents.
    aliases:
      - IRT
      - incidenskezelő csapat
    properties: {}
relationships:
  - name: impactsBusinessService
    from: Incident
