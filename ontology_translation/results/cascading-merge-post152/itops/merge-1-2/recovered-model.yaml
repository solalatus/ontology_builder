    to: Database
    meaning: "This links an application to the database it reads from, writes to, or otherwise depends on."
    aliases: []
  - name: isHandledWith
    from: Incident
    to: Runbook
    meaning: "This links an incident to the operational procedure used to diagnose, respond, recover, or verify."
    aliases: []
  - name: isEvaluatedBy
