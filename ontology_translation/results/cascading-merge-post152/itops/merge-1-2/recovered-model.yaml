competency_questions:
  - id: cq1
    text: Which business services are impacted by this incident?
  - id: cq2
    text: Through which customer channels do customers experience the impact?
  - id: cq3
    text: Which IT services are impacted by this incident?
  - id: cq4
    text: Which configuration items are on the dependency path of the affected service?
  - id: cq5
    text: Which third-party services are on the dependency path of the affected service?
  - id: cq6
    text: Which alerts are linked to this incident?
  - id: cq7
    text: Which events are linked to this incident?
  - id: cq8
    text: Which linked alerts are still active?
  - id: cq9
    text: Who owns the affected IT service?
  - id: cq10
    text: Which business owner is accountable for the impacted business service?
  - id: cq11
    text: Which resolver group should handle the incident?
  - id: cq12
    text: Which on-call engineer should handle the incident?
  - id: cq13
    text: Does this situation meet the criteria for a major incident?
  - id: cq14
    text: Which runbook can be used safely for this case?
  - id: cq15
    text: "Which workaround can be used safely for this case, if a known error exists?"
  - id: cq16
    text: Which backup set can be used safely for this case?
  - id: cq17
    text: Which recovery plan can be used safely for this case?
  - id: cq18
    text: "Was this incident triggered by a recent change, release, or deployment?"
  - id: cq19
    text: Is the incident evaluated by a materiality assessment?
  - id: cq20
    text: "If a materiality assessment exists, does it classify the incident as reportable?"
  - id: cq21
    text: "If the materiality assessment classifies the incident as reportable, has a regulatory notification been triggered?"
  - id: cq22
    text: Which regulator receives the notification?
  - id: cq23
    text: By when must the regulatory notification be sent?
  - id: cq24
    text: Which evidence items support this incident?
  - id: cq25
    text: Is additional evidence preservation required because this may be a cybersecurity incident?
  - id: cq26
    text: Which stakeholders have been notified about this incident?
  - id: cq27
    text: Do current communications reflect the latest verified incident state?
  - id: cq28
    text: Is containment scope recorded and are expected side effects understood?
  - id: cq29
    text: Can the affected service be failed over using the applicable recovery plan?
  - id: cq30
    text: Can approved backup data be restored to the target environment?
  - id: cq31
    text: Are all closure conditions met for this incident?
  - id: cq32
    text: What is missing before the incident can be closed?
  - id: cq33
    text: Which problem should be linked or raised from this incident?
  - id: cq34
    text: What findings were recorded in the post-incident review?
  - id: cq35
    text: Which corrective actions were produced by the post-incident review?
  - id: cq36
    text: Which corrective actions from earlier reviews are still open for the affected service?
  - id: cq37
    text: Which vendor has the incident been escalated to?
  - id: cq38
    text: Which customer channels are affected right now?
  - id: cq39
    text: Which IT services support the impacted business service?
  - id: cq40
    text: "Which applications, databases, infrastructure components, and third-party services sit on the dependency path of the affected service?"
  - id: cq41
    text: Which alerts and events are related to this incident?
  - id: cq42
    text: What was the detection source for this incident?
  - id: cq43
    text: Who owns the affected service?
  - id: cq44
    text: Which resolver group should handle this incident?
  - id: cq45
    text: Which on-call engineer is currently responsible for the assigned resolver group?
  - id: cq46
    text: Does this incident meet the conditions to be treated as a major incident?
  - id: cq47
    text: Who is coordinating the incident?
  - id: cq48
    text: Has an incident commander been assigned?
  - id: cq49
    text: Which runbook or workaround is available for this incident or the underlying problem?
  - id: cq50
    text: Is there an existing problem linked to this incident?
  - id: cq51
    text: Is there a known error linked to this incident?
  - id: cq52
    text: Is there a recurring pattern linked to this incident?
  - id: cq53
    text: "Was this incident caused by a recent change, release, or deployment?"
  - id: cq54
    text: Which recovery plan can be used for safe restoration or failover?
  - id: cq55
    text: Which backup set can be used for safe restoration or failover?
  - id: cq56
    text: Is the target recovery environment available and suitable?
  - id: cq57
    text: Has a materiality assessment been completed?
  - id: cq58
    text: Is this incident potentially reportable?
  - id: cq59
    text: Is this incident reportable?
  - id: cq60
    text: Is a regulatory notification required?
  - id: cq61
    text: To which authority is regulatory notification required?
  - id: cq62
    text: By when is regulatory notification required?
  - id: cq63
    text: What stakeholder communications have already been sent?
  - id: cq64
    text: To whom have stakeholder communications been sent?
  - id: cq65
    text: What is the status of stakeholder communications?
  - id: cq66
    text: Do we have the required evidence?
  - id: cq67
    text: Has the integrity of the evidence been preserved?
  - id: cq68
    text: Are the conditions met to close the incident?
  - id: cq69
    text: What is still missing before the incident can be closed?
classes:
  Incident:
    meaning: "An incident is an unplanned interruption, degradation, or security condition that requires managed response."
    aliases:
      - incidens
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      detection source:
        type: text
      impact:
        type: text
        allowed:
          - enterprise-wide
          - multiple services
          - single service
          - limited users
          - no observed impact
      category:
        type: text
        allowed:
          - availability
          - performance
          - capacity
          - network
          - application
          - database
          - infrastructure
          - data integrity
          - cybersecurity
          - third-party
          - change-induced
          - other
      summary:
        type: text
      description:
        type: text
      resolved at:
        type: date
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      urgency:
        type: text
        allowed:
          - immediate
          - high
          - normal
          - low
      recurring:
        type: boolean
      time to acknowledge:
        type: number
      time to restore:
        type: number
      detected at:
        type: date
      opened at:
        type: date
      closed at:
        type: date
  Alert:
    meaning: An alert is a monitoring or security signal that requires triage or acknowledgement.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      severity:
        type: text
      raisedTime:
        type: date
      detection source:
        type: text
      acknowledged at:
        type: date
  IT service:
    meaning: An IT service is a managed technology capability that supports one or more business services.
    aliases:
      - IT service
      - informatics service
      - informatikai szolgáltatás
    properties:
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially unavailable
          - unavailable
          - recovering
          - unknown
      health state:
        type: text
        allowed:
          - healthy
          - degraded
          - partially unavailable
          - unavailable
          - recovering
          - unknown
  Business service:
    meaning: A business service is a customer-facing or business-facing capability delivered by the bank.
    aliases:
      - business service
      - üzleti szolgáltatás
    properties:
      criticality tier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      health state:
        type: text
        allowed:
          - healthy
          - degraded
          - partially unavailable
          - unavailable
          - recovering
          - unknown
  Customer channel:
    meaning: A customer channel is a channel through which customers access banking services.
    aliases:
      - customer channel
    properties: {}
  Configuration item:
    meaning: A configuration item is a managed component within configuration-management scope.
    aliases:
      - configuration item
    properties: {}
  Third-party service:
    meaning: A third-party service is an externally provided service on which the bank depends.
    aliases:
      - third-party service
    properties: {}
  Event:
    meaning: An event is a time-stamped observation of a state change or other noteworthy occurrence.
    aliases: []
    properties:
      observedTime:
        type: date
  Resolver group:
    meaning: A resolver group is a team assigned to diagnose and restore a specific technology or service area.
    aliases:
      - support group
      - megoldócsoport
    properties:
      identifier:
        type: text
  On-call engineer:
    meaning: An on-call engineer is a technical specialist available for time-critical operational response.
    aliases:
      - on-call
    properties: {}
  Business owner:
    meaning: A business owner is the business role accountable for a business service or process.
    aliases:
      - business owner
    properties: {}
  Service owner:
    meaning: A service owner is the role accountable for an IT service across its lifecycle.
    aliases:
      - service owner
    properties: {}
  Runbook:
    meaning: "A runbook is a maintained operational procedure for diagnosis, response, recovery, or verification."
    aliases:
      - playbook
    properties: {}
  Workaround:
    meaning: A workaround is a temporary method that reduces or bypasses the impact of an incident or problem.
    aliases: []
    properties: {}
  Known error:
    meaning: A known error is a diagnosed problem with a documented cause or workaround.
    aliases:
      - known error
    properties: {}
  Backup set:
    meaning: A backup set is a defined collection of recoverable backup data for protected components.
    aliases:
      - backup set
    properties:
      lastSuccessfulBackupTime:
        type: date
      backupStatus:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
  Recovery plan:
    meaning: A recovery plan is a documented plan for restoring an IT service and its dependencies.
    aliases:
      - DR plan
    properties:
      recoveryObjectiveTime:
        type: text
      recoveryObjectivePoint:
        type: text
      lastReviewTime:
        type: date
      recovery time objective:
        type: number
      recovery point objective:
        type: number
  Materiality assessment:
    meaning: A materiality assessment is a documented determination of incident significance and reporting implications.
    aliases:
      - materiality assessment
    properties:
      outcome:
        type: text
        allowed:
          - not reportable
          - potentially reportable
          - reportable
          - undetermined
      assessmentTime:
        type: date
      result:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      assessed at:
        type: date
      reporting due time:
        type: date
  Regulatory notification:
    meaning: A regulatory notification is a formal incident-related submission to a competent authority.
    aliases:
      - supervisory notification
    properties:
      dueTime:
        type: date
      submissionTime:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submitted at:
        type: date
      due at:
        type: date
  Regulator:
    meaning: A regulator is a competent or supervisory authority that oversees the bank or receives required notifications.
    aliases:
      - supervisory authority
      - felügyeleti hatóság
    properties: {}
  Evidence item:
    meaning: "An evidence item is a preserved record, artifact, or observation supporting incident analysis and accountability."
    aliases:
      - evidence item
    properties:
      collectedTime:
        type: date
      integrity status:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      collected at:
        type: date
  Stakeholder:
    meaning: "A stakeholder is a person, group, or organization affected by or responsible for an operational outcome."
    aliases: []
    properties:
      name:
        type: text
      audience type:
        type: text
  Communication:
    meaning: "A communication is a controlled message sent to operational, business, customer, vendor, or regulatory audiences."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      audience:
        type: text
      sent at:
        type: date
  Vendor:
    meaning: A vendor is an external organization supplying or supporting technology or services.
    aliases: []
    properties: {}
  Problem:
    meaning: "A problem is the underlying cause, or potential cause, of one or more incidents."
    aliases: []
    properties: {}
  Post-incident review:
    meaning: "A post-incident review is a structured review of causes, response effectiveness, lessons, and follow-up work."
    aliases:
      - PIR
      - RCA review
    properties:
      held on:
        type: date
      findings:
        type: text
  Corrective action:
    meaning: "A corrective action is a tracked action intended to remove a cause, reduce risk, or improve response capability."
    aliases:
      - remediation action
    properties:
      status:
        type: text
        allowed:
          - open
          - in progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueTime:
        type: date
      action description:
        type: text
      due date:
        type: date
  Change:
    meaning: "A change is a controlled addition, modification, or removal that may affect an IT service."
    aliases: []
    properties: {}
  Release:
    meaning: A release is a governed package of approved changes introduced together.
    aliases: []
    properties:
      release date:
        type: date
  Deployment:
    meaning: A deployment is the technical execution that installs or activates a release or change.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
      started at:
        type: date
      completed at:
        type: date
  Environment:
    meaning: "An environment is a deployment context such as production, disaster recovery, test, or development."
    aliases: []
    properties:
      environmentType:
        type: text
        allowed:
          - production
          - disaster recovery
          - pre-production
          - test
          - development
          - management
  Major incident:
    meaning: A major incident is an incident requiring exceptional coordination because of high business or regulatory impact.
    aliases:
      - major incident
    properties:
      declarationTime:
        type: date
  Cybersecurity incident:
    meaning: "A cybersecurity incident is an incident caused by or involving malicious, unauthorized, or otherwise security-relevant activity."
    aliases:
      - cybersecurity incident
    properties: {}
  Application owner:
    meaning: An application owner is the role accountable for an application and its operational fitness.
    aliases:
      - application owner
    properties: {}
  Application:
    meaning: An application is a software system that implements business or operational functionality.
    aliases: []
    properties: {}
  Infrastructure component:
    meaning: "An infrastructure component is a technical component that provides compute, network, platform, endpoint, or storage capability."
    aliases:
      - infrastructure component
    properties: {}
  Database:
    meaning: A database is a managed persistent data store used by an application or service.
    aliases: []
    properties: {}
  StorageSystem:
    meaning: "A storage system is a managed system providing persistent block, file, or object storage."
    aliases:
      - storage system
    properties: {}
  Emergency change:
    meaning: An emergency change is a change processed under an accelerated path to address an urgent operational need.
    aliases:
      - emergency change
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  Incident commander:
    meaning: An incident commander is the role responsible for coordinating major-incident handling and decision flow.
    aliases:
      - incident commander
      - incident manager
      - MIM lead
      - incidensparancsnok
    properties: {}
  OrganizationalUnit:
    meaning: An organizational unit is a formal unit within the organization that can own corrective actions and related responsibilities.
    aliases:
      - organizational unit
    properties: {}
  Incident response team:
    meaning: An incident response team is the cross-functional team that coordinates significant incident response.
    aliases: []
    properties: {}
  Service desk:
    meaning: "The service desk is the first-line function that receives, records, triages, and routes user-reported issues."
    aliases:
      - help desk
      - hibabejelentő
      - ügyfélszolgálati IT pult
    properties: {}
  Network operations centre:
    meaning: The network operations centre is the function that monitors and operates network and infrastructure services.
    aliases:
      - NOC
      - hálózatüzemeltetési központ
    properties: {}
  Security operations centre:
    meaning: "The security operations centre is the function that monitors, investigates, and coordinates response to cyber threats."
    aliases:
      - SOC
      - biztonsági műveleti központ
    properties: {}
  Technical owner:
    meaning: A technical owner is the role accountable for the engineering and maintenance of a configuration item.
    aliases: []
    properties: {}
  Monitoring tool:
    meaning: A monitoring tool is a platform that collects telemetry and evaluates operational conditions.
    aliases: []
    properties: {}
  Security event:
    meaning: "A security event is an event relevant to confidentiality, integrity, availability, authenticity, or threat activity."
    aliases: []
    properties: {}
relationships:
  - name: deliveredThrough
    from: Business service
    to: Customer channel
    meaning: Relates a business service to the customer channel through which customers consume it.
    aliases: []
  - name: observedOnConfigurationItem
    from: Event
    to: Configuration item
    meaning: Relates an event to the configuration item on which the observation occurred.
    aliases: []
  - name: relatesToItservice
    from: Event
    to: IT service
    meaning: Relates an event to the IT service to which the observation is operationally relevant.
    aliases: []
  - name: indicatesEvent
    from: Alert
    to: Event
    meaning: Relates an alert to the event it signals or points to.
    aliases: []
  - name: concernsConfigurationItem
    from: Alert
    to: Configuration item
    meaning: Relates an alert to the configuration item it is about.
    aliases: []
  - name: concernsItservice
    from: Alert
    to: IT service
    meaning: Relates an alert to the IT service it is about.
    aliases: []
  - name: implementedBy
    from: IT service
    to: Application
    meaning: Relates an IT service to the application that implements it.
    aliases: []
  - name: runsOn
    from: IT service
    to: Infrastructure component
    meaning: Relates an IT service to the infrastructure component on which it runs.
    aliases: []
  - name: storedOn
    from: Database
    to: StorageSystem
    meaning: Relates a database to the storage system on which it is stored.
    aliases: []
  - name: affectsConfigurationItem
    from: Incident
    to: Configuration item
    meaning: Relates an incident to a configuration item directly affected by the incident.
    aliases: []
  - name: escalatedToVendor
    from: Incident
    to: Vendor
    meaning: Relates an incident to the vendor to which it has been escalated for support or action.
    aliases: []
  - name: providedByVendor
    from: Third-party service
    to: Vendor
    meaning: Relates a third-party service to the vendor that provides it.
    aliases: []
  - name: recoveredWithRecoveryPlan
    from: Incident
    to: Recovery plan
    meaning: Relates an incident to the recovery plan used for restoration.
    aliases: []
  - name: changesConfigurationItem
    from: Emergency change
    to: Configuration item
