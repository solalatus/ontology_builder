rules:
  majorIncidentDeclarationConditions:
    conditions:
      - incident status is not resolved
      - incident status is not closed
      - incident status is not cancelled
      - incident severity is sev1-critical or sev2-high
      - at least one impacted IT service is identified
      - the major incident is commanded by an incident commander
  canSubmitRegulatoryNotification:
    conditions:
      - materiality assessment outcome is reportable
      - the regulatory notification reports the incident
      - the regulatory notification is sent to a regulator
      - the regulatory notification status is approved
      - required fields are complete
      - supporting evidence is complete
      - submission happens before the regulatory notification due time
  incidentClosureConditions:
    conditions:
      - incident status is resolved or monitoring
      - impacted services have a healthy state or an accepted residual condition verified externally
      - resolution and restoration evidence are recorded
      - required stakeholder communications are complete
      - "for major incidents, a post-incident review exists"
      - "for incidents under cybersecurity handling, the required evidence preservation and review obligations are satisfied"
actions:
  acknowledgeNewAlert:
    input: Alert
    preconditions: []
    effect: The alert is marked as acknowledged and no longer sits untriaged.
    verification: Read the alert record and confirm it is assigned an acknowledged state.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions: []
    effect: The incident is routed to the selected resolver group for diagnosis and restoration.
    verification: Read the incident record and confirm the resolver group assignment is recorded.
  declareMajorIncident:
    input: Incident
    preconditions:
      - majorIncidentDeclarationConditions
    effect: "The incident is declared as a major incident when business impact and coordination needs justify it, an incident commander is assigned, and major-incident communication cadence is started."
    verification: Confirm the incident is recorded as a major incident and that an incident commander is assigned.
  containIncident:
    input: Incident
    preconditions: []
    effect: An approved containment workflow is triggered through people or external tools to stop spread or limit further impact.
    verification: "Confirm containment actions are recorded, impact is no longer increasing, and the containment scope is recorded."
  isolateAffectedConfigurationItem:
    input: Incident
    preconditions: []
    effect: An isolation workflow is triggered through people or external tools to remove the affected configuration item from network access or dependencies as a containment step for the incident.
    verification: "Confirm the isolation step is recorded against the incident, the intended configuration item is isolated, and affected IT service health state is checked."
  failOverITService:
    input: Incident
    preconditions: []
    effect: A failover workflow is triggered through people or external tools to move service operation to the recovery environment under the applicable recovery plan.
    verification: Confirm the service record or incident record shows failover was initiated or completed under the selected recovery plan.
  restoreFromBackup:
    input: Backup set
    preconditions: []
    effect: A restoration workflow is triggered through people or external tools to restore approved backup data to the intended target from the selected backup set.
    verification: Confirm restoration completed from the selected backup and validate that the restored target is usable.
  executeEmergencyChange:
    input: Emergency change
    preconditions: []
    effect: An emergency change workflow is triggered through people or external tools to execute an urgent controlled fix under the accelerated change path to restore service or reduce urgent risk.
    verification: Confirm the emergency change was implemented and the intended service effect occurred.
  sendStakeholderCommunication:
    input: Incident
    preconditions: []
    effect: "An approved incident update is issued and timestamped to the relevant audience based on the latest verified incident state, and the final message is archived."
    verification: "Confirm a communication record exists for the incident, delivery status is recorded, the final archived message is recorded, and the communication timestamp is recorded."
  submitRegulatoryNotification:
    input: Regulatory notification
    preconditions: []
    effect: "An approved incident-related regulatory submission is triggered through people or external tools to the relevant authority, and the regulatory notification status becomes submitted."
    verification: Confirm the notification status is submitted and the intended regulator received it.
  closeIncident:
    input: Incident
    preconditions:
      - incidentClosureConditions
    effect: The incident record is formally closed once closure conditions are satisfied.
    verification: Confirm the incident is recorded as closed and required closure conditions are satisfied.
