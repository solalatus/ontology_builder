    to: Incident
    meaning: This links the service desk to incidents it receives and formally logs.
    aliases: []
  - name: operates
    from: Network operations centre
    to: Monitoring tool
    meaning: This links the network operations centre to the monitoring platform it runs.
    aliases: []
  - name: monitors
    from: Security operations centre
    to: Security event
    meaning: This links the security operations centre to security events it watches and investigates.
    aliases: []
  - name: notifies
    from: Incident
    to: Stakeholder
    meaning: This links an incident to the stakeholder it notifies.
    aliases: []
  - name: wasCausedBy
    from: Incident
    to: Change
    meaning: null
    aliases: []
  - name: impacts
    from: Incident
    to: IT service
    meaning: This links an incident to an IT service whose operation is directly affected.
    aliases: []
  - name: impacts
    from: Incident
    to: Business service
    meaning: This links an incident to a business service whose delivery or outcome is adversely affected.
    aliases: []
  - name: isTriggeredBy
    from: Incident
    to: Alert
    meaning: This links an incident to an alert that initiated or directly led to opening it.
    aliases: []
  - name: isCorrelatedFrom
    from: Incident
    to: Event
    meaning: This links an incident to events used to understand or assemble the incident picture.
    aliases: []
  - name: owns
    from: Application owner
    to: Application
    meaning: This links an application owner to the application they are accountable for.
    aliases: []
  - name: owns
    from: Service owner
    to: IT service
    meaning: This links a service owner to the IT service they are accountable for across its lifecycle.
    aliases: []
  - name: isAccountableFor
    from: Business owner
    to: Business service
    meaning: This links a business owner to the business service they are accountable for from the business side.
    aliases: []
  - name: isMemberOf
    from: On-call engineer
    to: Resolver group
    meaning: This links an on-call engineer to the resolver group they belong to.
    aliases: []
  - name: dependsOn
    from: IT service
    to: Third-party service
