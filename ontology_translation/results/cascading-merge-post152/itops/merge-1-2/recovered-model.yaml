rules:
  canDeclareMajorIncident:
    conditions:
      - incident currentStatus is not resolved
      - incident currentStatus is not closed
      - incident currentStatus is not cancelled
      - incident severity is sev1-critical or sev2-high
      - incident impacts at least one IT service
      - incident is coordinated by an incident commander
  canSubmitRegulatoryNotification:
    conditions:
      - materiality assessment result is reportable
      - regulatory notification reports the incident
      - regulatory notification is sent to a regulator
      - incident is supported by the necessary evidence items
      - regulatory notification notificationStatus is approved
      - regulatory notification submittedAt is not later than dueAt
  canCloseIncident:
    conditions:
      - incident currentStatus is resolved or monitoring
      - impacted IT services currentStatus is healthy or recovering
      - all impacted business services have health state healthy
      - incident is supported by the necessary evidence items
      - incident is communicated through the required communications
      - "if incident isMajorIncident is true, required review activity is scheduled or completed"
      - "if incident isCybersecurityIncident is true, required review activity is scheduled or completed"
  backupSetSafeForRecovery:
    conditions:
      - backup set status is successful or verified
      - backup set protects the configuration item that needs to be restored
  safeRecoveryPlanUse:
    conditions:
      - recovery plan recovers the affected IT service
  guidedRunbookSelection:
    conditions:
      - incident is handled with the runbook
      - the runbook matches the current incident state
  guidedWorkaroundSelection:
    conditions:
      - the incident is linked to a problem or diagnosed issue
      - the problem is documented by a known error
      - the known error has the workaround
      - the workaround is documented in a runbook
  cybersecurityEvidenceSufficient:
    conditions:
      - incident isCybersecurityIncident is true
      - incident is supported by the required evidence items
      - "evidence item integrityStatus is collected, hashed, verified, or sealed"
      - "preserved evidence is complete enough to support analysis, accountability, and reporting"
actions:
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: The alert is marked acknowledged and the acknowledgement time is recorded.
    verification: Read the alert and confirm it is in acknowledged state.
  assignIncident:
    input: Incident
    preconditions: []
    effect: The incident is assigned to the resolver group.
    verification: Read the incident and confirm the resolver-group assignment.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: "The incident is treated as a major incident, with command and communication cadence started and declaration time recorded."
    verification: "Confirm major-incident classification, commander assignment, declaration time, and a communication record."
  sendStakeholderCommunication:
    input: Incident
    preconditions: []
    effect: The communication is sent and time-stamped.
    verification: Confirm delivery status and archive the final message.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: The notification is submitted.
    verification: "Confirm accepted submission, or record rejection and follow-up if it is not accepted."
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: The incident is closed and the closure time is recorded.
    verification: "Read the incident and linked service state, and confirm closure plus retained evidence."
  containIncident:
    input: Incident
    preconditions: []
    effect: "Approved containment steps are executed, and the incident moves to contained once containment is verified."
    verification: Confirm the containment indicators and the resulting service impact.
  isolateConfigurationItem:
    input: Incident
    preconditions: []
    effect: The configuration item linked to the incident is isolated from the defined network paths or dependencies.
    verification: Confirm the isolation state and check the remaining service health.
  failOverService:
    input: Incident
    preconditions:
      - safeRecoveryPlanUse
    effect: The service workload is moved to the recovery environment.
    verification: Confirm service health and critical business transactions in the recovery environment.
  restoreBackup:
    input: BackupSet
    preconditions:
      - backupSetSafeForRecovery
    effect: The backup data is restored to the target.
    verification: Validate data integrity and application functionality after restore.
  executeEmergencyChange:
    input: EmergencyChange
    preconditions: []
    effect: "The approved emergency change is implemented and change status becomes implemented, failed, or rolled-back as appropriate."
    verification: "Run technical checks, verify service health, and confirm the change status is updated appropriately."
