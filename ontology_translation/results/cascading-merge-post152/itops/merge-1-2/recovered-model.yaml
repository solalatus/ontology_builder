    aliases: []
  - name: classifiesIncident
    from: Major incident
    to: Incident
    meaning: Relates a major incident or cybersecurity incident record to the incident it classifies.
    aliases: []
  - name: classifiesIncident
    from: Cybersecurity incident
    to: Incident
    meaning: Relates a major incident or cybersecurity incident record to the incident it classifies.
    aliases: []
  - name: handledByOnCallEngineer
    from: Incident
    to: On-call engineer
    meaning: Relates an incident to the on-call engineer handling time-critical response.
    aliases: []
  - name: ownedByOrganizationalUnit
    from: Corrective action
    to: OrganizationalUnit
    meaning: Relates a corrective action to the organizational unit that owns it.
    aliases: []
  - name: documentedIn
    from: Workaround
    to: Runbook
    meaning: This links a workaround to the maintained procedure where it is described.
    aliases: []
  - name: records
