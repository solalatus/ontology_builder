    to: Materiality assessment
    meaning: This links an incident to the assessment used to determine its significance and reporting implications.
    aliases: []
  - name: triggers
    from: Materiality assessment
    to: Regulatory notification
    meaning: This links a materiality assessment to the formal notification it causes when reporting is required.
    aliases: []
  - name: isSentTo
    from: Regulatory notification
    to: Regulator
    meaning: This links a regulatory notification to the supervisory authority that receives it.
    aliases: []
  - name: isSupportedBy
    from: Incident
    to: Evidence item
    meaning: This links an incident to preserved records or artifacts that support analysis and accountability.
    aliases: []
  - name: requiresPreservationOf
    from: Cybersecurity incident
    to: Evidence item
    meaning: This links a cybersecurity incident to the evidence that must be preserved for investigation and accountability.
    aliases: []
  - name: isAddressedTo
    from: Communication
    to: Stakeholder
    meaning: This links a communication to the stakeholder it is addressed to.
    aliases: []
  - name: produces
    from: Post-incident review
    to: Corrective action
    meaning: This links a post-incident review to the corrective action it produces.
    aliases: []
  - name: isLinkedTo
    from: Incident
    to: Problem
    meaning: This links an incident to an underlying or suspected cause tracked as a problem.
    aliases: []
  - name: isJustifiedBy
    from: Emergency change
    to: Incident
    meaning: This links an emergency change to the active incident that makes the accelerated change path necessary.
    aliases: []
  - name: resolvedBy
    from: Incident
    to: Change
    meaning: This links an incident to the change used to restore service or remove the immediate cause.
    aliases: []
  - name: deliveredBy
    from: Release
    to: Deployment
    meaning: This links a release to the technical deployment that installs or activates it.
    aliases: []
  - name: isAssignedTo
    from: Incident
    to: Resolver group
    meaning: This links an incident to the team responsible for diagnosis and restoration.
    aliases: []
  - name: reports
    from: Regulatory notification
    to: Incident
    meaning: This links a regulatory notification to the incident being formally reported.
    aliases: []
  - name: commands
    from: Incident commander
    to: Major incident
    meaning: This links an incident commander to the major incident they command.
    aliases: []
  - name: isCommunicatedThrough
    from: Incident
    to: Communication
