competency_questions:
  - id: cq6
    text: What is the initial funding date on this loan or credit agreement?
  - id: cq15
    text: "Does this loan or credit agreement have variable-rate features on file, such as reset schedule, cap, or first rate change term?"
  - id: cq16
    text: "What prepayment terms apply to this loan or credit agreement, including any penalty period?"
  - id: cq17
    text: Is this loan or credit agreement interest-only?
  - id: cq18
    text: Does this loan or credit agreement permit negative amortization?
  - id: cq19
    text: Does this loan or credit agreement include a balloon payment?
  - id: cq20
    text: Which loan-to-value ratio and combined loan-to-value ratio apply to this collateralized loan?
  - id: cq21
    text: What collateral value information is recorded for this collateralized loan?
  - id: cq22
    text: What loan-to-value measure is recorded for this collateralized loan?
  - id: cq21
    text: Who is collecting payments for this loan or credit agreement?
  - id: cq22
    text: Is this loan or credit agreement fixed-rate or variable-rate?
  - id: cq23
    text: What reset schedule is recorded for this variable-rate loan or credit agreement?
  - id: cq24
    text: What rate cap is recorded for this variable-rate loan or credit agreement?
  - id: cq25
    text: What first rate change term is recorded for this variable-rate loan or credit agreement?
  - id: cq26
    text: What prepayment penalty period is recorded for this loan or credit agreement?
classes:
  Loan:
    meaning: A loan is money or credit extended by one party to another with the expectation that it will be repaid under agreed or stated terms.
    aliases: []
    properties:
      principalAmount:
        type: number
      maturityDate:
        type: date
      initialExchangeDate:
        type: date
      interestOnly:
        type: boolean
      negativeAmortization:
        type: boolean
      balloonPayment:
        type: boolean
      firstRateChangeTermMonths:
        type: number
      securityClassification:
        type: text
        allowed:
          - secured
          - unsecured
      interestRateClassification:
        type: text
        allowed:
          - fixed
          - variable
      rateCap:
        type: number
  CreditAgreement:
    meaning: "A credit agreement is an agreement or contract under which a borrower or debtor receives money, credit, or other value and agrees to repay the creditor, usually with interest, by some future date."
    aliases: []
    properties:
      debtAmount:
        type: number
      maturityDate:
        type: date
      initialExchangeDate:
        type: date
  CreditFacility:
    meaning: A credit facility is a credit agreement or arrangement that lets a borrower draw funds over time rather than taking one fully funded fixed amount at closing.
    aliases:
      - master commitment
    properties:
      creditLimit:
        type: number
      availableAmount:
        type: number
      amountOfCreditExtended:
        type: number
      maximumAdvanceAmount:
        type: number
  Borrower:
    meaning: "A borrower is the party that receives money or credit and is obligated to repay the amount borrowed, along with interest and any other applicable charges."
    aliases: []
    properties: {}
  Lender:
    meaning: A lender is the party that provides the money or credit and expects repayment.
    aliases: []
    properties: {}
  Servicer:
    meaning: A servicer is the party responsible for collecting principal and interest payments on behalf of the lender.
    aliases: []
    properties: {}
  PaymentHistory:
    meaning: A payment history is the record of actual payments made against a loan or other debt obligation.
    aliases: []
    properties: {}
  PaymentTransaction:
    meaning: "An individual actual payment of principal, interest, fees, or related amounts toward the debt."
    aliases: []
    properties: {}
  Collateral:
    meaning: Collateral is an asset or other pledged support used as security to support repayment of an obligation.
    aliases: []
    properties: {}
  AmortizationSchedule:
    meaning: An amortization schedule is the schedule of periodic payments showing how the loan balance is expected to reduce over time.
    aliases: []
    properties: {}
  InterestCalculationSchedule:
    meaning: An interest calculation schedule is the schedule showing when interest is calculated under the contract.
    aliases: []
    properties: {}
  InterestRateResetSchedule:
    meaning: An interest rate reset schedule is the schedule of dates on which a variable interest rate is recalculated or reset.
    aliases: []
    properties: {}
  PrepaymentTerms:
    meaning: Prepayment terms are the terms that govern repayment of a loan before its maturity.
    aliases: []
    properties:
      prepaymentPenaltyTermMonths:
        type: number
  SecurityAgreement:
    meaning: A security agreement is the agreement that grants a security interest in collateral supporting an obligation.
    aliases: []
    properties: {}
  CreditEnhancementAgreement:
    meaning: A credit enhancement agreement is an agreement that provides collateral or similar support to reduce counterparty credit risk.
    aliases:
      - collateralization
      - credit support agreement
      - financial collateral arrangement
      - margin arrangement
    properties: {}
  PrincipalRepaymentTerms:
    meaning: Principal repayment terms are the contract terms that specify how and when principal must be repaid.
    aliases: []
    properties:
      initialPrincipalPaymentDate:
        type: date
      principalRepaymentDate:
        type: date
      principalPaymentFrequency:
        type: text
      principalPaymentDay:
        type: number
  InterestPaymentTerms:
    meaning: Interest payment terms are the contract terms that specify how and when interest is to be paid.
    aliases: []
    properties:
      initialInterestAccrualDate:
        type: date
      initialInterestPaymentDate:
        type: date
      finalInterestPaymentDate:
        type: date
      interestPaymentFrequency:
        type: text
      interestPaymentDay:
        type: number
      compoundingFrequency:
        type: text
  Principal:
    meaning: "Principal is the amount of the debt that must be repaid, separate from interest."
    aliases: []
    properties: {}
  Interest:
    meaning: "Interest is the cost of using borrowed money, typically expressed as a rate over time."
    aliases: []
    properties: {}
  FixedInterestRate:
    meaning: A fixed interest rate is an interest rate that does not change over the life of the loan.
    aliases: []
    properties:
      rate:
        type: number
  VariableInterestRate:
    meaning: "A variable interest rate is an interest rate that can change over the life of the loan according to the loan's terms."
    aliases:
      - adjustable rate
    properties: {}
  CreditEnhancementBeneficiary:
    meaning: A credit enhancement beneficiary is the party protected by the collateral or guarantee established under a credit enhancement agreement.
    aliases: []
    properties: {}
  SecuredLoan:
    meaning: A secured loan is a loan whose repayment is supported by pledged collateral or a third-party guarantee.
    aliases: []
    properties: {}
  CollateralizedLoan:
    meaning: A collateralized loan is a secured loan backed by cash or other acceptable collateral provided under the collateral arrangement.
    aliases: []
    properties: {}
  LoanToValueMeasure:
    meaning: The ratio between the loan amount and the appraised value of the collateral securing it.
    aliases:
      - LTV
    properties:
      ratio:
        type: number
  CombinedLoanToValueRatio:
    meaning: A combined loan to value ratio is the ratio of total debt secured by the collateral to the appraised value of that collateral.
    aliases: []
    properties:
      ratio:
        type: number
  CollateralValuation:
    meaning: The appraised value of collateral as of a stated date.
    aliases: []
    properties:
      asOfDate:
        type: date
      value:
        type: number
  BorrowingCapacity:
    meaning: The assessed upper amount a borrower is considered able to repay as of a point in time.
    aliases: []
    properties:
      amount:
        type: number
  SubFacility:
    meaning: A portion of a credit facility made available for a particular purpose or use.
    aliases: []
    properties: {}
  DayCountConvention:
    meaning: The convention used to calculate how interest accrues based on the number of days in a period.
    aliases: []
    properties: {}
  PaymentSchedule:
    meaning: The schedule of expected or specified payment-related dates associated with a loan.
    aliases: []
    properties: {}
