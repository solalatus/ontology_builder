    aliases: []
  - name: hasSchedule
    from: Loan
    to: PrincipalPaymentSchedule
    meaning: Links a loan to the principal payment schedule on file for that loan.
    aliases: []
  - name: hasSchedule
    from: Loan
    to: InterestPaymentSchedule
    meaning: Links a loan to the interest payment schedule on file for that loan.
    aliases: []
  - name: hasSchedule
    from: Loan
    to: InterestRateResetSchedule
