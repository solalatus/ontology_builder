rules:
  loanReadinessCheck:
    conditions:
      - the loan has a borrower
      - the loan has a lender
      - the loan has either a fixed interest rate or a variable interest rate
      - the loan has interest and interest payment terms govern payment of that interest
  securedLoanSupportCheck:
    conditions:
      - the secured loan is collateralized by collateral
  variableRateSetupCheck:
    conditions:
      - the loan has a variable interest rate
      - the loan has an interest rate reset schedule
  paymentRecordCompletenessCheck:
    conditions:
      - the loan has payment history
      - the payment history has at least one payment
  prepaymentTermsCheck:
    conditions:
      - "if prepayment penalty timing is being recorded for the loan, the prepayment penalty term in months must be present"
  requiresRepaymentSetupForAmortizingLoan:
    conditions:
      - loan has amortization schedule
      - loan has principal repayment terms
  requiresInterestPaymentTermsForInterestBearingLoan:
    conditions:
      - loan has fixed interest rate or loan has variable interest rate
      - loan has interest payment terms
actions:
  assessLoanReadiness:
    input: Loan
    preconditions:
      - loanReadinessCheck
    effect: Confirm whether the loan record includes the core parties and core interest terms needed for readiness.
    verification: "Confirm that the loan has a borrower, has a lender, and has the applicable interest term links present."
  verifySecuredLoanSupport:
    input: SecuredLoan
    preconditions:
      - securedLoanSupportCheck
    effect: Confirm whether the secured loan has supporting collateral recorded.
    verification: Confirm that the secured loan is linked to collateral.
  reviewVariableRateSetup:
    input: Loan
    preconditions:
      - variableRateSetupCheck
    effect: Confirm whether the loan has the variable-rate setup required in this scope.
    verification: Confirm that the loan has a variable interest rate and an interest rate reset schedule.
  reviewPaymentRecordCompleteness:
    input: Loan
    preconditions:
      - paymentRecordCompletenessCheck
    effect: Confirm whether the loan has payment history and whether that history contains payment records.
    verification: Confirm that the loan has payment history and that the payment history has at least one payment.
  reviewPrepaymentTerms:
    input: Loan
    preconditions:
      - prepaymentTermsCheck
    effect: Confirm whether prepaymentPenaltyTermMonths is present when prepayment penalty timing is being recorded on the loan.
    verification: "Confirm that when prepayment penalty timing is being recorded, prepaymentPenaltyTermMonths is present on the loan."
  confirmRepaymentSetupForAmortizingLoan:
    input: Loan
    preconditions:
      - requiresRepaymentSetupForAmortizingLoan
    effect: Check that an amortizing loan has the schedule and principal repayment terms needed for servicing.
    verification: Confirm whether the required schedule and principal repayment terms are present.
  validateInterestPaymentTerms:
    input: Loan
    preconditions:
      - requiresInterestPaymentTermsForInterestBearingLoan
    effect: Check that a loan with an interest rate has the terms needed to govern interest payment and accrual.
    verification: Confirm whether the needed interest payment terms are present.
  checkServicingResponsibilityIdentified:
    input: Loan
    preconditions: []
    effect: Check that the loan is linked to the party responsible for collecting payments.
    verification: Confirm whether the responsible party is linked to the loan.
  confirmCollateralValuationSupport:
    input: Loan
    preconditions: []
    effect: Check that collateral tied to the loan has dated value information available for tracking.
    verification: Confirm whether dated collateral value information is present.
  reviewBorrowerCapacityInformation:
    input: Borrower
    preconditions: []
    effect: Check that a borrowing capacity assessment exists for the borrower when that information is needed operationally.
    verification: Confirm whether a borrowing capacity assessment exists for the borrower.
