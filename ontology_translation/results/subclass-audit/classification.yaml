# Issue #155 subclass audit: a judgment on each candidate pair found by
# tools/subclass_audit.py (audit.json). This file is NOT computed: it is a
# reviewer's reading of each pair, recorded so it can be checked and argued
# with. tools/tests/test_subclass_audit.py fails if it stops covering exactly
# the audit's candidate pairs.
#
# Categories (OntoClean-style rigidity, adapted for a flat-classes model):
#   kind      rigid, and the subtype has relationships, properties or rules
#             of its own in the domain. The only category where a
#             specializes edge carries information a property cannot.
#   value     rigid, but differs from its siblings by one attribute value
#             (medium, mode, type flag). A controlled-value property on the
#             parent says the same thing and keeps the model flat.
#   state     anti-rigid: an instance can enter or leave it during its life
#             (declared, accrued, degraded). Must not be a subclass.
#   role      held because of a relationship to something else.
#   individual
#             names one real-world thing (there is one Service Desk), not a
#             type: the instance-versus-class confusion.
categories: [kind, value, state, role, individual]

