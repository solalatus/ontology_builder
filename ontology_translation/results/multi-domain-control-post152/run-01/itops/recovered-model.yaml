competency_questions:
  - id: cq1
    text: Which business services and customer channels are impacted by this incident?
  - id: cq2
    text: Which configuration items and third-party services are on the dependency path of the affected IT service?
  - id: cq3
    text: Which active alerts and events are correlated with the incident?
  - id: cq4
    text: "Who owns the affected service, and which resolver group and on-call engineer should be assigned?"
  - id: cq5
    text: "Does the incident meet the bank's criteria for major-incident declaration?"
  - id: cq6
    text: "Which runbook, workaround, backup set, and recovery plan can be used safely?"
  - id: cq7
    text: Was the incident caused by a recent change or deployment?
  - id: cq8
    text: "Is a materiality assessment complete, and is regulatory notification required and due?"
  - id: cq9
    text: "Are evidence integrity, stakeholder communications, and closure conditions complete?"
  - id: cq10
    text: Which corrective actions from prior post-incident reviews remain open for the affected service?
classes:
  Incident:
    meaning: "An incident is an unplanned interruption, degradation, or security condition that requires managed response."
    aliases: []
    properties:
      summary:
        type: text
      description:
        type: text
      detectedAt:
        type: date
      openedAt:
        type: date
      resolvedAt:
        type: date
      closedAt:
        type: date
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      impact:
        type: text
        allowed:
          - enterprise-wide
          - multiple-services
          - single-service
          - limited-users
          - no-observed-impact
      urgency:
        type: text
        allowed:
          - immediate
          - high
          - normal
          - low
      category:
        type: text
        allowed:
          - availability
          - performance
          - capacity
          - network
          - application
          - database
          - infrastructure
          - data-integrity
          - cybersecurity
          - third-party
          - change-induced
          - other
      detectionSource:
        type: text
        allowed:
          - monitoring
          - siem
          - service-desk
          - user-report
          - vendor-report
          - automated-control
          - regulator
          - other
      recurring:
        type: boolean
      timeToAcknowledge:
        type: number
      timeToRestore:
        type: number
      majorIncidentState:
        type: boolean
      majorIncidentDeclaredAt:
        type: date
  BusinessService:
    meaning: A business service is a customer-facing or business-facing capability delivered by the bank.
    aliases: []
    properties:
      name:
        type: text
      description:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      availabilityTarget:
        type: number
  CustomerChannel:
    meaning: A customer channel is a channel through which customers access banking services.
    aliases: []
    properties: {}
  ITService:
    meaning: An IT service is a managed technology capability that supports one or more business services.
    aliases:
      - informatics service
    properties:
      name:
        type: text
      description:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      availabilityTarget:
        type: number
  ConfigurationItem:
    meaning: A configuration item is a managed component that sits within configuration-management scope.
    aliases:
      - CI
    properties:
      name:
        type: text
      version:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  ThirdPartyService:
    meaning: A third-party service is an externally provided service on which the bank depends.
    aliases:
      - outsourced service
    properties:
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  Alert:
    meaning: An alert is a monitoring or security signal that requires triage or acknowledgement.
    aliases: []
    properties:
      raisedAt:
        type: date
      summary:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      detectionSource:
        type: text
        allowed:
          - monitoring
          - siem
          - service-desk
          - user-report
          - vendor-report
          - automated-control
          - regulator
          - other
      occurrenceCount:
        type: number
  Event:
    meaning: An event is a time-stamped observation of a state change or other noteworthy occurrence.
    aliases: []
    properties:
      observedAt:
        type: date
      eventType:
        type: text
      detectionSource:
        type: text
        allowed:
          - monitoring
          - siem
          - service-desk
          - user-report
          - vendor-report
          - automated-control
          - regulator
          - other
  ResolverGroup:
    meaning: A resolver group is the team assigned to diagnose and restore a specific technology or service area.
    aliases:
      - support group
    properties: {}
  OnCallEngineer:
    meaning: An on-call engineer is a technical specialist available for time-critical operational response.
    aliases:
      - on-call
    properties: {}
  ITServiceOwner:
    meaning: The IT service owner is the role accountable for an IT service across its lifecycle.
    aliases: []
    properties: {}
  BusinessOwner:
    meaning: The business owner is the business role accountable for a business service or process outcome.
    aliases: []
    properties: {}
  IncidentCommander:
    meaning: "The incident commander is the person accountable for command, coordination, and decision cadence during a major incident."
    aliases:
      - incident manager
      - major-incident lead
    properties: {}
  ApplicationOwner:
    meaning: The application owner is the role accountable for an application and its operational fitness.
    aliases: []
    properties: {}
  TechnicalOwner:
    meaning: The technical owner is the role accountable for the engineering and maintenance of a configuration item.
    aliases: []
    properties: {}
  Runbook:
    meaning: "A runbook is a maintained operational procedure for diagnosis, response, recovery, or verification."
    aliases: []
    properties: {}
  Workaround:
    meaning: A workaround is a temporary method that reduces or bypasses the impact of an incident or problem.
    aliases: []
    properties: {}
  BackupSet:
    meaning: A backup set is a defined collection of recoverable backup data for protected components.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      lastSuccessfulBackup:
        type: date
      lastVerification:
        type: date
  RecoveryPlan:
    meaning: A recovery plan is a documented plan for restoring an IT service and its dependencies.
    aliases: []
    properties:
      recoveryTimeObjective:
        type: number
      recoveryPointObjective:
        type: number
      lastReviewDate:
        type: date
  Change:
    meaning: "A change is a controlled addition, modification, or removal that may affect an IT service."
    aliases: []
    properties:
      summary:
        type: text
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      riskLevel:
        type: text
        allowed:
          - low
          - medium
          - high
          - critical
      plannedStart:
        type: date
      plannedEnd:
        type: date
      implementationPlan:
        type: text
      backoutPlan:
        type: text
  Deployment:
    meaning: A deployment is the technical execution that installs or activates a release or change.
    aliases: []
    properties: {}
  MaterialityAssessment:
    meaning: A materiality assessment is a documented determination of incident significance and reporting implications.
    aliases: []
    properties:
      assessedAt:
        type: date
      result:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      rationale:
        type: text
      reportingDueTime:
        type: date
  RegulatoryNotification:
    meaning: A regulatory notification is a formal incident-related submission to a competent authority.
    aliases: []
    properties:
      dueAt:
        type: date
      submittedAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  StakeholderCommunication:
    meaning: "A stakeholder communication is a controlled message sent to operational, business, customer, vendor, or regulatory audiences."
    aliases: []
    properties:
      sentAt:
        type: date
      audience:
        type: text
        allowed:
          - technical
          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      messageSummary:
        type: text
  EvidenceItem:
    meaning: "An evidence item is a preserved record, artifact, or observation supporting incident analysis and accountability."
    aliases: []
    properties:
      collectedAt:
        type: date
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      cryptographicHash:
        type: text
  CorrectiveAction:
    meaning: "A corrective action is a tracked action intended to remove a cause, reduce risk, or improve response capability."
    aliases: []
    properties:
      actionDescription:
        type: text
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueDate:
        type: date
  PostIncidentReview:
    meaning: "A post-incident review is a structured review of causes, response effectiveness, lessons, and follow-up work."
    aliases:
      - PIR
      - RCA review
    properties:
      heldOn:
        type: date
      findings:
        type: text
  Regulator:
    meaning: A regulator is the competent authority that supervises the bank or receives required notifications.
    aliases: []
    properties: {}
  Application:
    meaning: A application is a software system that implements business or operational functionality.
    aliases: []
    properties:
      externallyAccessible:
        type: boolean
      releaseVersion:
        type: text
  InfrastructureComponent:
    meaning: "An infrastructure component is a technical component that provides compute, network, platform, endpoint, or storage capability."
    aliases: []
    properties: {}
  Environment:
    meaning: "An environment is a deployment context such as production, test, development, or disaster recovery."
