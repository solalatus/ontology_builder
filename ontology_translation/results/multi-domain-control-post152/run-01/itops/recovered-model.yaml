          - disaster-recovery
          - pre-production
          - test
          - development
          - management
  DataAsset:
    meaning: A data asset is a governed collection of information processed or stored by services.
    aliases: []
    properties:
      name:
        type: text
      dataClassification:
        type: text
        allowed:
          - public
          - internal
          - confidential
          - restricted
  IntegrationInterface:
    meaning: An integration interface is a defined technical interface through which systems exchange data or commands.
    aliases: []
    properties:
      protocol:
        type: text
  SecurityEvent:
    meaning: "A security event is an event relevant to confidentiality, integrity, availability, authenticity, or cyber threat activity."
    aliases: []
    properties: {}
  Problem:
    meaning: A problem is the underlying cause or potential cause of one or more incidents.
    aliases: []
    properties:
      summary:
        type: text
      status:
        type: text
        allowed:
          - new
          - investigating
          - root-cause-known
          - known-error
          - resolved
          - closed
      rootCauseCategory:
        type: text
        allowed:
          - software-defect
          - configuration-error
          - capacity-shortage
          - hardware-failure
          - network-failure
          - human-error
          - process-failure
          - third-party-failure
          - cyber-attack
          - unknown
  KnownError:
    meaning: A known error is a diagnosed problem with a documented cause or workaround.
    aliases: []
    properties:
      diagnosedCause:
        type: text
      workaroundSummary:
        type: text
  Release:
    meaning: A release is a governed package of approved changes introduced together.
    aliases: []
    properties:
      version:
        type: text
      releaseDate:
        type: date
  EmergencyChange:
    meaning: An emergency change is a change handled through an accelerated path to address an urgent operational need.
    aliases: []
    properties:
      summary:
        type: text
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      riskLevel:
        type: text
        allowed:
          - low
          - medium
          - high
          - critical
      implementationPlan:
        type: text
      backoutPlan:
        type: text
  CybersecurityIncident:
    meaning: "A cybersecurity incident is an incident caused by or involving malicious, unauthorized, or otherwise security-relevant activity."
    aliases: []
    properties: {}
  LogSource:
    meaning: A log source is a system or component that emits operational or security records.
    aliases: []
    properties:
      sourceType:
        type: text
  Vendor:
    meaning: A vendor is an external organization that supplies or supports technology or services.
    aliases: []
    properties:
      legalName:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      criticalProvider:
        type: boolean
  MonitoringTool:
    meaning: A monitoring tool is a platform that collects telemetry and evaluates operational conditions.
    aliases: []
    properties: {}
  CloudService:
    meaning: A cloud service is a technology capability consumed from an external or group cloud provider.
    aliases: []
    properties: {}
  Bank:
    meaning: The bank is the regulated financial institution whose IT services and incidents are being managed.
    aliases: []
    properties: {}
