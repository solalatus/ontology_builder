rules:
  majorIncidentDeclarationPreconditions:
    conditions:
      - incident status is not resolved
      - incident status is not closed
      - incident status is not cancelled
      - incident severity is sev1-critical or sev2-high
      - incident impacts at least one IT service
      - incident is coordinated by an incident commander
  regulatoryNotificationSubmissionPreconditions:
    conditions:
      - materiality assessment result is reportable
      - regulatory notification reports the incident
      - regulatory notification is sent to a regulator
      - regulatory notification includes the required evidence items
      - regulatory notification status is approved
      - regulatory notification dueAt is not before the submission time
  incidentClosurePreconditions:
    conditions:
      - incident status is resolved or monitoring
      - all impacted IT services have health state healthy
      - all impacted business services have health state healthy
      - incident is supported by evidence items
      - incident is communicated through stakeholder communications
      - if the incident is coordinated by an incident commander then the incident is reviewed in a post-incident review
  safeBackupSetUse:
    conditions:
      - backup set status is successful or verified
      - backup set protects the target configuration item
  safeRecoveryPlanUse:
    conditions:
      - recovery plan recovers the affected IT service
  guidedRunbookSelection:
    conditions:
      - incident is handled with the runbook
      - the runbook matches the current incident state
  guidedWorkaroundSelection:
    conditions:
      - the incident is linked to a problem or diagnosed issue
      - the problem is documented by a known error
      - the known error has the workaround
      - the workaround is documented in a runbook
actions:
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: Alert status becomes acknowledged.
    verification: Read the alert and confirm the status is acknowledged.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions: []
    effect: Incident is assigned to the resolver group.
    verification: Read the incident and confirm the resolver-group assignment.
  declareMajorIncident:
    input: Incident
    preconditions:
      - majorIncidentDeclarationPreconditions
    effect: Incident majorIncidentState becomes true and majorIncidentDeclaredAt is recorded.
    verification: "Read the incident and confirm majorIncidentState is true, majorIncidentDeclaredAt is recorded, and an incident commander is linked."
  sendStakeholderCommunication:
    input: Incident
    preconditions: []
    effect: A stakeholder communication linked to the incident is sent and timestamped.
    verification: Read the linked stakeholder communication and confirm sentAt is recorded.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - regulatoryNotificationSubmissionPreconditions
    effect: Regulatory notification status becomes submitted.
    verification: Confirm the regulatory notification status is submitted.
  closeIncident:
    input: Incident
    preconditions:
      - incidentClosurePreconditions
    effect: Incident status becomes closed and closedAt is recorded.
    verification: Read the incident and confirm status is closed and closedAt is recorded.
  containIncident:
    input: Incident
    preconditions: []
    effect: "Approved containment steps are executed and, once containment is verified, incident status becomes contained."
    verification: Read the incident and confirm status is contained.
  isolateConfigurationItem:
    input: Incident
    preconditions: []
    effect: "The configuration item linked to the incident is isolated as a containment step, and incident status becomes contained."
    verification: Read the incident and confirm status is contained.
  failOverService:
    input: Incident
    preconditions:
      - safeRecoveryPlanUse
    effect: The affected service is moved under the recovery plan.
    verification: Read the impacted IT service and confirm healthState is healthy.
  restoreBackup:
    input: BackupSet
    preconditions:
      - safeBackupSetUse
    effect: Backup data is restored to the protected configuration item.
    verification: Confirm restore completed against the protected configuration item and data integrity is validated.
  executeEmergencyChange:
    input: EmergencyChange
    preconditions: []
    effect: The approved emergency change is implemented and its status becomes implemented.
    verification: Read the emergency change and confirm status is implemented.
