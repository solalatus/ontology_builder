    properties:
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
      startedAt:
        type: date
      completedAt:
        type: date
  MaterialityAssessment:
    meaning: A documented determination of incident significance and reporting implications.
    aliases: []
