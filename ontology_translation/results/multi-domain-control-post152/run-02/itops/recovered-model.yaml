competency_questions:
  - id: cq1
    text: Which business services are impacted by this incident?
  - id: cq2
    text: Through which customer channels are those impacted business services delivered?
  - id: cq3
    text: Which IT services are impacted by this incident?
  - id: cq4
    text: Which configuration items and third-party services are on the dependency path of the affected IT service?
  - id: cq5
    text: Which active alerts and correlated events are tied to this incident?
  - id: cq6
    text: Who owns the affected service?
  - id: cq7
    text: Which resolver group should handle the incident?
  - id: cq8
    text: Which on-call engineer should handle the incident?
  - id: cq9
    text: Does the incident meet the criteria for a major incident?
  - id: cq10
    text: "If the incident is a major incident, who is commanding it?"
  - id: cq11
    text: Which runbook can be used for this incident?
  - id: cq12
    text: Which workaround can be used for this incident?
  - id: cq13
    text: Which backup set and recovery plan can be used safely for this incident?
  - id: cq14
    text: Was the incident caused by a recent change or deployment?
  - id: cq15
    text: "Is a materiality assessment complete, and is a regulatory notification required and due?"
  - id: cq16
    text: "Is the incident supported by the necessary evidence, and is that evidence retained with integrity?"
  - id: cq17
    text: "If the incident is security-related, has the required evidence been preserved?"
  - id: cq18
    text: "Are evidence integrity, stakeholder communications, and closure conditions complete for this incident?"
classes:
  Incident:
    meaning: "An incident is an unplanned interruption, degradation, or security condition that requires managed operational response."
    aliases:
      - incidens
    properties:
      incidentId:
        type: text
      currentStatus:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      isMajorIncident:
        type: boolean
      isCybersecurityIncident:
        type: boolean
      openedAt:
        type: date
      detectedAt:
        type: date
      resolvedAt:
        type: date
      closedAt:
        type: date
      declaredMajorAt:
        type: date
  BusinessService:
    meaning: A business service is a customer-facing or business-facing banking capability the institution delivers.
    aliases:
      - üzleti szolgáltatás
    properties:
      serviceName:
        type: text
      currentStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  CustomerChannel:
    meaning: "A customer channel is the route through which customers access the bank's services."
    aliases:
      - ügyfélcsatorna
    properties: {}
  ITService:
    meaning: An IT service is a managed technology capability that supports one or more business services.
    aliases:
      - informatics service
      - informatikai szolgáltatás
    properties:
      serviceName:
        type: text
      currentStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  ConfigurationItem:
    meaning: "A configuration item is a managed component that sits within configuration scope and may be affected, changed, owned, backed up, or recovered."
    aliases:
      - CI
      - konfigurációs elem
    properties:
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  ThirdPartyService:
    meaning: A third-party service is an externally provided service that the bank depends on operationally.
    aliases:
      - outsourced service
      - külső szolgáltatás
    properties:
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  Alert:
    meaning: An alert is a monitoring or security signal that requires triage or acknowledgement.
    aliases:
      - riasztás
    properties:
      alertStatus:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      alertSeverity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      alertSource:
        type: text
      raisedAt:
        type: date
      acknowledgedAt:
        type: date
  Event:
    meaning: An event is a time-stamped observation of a state change or other notable occurrence.
    aliases:
      - esemény
    properties:
      eventType:
        type: text
      eventSource:
        type: text
      eventTime:
        type: date
  ServiceOwner:
    meaning: A service owner is the role accountable for an IT service across its lifecycle.
    aliases:
      - szolgáltatásgazda
    properties: {}
  ResolverGroup:
    meaning: A resolver group is the team assigned to diagnose and restore a specific service or technology area.
    aliases:
      - megoldócsoport
      - support group
    properties: {}
  OnCallEngineer:
    meaning: A on-call engineer is a technical specialist available for time-critical operational response.
    aliases:
      - ügyeletes mérnök
      - on-call
    properties: {}
  IncidentCommander:
    meaning: "An incident commander is the person accountable for command, coordination, and decision cadence during a major incident."
    aliases:
      - incident manager
      - incidensparancsnok
    properties: {}
  Runbook:
    meaning: "A runbook is a maintained operational procedure used for diagnosis, response, recovery, or verification."
    aliases:
      - üzemeltetési eljárás
      - playbook
    properties: {}
  Workaround:
    meaning: A workaround is a temporary method that reduces or bypasses the impact of an incident or problem.
    aliases:
      - kerülőmegoldás
    properties: {}
  BackupSet:
    meaning: A backup set is a defined collection of recoverable backup data for protected components.
    aliases:
      - mentéskészlet
      - backup
    properties:
      lastSuccessfulBackup:
        type: date
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
  RecoveryPlan:
    meaning: A recovery plan is a documented plan for restoring an IT service and its dependencies.
    aliases:
      - helyreállítási terv
      - DR plan
    properties:
      recoveryTimeObjective:
        type: number
      recoveryPointObjective:
        type: number
  Change:
    meaning: "A change is a controlled addition, modification, or removal that may affect an IT service."
    aliases:
      - változás
      - módosítás
    properties:
      changeStatus:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  Deployment:
    meaning: A deployment is the technical execution that installs or activates a release or change.
    aliases:
      - telepítés
      - élesítés
    properties:
      deploymentStatus:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
  MaterialityAssessment:
    meaning: "A materiality assessment is a documented determination of an incident's significance and reporting implications."
    aliases:
      - reportability assessment
      - lényegességi értékelés
    properties:
      assessedAt:
        type: date
      result:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
  RegulatoryNotification:
    meaning: A regulatory notification is a formal incident-related submission to a competent authority.
    aliases:
      - supervisory notification
      - felügyeleti bejelentés
    properties:
      notificationStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueAt:
        type: date
      submittedAt:
        type: date
  EvidenceItem:
    meaning: "An evidence item is a preserved record or artifact that supports incident analysis, accountability, or verification."
    aliases:
      - evidence
      - bizonyíték
    properties:
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
  Communication:
    meaning: "A communication is a controlled message sent to operational, business, customer, vendor, or regulatory audiences."
    aliases:
      - értesítés
      - tájékoztatás
    properties:
      sentAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  KnownError:
    meaning: A known error is a diagnosed issue with a documented cause or workaround.
    aliases:
      - ismert hiba
    properties: {}
  IncidentResponseTeam:
    meaning: An incident response team is the cross-functional team that coordinates response to significant incidents.
    aliases:
      - IRT
      - incidenskezelő csapat
    properties: {}
  Environment:
    meaning: "An environment is the deployment context in which services or components operate, such as production, test, development, or disaster recovery."
    aliases:
      - környezet
    properties:
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
  InfrastructureComponent:
    meaning: "An infrastructure component is a technical component that provides compute, network, platform, endpoint, or storage capability."
    aliases:
      - infrastruktúra-elem
    properties: {}
  Release:
    meaning: A release is a governed package of approved changes introduced together.
    aliases:
      - kiadás
    properties:
      releaseVersion:
        type: text
      releaseDate:
        type: date
  Regulator:
    meaning: A regulator is the competent authority that supervises the bank or receives required notifications.
    aliases: []
    properties: {}
  Problem:
    meaning: "A problem is the underlying cause, or potential underlying cause, of one or more incidents."
    aliases:
      - probléma
    properties: {}
relationships:
  - name: impactsBusinessService
    from: Incident
    to: BusinessService
    meaning: This links an incident to a business service whose customer or business outcome is affected.
    aliases: []
  - name: deliveredThrough
    from: BusinessService
    to: CustomerChannel
    meaning: This links a business service to the channel through which customers receive or access it.
    aliases: []
  - name: impactsItservice
    from: Incident
    to: ITService
    meaning: "This links an incident to an IT service whose operation is degraded, interrupted, or otherwise affected."
    aliases: []
  - name: runsOn
    from: ITService
    to: InfrastructureComponent
    meaning: This links an IT service to the technical infrastructure component it uses to operate.
    aliases: []
  - name: dependsOnThirdPartyService
    from: ITService
    to: ThirdPartyService
    meaning: This links an IT service to an external service it relies on.
    aliases: []
  - name: triggeredBy
    from: Incident
    to: Alert
    meaning: This links an incident to an alert that initiated or opened the incident response.
    aliases: []
  - name: correlatedFrom
    from: Incident
    to: Event
    meaning: This links an incident to an event that has been correlated into the incident picture.
    aliases: []
  - name: indicates
    from: Alert
    to: Event
    meaning: This links an alert to the underlying event it signals.
    aliases: []
  - name: owns
    from: ServiceOwner
    to: ITService
    meaning: This links the accountable service owner to the IT service they are responsible for.
    aliases: []
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: This links an incident to the team tasked with diagnosing and restoring it.
    aliases: []
  - name: handledBy
    from: Incident
    to: OnCallEngineer
    meaning: This links an incident to the on-call engineer providing the time-critical hands-on response.
    aliases: []
  - name: coordinatedBy
    from: Incident
    to: IncidentCommander
    meaning: This links an incident to the person directing coordination and decision cadence during major-incident handling.
    aliases: []
  - name: memberOf
    from: IncidentCommander
    to: IncidentResponseTeam
    meaning: This links the incident commander to the cross-functional team they operate within.
    aliases: []
  - name: handledWith
    from: Incident
    to: Runbook
    meaning: "This links an incident to the operational procedure used to diagnose, respond to, recover from, or verify it."
    aliases: []
  - name: hasWorkaround
    from: KnownError
    to: Workaround
    meaning: This links a known error to the temporary method that reduces or bypasses its impact.
    aliases: []
  - name: recoveredWith
    from: Incident
    to: RecoveryPlan
    meaning: This links an incident to the recovery plan used to restore the affected service.
    aliases: []
  - name: resolvedBy
    from: Incident
    to: Change
    meaning: This links an incident to the change that restored service or removed the issue.
    aliases: []
  - name: supportedBy
    from: Incident
    to: EvidenceItem
    meaning: "This links an incident to preserved evidence that supports analysis, explanation, or accountability."
    aliases: []
  - name: communicatedThrough
    from: Incident
    to: Communication
    meaning: This links an incident to the controlled messages used to inform relevant audiences about it.
    aliases: []
  - name: evaluatedBy
    from: Incident
    to: MaterialityAssessment
    meaning: This links an incident to the assessment used to determine significance and reporting implications.
    aliases: []
  - name: triggers
    from: MaterialityAssessment
    to: RegulatoryNotification
    meaning: This links a materiality assessment to the regulatory notification that must follow from its outcome.
    aliases: []
  - name: usesBackupSet
    from: RecoveryPlan
    to: BackupSet
    meaning: This links a recovery plan to the backup data it relies on for restoration.
    aliases: []
  - name: protects
    from: BackupSet
    to: ConfigurationItem
    meaning: This links a backup set to the managed component whose recoverable data it protects.
    aliases: []
  - name: memberOf
    from: OnCallEngineer
    to: ResolverGroup
    meaning: This links an on-call engineer to the resolver group they belong to.
    aliases: []
  - name: deployedIn
    from: ITService
    to: Environment
    meaning: This links an IT service to the environment where it is deployed.
    aliases: []
  - name: reports
    from: RegulatoryNotification
    to: Incident
    meaning: This links a regulatory notification to the incident it formally reports.
    aliases: []
  - name: affectsConfigurationItem
    from: Incident
    to: ConfigurationItem
    meaning: This links an incident to a managed component impacted by the issue.
    aliases: []
  - name: implementedBy
    from: Change
    to: Release
    meaning: This links a change to the release that carries it into delivery.
    aliases: []
  - name: deliveredBy
    from: Release
    to: Deployment
    meaning: This links a release to the deployment that technically installs or activates it.
    aliases: []
  - name: dependsOnService
    from: BusinessService
    to: ITService
    meaning: This links a business service to the IT service it relies on for delivery.
    aliases: []
  - name: sentTo
    from: RegulatoryNotification
    to: Regulator
    meaning: This links a regulatory notification to the regulator it is formally submitted to.
    aliases: []
  - name: groupsIncident
    from: Problem
    to: Incident
    meaning: null
    aliases: []
  - name: documentedBy
    from: Problem
    to: KnownError
    meaning: null
    aliases: []
rules:
  canDeclareMajorIncident:
    conditions:
      - incident currentStatus is not resolved
      - incident currentStatus is not closed
      - incident currentStatus is not cancelled
      - incident severity is sev1-critical or sev2-high
      - incident impacts at least one IT service
      - incident is coordinated by an incident commander
  canSubmitRegulatoryNotification:
    conditions:
      - materiality assessment result is reportable
      - regulatory notification reports the incident
      - regulatory notification is sent to a regulator
      - incident is supported by the necessary evidence items
      - regulatory notification notificationStatus is approved
      - regulatory notification submittedAt is not later than dueAt
  canCloseIncident:
    conditions:
      - incident currentStatus is resolved or monitoring
      - impacted IT services currentStatus is healthy or recovering
      - incident is supported by the necessary evidence items
      - incident is communicated through the required communications
      - "if incident isMajorIncident is true, required review activity is scheduled or completed"
      - "if incident isCybersecurityIncident is true, required review activity is scheduled or completed"
  backupSetSafeForRecovery:
    conditions:
      - backup set status is successful or verified
      - backup set protects the configuration item that needs to be restored
  cybersecurityEvidenceSufficient:
    conditions:
      - incident isCybersecurityIncident is true
      - incident is supported by the required evidence items
      - "evidence item integrityStatus is collected, hashed, verified, or sealed"
      - "preserved evidence is complete enough to support analysis, accountability, and reporting"
actions:
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: The alert is marked acknowledged and the acknowledgement time is recorded.
    verification: Read the alert and confirm it is in acknowledged state.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: "The incident is treated as a major incident, with command and communication cadence started and declaration time recorded."
    verification: "Confirm major-incident classification, commander assignment, declaration time, and a communication record."
  assignIncident:
    input: Incident
    preconditions: []
    effect: The incident is assigned to the resolver group.
    verification: Read the incident and confirm the resolver-group assignment.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: The incident is closed and the closure time is recorded.
    verification: "Read the incident and linked service state, and confirm closure plus retained evidence."
  containIncident:
    input: Incident
    preconditions: []
    effect: "Approved containment steps are executed, and the incident moves to contained once containment is verified."
    verification: Confirm the containment indicators and the resulting service impact.
  isolateConfigurationItem:
    input: Incident
    preconditions: []
    effect: The configuration item linked to the incident is isolated from the defined network paths or dependencies.
    verification: Confirm the isolation state and check the remaining service health.
  failOverService:
    input: Incident
    preconditions: []
    effect: The service workload is moved to the recovery environment.
    verification: Confirm service health and critical business transactions in the recovery environment.
  restoreBackup:
    input: BackupSet
    preconditions:
      - backupSetSafeForRecovery
    effect: The backup data is restored to the target.
    verification: Validate data integrity and application functionality after restore.
  executeEmergencyChange:
    input: Change
    preconditions: []
    effect: "The approved emergency change is implemented and change status becomes implemented, failed, or rolled-back as appropriate."
    verification: "Run technical checks, verify service health, and confirm the change status is updated appropriately."
  sendStakeholderCommunication:
    input: Incident
    preconditions: []
    effect: The communication is sent and time-stamped.
    verification: Confirm delivery status and archive the final message.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: The notification is submitted.
    verification: "Confirm accepted submission, or record rejection and follow-up if it is not accepted."
