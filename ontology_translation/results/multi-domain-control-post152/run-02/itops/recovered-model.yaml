          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      messageSummary:
        type: text
  EvidenceItem:
    meaning: "A preserved record or artifact that supports investigation, accountability, or audit."
    aliases:
