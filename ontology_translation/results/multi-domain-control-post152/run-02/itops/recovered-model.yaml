        type: date
      submittedAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  Stakeholder:
    meaning: "A person, group, or organization affected by, responsible for, or needing information about an operational outcome."
    aliases: []
    properties:
      name:
        type: text
      audienceType:
        type: text
        allowed:
