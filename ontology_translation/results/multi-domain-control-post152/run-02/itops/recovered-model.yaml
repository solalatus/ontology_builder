rules:
  qualifiesAsMajorIncident:
    conditions:
      - incident status is not resolved
      - incident status is not closed
      - incident status is not cancelled
      - incident severity is sev1-critical or sev2-high
      - incident impacts at least one IT service
      - major incident is commanded by an incident commander
  requiresRegulatoryNotification:
    conditions:
      - incident is evaluated by a materiality assessment
      - materiality assessment result is reportable
  canCloseIncident:
    conditions:
      - incident status is resolved or monitoring
      - all impacted business services have health state healthy or recovering
      - all impacted IT services have health state healthy or recovering
      - incident is supported by at least one evidence item
  canAssignIncidentToResolverGroup:
    conditions:
      - incident status is not closed
      - incident status is not cancelled
      - "the resolver group supports at least one IT service impacted by the incident, or at least one configuration item affected by the incident"
  canDeclareMajorIncident:
    conditions:
      - incident status is not resolved
      - incident status is not closed
      - incident status is not cancelled
      - incident severity is sev1-critical or sev2-high
      - at least one impacted IT service is identified
      - incident is identified as a major incident
      - major incident is commanded by an incident commander
  canFailOverAffectedService:
    conditions:
      - incident is recovered with a recovery plan
      - that recovery plan recovers at least one IT service impacted by the incident
  canRestoreDataFromBackupSet:
    conditions:
      - backup set status is successful or verified
      - "the backup set protects at least one configuration item affected by the incident, or at least one configuration item used by the recovery plan for the incident"
actions:
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: The alert status becomes acknowledged.
    verification: Read the alert back and confirm its status is acknowledged.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions:
      - canAssignIncidentToResolverGroup
    effect: The incident is assigned to the chosen resolver group.
    verification: Read the incident back and confirm the resolver-group assignment.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: The incident is identified as a major incident.
    verification: Read the incident back and confirm the major-incident identification and incident commander linkage.
  containIncident:
    input: Incident
    preconditions: []
    effect: Containment steps are carried out and the incident status becomes contained once containment is verified.
    verification: Confirm the incident status is contained.
  isolateAffectedConfigurationItem:
    input: Incident
    preconditions: []
    effect: An affected configuration item linked to the incident is isolated as an operational outcome.
    verification: Confirm the incident links to the affected configuration item and that isolation has been recorded as an operational outcome.
  failOverAffectedService:
    input: Incident
    preconditions:
      - canFailOverAffectedService
    effect: "An impacted IT service covered by the incident's recovery plan is moved to the recovery path defined by that plan."
    verification: Confirm that the impacted IT service is now in health state recovering or healthy.
  restoreDataFromBackupSet:
    input: Incident
    preconditions:
      - canRestoreDataFromBackupSet
    effect: "Data is restored from the selected backup set for the incident's recovery context."
    verification: Confirm the incident recovery context shows recovery progress and that the selected backup set remains linked to the protected configuration item.
  sendStakeholderCommunication:
    input: Incident
    preconditions: []
    effect: A communication linked to the incident is sent.
    verification: "Confirm there is a communication linked to the incident, that the communication status is submitted or accepted, and that it is addressed to the intended stakeholder or audience."
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - requiresRegulatoryNotification
    effect: The regulatory notification status becomes submitted and the submission time is recorded.
    verification: Confirm the regulatory notification status is submitted and that it reports the intended incident.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: The incident status becomes closed.
    verification: "Read the incident and linked services back, confirm the closed state, and confirm the incident is supported by at least one evidence item."
