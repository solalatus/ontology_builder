competency_questions:
  - id: cq1
    text: "Which business services are impacted by this incident, and through which customer channels is that impact visible?"
  - id: cq2
    text: "Which IT services, configuration items, and external dependencies sit on the dependency path of the affected service?"
  - id: cq3
    text: "Which alerts and events are actually related to this incident, and which ones are just noise?"
  - id: cq4
    text: Who owns the affected service?
  - id: cq5
    text: Which resolver group should be handling the incident right now?
  - id: cq6
    text: Which on-call engineer should be handling the incident right now?
  - id: cq7
    text: Does this incident meet the criteria to be treated as a major incident?
  - id: cq8
    text: "Is this incident a cybersecurity incident, or a normal operational fault with no security angle?"
  - id: cq9
    text: "Which runbook, workaround, backup set, or recovery plan can be used safely for this case?"
  - id: cq10
    text: "Was the incident likely caused by a recent change, release, or deployment?"
  - id: cq11
    text: Has a materiality assessment been completed?
  - id: cq12
    text: Does the situation require regulatory notification?
  - id: cq13
    text: Which stakeholders need to be informed?
  - id: cq14
    text: What has already been communicated about this incident?
  - id: cq15
    text: What communication is still pending for this incident?
  - id: cq16
    text: "Do we have the evidence needed to support investigation, recovery, auditability, and if relevant preservation requirements?"
  - id: cq17
    text: Are all closure conditions met for this incident?
  - id: cq18
    text: What is still missing before this incident can be closed?
classes:
  Incident:
    meaning: "An unplanned interruption, degradation, or security-related condition that needs managed operational response."
    aliases:
      - ticket
    properties:
      summary:
        type: text
      description:
        type: text
      detectedAt:
        type: date
      openedAt:
        type: date
      resolvedAt:
        type: date
      closedAt:
        type: date
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      impact:
        type: text
        allowed:
          - enterprise-wide
          - multiple-services
          - single-service
          - limited-users
          - no-observed-impact
      urgency:
        type: text
        allowed:
          - immediate
          - high
          - normal
          - low
      category:
        type: text
        allowed:
          - availability
          - performance
          - capacity
          - network
          - application
          - database
          - infrastructure
          - data-integrity
          - cybersecurity
          - third-party
          - change-induced
          - other
      detectionSource:
        type: text
        allowed:
          - monitoring
          - siem
          - service-desk
          - user-report
          - vendor-report
          - automated-control
          - regulator
          - other
      recurring:
        type: boolean
        allowed:
          - "true"
          - "false"
      timeToAcknowledge:
        type: number
      timeToRestore:
        type: number
  BusinessService:
    meaning: A customer-facing or business-facing capability delivered by the bank.
    aliases: []
    properties:
      name:
        type: text
      description:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      availabilityTarget:
        type: text
  CustomerChannel:
    meaning: A channel through which customers access banking services.
    aliases: []
    properties: {}
  ITService:
    meaning: A managed technology service that supports one or more business services.
    aliases:
      - informatics service
    properties:
      name:
        type: text
      description:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      availabilityTarget:
        type: text
  ConfigurationItem:
    meaning: A managed component that sits within configuration-management scope.
    aliases:
      - CI
    properties:
      name:
        type: text
      version:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  ThirdPartyService:
    meaning: An externally provided service that the bank depends on.
    aliases:
      - outsourced service
    properties:
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  Alert:
    meaning: A monitoring or security signal that needs triage or acknowledgement.
    aliases: []
    properties:
      raisedAt:
        type: date
      summary:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      detectionSource:
        type: text
        allowed:
          - monitoring
          - siem
          - service-desk
          - user-report
          - vendor-report
          - automated-control
          - regulator
          - other
      occurrenceCount:
        type: number
  Event:
    meaning: A time-stamped observation of a state change or noteworthy occurrence.
    aliases: []
    properties: {}
  ServiceOwner:
    meaning: The role accountable for an IT service across its lifecycle.
    aliases: []
    properties: {}
  ApplicationOwner:
    meaning: The role accountable for an application and its operational fitness.
    aliases: []
    properties: {}
  ResolverGroup:
    meaning: The team assigned to diagnose and restore a particular technology or service area.
    aliases:
      - support group
    properties: {}
  OnCallEngineer:
    meaning: A technical specialist available for time-critical operational response.
    aliases:
      - on-call
    properties: {}
  IncidentCommander:
    meaning: "The person accountable for command, coordination, and decision cadence during a major incident."
    aliases:
      - incident manager
      - MIM lead
    properties: {}
  Runbook:
    meaning: "A maintained operational procedure for diagnosis, response, recovery, or verification."
    aliases:
      - operational procedure
      - playbook
    properties: {}
  Workaround:
    meaning: A temporary method that reduces or bypasses the impact of an incident or problem.
    aliases: []
    properties: {}
  BackupSet:
    meaning: A defined collection of recoverable backup data for protected components.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      lastSuccessfulBackup:
        type: date
      lastVerification:
        type: date
  RecoveryPlan:
    meaning: A documented plan for restoring an IT service and its dependencies.
    aliases:
      - DR plan
    properties:
      recoveryTimeObjective:
        type: text
      recoveryPointObjective:
        type: text
      lastReviewDate:
        type: date
  Change:
    meaning: "A controlled addition, modification, or removal that may affect an IT service."
    aliases:
      - modification
    properties:
      summary:
        type: text
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      riskLevel:
        type: text
        allowed:
          - low
          - medium
          - high
          - critical
      plannedStart:
        type: date
      plannedEnd:
        type: date
      implementationPlan:
        type: text
      backoutPlan:
        type: text
  Release:
    meaning: A governed package of approved changes introduced together.
    aliases: []
    properties:
      version:
        type: text
      releaseDate:
        type: date
  Deployment:
    meaning: The technical execution that installs or activates a release or change.
    aliases:
