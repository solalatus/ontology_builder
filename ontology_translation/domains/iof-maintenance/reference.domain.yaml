competency_questions:
- id: cq1
  text: What maintenance state does a maintainable item currently have?
- id: cq2
  text: Which items are currently in an operating state, degraded state, or failed
    state?
- id: cq3
  text: Which failure event initiated a given failed state?
- id: cq4
  text: Which failed states were caused by a given failure event?
- id: cq5
  text: Which maintenance process is described by a maintenance work order record?
- id: cq6
  text: Which maintenance strategy governs a given maintenance process?
- id: cq7
  text: Which maintenance activities are part of a maintenance process?
- id: cq8
  text: Which qualification specification applies to a maintenance activity?
- id: cq9
  text: Which qualified maintenance person can perform a specified maintenance activity?
- id: cq10
  text: Which required function is associated with a failure event or functioning
    process?
- id: cq11
  text: Which failure mode code describes a given undesirable disposition?
- id: cq12
  text: Which failure effects are consequences of a failure event?
classes:
  MaintenanceState:
    meaning: A state during which the functions and capabilities of an item, or the
      grade of their realization, remain unchanged.
    properties:
      stateCategory:
        type: text
        allowed:
        - operating
        - degraded
        - failed
  OperatingState:
    meaning: A state in which an item is able to perform a required function.
  DegradedState:
    meaning: A state of reduced ability to perform as required but with acceptable
      reduced performance.
  FailedState:
    meaning: A state in which an item is unable to perform a required function due
      to a failure event.
  FailureEvent:
    meaning: An event that causes an item to lose its ability to perform a required
      function.
    aliases:
    - failure
  FailureProcess:
    meaning: A process that changes some quality of an item, causing the item to become
      degraded or failed.
    aliases:
    - functional failure
  FailureEffect:
    meaning: A process that is the consequence of failure, within or beyond the boundary
      of the failed item.
  UndesirableDisposition:
    meaning: A disposition of an item to undergo a process that leads to undesirable
      outcomes.
    aliases:
    - failure mode
  DispositionToFail:
    meaning: A disposition of an item to undergo a failure process.
  DispositionToExhibitUndesirableBehavior:
    meaning: A disposition of an item that would not be expected under normal operating
      conditions.
  FailureModeCode:
    meaning: An information content entity that describes an undesirable disposition.
  RequiredFunction:
    meaning: A function of a maintainable material item that is considered necessary
      to fulfill a process requirement.
    aliases:
    - primary function
  FunctioningProcess:
    meaning: A process in which an item performs its function.
  MaintenanceStrategy:
    meaning: A maintenance approach or method intended to enable an asset to achieve
      desired objectives.
  MaintenanceProcess:
    meaning: A process concerned with retaining or restoring the function of a maintainable
      material item under a maintenance strategy.
  MaintenanceActivity:
    meaning: A maintenance process that is a single task to retain or restore the
      function of a maintainable material item.
  SupportingMaintenanceActivity:
    meaning: A single action in support of the execution of a maintenance process.
  MaintenanceWorkOrderRecord:
    meaning: An information content entity that describes a maintenance process.
    aliases:
    - maintenance work order
    - MWO
    properties:
      workOrderDate:
        type: date
      taskDescription:
        type: text
      taskCode:
        type: text
      cost:
        type: number
  QualificationSpecification:
    meaning: A requirement specification that identifies the need for a person to
      have an assessed skill for a specific task.
  QualifiedMaintenancePerson:
    meaning: A person who is qualified to perform a specified maintenance activity.
relationships:
- name: initiates
  from: FailureEvent
  to: FailedState
  meaning: A failure event begins a failed state.
  aliases: []
- name: describes
  from: MaintenanceWorkOrderRecord
  to: MaintenanceProcess
  meaning: The maintenance work order record describes the maintenance process.
  aliases: []
- name: governedByStrategy
  from: MaintenanceProcess
  to: MaintenanceStrategy
  meaning: The maintenance process is carried out under the maintenance strategy.
  aliases:
  - prescribedBy
- name: hasActivity
  from: MaintenanceProcess
  to: MaintenanceActivity
  meaning: The maintenance process includes a maintenance activity as one of its tasks.
  aliases: []
- name: hasSupportingActivity
  from: MaintenanceProcess
  to: SupportingMaintenanceActivity
  meaning: The maintenance process includes a supporting maintenance activity in its
    execution.
  aliases: []
- name: requiresQualification
  from: MaintenanceActivity
  to: QualificationSpecification
  meaning: The maintenance activity requires the qualification specification to be
    satisfied.
  aliases:
  - prescribedBy
- name: qualifiedFor
  from: QualifiedMaintenancePerson
  to: MaintenanceActivity
  meaning: The person is qualified to perform the maintenance activity.
  aliases: []
- name: describes
  from: FailureModeCode
  to: UndesirableDisposition
  meaning: The failure mode code describes the undesirable disposition.
  aliases: []
- name: realizes
  from: FailureProcess
  to: DispositionToFail
  meaning: The failure process realizes the disposition to fail.
  aliases: []
- name: realizes
  from: FunctioningProcess
  to: RequiredFunction
  meaning: The functioning process realizes the required function.
  aliases: []
- name: resultsIn
  from: FailureProcess
  to: DegradedState
  meaning: The failure process can result in a degraded state.
  aliases: []
- name: resultsIn
  from: FailureProcess
  to: FailedState
  meaning: The failure process can result in a failed state.
  aliases: []
- name: hasEffect
  from: FailureEvent
  to: FailureEffect
  meaning: The failure event has a failure effect as a consequence.
  aliases: []
rules:
  canClassifyOperatingState:
    conditions:
    - the item can perform its required function
  canClassifyDegradedState:
    conditions:
    - the item performs with reduced ability
    - the reduced performance remains acceptable
  canClassifyFailedState:
    conditions:
    - a failure event has occurred
    - the item cannot perform its required function
  canIssueMaintenanceWorkOrder:
    conditions:
    - a maintenance process is needed to retain or restore function
  canAssignQualifiedPerson:
    conditions:
    - the maintenance activity requires a qualification specification
    - the person satisfies the required qualification
  canStartMaintenanceProcess:
    conditions:
    - a maintenance strategy is defined for the maintenance process
    - a maintenance work order record describes the maintenance process
  canCloseMaintenanceWorkOrder:
    conditions:
    - the maintenance activities in the maintenance process are completed
    - the maintenance work order record has been updated with the performed task information
actions:
  classifyItemAsFailed:
    input: FailureEvent
    preconditions:
    - canClassifyFailedState
    effect: a failed state is recorded for the affected item
    verification: confirm that the item is now tracked in a failed state
  createMaintenanceWorkOrder:
    input: MaintenanceProcess
    preconditions:
    - canIssueMaintenanceWorkOrder
    effect: a maintenance work order record is created for the maintenance process
    verification: confirm that a maintenance work order record describes the maintenance
      process
  assignQualifiedMaintenancePerson:
    input: MaintenanceActivity
    preconditions:
    - canAssignQualifiedPerson
    effect: a qualified maintenance person is assigned to the maintenance activity
    verification: confirm that the assigned person is qualified for the maintenance
      activity
  startMaintenanceProcess:
    input: MaintenanceProcess
    preconditions:
    - canStartMaintenanceProcess
    effect: the maintenance process begins under its maintenance strategy
    verification: confirm that the maintenance process has an active work order and
      assigned activities
  closeMaintenanceWorkOrder:
    input: MaintenanceWorkOrderRecord
    preconditions:
    - canCloseMaintenanceWorkOrder
    effect: the maintenance work order record is updated to reflect completion of
      the maintenance process
    verification: confirm that the work order record contains the completed task information
      and final cost
