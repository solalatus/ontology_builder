classes:
  Bank:
    meaning: The regulated financial institution whose IT services and incidents are managed.
    aliases:
      - hitelintézet
  OrganizationalUnit:
    meaning: A governed unit of the bank with defined responsibilities.
    aliases:
      - szervezeti egység
    properties:
      name:
        type: text
  ItOperationsTeam:
    meaning: The team responsible for reliable day-to-day operation of IT services.
    aliases:
      - IT üzemeltetés
      - üzemeltetési csapat
  ServiceDesk:
    meaning: The first-line function that receives, records, triages, and routes user-reported issues.
    aliases:
      - help desk
      - ügyfélszolgálati IT pult
      - hibabejelentő
  NetworkOperationsCentre:
    meaning: The function that monitors and operates network and infrastructure services.
    aliases:
      - NOC
      - hálózatüzemeltetési központ
  SecurityOperationsCentre:
    meaning: The function that monitors, investigates, and coordinates response to cyber threats.
    aliases:
      - SOC
      - biztonsági műveleti központ
  IncidentResponseTeam:
    meaning: The cross-functional team responsible for coordinating significant incident response.
    aliases:
      - IRT
      - incidenskezelő csapat
  ResolverGroup:
    meaning: A team assigned to diagnose and restore a specific technology or service area.
    aliases:
      - megoldócsoport
      - support group
  OnCallEngineer:
    meaning: A technical specialist available for time-critical operational response.
    aliases:
      - ügyeletes mérnök
      - on-call
  IncidentCommander:
    meaning: >-
      The person accountable for command, coordination, and decision cadence during a major
      incident.
    aliases:
      - incident manager
      - incidensparancsnok
      - MIM lead
  ServiceOwner:
    meaning: The role accountable for an IT service across its lifecycle.
    aliases:
      - szolgáltatásgazda
  ApplicationOwner:
    meaning: The role accountable for an application and its operational fitness.
    aliases:
      - alkalmazásgazda
  TechnicalOwner:
    meaning: The role accountable for the engineering and maintenance of a configuration item.
    aliases:
      - technikai gazda
  BusinessOwner:
    meaning: The business role accountable for a business service or process.
    aliases:
      - üzleti gazda
  Vendor:
    meaning: An external organization supplying or supporting technology or services.
    aliases:
      - supplier
      - szállító
      - beszállító
    properties:
      legalName:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      criticalProvider:
        type: boolean
  Regulator:
    meaning: A competent authority that supervises the bank or receives required notifications.
    aliases:
      - supervisory authority
      - felügyeleti hatóság
    properties:
      name:
        type: text
  Stakeholder:
    meaning: A person, group, or organization affected by or responsible for an operational outcome.
    aliases:
      - érintett
    properties:
      name:
        type: text
      audienceType:
        type: text
        allowed:
          - technical
          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
  BusinessService:
    meaning: A customer- or business-facing capability delivered by the bank.
    aliases:
      - üzleti szolgáltatás
    properties:
      name:
        type: text
      description:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      availabilityTarget:
        type: number
  BusinessProcess:
    meaning: A coordinated set of activities producing a business outcome.
    aliases:
      - üzleti folyamat
  CustomerChannel:
    meaning: A channel through which customers access banking services.
    aliases:
      - ügyfélcsatorna
  ItService:
    meaning: A managed technology capability supporting one or more business services.
    aliases:
      - informatics service
      - informatikai szolgáltatás
    properties:
      name:
        type: text
      description:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      availabilityTarget:
        type: number
  ServiceLevelObjective:
    meaning: A measurable target for availability, response, or restoration of an IT service.
    aliases:
      - SLO
      - szolgáltatási célszint
    properties:
      availabilityTarget:
        type: number
      acknowledgementTarget:
        type: number
      restorationTarget:
        type: number
  ConfigurationItem:
    meaning: A managed component recorded in the configuration-management scope.
    aliases:
      - CI
      - konfigurációs elem
    properties:
      name:
        type: text
      version:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  Application:
    meaning: A software system that implements business or operational functionality.
    aliases:
      - alkalmazás
      - app
    properties:
      externallyAccessible:
        type: boolean
      releaseVersion:
        type: text
  Database:
    meaning: A managed persistent data store used by an application or service.
    aliases:
      - adatbázis
      - DB
    properties:
      engineType:
        type: text
      engineVersion:
        type: text
  InfrastructureComponent:
    meaning: A technical component providing compute, network, platform, endpoint, or storage capability.
    aliases:
      - infrastruktúra-elem
  Server:
    meaning: A physical compute host providing processing capacity.
    aliases:
      - kiszolgáló
  VirtualMachine:
    meaning: A virtualized compute instance hosted on infrastructure.
    aliases:
      - VM
      - virtuális gép
  ContainerPlatform:
    meaning: A managed platform used to run containerized workloads.
    aliases:
      - Kubernetes platform
      - konténerplatform
  CloudService:
    meaning: A technology capability consumed from an external or group cloud provider.
    aliases:
      - felhőszolgáltatás
  NetworkDevice:
    meaning: A managed device that routes, switches, filters, or terminates network traffic.
    aliases:
      - hálózati eszköz
  NetworkSegment:
    meaning: A logically or physically bounded portion of the bank network.
    aliases:
      - hálózati szegmens
      - VLAN
  Endpoint:
    meaning: A managed user or administrative computing endpoint.
    aliases:
      - végpont
      - munkaállomás
  StorageSystem:
    meaning: A managed system providing persistent block, file, or object storage.
    aliases:
      - tárolórendszer
  BackupSet:
    meaning: A defined collection of recoverable backup data for protected components.
    aliases:
      - mentéskészlet
      - backup
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      lastSuccessfulBackup:
        type: date
      lastVerification:
        type: date
  DataCentre:
    meaning: A facility hosting managed technology infrastructure.
    aliases:
      - DC
      - adatközpont
  Site:
    meaning: A physical bank, supplier, or hosting location.
    aliases:
      - telephely
      - location
    properties:
      locationName:
        type: text
  Environment:
    meaning: A deployment context such as production, test, development, or disaster recovery.
    aliases:
      - környezet
    properties:
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
  DataAsset:
    meaning: A governed collection of information processed or stored by services.
    aliases:
      - adatvagyon-elem
    properties:
      name:
        type: text
      dataClassification:
        type: text
        allowed:
          - public
          - internal
          - confidential
          - restricted
  IntegrationInterface:
    meaning: A defined technical interface through which systems exchange data or commands.
    aliases:
      - interface
      - API
      - integrációs interfész
    properties:
      protocol:
        type: text
  ThirdPartyService:
    meaning: An externally provided service on which the bank depends.
    aliases:
      - outsourced service
      - külső szolgáltatás
    properties:
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  MonitoringTool:
    meaning: A platform that collects telemetry and evaluates operational conditions.
    aliases:
      - monitoring platform
      - felügyeleti eszköz
  MonitoringRule:
    meaning: A deterministic condition that evaluates telemetry and may generate an alert.
    aliases:
      - alert rule
      - riasztási szabály
    properties:
      name:
        type: text
      defaultSeverity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
  Metric:
    meaning: A time-stamped quantitative observation about a component or service.
    aliases:
      - mérőszám
    properties:
      metricName:
        type: text
      numericValue:
        type: number
      unit:
        type: text
      measuredAt:
        type: date
  LogSource:
    meaning: A system or component that emits operational or security records.
    aliases:
      - naplóforrás
    properties:
      sourceType:
        type: text
  Event:
    meaning: A time-stamped observation representing a state change or noteworthy occurrence.
    aliases:
      - esemény
    properties:
      observedAt:
        type: date
      eventType:
        type: text
      detectionSource:
        type: text
        allowed:
          - monitoring
          - siem
          - service-desk
          - user-report
          - vendor-report
          - automated-control
          - regulator
          - other
  SecurityEvent:
    meaning: >-
      An event relevant to confidentiality, integrity, availability, authenticity, or cyber threat
      activity.
    aliases:
      - biztonsági esemény
  Alert:
    meaning: A monitoring or security signal requiring triage or acknowledgement.
    aliases:
      - riasztás
    properties:
      raisedAt:
        type: date
      summary:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      detectionSource:
        type: text
        allowed:
          - monitoring
          - siem
          - service-desk
          - user-report
          - vendor-report
          - automated-control
          - regulator
          - other
      occurrenceCount:
        type: number
  Incident:
    meaning: An unplanned interruption, degradation, or security condition requiring managed response.
    aliases:
      - incidens
      - hibajegy
    properties:
      summary:
        type: text
      description:
        type: text
      detectedAt:
        type: date
      openedAt:
        type: date
      resolvedAt:
        type: date
      closedAt:
        type: date
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      impact:
        type: text
        allowed:
          - enterprise-wide
          - multiple-services
          - single-service
          - limited-users
          - no-observed-impact
      urgency:
        type: text
        allowed:
          - immediate
          - high
          - normal
          - low
      category:
        type: text
        allowed:
          - availability
          - performance
          - capacity
          - network
          - application
          - database
          - infrastructure
          - data-integrity
          - cybersecurity
          - third-party
          - change-induced
          - other
      detectionSource:
        type: text
        allowed:
          - monitoring
          - siem
          - service-desk
          - user-report
          - vendor-report
          - automated-control
          - regulator
          - other
      recurring:
        type: boolean
      timeToAcknowledge:
        type: number
      timeToRestore:
        type: number
  MajorIncident:
    meaning: An incident requiring exceptional coordination because of high business or regulatory impact.
    aliases:
      - MI
      - kiemelt incidens
      - súlyos incidens
    properties:
      declaredAt:
        type: date
  CybersecurityIncident:
    meaning: An incident caused by or involving malicious, unauthorized, or security-relevant activity.
    aliases:
      - cyber incident
      - kiberbiztonsági incidens
  Problem:
    meaning: The underlying cause or potential cause of one or more incidents.
    aliases:
      - probléma
    properties:
      summary:
        type: text
      status:
        type: text
        allowed:
          - new
          - investigating
          - root-cause-known
          - known-error
          - resolved
          - closed
      rootCauseCategory:
        type: text
        allowed:
          - software-defect
          - configuration-error
          - capacity-shortage
          - hardware-failure
          - network-failure
          - human-error
          - process-failure
          - third-party-failure
          - cyber-attack
          - unknown
  KnownError:
    meaning: A diagnosed problem with a documented cause or workaround.
    aliases:
      - ismert hiba
    properties:
      diagnosedCause:
        type: text
      workaroundSummary:
        type: text
  Change:
    meaning: A controlled addition, modification, or removal that may affect an IT service.
    aliases:
      - változás
      - módosítás
    properties:
      summary:
        type: text
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      riskLevel:
        type: text
        allowed:
          - low
          - medium
          - high
          - critical
      plannedStart:
        type: date
      plannedEnd:
        type: date
      implementationPlan:
        type: text
      backoutPlan:
        type: text
  EmergencyChange:
    meaning: A change processed under an accelerated path to address an urgent operational need.
    aliases:
      - sürgősségi változás
      - emergency fix
  Release:
    meaning: A governed package of approved changes introduced together.
    aliases:
      - kiadás
    properties:
      version:
        type: text
      releaseDate:
        type: date
  Deployment:
    meaning: The technical execution that installs or activates a release or change.
    aliases:
      - telepítés
      - élesítés
    properties:
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
      startedAt:
        type: date
      completedAt:
        type: date
  Workaround:
    meaning: A temporary method that reduces or bypasses the impact of an incident or problem.
    aliases:
      - kerülőmegoldás
  Runbook:
    meaning: A maintained operational procedure for diagnosis, response, recovery, or verification.
    aliases:
      - üzemeltetési eljárás
      - playbook
  RecoveryPlan:
    meaning: A documented plan for restoring an IT service and its dependencies.
    aliases:
      - helyreállítási terv
      - DR plan
    properties:
      recoveryTimeObjective:
        type: number
      recoveryPointObjective:
        type: number
      lastReviewDate:
        type: date
  BusinessContinuityPlan:
    meaning: A plan for maintaining or resuming critical business services during disruption.
    aliases:
      - BCP
      - üzletmenet-folytonossági terv
  DisasterRecoveryTest:
    meaning: A controlled exercise that validates recovery procedures, timings, and dependencies.
    aliases:
      - DR test
      - katasztrófa-helyreállítási teszt
    properties:
      executedOn:
        type: date
      testResult:
        type: text
        allowed:
          - passed
          - passed-with-observations
          - failed
          - not-completed
      actualRecoveryTime:
        type: number
  EvidenceItem:
    meaning: A preserved record, artifact, or observation supporting incident analysis and accountability.
    aliases:
      - evidence
      - bizonyíték
    properties:
      collectedAt:
        type: date
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      cryptographicHash:
        type: text
  Communication:
    meaning: A controlled message sent to operational, business, customer, vendor, or regulatory audiences.
    aliases:
      - értesítés
      - tájékoztatás
    properties:
      sentAt:
        type: date
      audience:
        type: text
        allowed:
          - technical
          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      messageSummary:
        type: text
  MaterialityAssessment:
    meaning: A documented determination of incident significance and reporting implications.
    aliases:
      - reportability assessment
      - lényegességi értékelés
    properties:
      assessedAt:
        type: date
      result:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      rationale:
        type: text
      reportingDueTime:
        type: date
  RegulatoryNotification:
    meaning: A formal incident-related submission to a competent authority.
    aliases:
      - supervisory notification
      - felügyeleti bejelentés
    properties:
      dueAt:
        type: date
      submittedAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  PostIncidentReview:
    meaning: A structured review of causes, response effectiveness, lessons, and follow-up work.
    aliases:
      - PIR
      - RCA review
      - incidens utóelemzés
    properties:
      heldOn:
        type: date
      findings:
        type: text
  CorrectiveAction:
    meaning: A tracked action intended to remove a cause, reduce risk, or improve response capability.
    aliases:
      - remediation action
      - helyesbítő intézkedés
    properties:
      actionDescription:
        type: text
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueDate:
        type: date
relationships:
