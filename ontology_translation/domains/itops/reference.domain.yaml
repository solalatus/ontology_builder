rules:
  acknowledgeAlertPreconditions:
    conditions:
      - alert.status == new
      - operator is authorized for the responsible resolver group
  declareMajorIncidentPreconditions:
    conditions:
      - incident.status not in [resolved, closed, cancelled]
      - incident.severity in [sev1-critical, sev2-high]
      - at least one impacted IT service is identified
      - commander is assigned
  assignIncidentPreconditions:
    conditions:
      - incident.status not in [closed, cancelled]
      - resolver group supports an affected service or configuration item
  containIncidentPreconditions:
    conditions:
      - incident.status in [acknowledged, investigating]
      - containment scope and expected side effects are recorded
  isolateConfigurationItemPreconditions:
    conditions:
      - configuration item is linked to the incident
      - isolation impact is assessed
      - rollback or reconnection method is available
  failOverServicePreconditions:
    conditions:
      - recovery plan applies to the service
      - target recovery environment is available
      - data-recovery point is acceptable
  restoreBackupPreconditions:
    conditions:
      - backup status in [successful, verified]
      - backup protects the target
      - restore point and target environment are approved
  executeEmergencyChangePreconditions:
    conditions:
      - change is linked to an active incident
      - implementation and backout plans are present
      - affected configuration items are identified
      - risk is explicitly accepted
  sendStakeholderCommunicationPreconditions:
    conditions:
      - audience, message, owner, and approval state are recorded
      - message content matches the latest verified incident state
  submitRegulatoryNotificationPreconditions:
    conditions:
      - assessment.result == reportable
      - notification is linked to the incident and regulator
      - required fields and supporting evidence are complete
      - notification.status == approved
      - submission occurs before notification.dueAt
  closeIncidentPreconditions:
    conditions:
      - incident.status in [resolved, monitoring]
      - impacted services have health state healthy or an accepted residual condition
      - resolution and restoration evidence are recorded
      - required stakeholder communications are complete
      - major and cybersecurity incidents have a scheduled or completed post-incident review
actions:
  acknowledgeAlert:
    input: Alert
    preconditions:
      - acknowledgeAlertPreconditions
    effect: alert.status := acknowledged; acknowledgement timestamp is recorded
    verification: read alert and confirm status == acknowledged
  declareMajorIncident:
    input: Incident
    preconditions:
      - declareMajorIncidentPreconditions
    effect: >-
      incident is classified as Major Incident; major-incident coordination and communication
      cadence start
    verification: >-
      read incident and confirm major-incident flag, commander, declaration time, and communication
      record
  assignIncident:
    input: Incident
    preconditions:
      - assignIncidentPreconditions
    effect: incident is assigned to resolver group
    verification: read incident and confirm resolver group assignment
  containIncident:
    input: Incident
    preconditions:
      - containIncidentPreconditions
    effect: >-
      approved containment steps are executed; incident.status := contained when containment is
      verified
    verification: verify containment indicators and service impact
  isolateConfigurationItem:
    input: Incident
    preconditions:
      - isolateConfigurationItemPreconditions
    effect: configuration item is isolated from defined networks or dependencies
    verification: confirm isolation and check remaining service health
  failOverService:
    input: Incident
    preconditions:
      - failOverServicePreconditions
    effect: service workload is moved to the recovery environment
    verification: confirm service health and critical business transactions in the recovery environment
  restoreBackup:
    input: BackupSet
    preconditions:
      - restoreBackupPreconditions
    effect: backup data is restored to the target
    verification: validate data integrity and application functionality after restore
  executeEmergencyChange:
    input: EmergencyChange
    preconditions:
      - executeEmergencyChangePreconditions
    effect: approved emergency change is implemented and status is updated
    verification: run technical checks, verify service health, and record implementation evidence
  sendStakeholderCommunication:
    input: Incident
    preconditions:
      - sendStakeholderCommunicationPreconditions
    effect: communication is sent and timestamped
    verification: confirm delivery status and archive the final message
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - submitRegulatoryNotificationPreconditions
    effect: notification.status := submitted; submission receipt is stored
    verification: confirm accepted submission or record rejection and remediation
  closeIncident:
    input: Incident
    preconditions:
      - closeIncidentPreconditions
    effect: incident.status := closed; closure timestamp is recorded
    verification: read incident and linked services; confirm closure state and retained evidence
competency_questions:
  - id: cq1
    text: Which business services and customer channels are impacted by this incident?
  - id: cq2
    text: >-
      Which configuration items and third-party services are on the dependency path of the affected
      IT service?
  - id: cq3
    text: Which active alerts and events are correlated with the incident?
  - id: cq4
    text: >-
      Who owns the affected service and which resolver group and on-call engineer should be
      assigned?
  - id: cq5
    text: Does the incident meet the bank-defined criteria for major-incident declaration?
  - id: cq6
    text: Which runbook, workaround, backup set, and recovery plan can be used safely?
  - id: cq7
    text: Was the incident caused by a recent change or deployment?
  - id: cq8
    text: Is a materiality assessment complete and is a regulatory notification required and due?
  - id: cq9
    text: Are evidence integrity, stakeholder communications, and closure conditions complete?
  - id: cq10
    text: >-
      Which corrective actions from prior post-incident reviews remain open for the affected
      service?
