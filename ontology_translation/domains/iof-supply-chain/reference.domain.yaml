rules:
  canPrepareShipment:
    conditions:
    - shipment has a ship-from location
    - shipment has a ship-to location
    - a carrier is identified for the shipment or freight forwarding service is arranged
    - shipment preparation process is identified for the shipment
  canReceiveShipment:
    conditions:
    - receiving process occurs at a facility
    - ship-to location is identified for the shipment
    - shipment is associated with a transport process reaching the destination node
  canRecordTrackingEvent:
    conditions:
    - a shipment, lot, logistic unit, or load is identified
    - an event time is available
    - an event type is known
  canMaintainTraceability:
    conditions:
    - tracking events are recorded for relevant shipment movements
    - traceable resource units are associated with lots, loads, or logistic units
  canEvaluateSupplyRelationship:
    conditions:
    - the supplier is identified
    - the customer is identified
    - the material trade item is identified
actions:
  prepareShipment:
    input: Shipment
    preconditions:
    - canPrepareShipment
    effect: shipment is documented with ship-from and ship-to locations and associated
      with a shipment preparation process and transport arrangement
    verification: confirm the shipment has assigned shipping locations and an identified
      preparation and carrier or freight-forwarding arrangement
  dispatchShipment:
    input: Shipment
    preconditions: []
    effect: shipment is dispatched for movement.
    verification: confirm the shipment to be dispatched is identified.
  receiveShipment:
    input: Shipment
    preconditions:
    - canReceiveShipment
    effect: shipment is recorded as having arrived at the destination facility through
      a receiving process
    verification: confirm receipt of the shipment at the destination facility and
      completion of the receiving process
  recordTrackingEvent:
    input: TrackingEvent
    preconditions:
    - canRecordTrackingEvent
    effect: a new tracking event is linked to the relevant traceable unit
    verification: confirm the event time, event type, and tracked unit were recorded
  evaluateSupplyRelationship:
    input: SupplyRelationship
    preconditions:
    - canEvaluateSupplyRelationship
    effect: the supply relationship is reviewed against supplier, customer, and product
      dependencies
    verification: confirm all dependency links are present
