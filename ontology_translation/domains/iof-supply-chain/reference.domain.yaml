competency_questions:
- id: cq1
  text: Which supplier supplies to a given customer in this supply-chain model?
- id: cq2
  text: Which shipment is being prepared for a given ship-from and ship-to location?
- id: cq3
  text: Which carrier is responsible for a given transport or shipment preparation
    process?
- id: cq4
  text: Which lot, sublot, logistic unit, or load is the relevant traceable resource
    unit for a shipment?
- id: cq5
  text: At which supply chain node does a transport process start and where does it
    end?
- id: cq6
  text: Which facility or storage facility is the site of a receiving, storage, or
    shipment preparation process?
- id: cq7
  text: Which freight forwarder participates in a freight forwarding service or process?
- id: cq8
  text: Which material trade item is associated with a purchase order or shipment?
- id: cq9
  text: Which container or freight container is used to hold cargo for a shipment?
- id: cq10
  text: Which supply relationship depends on a given supplier, customer, and product?
- id: cq11
  text: Which tracking events should be recorded to preserve traceability for a shipment
    or lot?
- id: cq12
  text: Which logistics, transportation, packaging, or storage service applies to
    the current supply-chain activity?
classes:
  Supplier:
    meaning: A trading partner that supplies goods or services in a supply chain.
    properties: {}
  Customer:
    meaning: A trading partner that receives supplied goods or services in a supply
      chain.
    properties: {}
  Carrier:
    meaning: A supplier that carries or transports shipments.
    properties: {}
  FreightForwarder:
    meaning: An agent that arranges freight forwarding activities and services.
    properties:
      status:
        type: text
  Consignee:
    meaning: The agent designated to receive a shipment.
  Shipper:
    meaning: The consignor that sends or consigns a shipment.
    aliases:
    - consignor
  Distributor:
    meaning: An agent that distributes goods within the supply chain.
  Retailer:
    meaning: An agent that sells goods to end customers.
  Wholesaler:
    meaning: An agent that sells goods in wholesale channels.
  SupplyRelationship:
    meaning: A supply dependency connecting supplier, customer, and product context.
  MaterialTradeItem:
    meaning: A material item represented as a tradable item in supply-chain operations.
    properties: {}
  PurchaseOrder:
    meaning: An agreement that requests or authorizes supply of goods or services.
    aliases:
    - order
    properties: {}
  Shipment:
    meaning: A traceable unit of goods being prepared, moved, or received through
      the supply chain.
    properties: {}
  Cargo:
    meaning: Goods carried as load in transport and logistics operations.
  Container:
    meaning: A material artifact used to hold or transport goods.
  FreightContainer:
    meaning: A container specifically used for freight transport.
  Trailer:
    meaning: A transport container or hauling unit used in logistics.
  Wagon:
    meaning: A rail transport container or hauling unit used in logistics.
  LogisticUnit:
    meaning: A traceable logistics handling unit used in storage and transport.
  Load:
    meaning: A traceable load unit prepared for handling or transport.
  Lot:
    meaning: A traceable production or supply lot used for batch-level control.
  Sublot:
    meaning: A traceable subdivision of a lot.
  TraceableResourceUnit:
    meaning: A material unit that can be traced through supply-chain activities.
  TrackingEvent:
    meaning: An event recorded to track movement, handling, or state changes of traceable
      units.
    properties:
      eventTime:
        type: date
      eventType:
        type: text
  Traceability:
    meaning: A system capability to trace supply-chain resources and events across
      processes.
  Facility:
    meaning: A physical facility used in supply-chain operations.
  StorageFacility:
    meaning: A facility used to store goods or traceable units.
  DistributionCenter:
    meaning: A storage facility used to distribute goods through the supply chain.
  Factory:
    meaning: A facility where goods are manufactured for the supply chain.
  GeospatialLocation:
    meaning: A geospatially identified location relevant to supply-chain operations.
  ShipFromLocation:
    meaning: A location from which a shipment is sent.
  ShipToLocation:
    meaning: A location to which a shipment is sent.
  SupplyChainNode:
    meaning: A node in the supply chain used as an origin, destination, or operating
      point.
  ShippingRoute:
    meaning: A route used for moving shipments through the supply chain.
  TransportProcess:
    meaning: A material location change process that transports goods.
  SupplyChainTransportProcess:
    meaning: A transport process carried out as part of supply-chain operations.
  ShipmentPreparationProcess:
    meaning: A process that prepares a shipment for dispatch.
  ReceivingProcess:
    meaning: A business process that receives incoming goods or shipments.
  StorageProcess:
    meaning: A planned process that stores goods or traceable units.
  WarehousingProcess:
    meaning: A process that manages warehousing activities.
  PackagingProcess:
    meaning: A process that packages goods for handling or shipment.
  ConsigningProcess:
    meaning: A business process in which goods are consigned for shipment.
  FreightForwardingProcess:
    meaning: A process that arranges freight forwarding activities.
  InventoryManagementProcess:
    meaning: A business process that manages inventory.
  SupplyChainProcess:
    meaning: A business process carried out within the supply chain.
  LogisticsProcess:
    meaning: A process that coordinates logistics activities.
  LogisticsService:
    meaning: A commercial logistics service used in supply-chain operations.
  TransportationService:
    meaning: A service that provides transportation capability for supply-chain movement.
  StorageService:
    meaning: A service that provides storage capability for goods.
  PackagingService:
    meaning: A service that provides packaging capability for goods.
  FreightForwardingService:
    meaning: A service that provides freight forwarding capability.
  ManufacturingService:
    meaning: A service that provides manufacturing capability in a supply chain.
  BillOfLading:
    meaning: A commercial service agreement documenting shipment carriage details.
