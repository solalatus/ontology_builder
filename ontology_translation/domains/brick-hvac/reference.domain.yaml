competency_questions:
- id: cq1
  text: Which air handling unit serves a given terminal unit or air plenum?
- id: cq2
  text: Which temperature sensors and setpoints are associated with a specific AHU?
- id: cq3
  text: Which HVAC equipment is physically located in a given building, floor, or
    space?
- id: cq4
  text: Which spaces are contained within a given floor, and which floors are contained
    within a building?
- id: cq5
  text: Which CO2 sensors monitor outside air versus return air for an air handling
    system?
- id: cq6
  text: What upstream equipment feeds a given terminal unit or downstream air plenum?
- id: cq7
  text: Which setpoint should be checked when a measured air temperature is not at
    the desired value?
- id: cq8
  text: Which occupancy sensor is associated with a space or zone used for HVAC control?
- id: cq9
  text: Which valves, dampers, fans, and filters are part of a given AHU?
- id: cq10
  text: Which zones or spaces are served by a thermostat or terminal unit in the building?
- id: cq11
  text: Which cooling or heating devices are connected to a given chiller, boiler,
    or heat pump path?
- id: cq12
  text: When can an economizer be used instead of mechanical cooling for an air handling
    process?
classes:
  AirHandlingUnit:
    meaning: An assembly containing fans and other HVAC components that circulates,
      filters, heats, cools, recovers heat, humidifies, dehumidifies, or mixes air,
      usually as part of an air-distribution system.
    aliases:
    - AHU
    - Air Handler Unit
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
  AirPlenum:
    meaning: An HVAC component that receives air from an air handling unit or room
      for distribution or exhaust.
    properties:
      airflowState:
        type: text
        allowed:
        - supply
        - return
        - exhaust
  TemperatureSensor:
    meaning: A sensor that measures temperature.
    properties:
      value:
        type: number
        unit: degC
      status:
        type: text
  AirTemperatureSensor:
    meaning: A sensor that measures the temperature of air.
    properties:
      value:
        type: number
        unit: degC
  CO2Sensor:
    meaning: A sensor that measures properties or concentration of CO2 in air.
    properties:
      value:
        type: number
        unit: ppm
  OutsideAirCO2Sensor:
    meaning: A sensor that measures the concentration of CO2 in outside air.
    properties:
      value:
        type: number
        unit: ppm
  ReturnAirCO2Sensor:
    meaning: A sensor that measures the concentration of CO2 in return air.
    properties:
      value:
        type: number
        unit: ppm
  AirQualitySensor:
    meaning: A sensor that provides a measure of air quality.
    properties:
      value:
        type: number
  TemperatureSetpoint:
    meaning: A desired temperature value used for control.
    properties:
      value:
        type: number
        unit: degC
  AirTemperatureSetpoint:
    meaning: A setpoint that sets the temperature of air.
    properties:
      value:
        type: number
        unit: degC
  CoolingTemperatureSetpoint:
    meaning: A setpoint that sets the temperature target for cooling.
    properties:
      value:
        type: number
        unit: degC
  HeatingTemperatureSetpoint:
    meaning: A setpoint that sets the temperature target for heating.
    properties:
      value:
        type: number
        unit: degC
  TemperatureDeadbandSetpoint:
    meaning: A setpoint that defines the size of an allowed temperature deadband.
    properties:
      value:
        type: number
        unit: degC
  OccupancySensor:
    meaning: A sensor that detects occupancy in a space or area.
    properties:
      occupied:
        type: text
        allowed:
        - occupied
        - unoccupied
        - unknown
  Thermostat:
    meaning: An automatic control device used to maintain temperature at a fixed or
      adjustable setpoint.
    properties:
      mode:
        type: text
        allowed:
        - heating
        - cooling
        - auto
        - 'off'
      status:
        type: text
        allowed:
        - normal
        - fault
        - offline
  TerminalUnit:
    meaning: A device that regulates the volumetric flow rate or temperature of the
      controlled medium for a served area.
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
  Damper:
    meaning: An element in an air-distribution system that changes air resistance,
      airflow rate, or shuts off airflow.
    properties:
      position:
        type: number
        unit: percent
  Filter:
    meaning: A device that removes gases from a gas mixture or removes solid material
      from a fluid.
    properties:
      status:
        type: text
        allowed:
        - clean
        - dirty
        - replacement_due
  Fan:
    meaning: A device with rotating blades or vanes used to produce airflow for ventilation,
      heating, cooling, or transport of gas.
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
  Economizer:
    meaning: A device or control system that uses sensed conditions to conserve energy
      by reducing mechanical heating or cooling requirements.
    properties:
      status:
        type: text
        allowed:
        - disabled
        - enabled
        - active
  CoolingValve:
    meaning: A valve that controls air temperature by modulating the amount of cold
      water flowing through a cooling coil.
    properties:
      position:
        type: number
        unit: percent
  HeatingValve:
    meaning: A valve that controls air temperature by modulating the amount of hot
      water flowing through a heating coil.
    properties:
      position:
        type: number
        unit: percent
  Boiler:
    meaning: A closed pressure vessel that uses fuel or electricity to heat water
      or other fluids to supply steam or hot water for heating, humidification, or
      other applications.
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
  Chiller:
    meaning: A refrigerating machine used to transfer heat between fluids.
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
      coolingCapacity:
        type: number
  PackagedHeatPump:
    meaning: A self-contained unit that transfers heat energy to or from a designated
      space and can provide both heating and cooling.
    properties:
      mode:
        type: text
        allowed:
        - heating
        - cooling
        - 'off'
  Building:
    meaning: An independent unit of the built environment with a characteristic spatial
      structure and intended function or user activity.
    properties:
      yearBuilt:
        type: number
  Floor:
    meaning: A level representing a horizontal aggregation of spaces within a building.
    aliases:
    - Storey
    properties:
      levelNumber:
        type: number
  Space:
    meaning: A bounded physical or virtual area that provides for certain functions
      within a containing zone.
    properties:
      maxOccupancy:
        type: number
  Zone:
    meaning: A separately controlled heated or cooled space, or a group of spaces
      with sufficiently similar requirements to be maintained by a single controlling
      device.
    properties:
      occupancyStatus:
        type: text
        allowed:
        - occupied
        - unoccupied
        - unknown
  CO2DifferentialSensor:
    meaning: A sensor that measures the difference between CO2 levels of inside and
      outside air.
    aliases: []
    properties:
      value:
        type: number
        unit: ppm
  CondensingUnit:
    meaning: An outdoor HVAC unit that condenses refrigerant from gas to liquid as
      part of the refrigeration cycle.
    aliases: []
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
  CoolingTower:
    meaning: A heat rejection device that rejects waste heat to the atmosphere by
      cooling a water stream to a lower temperature.
    aliases: []
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
  HeatExchanger:
    meaning: A piece of equipment built for efficient heat transfer from one medium
      to another.
    aliases:
    - HX
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
  Humidifier:
    meaning: A device that adds moisture to air or other gases.
    aliases: []
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
  IsolationValve:
    meaning: A valve that stops the flow of a fluid, usually for maintenance or safety
      purposes.
    aliases: []
    properties:
      position:
        type: number
        unit: percent
  Pump:
    meaning: A machine that imparts energy to a fluid by drawing it in through an
      entrance port and forcing it out through an exhaust port.
    aliases: []
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
  SpaceHeater:
    meaning: A heater used to warm the air in an enclosed area such as a room or office.
    aliases: []
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
  WaterTemperatureSensor:
    meaning: A sensor that measures the temperature of water.
    aliases: []
    properties:
      value:
        type: number
        unit: degC
  DryCooler:
    meaning: A fluid cooler that uses air, a relatively dry, non-liquid fluid to accomplish
      process cooling.
    aliases:
    - Dry Cooler
    properties:
      status:
        type: text
        allowed:
        - 'off'
        - 'on'
        - alarm
