rules:
  zoneNeedsCooling:
    conditions:
    - zone air temperature is above the cooling temperature setpoint
  zoneNeedsHeating:
    conditions:
    - zone air temperature is below the heating temperature setpoint
  zoneWithinDeadband:
    conditions:
    - zone air temperature is between the heating and cooling setpoints
    - temperature deadband is being maintained
  increaseOutdoorAirForCO2:
    conditions:
    - return air CO2 is higher than the outdoor air CO2 condition
    - the AHU has return air and outside air CO2 points available for comparison
  protectAgainstFrost:
    conditions:
    - frost sensor indicates frost risk
  enableChilledWaterCooling:
    conditions:
    - chilled water temperature is above the water temperature setpoint for the cooling
      process
  enableHotWaterHeating:
    conditions:
    - hot water temperature is below the water temperature setpoint for the heating
      process
  useScheduledSetpoint:
    conditions:
    - a schedule temperature setpoint is available on the thermostat
    - the thermostat is controlling the zone
  occupiedZoneRequiresConditioning:
    conditions:
    - occupancy sensor indicates the zone is occupied
    - the zone requires heating or cooling
actions:
  openCoolingValve:
    input: AHU
    preconditions:
    - zoneNeedsCooling
    effect: cooling valve becomes modulating or open to increase cooling through the
      AHU coil
    verification: confirm the cooling valve status and observe air temperature moving
      toward the cooling setpoint
  openHeatingValve:
    input: AHU
    preconditions:
    - zoneNeedsHeating
    effect: heating valve becomes modulating or open to increase heating through the
      AHU coil
    verification: confirm the heating valve status and observe air temperature moving
      toward the heating setpoint
  holdDeadband:
    input: Zone
    preconditions:
    - zoneWithinDeadband
    effect: active heating and cooling demand is withheld to maintain the deadband
    verification: confirm the zone remains between heating and cooling setpoints
  increaseVentilation:
    input: AHU
    preconditions:
    - increaseOutdoorAirForCO2
    effect: outdoor air ventilation is increased, typically by enabling economizer
      logic or opening dampers further
    verification: confirm damper or economizer status changes and monitor return air
      CO2 response
  initiateFrostProtection:
    input: AHU
    preconditions:
    - protectAgainstFrost
    effect: frost-protection operation is initiated to reduce freezing risk in the
      AHU
    verification: confirm frost protection mode or related component response
  startChillerCooling:
    input: Chiller
    preconditions:
    - enableChilledWaterCooling
    effect: the chiller operates to drive water temperature toward the cooling setpoint
    verification: confirm chiller status and observe water temperature moving toward
      setpoint
  startBoilerHeating:
    input: Boiler
    preconditions:
    - enableHotWaterHeating
    effect: the boiler operates to drive water temperature toward the heating setpoint
    verification: confirm boiler status and observe water temperature moving toward
      setpoint
  applyScheduledSetpoint:
    input: Thermostat
    preconditions:
    - useScheduledSetpoint
    effect: the thermostat uses the schedule temperature setpoint as the active control
      target
    verification: confirm the active setpoint matches the schedule temperature setpoint
  conditionOccupiedZone:
    input: Zone
    preconditions:
    - occupiedZoneRequiresConditioning
    effect: the serving thermostat, terminal unit, or AHU conditions the occupied
      zone toward its applicable setpoint
    verification: confirm serving equipment responds and zone temperature trends toward
      the target
