competency_questions:
- id: cq1
  text: Which AHU serves a given zone or space?
- id: cq2
  text: Which temperature and CO2 points are associated with a given AHU?
- id: cq3
  text: Which equipment and sensors are located in a given building, floor, or space?
- id: cq4
  text: Which components are part of a given AHU, such as fans, filters, dampers,
    and valves?
- id: cq5
  text: Which downstream HVAC equipment is fed by a chiller, boiler, pump, or AHU?
- id: cq6
  text: Which zone temperature setpoints apply to a thermostat or terminal unit?
- id: cq7
  text: When should cooling be enabled for a zone based on zone temperature and cooling
    setpoint?
- id: cq8
  text: When should heating be enabled for a zone based on zone temperature and heating
    setpoint?
- id: cq9
  text: When should outdoor air ventilation be increased based on return air CO2 conditions?
- id: cq10
  text: Which dampers or valves should be adjusted to satisfy an air or water temperature
    setpoint?
- id: cq11
  text: Which spaces belong to a given floor, wing, building, site, or zone?
- id: cq12
  text: Which fan, filter, damper, and temperature points are associated with a CRAH
    or CRAC unit?
classes:
  AHU:
    meaning: Assembly containing fans and other equipment to circulate, filter, heat,
      cool, recover heat, humidify, dehumidify, and mix air, usually connected to
      an air-distribution system.
    aliases:
    - Air Handling Unit
    - Air Handler Unit
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - standby
        - alarm
  AirPlenum:
    meaning: A component of HVAC that receives air from an air handling unit or room
      to distribute or exhaust air to or from the building.
    properties:
      status:
        type: text
        allowed:
        - normal
        - restricted
        - closed
  AirQualitySensor:
    meaning: A sensor that provides a measure of air quality.
    properties:
      value:
        type: number
      status:
        type: text
        allowed:
        - normal
        - fault
        - offline
  AirTemperatureSensor:
    meaning: A sensor that measures the temperature of air.
    properties:
      value:
        type: number
        unit: degC
      status:
        type: text
        allowed:
        - normal
        - fault
        - offline
  AirTemperatureSetpoint:
    meaning: A setpoint that specifies a desired air temperature.
    properties:
      value:
        type: number
        unit: degC
  Boiler:
    meaning: A closed pressure vessel that uses fuel or electricity to heat water
      or other fluids to supply steam or hot water for heating, humidification, or
      other applications.
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - standby
        - alarm
  Building:
    meaning: An independent unit of the built environment with a characteristic spatial
      structure intended to serve at least one function or user activity.
    properties:
      yearBuilt:
        type: number
  BypassValve:
    meaning: A valve installed in a bypass pipeline.
    properties:
      status:
        type: text
        allowed:
        - open
        - closed
        - modulating
  CO2DifferentialSensor:
    meaning: A sensor that measures the difference between CO2 levels of inside and
      outside air.
    properties:
      value:
        type: number
        unit: ppm
      status:
        type: text
        allowed:
        - normal
        - fault
        - offline
  CO2LevelSensor:
    meaning: A sensor that measures the concentration of CO2 in air.
    properties:
      value:
        type: number
        unit: ppm
      status:
        type: text
        allowed:
        - normal
        - fault
        - offline
  Chiller:
    meaning: A refrigerating machine used to transfer heat between fluids.
    properties:
      coolingCapacity:
        type: number
      status:
        type: text
        allowed:
        - false
        - true
        - standby
        - alarm
  ColdDeck:
    meaning: The part of a dual duct air handling unit that supplies cooling to a
      building.
    properties:
      status:
        type: text
        allowed:
        - inactive
        - active
  Compressor:
    meaning: A device for mechanically increasing the pressure of a gas, including
      machines for compressing refrigerant vapor.
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - alarm
  CondensingUnit:
    meaning: An outdoor HVAC unit that condenses refrigerant from gas to liquid as
      part of the refrigeration cycle.
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - alarm
  CoolingTemperatureSetpoint:
    meaning: A setpoint that specifies a temperature target for cooling.
    properties:
      value:
        type: number
        unit: degC
  CoolingTower:
    meaning: A heat rejection device that rejects waste heat to the atmosphere by
      cooling a water stream.
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - alarm
  CoolingValve:
    meaning: A valve that controls air temperature by modulating the amount of cold
      water flowing through a cooling coil.
    properties:
      status:
        type: text
        allowed:
        - open
        - closed
        - modulating
  Damper:
    meaning: An element in an air-distribution system that modifies air resistance
      and changes airflow rate or shuts off airflow.
    properties:
      status:
        type: text
        allowed:
        - open
        - closed
        - modulating
  Economizer:
    meaning: A device or control system that initiates control signals or actions
      to conserve energy by reducing mechanical heating and cooling requirements.
    properties:
      status:
        type: text
        allowed:
        - disabled
        - enabled
        - active
  Fan:
    meaning: A device with rotating blades or vanes used to produce airflow for ventilation,
      exhaust, heating, cooling, or other gaseous transport.
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - alarm
  Filter:
    meaning: A device that removes gases from a mixture of gases or removes solid
      material from a fluid.
    properties:
      status:
        type: text
        allowed:
        - clean
        - dirty
        - clogged
  Floor:
    meaning: A level representing a horizontal aggregation of spaces that are vertically
      bound.
    aliases:
    - Storey
    properties: {}
  FrostSensor:
    meaning: A sensor that detects frost or conditions that may cause frost.
    properties:
      value:
        type: boolean
  HeatExchanger:
    meaning: Equipment built for efficient heat transfer from one medium to another.
    aliases:
    - HX
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - alarm
  HeatingTemperatureSetpoint:
    meaning: A setpoint that specifies a temperature target for heating.
    properties:
      value:
        type: number
        unit: degC
  HeatingValve:
    meaning: A valve that controls air temperature by modulating the amount of hot
      water flowing through a heating coil.
    properties:
      status:
        type: text
        allowed:
        - open
        - closed
        - modulating
  HotDeck:
    meaning: The part of a dual duct air handling unit that supplies heating to a
      building.
    properties:
      status:
        type: text
        allowed:
        - inactive
        - active
  Humidifier:
    meaning: A device that adds moisture to air or other gases.
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - alarm
  IsolationValve:
    meaning: A valve that stops the flow of a fluid, usually for maintenance or safety
      purposes.
    properties:
      status:
        type: text
        allowed:
        - open
        - closed
  OccupancySensor:
    meaning: A sensor that detects occupancy of a space or area.
    properties:
      value:
        type: boolean
      status:
        type: text
        allowed:
        - normal
        - fault
        - offline
  OutsideAirCO2Sensor:
    meaning: A sensor that measures the concentration of CO2 in outside air.
    properties:
      value:
        type: number
        unit: ppm
      status:
        type: text
        allowed:
        - normal
        - fault
        - offline
  Pump:
    meaning: A machine that imparts energy to a fluid and forces it through a system.
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - alarm
  ReturnAirCO2Sensor:
    meaning: A sensor that measures the concentration of CO2 in return air.
    properties:
      value:
        type: number
        unit: ppm
      status:
        type: text
        allowed:
        - normal
        - fault
        - offline
  ScheduleTemperatureSetpoint:
    meaning: The current temperature setpoint indicated by a schedule.
    properties:
      value:
        type: number
        unit: degC
  Site:
    meaning: A geographic region containing zero or more buildings and used as an
      encapsulating location for related entities.
    properties: {}
  Space:
    meaning: A bounded part of the physical world that provides for certain functions
      within a zone.
    properties: {}
  SpaceHeater:
    meaning: A heater used to warm the air in an enclosed area such as a room or office.
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - alarm
  SteamValve:
    meaning: A valve used to regulate steam flow in an HVAC system.
    properties:
      status:
        type: text
        allowed:
        - open
        - closed
        - modulating
  TemperatureDeadbandSetpoint:
    meaning: A setpoint that specifies the size of a temperature deadband.
    properties:
      value:
        type: number
        unit: degC
  TerminalUnit:
    meaning: A device that regulates the volumetric flow rate and or the temperature
      of the controlled medium.
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - standby
        - alarm
  Thermostat:
    meaning: An automatic control device used to maintain temperature at a fixed or
      adjustable setpoint.
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - alarm
  WallAirConditioner:
    meaning: A self-contained unit that cools a room by drawing in warm air, cooling
      it over a refrigerant coil, and recirculating it back into the space.
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - cooling
        - alarm
  WaterTemperatureSensor:
    meaning: A sensor that measures the temperature of water.
    properties:
      value:
        type: number
        unit: degC
      status:
        type: text
        allowed:
        - normal
        - fault
        - offline
  WaterTemperatureSetpoint:
    meaning: A setpoint that specifies a desired water temperature.
    properties:
      value:
        type: number
        unit: degC
  Wing:
    meaning: A subordinate part or feature of a building.
    properties: {}
  Zone:
    meaning: A separately controlled heated or cooled space, or group of spaces with
      sufficiently similar requirements to be maintained by a single controlling device.
    properties: {}
  CRAC:
    meaning: A computer room air conditioning unit that monitors and maintains temperature,
      air distribution, and humidity in a network room or data center.
    aliases:
    - Computer Room Air Conditioning
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - cooling
        - alarm
  CRAH:
    meaning: A computer room air handler that uses fans, cooling coils, and a water-chiller
      system to remove heat.
    aliases:
    - Computer Room Air Handler
    properties:
      status:
        type: text
        allowed:
        - false
        - true
        - cooling
        - alarm
