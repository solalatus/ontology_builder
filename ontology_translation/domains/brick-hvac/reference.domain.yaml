rules:
  needsCoolingFromSetpoint:
    conditions:
    - measured air temperature is above the applicable cooling temperature setpoint
  needsHeatingFromSetpoint:
    conditions:
    - measured air temperature is below the applicable heating temperature setpoint
  temperatureWithinDeadband:
    conditions:
    - measured temperature is within the configured temperature deadband around the
      active setpoint
  occupiedZoneRequiresControl:
    conditions:
    - a zone or space is occupied
    - a thermostat or terminal unit serves that zone or space
  investigateAirQuality:
    conditions:
    - a CO2 sensor indicates elevated CO2 relative to the expected condition for the
      served air stream
  verifyThermostatControlContext:
    conditions:
    - a thermostat has both a temperature sensor and a temperature setpoint
  economizerReducesMechanicalConditioning:
    conditions:
    - an economizer uses proper variable sensing
    - economizer operation is intended to conserve energy by reducing mechanical heating
      and cooling requirement
actions:
  enableEconomizer:
    input: AirHandlingUnit
    preconditions:
    - economizerReducesMechanicalConditioning
    effect: the air handling unit operates in economizer mode to reduce mechanical
      cooling
    verification: confirm the unit mode or economizer status indicates economizer
      operation
  increaseCooling:
    input: AirHandlingUnit
    preconditions:
    - needsCoolingFromSetpoint
    effect: the cooling path is commanded to reduce air temperature toward the cooling
      setpoint
    verification: confirm subsequent air temperature trends downward toward setpoint
  increaseHeating:
    input: AirHandlingUnit
    preconditions:
    - needsHeatingFromSetpoint
    effect: the heating path is commanded to raise air temperature toward the heating
      setpoint
    verification: confirm subsequent air temperature trends upward toward setpoint
  verifyOccupiedZoneConditioning:
    input: Zone
    preconditions:
    - occupiedZoneRequiresControl
    effect: the served zone is checked to ensure active control is available for occupied
      conditions
    verification: confirm a serving thermostat or terminal unit is assigned and operating
  maintainWithinDeadband:
    input: AirHandlingUnit
    preconditions:
    - temperatureWithinDeadband
    effect: no heating or cooling change is required while temperature remains within
      the configured deadband
    verification: confirm temperature remains within the configured deadband
