competency_questions: []
classes:
  Incident:
    meaning: "An unplanned interruption, degradation, or security condition that requires a managed response to restore service."
    aliases:
      - case
      - ticket
    properties:
      incidentId:
        type: text
      severityTier:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
      currentState:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      startTime:
        type: date
      declarationStatus:
        type: text
        allowed:
          - declared
          - not declared
      containmentStatus:
        type: text
        allowed:
          - contained
          - not contained
      closureStatus:
        type: text
        allowed:
          - pending
          - closed
  ITService:
    meaning: A managed technology capability that supports one or more business services delivered to customers.
    aliases:
      - ITS
    properties:
      serviceName:
        type: text
      serviceCriticality:
        type: text
      currentState:
        type: text
      residualConditionAccepted:
        type: boolean
  BusinessService:
    meaning: A customer- or business-facing capability provided by the bank that fulfills specific needs and drives organizational value.
    aliases:
      - BS
    properties:
      serviceName:
        type: text
      criticality:
        type: text
      currentState:
        type: text
  CustomerChannel:
    meaning: "The various pathways through which customers access banking services, such as online banking, mobile apps, or physical branches."
    aliases: []
    properties:
      channelName:
        type: text
      currentState:
        type: text
  ConfigurationItem:
    meaning: "A managed component within the IT environment, including hardware, software, or documentation, that is vital for delivering IT services."
    aliases:
      - CI
    properties:
      ciIdentifier:
        type: text
      ciType:
        type: text
      currentState:
        type: text
      isolationStatus:
        type: text
  ThirdPartyService:
    meaning: "An externally provided service that the bank relies on to support its operations, often involving external vendors or partners."
    aliases:
      - TPS
    properties:
      serviceName:
        type: text
      currentState:
        type: text
  Alert:
    meaning: A notification generated by monitoring systems indicating a possible issue that requires attention or investigation.
    aliases: []
    properties:
      alertId:
        type: text
      currentState:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      acknowledgedAt:
        type: date
  Event:
    meaning: "An observed occurrence that signifies a change in the state of a system or component, often used to identify potential incidents."
    aliases: []
    properties:
      eventId:
        type: text
      currentState:
        type: text
        allowed:
          - observed
          - processed
      occurredAt:
        type: date
  ServiceOwner:
    meaning: "The individual accountable for the overall performance, governance, and lifecycle management of a specific IT service."
    aliases: []
    properties:
      ownerIdentifier:
        type: text
  ResolverGroup:
    meaning: A team designated to diagnose and resolve issues related to a specific technology or service area.
    aliases:
      - support team
    properties:
      groupName:
        type: text
  OnCallEngineer:
    meaning: A technical specialist available to respond to urgent operational incidents outside of standard working hours.
    aliases:
      - OCE
    properties:
      engineerIdentifier:
        type: text
      onCallStatus:
        type: text
  BusinessOwner:
    meaning: The person responsible for the strategic direction and overall accountability of a business service or process.
    aliases: []
    properties:
      ownerIdentifier:
        type: text
  TechnicalOwner:
    meaning: "The individual accountable for the engineering, maintenance, and operational fitness of a specific configuration item."
    aliases: []
    properties:
      ownerIdentifier:
        type: text
  IncidentCommander:
    meaning: "The person responsible for coordinating the response to a major incident, ensuring effective communication and resource allocation."
    aliases: []
    properties:
      commanderIdentifier:
        type: text
  Runbook:
    meaning: A detailed operational procedure that outlines step-by-step instructions for responding to specific incidents or performing routine tasks.
    aliases: []
    properties:
      runbookName:
        type: text
      approvalStatus:
        type: text
  Workaround:
    meaning: A temporary solution that reduces or bypasses the impact of an incident or problem without addressing the underlying cause.
    aliases: []
    properties:
      workaroundName:
        type: text
      approvalStatus:
        type: text
  BackupSet:
    meaning: A collection of recoverable data that is created periodically to ensure that information can be restored in the event of data loss.
    aliases: []
    properties:
      backupSetIdentifier:
        type: text
      backupTime:
        type: date
      integrityStatus:
        type: text
  RecoveryPlan:
    meaning: A documented strategy that outlines the steps needed to restore an IT service and its dependencies following a disruption.
    aliases: []
    properties:
      planName:
        type: text
      approvalStatus:
        type: text
      lastTestedAt:
        type: date
  Change:
    meaning: "A controlled addition, modification, or removal of a component within the IT environment that may affect an IT service."
    aliases: []
    properties:
      changeIdentifier:
        type: text
      changeType:
        type: text
      implementationTime:
        type: date
      currentState:
        type: text
  Deployment:
    meaning: "The process of implementing and activating a change or release within the IT environment, ensuring that it operates as intended."
    aliases: []
    properties:
      deploymentIdentifier:
        type: text
      deploymentTime:
        type: date
      currentState:
        type: text
  MaterialityAssessment:
    meaning: A documented evaluation that determines the significance of an incident and whether it requires regulatory notification.
    aliases: []
    properties:
      currentState:
        type: text
      completedAt:
        type: date
      result:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
  RegulatoryNotification:
    meaning: A formal communication submitted to a regulatory authority regarding incidents that meet specific reporting obligations.
    aliases:
      - regulatory alert
    properties:
      currentState:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueAt:
        type: date
      submittedAt:
        type: date
      jurisdictionContext:
        type: text
  Evidence:
    meaning: "A preserved record or artifact collected during an incident response that supports analysis, accountability, and compliance."
    aliases: []
    properties:
      evidenceIdentifier:
        type: text
      integrityStatus:
        type: text
      collectedAt:
        type: date
  StakeholderCommunication:
    meaning: "Messages sent to relevant parties regarding the status, impact, and next steps related to an incident."
    aliases: []
    properties:
      communicationType:
        type: text
      sentAt:
        type: date
      currentState:
        type: text
  ClosureCondition:
    meaning: "The criteria that must be satisfied before an incident can be officially closed, ensuring that all necessary actions have been completed."
    aliases: []
    properties:
      conditionName:
        type: text
      currentState:
        type: text
  PostIncidentReview:
    meaning: "A structured evaluation conducted after an incident to analyze causes, assess response effectiveness, and identify opportunities for improvement."
    aliases:
      - PIR
    properties:
      reviewDate:
        type: date
      currentState:
        type: text
  CorrectiveAction:
    meaning: "A tracked action intended to address the root causes of an incident or problem, reduce future risk, or improve overall response capability."
    aliases:
      - CA
    properties:
      actionIdentifier:
        type: text
      dueAt:
        type: date
      currentState:
        type: text
