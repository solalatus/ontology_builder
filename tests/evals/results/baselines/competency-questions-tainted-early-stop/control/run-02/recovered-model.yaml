competency_questions: []
classes:
  Incident:
    meaning: An unplanned interruption or degradation of service that requires managed response and restoration.
    aliases: []
    properties:
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      impact:
        type: text
        allowed:
          - enterprise-wide
          - multiple-services
          - single-service
          - limited-users
          - no-observed-impact
      urgency:
        type: text
        allowed:
          - immediate
          - high
          - normal
          - low
      majorIncidentDeclared:
        type: boolean
      resolutionTimeline:
        type: text
      closureTimeline:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      materialityAssessmentCompleted:
        type: boolean
      workaroundAvailable:
        type: boolean
      majorIncidentEligibility:
        type: boolean
      detectedAt:
        type: date
      resolvedAt:
        type: date
      closedAt:
        type: date
      majorIncidentDeclaredAt:
        type: date
      assignedAt:
        type: date
      incidentType:
        type: text
  BusinessService:
    meaning: A customer-facing capability delivered by the bank that supports specific business processes.
    aliases: []
    properties:
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  CustomerChannel:
    meaning: A channel through which customers access and interact with the bank’s services.
    aliases: []
    properties: {}
  ConfigurationItem:
    meaning: "A managed component, such as hardware or software, that is documented and tracked in the configuration management system."
    aliases:
      - CI
    properties:
      environment:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
  ThirdPartyService:
    meaning: An externally provided service that the bank depends on for delivering its own services or functionality.
    aliases:
      - outsourced service
    properties:
      status:
        type: text
        allowed:
          - active
          - inactive
          - under-review
          - terminated
  ServiceOwner:
    meaning: "The individual accountable for the overall performance, delivery, and value of an IT service throughout its lifecycle."
    aliases: []
    properties: {}
  AlertEvent:
    meaning: A signal generated by monitoring systems indicating a condition that may require investigation or action.
    aliases: []
    properties:
      acknowledged:
        type: boolean
      status:
        type: text
      acknowledgedAt:
        type: date
  KnownError:
    meaning: "A diagnosed issue with a documented cause and workaround, which is recognized as a recurring problem."
    aliases: []
    properties: {}
  Problem:
    meaning: The underlying cause or potential cause of one or more incidents that require investigation and resolution.
    aliases: []
    properties: {}
  OnCallEngineer:
    meaning: A technical specialist available to respond to incidents and operational issues outside of regular working hours.
    aliases: []
    properties:
      timeZone:
        type: text
      currentWorkload:
        type: number
  ResolverGroup:
    meaning: A team assigned to diagnose and restore a specific technology or service area during an incident.
    aliases:
      - support group
    properties: {}
  RecoveryPlan:
    meaning: A documented procedure outlining the steps to restore a service or its components after a disruption.
    aliases:
      - DR plan
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  CorrectiveAction:
    meaning: "An action implemented to address the root cause of a problem, reduce risks, or improve future incident responses."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
  Stakeholder:
    meaning: "A person, group, or organization that is affected by or has an interest in the outcomes of an operational situation."
    aliases: []
    properties: {}
  Communication:
    meaning: "A controlled message sent to inform relevant parties about an incident, its status, or actions taken."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      requiredBy:
        type: text
  BackupRestoreRequirement:
    meaning: The defined specifications and procedures necessary for successfully backing up and restoring data or services.
    aliases: []
    properties:
      restoreRequirement:
        type: text
  Workaround:
    meaning: A temporary solution implemented to reduce or bypass the impact of an incident or problem until a permanent fix is applied.
    aliases: []
    properties:
      documented:
        type: boolean
  Evidence:
    meaning: "A preserved record or artifact that supports incident analysis, accountability, and audit requirements."
    aliases: []
    properties:
      collectedAt:
        type: date
  MaterialityAssessment:
    meaning: "A documented evaluation of an incident's significance to determine whether it requires regulatory notification or reporting."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - completed
          - reviewed
          - approved
      completedAt:
        type: date
  RegulatoryNotificationObligation:
    meaning: A formal requirement to notify a regulatory authority about specific incidents or conditions in accordance with compliance standards.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  ApplicationOwner:
    meaning: "The individual responsible for the operational fitness and oversight of a specific application, ensuring it meets business needs."
    aliases: []
    properties: {}
  TechnicalOwner:
    meaning: "The individual accountable for the engineering, maintenance, and technical operations of specific configuration items and systems."
    aliases: []
    properties: {}
  BusinessOwner:
    meaning: The individual responsible for the business outcomes associated with a specific business service or process.
    aliases: []
    properties: {}
  Change:
    meaning: "A controlled addition, modification, or removal of components that may affect an IT service, requiring documentation and approval before implementation."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      implementationPlanPresent:
        type: boolean
      backoutPlanPresent:
        type: boolean
      riskAccepted:
        type: boolean
