rules:
  canDeclareMajorIncident:
    conditions:
      - "Incident status is not resolved, closed, or cancelled."
      - Incident severity is sev1-critical or sev2-high.
      - At least one impacted BusinessService is identified.
      - An OnCallEngineer is assigned to the Incident.
  requiresMaterialityAssessment:
    conditions:
      - "Incident status is not resolved, closed, or cancelled."
      - Incident is related to a KnownError or Problem that could affect reporting obligations.
      - Incident severity is sev1-critical or sev2-high.
  canCloseIncident:
    conditions:
      - Incident status is resolved or monitoring.
      - Resolution and restoration Evidence is recorded for the Incident.
      - Required Communication for the Incident is approved or accepted.
  canAcknowledgeAlert:
    conditions:
      - AlertEvent status is new.
  canContainIncident:
    conditions:
      - Incident status is acknowledged or investigating.
  canCommunicateIncidentUpdate:
    conditions:
      - Communication concerns an Incident.
      - Communication status is approved or pending-approval.
  canExecuteEmergencyChange:
    conditions:
      - "Change mitigates an Incident whose status is not resolved, closed, or cancelled."
      - Change implementationPlanPresent is true.
      - Change backoutPlanPresent is true.
      - Change riskAccepted is true.
      - Change status is approved.
  canRestoreFromBackup:
    conditions:
      - ConfigurationItem has a BackupRestoreRequirement.
  canAssignOnCallEngineer:
    conditions:
      - The supporting ResolverGroup for an affected ConfigurationItem is identified.
      - The OnCallEngineer is a member of that ResolverGroup.
      - The OnCallEngineer currentWorkload is below the manageable threshold defined by operations.
actions:
  acknowledgeAlert:
    input: AlertEvent
    preconditions:
      - canAcknowledgeAlert
    effect: The AlertEvent status becomes acknowledged and AlertEvent acknowledgedAt is recorded.
    verification: Read the AlertEvent and confirm status is acknowledged and acknowledgedAt has been recorded.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: Incident majorIncidentDeclared becomes true and Incident majorIncidentDeclaredAt is recorded.
    verification: "Read the Incident and confirm majorIncidentDeclared is true, an OnCallEngineer is assigned, and majorIncidentDeclaredAt has been recorded."
  assignIncidentToResolverGroup:
    input: Incident
    preconditions: []
    effect: Incident is assigned to the specified ResolverGroup and Incident assignedAt is recorded.
    verification: Read the Incident and confirm the assigned ResolverGroup matches the intended group and assignedAt has been recorded.
  performMaterialityAssessment:
    input: MaterialityAssessment
    preconditions:
      - requiresMaterialityAssessment
    effect: MaterialityAssessment status becomes completed and MaterialityAssessment completedAt is recorded.
    verification: Read the MaterialityAssessment and confirm status is completed and completedAt has been recorded.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: Incident status becomes closed and Incident closedAt is recorded.
    verification: Read the Incident and confirm status is closed and closedAt has been recorded.
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: Incident status becomes contained.
    verification: Read the Incident and confirm status is contained.
  communicateIncidentUpdate:
    input: Communication
    preconditions:
      - canCommunicateIncidentUpdate
    effect: Communication status becomes submitted.
    verification: Read the Communication and confirm status is submitted.
  executeEmergencyChange:
    input: Change
    preconditions:
      - canExecuteEmergencyChange
    effect: Change status becomes implemented.
    verification: Read the Change and confirm status is implemented.
  restoreFromBackup:
    input: ConfigurationItem
    preconditions:
      - canRestoreFromBackup
    effect: Restoration is performed for the ConfigurationItem.
    verification: Read the ConfigurationItem and confirm the restoration action was completed.
  documentIncidentResponse:
    input: Incident
    preconditions: []
    effect: "Relevant Evidence is associated with the Incident, and the Incident record is updated with response documentation."
    verification: Read the Incident and confirm response documentation is present and relevant Evidence is linked.
