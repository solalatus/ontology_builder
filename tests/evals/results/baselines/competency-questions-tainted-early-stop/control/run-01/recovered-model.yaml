competency_questions: []
classes:
  Incident:
    meaning: "An unplanned disruption, degradation, or security condition in IT services that requires managed response and resolution."
    aliases:
      - Issue
      - Ticket
    properties:
      incidentId:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      priorityLevel:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      rootCause:
        type: text
      detectedAt:
        type: date
      declaredMajor:
        type: boolean
      incidentType:
        type: text
        allowed:
          - cybersecurity
          - operational
          - maintenance
      summary:
        type: text
      createdAt:
        type: date
      severityLevel:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
  ITService:
    meaning: "A managed technology capability that supports one or more business services, ensuring functionality and availability for users."
    aliases:
      - Informatics Service
    properties:
      serviceName:
        type: text
      serviceStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
      priorityLevel:
        type: text
  BusinessService:
    meaning: A customer-facing capability delivered by the bank that relies on various IT services to meet business objectives.
    aliases:
      - Banking Service
    properties:
      serviceName:
        type: text
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
  Alert:
    meaning: "A notification generated by monitoring systems that indicates a condition requiring attention, often linked to potential incidents."
    aliases:
      - Notification
    properties:
      alertId:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      detectedAt:
        type: date
      acknowledgedAt:
        type: date
  ResolverGroup:
    meaning: "A designated team responsible for diagnosing and resolving specific technology or service issues within the bank's operations."
    aliases:
      - Support Group
    properties:
      groupName:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
          - on-hold
  IncidentCommander:
    meaning: "The person accountable for leading the response during a major incident, coordinating efforts across teams and functions."
    aliases: []
    properties:
      commanderName:
        type: text
  IncidentManager:
    meaning: "The individual responsible for managing the lifecycle of incidents on a day-to-day basis, ensuring timely resolution and communication."
    aliases:
      - Incident Lead
      - Incident Coordinator
    properties:
      managerName:
        type: text
  ServiceDesk:
    meaning: "The first-line support function that receives, records, triages, and routes user-reported incidents and service requests."
    aliases:
      - Help Desk
      - Customer Support Desk
    properties:
      deskName:
        type: text
  Runbook:
    meaning: "A documented operational procedure that provides step-by-step guidance for diagnosing, responding to, or recovering from incidents."
    aliases:
      - Playbook
      - Procedure Guide
    properties:
      title:
        type: text
      status:
        type: text
        allowed:
          - current
          - outdated
          - under-review
  Workaround:
    meaning: "A temporary solution applied to mitigate the impact of an incident, allowing continued service operation while a permanent fix is developed."
    aliases:
      - Temporary Fix
      - Bypass Solution
    properties:
      title:
        type: text
      status:
        type: text
        allowed:
          - applicable
          - obsolete
          - under-review
  KnownError:
    meaning: "A documented issue within IT services that has an identified cause or workaround, which helps expedite resolutions for related incidents."
    aliases: []
    properties:
      recordId:
        type: text
      status:
        type: text
  CorrectiveAction:
    meaning: A tracked measure intended to eliminate the root cause of incidents or improve operational responses based on identified issues.
    aliases: []
    properties:
      actionDescription:
        type: text
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
      dueDate:
        type: date
  MaterialityAssessment:
    meaning: An evaluation conducted to determine the significance of an incident in relation to regulatory reporting requirements.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - in-progress
          - completed
          - under-review
      outcome:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      completedAt:
        type: date
      rationale:
        type: text
  SecurityEvent:
    meaning: "An occurrence that may indicate a security-related issue, often detected through monitoring systems and requiring investigation."
    aliases: []
    properties:
      eventId:
        type: text
      status:
        type: text
      detectedAt:
        type: date
  Vendor:
    meaning: An external organization that provides technology products or services essential for the bank’s operations and incident management.
    aliases:
      - Supplier
    properties:
      vendorName:
        type: text
      escalationStatus:
        type: text
  RegulatoryNotification:
    meaning: A formal submission to a regulatory body concerning incidents that require reporting due to their potential impact on operations or compliance.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      reportingDeadline:
        type: date
  EvidenceItem:
    meaning: "A preserved record or artifact collected during incident management that supports analysis, accountability, and procedural adherence."
    aliases: []
    properties:
      evidenceType:
        type: text
      collectedAt:
        type: date
      status:
        type: text
  StakeholderCommunication:
    meaning: "A message sent to inform relevant parties about the status and details of an incident, ensuring transparency and engagement."
    aliases: []
    properties:
      messageText:
        type: text
      sentAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - sent
          - acknowledged
          - failed
      deliveryStatus:
        type: text
  Stakeholder:
    meaning: "An individual or group with a vested interest or responsibility in the outcome of an incident, which may include both internal and external parties."
    aliases: []
    properties:
      stakeholderName:
        type: text
      stakeholderType:
        type: text
  RecoveryPlan:
    meaning: A documented set of procedures designed to restore IT services and minimize disruption in the event of an incident affecting operations.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - planned
          - in-progress
          - completed
      plannedExecutionAt:
        type: date
  Change:
    meaning: "A controlled modification to an IT service or configuration item, which may involve adding, removing, or altering components to improve or fix functionality."
    aliases: []
    properties:
      changeId:
        type: text
      status:
        type: text
      implementedAt:
        type: date
  EmergencyChange:
    meaning: An accelerated change process implemented to address urgent operational needs arising from incidents that require immediate correction.
    aliases: []
    properties:
      changeId:
        type: text
      status:
        type: text
      implementedAt:
        type: date
  ServiceOwner:
    meaning: The individual responsible for the overall accountability and performance of a specific IT service throughout its lifecycle.
    aliases: []
    properties:
      ownerName:
        type: text
  OnCallEngineer:
    meaning: "A technical specialist available to respond to incidents outside normal working hours, ensuring prompt resolution of urgent issues."
    aliases: []
    properties:
      engineerName:
        type: text
      onCallStatus:
        type: text
        allowed:
          - available
          - unavailable
          - on-duty
  TechnicalOwner:
    meaning: "The individual accountable for the engineering, maintenance, and performance of a specific configuration item within the IT environment."
    aliases: []
    properties:
      ownerName:
        type: text
  ConfigurationItem:
    meaning: "A managed component within the IT infrastructure that is recorded in the configuration management system, including software, hardware, and network elements."
    aliases: []
    properties:
      ciName:
        type: text
      status:
        type: text
      isolationStatus:
        type: text
      isolatedAt:
        type: date
      networkConnectivityStatus:
        type: text
  ServiceCatalog:
    meaning: "A comprehensive list of IT services offered by the bank, including definitions, owners, criticality, and associated service level objectives."
    aliases: []
    properties:
      catalogName:
        type: text
      status:
        type: text
  PostIncidentReview:
    meaning: "A structured analysis conducted after an incident to evaluate the response, identify lessons learned, and determine actions to prevent recurrence."
    aliases: []
    properties:
      scheduledAt:
        type: date
      status:
        type: text
  Metric:
    meaning: A quantifiable measure that tracks performance or effectiveness for specific aspects of incident management and service delivery.
    aliases: []
    properties:
      metricName:
        type: text
      currentValue:
        type: number
      status:
        type: text
  Backup:
    meaning: A copy of data or system configurations stored securely to ensure restoration capability in case of data loss or service disruption.
    aliases: []
    properties:
      backupId:
        type: text
      backupDate:
        type: date
      status:
        type: text
        allowed:
          - successful
          - verified
          - failed
          - expired
          - corrupted
  IsolationActionRecord:
    meaning: null
    aliases: []
    properties:
      status:
        type: text
      authorizedAt:
        type: date
      executedAt:
        type: date
      rollbackProcedureAvailable:
        type: boolean
      impactAssessmentCompleted:
        type: boolean
      isolationMethod:
        type: text
      outcome:
        type: text
  BackupRestoreRecord:
    meaning: null
    aliases: []
    properties:
      status:
        type: text
      authorizedAt:
        type: date
      executedAt:
        type: date
      targetEnvironmentReady:
        type: boolean
      targetEnvironment:
        type: text
      dataIntegrityVerified:
        type: boolean
      outcome:
        type: text
  CommunicationAcknowledgment:
    meaning: null
    aliases: []
    properties:
      status:
        type: text
      acknowledgedAt:
        type: date
      notes:
        type: text
