rules:
  incidentIsReportable:
    conditions:
      - the materiality assessment outcome for the incident is reportable
      - the incident results in significant disruption of services impacting business operations or customer access
      - there is a legal or regulatory obligation to report incidents of this nature
  canExecuteRecoveryPlan:
    conditions:
      - the recovery plan is approved and validated as applicable for the incident
      - the target recovery environment is available and can support the service being restored
      - the data recovery point meets the acceptable standards defined in the recovery plan
      - all necessary authorizations have been obtained from the incident commander and relevant stakeholders
      - any required preparation steps in the recovery plan have been completed
  canAssignIncident:
    conditions:
      - "the incident status is new, acknowledged, or investigating"
      - the resolver group supports the affected service or configuration item linked to the incident
  canDeclareMajorIncident:
    conditions:
      - "the incident is not resolved, closed, or cancelled"
      - the incident severity level is sev1-critical or sev2-high
      - at least one impacted IT service has been identified
      - an incident commander or designated duty manager has been assigned
  canAcknowledgeAlert:
    conditions:
      - the alert status is new
      - the operator handling the acknowledgment is authorized to act on that alert within the responsible resolver group
  canSendStakeholderCommunication:
    conditions:
      - "the communication message is drafted, complete, and approved by the designated owner or incident commander"
      - the relevant stakeholders who are to receive the communication have been identified
  canIsolateConfigurationItem:
    conditions:
      - the configuration item is linked to an active incident
      - the impact of isolation on services and dependencies has been assessed and documented
      - the isolation method is available
      - a rollback or reconnection procedure is available
      - authorization has been obtained from the incident commander and the technical owner
  canPerformMaterialityAssessment:
    conditions:
      - "the incident is not resolved, closed, or cancelled"
      - relevant data and context regarding the incident have been gathered for assessment
      - the materiality assessment framework or criteria are available for evaluation
  canRestoreBackup:
    conditions:
      - the backup status is successful or verified
      - the backup is linked to the affected configuration item or IT service that needs restoration
      - the target environment for restoration is available and ready
      - authorization has been obtained from the technical owner and relevant stakeholders
  canCloseIncident:
    conditions:
      - the incident status is resolved or monitoring
      - "all impacted business services have a health state of healthy, or an acceptable residual condition has been documented"
      - documentation of resolution and restoration evidence has been completed and is available
      - all required stakeholder communications have been sent and acknowledged by the relevant stakeholders
      - any major incident has a scheduled or completed post-incident review
actions:
  assignIncident:
    input: Incident
    preconditions:
      - canAssignIncident
    effect: The incident is assigned to the intended resolver group.
    verification: "Read the incident again and confirm that it is assigned to the intended resolver group and that the assignment is appropriate based on the incident's context and the resolver group's capabilities."
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: "The incident is classified as a major incident, initiating enhanced coordination and communication protocols."
    verification: "Check the incident record to confirm that it is flagged as a major incident, and verify that an incident commander has been assigned along with the initiation of the communication cadence."
  executeRecoveryPlan:
    input: RecoveryPlan
    preconditions:
      - canExecuteRecoveryPlan
    effect: "The affected IT service is restored to operational status as outlined in the recovery plan, and any necessary configurations or data are recovered to ensure service functionality."
    verification: "Confirm that the execution of the recovery plan has been completed successfully by checking the service state, confirming that all recovery steps were followed, and documenting any changes made during the process."
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: The alert status becomes acknowledged.
    verification: Check the alert record to confirm that its status has been updated to acknowledged and that the acknowledgment timestamp has been recorded.
  sendStakeholderCommunication:
    input: StakeholderCommunication
    preconditions:
      - canSendStakeholderCommunication
    effect: "The communication is sent to the identified stakeholders, the sending timestamp is recorded, the stakeholder communication status is updated to sent, and any delivery result is recorded."
    verification: "Confirm that the sending timestamp is recorded, the status is updated to sent, and delivery was successful or any errors were noted."
  isolateConfigurationItem:
    input: IsolationActionRecord
    preconditions:
      - canIsolateConfigurationItem
    effect: "The configuration item is isolated from its related services or network segments, and the isolation action record is updated with execution time, authorization details, and outcome."
    verification: "Confirm that the configuration item has been successfully isolated by checking its status and network connectivity, and document the action taken, including time and authorization details."
  performMaterialityAssessment:
    input: Incident
    preconditions:
      - canPerformMaterialityAssessment
    effect: "A materiality assessment is conducted and its outcome is documented, indicating whether the incident is reportable, potentially reportable, or not reportable."
    verification: "Confirm that the materiality assessment record has been updated with the outcome, the assessment date, and the supporting rationale behind the decision."
  restoreBackup:
    input: BackupRestoreRecord
    preconditions:
      - canRestoreBackup
    effect: "The specified backup data is restored to the target environment, making the configuration item or IT service operational again."
    verification: "Confirm that the restoration has completed successfully by checking the integrity of the restored data, ensuring that the IT service or configuration item is functioning as intended, and documenting the restoration execution time and any issues encountered."
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: "The incident status is updated to closed, indicating that the incident management process for that incident has been completed."
    verification: "Confirm that the incident record reflects the updated status as closed, and that all associated documentation, evidence, communications, and review findings are appropriately recorded and accessible."
