competency_questions:
  - id: cq1
    text: Which business services are impacted by an incident?
  - id: cq2
    text: Which customer channels are impacted by an incident?
  - id: cq3
    text: Which configuration items are part of the dependency path for an affected IT service?
  - id: cq4
    text: Which third-party services are part of the dependency path for an affected IT service?
  - id: cq5
    text: What active alerts are correlated with an incident?
  - id: cq6
    text: What active events are correlated with an incident?
  - id: cq7
    text: Who owns an affected service?
  - id: cq8
    text: Which resolver group should be assigned to an incident?
  - id: cq9
    text: Which on-call engineer should be assigned to an incident?
  - id: cq10
    text: Does an incident meet the criteria for major-incident declaration?
  - id: cq11
    text: What runbook can be used for an incident?
  - id: cq12
    text: What workaround can be used for an incident?
  - id: cq13
    text: What backup set can be used for an incident?
  - id: cq14
    text: What recovery plan can be used for an incident?
  - id: cq15
    text: Was an incident caused by a recent change?
  - id: cq16
    text: Was an incident caused by a recent deployment?
  - id: cq17
    text: Is a materiality assessment complete for an incident?
  - id: cq18
    text: Does an incident require a regulatory notification?
  - id: cq19
    text: Are evidence integrity conditions met for an incident?
  - id: cq20
    text: Are documentation conditions met for an incident?
  - id: cq21
    text: Have all necessary stakeholder communications for an incident been sent?
  - id: cq22
    text: Have all necessary stakeholder communications for an incident been archived?
classes:
  Incident:
    meaning: An incident is an unplanned interruption or reduction in the quality of an IT service that requires managed response and restoration efforts.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      majorIncidentDeclared:
        type: boolean
      startTime:
        type: date
      technologyArea:
        type: text
      businessHoursContext:
        type: boolean
      documentationComplete:
        type: boolean
      regulatoryNotificationRequired:
        type: boolean
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
  ITService:
    meaning: "An IT service is a managed technology capability that supports specific business services and customer needs through the proper use of the bank's IT resources."
    aliases:
      - informatics service
    properties:
      serviceTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  BusinessService:
    meaning: "A business service is a customer-facing capability that the bank delivers to its clients, supported by one or more IT services."
    aliases: []
    properties: {}
  CustomerChannel:
    meaning: "A customer channel is the various methods or pathways through which customers access the bank’s services, such as online banking, mobile apps, or physical branches."
    aliases: []
    properties: {}
  ConfigurationItem:
    meaning: "A configuration item is any component within the IT infrastructure that is recorded in the configuration management system, including hardware, software, and network components."
    aliases:
      - CI
    properties: {}
  ThirdPartyService:
    meaning: "A third-party service is an external service or product that the bank relies on to deliver its operations or IT services, often provided by outside vendors or partners."
    aliases: []
    properties: {}
  Alert:
    meaning: "An alert is a notification generated by monitoring systems that indicates a significant condition requiring review, such as a potential issue with an IT service or infrastructure component."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      raisedTime:
        type: date
  Event:
    meaning: "An event is a recorded occurrence within the IT infrastructure, representing a state change or noteworthy activity that may influence service performance or operations."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - active
          - resolved
          - archived
          - unknown
  ServiceOwner:
    meaning: "A service owner is the individual or role responsible for the overall management, maintenance, and delivery of a specific IT service throughout its lifecycle."
    aliases: []
    properties: {}
  ResolverGroup:
    meaning: A resolver group is a team of technical specialists assigned to diagnose and resolve incidents or problems related to specific technology areas or services.
    aliases:
      - support group
    properties:
      technologyArea:
        type: text
  OnCallEngineer:
    meaning: "An on-call engineer is a technical specialist available to respond to incidents during designated hours, ensuring timely support for operational issues."
    aliases: []
    properties:
      availabilityStatus:
        type: text
        allowed:
          - available
          - busy
          - off-duty
  Runbook:
    meaning: "A runbook is a documented set of procedures and guidelines that outlines the step-by-step actions necessary to diagnose, respond to, and recover from incidents."
    aliases:
      - playbook
    properties: {}
  Workaround:
    meaning: A workaround is a temporary solution or method used to minimize the impact of an incident or problem while a permanent fix is being developed.
    aliases: []
    properties: {}
  BackupSet:
    meaning: A backup set is a defined collection of backup data that can be restored to recover systems or data in the event of data loss or corruption.
    aliases: []
    properties: {}
  RecoveryPlan:
    meaning: A recovery plan is a structured document that provides detailed procedures for restoring an IT service or system to its operational state after an incident or disruption.
    aliases:
      - DR plan
    properties: {}
  Change:
    meaning: "A change is a controlled alteration to an IT service or component, which may involve adding, modifying, or removing functionality, and typically requires assessment and approval processes."
    aliases:
      - modification
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      implementedTime:
        type: date
      emergencyChange:
        type: boolean
  Deployment:
    meaning: "A deployment is the technical execution of installing or activating a change or release in the IT environment, which makes it operational for end users."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
      deployedTime:
        type: date
  MaterialityAssessment:
    meaning: A materiality assessment is a documented evaluation that determines the significance of an incident and whether it requires regulatory notification based on its impact.
    aliases:
      - reportability assessment
    properties:
      status:
        type: text
        allowed:
          - pending
          - completed
          - under-review
          - rejected
      completedTime:
        type: date
      outcome:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
  Evidence:
    meaning: "Evidence refers to preserved records or artifacts that support incident analysis and accountability, ensuring integrity and enabling verification of events."
    aliases: []
    properties:
      status:
        type: text
      integrityVerified:
        type: boolean
      recordedTime:
        type: date
  Communication:
    meaning: "A communication is a controlled message sent to stakeholders regarding incidents, changes, or operational updates, ensuring that relevant parties are informed and aligned."
    aliases:
      - notification
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      sentTime:
        type: date
      archived:
        type: boolean
