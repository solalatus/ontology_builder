rules:
  declareMajorIncidentRule:
    conditions:
      - "incident status is not resolved, closed, or cancelled"
      - incident severity is sev1-critical or sev2-high
      - at least one impacted IT service is identified
      - an on-call engineer is assigned to oversee the declaration
  requiresRegulatoryNotificationRule:
    conditions:
      - the incident has a completed materiality assessment
      - the materiality assessment outcome is reportable
  evidenceIntegrityMetRule:
    conditions:
      - evidence is collected and recorded in accordance with established procedures
      - evidence integrity is verified
      - evidence is securely stored and not compromised
      - environmental conditions during evidence collection are documented
  documentationConditionsMetRule:
    conditions:
      - incident documentationComplete is true
      - evidence exists for the incident and evidence integrity is verified
      - all necessary communications for the incident are sent and archived
      - notes or logs of actions taken and decisions made during incident response are completed
  canExecuteEmergencyChange:
    conditions:
      - change emergencyChange is true
actions:
  declareMajorIncident:
    input: Incident
    preconditions:
      - declareMajorIncidentRule
    effect: The incident is marked as a major incident and majorIncidentDeclared becomes true.
    verification: Confirm the incident shows majorIncidentDeclared = true.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions: []
    effect: The incident is assigned to a resolver group.
    verification: Confirm the incident shows the assigned resolver group.
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: The alert status becomes acknowledged.
    verification: Confirm the alert status is acknowledged.
  sendStakeholderCommunication:
    input: Communication
    preconditions: []
    effect: The communication is sent and sentTime is recorded.
    verification: Confirm sentTime is recorded.
  executeEmergencyChange:
    input: Change
    preconditions:
      - canExecuteEmergencyChange
    effect: The emergency change is executed and change status becomes implemented.
    verification: Confirm change status is implemented.
  restoreBackup:
    input: BackupSet
    preconditions: []
    effect: The backup set is used to restore the related IT service.
    verification: Confirm the restore outcome is recorded successfully.
  documentEvidence:
    input: Evidence
    preconditions: []
    effect: The evidence is recorded for the incident.
    verification: Confirm the evidence record exists and is linked to the incident.
  conductMaterialityAssessment:
    input: Incident
    preconditions: []
    effect: "A materiality assessment is completed for the incident, with status completed and an outcome recorded."
    verification: Confirm the incident has a materiality assessment with completed status and a recorded outcome.
