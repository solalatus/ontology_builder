    meaning: This incident is associated with a specific alert that indicates a potential issue needing investigation.
    aliases: []
  - name: correlatesWith
    from: Incident
    to: Event
    meaning: This incident is associated with a specific event that signifies a noteworthy occurrence in the IT environment.
    aliases: []
  - name: hasRecoveryPlan
    from: ITService
    to: RecoveryPlan
