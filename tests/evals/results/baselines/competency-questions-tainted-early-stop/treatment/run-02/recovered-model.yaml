competency_questions:
  - id: cq1
    text: Which business services are impacted by this incident?
  - id: cq2
    text: What configuration items are affected by the current incident?
  - id: cq3
    text: Who is the service owner responsible for the affected IT service?
  - id: cq4
    text: Which resolver group should be assigned to triage and resolve this incident?
  - id: cq5
    text: What is the status of the regulatory notification for this incident?
  - id: cq6
    text: Does this incident meet the criteria for major incident declaration?
  - id: cq7
    text: Which alerts and events are correlated with the ongoing incident?
  - id: cq8
    text: What recovery plan is applicable for the service affected by this incident?
  - id: cq9
    text: Are there any outstanding corrective actions from previous post-incident reviews that could assist in resolution?
  - id: cq10
    text: Who must approve the emergency change related to this incident?
classes:
  Incident:
    meaning: An unplanned disruption or degradation of service that requires managed response and resolution efforts.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      closureTimestamp:
        type: date
      majorIncidentDeclarationTimestamp:
        type: date
  BusinessService:
    meaning: A customer-facing capability delivered by the bank that supports key business functions.
    aliases: []
    properties:
      identifier:
        type: text
      description:
        type: text
  ConfigurationItem:
    meaning: "A managed component in the IT environment, such as hardware, software, or documents, that is essential for delivering IT services."
    aliases:
      - CI
    properties:
      identifier:
        type: text
      type:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
          - under-maintenance
          - retired
  ITService:
    meaning: A technology capability that supports one or more business services and is governed by defined service-level objectives.
    aliases: []
    properties:
      identifier:
        type: text
      description:
        type: text
  ServiceOwner:
    meaning: The individual accountable for the overall management and governance of a specific IT service throughout its lifecycle.
    aliases: []
    properties:
      identifier:
        type: text
      contactInformation:
        type: text
  ResolverGroup:
    meaning: A team responsible for diagnosing and restoring services related to specific technology or service areas during incidents.
    aliases: []
    properties:
      identifier:
        type: text
      description:
        type: text
      contactInformation:
        type: text
  RegulatoryNotification:
    meaning: A formal communication prepared for submission to the appropriate regulatory authorities regarding significant incidents or changes.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submissionTimestamp:
        type: date
      approvalTimestamp:
        type: date
  Alert:
    meaning: A notification generated by monitoring systems that indicates a condition requiring attention or investigation.
    aliases: []
    properties:
      identifier:
        type: text
      severity:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
  Event:
    meaning: An observed occurrence or status change in the IT environment that may be relevant to operations.
    aliases: []
    properties:
      identifier:
        type: text
      timestamp:
        type: date
      type:
        type: text
  RecoveryPlan:
    meaning: A documented procedure detailing steps to restore an IT service and its dependencies after an incident or disruption.
    aliases: []
    properties:
      identifier:
        type: text
      recoveryTimeObjective:
        type: text
      recoveryPointObjective:
        type: text
  CorrectiveAction:
    meaning: null
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueDate:
        type: date
  PostIncidentReview:
    meaning: "A structured analysis conducted after an incident to evaluate its causes, effectiveness of the response, and identify corrective actions for improvement."
    aliases:
      - PIR
    properties:
      identifier:
        type: text
      reviewDate:
        type: date
      findingsSummary:
        type: text
  EmergencyChange:
    meaning: "A change implemented swiftly to address an urgent operational need, often linked to an active incident."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      implementationPlan:
        type: text
      backoutPlan:
        type: text
  ApplicationOwner:
    meaning: The person responsible for overseeing the operational fitness and performance of a particular application.
    aliases: []
    properties:
      identifier:
        type: text
      contactInformation:
        type: text
  TechnicalOwner:
    meaning: "The role accountable for the engineering, maintenance, and technical aspects of a configuration item."
    aliases: []
    properties:
      identifier:
        type: text
      contactInformation:
        type: text
  OnCallEngineer:
    meaning: A technical specialist available to respond to incidents requiring immediate operational support outside of regular working hours.
    aliases: []
    properties:
      identifier:
        type: text
      contactInformation:
        type: text
      availabilityStatus:
        type: text
        allowed:
          - available
          - unavailable
          - on-duty
          - off-duty
  SecurityOperationsCentre:
    meaning: "The function that monitors, investigates, and coordinates responses to cybersecurity threats and incidents within the bank."
    aliases:
      - SOC
    properties:
      identifier:
        type: text
      contactInformation:
        type: text
  ServiceCriticality:
    meaning: "A classification that indicates the importance of a service to business operations, influencing priority and response actions."
    aliases: []
    properties:
      identifier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      description:
        type: text
  IncidentCategory:
    meaning: "A classification that defines the type of incident, guiding the operational response and escalation processes."
    aliases: []
    properties:
      identifier:
        type: text
      description:
        type: text
  MaterialityAssessment:
    meaning: An evaluation process that determines the significance of an incident and whether it requires regulatory notification.
    aliases: []
    properties:
      outcomeResult:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      assessmentTimestamp:
        type: date
  ApprovedRole:
    meaning: "A designated role with the authority to approve specific actions, such as emergency changes, based on defined criteria."
    aliases: []
    properties:
      identifier:
        type: text
      description:
        type: text
  BackupSet:
    meaning: "A collection of recoverable data representing a specific state of a configuration item, typically used for restoration in case of incidents."
    aliases: []
    properties:
      identifier:
        type: text
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
relationships:
  - name: impacts
    from: Incident
    to: BusinessService
    meaning: This incident directly affects the operation or availability of the business service.
    aliases: []
  - name: affects
    from: Incident
    to: ConfigurationItem
    meaning: "This incident impacts the configuration item, potentially disrupting its functionality."
    aliases: []
  - name: affects
    from: Incident
    to: ITService
    meaning: "This incident has a direct impact on the IT service, resulting in a disruption or degradation of service."
    aliases: []
  - name: isOwnedBy
    from: ITService
    to: ServiceOwner
    meaning: This IT service is managed and governed by the designated service owner.
    aliases: []
  - name: isOwnedBy
    from: ITService
    to: ApplicationOwner
