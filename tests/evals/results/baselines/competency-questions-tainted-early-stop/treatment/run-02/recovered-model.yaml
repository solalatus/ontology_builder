rules:
  canDeclareMajorIncident:
    conditions:
      - incident severity is sev1-critical or sev2-high
      - at least one affected business service has a criticality level of tier-1-critical or tier-2-important
      - regulatory notification is potentially required due to potential business impact
      - coordination with the Security Operations Centre is required
      - impact is across multiple IT services or affects a significant number of users
  canExecuteEmergencyChange:
    conditions:
      - implementation plan must be present and correct
      - backout plan must be present and correct
      - emergency change is linked to an active incident
      - explicit approval has been obtained from the designated role
      - affected configuration items must be identified and documented
      - risk assessment for the emergency change must be completed and accepted
  mustSubmitRegulatoryNotification:
    conditions:
      - the incident is classified as reportable based on the materiality assessment outcome
      - the incident results in a significant impact on business operations or customers
      - the incident involves a data breach or compromise of sensitive information
      - the incident has potential regulatory consequences that need to be reported to authorities
actions:
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: incident status is updated to major incident
    verification: read incident and confirm major incident flag and declaration timestamp
  submitRegulatoryNotification:
    input: Incident
    preconditions:
      - mustSubmitRegulatoryNotification
    effect: regulatory notification status is updated to submitted
    verification: read regulatory notification and confirm status and submission timestamp
  executeEmergencyChange:
    input: Incident
    preconditions:
      - canExecuteEmergencyChange
    effect: the linked emergency change status is updated to implemented
    verification: "read the linked emergency change, run technical checks, confirm service health, and document implementation evidence"
  assignIncident:
    input: Incident
    preconditions: []
    effect: incident is assigned to a resolver group
    verification: read incident and confirm resolver group assignment
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: alert status is updated to acknowledged
    verification: read alert and confirm status is acknowledged
  conductMaterialityAssessment:
    input: Incident
    preconditions: []
    effect: materiality assessment is created and linked to the incident
    verification: read materiality assessment and confirm its linked incident and outcome
  performPostIncidentReview:
    input: Incident
    preconditions: []
    effect: post-incident review is documented and linked to the incident
    verification: read post-incident review and confirm it includes findings and linked incident details
  sendStakeholderCommunication:
    input: Incident
    preconditions: []
    effect: communication is sent to relevant stakeholders and documented
    verification: confirm that stakeholders have received the communication and that it aligns with the current status of the incident
  restoreBackup:
    input: BackupSet
    preconditions: []
    effect: backup data is restored to the target configuration item
    verification: validate data integrity and application functionality after restore
  closeIncident:
    input: Incident
    preconditions: []
    effect: incident status is updated to closed
    verification: read incident and confirm closure state and retained evidence
