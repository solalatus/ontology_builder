classes:
  Business Service:
    meaning: Customer-facing or business capability that is the highest level of service governed by IT operations.
    aliases: []
    properties:
      criticality:
        type: text
        allowed:
          - critical
          - important
          - standard
      RTO:
        type: number
        unit: hours
      RPO:
        type: number
        unit: hours
      customerImpactThreshold:
        type: text
      regulatoryImportance:
        type: text
      owner:
        type: text
      supportModel:
        type: text
  IT Service:
    meaning: Technology capability that supports one or more business services and forms part of the operational backbone.
    aliases: []
    properties:
      criticality:
        type: text
        allowed:
          - critical
          - important
          - standard
      RTO:
        type: number
        unit: hours
      RPO:
        type: number
        unit: hours
      customerImpactThreshold:
        type: text
      regulatoryImportance:
        type: text
      owner:
        type: text
      supportModel:
        type: text
  Application:
    meaning: Software system that provides operational functionality and supports IT services.
    aliases: []
    properties: {}
  Infrastructure Component:
    meaning: "Hardware, network device, storage system, or physical or virtual resource that supports applications and IT services."
    aliases:
      - hardware
      - network device
      - storage system
      - physical resource
      - virtual resource
    properties: {}
  Vendor:
    meaning: External organization providing services or technology support crucial for operations.
    aliases: []
    properties: {}
  Team:
    meaning: Cross-functional or specialist group involved in maintaining and managing services.
    aliases:
      - IT Operations Team
      - Service Desk
      - Network Operations Centre
      - Security Operations Centre
      - Incident Response Team
      - resolver group
    properties: {}
  Incident:
    meaning: "An event disrupting or threatening normal operation of services, applications, infrastructure, data, or customers."
    aliases: []
    properties:
      incidentType:
        type: text
        allowed:
          - Major Incident
          - Cybersecurity Incident
          - Operational Incident
      severity:
        type: text
        allowed:
          - Sev1
          - Sev2
          - Sev3
          - Sev4
      customerImpact:
        type: text
      duration:
        type: number
        unit: hours
      regulatoryImpact:
        type: text
      financialLoss:
        type: number
      securityImpact:
        type: text
  Role:
    meaning: Named decision or coordination responsibility used during incident management.
    aliases:
      - Incident Commander
      - Major Incident Manager
      - Service Owner
      - Technology Owner
      - Business Owner
      - Communications Lead
      - Risk and Compliance Team
    properties: {}
  Recovery Plan:
    meaning: Documented plan for restoring a service within acceptable recovery objectives.
    aliases: []
    properties:
      recoveryEnvironmentAvailable:
        type: boolean
      acceptableRecoveryPoint:
        type: boolean
  Emergency Change:
    meaning: Urgent change made to restore service or mitigate active incident impact.
    aliases: []
    properties:
      implementationPlanDocumented:
        type: boolean
      backoutPlanDocumented:
        type: boolean
      affectedConfigurationItemsIdentified:
        type: boolean
      riskAccepted:
        type: boolean
  Recovery Action:
    meaning: Action taken during an incident to restore service using pre-existing procedures or previous functional states.
    aliases: []
    properties:
      actionType:
        type: text
        allowed:
          - Failover
          - Rollback
          - Restart
          - Restore from Backup
          - Traffic Reroute
          - Capacity Scale-Up
          - Vendor Intervention
          - Security Containment
      outcome:
        type: text
      verificationResult:
        type: text
  Evidence:
    meaning: "Captured proof of decisions, actions, approvals, timings, results, communications, system state, or submissions during incident management."
    aliases: []
    properties:
      evidenceType:
        type: text
        allowed:
          - Incident Timeline
          - Decision Log
          - Chat Transcript
          - Bridge Recording
          - Monitoring Alert
          - System Log
          - Change Record
          - Approval Records
          - Recovery Validation
          - Customer Notification
          - Regulator Submission
          - Action Log
          - Timestamp
          - Responsible Personnel
          - Verification Result
          - Service Health Indicator
          - Application Response
          - Approval Documentation
          - Implementation Log
      timestamped:
        type: boolean
      attributable:
        type: boolean
      immutable:
        type: boolean
      retentionPeriod:
        type: number
        unit: years
  Communication:
    meaning: "Message or briefing issued during an incident to stakeholders, customers, executives, regulators, service desk, or vendors."
    aliases: []
    properties:
      communicationType:
        type: text
        allowed:
          - Internal Stakeholder Update
          - Customer Communication
          - Executive Briefing
          - Regulator Notification
          - Service Desk Bulletin
          - Vendor Update
      currentStatus:
        type: text
        allowed:
          - investigating
          - contained
          - recovering
          - restored
          - monitoring
      customerImpact:
        type: text
      workaround:
        type: text
      estimatedRestorationTime:
        type: date
      nextUpdateTime:
        type: date
      sentTime:
        type: date
  Evidence Pack:
    meaning: "Organized collection of incident evidence prepared for review, audit, or regulatory submission."
    aliases: []
    properties:
      packType:
        type: text
        allowed:
          - Post-Incident Review Pack
          - Audit Pack
          - Regulatory Submission Pack
  Post-Incident Review:
    meaning: "Formal review conducted after qualifying incidents to identify causes, gaps, actions, and lessons learned."
    aliases:
      - PIR
      - post-incident review
    properties:
      rootCauseAnalysis:
        type: text
      contributingFactors:
        type: text
      controlGaps:
        type: text
      lessonsLearned:
        type: text
      dueDate:
        type: date
      completedWithinDays:
        type: number
        unit: days
  Corrective Action:
    meaning: "Action assigned after a post-incident review to address findings, reduce risk, or prevent recurrence."
    aliases: []
    properties:
      actionType:
        type: text
        allowed:
          - Risk Action
          - Problem Record
          - Change Backlog Item
          - Control Remediation
          - Service Improvement Action
      owner:
        type: text
      dueDate:
        type: date
      status:
        type: text
        allowed:
          - open
          - in progress
          - complete
          - overdue
  Materiality Assessment:
    meaning: "Formal assessment of an incident's significance and whether regulatory notification is required."
    aliases: []
    properties:
      customerHarm:
        type: text
      serviceUnavailabilityDuration:
        type: number
        unit: hours
      dataBreach:
        type: boolean
      cyberImpact:
        type: text
      financialMarketImpact:
        type: text
      criticalServiceDisruption:
        type: text
      thresholdBreach:
        type: boolean
      reportable:
        type: boolean
  Regulatory Submission:
    meaning: "Formal notification, update, final report, or supporting response submitted to a regulator for a reportable incident."
    aliases: []
    properties:
      submissionType:
        type: text
        allowed:
          - Initial Notification
          - Update
          - Final Report
          - Follow-up Response
      submissionStatus:
        type: text
        allowed:
          - draft
          - awaiting approval
          - approved
          - submitted
          - follow-up required
      dueWithin:
        type: number
        unit: hours
      submittedTime:
        type: date
  Regulator:
    meaning: "Regulatory authority that receives incident notifications, updates, final reports, or follow-up responses."
    aliases: []
    properties: {}
  Alert:
    meaning: Condition raised by monitoring systems indicating an issue that may require attention.
    aliases: []
    properties:
      detectionSource:
        type: text
        allowed:
          - Monitoring Alert
          - Synthetic Monitoring
          - Security Alert
          - Batch Failure
      severityLevel:
        type: text
        allowed:
          - Sev1
          - Sev2
          - Sev3
          - Sev4
      confirmedImpact:
        type: boolean
      multipleRelatedSignals:
        type: boolean
  Event:
    meaning: Observed occurrence that may or may not lead to an incident and is often less urgent.
    aliases: []
    properties:
      detectionSource:
        type: text
        allowed:
          - Monitoring Alert
          - Synthetic Monitoring
          - Vendor Notification
          - Security Alert
          - Batch Failure
          - Business Operations Report
  Ticket:
    meaning: Documented user-reported or staff-reported issue that may lead to investigation or promotion to an incident.
    aliases: []
    properties:
      detectionSource:
        type: text
        allowed:
          - Customer Report
          - Service Desk Ticket
          - Business Operations Report
      severityLevel:
        type: text
        allowed:
          - Sev1
          - Sev2
          - Sev3
          - Sev4
      confirmedImpact:
        type: boolean
      multipleRelatedSignals:
        type: boolean
  Triage:
    meaning: "Initial assessment and routing of alerts, events, or tickets to determine impact, service linkage, severity, ownership, timeline, and escalation path."
    aliases: []
    properties:
      impactAssessed:
        type: boolean
      affectedServiceIdentified:
        type: boolean
      severityAssigned:
        type: boolean
      ownerAssigned:
        type: boolean
      timelineStarted:
        type: boolean
      escalatedToMajorIncidentProcess:
        type: boolean
