classes:
  Service:
    meaning: A bank IT service that operations governance manages and protects.
    aliases: []
    properties:
      criticalityTier:
        type: text
        allowed:
          - Tier 1 - Critical
          - Tier 2 - Important
          - Tier 3 - Standard
      RTO:
        type: number
        unit: minutes
      RPO:
        type: number
        unit: minutes
      MTD:
        type: number
        unit: minutes
      customerImpactThreshold:
        type: text
  Technical Dependency:
    meaning: A technology component or upstream/downstream dependency that can affect a service.
    aliases: []
    properties:
      dependencyType:
        type: text
        allowed:
          - Application Dependency
          - Database Dependency
          - Network Dependency
          - Third-Party Provider
          - Data Center
          - Cloud Service
          - Batch Process
          - Identity Service
  Incident:
    meaning: An unplanned disruption or degradation of service.
    aliases: []
    properties:
      severityLevel:
        type: text
        allowed:
          - Sev 1
          - Sev 2
          - Sev 3
      state:
        type: text
        allowed:
          - open
          - resolved
          - closed
          - cancelled
      customerImpact:
        type: text
      paymentDisruption:
        type: boolean
      regulatoryBreachRisk:
        type: boolean
      financialLossPotential:
        type: text
      duration:
        type: number
        unit: minutes
      geographicSpread:
        type: text
      dataIntegrityConcerns:
        type: boolean
      cyberInvolvement:
        type: boolean
  Major Incident:
    meaning: An incident requiring exceptional coordination due to high impact on business operations or compliance.
    aliases: []
    properties: {}
  Decision Owner:
    meaning: A person or role accountable for making operational or incident-management decisions.
    aliases: []
    properties: {}
  Recovery:
    meaning: The work performed to restore service after an incident.
    aliases: []
    properties:
      recoveryStrategy:
        type: text
        allowed:
          - Failover
          - Rollback
          - Workaround
          - Restart
          - Restore from Backup
          - Traffic Reroute
          - Manual Processing
          - Vendor Remediation
  Emergency Change:
    meaning: An urgent change required when immediate action is needed to restore service or safeguard against further impact and the standard change process cannot be followed in time.
    aliases: []
    properties:
      emergencyChangeType:
        type: text
        allowed:
          - Quick Patch or Fix
          - Configuration Change
          - Deployment of Backup Systems
  Evidence:
    meaning: "Material retained to support incident handling, review, audit, or regulatory reporting."
    aliases: []
    properties:
      evidenceType:
        type: text
        allowed:
          - Timeline
          - Bridge Notes
          - Decisions
          - Approvals
          - Monitoring Data
          - Logs
          - Screenshots
          - Customer Impact Analysis
          - Communications
          - Change Records
      retentionRequirement:
        type: text
      completenessSignedOff:
        type: boolean
  Communication:
    meaning: A message or update sent to stakeholders during or after an incident.
    aliases: []
    properties:
      communicationType:
        type: text
        allowed:
          - Initial Notification
          - Status Update
          - Executive Briefing
          - Customer Notice
          - Regulator Notification
          - Service Restoration Notice
          - Post-Incident Summary
      updateCadence:
        type: text
      nextUpdateTimeRequired:
        type: boolean
      knownFactsOnly:
        type: boolean
  Review:
    meaning: A post-incident or governance assessment of incident handling and outcomes.
    aliases: []
    properties: {}
  Regulatory Reporting Workflow:
    meaning: "The process used to assess, prepare, approve, and submit required regulatory reports."
    aliases: []
    properties:
      notificationDeadlineBasis:
        type: text
        allowed:
          - Detection Time
          - Confirmation Time
          - Classification Time
          - Impact Threshold Breach Time
  Business Service:
    meaning: A customer-facing service that represents a specific business capability.
    aliases: []
    properties: {}
  IT Service:
    meaning: An underlying technology capability that supports one or more business services.
    aliases: []
    properties: {}
  Application:
    meaning: A specific software system that provides operational functionality to support IT services.
    aliases: []
    properties: {}
  Platform and Infrastructure Component:
    meaning: "The hardware or software environment where applications run, including servers, databases, and networks."
    aliases:
      - Platform
      - Infrastructure Component
    properties: {}
  Business Process:
    meaning: "A coordinated set of activities leading to a business outcome, broader than an individual service."
    aliases: []
    properties: {}
  Service Owner:
    meaning: The role accountable for the lifecycle and performance of a specific IT service.
    aliases: []
    properties: {}
  Application Owner:
    meaning: The role responsible for a particular application meeting functional and operational requirements.
    aliases: []
    properties: {}
  Technical Owner:
    meaning: The role that manages engineering aspects of configuration items to maintain operational fitness.
    aliases: []
    properties: {}
  Business Owner:
    meaning: The role responsible for the strategic direction of a business service or process.
    aliases: []
    properties: {}
  Configuration Item:
    meaning: A managed technology item such as an infrastructure component whose configuration and operational fitness are governed.
    aliases:
      - CI
    properties: {}
  Detection Source:
    meaning: A channel or mechanism through which an incident is identified.
    aliases: []
    properties:
      sourceType:
        type: text
        allowed:
          - Monitoring Alerts
          - Customer Complaints
          - Staff Reports
          - Third-Party Notifications
          - Synthetic Monitoring
          - Security Operations
          - Batch Failures
  Incident Manager:
    meaning: "The role responsible for coordinating the overall incident response, communication, and resource allocation."
    aliases: []
    properties: {}
  Major Incident Manager:
    meaning: "The role that oversees the additional coordination required for complex, high-impact major incidents."
    aliases: []
    properties: {}
  Technical Lead:
    meaning: The role that provides technical expertise and guides resolver teams on resolution actions.
    aliases: []
    properties: {}
  Communications Lead:
    meaning: The role that manages internal and external communications for an incident.
    aliases: []
    properties: {}
  Business Lead:
    meaning: The role that represents business interests and alignment with operational goals during incident handling.
    aliases: []
    properties: {}
  Executive Sponsor:
    meaning: The executive-level stakeholder who supports resources and prioritization during major incidents.
    aliases: []
    properties: {}
  Incident Commander:
    meaning: "The role responsible for overall coordination and management of incidents, including recovery efforts."
    aliases: []
    properties: {}
  Emergency Change Advisory Board:
    meaning: A delegated group tasked with rapid approval of emergency changes.
    aliases:
      - ECAB
      - Emergency CAB
    properties: {}
  Designated Approver:
    meaning: A person or role with delegated authority to approve an emergency change when rapid action is needed.
    aliases: []
    properties: {}
  Recovery Validation:
    meaning: A check used to confirm that service has been restored after recovery.
    aliases: []
    properties:
      validationType:
        type: text
        allowed:
          - Technical Validation
          - Business Validation
          - Customer-Impact Validation
          - Monitoring Stability Period
          - Evidence Capture
  Monitoring Stability Period:
    meaning: A defined observation period used to ensure recovered service performance remains stable.
    aliases: []
    properties: {}
  Audience:
    meaning: A stakeholder group that receives incident communications.
    aliases: []
    properties:
      audienceType:
        type: text
        allowed:
          - Internal Stakeholders
          - Business Owners
          - Executives
          - Service Desk
          - Frontline Staff
          - Customers
          - Third Parties
          - Regulators
          - Media
  Department Head:
    meaning: A departmental leader who may approve internal incident communications depending on content.
    aliases: []
    properties: {}
  Estimated Recovery Time:
    meaning: The estimated timeframe for when affected services are expected to be restored.
    aliases:
      - ERT
    properties:
      value:
        type: number
        unit: minutes
  Decision Record:
    meaning: "A record of a critical incident decision, including the decision made and rationale."
    aliases: []
    properties:
      decisionType:
        type: text
        allowed:
          - Severity Declaration
          - Major-Incident Escalation
          - Recovery Option Selection
          - Emergency Change Approval
          - Customer/Regulator Notification Decision
          - Service Restoration Decision
      rationale:
        type: text
  Post-Incident Review:
    meaning: "A review performed after qualifying incidents to analyze cause, response, learning, and required improvements."
    aliases:
      - PIR
      - Post Incident Review
    properties: {}
  Review Output:
    meaning: A finding or deliverable produced by a post-incident review.
    aliases: []
    properties:
      outputType:
        type: text
        allowed:
          - Root Cause
          - Contributing Factors
          - Corrective Actions
          - Control Improvements
          - Owner Assignments
          - Lessons Learned
  Corrective Action:
    meaning: An action required to address root cause or prevent recurrence after an incident.
    aliases: []
    properties:
      dueDate:
        type: date
      status:
        type: text
        allowed:
          - open
          - in progress
          - complete
          - overdue
  Governance Team:
    meaning: A team that reviews governance compliance and may approve evidence-pack completeness before archiving.
    aliases: []
    properties: {}
  Compliance Team:
    meaning: A team that reviews compliance requirements and may approve evidence-pack completeness before archiving.
    aliases: []
    properties: {}
  Evidence Pack:
    meaning: "The complete package of incident evidence retained for review, audit, and regulatory purposes."
    aliases: []
    properties:
      retentionRequirement:
        type: text
      completenessSignedOff:
        type: boolean
  Regulatory Reporting Assessment:
    meaning: The assessment of whether an incident creates a regulatory notification obligation.
    aliases: []
    properties:
      reportingTrigger:
        type: text
        allowed:
          - Customer Harm
          - Payment-System Impact
          - Cyber Involvement
          - Data Integrity Issues
          - Operational Resilience Threshold Breach
          - Service Unavailability Duration
          - Regulatory Breach Risk
      reportable:
        type: boolean
  Regulatory Report:
    meaning: The formal report prepared and submitted to a regulator about a reportable incident.
    aliases: []
    properties:
      approvalStatus:
        type: text
        allowed:
          - draft
          - under review
          - approved
          - submitted
      nextUpdateRequired:
        type: boolean
  Regulatory Reporting Team:
    meaning: "The team that leads reportability assessment, prepares regulatory reports, and may submit them."
    aliases: []
    properties: {}
  Regulatory Reporting Lead:
    meaning: The role that endorses regulatory reports for accuracy and completeness.
    aliases: []
    properties: {}
  Legal:
    meaning: Legal advisors who consider legal implications of reportability and regulatory communications.
    aliases: []
    properties: {}
  Operational Resilience:
    meaning: The team or function that assesses operational capability impact and resilience threshold breaches.
    aliases: []
    properties: {}
  Risk:
    meaning: The risk management function that analyzes potential regulatory risks associated with an incident.
    aliases: []
    properties: {}
  Compliance Officer:
    meaning: A designated compliance role that may submit regulatory reports and ensure submission meets regulatory requirements.
    aliases: []
    properties: {}
  Regulator:
    meaning: An external authority that receives required incident notifications or reports.
    aliases: []
    properties: {}
