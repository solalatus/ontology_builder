rules:
  majorIncidentEscalationCandidate:
    conditions:
      - "Incident state is not resolved, closed, or cancelled."
      - Incident severity level is Sev 1 or Sev 2.
      - At least one Tier 1 - Critical business service is impacted.
      - Customer effect is quantifiable.
      - An incident commander is assigned for coordination.
  emergencyChangeRequired:
    conditions:
      - Immediate action is necessary to restore service or safeguard against further impact.
      - The situation demands deviation from standard change processes due to time constraints.
  recoveryCanBeConfirmed:
    conditions:
      - Technical validation confirms systems and applications are functioning correctly.
      - Business validation confirms the service meets operational needs when business confirmation is required.
      - Customer-impact validation confirms customer functionality has returned to normal when customer impact occurred.
      - Monitoring stability period shows stable service performance.
      - Recovery evidence has been captured.
  sev1CommunicationCadence:
    conditions:
      - Sev 1 incidents require status updates every 30 minutes.
      - "Event-driven updates are sent when significant developments occur, even outside the scheduled cadence."
  sev2CommunicationCadence:
    conditions:
      - Sev 2 incidents require status updates every 60 minutes.
      - "Event-driven updates are sent when significant developments occur, even outside the scheduled cadence."
  communicationContentComplete:
    conditions:
      - Communication states impacted services.
      - Communication includes the start time when the incident was first detected or reported.
      - Communication describes current impact.
      - Communication includes workaround information when applicable.
      - Communication includes estimated recovery time when available.
      - Communication includes next update time.
      - Communication includes customer guidance when customers are affected.
      - Communication contains known facts only.
  externalCommunicationApproved:
    conditions:
      - "Customer, regulator, and media communications are approved by the Incident Commander, Major Incident Manager, or Communications Lead."
  internalCommunicationApproved:
    conditions:
      - Internal communications receive required sign-off from stakeholders such as department heads or service owners depending on content.
  postIncidentReviewRequired:
    conditions:
      - A post-incident review is mandatory for all major incidents.
      - A post-incident review is required for Sev 1 incidents.
      - "A post-incident review is required for high-impact Sev 2 incidents, especially where business or regulatory implications exist."
      - A post-incident review is required for regulatory-impacting events.
      - A post-incident review is required for recurring incidents.
  evidencePackComplete:
    conditions:
      - "Evidence pack includes timeline, bridge notes, decisions, approvals, monitoring data, logs, customer impact analysis, communications, and change records where applicable."
      - Critical decisions are recorded with rationale.
      - Evidence is retained according to regulatory standards and internal governance policies.
      - Incident Commander or Major Incident Manager signs off completeness.
      - Governance or Compliance Team reviews and approves completeness when required.
  regulatoryReportingAssessmentRequired:
    conditions:
      - Incident involves customer harm or significant customer dissatisfaction.
      - Incident affects payment processing systems.
      - Incident has cyber involvement that threatens data integrity or confidentiality.
      - Incident compromises customer or financial data integrity.
      - Incident breaches operational resilience thresholds.
      - Incident causes extended unavailability of key services.
      - Incident creates regulatory breach risk.
  regulatoryReportContentComplete:
    conditions:
      - Regulatory report includes incident summary.
      - Regulatory report includes impacted services and their criticality.
      - "Regulatory report includes customer impact, including affected users or transactions when known."
      - Regulatory report includes incident start time.
      - Regulatory report includes duration.
      - Regulatory report includes root cause when known.
      - Regulatory report includes mitigation actions.
      - Regulatory report includes recovery status.
      - Regulatory report includes next update timing.
      - Regulatory report includes remediation plan.
  regulatoryReportApproved:
    conditions:
      - "Regulatory report is endorsed by the Incident Commander, Regulatory Reporting Lead, or equivalent approver for accuracy and completeness."
  regulatoryReportDeadlineSet:
    conditions:
      - "Notification deadline basis is identified as detection time, confirmation time, classification time, or impact threshold breach time according to the applicable regulation."
