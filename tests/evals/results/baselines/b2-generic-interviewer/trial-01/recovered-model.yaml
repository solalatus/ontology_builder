rules:
  majorIncidentCriteria:
    conditions:
      - Incident has significant impact on customers or business operations.
      - Incident affects a critical or high-tier business service.
      - "Incident duration exceeds the bank's escalation threshold."
      - Incident impacts payment systems.
      - Incident meets a regulatory reporting or regulatory concern threshold.
      - Incident presents material reputational risk.
      - Senior executive concern or involvement triggers the major-incident process.
  severityAndPriorityCanDiffer:
    conditions:
      - Severity reflects technical impact while priority reflects required response speed based on business considerations.
      - A workaround may reduce priority even when technical severity remains high.
  durationBasedMajorIncidentAssessment:
    conditions:
      - Duration-based escalation thresholds are fixed by criticality tier and service type.
      - A Tier 1 outage lasting over 15 minutes triggers major-incident assessment.
  executiveEscalationCriteria:
    conditions:
      - Incident has significant impact on customers or operations.
  crisisManagementEscalationCriteria:
    conditions:
      - Incident presents evident reputational risk or broader operational impact.
  cyberResponseEscalationCriteria:
    conditions:
      - Incident has a major cybersecurity concern.
  legalComplianceEscalationCriteria:
    conditions:
      - Incident has regulatory implications or potential breaches.
  regulatoryNotificationCriteria:
    conditions:
      - Incident nature and extent indicate compliance risk or regulatory notification obligation.
  emergencyChangeApprovalCriteria:
    conditions:
      - "Emergency change requires agreement of the Incident Commander and relevant stakeholders, often including the Technical Owner."
  disasterRecoveryInvocationCriteria:
    conditions:
      - "Disaster recovery invocation requires Incident Commander and Business Lead involvement, and may involve the Crisis Management Team."
  customerCommunicationApprovalCriteria:
    conditions:
      - Customer communication is managed by the Communications Lead and approved by the Incident Commander and Business Lead.
  residualRiskAcceptanceCriteria:
    conditions:
      - Residual risk acceptance is a business impact decision made by the Business Lead and Executive Sponsor.
  recoveryWorkflowSequence:
    conditions:
      - "Incident response normally proceeds through diagnosis, workaround, fix, emergency change when immediate implementation is required, recovery, and monitoring."
  emergencyChangeImplementationApprovalCriteria:
    conditions:
      - "During a live incident, the Incident Commander approves implementation of emergency changes."
      - The Incident Commander may consult the relevant Technical Owner or Service Owner before approving implementation.
  emergencyChangeEvidenceCriteria:
    conditions:
      - "Before implementation, emergency change evidence includes incident details and impact, approval, implementation plan, and backout plan."
      - "After implementation, emergency change evidence includes successful execution verification, observed service state, performance or stability changes, and stakeholder notifications."
  rollbackCriteria:
    conditions:
      - Rollback is evaluated when post-implementation monitoring indicates deterioration rather than improvement.
      - Rollback is evaluated when stakeholder feedback reports unresolved issues or service degradation after the change.
      - Rollback is evaluated when predefined implementation-plan or backout-plan performance criteria are not met.
  disasterRecoveryUsageCriteria:
    conditions:
      - Disaster recovery is invoked when a significant incident causes complete service unavailability and requires execution of a predefined recovery plan.
  failoverUsageCriteria:
    conditions:
      - Failover is used when a secondary environment must be brought online to maintain service continuity during an outage of the primary system.
  serviceIsolationUsageCriteria:
    conditions:
      - Service isolation is used when a component must be disconnected from the network or dependencies to prevent impact to other services.
      - Service isolation is often used for detected security threats or severe malfunctions.
  auditEvidenceAcceptabilityCriteria:
    conditions:
      - "Evidence must be authentic, with integrity supported by timestamps or secure storage."
      - Evidence must be accurate and represent actual events or actions taken.
      - Evidence must be complete enough to support incident assessment and response decisions.
      - "Evidence must be traceable to incident records, approvals, and actions taken."
  evidenceRetentionCriteria:
    conditions:
      - Evidence retention is influenced by incident severity and regulatory impact.
      - "Critical incidents require longer retention, usually a minimum of several years in line with compliance obligations."
  customerCommunicationTriggerCriteria:
    conditions:
      - Customer communication is triggered by confirmed customer impact.
      - Customer communication is triggered by prolonged outages affecting service availability.
      - Customer communication is triggered by payment-system or transaction impact.
      - Customer communication is triggered by demonstrable reputational risk or loss of customer trust.
      - Customer communication is triggered by regulatory expectations regarding incident communication.
  regulatorNotificationTriggerCriteria:
    conditions:
      - Regulator notification is triggered by significant payment-system impact affecting financial transactions.
      - Regulator notification is triggered by confirmed data breach or data integrity issue.
      - Regulator notification is triggered by failure to meet operational resilience thresholds.
      - Regulator notification is triggered by material customer detriment affecting numerous customers or services.
      - Regulator notification is triggered by broad financial stability concern.
      - Regulator notification is triggered by extended incident duration that could raise compliance flags.
  communicationLifecycleCriteria:
    conditions:
      - "Incident communications follow fixed statuses of Drafted, Approved, Issued, Updated, and Withdrawn."
  regulatoryReportingClockCriteria:
    conditions:
      - Communication deadlines and regulatory reporting timelines are tracked to ensure internal and external obligations are met.
  regulatorNotificationWorkflowCriteria:
    conditions:
      - "Regulatory notification workflows distinguish initial regulator notification, interim updates, and final report or closure notification."
      - Initial regulator notification outlines initial findings and impacts.
      - "Interim updates provide incident status, emerging insights, and ongoing actions."
      - "Final report or closure notification provides full incident details, final outcomes, actions taken, and remedial measures once resolved."
  regulatoryReportingClockStartCriteria:
    conditions:
      - Regulatory reporting clocks are typically based on initial detection time.
      - "In some cases, major incident declaration time may start the clock for specific reporting requirements."
  customerCommunicationGovernanceCriteria:
    conditions:
      - Customer communications use pre-approved templates for common scenarios.
      - Significant customer communications with potential legal implications require legal or compliance review.
      - Channel-specific approval may be required depending on audience and delivery method.
  postIncidentReviewRequiredCriteria:
    conditions:
      - Post-incident review is required for all incidents with majorIncidentDeclared true.
      - Post-incident review is required for Sev 1 or Sev 2 incidents with substantial customer impact or significant operational response.
      - Post-incident review is required for regulatory incidents with compliance obligations.
      - Post-incident review is required for repeat incidents where unresolved issues reoccur.
  problemRecordCreationCriteria:
    conditions:
      - A problem record is created when root cause is unknown and requires further investigation.
      - A problem record is created when an incident is recurring.
      - A problem record is typically mandatory for major incidents.
  correctiveActionTrackingCriteria:
    conditions:
      - Each corrective action has an assigned owner.
      - Each corrective action has a due date.
      - Corrective actions may have risk ratings to evaluate impact and urgency.
      - "Corrective actions are tracked through Open, In progress, Implemented, Verified, and Closed statuses."
      - Significant corrective actions affecting high-priority services or business functions may require executive oversight.
  incidentClosureCriteria:
    conditions:
      - An incident cannot be closed until the incident timeline is fully documented and complete.
      - An incident cannot be closed until evidence is fully documented and complete.
  postIncidentReviewClosureCriteria:
    conditions:
      - A post-incident review cannot be closed until all identified actions have been assigned.
      - A post-incident review cannot be closed until an implementation plan is in place.
  playbookRunbookUsageCriteria:
    conditions:
      - "Playbooks and runbooks provide predefined response procedures by service, scenario, and severity level."
      - Incident handlers use playbooks and runbooks to ensure consistent and efficient response to known incident types.
  operationalResilienceExerciseCriteria:
    conditions:
      - Tabletop exercises evaluate response strategies and team readiness using hypothetical scenarios.
      - Failover tests validate disaster recovery readiness and failover procedures.
      - Cyber simulations assess cyber incident response and security measure effectiveness.
      - Regulatory scenario tests test readiness to meet compliance obligations.
  controlObligationCriteria:
    conditions:
      - "Control obligations cover evidence completeness, communication update cadence, escalation timeframes, RTO and RPO compliance, and disaster recovery test frequency."
  governanceReportingCriteria:
    conditions:
      - "Governance committee reporting includes incident count by severity, time to detect, time unresolved, time to restore, SLA or RTO breaches, repeat incidents, overdue corrective actions, and regulatory notification status."
  governanceForumOversightCriteria:
    conditions:
      - Governance forums oversee incident trends and patterns.
      - Governance forums oversee operational resilience risks and vulnerabilities.
      - Governance forums oversee corrective-action closure.
      - Governance forums oversee regulatory compliance themes and follow-up.
