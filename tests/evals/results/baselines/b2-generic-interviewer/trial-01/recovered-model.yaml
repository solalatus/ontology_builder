classes:
  BusinessService:
    meaning: "Customer- or business-facing capability delivered by the bank, often revenue-driving and directly serving customers."
    aliases:
      - business service
    properties:
      criticalityTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      regulatoryImpact:
        type: text
      customerImpact:
        type: text
      recoveryTimeObjective:
        type: number
        unit: hours
      operationalResilienceTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      geography:
        type: text
      paymentSystemRelevance:
        type: boolean
  CustomerFacingService:
    meaning: A specific channel through which customers access banking services.
    aliases:
      - customer-facing service
      - channel
    properties:
      criticalityTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      customerImpact:
        type: text
      geography:
        type: text
  ITService:
    meaning: Managed technology capability that supports one or more business services.
    aliases:
      - IT service
      - technology service
    properties:
      criticalityTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      recoveryTimeObjective:
        type: number
        unit: hours
      operationalResilienceTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      geography:
        type: text
      paymentSystemRelevance:
        type: boolean
  Application:
    meaning: Software system implementing business functionality; not equivalent to an IT service itself.
    aliases:
      - application
      - software system
    properties:
      criticalityTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      recoveryTimeObjective:
        type: number
        unit: hours
      operationalResilienceTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      geography:
        type: text
      paymentSystemRelevance:
        type: boolean
  InfrastructureComponent:
    meaning: "Physical or virtual technology component such as a server, storage system, virtual machine, or network device supporting IT services."
    aliases:
      - infrastructure component
      - server
      - storage system
      - virtual machine
      - network device
    properties:
      criticalityTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      geography:
        type: text
  Database:
    meaning: Data store that underpins applications.
    aliases:
      - database
      - data store
    properties:
      criticalityTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      recoveryTimeObjective:
        type: number
        unit: hours
      geography:
        type: text
  NetworkSegment:
    meaning: "Connectivity segment pivotal to functioning of IT services, especially during connectivity incidents."
    aliases:
      - network segment
    properties:
      criticalityTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      geography:
        type: text
  ThirdPartyService:
    meaning: Externally provided service the bank relies on for business functionality.
    aliases:
      - third-party service
      - externally provided service
      - vendor service
    properties:
      criticalityTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      regulatoryImpact:
        type: text
      recoveryTimeObjective:
        type: number
        unit: hours
      operationalResilienceTier:
        type: text
        allowed:
          - Tier 1 Critical
          - Tier 2 Important
          - Tier 3 Standard
          - Tier 4 Supporting
      geography:
        type: text
      paymentSystemRelevance:
        type: boolean
  DataCenterOrSite:
    meaning: Physical location where infrastructure and services are hosted.
    aliases:
      - data center
      - site
      - physical location
    properties:
      geography:
        type: text
  ServiceOwner:
    meaning: Accountable owner for a service or application who supports escalation and decision-making.
    aliases:
      - service owner
      - owner
    properties: {}
  Incident:
    meaning: "An unplanned interruption, degradation, or security condition requiring managed response; major-incident status is represented on the incident rather than as a separate real-world object."
    aliases:
      - incident
      - unplanned disruption
    properties:
      conditionType:
        type: text
        allowed:
          - service degradation
          - outage
          - security condition
          - data issue
          - third-party failure
      severityLevel:
        type: text
        allowed:
          - Sev 1 Critical
          - Sev 2 High
          - Sev 3 Medium
          - Sev 4 Low
      priorityLevel:
        type: text
        allowed:
          - P1 Critical
          - P2 High
          - P3 Medium
          - P4 Low
      customerImpact:
        type: text
      businessImpact:
        type: text
      regulatoryImpact:
        type: text
      reputationalRisk:
        type: text
      paymentSystemImpact:
        type: boolean
      duration:
        type: number
        unit: hours
      majorIncidentDeclared:
        type: boolean
      lifecycleStatus:
        type: text
        allowed:
          - New
          - Acknowledged
          - Investigating
          - Contained
          - Recovering
          - Monitoring
          - Resolved
          - Closed
          - Cancelled
  MajorIncident:
    meaning: Deprecated modeling convenience; use Incident with majorIncidentDeclared set to true.
    aliases:
      - major incident
    properties:
      severityLevel:
        type: text
        allowed:
          - Sev 1 Critical
          - Sev 2 High
          - Sev 3 Medium
          - Sev 4 Low
      priorityLevel:
        type: text
        allowed:
          - P1 Critical
          - P2 High
          - P3 Medium
          - P4 Low
      customerImpact:
        type: text
      businessImpact:
        type: text
      regulatoryImpact:
        type: text
      reputationalRisk:
        type: text
      paymentSystemImpact:
        type: boolean
      duration:
        type: number
        unit: hours
      executiveConcern:
        type: boolean
  MonitoringAlert:
    meaning: Alert generated by monitoring tools or SIEM that may raise an incident.
    aliases:
      - monitoring alert
      - SIEM alert
    properties: {}
  CustomerComplaint:
    meaning: Complaint from a customer that may raise or evidence an incident.
    aliases:
      - customer complaint
    properties: {}
  ServiceDeskTicket:
    meaning: Ticket initiated by users or staff that may raise an incident.
    aliases:
      - service desk ticket
    properties: {}
  BusinessEscalation:
    meaning: Escalation from internal business stakeholders that may raise an incident.
    aliases:
      - business escalation
    properties: {}
  ThirdPartyNotification:
    meaning: Notification from a third-party supplier regarding disruption or risk in their service.
    aliases:
      - third-party supplier notification
      - supplier notification
    properties: {}
  RegulatoryAlert:
    meaning: Alert indicating potential compliance or regulatory issue that may raise an incident.
    aliases:
      - regulatory alert
    properties: {}
  SecurityAlert:
    meaning: Alert from the Security Operations Centre indicating a possible security event affecting data or services.
    aliases:
      - SOC alert
      - security alert
    properties: {}
  IncidentCommander:
    meaning: Role that can declare a major incident and assumes command once declared.
    aliases:
      - incident commander
    properties: {}
  DutyManager:
    meaning: Designated duty manager with authority to assess the situation and declare a major incident.
    aliases:
      - duty manager
    properties: {}
  TechnicalLead:
    meaning: Role responsible for diagnosing technical issues and coordinating resolution efforts during an incident.
    aliases:
      - technical lead
    properties: {}
  TechnicalOwner:
    meaning: Role accountable for the technical ownership of an affected technology component or change decision.
    aliases:
      - technical owner
    properties: {}
  BusinessLead:
    meaning: Role that represents business considerations and manages operational and customer impact during an incident.
    aliases:
      - business lead
    properties: {}
  CommunicationsLead:
    meaning: Role that manages internal and external incident communications and consistent messaging.
    aliases:
      - communications lead
    properties: {}
  RegulatoryLiaison:
    meaning: Role that handles regulatory considerations and coordinates regulatory notifications during an incident.
    aliases:
      - regulatory liaison
    properties: {}
  CyberLead:
    meaning: Role focused on cybersecurity implications and required security response during an incident.
    aliases:
      - cyber lead
    properties: {}
  VendorManager:
    meaning: Role that coordinates with vendors involved in disrupted services.
    aliases:
      - vendor manager
    properties: {}
  ExecutiveSponsor:
    meaning: Senior management role providing authority for high-level decisions during an incident.
    aliases:
      - executive sponsor
    properties: {}
  Scribe:
    meaning: Role that records decisions and action items during incident response.
    aliases:
      - scribe
    properties: {}
  ProblemManager:
    meaning: Role involved in identifying root cause if an incident evolves into a problem.
    aliases:
      - problem manager
    properties: {}
  MajorIncidentBridge:
    meaning: Central physical or virtual location for real-time collaboration during a major incident.
    aliases:
      - major incident bridge
    properties: {}
  TechnicalBridge:
    meaning: Subgroup or bridge focused on technical diagnosis and resolution during an incident.
    aliases:
      - technical bridge
    properties: {}
  ExecutiveBridge:
    meaning: Senior leadership bridge used for executive awareness and high-level decision-making during an incident.
    aliases:
      - executive bridge
    properties: {}
  CrisisManagementTeam:
    meaning: Broader team dealing with operational and reputational impact of a major incident.
    aliases:
      - crisis management team
      - CMT
    properties: {}
  WarRoom:
    meaning: Physical or virtual space where key stakeholders convene during major incidents.
    aliases:
      - war room
    properties: {}
  CyberResponse:
    meaning: Specialized response capability invoked when an incident has major cybersecurity concern.
    aliases:
      - cyber response
    properties: {}
  LegalCompliance:
    meaning: Legal and compliance function engaged when incidents have regulatory implications or potential breaches.
    aliases:
      - legal/compliance
      - legal and compliance
    properties: {}
  EmergencyChange:
    meaning: Urgent change used during incident response to restore service or mitigate impact.
    aliases:
      - emergency change
    properties: {}
  DisasterRecovery:
    meaning: Recovery approach invoked to restore services using disaster recovery capabilities.
    aliases:
      - disaster recovery
      - DR
    properties: {}
  CustomerCommunication:
    meaning: External communication issued to customers about an incident or its impact.
    aliases:
      - customer communication
    properties: {}
  RegulatoryNotification:
    meaning: "Notification made to regulators based on incident nature, extent, or compliance risk."
    aliases:
      - regulatory notification
    properties: {}
  ResidualRiskAcceptance:
    meaning: Decision to accept remaining risk and continue operations after mitigation or workaround.
    aliases:
      - residual risk acceptance
      - accepting residual risk
    properties: {}
  Workaround:
    meaning: Temporary method that reduces or bypasses incident impact without necessarily resolving the underlying cause.
    aliases:
      - workaround
      - temporary solution
    properties:
      enablesContinuedOperation:
        type: boolean
      residualImpact:
        type: text
  PermanentFix:
    meaning: Long-lasting resolution that addresses the root cause and eliminates the need for the workaround.
    aliases:
      - permanent fix
      - fix
    properties:
      tested:
        type: boolean
      resolvesRootCause:
        type: boolean
  ImplementationPlan:
    meaning: Plan describing the steps for executing an emergency change or implementing corrective actions.
    aliases:
      - implementation plan
    properties: {}
  BackoutPlan:
    meaning: Plan describing rollback actions if an emergency change causes deterioration or fails criteria.
    aliases:
      - backout plan
      - rollback plan
    properties: {}
  EmergencyChangeEvidence:
    meaning: "Evidence captured before and after an emergency change to support approval, execution, verification, and stakeholder notification."
    aliases:
      - emergency change evidence
      - change evidence
    properties:
      evidenceStage:
        type: text
        allowed:
          - Before implementation
          - After implementation
      evidenceType:
        type: text
        allowed:
          - incident details and impact
          - approval
          - implementation plan
          - backout plan
          - execution verification
          - service state change
          - performance change
          - stability change
          - stakeholder notification
  ServiceState:
    meaning: "Observed state of a service after implementation, including performance or stability changes."
    aliases:
      - service state
    properties:
      performance:
        type: text
      stability:
        type: text
  Failover:
    meaning: Bringing a system online in a secondary environment to maintain service continuity during an outage of the primary system.
    aliases:
      - failover
    properties: {}
  ServiceIsolation:
    meaning: Disconnecting a component from network or dependencies to prevent it from affecting other services.
    aliases:
      - service isolation
      - isolate an application
    properties: {}
  IncidentRecord:
    meaning: "Authoritative record maintained for an incident, containing evidence, timeline, decisions, approvals, communications, and supporting material."
    aliases:
      - incident record
    properties:
      retentionBasis:
        type: text
  IncidentTimeline:
    meaning: "Chronological log of significant incident actions, events, decisions, and status changes."
    aliases:
      - timeline of events
      - incident timeline
    properties: {}
  TimelineEvent:
    meaning: Required dated event captured in the incident timeline to show incident progression.
    aliases:
      - timeline event
      - event type
    properties:
      eventType:
        type: text
        allowed:
          - Detected
          - Acknowledged
          - Major incident declared
          - Customer impact started
          - Workaround applied
          - Emergency change approved
          - Recovery started
          - Service restored
          - Monitoring complete
          - Closed
      eventTime:
        type: date
  IncidentEvidence:
    meaning: "Evidence captured during a major incident to support review, audit, regulatory assessment, and accountability."
    aliases:
      - evidence
      - major incident evidence
    properties:
      evidenceType:
        type: text
        allowed:
          - timeline of events
          - decisions and approvals
          - bridge notes
          - impact assessment
          - communications
          - technical logs
          - screenshots
          - monitoring graphs
          - vendor updates
      authenticity:
        type: boolean
      accuracy:
        type: boolean
      completeness:
        type: boolean
      traceability:
        type: boolean
      retentionBasis:
        type: text
  BridgeNotes:
    meaning: Notes and discussions captured from the incident management bridge where stakeholders collaborate.
    aliases:
      - bridge notes
    properties: {}
  ImpactAssessment:
    meaning: "Assessment of business, technical, customer, and regulatory impacts of an incident."
    aliases:
      - impact assessment
    properties:
      businessImpact:
        type: text
      technicalImpact:
        type: text
      customerImpact:
        type: text
      regulatoryImpact:
        type: text
  TechnicalLog:
    meaning: Log from a relevant system that provides technical context for an incident.
    aliases:
      - technical log
      - system log
    properties: {}
  MonitoringGraph:
    meaning: "Visual evidence of system state, performance metrics, or anomalies observed during an incident."
    aliases:
      - monitoring graph
      - screenshot
    properties: {}
  VendorUpdate:
    meaning: "Documentation of correspondence, status, or support received from a third-party vendor during an incident."
    aliases:
      - vendor update
    properties: {}
  Communication:
    meaning: "Message or update issued during incident response to internal, external, customer, regulatory, or vendor audiences."
    aliases:
      - communication
      - incident communication
    properties:
      communicationType:
        type: text
        allowed:
          - Internal Stakeholder Update
          - Executive Update
          - Customer Communication
          - Branch/Contact-centre Advisory
          - Status Page Update
          - Regulator Notification
          - Third-party/Vendor Communication
      communicationStatus:
        type: text
        allowed:
          - Drafted
          - Approved
          - Issued
          - Updated
          - Withdrawn
      deadline:
        type: date
  InternalStakeholderUpdate:
    meaning: Regular update for internal teams involved in incident response.
    aliases:
      - internal stakeholder update
    properties:
      communicationStatus:
        type: text
        allowed:
          - Drafted
          - Approved
          - Issued
          - Updated
          - Withdrawn
      deadline:
        type: date
  ExecutiveUpdate:
    meaning: Summary report or update for senior management on incident status.
    aliases:
      - executive update
    properties:
      communicationStatus:
        type: text
        allowed:
          - Drafted
          - Approved
          - Issued
          - Updated
          - Withdrawn
      deadline:
        type: date
  BranchContactCentreAdvisory:
    meaning: Advisory to branches and contact centres to assist customer inquiries and concerns during incidents.
    aliases:
      - branch/contact-centre advisory
      - branch advisory
      - contact-centre advisory
    properties:
      communicationStatus:
        type: text
        allowed:
          - Drafted
          - Approved
          - Issued
          - Updated
          - Withdrawn
      deadline:
        type: date
  StatusPageUpdate:
    meaning: "Public-facing update posted on the bank's status page about current service status."
    aliases:
      - status page update
    properties:
      communicationStatus:
        type: text
        allowed:
          - Drafted
          - Approved
          - Issued
          - Updated
          - Withdrawn
      deadline:
        type: date
  RegulatoryReportingClock:
    meaning: Time-bound regulatory reporting timeline tracked to ensure external regulatory obligations are met.
    aliases:
      - regulatory reporting clock
      - reporting clock
    properties:
      deadline:
        type: date
      clockTrigger:
        type: text
  CommunicationDeadline:
    meaning: Time-bound deadline tracked for incident communications.
    aliases:
      - communication deadline
    properties:
      deadline:
        type: date
  DataBreach:
    meaning: "Confirmed breach or issue affecting data confidentiality, integrity, or related regulatory obligations."
    aliases:
      - data breach
      - data integrity issue
    properties: {}
  OperationalResilienceThreshold:
    meaning: Regulatory or internal threshold for operational resilience that may trigger notification or escalation when breached.
    aliases:
      - operational resilience threshold
    properties:
      thresholdDescription:
        type: text
  MaterialCustomerDetriment:
    meaning: Material harm or detriment affecting numerous customers or services as a result of an incident.
    aliases:
      - material customer detriment
    properties: {}
  FinancialStabilityConcern:
    meaning: Broad concern that an incident may affect financial stability.
    aliases:
      - financial stability concern
    properties: {}
  InitialRegulatorNotification:
    meaning: First report to regulators indicating that an incident has occurred and outlining initial findings and impacts.
    aliases:
      - initial regulator notification
    properties:
      communicationStatus:
        type: text
        allowed:
          - Drafted
          - Approved
          - Issued
          - Updated
          - Withdrawn
      deadline:
        type: date
  InterimRegulatorUpdate:
    meaning: "Subsequent regulator communication providing updates on incident status, emerging insights, and ongoing actions."
    aliases:
      - interim update
      - interim regulator update
    properties:
      communicationStatus:
        type: text
        allowed:
          - Drafted
          - Approved
          - Issued
          - Updated
          - Withdrawn
      deadline:
        type: date
  FinalReportClosureNotification:
    meaning: "Comprehensive final regulator report or closure notification covering incident details, final outcomes, actions taken, and remedial measures."
    aliases:
      - final report
      - closure notification
      - final report/closure notification
    properties:
      communicationStatus:
        type: text
        allowed:
          - Drafted
          - Approved
          - Issued
          - Updated
          - Withdrawn
      deadline:
        type: date
  CustomerCommunicationTemplate:
    meaning: Pre-approved template for common customer communication scenarios used to expedite incident communications.
    aliases:
      - pre-approved template
      - customer communication template
    properties: {}
  CommunicationChannel:
    meaning: Delivery channel for customer communications with channel-specific strategy and approval needs.
    aliases:
      - channel
      - communication channel
    properties:
      channelType:
        type: text
        allowed:
          - social media
          - email
          - status page
          - branch
          - contact centre
          - SMS
          - mobile app
  LegalComplianceReview:
    meaning: Review by legal or compliance teams for significant communications with potential legal or regulatory implications.
    aliases:
      - legal/compliance review
    properties: {}
  PostIncidentReview:
    meaning: "Review held after qualifying incidents to assess response, document findings, and identify improvements."
    aliases:
      - post-incident review
      - PIR
    properties:
      reviewStatus:
        type: text
        allowed:
          - Open
          - In progress
          - Actions assigned
          - Implementation plan in place
          - Closed
  ProblemRecord:
    meaning: "Record created to investigate unknown root cause, recurring incidents, or mandatory underlying issue management after a major incident."
    aliases:
      - problem record
      - problem
    properties:
      rootCauseKnown:
        type: boolean
      recurring:
        type: boolean
      problemStatus:
        type: text
        allowed:
          - Open
          - In progress
          - Root cause identified
          - Corrective actions assigned
          - Resolved
          - Closed
  RiskComplianceRepresentative:
    meaning: Role that evaluates regulatory implications and compliance adherence during post-incident review.
    aliases:
      - risk/compliance representative
      - risk representative
      - compliance representative
    properties: {}
  RootCauseAnalysis:
    meaning: Analysis identifying the underlying cause of an incident or problem.
    aliases:
      - root cause analysis
      - RCA
    properties: {}
  ContributingFactor:
    meaning: Factor that contributed to an incident occurring or worsening.
    aliases:
      - contributing factor
    properties: {}
  ControlGap:
    meaning: Missing or ineffective control that allowed an incident to occur or worsen.
    aliases:
      - control gap
    properties: {}
  LessonLearned:
    meaning: Documented learning from incident response intended to improve future operational resilience and response capability.
    aliases:
      - lesson learned
    properties: {}
  CorrectiveAction:
    meaning: Action proposed or assigned to prevent incident recurrence or address a control gap.
    aliases:
      - corrective action
      - remedial action
    properties:
      dueDate:
        type: date
      riskRating:
        type: text
      actionStatus:
        type: text
        allowed:
          - Open
          - In progress
          - Implemented
          - Verified
          - Closed
      executiveOversight:
        type: boolean
  ActionOwner:
    meaning: Person or role assigned responsibility for implementing a corrective action.
    aliases:
      - assigned owner
      - action owner
    properties: {}
  RegulatoryFollowUp:
    meaning: Follow-up activity with regulators based on post-incident findings and regulatory implications.
    aliases:
      - regulatory follow-up
    properties: {}
  Playbook:
    meaning: "Predefined response procedure outlining actions for incident handlers based on service, scenario, or severity."
    aliases:
      - playbook
      - response procedure
    properties:
      scenario:
        type: text
      severityLevel:
        type: text
        allowed:
          - Sev 1 Critical
          - Sev 2 High
          - Sev 3 Medium
          - Sev 4 Low
  Runbook:
    meaning: Step-by-step operational procedure used to execute a consistent incident response for known incident types.
    aliases:
      - runbook
    properties:
      scenario:
        type: text
      severityLevel:
        type: text
        allowed:
          - Sev 1 Critical
          - Sev 2 High
          - Sev 3 Medium
          - Sev 4 Low
  OperationalResilienceExercise:
    meaning: "Preparedness exercise used to test operational resilience response strategies, readiness, and compliance obligations."
    aliases:
      - operational resilience testing
      - operational resilience exercise
    properties:
      exerciseType:
        type: text
        allowed:
          - Tabletop Exercise
          - Failover Test
          - Cyber Simulation
          - Regulatory Scenario Test
      exerciseDate:
        type: date
  ControlObligation:
    meaning: "Policy or control requirement governing incident response, escalation, evidence, communications, recovery, or testing."
    aliases:
      - control obligation
      - policy requirement
    properties:
      obligationType:
        type: text
        allowed:
          - evidence completeness
          - communication cadence
          - escalation timeframe
          - RTO compliance
          - RPO compliance
          - disaster recovery test frequency
      requiredCadence:
        type: text
  RecoveryPointObjective:
    meaning: Target maximum tolerable data loss for a service or application.
    aliases:
      - Recovery Point Objective
      - RPO
    properties:
      recoveryPointObjective:
        type: number
        unit: hours
  GovernanceMetric:
    meaning: "Metric reported to governance committees to monitor incident performance, resilience, regulatory activity, and corrective-action management."
    aliases:
      - metric
      - reporting metric
    properties:
      metricType:
        type: text
        allowed:
          - incident count by severity
          - time to detect
          - time unresolved
          - time to restore
          - SLA breach
          - RTO breach
          - repeat incidents
          - overdue corrective actions
          - regulatory notification status
      metricValue:
        type: number
  GovernanceForum:
    meaning: "Committee or board overseeing incident trends, operational resilience risks, corrective-action closure, and regulatory themes."
    aliases:
      - governance forum
      - committee
      - board
    properties:
      forumFocus:
        type: text
        allowed:
          - incident trends
          - operational resilience risks
          - corrective-action closure
          - regulatory themes
relationships:
  - name: supports
    from: Application
    to: BusinessService
    meaning: An application implements functionality that supports a business service.
    aliases: []
  - name: underpins
    from: Database
    to: Application
    meaning: A database provides required data capability for an application.
    aliases: []
  - name: reliesOn
    from: ITService
    to: InfrastructureComponent
    meaning: An IT service depends on infrastructure components such as servers or storage.
    aliases: []
  - name: isEssentialFor
    from: ThirdPartyService
    to: BusinessService
    meaning: A third-party service is essential for business functionality of a business service.
    aliases: []
  - name: enablesConnectivityFor
    from: NetworkSegment
    to: ITService
    meaning: A network segment provides connectivity needed for an IT service to function.
    aliases: []
  - name: hostedAt
    from: InfrastructureComponent
    to: DataCenterOrSite
    meaning: An infrastructure component is hosted at a data center or site.
    aliases: []
  - name: owns
    from: ServiceOwner
    to: BusinessService
    meaning: A service owner is accountable for a business service.
    aliases: []
  - name: owns
