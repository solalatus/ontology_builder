competency_questions:
  - id: cq1
    text: Which business services are impacted by this incident?
  - id: cq2
    text: Which customer channels are impacted by this incident?
  - id: cq3
    text: Which configuration items are on the dependency path of the affected IT service?
  - id: cq4
    text: Which third-party services are on the dependency path of the affected IT service?
  - id: cq5
    text: Who owns the affected service?
  - id: cq6
    text: Which resolver group should be assigned to this incident?
  - id: cq7
    text: Which on-call engineer should be assigned to this incident?
  - id: cq8
    text: Does the incident meet the bank-defined criteria for a major-incident declaration?
  - id: cq9
    text: What runbook can be referenced for managing this incident?
  - id: cq10
    text: What workaround can be referenced for managing this incident?
  - id: cq11
    text: Is a materiality assessment complete for this incident?
  - id: cq12
    text: Is a regulatory notification required for this incident?
  - id: cq13
    text: When is the regulatory notification due for this incident?
  - id: cq14
    text: What evidence has been collected regarding this incident?
  - id: cq15
    text: What is the integrity status of the evidence collected for this incident?
  - id: cq16
    text: Which corrective actions from prior post-incident reviews remain open for the affected service?
classes:
  Incident:
    meaning: An unplanned disruption or degradation of an IT service that requires coordinated response to restore normal operations.
    aliases:
      - issue
    properties:
      incidentId:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      currentStatus:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      openedTime:
        type: date
      summary:
        type: text
  ITService:
    meaning: A managed technology capability that supports one or more business services and is governed by defined operational standards.
    aliases:
      - IT service
      - information technology service
    properties:
      serviceId:
        type: text
      name:
        type: text
      currentStatus:
        type: text
      description:
        type: text
      availabilityTarget:
        type: text
  BusinessService:
    meaning: A customer-facing capability provided by the bank that fulfills the needs of clients and drives business outcomes.
    aliases:
      - business service
    properties:
      serviceId:
        type: text
      name:
        type: text
      description:
        type: text
      currentStatus:
        type: text
      availabilityTarget:
        type: text
  CustomerChannel:
    meaning: The pathways through which customers interact with the bank to access services and conduct transactions.
    aliases:
      - customer interface
      - service channel
    properties:
      channelId:
        type: text
      name:
        type: text
      description:
        type: text
      currentStatus:
        type: text
  Alert:
    meaning: "A notification generated by monitoring tools indicating a condition that requires attention, potentially related to an incident or operational issue."
    aliases:
      - notification
    properties:
      alertId:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      timestampRaised:
        type: date
      summary:
        type: text
      detectionSource:
        type: text
  ConfigurationItem:
    meaning: A managed component within the IT infrastructure that is tracked for its role and relationships in supporting IT services.
    aliases:
      - CI
    properties:
      ciId:
        type: text
      name:
        type: text
      currentStatus:
        type: text
      type:
        type: text
      criticalityTier:
        type: text
      location:
        type: text
  ThirdPartyService:
    meaning: An external service or solution provided by a vendor that the bank relies on to deliver its own services effectively.
    aliases:
      - external service
      - vendor service
    properties:
      serviceId:
        type: text
      name:
        type: text
      description:
        type: text
      currentStatus:
        type: text
      criticalityTier:
        type: text
  ServiceOwner:
    meaning: The individual accountable for the performance and accountability of a specific IT service throughout its lifecycle.
    aliases: []
    properties:
      ownerId:
        type: text
      name:
        type: text
      contactInformation:
        type: text
  ResolverGroup:
    meaning: A team of specialists designated to diagnose and resolve incidents related to specific technologies or service areas.
    aliases:
      - support group
    properties:
      groupId:
        type: text
      name:
        type: text
      currentStatus:
        type: text
      expertiseArea:
        type: text
  OnCallEngineer:
    meaning: A technical specialist available on a rotational basis to respond to incidents and provide support outside of regular business hours.
    aliases:
      - on-call support engineer
      - duty engineer
    properties:
      engineerId:
        type: text
      name:
        type: text
      contactInformation:
        type: text
      currentStatus:
        type: text
  Runbook:
    meaning: "A documented operational procedure that outlines steps for diagnosing, responding to, and recovering from incidents."
    aliases: []
    properties:
      runbookId:
        type: text
      title:
        type: text
      version:
        type: text
      lastUpdated:
        type: date
      description:
        type: text
  Workaround:
    meaning: A temporary solution or method implemented to reduce or bypass the impact of an incident while a permanent fix is being developed.
    aliases: []
    properties:
      workaroundId:
        type: text
      summary:
        type: text
      description:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
      implementationDate:
        type: date
  MaterialityAssessment:
    meaning: A formal evaluation process that determines the significance of an incident and whether it requires regulatory reporting.
    aliases: []
    properties:
      assessmentId:
        type: text
      status:
        type: text
        allowed:
          - complete
          - incomplete
      assessmentTimestamp:
        type: date
      rationale:
        type: text
      result:
        type: text
        allowed:
          - reportable
          - not-reportable
  RegulatoryNotification:
    meaning: A formal submission made to a regulatory authority concerning incidents that meet specific legal requirements.
    aliases: []
    properties:
      notificationId:
        type: text
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submissionTimestamp:
        type: date
      dueDate:
        type: date
  Evidence:
    meaning: "Collected records or artifacts supporting the analysis and accountability of incidents, ensuring transparency and compliance."
    aliases: []
    properties:
      evidenceId:
        type: text
      collectionTimestamp:
        type: date
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      storageLocation:
        type: text
  PostIncidentReview:
    meaning: "A structured review conducted after an incident to analyze its causes, assess response effectiveness, and identify lessons learned."
    aliases: []
    properties:
      reviewId:
        type: text
      dateHeld:
        type: date
      findingsSummary:
        type: text
      status:
        type: text
  CorrectiveAction:
    meaning: "A tracked action intended to address the root causes of an incident and prevent recurrence, often resulting from a post-incident review."
    aliases: []
    properties:
      actionId:
        type: text
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      description:
        type: text
      dueDate:
        type: date
  IncidentResponseTeam:
    meaning: A cross-functional group responsible for coordinating the response to significant incidents and ensuring efficient recovery efforts.
    aliases: []
    properties:
      teamId:
        type: text
      name:
        type: text
      currentStatus:
        type: text
      expertiseArea:
        type: text
  EmergencyChange:
    meaning: "A rapid implementation of a change designed to resolve an urgent operational issue related to an incident, typically processed through an expedited path."
    aliases: []
    properties:
      changeId:
        type: text
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      description:
        type: text
      implementationTimestamp:
        type: date
  BackupSet:
    meaning: A defined collection of recoverable data and backups used to restore IT services and data if needed.
    aliases: []
    properties:
      backupSetId:
        type: text
      description:
        type: text
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      lastSuccessfulBackupTimestamp:
        type: date
  Stakeholder:
    meaning: "A person or group with an interest or stake in the operational outcomes of an incident or related processes, often requiring communication and updates."
    aliases: []
    properties:
      stakeholderId:
        type: text
      name:
        type: text
      contactInformation:
        type: text
  Regulator:
    meaning: "An authoritative body that oversees compliance with legal and operational standards within the banking industry, receiving necessary notifications."
    aliases: []
    properties:
      regulatorId:
        type: text
      name:
        type: text
      contactInformation:
        type: text
      authorityType:
        type: text
relationships:
  - name: affectsItservice
    from: Incident
    to: ITService
    meaning: The IT service directly affected by the incident.
    aliases:
      - impacts IT service
  - name: supportsBusinessService
    from: ITService
    to: BusinessService
    meaning: The IT service underpins the business service.
    aliases:
      - underpins business service
  - name: deliveredThrough
    from: BusinessService
    to: CustomerChannel
    meaning: The business service is delivered to users through the customer channel.
    aliases:
      - provided via
  - name: dependsOnConfigurationItem
    from: ITService
    to: ConfigurationItem
    meaning: The IT service depends on the configuration item.
    aliases:
      - relies on configuration item
  - name: dependsOnThirdPartyService
    from: ITService
    to: ThirdPartyService
    meaning: The IT service depends on the third-party service.
    aliases:
      - relies on third-party service
  - name: ownedBy
    from: ITService
    to: ServiceOwner
    meaning: The IT service is accountable to the service owner.
    aliases: []
  - name: supportedByResolverGroup
    from: ITService
    to: ResolverGroup
    meaning: The resolver group responsible for handling incidents affecting the IT service.
    aliases:
      - assisted by resolver group
  - name: hasOnCallEngineer
    from: ResolverGroup
    to: OnCallEngineer
    meaning: The resolver group is linked with the on-call engineer.
    aliases: []
  - name: assignedToResolverGroup
    from: Incident
    to: ResolverGroup
    meaning: The resolver group actually assigned to the incident.
    aliases:
      - designated resolver group
  - name: assignedToOnCallEngineer
    from: Incident
    to: OnCallEngineer
    meaning: The on-call engineer actually assigned to the incident.
    aliases:
      - designated on-call engineer
  - name: coordinatedByIncidentResponseTeam
    from: Incident
    to: IncidentResponseTeam
    meaning: The incident response team coordinating the incident when major-incident handling applies.
    aliases:
      - managed by incident response team
  - name: referencesRunbook
    from: Incident
    to: Runbook
    meaning: The runbook that can be used to manage the incident.
    aliases:
      - points to runbook
  - name: referencesWorkaround
    from: Incident
    to: Workaround
    meaning: The workaround that can be used to manage the incident.
    aliases:
      - points to workaround
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: The materiality assessment performed for the incident.
    aliases:
      - includes materiality assessment
  - name: hasRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: The regulatory notification associated with the incident.
    aliases:
      - includes regulatory notification
  - name: submittedToRegulator
    from: RegulatoryNotification
    to: Regulator
    meaning: The notification is submitted to the regulator.
    aliases: []
  - name: hasEvidence
    from: Incident
    to: Evidence
    meaning: Evidence collected regarding the incident.
    aliases:
      - includes evidence
  - name: hasPostIncidentReview
    from: ITService
    to: PostIncidentReview
    meaning: A post-incident review concerning the IT service.
    aliases:
      - includes post-incident review
  - name: hasCorrectiveAction
    from: PostIncidentReview
    to: CorrectiveAction
    meaning: A corrective action arising from the post-incident review.
    aliases:
      - includes corrective action
  - name: relatesToIncident
    from: Alert
    to: Incident
    meaning: The alert is associated with the incident it helps detect or trigger.
    aliases:
      - associated with incident
  - name: linkedToIncident
    from: EmergencyChange
    to: Incident
    meaning: The emergency change is raised or executed in response to the incident.
    aliases:
      - connected to incident
  - name: usedToRecoverItservice
    from: BackupSet
    to: ITService
    meaning: The backup set can be used to recover the IT service or its data.
    aliases:
      - used for IT service recovery
  - name: communicatedToStakeholder
    from: Incident
    to: Stakeholder
    meaning: The stakeholder received communication about the incident.
    aliases:
      - informed stakeholders
  - name: affectsBusinessService
    from: Incident
    to: BusinessService
    meaning: The business service directly impacted by the incident.
    aliases:
      - impacts business service
rules:
  qualifiesForMajorIncidentDeclaration:
    conditions:
      - "The incident is active and not resolved, closed, or cancelled."
      - The incident severity is sev1-critical or sev2-high.
      - At least one impacted IT service is identified.
      - "The incident has significant business impact, affecting multiple business services or high volumes of customers."
      - The incident requires enhanced coordination and communication due to its complexity or potential for harm.
  requiresRegulatoryNotification:
    conditions:
      - The incident has a materiality assessment.
      - The materiality assessment result is reportable.
  canAssignIncident:
    conditions:
      - The incident is not closed or cancelled.
  canContainIncident:
    conditions:
      - The incident status is acknowledged or investigating.
  canExecuteEmergencyChange:
    conditions:
      - The emergency change status is approved.
  canRestoreBackup:
    conditions:
      - The backup set status is successful or verified.
actions:
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: Alert status becomes acknowledged.
    verification: Read the alert again and confirm its status is acknowledged.
  assignIncident:
    input: Incident
    preconditions:
      - canAssignIncident
    effect: "The incident is assigned to a resolver group and, where applicable, to an on-call engineer."
    verification: Read the incident again and confirm the assigned resolver group and on-call engineer.
  declareMajorIncident:
    input: Incident
    preconditions:
      - qualifiesForMajorIncidentDeclaration
    effect: The incident is classified and handled as a major incident.
    verification: Read the incident again and confirm major-incident handling has been initiated.
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: Containment steps are implemented and incident impact is limited.
    verification: Confirm containment steps were recorded and the incident impact is reduced or stabilized.
  executeEmergencyChange:
    input: EmergencyChange
    preconditions:
      - canExecuteEmergencyChange
    effect: The emergency change status becomes implemented for the linked incident.
    verification: Read the emergency change again and confirm its status is implemented and it remains linked to the incident.
  restoreBackup:
    input: BackupSet
    preconditions:
      - canRestoreBackup
    effect: The linked IT service or its data is restored from the backup set.
    verification: Confirm the restore completed and the linked IT service or data is recovered.
  sendStakeholderCommunication:
    input: Incident
    preconditions: []
    effect: Communication about the incident is sent to stakeholders.
    verification: Confirm the communication was issued to the intended stakeholders.
  submitRegulatoryNotification:
    input: Incident
    preconditions:
      - requiresRegulatoryNotification
    effect: "The incident's regulatory notification is submitted to the regulator and its status becomes submitted."
    verification: "Read the incident's regulatory notification again and confirm its status is submitted."
