competency_questions:
  - id: cq1
    text: Which business services are impacted by an incident?
  - id: cq2
    text: Which customer channels are impacted by an incident?
  - id: cq3
    text: What configuration items are part of the dependency path for an affected IT service?
  - id: cq4
    text: What third-party services are part of the dependency path for an affected IT service?
  - id: cq5
    text: Are any active alerts correlated with an incident?
  - id: cq6
    text: Are any active events correlated with an incident?
  - id: cq7
    text: Who owns an affected service?
  - id: cq8
    text: Which resolver group should be assigned to manage an incident?
  - id: cq9
    text: Which on-call engineer should be assigned to manage an incident?
  - id: cq10
    text: Does an incident meet the criteria for major-incident declaration?
  - id: cq11
    text: What runbook can be used to resolve an incident?
  - id: cq12
    text: What workaround can be used to resolve an incident?
  - id: cq13
    text: What backup set can be used to resolve an incident?
  - id: cq14
    text: What recovery plan can be used to resolve an incident?
  - id: cq15
    text: Was an incident potentially caused by a recent change?
  - id: cq16
    text: Was an incident potentially caused by a recent deployment?
  - id: cq17
    text: Is there a completed materiality assessment for an incident?
  - id: cq18
    text: "Is regulatory notification required for an incident, and when is it due?"
  - id: cq19
    text: Are evidence integrity checks fully documented and complete for an incident?
  - id: cq20
    text: Are stakeholder communications fully documented and complete for an incident?
  - id: cq21
    text: Are incident closure conditions fully documented and complete?
  - id: cq22
    text: What corrective actions from previous post-incident reviews are still open for a service impacted by an incident?
classes:
  Incident:
    meaning: "An unplanned interruption, degradation, or security condition that requires a managed response to restore normal service operation."
    aliases: []
    properties:
      evidenceChecksComplete:
        type: boolean
      stakeholderCommunicationsComplete:
        type: boolean
      closureConditionsComplete:
        type: boolean
      geographicalContext:
        type: text
      criticalBusinessPeriod:
        type: boolean
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      majorIncidentDeclared:
        type: boolean
      majorIncidentCriteriaMet:
        type: boolean
      detectedAt:
        type: date
      severity:
        type: text
        allowed:
          - sev1
          - sev2
  ITService:
    meaning: "A managed technology capability that supports one or more business services, ensuring their availability and performance."
    aliases: []
    properties:
      status:
        type: text
      healthState:
        type: text
        allowed:
          - healthy
          - accepted-residual-condition
  BusinessService:
    meaning: A customer- or business-facing capability delivered by the bank that enables key business processes and operational activities.
    aliases: []
    properties: {}
  CustomerChannel:
    meaning: The various avenues through which customers access banking services.
    aliases: []
    properties: {}
  ConfigurationItem:
    meaning: A managed component within the IT environment that is documented in the configuration management record and supports IT services.
    aliases: []
    properties: {}
  ThirdPartyService:
    meaning: An externally provided service that the bank relies on to support its IT services or business operations.
    aliases:
      - outsourced service
    properties: {}
  Alert:
    meaning: "A notification generated by monitoring tools that indicates a condition requiring attention or action, typically associated with potential incidents."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
  Event:
    meaning: "An observable occurrence in the IT environment that can indicate a change in state or noteworthy activity, which is monitored for potential impact on services."
    aliases: []
    properties: {}
  ServiceOwner:
    meaning: The individual or role responsible for the overall management and accountability of a specific IT service throughout its lifecycle.
    aliases: []
    properties:
      name:
        type: text
  ResolverGroup:
    meaning: A team of technical specialists assigned to diagnose and resolve incidents related to specific technology or service areas.
    aliases:
      - support group
    properties:
      name:
        type: text
  OnCallEngineer:
    meaning: A technical specialist who is available for immediate response to incidents outside of regular operating hours.
    aliases:
      - on-call
    properties:
      onCallNow:
        type: boolean
  TechnicalOwner:
    meaning: "The individual or role responsible for the engineering, maintenance, and operational fitness of a specific configuration item or technology."
    aliases: []
    properties:
      name:
        type: text
  IncidentCommander:
    meaning: "The person accountable for coordinating the response to a major incident, ensuring effective communication and decision-making throughout the incident lifecycle."
    aliases:
      - incident manager
    properties:
      name:
        type: text
  Runbook:
    meaning: "A documented operational procedure that outlines the steps to diagnose, respond to, and recover from incidents or problems."
    aliases:
      - playbook
    properties: {}
  Workaround:
    meaning: "A temporary solution or method used to reduce or bypass the impact of an incident, while the underlying issue is addressed."
    aliases:
      - temporary fix
    properties: {}
  BackupSet:
    meaning: A defined collection of recoverable data that is created to ensure data integrity and availability in case of loss or corruption.
    aliases: []
    properties:
      restorable:
        type: boolean
  RecoveryPlan:
    meaning: A documented strategy that outlines the steps and resources required to restore an IT service and its dependencies after a disruption.
    aliases: []
    properties: {}
  Change:
    meaning: "A controlled modification, addition, or removal of IT infrastructure or services that may affect their operation."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  Deployment:
    meaning: "The process of executing and implementing a change, typically involving the installation or activation of new software or system configurations."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
  MaterialityAssessment:
    meaning: A formal evaluation that determines the significance of an incident and whether it requires regulatory notification or reporting.
    aliases: []
    properties:
      completed:
        type: boolean
      notificationRequired:
        type: boolean
  RegulatoryNotification:
    meaning: A formal submission made to a regulatory authority to inform them of incidents that may have compliance implications or require reporting.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueAt:
        type: date
      contentComplete:
        type: boolean
  PostIncidentReview:
    meaning: "A structured evaluation conducted after an incident to analyze the causes, response effectiveness, and lessons learned for future improvement."
    aliases:
      - PIR
    properties:
      completed:
        type: boolean
  CorrectiveAction:
    meaning: "A tracked effort to eliminate the root cause of incidents or problems, aimed at preventing their recurrence and improving processes."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
  ServiceCriticalityTier:
    meaning: "A classification that indicates the importance and urgency of an IT service, guiding priorities for incident response and management."
    aliases: []
    properties:
      name:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  BusinessLine:
    meaning: "A distinct operational division within the bank that encapsulates specific customer segments, products, or services offered."
    aliases: []
    properties:
      name:
        type: text
relationships:
  - name: impactsItservice
    from: Incident
    to: ITService
    meaning: Indicates that an incident directly disrupts or degrades the performance of a specific IT service.
    aliases: []
  - name: supportsBusinessService
    from: ITService
    to: BusinessService
    meaning: Signifies that an IT service provides the necessary capabilities and resources for delivering a particular business service.
    aliases: []
  - name: availableThroughChannel
    from: BusinessService
    to: CustomerChannel
    meaning: Describes how a business service can be accessed by customers through various channels.
    aliases: []
  - name: dependsOnConfigurationItem
    from: ITService
    to: ConfigurationItem
    meaning: Indicates that an IT service relies on specific configuration items to function effectively and maintain service delivery.
    aliases: []
  - name: dependsOnThirdPartyService
    from: ITService
    to: ThirdPartyService
    meaning: Signifies that an IT service requires external third-party services for its operations and functionality.
    aliases: []
  - name: dependsOnConfigurationItem
    from: ConfigurationItem
    to: ConfigurationItem
    meaning: Indicates that a specific configuration item relies on another configuration item for its operation or functionality.
    aliases: []
  - name: dependsOnThirdPartyService
    from: ConfigurationItem
    to: ThirdPartyService
    meaning: Signifies that a configuration item requires an external third-party service to function or operate effectively.
    aliases: []
  - name: ownedByServiceOwner
    from: ITService
    to: ServiceOwner
    meaning: Describes the relationship where a specific IT service is managed and accountable by a designated service owner.
    aliases: []
  - name: ownedByTechnicalOwner
    from: ConfigurationItem
    to: TechnicalOwner
    meaning: Indicates that a particular configuration item is under the responsibility and management of a designated technical owner.
    aliases: []
  - name: assignedToResolverGroup
    from: Incident
    to: ResolverGroup
    meaning: Signifies that an incident has been assigned to a specific resolver group that is responsible for investigating and resolving the issue.
    aliases:
      - allocated to resolver group
  - name: supportedByResolverGroup
    from: ITService
    to: ResolverGroup
    meaning: Indicates that a specific resolver group is responsible for providing support and expertise for a particular IT service.
    aliases: []
  - name: assignedToOnCallEngineer
    from: Incident
    to: OnCallEngineer
    meaning: "Signifies that an incident has been assigned to a designated on-call engineer who is responsible for managing the incident's resolution."
    aliases:
      - allocated to on-call engineer
  - name: hasOnCallEngineer
    from: ResolverGroup
    to: OnCallEngineer
    meaning: Describes the relationship where a resolver group includes specific on-call engineers who are available to assist with incident resolution.
    aliases: []
  - name: correlatesAlert
    from: Incident
    to: Alert
    meaning: "Indicates that an incident is linked to a specific alert generated by monitoring systems, which highlights a condition requiring attention."
    aliases:
      - linked to alert
  - name: correlatesEvent
    from: Incident
    to: Event
    meaning: "Signifies that an incident is associated with a particular event, reflecting an observable occurrence that may have influenced the incident."
    aliases:
      - linked to event
  - name: derivedFromEvent
    from: Alert
    to: Event
    meaning: "Indicates that an alert is generated based on a specific event that has occurred in the system, highlighting a condition that may need attention."
    aliases: []
  - name: usesRunbook
    from: Incident
    to: Runbook
    meaning: Signifies that an incident is being managed using a specific runbook that outlines the procedures for addressing the issue.
    aliases: []
  - name: usesWorkaround
    from: Incident
    to: Workaround
    meaning: Indicates that a temporary workaround is employed to mitigate the impact of the incident while a permanent solution is being pursued.
    aliases: []
  - name: usesBackupSet
    from: Incident
    to: BackupSet
    meaning: Describes the relationship where an incident relies on a specific backup set for recovery purposes during its resolution.
    aliases: []
  - name: hasRunbook
    from: ITService
    to: Runbook
    meaning: Signifies that an IT service is associated with a specific runbook that provides operational procedures for managing incidents related to that service.
    aliases: []
  - name: hasWorkaround
    from: ITService
    to: Workaround
    meaning: Indicates that a specific IT service is associated with a workaround that provides a temporary solution to mitigate issues affecting the service.
    aliases: []
  - name: protectsBackupSet
    from: ConfigurationItem
    to: BackupSet
    meaning: "Signifies that a particular configuration item is responsible for safeguarding a defined backup set, ensuring data recoverability."
    aliases: []
  - name: usesRecoveryPlan
    from: Incident
    to: RecoveryPlan
    meaning: Describes the relationship where an incident relies on a specific recovery plan that outlines the steps for restoring the affected IT service.
    aliases: []
  - name: hasRecoveryPlan
    from: ITService
    to: RecoveryPlan
    meaning: Indicates that a specific IT service is linked to a recovery plan that details how to restore the service in the event of a disruption.
    aliases: []
  - name: causedByChange
    from: Incident
    to: Change
    meaning: Signifies that an incident has been triggered or impacted by a specific change made to the IT environment.
    aliases:
      - triggered by change
  - name: causedByDeployment
    from: Incident
    to: Deployment
    meaning: Indicates that an incident has occurred as a direct result of a specific deployment made to the IT environment.
    aliases:
      - triggered by deployment
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: Signifies that an incident is associated with a materiality assessment that evaluates its significance and reporting obligations.
    aliases: []
  - name: hasRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: Describes the relationship where an incident is linked to a regulatory notification that informs authorities of any compliance implications.
    aliases: []
  - name: hasPostIncidentReview
    from: Incident
    to: PostIncidentReview
    meaning: Indicates that an incident is connected to a post-incident review process that evaluates the response and identifies lessons learned.
    aliases: []
  - name: tracksCorrectiveAction
    from: PostIncidentReview
    to: CorrectiveAction
    meaning: Signifies that a post-incident review documents and monitors the implementation of corrective actions identified to prevent future incidents.
    aliases:
      - monitors corrective action
  - name: hasCriticalityTier
    from: ITService
    to: ServiceCriticalityTier
    meaning: "Indicates that a specific IT service is classified under a certain criticality tier, reflecting its importance and impact on business operations."
    aliases: []
  - name: belongsToBusinessLine
    from: BusinessService
    to: BusinessLine
    meaning: "Signifies that a business service is associated with a specific business line within the organization, aligning it with strategic objectives."
    aliases: []
  - name: belongsToBusinessLine
    from: ITService
    to: BusinessLine
    meaning: "Describes the relationship where an IT service is linked to a particular business line, ensuring that the service supports relevant business activities."
    aliases: []
  - name: belongsToBusinessLine
    from: Incident
    to: BusinessLine
    meaning: "Indicates that an incident is associated with a specific business line, providing context for its impact on business operations."
    aliases: []
  - name: hasIncidentCommander
    from: Incident
    to: IncidentCommander
    meaning: Signifies that an incident is assigned to a designated incident commander who is responsible for leading the response and coordination efforts.
    aliases:
      - designated incident manager
  - name: implementedByDeployment
    from: Change
    to: Deployment
    meaning: "Indicates that a specific change is executed through a deployment, reflecting the implementation of new or modified functionality."
    aliases: []
  - name: forItservice
    from: CorrectiveAction
    to: ITService
    meaning: Describes the relationship where a corrective action is linked to a specific IT service that was affected by incidents or problems.
    aliases: []
  - name: requiresEmergencyChange
    from: Incident
    to: Change
    meaning: Indicates that an incident necessitates an emergency change to be implemented in order to address urgent operational needs.
    aliases:
      - needs emergency change
  - name: respondsToIncident
    from: Change
    to: Incident
    meaning: null
    aliases: []
  - name: affectsConfigurationItem
    from: Change
    to: ConfigurationItem
    meaning: null
    aliases: []
  - name: forIncident
    from: RegulatoryNotification
    to: Incident
    meaning: null
    aliases: []
  - name: basedOnMaterialityAssessment
    from: RegulatoryNotification
    to: MaterialityAssessment
    meaning: null
    aliases: []
rules:
  canDeclareMajorIncident:
    conditions:
      - "The incident is currently active and not resolved, closed, or cancelled."
      - The incident severity is sev1 or sev2.
      - At least one impacted IT service has been identified.
      - An incident commander is assigned to coordinate the incident response.
  canSubmitRegulatoryNotification:
    conditions:
      - A materiality assessment has been completed.
      - The materiality assessment indicates that regulatory notification is required.
      - The incident is linked to the regulatory notification.
      - All required fields and supporting evidence for the notification are complete.
      - The submission occurs before the regulatory notification due date.
  canCloseIncident:
    conditions:
      - The incident status is resolved or monitoring.
      - All impacted IT services have health state healthy or accepted-residual-condition.
      - Incident evidence checks are complete.
      - Incident closure conditions are complete.
      - All required stakeholder communications have been completed.
  canExecuteEmergencyChange:
    conditions:
      - The change is linked to an active incident.
      - The implementation plan for the emergency change is prepared and approved.
      - A backout plan is available to revert the change if necessary.
      - The affected configuration items are identified.
      - The risk associated with the emergency change has been explicitly accepted.
actions:
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: The alert status becomes acknowledged and initial ownership for triage is recorded.
    verification: Confirm the alert shows acknowledged status and an owning party for triage.
  assignIncident:
    input: Incident
    preconditions: []
    effect: The incident is assigned to the appropriate resolver group.
    verification: Confirm the incident record shows the intended resolver group assignment.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: The incident majorIncidentDeclared value becomes true and enhanced coordination is initiated.
    verification: Confirm the incident record shows majorIncidentDeclared is true and coordination has started.
  containIncident:
    input: Incident
    preconditions: []
    effect: Containment measures are recorded and impact is reduced while resolution continues.
    verification: Confirm containment actions are documented and the current impact state is updated.
  sendStakeholderCommunication:
    input: Incident
    preconditions: []
    effect: "A communication is sent to stakeholders regarding the incident, and a timestamp is recorded."
    verification: Confirm the communication was sent and logged in the incident record.
  executeEmergencyChange:
    input: Change
    preconditions:
      - canExecuteEmergencyChange
    effect: The emergency change is implemented and the change status becomes implemented.
    verification: "Run technical checks, verify service health, and record implementation evidence."
  restoreBackup:
    input: BackupSet
    preconditions: []
    effect: Backup data is restored to the target system or environment.
    verification: Validate data integrity and application functionality after the restore.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: The regulatory notification is submitted and the regulatory notification status becomes submitted.
    verification: Confirm accepted submission and retain the submission receipt.
  conductPostIncidentReview:
    input: PostIncidentReview
    preconditions: []
    effect: "A review session is held, findings are documented, and follow-up actions are identified."
    verification: Verify that all review findings are recorded and corrective actions are tracked.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: The incident status becomes closed after resolution and completion checks.
    verification: Confirm the incident record shows closed status and completion evidence is present.
