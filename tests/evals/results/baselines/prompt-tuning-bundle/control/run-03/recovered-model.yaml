competency_questions:
  - id: cq1
    text: "What is the current status of an incident, and what steps have been taken so far?"
  - id: cq2
    text: "Which IT services are affected by an incident, and what is the estimated business impact?"
  - id: cq3
    text: Has an incident been linked to any previous problem or known error?
  - id: cq4
    text: "Which resolver group is assigned to an incident, and who is the on-call engineer responsible?"
  - id: cq5
    text: "Does an incident meet the criteria for major incident declaration, and who is the incident commander assigned?"
  - id: cq6
    text: What workarounds or runbooks are available to mitigate the impact of an incident while resolution is in progress?
  - id: cq7
    text: Are there active alerts or security events that correlate with an incident and provide additional context?
  - id: cq8
    text: "Is a materiality assessment required for an incident, and what are its findings regarding regulatory notification?"
  - id: cq9
    text: "Have all necessary stakeholder communications been sent regarding an incident, and is receipt confirmed?"
  - id: cq10
    text: "What evidence has been collected to support investigation of an incident, and how is its integrity being maintained?"
classes:
  Incident:
    meaning: An unplanned disruption or degradation of an IT service that requires a managed response to restore normal operations.
    aliases:
      - outage
      - case
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      businessImpactSummary:
        type: text
      resolutionSummary:
        type: text
      closureSummary:
        type: text
      majorIncidentDeclared:
        type: boolean
      stepsTakenSummary:
        type: text
  ITService:
    meaning: A technology capability that supports one or more business services provided by the bank.
    aliases:
      - service
    properties:
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      serviceStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  Alert:
    meaning: A signal generated by monitoring tools that indicates a condition requiring review or action due to potential issues within IT services.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
  SecurityEvent:
    meaning: "An event that indicates an occurrence relevant to the security of information systems, often associated with potential threats or breaches."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - active
          - resolved
  Problem:
    meaning: The underlying cause or potential cause of one or more incidents that requires investigation to prevent future occurrences.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - investigating
          - root-cause-known
          - known-error
          - resolved
          - closed
  KnownError:
    meaning: "A documented problem that has been analyzed, identifying its cause and often providing a workaround until a permanent solution is implemented."
    aliases: []
    properties: {}
  ResolverGroup:
    meaning: A team of technical specialists assigned to diagnose and resolve incidents related to specific technology or service areas.
    aliases:
      - support group
    properties:
      supportDomain:
        type: text
  OnCallEngineer:
    meaning: A technical specialist available for immediate response to critical operational issues during assigned on-call periods.
    aliases:
      - duty engineer
    properties: {}
  IncidentCommander:
    meaning: "The individual responsible for coordinating and managing the response to a major incident, ensuring effective communication and decision-making."
    aliases:
      - incident manager
      - MIM lead
    properties: {}
  Workaround:
    meaning: A temporary solution that reduces or bypasses the impact of an incident or problem without necessarily fixing the underlying cause.
    aliases: []
    properties:
      title:
        type: text
      usageSummary:
        type: text
  Runbook:
    meaning: "A set of documented procedures and guidelines for managing, responding to, and recovering from specific operational tasks or incidents."
    aliases: []
    properties:
      title:
        type: text
      usageSummary:
        type: text
  MaterialityAssessment:
    meaning: An evaluation that determines the significance of an incident in terms of potential regulatory reporting obligations.
    aliases: []
    properties:
      required:
        type: boolean
      finding:
        type: text
  StakeholderCommunication:
    meaning: "A controlled message sent to relevant parties regarding the status and updates of an incident, ensuring transparency and information sharing."
    aliases:
      - notification
      - update
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - sent
          - archived
      receiptConfirmed:
        type: boolean
  Evidence:
    meaning: "A preserved record or artifact collected during incident management to support investigation, analysis, and decision-making."
    aliases: []
    properties:
      integrityMaintained:
        type: boolean
      collectionSummary:
        type: text
  BusinessServiceOwner:
    meaning: The person accountable for the overall delivery and performance of a specific business service offered by the bank.
    aliases: []
    properties: {}
  CommunicationsPersonnel:
    meaning: "The staff responsible for preparing and managing communications related to incidents, ensuring clarity and consistency in messaging."
    aliases: []
    properties: {}
  RegulatoryOfficer:
    meaning: The designated individual responsible for ensuring compliance with regulatory requirements and managing notifications to relevant authorities.
    aliases:
      - compliance officer
    properties: {}
  PostIncidentReview:
    meaning: null
    aliases: []
    properties: {}
relationships:
  - name: affects
    from: Incident
    to: ITService
    meaning: This incident affects this service.
    aliases:
      - impacts
      - influences
  - name: linkedToProblem
    from: Incident
    to: Problem
    meaning: This incident is linked to this previous or related problem.
    aliases: []
  - name: linkedToKnownError
    from: Incident
    to: KnownError
    meaning: This incident is linked to this known error.
    aliases: []
  - name: correlatedWithAlert
    from: Incident
    to: Alert
    meaning: This alert is correlated with this incident.
    aliases: []
  - name: correlatedWithSecurityEvent
    from: Incident
    to: SecurityEvent
    meaning: This security event is correlated with this incident.
    aliases: []
  - name: assignedToResolverGroup
    from: Incident
    to: ResolverGroup
    meaning: This incident is assigned to this resolver group.
    aliases:
      - assigned to support group
  - name: supportedByResolverGroup
    from: ITService
    to: ResolverGroup
    meaning: This service is supported by this resolver group.
    aliases:
      - managed by resolver group
  - name: assignedToOnCallEngineer
    from: Incident
    to: OnCallEngineer
    meaning: This incident is assigned to this on-call engineer.
    aliases:
      - assigned to duty engineer
  - name: hasOnCallEngineer
    from: ResolverGroup
    to: OnCallEngineer
    meaning: This resolver group’s current on-call engineer is this engineer.
    aliases: []
  - name: commandedBy
    from: Incident
    to: IncidentCommander
    meaning: This incident is being coordinated by this incident commander.
    aliases:
      - managed by
  - name: hasWorkaround
    from: Incident
    to: Workaround
    meaning: This workaround can be used to mitigate this incident.
    aliases:
      - includes workaround
  - name: hasRunbook
    from: Incident
    to: Runbook
    meaning: This runbook is relevant to handling this incident.
    aliases:
      - associated with runbook
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: This assessment evaluates whether the incident is materially significant or reportable.
    aliases:
      - includes materiality assessment
  - name: hasStakeholderCommunication
    from: Incident
    to: StakeholderCommunication
    meaning: This communication was issued for this incident.
    aliases:
      - contains stakeholder notification
  - name: hasEvidence
    from: Incident
    to: Evidence
    meaning: This evidence has been collected for this incident.
    aliases:
      - includes evidence collected
  - name: ownedByBusinessServiceOwner
    from: ITService
    to: BusinessServiceOwner
    meaning: This service owner is accountable for the business-facing ownership of the service.
    aliases: []
  - name: preparedByCommunicationsPersonnel
    from: StakeholderCommunication
    to: CommunicationsPersonnel
    meaning: This communication was prepared or managed by this communications role.
    aliases: []
  - name: handledByRegulatoryOfficer
    from: MaterialityAssessment
    to: RegulatoryOfficer
    meaning: This regulatory officer handles or reviews the regulatory-reporting aspect of this assessment.
    aliases: []
  - name: communicatedToBusinessServiceOwner
    from: Incident
    to: BusinessServiceOwner
    meaning: This service owner is one of the stakeholders directly communicated with for this incident.
    aliases: []
  - name: sentTo
    from: StakeholderCommunication
    to: BusinessServiceOwner
    meaning: This communication was sent to this business service owner.
    aliases:
      - delivered to
      - communicated to
  - name: appliesTo
    from: Runbook
    to: ITService
    meaning: This runbook applies to handling this service.
    aliases: []
  - name: appliesTo
    from: Workaround
    to: ITService
    meaning: This workaround applies to mitigating issues affecting this service.
    aliases: []
  - name: issuedForIncident
    from: StakeholderCommunication
    to: Incident
    meaning: This communication was issued for this incident.
    aliases: []
  - name: hasWorkaround
    from: KnownError
    to: Workaround
    meaning: This known error has this documented workaround.
    aliases: []
  - name: hasPostIncidentReview
    from: Incident
    to: PostIncidentReview
    meaning: This post-incident review was conducted for this incident.
    aliases: []
rules:
  canDeclareMajorIncident:
    conditions:
      - incident severity is sev1-critical or sev2-high
      - "incident status is not resolved, closed, or cancelled"
  requiresMaterialityAssessment:
    conditions:
      - incident severity is sev1-critical or sev2-high
      - or affected service criticality is tier-1-critical or tier-2-important
      - or incident is linked to a security event
      - or incident impacts multiple IT services
  canCloseIncident:
    conditions:
      - incident status is resolved
      - resolution summary is documented
      - evidence has been recorded
      - all necessary stakeholder communications have status sent or archived
      - impacted services have health state healthy or an accepted residual condition
  canSendStakeholderCommunication:
    conditions:
      - stakeholder communication status is approved
      - incident status is not closed or cancelled
  canFinalizeIncidentResolution:
    conditions:
      - incident status is resolved
      - resolution summary is documented
actions:
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: alert status becomes acknowledged
    verification: Read the alert again and confirm status is acknowledged.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: "incident majorIncidentDeclared becomes true, an incident commander is assigned, and coordination activities are initiated."
    verification: "Confirm majorIncidentDeclared is true and Incident -> commandedBy -> IncidentCommander is present."
  sendStakeholderCommunication:
    input: StakeholderCommunication
    preconditions:
      - canSendStakeholderCommunication
    effect: stakeholder communication status becomes sent
    verification: Confirm status is sent and the communication is linked to its incident and intended recipient.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions: []
    effect: "Incident -> assignedToResolverGroup -> ResolverGroup is set."
    verification: Confirm the incident is linked to the assigned resolver group.
  applyWorkaround:
    input: Incident
    preconditions: []
    effect: "Mitigation steps are applied, incident stepsTakenSummary is updated, and any incident impact metrics are updated if applicable."
    verification: Confirm mitigation steps are recorded and incident impact is reduced or contained.
  conductMaterialityAssessment:
    input: Incident
    preconditions:
      - requiresMaterialityAssessment
    effect: A materiality assessment is created or updated with required=true and a finding is recorded.
    verification: "Confirm Incident -> hasMaterialityAssessment -> MaterialityAssessment exists and the finding is populated."
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: incident status becomes closed and closure summary is recorded
    verification: Confirm incident status is closed and closure summary is present.
  investigateIncident:
    input: Incident
    preconditions: []
    effect: "Investigation findings are documented, relevant evidence is linked, and incident stepsTakenSummary is updated."
    verification: "Confirm findings are documented and Incident -> hasEvidence -> Evidence exists where evidence was collected."
  finalizeIncidentResolution:
    input: Incident
    preconditions:
      - canFinalizeIncidentResolution
    effect: Resolution summary is completed and supporting evidence is recorded.
    verification: Confirm resolution summary is present and incident evidence is linked.
  conductPostIncidentReview:
    input: Incident
    preconditions: []
    effect: "A post-incident review is completed, linked to the incident, and lessons learned are documented."
    verification: "Confirm Incident -> hasPostIncidentReview -> PostIncidentReview is present and review outcomes are recorded."
