competency_questions:
  - id: cq1
    text: Which business services are currently impacted by this incident?
  - id: cq2
    text: What IT services support the affected business service?
  - id: cq3
    text: Who is the service owner for the impacted IT service?
  - id: cq4
    text: Which configuration items are involved in this incident?
  - id: cq5
    text: What alerts or events are correlated with the incident?
  - id: cq6
    text: Has the incident met the criteria for a major-incident declaration?
  - id: cq7
    text: Which resolver group is assigned to handle this incident?
  - id: cq8
    text: What recovery plans are available to restore the affected IT service?
  - id: cq9
    text: Is there a valid emergency change connected to this incident?
  - id: cq10
    text: What evidence has been collected in relation to this incident?
  - id: cq11
    text: Have all required stakeholder communications been sent?
  - id: cq12
    text: "Is a regulatory notification necessary for this incident, and if so, what is the due date for submission?"
classes:
  Incident:
    meaning: "An incident is an unplanned interruption, degradation, or security condition requiring managed response."
    aliases: []
    properties:
      incidentId:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      currentState:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      majorIncidentDeclared:
        type: boolean
  BusinessService:
    meaning: A business service is a customer- or business-facing capability delivered by the bank.
    aliases: []
    properties:
      serviceName:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      currentState:
        type: text
        allowed:
          - operational
          - degraded
          - unavailable
          - retired
  ITService:
    meaning: An IT service is a managed technology capability supporting one or more business services.
    aliases:
      - informatics service
    properties:
      serviceName:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      currentState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
  ServiceOwner:
    meaning: A service owner is the role accountable for an IT service across its lifecycle.
    aliases: []
    properties:
      ownerName:
        type: text
      currentState:
        type: text
  ConfigurationItem:
    meaning: A configuration item is a managed component recorded in the configuration-management scope.
    aliases:
      - CI
    properties:
      ciIdentifier:
        type: text
      ciType:
        type: text
        allowed:
          - application
          - database
          - server
          - network-device
      currentState:
        type: text
        allowed:
          - active
          - inactive
          - under-maintenance
          - retired
  AlertOrEvent:
    meaning: An alert or event is a time-stamped observation indicating a noteworthy occurrence related to IT services or security.
    aliases: []
    properties:
      alertIdentifier:
        type: text
      alertType:
        type: text
        allowed:
          - performance
          - security
          - availability
          - operational
      detectedAt:
        type: date
      currentState:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
  ResolverGroup:
    meaning: A resolver group is a team assigned to diagnose and restore a specific technology or service area.
    aliases:
      - support group
    properties:
      groupName:
        type: text
      currentState:
        type: text
        allowed:
          - active
          - inactive
  RecoveryPlan:
    meaning: A recovery plan is a documented plan for restoring an IT service and its dependencies after an incident.
    aliases: []
    properties:
      planId:
        type: text
      currentState:
        type: text
        allowed:
          - active
          - outdated
          - approved
      lastTestedAt:
        type: date
  EmergencyChange:
    meaning: An emergency change is a change processed under an accelerated path to address an urgent operational need.
    aliases: []
    properties:
      changeId:
        type: text
      currentState:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      validFrom:
        type: date
      validTo:
        type: date
  Evidence:
    meaning: Evidence is a preserved record or artifact collected during incident management to support analysis and accountability.
    aliases: []
    properties:
      evidenceId:
        type: text
      evidenceType:
        type: text
        allowed:
          - document
          - log
          - screenshot
          - analysis
      collectedAt:
        type: date
      currentState:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
  StakeholderCommunication:
    meaning: A stakeholder communication is a controlled message sent to relevant parties regarding the status of an incident or service.
    aliases: []
    properties:
      communicationType:
        type: text
        allowed:
          - internal-update
          - customer-notification
          - regulatory-update
      sentAt:
        type: date
      deliveryState:
        type: text
        allowed:
          - pending
          - delivered
          - failed
      required:
        type: boolean
  RegulatoryNotification:
    meaning: A regulatory notification is a formal submission to a competent authority regarding an incident that may require reporting.
    aliases: []
    properties:
      notificationRequired:
        type: boolean
      dueDate:
        type: date
      currentState:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
relationships:
  - name: impacts
    from: Incident
    to: BusinessService
    meaning: An incident impacts a business service when it causes an unplanned interruption or degradation to that service.
    aliases: []
  - name: supportedBy
    from: BusinessService
    to: ITService
    meaning: A business service is supported by an IT service when the technology capability enables its delivery.
    aliases: []
  - name: ownedBy
    from: ITService
    to: ServiceOwner
    meaning: An IT service is owned by a service owner who is accountable for its management throughout its lifecycle.
    aliases: []
  - name: affects
    from: Incident
    to: ConfigurationItem
    meaning: An incident affects a configuration item when that item is impacted during the incident.
    aliases: []
  - name: correlatedWith
    from: Incident
    to: AlertOrEvent
    meaning: An incident is correlated with an alert or event when the alert or event provides relevant information or context related to the incident.
    aliases: []
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: An incident is assigned to a resolver group when that group is tasked with diagnosing and resolving the issue.
    aliases: []
  - name: restoredBy
    from: ITService
    to: RecoveryPlan
    meaning: An IT service is restored by a recovery plan when the plan outlines the steps needed to bring the service back online after an incident.
    aliases: []
  - name: justifiedBy
    from: EmergencyChange
    to: Incident
    meaning: "An emergency change is justified by an incident when the need for the change arises directly from that incident's urgency."
    aliases: []
  - name: includes
    from: Incident
    to: Evidence
    meaning: An incident includes evidence when records or artifacts are collected as part of the incident management process.
    aliases: []
  - name: includes
    from: Incident
    to: StakeholderCommunication
    meaning: An incident includes stakeholder communication when messages related to the incident are sent to relevant parties.
    aliases: []
  - name: requires
    from: Incident
    to: RegulatoryNotification
    meaning: An incident requires a regulatory notification when the situation necessitates reporting to a competent authority.
    aliases: []
  - name: hasEmergencyChange
    from: Incident
    to: EmergencyChange
    meaning: "An incident has an emergency change when a specific change is operationally linked to address the incident's needs."
    aliases: []
  - name: impacts
    from: Incident
    to: ITService
    meaning: An incident impacts an IT service when it disrupts or degrades the functioning of that service.
    aliases: []
  - name: relatedTo
    from: RegulatoryNotification
    to: Incident
    meaning: A regulatory notification is related to an incident when it concerns that specific incident for compliance purposes.
    aliases: []
  - name: linkedTo
    from: Evidence
    to: Incident
    meaning: Evidence is linked to an incident when a specific piece of evidence can be traced back to that particular incident for accountability.
    aliases: []
rules:
  majorIncidentCriteria:
    conditions:
      - "The incident currentState is not resolved, closed, or cancelled."
      - The incident severity is sev1-critical or sev2-high.
      - The incident impacts at least one ITService.
  validEmergencyChange:
    conditions:
      - The incident hasEmergencyChange at least one EmergencyChange.
      - The emergency change currentState is approved or scheduled.
      - The emergency change validFrom date is current.
  regulatoryNotificationNeeded:
    conditions:
      - The incident requires a RegulatoryNotification.
      - The regulatory notification currentState is pending-approval or approved.
      - The regulatory notification dueDate has not passed.
      - The related regulatory notification notificationRequired is true.
  requiredCommunicationsSent:
    conditions:
      - The incident includes at least one StakeholderCommunication.
      - The stakeholder communication required is true.
      - The stakeholder communication deliveryState is delivered.
      - The stakeholder communication sentAt is recorded.
  incidentAssignable:
    conditions:
      - The incident currentState is not closed or cancelled.
  emergencyChangeExecutable:
    conditions:
      - The emergency change currentState is approved.
      - The emergency change validFrom date is current.
  regulatoryNotificationSubmittable:
    conditions:
      - The regulatory notification currentState is approved.
  communicationSendable:
    conditions:
      - The incident includes at least one StakeholderCommunication.
      - The stakeholder communication deliveryState is not delivered.
actions:
  declareMajorIncident:
    input: Incident
    preconditions:
      - majorIncidentCriteria
    effect: incident majorIncidentDeclared becomes true
    verification: confirm incident majorIncidentDeclared is true
  assignIncident:
    input: Incident
    preconditions:
      - incidentAssignable
    effect: incident assignedTo is set to a ResolverGroup
    verification: confirm the incident is assignedTo a ResolverGroup
  sendStakeholderCommunication:
    input: Incident
    preconditions:
      - communicationSendable
    effect: incident includes a StakeholderCommunication and the stakeholder communication sentAt is recorded
    verification: confirm the incident includes the sent StakeholderCommunication and its sentAt is recorded
  recordEvidence:
    input: Incident
    preconditions: []
    effect: incident includes an Evidence item
    verification: confirm the incident includes the recorded Evidence item
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - regulatoryNotificationSubmittable
    effect: regulatory notification currentState becomes submitted
    verification: confirm regulatory notification currentState is submitted
  executeEmergencyChange:
    input: EmergencyChange
    preconditions:
      - emergencyChangeExecutable
    effect: emergency change currentState becomes implemented
    verification: confirm emergency change currentState is implemented
  linkEvidenceToIncident:
    input: null
    preconditions: []
    effect: ""
    verification: ""
  initiateRecoveryPlan:
    input: Incident
    preconditions: []
    effect: no direct model change is recorded; the action uses the ITService restoredBy RecoveryPlan relationship to identify the recovery plan to initiate
    verification: confirm the incident impacts an ITService that is restoredBy a RecoveryPlan whose currentState is active
