competency_questions:
  - id: cq1
    text: Which business services are currently affected by an incident?
  - id: cq2
    text: What root causes have been identified for an incident?
  - id: cq3
    text: What recurrence-prevention measures are identified for an incident?
  - id: cq4
    text: Which configuration items are implicated in an incident?
  - id: cq5
    text: How do implicated configuration items impact associated services?
  - id: cq6
    text: What is the status of a major incident declaration for an incident?
  - id: cq7
    text: Who is the assigned incident commander for an incident?
  - id: cq8
    text: Are there active alerts relevant to an incident investigation?
  - id: cq9
    text: Are there correlated events relevant to an incident investigation?
  - id: cq10
    text: What workaround options are available for an incident?
  - id: cq11
    text: Has a materiality assessment been conducted for an incident?
  - id: cq12
    text: Does an incident require regulatory notification?
  - id: cq13
    text: What evidence needs to be collected for an incident?
  - id: cq14
    text: How is evidence integrity and auditability ensured for an incident?
  - id: cq15
    text: Is there a recovery plan in place for an incident?
  - id: cq16
    text: What are the recovery objectives for services impacted by an incident?
  - id: cq17
    text: What stakeholder communications have been sent regarding an incident?
  - id: cq18
    text: What additional stakeholder communications are planned for an incident?
classes:
  Incident:
    meaning: An unplanned event causing disruption or degradation to IT services that requires managed response.
    aliases: []
    properties:
      identifier:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      startTime:
        type: date
      priority:
        type: text
  BusinessService:
    meaning: A capability delivered by the bank that provides value to customers or internal operations.
    aliases: []
    properties:
      currentStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
  ConfigurationItem:
    meaning: A component within the IT environment that is managed and tracked for its role in delivering services.
    aliases:
      - CI
    properties:
      currentStatus:
        type: text
        allowed:
          - operational
          - under-maintenance
          - decommissioned
          - affected
      isolationImpactAssessed:
        type: boolean
      reconnectionMethodAvailable:
        type: boolean
  Alert:
    meaning: A notification generated by monitoring systems indicating a condition that requires attention.
    aliases: []
    properties:
      alertStatus:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      alertTime:
        type: date
      alertSource:
        type: text
      contextAvailable:
        type: boolean
  Event:
    meaning: An observable occurrence within the IT environment that may signify a change in state or an important action.
    aliases: []
    properties:
      eventTime:
        type: date
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - resolved
          - closed
  RootCause:
    meaning: The underlying reason identified for one or more incidents that provides insight into what went wrong.
    aliases: []
    properties:
      recurrencePreventionMeasures:
        type: text
      status:
        type: text
        allowed:
          - under-investigation
          - confirmed
          - mitigated
      category:
        type: text
        allowed:
          - software-defect
          - configuration-error
          - capacity-shortage
          - hardware-failure
          - network-failure
          - human-error
          - process-failure
          - third-party-failure
          - cyber-attack
          - unknown
  Workaround:
    meaning: A temporary solution implemented to reduce the impact of an incident until a permanent fix is applied.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - active
          - inactive
          - under-review
      approvalFlag:
        type: boolean
  MaterialityAssessment:
    meaning: An evaluation determining the significance of an incident and whether it requires regulatory reporting.
    aliases: []
    properties:
      assessmentStatus:
        type: text
        allowed:
          - pending
          - complete
      assessmentOutcome:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      assessmentTime:
        type: date
  EvidenceItem:
    meaning: A piece of information collected during an incident that supports analysis and accountability.
    aliases: []
    properties:
      evidenceStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      collectionTime:
        type: date
      integrityState:
        type: text
        allowed:
          - intact
          - compromised
  RecoveryPlan:
    meaning: A documented strategy outlining the steps needed to restore an IT service after an incident.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - approved
          - in-progress
          - completed
          - archived
  StakeholderCommunication:
    meaning: A controlled message sent to inform affected parties about the status and details of an incident.
    aliases: []
    properties:
      communicationStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - sent
          - archived
      sentTime:
        type: date
      plannedTime:
        type: date
      audience:
        type: text
        allowed:
          - technical
          - management
          - business
          - customer
          - vendor
          - regulator
          - all-staff
  IncidentCommander:
    meaning: The individual responsible for managing and coordinating the response efforts during a major incident.
    aliases: []
    properties: {}
  ResolverGroup:
    meaning: A team designated to diagnose and resolve specific technical issues related to incidents.
    aliases:
      - Support Group
    properties:
      groupStatus:
        type: text
        allowed:
          - active
          - inactive
          - on-call
          - suspended
      supportScope:
        type: text
        allowed:
          - application-support
          - infrastructure-support
          - network-support
          - security-support
          - database-support
  TechnicalOwner:
    meaning: The person accountable for the engineering and maintenance of a particular configuration item or service.
    aliases: []
    properties: {}
  ApplicationOwner:
    meaning: The individual responsible for the functionality and operational fitness of a specific application.
    aliases: []
    properties: {}
  CommunicationOwner:
    meaning: The person responsible for managing and delivering communication messages related to incidents.
    aliases: []
    properties: {}
  ComplianceOfficer:
    meaning: The individual tasked with ensuring that regulatory obligations are met regarding incidents and operational practices.
    aliases: []
    properties: {}
  RecoveryLead:
    meaning: The person who oversees the execution of recovery plans and manages restoration efforts following incidents.
    aliases: []
    properties: {}
  ChangeManager:
    meaning: "The individual responsible for overseeing the change management process, including approvals and implementation of changes."
    aliases: []
    properties: {}
  OnCallEngineer:
    meaning: The technical specialist available for immediate response to incident-related issues during their on-call shift.
    aliases: []
    properties: {}
  RecoveryObjective:
    meaning: A specific target defined to guide the restoration of services following an incident.
    aliases: []
    properties:
      objectiveDescription:
        type: text
      targetTime:
        type: date
  RegulatoryNotification:
    meaning: A formal submission to regulatory authorities regarding incidents that meet certain significance criteria.
    aliases: []
    properties:
      notificationStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submissionTime:
        type: date
  EmergencyChange:
    meaning: A change made under expedited conditions to address urgent operational needs arising from an incident.
    aliases: []
    properties:
      changeStatus:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      implementationTime:
        type: date
      implementationPlanDocumented:
        type: boolean
      backoutPlanDocumented:
        type: boolean
      riskAccepted:
        type: boolean
  BackupSet:
    meaning: A collection of data protected for recovery purposes in case of data loss or corruption.
    aliases: []
    properties:
      backupStatus:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      verificationTime:
        type: date
  ContainmentMeasure:
    meaning: Actions taken to limit the impact of an incident and prevent further degradation of services.
    aliases: []
    properties:
      containmentStatus:
        type: text
        allowed:
          - active
          - inactive
          - under-review
      expectedSideEffects:
        type: text
      scope:
        type: text
  RecoveryEnvironment:
    meaning: A designated setting where services can be restored or failover activities occur during recovery efforts.
    aliases: []
    properties:
      environmentType:
        type: text
        allowed:
          - production
          - test
          - development
          - disaster-recovery
      currentStatus:
        type: text
        allowed:
          - available
          - unavailable
          - in-use
          - undergoing-maintenance
  MajorIncidentDeclaration:
    meaning: "The formal recognition of an incident that has significant impact, requiring enhanced coordination and management efforts."
    aliases: []
    properties:
      declarationStatus:
        type: text
        allowed:
          - active
          - resolved
          - cancelled
      declarationTime:
        type: date
relationships:
  - name: affects
    from: Incident
    to: BusinessService
    meaning: Represents the connection between an incident and the business services that are impacted by it.
    aliases: []
  - name: implicates
    from: Incident
    to: ConfigurationItem
    meaning: Indicates that an incident is linked to specific configuration items that are involved or affected.
    aliases: []
  - name: supports
    from: ConfigurationItem
    to: BusinessService
    meaning: Denotes that a configuration item provides necessary functionality for a business service to operate.
    aliases: []
  - name: hasAlert
    from: Incident
    to: Alert
    meaning: Indicates that an incident is associated with one or more alerts generated by monitoring systems.
    aliases: []
  - name: hasCorrelatedEvent
    from: Incident
    to: Event
    meaning: Represents the connection between an incident and events that are related or linked to its occurrence.
    aliases: []
  - name: hasMajorIncidentDeclaration
    from: Incident
    to: MajorIncidentDeclaration
    meaning: Indicates that an incident is formally associated with a declaration recognizing it as a major incident.
    aliases: []
  - name: hasIncidentCommander
    from: MajorIncidentDeclaration
    to: IncidentCommander
    meaning: "Denotes the assignment of an individual responsible for managing a major incident's response."
    aliases: []
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: Indicates that an incident has been allocated to a specific resolver group for investigation and resolution.
    aliases: []
  - name: supportedBy
    from: BusinessService
    to: ResolverGroup
    meaning: Represents the relationship where a business service is assisted or maintained by a specific resolver group.
    aliases: []
  - name: ownedByTechnicalOwner
    from: ConfigurationItem
    to: TechnicalOwner
    meaning: Denotes that a configuration item is under the responsibility of a designated technical owner.
    aliases: []
  - name: ownedByApplicationOwner
    from: BusinessService
    to: ApplicationOwner
    meaning: Indicates that a business service is the responsibility of a specific application owner.
    aliases: []
  - name: hasRootCause
    from: Incident
    to: RootCause
    meaning: Represents the link between an incident and the identified root cause of that incident.
    aliases: []
  - name: hasWorkaround
    from: Incident
    to: Workaround
    meaning: Denotes that an incident is associated with a workaround that temporarily mitigates its impact.
    aliases:
      - temporary solution
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: Indicates that an incident has a materiality assessment conducted to evaluate its significance.
    aliases: []
  - name: requiresRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: Represents the connection where an incident is determined to necessitate a formal notification to regulatory authorities.
    aliases: []
  - name: hasEvidenceItem
    from: Incident
    to: EvidenceItem
    meaning: Indicates that an incident is linked to specific evidence items collected during its investigation.
    aliases: []
  - name: hasRecoveryPlan
    from: Incident
    to: RecoveryPlan
    meaning: Denotes that an incident is associated with a documented plan outlining recovery steps.
    aliases: []
  - name: hasRecoveryObjective
    from: RecoveryPlan
    to: RecoveryObjective
    meaning: Represents the connection between a recovery plan and the specific recovery objectives it aims to achieve.
    aliases: []
  - name: hasRecoveryObjective
    from: BusinessService
    to: RecoveryObjective
    meaning: Represents the connection between a business service and the specific recovery objectives that apply to it.
    aliases: []
  - name: hasStakeholderCommunication
    from: Incident
    to: StakeholderCommunication
    meaning: Indicates that an incident includes communications sent to inform stakeholders about its status.
    aliases: []
  - name: hasContainmentMeasure
    from: Incident
    to: ContainmentMeasure
    meaning: Represents the link between an incident and the containment measures that have been implemented to limit its impact.
    aliases: []
  - name: appliesTo
    from: ContainmentMeasure
    to: ConfigurationItem
    meaning: Indicates that a containment measure is relevant for a specific configuration item.
    aliases: []
  - name: hasRecoveryEnvironment
    from: BusinessService
    to: RecoveryEnvironment
    meaning: Represents the connection where a business service is associated with a particular recovery environment for failover.
    aliases: []
  - name: manages
    from: RecoveryLead
    to: RecoveryPlan
    meaning: Denotes that a recovery lead oversees the execution of a recovery plan.
    aliases: []
  - name: managedBy
    from: EmergencyChange
    to: ChangeManager
    meaning: Indicates that an emergency change is overseen by a change manager.
    aliases: []
  - name: ownedBy
    from: StakeholderCommunication
    to: CommunicationOwner
    meaning: Indicates that a stakeholder communication is under the responsibility of a designated communication owner.
    aliases: []
  - name: handledBy
    from: RegulatoryNotification
    to: ComplianceOfficer
    meaning: Denotes that a regulatory notification is processed by a compliance officer.
    aliases: []
  - name: hasOnCallEngineer
    from: MajorIncidentDeclaration
    to: OnCallEngineer
    meaning: Indicates that a major incident declaration includes an on-call engineer responsible for real-time support.
    aliases: []
  - name: reviewedBy
    from: Alert
    to: OnCallEngineer
    meaning: Represents the connection between an alert and the on-call engineer who has reviewed it.
    aliases: []
  - name: implementedByEmergencyChange
    from: Incident
    to: EmergencyChange
    meaning: Denotes that an incident is resolved through the execution of an emergency change.
    aliases: []
  - name: usesBackupSet
    from: RecoveryPlan
    to: BackupSet
    meaning: Indicates that a recovery plan utilizes a specific backup set for restoration purposes.
    aliases: []
  - name: usesBackupSet
    from: Incident
    to: BackupSet
    meaning: Represents the connection where an incident can be associated with relevant backup sets needed for recovery.
    aliases: []
  - name: isLinkedTo
    from: BackupSet
    to: BusinessService
    meaning: Indicates that a backup set is associated with one or more business services that it supports.
    aliases: []
  - name: restores
    from: BackupSet
    to: ConfigurationItem
    meaning: Denotes that a backup set is capable of restoring a specific configuration item.
    aliases: []
  - name: linkedToIncident
    from: EmergencyChange
    to: Incident
    meaning: null
    aliases: []
  - name: linkedToIncident
    from: StakeholderCommunication
    to: Incident
    meaning: null
    aliases: []
  - name: linkedToIncident
    from: RegulatoryNotification
    to: Incident
    meaning: null
    aliases: []
rules:
  canDeclareMajorIncident:
    conditions:
      - "Incident status is not resolved, closed, or cancelled."
      - Incident severity is sev1-critical or sev2-high.
      - Incident affects at least one BusinessService.
      - Incident has a MajorIncidentDeclaration with an IncidentCommander assigned.
  canSubmitRegulatoryNotification:
    conditions:
      - Incident has a MaterialityAssessment whose assessmentOutcome is reportable or potentially-reportable.
      - Incident requires a RegulatoryNotification whose notificationStatus is approved.
  canFailOverService:
    conditions:
      - Incident affects a BusinessService.
      - BusinessService has a RecoveryEnvironment whose currentStatus is available.
      - Incident has a RecoveryPlan.
      - BusinessService has a RecoveryObjective.
  canRestoreBackup:
    conditions:
      - Incident uses a BackupSet whose backupStatus is successful or verified.
      - BackupSet restores a ConfigurationItem.
      - Incident implicates the ConfigurationItem.
      - Incident has a RecoveryPlan whose status is approved or in-progress.
  canAssignIncident:
    conditions:
      - Incident status is not closed or cancelled.
      - Incident priority is defined.
      - Incident affects a BusinessService supported by a ResolverGroup whose groupStatus is active or on-call.
      - Or Incident implicates a ConfigurationItem whose TechnicalOwner can be used to route it.
  canContainIncident:
    conditions:
      - Incident status is acknowledged or investigating.
      - Incident has a ContainmentMeasure.
      - The ContainmentMeasure has expectedSideEffects recorded.
      - The ContainmentMeasure has scope recorded.
  canIsolateConfigurationItem:
    conditions:
      - Incident implicates the ConfigurationItem.
      - ConfigurationItem isolationImpactAssessed is true.
      - ConfigurationItem reconnectionMethodAvailable is true.
  canExecuteEmergencyChange:
    conditions:
      - "Incident status is not resolved, closed, or cancelled."
      - Incident is linked to an EmergencyChange.
      - EmergencyChange implementationPlanDocumented is true.
      - EmergencyChange backoutPlanDocumented is true.
      - EmergencyChange riskAccepted is true.
  canSendStakeholderCommunication:
    conditions:
      - Incident status is defined.
      - Incident has a StakeholderCommunication.
      - StakeholderCommunication communicationStatus is approved.
      - StakeholderCommunication audience is defined.
      - StakeholderCommunication is ownedBy a CommunicationOwner.
  canAcknowledgeAlert:
    conditions:
      - Alert alertStatus is new.
      - Alert contextAvailable is true.
      - Alert is reviewedBy an OnCallEngineer.
  canFailOverRecoveryEnvironment:
    conditions:
      - RecoveryEnvironment currentStatus is available.
  canIsolateConfigurationItemDirect:
    conditions:
      - ConfigurationItem isolationImpactAssessed is true.
      - ConfigurationItem reconnectionMethodAvailable is true.
  canRestoreFromBackupSet:
    conditions:
      - BackupSet backupStatus is successful or verified.
  canSubmitApprovedRegulatoryNotification:
    conditions:
      - RegulatoryNotification notificationStatus is approved.
  canSendApprovedStakeholderCommunication:
    conditions:
      - StakeholderCommunication communicationStatus is approved.
      - StakeholderCommunication audience is defined.
      - StakeholderCommunication is ownedBy a CommunicationOwner.
actions:
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: Alert receipt is confirmed and review is initiated.
    verification: Confirm the alert is marked as acknowledged and linked to an active review.
  assignIncident:
    input: Incident
    preconditions:
      - canAssignIncident
    effect: The incident is assigned to the appropriate resolver group for handling.
    verification: Confirm the incident has an assigned resolver group.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: A major incident declaration is recorded for the incident.
    verification: Confirm the incident shows an active major incident declaration.
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: Approved containment measures are applied to limit further impact.
    verification: Confirm containment measures are recorded and incident impact is no longer increasing.
  isolateConfigurationItem:
    input: ConfigurationItem
    preconditions:
      - canIsolateConfigurationItemDirect
    effect: ConfigurationItem currentStatus becomes affected.
    verification: Confirm ConfigurationItem currentStatus is affected.
  failOverService:
    input: RecoveryEnvironment
    preconditions:
      - canFailOverRecoveryEnvironment
    effect: RecoveryEnvironment currentStatus becomes in-use.
    verification: Confirm RecoveryEnvironment currentStatus is in-use.
  restoreBackup:
    input: BackupSet
    preconditions:
      - canRestoreFromBackupSet
    effect: A ConfigurationItem is restored from the BackupSet.
    verification: Confirm restored data is available from the BackupSet restoration.
  executeEmergencyChange:
    input: EmergencyChange
    preconditions:
      - canExecuteEmergencyChange
    effect: An expedited change is implemented to address the incident.
    verification: Confirm the emergency change is recorded as implemented and linked to the incident.
  sendStakeholderCommunication:
    input: StakeholderCommunication
    preconditions:
      - canSendApprovedStakeholderCommunication
    effect: "StakeholderCommunication audience is confirmed, communicationStatus becomes sent, and sentTime is recorded."
    verification: "Confirm StakeholderCommunication audience is set, communicationStatus is sent, and sentTime is recorded."
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitApprovedRegulatoryNotification
    effect: RegulatoryNotification notificationStatus becomes submitted and submissionTime is recorded.
    verification: Confirm RegulatoryNotification notificationStatus is submitted and submissionTime is recorded.
