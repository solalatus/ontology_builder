classes:
  Incident:
    meaning: An unplanned disruption or degradation of service that requires management and resolution to restore normal operations.
    aliases:
      - support ticket
    properties:
      impactLevel:
        type: text
        allowed:
          - enterprise-wide
          - multiple-services
          - single-service
          - limited-users
          - no-observed-impact
      urgencyLevel:
        type: text
        allowed:
          - immediate
          - high
          - normal
          - low
      priorityLevel:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      isMajorIncident:
        type: boolean
  IT Service:
    meaning: "A technology capability that is managed and delivered by the bank, supporting one or more business services."
    aliases:
      - technology service
    properties:
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  Configuration Item:
    meaning: "A managed component that is recorded and tracked as part of the configuration management system, including hardware, software, and documentation."
    aliases:
      - CI
    properties: {}
  Alert:
    meaning: A notification generated by monitoring systems that indicates a potential issue requiring attention or action.
    aliases:
      - notification
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
  Incident Commander:
    meaning: The individual responsible for coordinating the response to a major incident and ensuring effective communication and decision-making throughout the incident lifecycle.
    aliases:
      - MIM lead
      - incident manager
    properties: {}
  Resolver Group:
    meaning: A team of technical specialists assigned to diagnose and restore specific technology or service areas during incidents.
    aliases:
      - support team
      - resolution team
    properties: {}
  Service Owner:
    meaning: The individual accountable for the overall management and performance of an IT service throughout its lifecycle.
    aliases:
      - service custodian
    properties: {}
  Containment Step:
    meaning: A predefined action or measure taken to limit the impact of an incident while it is being resolved.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - pending
          - in-progress
          - completed
  Workaround:
    meaning: A temporary solution that reduces or bypasses the effects of an incident or problem without necessarily addressing the root cause.
    aliases: []
    properties:
      available:
        type: boolean
  Materiality Assessment:
    meaning: A documented evaluation that determines the significance of an incident and whether it needs to be reported to regulatory authorities.
    aliases: []
    properties:
      completed:
        type: boolean
  Known Error:
    meaning: "A documented issue that has an identified cause and a temporary workaround, which may lead to recurring incidents if not resolved."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - active
          - resolved
          - retired
  Regulatory Notification Workflow:
    meaning: The structured process for documenting and submitting required notifications to regulatory authorities in response to incidents.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  Stakeholder Communication:
    meaning: A controlled message created and sent to relevant stakeholders to inform them about the status and impact of an incident.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - sent
          - acknowledged
  Backup:
    meaning: A copy of data stored securely to ensure recovery in the event of data loss or service disruption.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
  Emergency Change:
    meaning: "A change that is processed through an accelerated path to address an urgent operational need, typically linked to an active incident."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  Post-Incident Review:
    meaning: "A structured evaluation conducted after an incident to analyze causes, review the response effectiveness, and identify lessons learned for future improvements."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - open
          - in-progress
          - completed
          - validated
          - closed
  Major Incident Coordinator:
    meaning: The individual responsible for facilitating and managing the response to significant incidents that require enhanced coordination and communication.
    aliases:
      - incident response lead
    properties: {}
  Service Manager:
    meaning: "The individual who oversees the performance and delivery of an IT service, ensuring it meets the needs and expectations of its stakeholders."
    aliases:
      - Service Delivery Manager
    properties: {}
  Technical Support Engineer:
    meaning: A technical specialist responsible for diagnosing and resolving issues related to IT services and infrastructure.
    aliases: []
    properties: {}
  Application Support Specialist:
    meaning: "An expert focused on providing support for specific applications, handling incidents, and performing troubleshooting activities to ensure functionality."
    aliases: []
    properties: {}
  Service Criticality Tier:
    meaning: A classification that defines the importance of an IT service in terms of its impact on business operations and customer service.
    aliases: []
    properties: {}
  Time of Day:
    meaning: "A reference to the specific hours during which service operations are conducted, influencing the availability of resources and incident response."
    aliases: []
    properties: {}
  On-call Coverage:
    meaning: "A defined schedule that identifies personnel available to respond to incidents outside of regular business hours, ensuring ongoing support and management."
    aliases: []
    properties: {}
relationships:
  - name: impacts
    from: Incident
    to: IT Service
    meaning: An incident negatively affects the functioning or availability of a specific IT service.
    aliases: []
  - name: impacts
    from: Incident
    to: Configuration Item
    meaning: An incident causes disruption or issues that affect a specific configuration item within the IT environment.
    aliases: []
  - name: triggers
    from: Alert
    to: Incident
    meaning: "An alert from monitoring systems signals the presence of an issue, leading to the creation or acknowledgment of an incident."
    aliases: []
  - name: hasIncidentCommander
    from: Incident
    to: Incident Commander
    meaning: An incident is assigned a designated leader responsible for coordinating its response and management.
    aliases:
      - appointed commander
      - incident lead
  - name: assignedTo
    from: Incident
    to: Resolver Group
    meaning: An incident is allocated to a specific resolver group tasked with diagnosing and resolving the issue.
    aliases:
      - allocated to
      - designated to
  - name: hasServiceOwner
    from: IT Service
    to: Service Owner
    meaning: An IT service is assigned a responsible individual who oversees its management and operational effectiveness.
    aliases:
      - service custodian
  - name: hasContainmentStep
    from: Incident
    to: Containment Step
    meaning: An incident is linked to specific predefined actions that aim to limit its impact until resolution is achieved.
    aliases: []
  - name: hasWorkaround
    from: Incident
    to: Workaround
    meaning: An incident is associated with a temporary solution designed to mitigate its effects while a permanent fix is being developed.
    aliases: []
  - name: hasMaterialityAssessment
    from: Incident
    to: Materiality Assessment
    meaning: An incident is tied to a formal evaluation that assesses its significance and determines if it requires reporting to regulatory bodies.
    aliases: []
  - name: relatesToKnownError
    from: Incident
    to: Known Error
    meaning: "An incident is connected to a documented issue that has an identified cause and a workaround, indicating a recurring problem."
    aliases: []
  - name: initiates
    from: Incident
    to: Regulatory Notification Workflow
    meaning: An incident triggers the process of documenting and submitting necessary notifications to regulatory authorities based on its assessment.
    aliases: []
  - name: hasStakeholderCommunication
    from: Incident
    to: Stakeholder Communication
    meaning: An incident is associated with messages created to inform relevant stakeholders about the status and impact of the situation.
    aliases: []
  - name: hasBackup
    from: IT Service
    to: Backup
    meaning: An IT service is supported by a defined collection of data that can be restored in case of data loss or service disruption.
    aliases: []
  - name: linkedToEmergencyChange
    from: Incident
    to: Emergency Change
    meaning: An incident is connected to a change that is processed with urgency to address an immediate operational need.
    aliases:
      - associated with emergency change
  - name: hasPostIncidentReview
    from: Incident
    to: Post-Incident Review
    meaning: An incident is associated with a structured evaluation conducted after its resolution to analyze the response and identify areas for improvement.
    aliases: []
  - name: hasCriticalityTier
    from: IT Service
    to: Service Criticality Tier
    meaning: An IT service is linked to a classification that defines its importance based on its impact on business operations and customer service.
    aliases: []
  - name: appliesDuring
    from: On-call Coverage
    to: Time of Day
    meaning: On-call coverage determines the specific hours during which designated personnel are available to respond to incidents.
    aliases: []
  - name: hasOnCallCoverage
    from: Resolver Group
    to: On-call Coverage
    meaning: A resolver group is associated with defined on-call arrangements that specify the available team members and their coverage times for incident response.
    aliases: []
  - name: occursDuring
    from: Incident
    to: Time of Day
    meaning: "An incident is identified with a specific timeframe, influencing resource availability and incident management processes."
    aliases: []
  - name: hasServiceManager
    from: IT Service
    to: Service Manager
    meaning: An IT service is linked to an individual responsible for overseeing its performance and delivery.
    aliases: []
  - name: hasTechnicalSupportEngineer
    from: Resolver Group
    to: Technical Support Engineer
    meaning: A resolver group includes technical support engineers who are tasked with diagnosing and resolving incidents.
    aliases: []
  - name: hasApplicationSupportSpecialist
    from: Resolver Group
    to: Application Support Specialist
    meaning: A resolver group comprises application support specialists who focus on resolving incidents related to specific applications.
    aliases: []
  - name: supports
    from: Major Incident Coordinator
    to: Incident Commander
    meaning: A major incident coordinator assists the incident commander in managing the response to significant incidents.
    aliases: []
  - name: supportedBy
    from: IT Service
    to: Resolver Group
    meaning: An IT service is connected to a resolver group that provides necessary support and resolution capabilities during incidents.
    aliases:
      - aided by
  - name: supports
    from: Configuration Item
    to: IT Service
    meaning: A configuration item is connected to an IT service by providing necessary functionality and support for its operations.
    aliases: []
  - name: starts
    from: Materiality Assessment
    to: Regulatory Notification Workflow
    meaning: "A materiality assessment triggers the formal process for documenting and submitting notifications to regulatory authorities based on the evaluation of an incident's significance."
    aliases: []
  - name: affects
    from: Emergency Change
    to: IT Service
    meaning: "An emergency change has an impact on an IT service, potentially altering its functionality, availability, or configuration in response to an urgent operational need."
    aliases: []
  - name: reviews
    from: Post-Incident Review
    to: Incident
    meaning: A post-incident review evaluates the incident to analyze the effectiveness of the response and identify areas for improvement.
    aliases: []
rules:
  shouldStartRegulatoryNotificationWorkflow:
    conditions:
      - The materiality assessment is completed.
      - The incident meets the criteria for being reportable to the regulatory authorities.
      - There is a need to create a regulatory notification based on the outcomes of the assessment.
  canCloseIncident:
    conditions:
      - The incident status must be either resolved or monitoring.
      - All impacted services must have a health state of healthy or an accepted residual condition.
      - Required stakeholder communications must be complete.
      - Major incidents must have undergone a scheduled or completed post-incident review.
  canAssignIncidentToResolverGroup:
    conditions:
      - The incident must not be in a closed or cancelled state.
  canAcknowledgeAlert:
    conditions:
      - The alert status is new or escalated.
  canDeclareMajorIncident:
    conditions:
      - The incident is not already marked as a major incident.
  canSendStakeholderCommunication:
    conditions:
      - There is a Stakeholder Communication linked to the Incident with status draft.
  canRestoreBackupForAffectedService:
    conditions:
      - There is a Backup linked to the IT Service with status verified.
  canExecuteEmergencyChange:
    conditions:
      - There is an Emergency Change linked to the Incident with status approved or scheduled.
  canConductPostIncidentReview:
    conditions:
      - There is a Post-Incident Review linked to the Incident with status open or in-progress.
actions:
  startRegulatoryNotificationWorkflow:
    input: Incident
    preconditions:
      - shouldStartRegulatoryNotificationWorkflow
    effect: "Create or link a Regulatory Notification Workflow for the Incident, with workflow status set to draft."
    verification: Confirm the Incident is linked to a Regulatory Notification Workflow and that the workflow status is draft.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions:
      - canAssignIncidentToResolverGroup
    effect: The incident is assigned to a designated resolver group.
    verification: Confirm that the incident shows a link to the intended resolver group through the assignedTo relationship.
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: The alert status becomes acknowledged.
    verification: Confirm that the alert status is acknowledged.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: "The incident's isMajorIncident property becomes true."
    verification: Confirm that Incident.isMajorIncident is true.
  sendStakeholderCommunication:
    input: Incident
    preconditions:
      - canSendStakeholderCommunication
    effect: The linked Stakeholder Communication status becomes sent.
    verification: Confirm that the linked Stakeholder Communication status is sent.
  restoreBackupForAffectedService:
    input: IT Service
    preconditions:
      - canRestoreBackupForAffectedService
    effect: The IT Service healthState becomes recovering.
    verification: Confirm that the IT Service healthState is recovering.
  executeEmergencyChange:
    input: Incident
    preconditions:
      - canExecuteEmergencyChange
    effect: The linked Emergency Change status becomes implementing.
    verification: Confirm that the linked Emergency Change status is implementing.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: The incident status becomes closed.
    verification: Confirm that Incident.status reflects closed.
  conductPostIncidentReview:
    input: Incident
    preconditions:
      - canConductPostIncidentReview
    effect: The linked Post-Incident Review status becomes completed.
    verification: Confirm that the linked Post-Incident Review status reflects completed.
