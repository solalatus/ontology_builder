classes:
  Incident:
    meaning: "An unplanned interruption, degradation, or security condition requiring managed response."
    aliases:
      - incidens
      - hibajegy
    properties:
      incidentId:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severityLevel:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      majorIncidentDeclared:
        type: boolean
      materialityAssessmentNeeded:
        type: boolean
  Service:
    meaning: A managed technology capability that supports business functions and customer-facing capabilities.
    aliases:
      - szolgáltatás
    properties:
      serviceId:
        type: text
      name:
        type: text
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  Alert:
    meaning: A signal generated by monitoring tools indicating a condition that requires attention or review.
    aliases:
      - riasztás
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
  ResolverGroup:
    meaning: A team assigned to diagnose and restore specific technology or service areas in response to incidents.
    aliases:
      - megoldócsoport
      - support group
    properties:
      name:
        type: text
  IncidentCommander:
    meaning: The person accountable for overseeing and coordinating the response during a major incident.
    aliases:
      - incidensparancsnok
      - MIM lead
    properties:
      name:
        type: text
  Workaround:
    meaning: A temporary method that reduces or bypasses the impact of an incident or problem without addressing the root cause.
    aliases: []
    properties:
      description:
        type: text
      status:
        type: text
  Change:
    meaning: A controlled modification or addition to an IT service or its components to alter system behavior.
    aliases: []
    properties:
      changeId:
        type: text
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      deployedAt:
        type: date
  Evidence:
    meaning: "A preserved record, artifact, or observation that supports incident analysis and accountability."
    aliases: []
    properties:
      evidenceId:
        type: text
      description:
        type: text
      collectedAt:
        type: date
  RecoveryPlan:
    meaning: A documented procedure for restoring an IT service and its dependencies after an incident or disruption.
    aliases: []
    properties:
      recoveryPlanId:
        type: text
      description:
        type: text
      status:
        type: text
      recoveryTimeObjective:
        type: text
      recoveryPointObjective:
        type: text
  ThirdPartyService:
    meaning: An externally provided service that the bank relies on to deliver its business functions or IT services.
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
  MaterialityAssessment:
    meaning: A documented evaluation that determines the significance of an incident and whether it warrants regulatory reporting.
    aliases: []
    properties:
      assessmentId:
        type: text
      status:
        type: text
      result:
        type: text
      rationale:
        type: text
  StakeholderCommunication:
    meaning: "A controlled message sent to relevant parties providing updates and information about an incident's status and impact."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      audience:
        type: text
      messageContent:
        type: text
      owner:
        type: text
      approvalState:
        type: text
      sentAt:
        type: date
      deliveryStatus:
        type: text
  Metric:
    meaning: A quantitative measure that provides insights into the performance and health of services or components over time.
    aliases: []
    properties:
      name:
        type: text
      value:
        type: number
      measuredAt:
        type: date
  PostIncidentReview:
    meaning: A structured analysis conducted after an incident to evaluate the response effectiveness and identify lessons learned for future improvement.
    aliases: []
    properties:
      scheduledDate:
        type: date
      status:
        type: text
        allowed:
          - new
          - in-progress
          - completed
  BusinessOwner:
    meaning: The individual responsible for ensuring that a business service aligns with organizational goals and meets stakeholder needs.
    aliases: []
    properties:
      name:
        type: text
  OnCallEngineer:
    meaning: A technical specialist available to respond urgently to incidents during non-standard hours or when immediate operational support is required.
    aliases: []
    properties:
      name:
        type: text
  RegulatoryNotification:
    meaning: A formal submission related to an incident that needs to be communicated to a regulatory authority.
    aliases: []
    properties:
      notificationId:
        type: text
      status:
        type: text
      dueDate:
        type: date
      requiredFieldsComplete:
        type: boolean
  Regulator:
    meaning: The authoritative body that oversees and receives required notifications from the bank.
    aliases: []
    properties:
      name:
        type: text
  ContainmentSteps:
    meaning: "A documented procedure or set of actions that outlines how to contain an incident's impact and restore normal operations."
    aliases: []
    properties:
      stepsId:
        type: text
      description:
        type: text
      approved:
        type: boolean
relationships:
  - name: affects
    from: Incident
    to: Service
    meaning: "Indicates that an incident has an impact on a specific service, leading to disruption or degradation of its functionality."
    aliases:
      - impacts
      - influences
  - name: relatesTo
    from: Alert
    to: Incident
    meaning: "Connects an alert generated by monitoring tools to the specific incident that it pertains to, indicating the need for investigation."
    aliases: []
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: Identifies the resolver group that is tasked with addressing and resolving a particular incident.
    aliases:
      - allocatedTo
      - taskedTo
  - name: hasWorkaround
    from: Incident
    to: Workaround
    meaning: Indicates that there is a temporary solution available to mitigate the impact of an incident while a permanent resolution is being sought.
    aliases: []
  - name: hasEvidence
    from: Incident
    to: Evidence
    meaning: Links an incident to the evidence collected that supports the analysis and understanding of the incident.
    aliases: []
  - name: associatedWith
    from: Incident
    to: Change
    meaning: "Links an incident to changes that may have been implemented prior to the occurrence of the incident, suggesting potential causation."
    aliases:
      - linkedTo
      - relatedTo
  - name: coveredBy
    from: Service
    to: RecoveryPlan
    meaning: Refers to the recovery plan that is in place to restore a service in the event of an incident affecting it.
    aliases:
      - protectedBy
      - securedBy
  - name: involves
    from: Incident
    to: ThirdPartyService
    meaning: Indicates that an incident is connected to one or more third-party services that may be affected or implicated in the incident.
    aliases: []
  - name: measuredBy
    from: Service
    to: Metric
    meaning: "Relates a service to the metrics that assess its performance and health over time, providing insight into its operational state."
    aliases: []
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: Connects an incident to the materiality assessment that evaluates its significance and determines whether regulatory reporting is required.
    aliases: []
  - name: hasPostIncidentReview
    from: Incident
    to: PostIncidentReview
    meaning: Links an incident to the post-incident review conducted to analyze the response and identify lessons learned for future improvements.
    aliases: []
  - name: declaredBy
    from: Incident
    to: IncidentCommander
    meaning: "Identifies the incident commander responsible for declaring the incident as a major incident, leading to enhanced coordination and response efforts."
    aliases: []
  - name: ownedBy
    from: Service
    to: BusinessOwner
    meaning: "Indicates the business owner accountable for the service, ensuring it aligns with organizational objectives and meets stakeholder needs."
    aliases: []
  - name: supportedBy
    from: Service
    to: OnCallEngineer
    meaning: Connects a service to the on-call engineer tasked with providing immediate operational support when incidents occur.
    aliases: []
  - name: hasStakeholderCommunication
    from: Incident
    to: StakeholderCommunication
    meaning: "Links an incident to the communications that have been sent to stakeholders, informing them of the incident status and impact."
    aliases: []
  - name: about
    from: StakeholderCommunication
    to: Incident
    meaning: "Relates a stakeholder communication to the specific incident it addresses, ensuring clarity in communication regarding the incident's details."
    aliases: []
  - name: requires
    from: Incident
    to: Change
    meaning: Indicates that a specific change is necessary to address or resolve the ongoing incident.
    aliases:
      - needs
      - necessitates
  - name: regardsIncident
    from: RegulatoryNotification
    to: Incident
    meaning: "Connects a regulatory notification to the incident it pertains to, ensuring that all reporting obligations are aligned."
    aliases: []
  - name: requiresRegulator
    from: RegulatoryNotification
    to: Regulator
    meaning: Links a regulatory notification to the specific regulatory authority responsible for overseeing the incident.
    aliases: []
  - name: hasRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: Indicates that an incident is associated with a regulatory notification that may need to be submitted.
    aliases: []
  - name: supportedByResolverGroup
    from: Service
    to: ResolverGroup
    meaning: Identifies the resolver group that provides operational support for a service and can be assigned incidents affecting it.
    aliases: []
  - name: forIncident
    from: Change
    to: Incident
    meaning: "Relates a change to the incident it addresses, indicating that the change is implemented to resolve or mitigate the incident's impact."
    aliases: []
  - name: appliesTo
    from: RecoveryPlan
    to: Service
    meaning: Indicates the service to which a recovery plan can be applied for restoration after an incident.
    aliases: []
  - name: relatesToIncident
    from: ContainmentSteps
    to: Incident
    meaning: Connects containment steps to the specific incident they are intended to contain.
    aliases: []
rules:
  canDeclareMajorIncident:
    conditions:
      - "The incident is not in resolved, closed, or cancelled status."
      - The incident severityLevel is sev1-critical or sev2-high.
      - The incident affects at least one Service.
      - An IncidentCommander is assigned and authorized to make the declaration.
  canCloseIncident:
    conditions:
      - The incident status is resolved or monitoring.
      - All Services affected by the incident have healthState healthy or an accepted residual condition.
      - Evidence of the resolution and restoration is recorded for the incident.
      - All required StakeholderCommunication items for the incident are complete.
      - "If the incident is a major incident, a PostIncidentReview is scheduled or completed."
  canStartRegulatoryReporting:
    conditions:
      - The incident has a MaterialityAssessment whose result is reportable.
      - The incident has a RegulatoryNotification.
      - The RegulatoryNotification requires a Regulator.
      - The RegulatoryNotification requiredFieldsComplete is true.
      - The RegulatoryNotification status is approved.
      - The current time is before the RegulatoryNotification dueDate.
  canAssignIncident:
    conditions:
      - The Incident status is not closed or cancelled.
      - At least one Service affected by the Incident is supportedByResolverGroup the target ResolverGroup.
  canSendStakeholderCommunication:
    conditions:
      - "The StakeholderCommunication has audience, messageContent, owner, and approvalState recorded."
      - The StakeholderCommunication content matches the latest verified state of the Incident.
  canExecuteEmergencyChange:
    conditions:
      - "The Change is for an Incident whose status is not resolved, closed, or cancelled."
      - The Change status is approved.
  canDocumentIncidentFindings:
    conditions:
      - Findings from the incident investigation are available to record.
  canInitiateBackupRestore:
    conditions:
      - The RecoveryPlan appliesTo at least one Service affected by the Incident.
      - The RecoveryPlan status is approved.
  canAcknowledgeAlert:
    conditions:
      - The Alert status is new.
  canContainIncident:
    conditions:
      - The Incident status is acknowledged or investigating.
      - Approved ContainmentSteps are defined for the Incident.
actions:
  startRegulatoryReportingWorkflow:
    input: Incident
    preconditions:
      - canStartRegulatoryReporting
    effect: "The regulatory reporting workflow is initiated for the incident's RegulatoryNotification."
    verification: Confirm the RegulatoryNotification workflow has started and is linked to the incident.
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: The incident status is updated to closed.
    verification: Confirm the incident status is now closed and record the closure timestamp.
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: The incident is classified as a major incident.
    verification: Confirm the major incident status is set and that coordination procedures have been initiated.
  sendStakeholderCommunication:
    input: Incident
    preconditions:
      - canSendStakeholderCommunication
    effect: The communication message is sent and timestamped.
    verification: Confirm the delivery status and archive the final message.
  executeEmergencyChange:
    input: Change
    preconditions:
      - canExecuteEmergencyChange
    effect: The approved emergency change is implemented and its status is updated.
    verification: "Run technical checks, verify service health, and record implementation evidence."
  documentIncidentFindings:
    input: Incident
    preconditions:
      - canDocumentIncidentFindings
    effect: The incident record is updated to include findings and lessons learned.
    verification: Confirm that findings are now recorded in the incident documentation.
  initiateBackupRestore:
    input: RecoveryPlan
    preconditions:
      - canInitiateBackupRestore
    effect: The approved backup restore procedure is executed for the affected service.
    verification: "Confirm the restoration status and that the service is operational, along with validation results."
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: The alert status is updated to acknowledged and the acknowledgment timestamp is recorded.
    verification: Confirm the alert status is now acknowledged and that the timestamp is recorded.
  assignIncident:
    input: Incident
    preconditions:
      - canAssignIncident
    effect: The incident is assigned to the appropriate resolver group.
    verification: Confirm the incident now shows the assigned resolver group.
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: The approved containment steps are executed for the incident.
    verification: Confirm that containment indicators are met and assess the service impact.
