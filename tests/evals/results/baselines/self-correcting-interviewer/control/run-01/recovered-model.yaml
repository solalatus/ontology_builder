classes:
  Incident:
    meaning: An unplanned interruption or degradation of an IT service that requires a managed response.
    aliases:
      - hibajegy
    properties:
      priorityLevel:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      majorIncidentDeclared:
        type: boolean
      lastAcknowledgedAt:
        type: date
      openedAt:
        type: date
      workaroundAvailable:
        type: boolean
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      closedAt:
        type: date
  BusinessService:
    meaning: A customer-facing capability provided by the bank that supports specific business processes.
    aliases:
      - üzleti szolgáltatás
    properties: {}
  ITService:
    meaning: "A managed technology service that underpins one or more business services, ensuring operational reliability."
    aliases:
      - informatikai szolgáltatás
    properties:
      recoveryTimeObjective:
        type: text
      healthStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
  Alert:
    meaning: "A notification generated by monitoring tools indicating a condition that requires attention or action, potentially linked to an incident."
    aliases:
      - riasztás
    properties:
      acknowledgedAt:
        type: date
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
  ServiceOwner:
    meaning: The individual accountable for the overall management and performance of a particular IT service throughout its lifecycle.
    aliases: []
    properties: {}
  ResolverGroup:
    meaning: A team of technical experts assigned to diagnose and resolve incidents related to specific technology or service areas.
    aliases:
      - megoldócsoport
    properties: {}
  OnCallEngineer:
    meaning: A technical specialist available to respond to incidents and operational issues during designated on-call periods.
    aliases: []
    properties: {}
  RecoveryPlan:
    meaning: A documented strategy outlining the steps and procedures to restore an IT service and its dependencies after an incident.
    aliases:
      - helyreállítási terv
    properties:
      status:
        type: text
        allowed:
          - draft
          - approved
          - in-progress
          - validated
          - expired
      lastValidatedAt:
        type: date
      targetEnvironmentReady:
        type: boolean
  Change:
    meaning: "A controlled modification or addition to an IT service or system, which may impact its operation or functionality."
    aliases: []
    properties:
      implementedAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  Deployment:
    meaning: The technical process of implementing a change or a new release of an IT service to a production environment.
    aliases: []
    properties:
      deployedAt:
        type: date
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
  RegulatoryNotification:
    meaning: A formal submission to a regulatory authority regarding an incident that meets specified reporting criteria.
    aliases:
      - felügyeleti bejelentés
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submittedAt:
        type: date
      submissionReceipt:
        type: text
  MaterialityAssessment:
    meaning: A documented evaluation determining the significance of an incident and its implications for regulatory reporting and compliance.
    aliases:
      - lényegességi értékelés
    properties:
      status:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      rationale:
        type: text
  Evidence:
    meaning: A preserved record or artifact collected during incident management that supports analysis and accountability.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - collected
          - verified
          - sealed
          - compromised
      collectedAt:
        type: date
  CommunicationUpdate:
    meaning: "A controlled message sent to stakeholders to provide information about the status, progress, or resolution of an incident."
    aliases:
      - értesítés
    properties:
      sentAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - sent
          - cancelled
      message:
        type: text
      owner:
        type: text
      approvalStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - cancelled
  CorrectiveAction:
    meaning: "A tracked action intended to address the root causes of an incident or problem, reduce risk, and improve response capabilities."
    aliases:
      - helyesbítő intézkedés
    properties:
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueDate:
        type: date
  PostIncidentReview:
    meaning: "A structured analysis conducted after an incident to review what occurred, evaluate the response effectiveness, and identify lessons learned."
    aliases:
      - incidens utóelemzés
    properties:
      scheduledAt:
        type: date
      status:
        type: text
        allowed:
          - scheduled
          - completed
          - cancelled
  Stakeholder:
    meaning: "An individual or group affected by or responsible for an operational outcome, including internal and external parties involved in the bank's services."
    aliases: []
    properties: {}
  BackupSet:
    meaning: "A defined collection of recoverable backup data, crucial for restoring IT services and ensuring data availability during incidents."
    aliases:
      - mentéskészlet
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
      createdAt:
        type: date
      lastVerifiedAt:
        type: date
      restorePointApprovalStatus:
        type: text
        allowed:
          - approved
          - not-approved
  IncidentCommander:
    meaning: "The individual responsible for managing and coordinating the response to a major incident, ensuring effective communication and decision-making throughout the incident lifecycle."
    aliases: []
    properties: {}
  CommunicationPlan:
    meaning: "A documented strategy outlining the communication processes and protocols for informing stakeholders about incident status, actions being taken, and any impacts on services."
    aliases: []
    properties: {}
  Impact:
    meaning: "A classification that defines the significance of an incident's effects on business operations and regulatory obligations, determining the necessary level of response and communication."
    aliases: []
    properties:
      level:
        type: text
        allowed:
          - high
          - medium
          - low
      status:
        type: text
        allowed:
          - active
          - resolved
  RegulatoryReportingAuthority:
    meaning: The individual or organization responsible for overseeing regulatory compliance and approving submissions related to incidents that require notification to regulators.
    aliases: []
    properties: {}
  RestorationAuthority:
    meaning: The individual or role responsible for authorizing the restoration of backup data to ensure compliance with operational standards and procedures.
    aliases: []
    properties: {}
