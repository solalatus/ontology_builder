competency_questions:
  - id: cq1
    text: "Which business services are impacted by an incident, and how do they relate to customer channels?"
  - id: cq2
    text: "What IT services support the affected business services, and which configuration items are in their dependency path?"
  - id: cq3
    text: "Who owns the affected IT service, and which resolver group should be assigned to address the incident?"
  - id: cq4
    text: Does an incident meet the criteria to be declared a major incident?
  - id: cq5
    text: What steps must be taken to declare a major incident?
  - id: cq6
    text: "What runbook or workaround can be used to address an incident temporarily, and what recovery plans exist?"
  - id: cq7
    text: "Was an incident triggered by any recent changes or deployments, and which specific changes are relevant?"
  - id: cq8
    text: "Is a materiality assessment required for an incident, and has it been completed?"
  - id: cq9
    text: Are there open corrective actions from prior post-incident reviews that apply to an incident or an affected service?
  - id: cq10
    text: What evidence must be collected and preserved for an incident?
  - id: cq11
    text: "What communications must be sent to stakeholders about an incident, and who is responsible for approving them?"
classes:
  Incident:
    meaning: An unplanned disruption or degradation in service that requires managed response and resolution.
    aliases: []
    properties:
      identifier:
        type: text
      summary:
        type: text
      description:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      containmentSummary:
        type: text
  BusinessService:
    meaning: A customer-facing capability delivered by the bank that supports business processes and outcomes.
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      description:
        type: text
      status:
        type: text
      criticalityTier:
        type: text
      availabilityTarget:
        type: number
  ITService:
    meaning: "A managed technology capability that underpins one or more business services, ensuring their availability and performance."
    aliases:
      - Informatics Service
    properties:
      identifier:
        type: text
      name:
        type: text
      description:
        type: text
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      criticalityTier:
        type: text
      serviceLevelObjectives:
        type: text
  CustomerChannel:
    meaning: "The medium or platform through which customers interact with the bank to access services, such as online banking, mobile apps, or physical branches."
    aliases: []
    properties: {}
  ConfigurationItem:
    meaning: "A managed component within the technology estate that is recorded in the configuration management system and may include hardware, software, or documentation."
    aliases:
      - CI
    properties:
      identifier:
        type: text
      name:
        type: text
      description:
        type: text
      status:
        type: text
      criticalityTier:
        type: text
  Alert:
    meaning: A notification generated by monitoring systems indicating a potential issue or abnormal condition that requires attention.
    aliases: []
    properties:
      identifier:
        type: text
      summary:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      detectionSource:
        type: text
  ResolverGroup:
    meaning: A team responsible for diagnosing and restoring specific technology or service areas during an incident.
    aliases:
      - Support Group
    properties:
      identifier:
        type: text
      name:
        type: text
      description:
        type: text
      activeStatus:
        type: text
      currentIncidents:
        type: number
  ServiceOwner:
    meaning: "The individual accountable for managing an IT service throughout its lifecycle, including performance and alignment with business needs."
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      contactInformation:
        type: text
      activeStatus:
        type: text
  ApplicationOwner:
    meaning: The individual responsible for the operational fitness and management of a specific application within the IT service portfolio.
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      contactInformation:
        type: text
      activeStatus:
        type: text
  OnCallEngineer:
    meaning: A technical specialist available for immediate response to incidents and operational issues outside of regular working hours.
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      activeStatus:
        type: text
      contactInformation:
        type: text
  IncidentCommander:
    meaning: The individual accountable for leading and coordinating response efforts during a major incident to ensure effective communication and decision-making.
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      activeStatus:
        type: text
      contactInformation:
        type: text
  MessageApprover:
    meaning: The individual responsible for reviewing and authorizing communications related to incidents before they are sent to stakeholders.
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      activeStatus:
        type: text
      contactInformation:
        type: text
  Runbook:
    meaning: "A documented operational procedure that outlines step-by-step instructions for diagnosing, responding to, and recovering from incidents."
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      description:
        type: text
      version:
        type: text
      status:
        type: text
  Workaround:
    meaning: A temporary solution employed to reduce or bypass the impact of an incident without addressing its root cause.
    aliases: []
    properties: {}
  RecoveryPlan:
    meaning: A documented strategy that defines the steps and procedures necessary to restore an IT service and its dependencies following a disruption.
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      description:
        type: text
      status:
        type: text
      recoveryTimeObjective:
        type: text
      recoveryPointObjective:
        type: text
  Change:
    meaning: "A controlled alteration to the technology environment that may involve the introduction, modification, or removal of services, processes, or systems."
    aliases: []
    properties:
      identifier:
        type: text
      summary:
        type: text
      status:
        type: text
      riskLevel:
        type: text
      implementationPlan:
        type: text
      backoutPlan:
        type: text
  Deployment:
    meaning: The technical execution that installs or activates a change or new release within the technology environment.
    aliases: []
    properties:
      identifier:
        type: text
      status:
        type: text
      targetEnvironment:
        type: text
  MaterialityAssessment:
    meaning: A documented evaluation that determines the significance of an incident and whether it requires reporting to regulatory authorities.
    aliases: []
    properties:
      identifier:
        type: text
      result:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      rationale:
        type: text
      assessmentDate:
        type: date
  CorrectiveAction:
    meaning: "A tracked initiative intended to remove the root cause of an incident, reduce the risk of recurrence, or improve response capabilities."
    aliases: []
    properties:
      identifier:
        type: text
      actionDescription:
        type: text
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueDate:
        type: date
  Evidence:
    meaning: "A preserved record or artifact collected during an incident that supports analysis, accountability, and compliance with operational processes."
    aliases: []
    properties:
      identifier:
        type: text
      integrityStatus:
        type: text
      storageLocation:
        type: text
      collectionTimestamp:
        type: date
  Communication:
    meaning: "A controlled message sent to inform stakeholders about an incident, its status, and any required actions or updates."
    aliases: []
    properties:
      identifier:
        type: text
      summary:
        type: text
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      audience:
        type: text
      sentTimestamp:
        type: date
  Stakeholder:
    meaning: Any individual or group that has an interest in or is affected by the operational outcomes related to incidents and services.
    aliases: []
    properties: {}
  Backup:
    meaning: A defined collection of recoverable data that protects against data loss and supports recovery processes after disruptions.
    aliases: []
    properties:
      identifier:
        type: text
      status:
        type: text
      lastSuccessfulBackupTimestamp:
        type: date
      lastVerificationTimestamp:
        type: date
  PostIncidentReview:
    meaning: "A structured analysis conducted after an incident to evaluate its causes, response effectiveness, and lessons learned for future improvement."
    aliases:
      - PIR
      - RCA Review
    properties:
      identifier:
        type: text
      summary:
        type: text
      findings:
        type: text
      status:
        type: text
      dateHeld:
        type: date
  SeverityTier:
    meaning: "A classification that indicates the level of impact an incident may have on business operations, guiding the response and escalation processes."
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      description:
        type: text
  Environment:
    meaning: "A deployment context within which IT services and applications operate, such as production, test, development, or disaster recovery."
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      description:
        type: text
  BusinessLine:
    meaning: "A distinct categorization of services offered by the bank that aligns with specific customer needs, regulatory requirements, or market segments, such as retail banking or corporate banking."
    aliases: []
    properties:
      identifier:
        type: text
      name:
        type: text
      description:
        type: text
