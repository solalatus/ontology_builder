competency_questions:
  - id: cq1
    text: Which business services are impacted by an incident?
  - id: cq2
    text: Which customer channels are impacted by an incident?
  - id: cq3
    text: Which configuration items are affected by an incident?
  - id: cq4
    text: Which third-party services are on the dependency path of an impacted IT service?
  - id: cq5
    text: Who owns an affected IT service?
  - id: cq6
    text: Which resolver group should be assigned to manage an incident?
  - id: cq7
    text: Does an incident meet the criteria to be declared a major incident?
  - id: cq8
    text: Who is the incident commander for a major incident?
  - id: cq9
    text: Which runbook can be used for an incident?
  - id: cq10
    text: Which workaround can be used for an incident?
  - id: cq11
    text: Which recovery plan can be used for an incident?
  - id: cq12
    text: Have any recent changes contributed to an incident?
  - id: cq13
    text: Have any recent deployments contributed to an incident?
  - id: cq14
    text: Which recent changes are relevant to an incident?
  - id: cq15
    text: Which recent deployments are relevant to an incident?
  - id: cq16
    text: Has a materiality assessment been completed for an incident?
  - id: cq17
    text: Does an incident require regulatory notification?
  - id: cq18
    text: Does an incident require regulatory reporting?
  - id: cq19
    text: Which corrective actions from previous post-incident reviews are relevant to an incident?
classes:
  Incident:
    meaning: An unplanned interruption or degradation of an IT service that requires managed response to restore normal operation.
    aliases: []
    properties:
      severityTier:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      declaredMajorIncident:
        type: boolean
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
  ITService:
    meaning: A managed technology capability that supports one or more business services and is essential for day-to-day operations.
    aliases:
      - informatics service
    properties:
      serviceCriticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  BusinessService:
    meaning: A customer-facing capability delivered by the bank that enables users to perform specific business functions.
    aliases: []
    properties: {}
  CustomerChannel:
    meaning: A method or medium through which customers access banking services and perform transactions.
    aliases: []
    properties: {}
  ConfigurationItem:
    meaning: "A managed component of the IT infrastructure, recorded in the configuration management database, supporting IT services."
    aliases:
      - CI
    properties: {}
  ThirdPartyService:
    meaning: An externally provided service that the bank relies on to support its IT operations and business processes.
    aliases: []
    properties: {}
  ServiceOwner:
    meaning: "The individual accountable for the overall management, performance, and lifecycle of an IT service, ensuring it meets business needs."
    aliases: []
    properties: {}
  ResolverGroup:
    meaning: A team responsible for diagnosing and resolving specific types of incidents or technical issues within designated service areas.
    aliases:
      - support group
    properties: {}
  Alert:
    meaning: A signal generated by monitoring systems indicating a condition that may require attention or action in relation to IT services.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
  IncidentCommander:
    meaning: "The individual responsible for leading and coordinating the response efforts during a major incident, ensuring effective resolution and communication."
    aliases: []
    properties: {}
  Runbook:
    meaning: A documented operational procedure that outlines the steps for diagnosing and resolving incidents or performing regular processes.
    aliases: []
    properties: {}
  Workaround:
    meaning: A temporary solution used to mitigate the impact of an incident until a permanent fix can be implemented.
    aliases: []
    properties: {}
  RecoveryPlan:
    meaning: A documented strategy outlining the steps and procedures necessary to restore IT services and associated components after an incident.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - active
          - obsolete
          - tested
  Change:
    meaning: "A controlled modification to an IT service or its components that may include addition, alteration, or removal."
    aliases: []
    properties:
      changeDate:
        type: date
  Deployment:
    meaning: The process of installing or activating a new release or change in the production environment.
    aliases: []
    properties:
      deploymentDate:
        type: date
  MaterialityAssessment:
    meaning: A documented evaluation determining the significance of an incident and whether it meets the criteria for regulatory notification or reporting.
    aliases: []
    properties:
      completed:
        type: boolean
      jurisdiction:
        type: text
      outcome:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
  RegulatoryNotification:
    meaning: "A formal submission made to regulatory authorities regarding incidents that meet certain criteria, ensuring compliance with legal obligations."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  RegulatoryReport:
    meaning: "A formal document submitted to regulatory authorities that provides information about an incident or operational status, ensuring compliance with legal requirements."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - submitted
          - accepted
          - rejected
  PostIncidentReview:
    meaning: "A structured review process conducted after an incident to analyze the response, identify lessons learned, and determine any corrective actions needed for future improvements."
    aliases: []
    properties: {}
  CorrectiveAction:
    meaning: "A tracked action intended to address findings from post-incident reviews, aimed at preventing recurrence of similar incidents or improving response capabilities."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
  EmergencyChange:
    meaning: "A change that is implemented on an expedited basis due to an urgent need, often resulting from a critical incident requiring immediate action to restore services."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  Backup:
    meaning: A saved copy of data or system states that can be used to restore and recover information in the event of data loss or system failure.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
relationships:
  - name: impacts
    from: Incident
    to: BusinessService
    meaning: Indicates that the incident causes disruption or degradation to the specified business service provided by the bank.
    aliases: []
  - name: impacts
    from: Incident
    to: CustomerChannel
    meaning: "Shows that the incident affects the customer channel, potentially hindering customer access or service delivery."
    aliases: []
  - name: affects
    from: Incident
    to: ConfigurationItem
    meaning: Shows that the incident has an effect on one or more specific configuration items within the IT environment.
    aliases: []
  - name: dependsOn
    from: ITService
    to: ThirdPartyService
    meaning: Denotes that the IT service relies on one or more third-party services for its functionality and operation.
    aliases: []
  - name: ownedBy
    from: ITService
    to: ServiceOwner
    meaning: Specifies that a designated service owner is accountable for the overall management and performance of the IT service.
    aliases: []
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: Indicates that a specific resolver group is responsible for managing and resolving the incident.
    aliases: []
  - name: supportedBy
    from: ITService
    to: ResolverGroup
    meaning: "Shows that a particular resolver group provides support for the IT service, ensuring its proper operation and handling issues."
    aliases: []
  - name: hasIncidentCommander
    from: Incident
    to: IncidentCommander
    meaning: Indicates that the incident is designated to a specific incident commander responsible for leading its response.
    aliases: []
  - name: usesRunbook
    from: Incident
    to: Runbook
    meaning: null
    aliases: []
  - name: usesWorkaround
    from: Incident
    to: Workaround
    meaning: null
    aliases: []
  - name: usesRecoveryPlan
    from: Incident
    to: RecoveryPlan
    meaning: Clarifies that the incident is associated with a particular recovery plan that outlines how to restore service after the incident.
    aliases: []
  - name: linkedToChange
    from: Incident
    to: Change
    meaning: Indicates that there is a relationship where the incident is associated with a specific change that may impact or resolve the incident.
    aliases: []
  - name: causedByChange
    from: Incident
    to: Change
    meaning: "Specifies that the incident is a result of a particular change made to the IT environment, indicating a causal relationship."
    aliases: []
  - name: linkedToDeployment
    from: Incident
    to: Deployment
    meaning: Indicates that the incident is associated with a specific deployment that may have impacted or contributed to the incident.
    aliases: []
  - name: causedByDeployment
    from: Incident
    to: Deployment
    meaning: "Specifies that the incident is a direct result of a particular deployment, establishing a causal connection."
    aliases: []
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: Denotes that the incident is linked to a specific materiality assessment evaluating its significance.
    aliases: []
  - name: requiresRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: Denotes that the incident necessitates the submission of a regulatory notification to comply with legal obligations.
    aliases: []
  - name: requiresRegulatoryReport
    from: Incident
    to: RegulatoryReport
    meaning: Indicates that the incident mandates the creation of a regulatory report due to its significance or impact.
    aliases: []
  - name: producesCorrectiveAction
    from: PostIncidentReview
    to: CorrectiveAction
    meaning: Denotes that the post-incident review generates specific corrective actions aimed at preventing future occurrences of similar incidents.
    aliases: []
  - name: linkedToCorrectiveAction
    from: Incident
    to: CorrectiveAction
    meaning: Shows that the incident is associated with existing corrective actions that have been identified to address issues stemming from the incident.
    aliases: []
  - name: usedForIncident
    from: RecoveryPlan
    to: Incident
    meaning: REMOVE
    aliases: []
  - name: impacts
    from: Incident
    to: ITService
    meaning: Indicates that the incident causes disruption or degradation to the specified IT service.
    aliases: []
  - name: isImplementedBy
    from: ITService
    to: ConfigurationItem
    meaning: Indicates that the IT service is delivered through specific configuration items that support its operation.
    aliases: []
  - name: dependsOn
    from: BusinessService
    to: ITService
    meaning: Denotes that the business service relies on a specific IT service for its functionality and execution.
    aliases: []
  - name: delivers
    from: CustomerChannel
    to: BusinessService
    meaning: Clarifies that the customer channel provides access to and facilitates the delivery of the specified business service.
    aliases: []
  - name: mayOpen
    from: Alert
    to: Incident
    meaning: Shows that the alert has the potential to trigger the creation of a new incident based on its severity or conditions.
    aliases: []
  - name: isJustifiedBy
    from: EmergencyChange
    to: Incident
    meaning: "Clarifies that the emergency change is enacted in response to the specific incident, highlighting its necessity."
    aliases: []
  - name: protects
    from: Backup
    to: ConfigurationItem
    meaning: "Indicates that the backup is designated to safeguard a specific configuration item, ensuring data integrity and recovery capability."
    aliases: []
  - name: reviews
    from: PostIncidentReview
    to: Incident
    meaning: Specifies that the post-incident review evaluates the handling and outcomes related to the specified incident.
    aliases: []
  - name: dependsOn
    from: ConfigurationItem
    to: ThirdPartyService
    meaning: Specifies that the configuration item relies on a specific third-party service for its functionality and operation.
    aliases: []
  - name: forIncident
    from: RegulatoryNotification
    to: Incident
    meaning: Indicates that a particular regulatory notification pertains to and is made in relation to the specified incident.
    aliases: []
  - name: forIncident
    from: RegulatoryReport
    to: Incident
    meaning: Shows that a specific regulatory report is associated with and addresses the particular incident.
    aliases: []
rules:
  qualifiesForMajorIncidentDeclaration:
    conditions:
      - Incident.severityTier is sev1-critical or sev2-high.
      - The impacted ITService.serviceCriticality is tier-1-critical or tier-2-important.
      - The incident impacts multiple BusinessService or multiple CustomerChannel.
  requiresRegulatoryNotificationDecision:
    conditions:
      - The incident has a completed MaterialityAssessment.
      - The MaterialityAssessment.jurisdiction is relevant to the incident.
      - The MaterialityAssessment.outcome is potentially-reportable or reportable.
  requiresRegulatoryReportingDecision:
    conditions:
      - The incident has a completed MaterialityAssessment.
      - The MaterialityAssessment.jurisdiction is relevant to the incident.
      - The MaterialityAssessment.outcome is reportable.
  canAssignIncidentToResolverGroup:
    conditions:
      - Incident.status is not closed or cancelled.
      - Affected ITService is supported by the selected ResolverGroup.
  canContainIncident:
    conditions:
      - Incident.status is acknowledged or investigating.
  canExecuteEmergencyChange:
    conditions:
      - EmergencyChange is justified by an Incident.
      - "The Incident.status is not resolved, closed, or cancelled."
  canRestoreBackup:
    conditions:
      - Backup.status is successful or verified.
      - Backup protects the ConfigurationItem being restored.
  canExecuteRecoveryPlan:
    conditions:
      - "Incident.status is acknowledged, contained, or recovering."
      - RecoveryPlan.status is active.
      - The Incident uses the RecoveryPlan.
  canSendIncidentCommunication:
    conditions:
      - Incident.status is not closed or cancelled.
actions:
  declareMajorIncident:
    input: Incident
    preconditions:
      - qualifiesForMajorIncidentDeclaration
    effect: Incident.declaredMajorIncident becomes true.
    verification: Confirm Incident.declaredMajorIncident is true.
  assignIncidentToResolverGroup:
    input: Incident
    preconditions:
      - canAssignIncidentToResolverGroup
    effect: Incident.assignedTo becomes the selected ResolverGroup.
    verification: Confirm Incident.assignedTo matches the designated ResolverGroup.
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: Alert.status becomes acknowledged.
    verification: Confirm the alert status is acknowledged.
  sendIncidentCommunication:
    input: Incident
    preconditions:
      - canSendIncidentCommunication
    effect: Incident communication is sent for the Incident.
    verification: Confirm the communication was issued for the Incident.
  executeEmergencyChange:
    input: EmergencyChange
    preconditions:
      - canExecuteEmergencyChange
    effect: EmergencyChange.status becomes implemented.
    verification: Confirm EmergencyChange.status is implemented.
  restoreBackup:
    input: Backup
    preconditions:
      - canRestoreBackup
    effect: The protected ConfigurationItem is restored from the Backup.
    verification: Confirm the protected ConfigurationItem is functioning correctly after the restore.
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: Incident.status becomes contained.
    verification: Confirm Incident.status is contained.
  executeRecoveryPlan:
    input: RecoveryPlan
    preconditions:
      - canExecuteRecoveryPlan
    effect: The recovery steps in the RecoveryPlan are executed for the Incident.
    verification: Confirm the related Incident.status reflects the post-recovery state.
  conductMaterialityAssessment:
    input: Incident
    preconditions: []
    effect: MaterialityAssessment.completed becomes true for the Incident.
    verification: Confirm the Incident has a completed MaterialityAssessment.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - requiresRegulatoryNotificationDecision
    effect: RegulatoryNotification.status becomes submitted.
    verification: Confirm RegulatoryNotification.status is submitted.
