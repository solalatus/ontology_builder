competency_questions: []
classes:
  Incident:
    meaning: An unplanned interruption or disruption in service that requires a managed response to restore normal operations.
    aliases: []
    properties:
      firstDetectedAt:
        type: date
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      acknowledged:
        type: boolean
      expectedRestoreAt:
        type: date
      containmentSteps:
        type: text
      impactedCount:
        type: number
      majorIncidentDeclared:
        type: boolean
      acknowledgedBy:
        type: text
      impactedUserCount:
        type: number
      impactedServiceCount:
        type: number
      currentStatus:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
  BusinessService:
    meaning: A capability delivered by the bank that meets customer needs and contributes to business outcomes.
    aliases: []
    properties:
      currentStatus:
        type: text
        allowed:
          - active
          - inactive
          - disrupted
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  CustomerChannel:
    meaning: The various pathways through which customers access and interact with banking services.
    aliases: []
    properties:
      currentStatus:
        type: text
        allowed:
          - available
          - unavailable
          - degraded
      channelType:
        type: text
        allowed:
          - online
          - phone
          - in-branch
          - mobile
  ConfigurationItem:
    meaning: "Any managed component, such as hardware or software, that is recorded in the configuration management system and supports IT services."
    aliases:
      - CI
    properties:
      ciType:
        type: text
        allowed:
          - hardware
          - software
          - network
          - documentation
      currentStatus:
        type: text
        allowed:
          - operational
          - not-operational
          - under-maintenance
  ITService:
    meaning: A technology-based service provided by the bank that supports one or more business services and meets defined service-level objectives.
    aliases: []
    properties:
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      serviceTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      currentStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  Alert:
    meaning: A notification generated by monitoring systems indicating a condition that may require investigation or action.
    aliases: []
    properties:
      alertStatus:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      triggeredAt:
        type: date
      alertSummary:
        type: text
  Runbook:
    meaning: A detailed document that provides step-by-step procedures for responding to specific operational tasks or incidents.
    aliases: []
    properties:
      runbookStatus:
        type: text
        allowed:
          - current
          - outdated
          - in-review
      lastReviewedAt:
        type: date
  MaterialityAssessment:
    meaning: An evaluation that determines the significance of an incident and whether it meets the criteria for regulatory reporting.
    aliases: []
    properties:
      assessmentStatus:
        type: text
        allowed:
          - not-assessed
          - pending
          - assessed
      assessmentOutcome:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
  ResolverGroup:
    meaning: A team of technical specialists assigned to diagnose and resolve specific incidents or issues within certain technology areas.
    aliases: []
    properties:
      groupStatus:
        type: text
        allowed:
          - available
          - busy
          - offline
      supportScope:
        type: text
  KnownError:
    meaning: A documented problem with an identified cause or workaround that helps prevent recurrence of incidents linked to the issue.
    aliases: []
    properties: {}
  RegulatoryNotification:
    meaning: A formal communication submitted to relevant regulatory authorities to report on incidents or compliance matters as required by law.
    aliases: []
    properties:
      notificationStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submissionDueAt:
        type: date
      jurisdiction:
        type: text
  ServiceOwner:
    meaning: The individual accountable for the overall management and performance of a specific IT service throughout its lifecycle.
    aliases: []
    properties:
      ownerName:
        type: text
      contactMethod:
        type: text
  RecoveryPlan:
    meaning: A documented strategy that outlines the steps and resources needed to restore an IT service following a disruption or incident.
    aliases: []
    properties:
      planStatus:
        type: text
        allowed:
          - draft
          - active
          - inactive
          - archived
      lastTestedAt:
        type: date
  CorrectiveAction:
    meaning: A tracked activity aimed at eliminating the root cause of incidents or problems to prevent their recurrence and improve operational performance.
    aliases: []
    properties:
      actionStatus:
        type: text
        allowed:
          - open
          - in-progress
          - blocked
          - implemented
          - verified
          - closed
          - cancelled
      dueDate:
        type: date
      owner:
        type: text
  StakeholderCommunication:
    meaning: "A controlled message sent to individuals or groups affected by an incident, providing updates and information on the situation."
    aliases: []
    properties:
      communicationType:
        type: text
        allowed:
          - operational
          - informational
          - escalation
          - update
      sentAt:
        type: date
      communicationStatus:
        type: text
        allowed:
          - draft
          - sent
          - failed
  EvidenceItem:
    meaning: "A record or artifact collected during an incident investigation that supports analysis, accountability, and compliance efforts."
    aliases: []
    properties:
      evidenceType:
        type: text
        allowed:
          - document
          - screenshot
          - log
          - recording
      recordedAt:
        type: date
      evidenceStatus:
        type: text
        allowed:
          - pending
          - accepted
          - rejected
  PostIncidentReview:
    meaning: "A structured meeting held after an incident to assess its causes, evaluate the response effectiveness, and identify improvements for future incident management."
    aliases:
      - PIR
      - Post-Incident Review
    properties:
      scheduledAt:
        type: date
      reviewStatus:
        type: text
        allowed:
          - scheduled
          - in-progress
          - completed
  EmergencyChange:
    meaning: "A change that is implemented rapidly in response to an urgent operational need, typically following an incident to restore service or improve functionality."
    aliases: []
    properties:
      changeStatus:
        type: text
        allowed:
          - planned
          - in-progress
          - completed
          - rolled-back
      implementedAt:
        type: date
relationships:
  - name: impacts
    from: Incident
    to: BusinessService
    meaning: An incident causes a disruption or degradation that affects the functioning of the business service.
    aliases: []
  - name: impacts
    from: Incident
    to: CustomerChannel
    meaning: "An incident adversely affects the customer channel, impacting users' ability to access banking services."
    aliases: []
  - name: affects
    from: Incident
    to: ConfigurationItem
    meaning: "An incident has a direct impact on one or more configuration items, potentially compromising their functionality."
    aliases: []
  - name: affects
    from: Incident
    to: ITService
    meaning: "An incident leads to a disruption or degradation of the IT service, impairing its ability to function as intended."
    aliases: []
  - name: ownedBy
    from: ITService
    to: ServiceOwner
    meaning: "The service owner is accountable for the overall management, performance, and lifecycle of the IT service."
    aliases: []
  - name: hasAlert
    from: Incident
    to: Alert
    meaning: An incident is associated with one or more alerts generated by monitoring systems that indicate conditions requiring attention.
    aliases: []
  - name: hasRunbook
    from: ITService
    to: Runbook
    meaning: The IT service is associated with a specific runbook that provides operational procedures for managing incidents related to that service.
    aliases: []
  - name: hasMaterialityAssessment
    from: Incident
    to: MaterialityAssessment
    meaning: The incident is linked to a materiality assessment that determines its significance and reporting implications.
    aliases: []
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: The incident has been assigned to a specific resolver group that is responsible for diagnosing and resolving the issue.
    aliases: []
  - name: supportedBy
    from: ITService
    to: ResolverGroup
    meaning: The IT service is backed by a resolver group that provides the necessary support and expertise for its maintenance and issue resolution.
    aliases: []
  - name: relatesTo
    from: Incident
    to: KnownError
    meaning: "The incident is connected to a known error that has been documented, helping to facilitate resolution and prevent recurrence."
    aliases: []
  - name: requires
    from: Incident
    to: RegulatoryNotification
    meaning: "The incident necessitates a regulatory notification to be submitted, ensuring compliance with relevant legal and regulatory requirements."
    aliases: []
  - name: hasRecoveryPlan
    from: ITService
    to: RecoveryPlan
    meaning: The IT service is associated with a recovery plan that outlines the steps to be taken to restore it following an incident.
    aliases: []
  - name: isLinkedTo
    from: CorrectiveAction
    to: Incident
    meaning: "The corrective action is connected to a specific incident, indicating that it addresses the underlying causes or issues related to that incident."
    aliases: []
  - name: hasCommunication
    from: Incident
    to: StakeholderCommunication
    meaning: The incident has associated communications that are sent to stakeholders to provide updates and relevant information.
    aliases: []
  - name: hasPostIncidentReview
    from: Incident
    to: PostIncidentReview
    meaning: "The incident is linked to a post-incident review, which evaluates its causes and the effectiveness of the response."
    aliases: []
  - name: hasEmergencyChange
    from: Incident
    to: EmergencyChange
    meaning: The incident is tied to an emergency change that is implemented to quickly restore service or resolve critical issues.
    aliases: []
  - name: hasEvidenceItem
    from: Incident
    to: EvidenceItem
    meaning: The incident has one or more evidence items documented that support the analysis and accountability of the incident.
    aliases: []
  - name: supports
    from: ConfigurationItem
    to: ITService
    meaning: The configuration item provides necessary resources or components that enable the IT service to function effectively.
    aliases: []
  - name: supports
    from: ITService
    to: BusinessService
    meaning: "The IT service is essential for delivering the business service, contributing to its availability and performance."
    aliases: []
  - name: deliveredThrough
    from: BusinessService
    to: CustomerChannel
    meaning: The business service is made accessible to customers through specific channels that facilitate interaction and service delivery.
    aliases: []
  - name: relatesTo
    from: Alert
    to: Incident
    meaning: "The alert is linked to the incident that it helps detect, trigger, or contextualize."
    aliases: []
  - name: relatesTo
    from: EmergencyChange
    to: Incident
    meaning: null
    aliases: []
  - name: modifies
    from: EmergencyChange
    to: ConfigurationItem
    meaning: null
    aliases: []
  - name: relatesTo
    from: RegulatoryNotification
    to: Incident
    meaning: null
    aliases: []
rules:
  canDeclareMajorIncident:
    conditions:
      - incident severity is sev1-critical or sev2-high
      - at least one impacted IT service is identified
      - "incident is still active (not resolved, closed, or cancelled)"
  canAssignIncidentToResolverGroup:
    conditions:
      - the incident is not in a closed or cancelled state
      - the resolver group supports an affected IT service or configuration item
  canCloseIncident:
    conditions:
      - the incident status is resolved or monitoring
      - impacted services have a health state of healthy or an accepted residual condition
      - resolution and restoration evidence are recorded
      - required stakeholder communications are complete
      - major and cybersecurity incidents have a scheduled or completed post-incident review
  canSubmitRegulatoryNotification:
    conditions:
      - the assessment result indicates it is reportable
      - the notification is linked to the incident and has a jurisdiction
      - required fields and supporting evidence are complete
      - notification status is approved
      - "submission occurs before the notification's due date"
  canAcknowledgeAlert:
    conditions:
      - the alert status is new
      - the operator is authorized for the responsible resolver group
  canExecuteEmergencyChange:
    conditions:
      - the emergency change is linked to an active incident
      - implementation and backout plans are present
      - affected configuration items are identified
      - risk is explicitly accepted
actions:
  acknowledgeAlert:
    input: Alert
    preconditions:
      - canAcknowledgeAlert
    effect: alert status is updated to acknowledged and acknowledgment timestamp is recorded
    verification: read alert and confirm status is acknowledged
  assignIncidentToResolverGroup:
    input: Incident
    preconditions:
      - canAssignIncidentToResolverGroup
    effect: incident is assigned to the specified resolver group
    verification: read incident and confirm resolver group assignment
  declareMajorIncident:
    input: Incident
    preconditions:
      - canDeclareMajorIncident
    effect: incident is classified as a major incident and major incident coordination and communication cadence start
    verification: read incident and confirm major-incident flag and declaration time
  sendStakeholderCommunications:
    input: Incident
    preconditions: []
    effect: communication is sent and timestamped
    verification: confirm delivery status and archive the final message
  conductMaterialityAssessment:
    input: Incident
    preconditions: []
    effect: materiality assessment is conducted and recorded for the incident
    verification: review the materiality assessment documentation and confirm it is attached to the incident
  executeEmergencyChange:
    input: EmergencyChange
    preconditions:
      - canExecuteEmergencyChange
    effect: emergency change is implemented and its status is updated
    verification: "perform technical checks, verify service health, and record implementation evidence"
  closeIncident:
    input: Incident
    preconditions:
      - canCloseIncident
    effect: incident status is updated to closed and closure timestamp is recorded
    verification: read the incident and linked services to confirm closure state and retained evidence
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: notification status is updated to submitted and submission receipt is stored
    verification: confirm accepted submission or record rejection and remediation
  documentEvidenceItem:
    input: Incident
    preconditions: []
    effect: an evidence item is created and associated with the incident
    verification: confirm the evidence item is recorded and linked to the incident
