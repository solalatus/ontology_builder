    aliases: []
rules:
  declareMajorIncident:
    conditions:
      - "incident severity is in [sev1-critical, sev2-high]"
      - "incident status is not in [resolved, closed, cancelled]"
      - at least one impacted IT service is identified
      - an incident commander is assigned to lead the response
  determineIncidentPriority:
    conditions:
      - "if incident severity is sev1-critical, then incident priority is p1-critical"
      - "if incident severity is sev2-high, then incident priority is p2-high"
      - "if incident severity is sev3-medium and incident impact level is in [enterprise-wide, multiple-services], then incident priority is p2-high"
      - "if incident severity is sev3-medium and incident impact level is in [single-service, limited-users], then incident priority is p3-medium"
      - "if incident severity is sev4-low, then incident priority is p4-low"
      - "if incident urgency is immediate, then incident priority is p1-critical"
      - "if incident urgency is high and incident severity is sev1-critical, then incident priority is p1-critical"
      - "if incident urgency is high and incident severity is sev2-high, then incident priority is p2-high"
      - "if incident urgency is high and incident severity is sev3-medium, then incident priority is p2-high"
  verifyIncidentResolution:
    conditions:
      - incident status is resolved
      - incident has evidence linked to it
      - evidence integrityValidated is true
      - evidence status is verified
      - affected IT services are functioning normally and marked healthy
      - any workaround previously in place is removed or updated based on the resolution
      - all necessary stakeholder communications confirming resolution are completed
      - a post-incident review is scheduled or completed
  containmentCriteriaMet:
    conditions:
      - incident status is contained
      - incident containment status is contained
actions:
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: alert status becomes acknowledged and the acknowledgement timestamp is recorded
    verification: read the alert and confirm the status is acknowledged
  assignIncidentToResolverGroup:
    input: Incident
    preconditions: []
    effect: incident is assigned to the specified resolver group
    verification: read the incident and confirm that the resolver group is assigned
  declareMajorIncident:
    input: Incident
    preconditions:
      - declareMajorIncident
    effect: incident is linked to a major incident record and major incident coordination and communication cadence start
    verification: read the incident and confirm it is linked to a major incident
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions: []
    effect: regulatory notification status becomes submitted and a submission receipt is stored for record-keeping
    verification: confirm the regulatory notification status is submitted and capture the submission timestamp
  documentWorkaround:
    input: Workaround
    preconditions: []
    effect: workaround is documented and linked to the correct incident or known error
    verification: confirm the workaround is documented and linked to the correct incident or known error
  documentIncidentWorkaround:
    input: Incident
    preconditions: []
    effect: a workaround is documented and linked to the incident
    verification: confirm the incident has the documented workaround linked to it
  documentKnownErrorWorkaround:
    input: KnownError
    preconditions: []
    effect: a workaround is documented and linked to the known error
    verification: confirm the known error has the documented workaround linked to it
  restoreBackup:
    input: RecoveryPlan
    preconditions: []
    effect: backup data is restored according to the recovery plan so the related IT service can be returned to the required state
    verification: confirm the restoration completed successfully and validate data integrity and IT service functionality after restore
  conductPostIncidentReview:
    input: PostIncidentReview
    preconditions: []
    effect: "review documentation is completed and the outcome summary is recorded, including findings and lessons learned"
    verification: "confirm the post-incident review documentation is completed, including the outcome summary"
  containIncident:
    input: Incident
    preconditions: []
    effect: incident status becomes contained and incident containment status becomes contained
    verification: confirm the incident status is contained and the containment status is contained
  respondToChangeIncident:
    input: Incident
    preconditions: []
    effect: the linked change is identified and targeted response actions are initiated to address issues arising from it
    verification: confirm the response actions address issues caused by the linked change and are documented
