competency_questions: []
classes:
  Incident:
    meaning: An unplanned interruption or degradation of an IT service that requires managed response and restoration.
    aliases:
      - ticket
    properties:
      incidentId:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      impactLevel:
        type: text
        allowed:
          - enterprise-wide
          - multiple-services
          - single-service
          - limited-users
          - no-observed-impact
      urgency:
        type: text
        allowed:
          - immediate
          - high
          - normal
          - low
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      detectedAt:
        type: date
      acknowledgedAt:
        type: date
      resolvedAt:
        type: date
      containmentStatus:
        type: text
        allowed:
          - not-started
          - in-progress
          - contained
          - not-contained
  ITService:
    meaning: A managed technology capability that supports one or more business services and is governed by service-level objectives.
    aliases: []
    properties:
      serviceName:
        type: text
      serviceCriticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      recoveryTier:
        type: text
        allowed:
          - high
          - medium
          - low
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
  Alert:
    meaning: A signal generated by monitoring systems indicating a potential issue that requires attention and may lead to the creation of an incident.
    aliases: []
    properties:
      alertId:
        type: text
      alertType:
        type: text
      source:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      receivedAt:
        type: date
  ResolverGroup:
    meaning: A team assigned to diagnose and restore specific technology or service areas when incidents occur.
    aliases: []
    properties:
      groupName:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  ServiceOwner:
    meaning: The individual accountable for overseeing the management and operational performance of a specific IT service.
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  RecoveryPlan:
    meaning: A documented plan outlining the steps and procedures to restore an IT service and its dependencies after an incident or disruption.
    aliases: []
    properties:
      planName:
        type: text
      version:
        type: text
      lastTestedAt:
        type: date
      status:
        type: text
        allowed:
          - active
          - outdated
          - under-review
          - approved
  Evidence:
    meaning: A preserved record or artifact collected during incident response that supports analysis and accountability for the incident and its resolution.
    aliases: []
    properties:
      evidenceId:
        type: text
      evidenceType:
        type: text
        allowed:
          - document
          - log
          - screenshot
          - data-sample
      collectedAt:
        type: date
      integrityValidated:
        type: boolean
      status:
        type: text
        allowed:
          - collected
          - verified
          - sealed
          - compromised
  MajorIncident:
    meaning: A significant incident that necessitates enhanced coordination and communication due to its high business or regulatory impact.
    aliases: []
    properties:
      declarationStatus:
        type: text
        allowed:
          - not-declared
          - declared
      declaredAt:
        type: date
      status:
        type: text
        allowed:
          - active
          - resolved
          - closed
  Notification:
    meaning: A controlled message sent to stakeholders providing updates or information about incidents or events requiring attention.
    aliases: []
    properties:
      notificationType:
        type: text
        allowed:
          - incident-update
          - incident-resolution
          - general-alert
          - compliance-alert
      channel:
        type: text
        allowed:
          - email
          - SMS
          - in-app
          - dashboard
          - phone
      sentAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
  RecoveryAction:
    meaning: "A specific step or task defined in a recovery plan aimed at mitigating an incident's impact and restoring services."
    aliases: []
    properties:
      actionName:
        type: text
      sequenceNumber:
        type: number
      status:
        type: text
        allowed:
          - pending
          - in-progress
          - completed
          - failed
  Change:
    meaning: "A controlled addition, modification, or removal of an IT service or component that could affect its operation."
    aliases: []
    properties:
      changeId:
        type: text
      changeType:
        type: text
        allowed:
          - normal
          - emergency
          - standard
      implementationTime:
        type: date
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
  KnownError:
    meaning: "A diagnosed problem with a documented cause and, if available, a workaround that has been identified but not permanently fixed."
    aliases: []
    properties:
      knownErrorId:
        type: text
      status:
        type: text
        allowed:
          - open
          - resolved
          - closed
  Workaround:
    meaning: A temporary solution implemented to reduce or bypass the impact of an incident or known error without addressing the root cause.
    aliases: []
    properties:
      workaroundName:
        type: text
      status:
        type: text
        allowed:
          - active
          - obsolete
  PostIncidentReview:
    meaning: "A structured examination of an incident after resolution, aimed at assessing response effectiveness and identifying lessons learned."
    aliases: []
    properties:
      reviewDate:
        type: date
      outcomeSummary:
        type: text
      status:
        type: text
        allowed:
          - scheduled
          - completed
          - pending
          - closed
  RegulatoryNotification:
    meaning: A formal submission made to a regulatory authority regarding incidents that may impact compliance or require reporting.
    aliases: []
    properties:
      notificationType:
        type: text
        allowed:
          - reportable
          - non-reportable
          - potentially-reportable
      submissionDeadline:
        type: date
      submittedAt:
        type: date
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
  IncidentCommander:
    meaning: The individual responsible for leading the response and coordination during a major incident.
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  ApplicationOwner:
    meaning: "The person responsible for the overall health and performance of an application, including its functionality and upkeep."
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  TechnicalOwner:
    meaning: The individual tasked with the engineering and maintenance of a specific configuration item or technical asset.
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  BusinessOwner:
    meaning: "The role responsible for the overall accountability of a business service or process, ensuring it meets business objectives."
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  Vendor:
    meaning: An external organization that provides or supports technology and services utilized by the bank.
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  Regulator:
    meaning: "A competent authority that supervises the bank's operations and ensures compliance with relevant laws and regulations."
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  Environment:
    meaning: "A defined context in which IT services and applications operate, such as production, testing, or development."
    aliases: []
    properties:
      environmentName:
        type: text
      environmentType:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - unavailable
  OnCallRole:
    meaning: "A designated position responsible for responding to incidents outside regular working hours, usually covering urgent operational needs."
    aliases: []
    properties:
      name:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
relationships:
  - name: affects
    from: Incident
    to: ITService
    meaning: Indicates that an incident has an impact on the operation or performance of an IT service.
    aliases: []
  - name: mayOpen
    from: Alert
    to: Incident
    meaning: Suggests that an alert can lead to the creation of a new incident that requires management.
    aliases: []
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: Shows that an incident has been allocated to a specific resolver group for investigation and resolution.
    aliases: []
  - name: hasEvidence
    from: Incident
    to: Evidence
    meaning: Denotes that an incident is supported by specific records or artifacts collected during the incident response.
    aliases: []
  - name: isLinkedTo
    from: Incident
    to: Change
    meaning: "Indicates a connection between an incident and a change, signifying that the incident may have resulted from the change."
    aliases: []
  - name: hasPostIncidentReview
    from: Incident
    to: PostIncidentReview
    meaning: Specifies that an incident has undergone a formal review process after resolution to analyze and document findings.
    aliases: []
  - name: hasNotification
    from: Incident
    to: Notification
    meaning: Indicates that a notification has been sent regarding specific information related to an incident.
    aliases: []
  - name: hasRegulatoryNotification
    from: Incident
    to: RegulatoryNotification
    meaning: Denotes that a regulatory notification has been linked to an incident for compliance and reporting purposes.
    aliases: []
  - name: ownedBy
    from: ITService
    to: ServiceOwner
    meaning: Indicates that a resource or service is under the accountability and management of a specific individual or role.
    aliases: []
  - name: hasRecoveryPlan
    from: ITService
    to: RecoveryPlan
    meaning: Denotes that an IT service is associated with a specific plan detailing how to recover from incidents affecting it.
    aliases: []
  - name: includes
    from: RecoveryPlan
    to: RecoveryAction
    meaning: "Shows that a broader document, such as a recovery plan, contains specific elements or actions categorized within it."
    aliases: []
  - name: operatesIn
    from: ITService
    to: Environment
    meaning: "Indicates the environment in which an IT service functions, such as production, development, or testing."
    aliases: []
  - name: hasApplicationOwner
    from: ITService
    to: ApplicationOwner
    meaning: Specifies that an application has an assigned individual responsible for its overall management and performance.
    aliases: []
  - name: hasBusinessOwner
    from: ITService
    to: BusinessOwner
    meaning: Indicates that a business service is accountable to a specific individual or role responsible for its success and alignment with business goals.
    aliases: []
  - name: supportedBy
    from: ITService
    to: ResolverGroup
    meaning: Denotes that an IT service has a corresponding resolver group or team designated to provide assistance and resolve issues.
    aliases: []
  - name: hasTechnicalOwner
    from: ITService
    to: TechnicalOwner
    meaning: Shows that a specific technical configuration item or asset has an assigned individual responsible for its engineering and maintenance.
    aliases: []
  - name: hasIncidentCommander
    from: MajorIncident
    to: IncidentCommander
    meaning: Indicates that a major incident is assigned to a specific individual responsible for leading the response and decision-making during the incident.
    aliases: []
  - name: affects
    from: MajorIncident
    to: ITService
    meaning: Indicates that a major incident has a direct impact on the operation or performance of a specific IT service.
    aliases: []
  - name: hasNotification
    from: MajorIncident
    to: Notification
    meaning: Specifies that a major incident is associated with a specific notification sent to inform stakeholders about the incident.
    aliases: []
  - name: submittedTo
    from: RegulatoryNotification
    to: Regulator
    meaning: Denotes that a regulatory notification has been formally sent to a specific regulatory authority for review and compliance.
    aliases: []
  - name: hasVendor
    from: ITService
    to: Vendor
    meaning: Specifies that an IT service is associated with an external organization providing support or technology for that service.
    aliases: []
  - name: hasWorkaround
    from: Incident
    to: Workaround
    meaning: Indicates that a specific incident or known error has a temporary solution documented to mitigate impact until a permanent fix is in place.
    aliases: []
  - name: hasWorkaround
    from: KnownError
    to: Workaround
    meaning: Indicates that a specific incident or known error has a temporary solution documented to mitigate impact until a permanent fix is in place.
    aliases: []
  - name: hasKnownError
    from: Incident
    to: KnownError
    meaning: Denotes that an incident is associated with a documented known error that provides insights into its underlying cause.
    aliases: []
  - name: hasOnCallRole
