rules:
  declareMajorIncident:
    conditions:
      - "Incident status is not resolved, closed, or cancelled."
      - Incident severity is sev1-critical or sev2-high.
      - At least one impacted IT service is identified.
      - The potential business impact significantly affects business operations or customer service.
      - "Stakeholders need to be informed at multiple levels due to the incident's potential repercussions."
      - Regulatory implications or compliance requirement triggers are present.
  requireMaterialityAssessment:
    conditions:
      - An impacted business service has criticality tier-1-critical or tier-2-important.
      - Incident severity is sev1-critical or sev2-high.
      - There is significant potential customer impact or disruption to critical business functions.
      - "Regulatory requirements or statutory obligations indicate the need for reporting based on the incident's nature and potential consequences."
      - The incident involves third-party services that could lead to aggregate material risks if service issues arise.
      - Incident duration exceeds 2 hours.
  canAssignResolverGroup:
    conditions:
      - Incident status is not closed or cancelled.
      - "The resolver group supports an affected IT service, application, or configuration item."
  canSubmitRegulatoryNotification:
    conditions:
      - Regulatory notification status is approved.
      - The regulatory notification is related to an incident.
      - The regulatory notification includes all required fields and supporting evidence.
      - Submission occurs before the submission deadline.
  canImplementWorkaround:
    conditions:
      - Workaround status is approved.
      - The workaround is linked to an active incident that it aims to mitigate.
  canExecuteRecoveryPlan:
    conditions:
      - Recovery plan status is either not-started or completed.
      - The recovery plan is used for an active incident that it aims to address.
  canSendStakeholderCommunication:
    conditions:
      - "Incident status is acknowledged, investigating, contained, or recovering."
      - "A communication message is prepared and approved, including the necessary recipients."
  canAcknowledgeIncident:
    conditions:
      - Incident status is new.
      - The acknowledgment is performed by an authorized individual such as a service desk member or on-call engineer.
  canContainIncident:
    conditions:
      - Incident status is acknowledged or investigating.
      - Containment scope and expected side effects of the containment actions are documented.
actions:
  declareMajorIncident:
    input: Incident
    preconditions:
      - declareMajorIncident
    effect: Incident.majorIncidentFlag becomes true. Incident.status becomes investigating.
    verification: "Confirm that Incident.majorIncidentFlag is true, Incident.status is investigating, and the declaration timestamp and incident commander information are recorded in the incident record."
  assignResolverGroup:
    input: Incident
    preconditions:
      - canAssignResolverGroup
    effect: The incident is assigned to the specified resolver group.
    verification: Confirm that the incident assignedTo relationship reflects the assigned resolver group and that the assignment timestamp is recorded in the incident record.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - canSubmitRegulatoryNotification
    effect: RegulatoryNotification.status becomes submitted.
    verification: Confirm that RegulatoryNotification.status is submitted and that the submission timestamp and related evidence are recorded.
  implementWorkaround:
    input: Incident
    preconditions:
      - canImplementWorkaround
    effect: A linked workaround status becomes active.
    verification: Confirm that the linked workaround status is active and that the workaround remains linked to the incident in the record.
  executeRecoveryPlan:
    input: RecoveryPlan
    preconditions:
      - canExecuteRecoveryPlan
    effect: RecoveryPlan.status becomes in-progress.
    verification: Confirm that RecoveryPlan.status is in-progress and that associated execution steps are documented in the recovery plan record.
  sendStakeholderCommunication:
    input: Incident
    preconditions:
      - canSendStakeholderCommunication
    effect: Communication is sent to the identified stakeholders and the incident record reflects that the communication was delivered.
    verification: "Confirm successful communication delivery and verify that the communication log records the message content, recipients, delivery status, and sent timestamp."
  acknowledgeIncident:
    input: Incident
    preconditions:
      - canAcknowledgeIncident
    effect: Incident.status becomes acknowledged.
    verification: Confirm that Incident.status is acknowledged and that the acknowledgment timestamp and acknowledger identity are recorded in the incident record.
  containIncident:
    input: Incident
    preconditions:
      - canContainIncident
    effect: Incident.status becomes contained.
    verification: Confirm that Incident.status is contained and that containment indicators such as affected services or impact metrics are documented in the incident record.
