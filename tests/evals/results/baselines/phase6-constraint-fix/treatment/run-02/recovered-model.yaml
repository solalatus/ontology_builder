competency_questions:
  - id: cq1
    text: Which business services are impacted by an incident?
  - id: cq2
    text: Who is the service owner responsible for an affected IT service?
  - id: cq3
    text: Which resolver group should be assigned to handle an incident?
  - id: cq4
    text: When should an incident be declared a major incident?
  - id: cq5
    text: What is the current status of the ongoing recovery plan for an impacted service?
  - id: cq6
    text: Which configuration items are affected by an incident?
  - id: cq7
    text: What are the criticality levels of the third-party services that support applications?
  - id: cq8
    text: "Is a materiality assessment required for an incident, and if so, what triggers it?"
  - id: cq9
    text: Who needs to approve regulatory notifications related to an incident?
  - id: cq10
    text: When was the last successful backup performed for an affected configuration item?
  - id: cq11
    text: What workaround can be implemented to reduce the impact of an incident?
  - id: cq12
    text: Which stakeholders need to be informed about the current status of an incident?
classes:
  Incident:
    meaning: "An unplanned interruption, degradation, or security condition requiring managed response and restoration of services."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      detectionTime:
        type: date
      majorIncidentFlag:
        type: boolean
      materialityAssessmentRequired:
        type: boolean
      impactSummary:
        type: text
      communicationCadence:
        type: text
        allowed:
          - hourly
          - twice-daily
          - daily
          - as-needed
  BusinessService:
    meaning: A customer- or business-facing capability delivered by the bank to fulfill specific operational needs.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  ITService:
    meaning: A managed technology capability that supports one or more business services and ensures operational availability.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
  ConfigurationItem:
    meaning: "A managed component that is recorded, tracked, and controlled within the configuration management process, such as servers, applications, or network devices."
    aliases:
      - CI
    properties:
      lastSuccessfulBackupTime:
        type: date
      status:
        type: text
        allowed:
          - active
          - inactive
          - under maintenance
          - decommissioned
      criticality:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
  Application:
    meaning: A software system that implements specific business or operational functionality to deliver services to users.
    aliases:
      - App
    properties:
      status:
        type: text
        allowed:
          - active
          - inactive
          - under maintenance
          - decommissioned
  ServiceOwner:
    meaning: The individual accountable for the overall management and performance of an IT service throughout its lifecycle.
    aliases: []
    properties: {}
  ResolverGroup:
    meaning: A team assigned to diagnose and restore services or technology areas after an incident occurs.
    aliases:
      - Support Group
    properties:
      status:
        type: text
        allowed:
          - active
          - inactive
          - on-call
          - unavailable
  ThirdPartyService:
    meaning: An externally provided service that the bank relies on to support its operations and offers functionality essential to delivering business services.
    aliases: []
    properties:
      criticalityLevel:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      status:
        type: text
        allowed:
          - available
          - unavailable
          - under maintenance
  MaterialityAssessment:
    meaning: "A documented evaluation of the significance of an incident, determining whether it requires regulatory notification based on its potential impact."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - pending
          - completed
          - approved
          - rejected
      triggerSummary:
        type: text
  RegulatoryNotification:
    meaning: "A formal submission to a competent authority detailing an incident that may have regulatory implications, ensuring compliance with legal obligations."
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      submissionDeadline:
        type: date
  RecoveryPlan:
    meaning: A documented action plan outlining the steps and procedures for restoring an IT service and its dependencies after an incident.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - not-started
          - in-progress
          - completed
          - failed
      lastUpdatedTime:
        type: date
  Workaround:
    meaning: A temporary solution implemented to reduce or bypass the impact of an incident or problem until a permanent fix can be applied.
    aliases: []
    properties:
      status:
        type: text
        allowed:
          - proposed
          - approved
          - active
          - retired
      implementationSummary:
        type: text
  Stakeholder:
    meaning: "Any individual or group that is affected by or has an interest in an operational outcome, including employees, customers, and regulatory bodies."
    aliases: []
    properties:
      communicationChannel:
        type: text
      notificationPriority:
        type: text
        allowed:
          - high
          - medium
          - low
  ApplicationOwner:
    meaning: "The individual responsible for the operational fitness and ongoing management of a specific application within the bank's technology portfolio."
    aliases: []
    properties: {}
  OnCallEngineer:
    meaning: A technical specialist available for immediate operational response to incidents outside of regular working hours.
    aliases: []
    properties:
      availabilityStatus:
        type: text
        allowed:
          - available
          - unavailable
  IncidentCommander:
    meaning: "The person designated to lead, coordinate, and make decisions during the management of a major incident."
    aliases: []
    properties: {}
  BusinessOwner:
    meaning: "The individual accountable for a business service or process, ensuring it meets organizational objectives and customer needs."
    aliases: []
    properties: {}
  RegulatoryReportingAuthority:
    meaning: The designated role or team responsible for approving and submitting regulatory notifications related to incidents to ensure compliance with regulatory frameworks.
    aliases: []
    properties: {}
