competency_questions:
  - id: cq1
    text: Which business services and customer channels are impacted by the current incident?
  - id: cq2
    text: What configuration items and third-party services are on the dependency path of the affected IT service?
  - id: cq3
    text: Are there any active alerts and events correlated with the incident that need to be investigated?
  - id: cq4
    text: "Who owns the affected IT service, and which resolver group and on-call engineer should be assigned to address the incident?"
  - id: cq5
    text: Does the incident meet the criteria for major-incident declaration according to bank policies?
  - id: cq6
    text: "Which runbook, workaround, backup set, or recovery plan can be utilized to address the incident effectively?"
  - id: cq7
    text: "Was the incident caused by any recent changes or deployments, and how does that impact our response strategy?"
  - id: cq8
    text: "Is a materiality assessment completed, and is a regulatory notification required, including any related due dates?"
classes:
  Incident:
    meaning: An unplanned interruption or degradation of an IT service that requires managed response and restoration.
    aliases:
      - issue record
    properties:
      incidentId:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      startTime:
        type: date
      severityLevel:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      complexityLevel:
        type: text
        allowed:
          - low
          - medium
          - high
      majorIncidentDeclared:
        type: boolean
      afterHoursFlag:
        type: boolean
  ITService:
    meaning: A technology capability that is managed to support one or more business services and their operational requirements.
    aliases: []
    properties:
      serviceName:
        type: text
      serviceTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      operationalStatus:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
  BusinessService:
    meaning: A customer-facing capability or function delivered by the bank to meet business needs and objectives.
    aliases: []
    properties:
      businessServiceName:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
          - under-maintenance
  CustomerChannel:
    meaning: "A means through which customers access the bank's services, such as online banking, mobile apps, or in-branch services."
    aliases: []
    properties:
      channelName:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  ConfigurationItem:
    meaning: A managed component or asset within the IT environment that is recorded in the configuration management scope and may affect IT services.
    aliases:
      - CI
    properties:
      ciName:
        type: text
      ciType:
        type: text
        allowed:
          - hardware
          - software
          - network
          - database
          - service
      operationalStatus:
        type: text
        allowed:
          - operational
          - non-operational
          - under-maintenance
  ThirdPartyService:
    meaning: "An externally provided service that supports the bank's operations and may be relied upon by IT services."
    aliases: []
    properties:
      providerName:
        type: text
      serviceName:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
          - under-review
  Alert:
    meaning: A notification generated by monitoring systems indicating the occurrence of an issue that requires attention.
    aliases: []
    properties:
      alertId:
        type: text
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      alertStartTime:
        type: date
      sourceSystem:
        type: text
        allowed:
          - monitoring
          - SIEM
          - manual report
  Event:
    meaning: A recorded occurrence or state change within IT systems that may be relevant for operational monitoring and incident management.
    aliases: []
    properties:
      eventId:
        type: text
      status:
        type: text
        allowed:
          - new
          - processed
      eventTime:
        type: date
      sourceSystem:
        type: text
        allowed:
          - log source
          - application
          - service
  ServiceOwner:
    meaning: The individual or role responsible for the overall management and accountability of a specific IT service throughout its lifecycle.
    aliases: []
    properties:
      ownerName:
        type: text
  ResolverGroup:
    meaning: A team of technical experts assigned to diagnose and resolve incidents related to specific technologies or services.
    aliases:
      - support group
    properties:
      groupName:
        type: text
      supportHours:
        type: text
        allowed:
          - business-hours
          - after-hours
  OnCallEngineer:
    meaning: A technical specialist who is available to respond to incidents and perform time-sensitive operational tasks outside of regular working hours.
    aliases: []
    properties:
      engineerName:
        type: text
      onCallStatus:
        type: text
        allowed:
          - available
          - unavailable
  Runbook:
    meaning: "A documented set of procedures and guidelines for operational tasks, including incident handling, recovery, and troubleshooting processes."
    aliases:
      - operational procedure
    properties:
      runbookName:
        type: text
      version:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  Workaround:
    meaning: A temporary solution applied to reduce or bypass the impact of an incident while a permanent fix is developed.
    aliases: []
    properties:
      workaroundName:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  BackupSet:
    meaning: A collection of data that is preserved at a specific point in time for the purpose of restoration in case of data loss or system failure.
    aliases: []
    properties:
      backupDate:
        type: date
      backupStatus:
        type: text
        allowed:
          - scheduled
          - running
          - successful
          - failed
          - expired
          - corrupted
          - verified
  RecoveryPlan:
    meaning: A documented strategy that outlines the steps and processes required to restore an IT service and its supporting components after a disruption.
    aliases: []
    properties:
      planName:
        type: text
      version:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  Change:
    meaning: A controlled modification or addition to an IT service or its components that may affect service delivery and requires assessment and approval.
    aliases: []
    properties:
      changeId:
        type: text
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      implementationTime:
        type: date
      changeType:
        type: text
        allowed:
          - normal
          - emergency
          - standard
  Deployment:
    meaning: "The process of implementing or activating a change, new service, or update within the IT environment."
    aliases: []
    properties:
      deploymentId:
        type: text
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
      deploymentTime:
        type: date
      deploymentType:
        type: text
        allowed:
          - full
          - partial
          - canary
  MaterialityAssessment:
    meaning: A documented evaluation that determines the significance of an incident and whether it requires reporting to regulatory authorities.
    aliases: []
    properties:
      assessmentStatus:
        type: text
        allowed:
          - not-started
          - in-progress
          - completed
      assessmentCompletedTime:
        type: date
      materialityOutcome:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
  RegulatoryNotification:
    meaning: A formal communication submitted to a competent authority to inform them of an incident that meets specific reporting criteria.
    aliases: []
    properties:
      notificationStatus:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueDate:
        type: date
      submittedTime:
        type: date
  ServiceManager:
    meaning: The role responsible for the day-to-day operational management and performance oversight of a specific IT service.
    aliases: []
    properties:
      managerName:
        type: text
  TechnicalSpecialist:
    meaning: A subject matter expert with deep technical knowledge and skills related to specific technologies or services.
    aliases: []
    properties:
      specialistName:
        type: text
      availabilityStatus:
        type: text
        allowed:
          - available
          - unavailable
  IncidentTechnician:
    meaning: A technical professional responsible for hands-on activities involved in diagnosing and resolving incidents as they occur.
    aliases: []
    properties:
      technicianName:
        type: text
      availabilityStatus:
        type: text
        allowed:
          - available
          - unavailable
  ServiceCriticalityTier:
    meaning: A classification that indicates the importance and priority of a service based on its impact on business operations.
    aliases: []
    properties:
      tierName:
        type: text
  TechnologyStack:
    meaning: "A combination of technologies, platforms, and frameworks that are utilized to build and support IT services."
    aliases: []
    properties:
      stackName:
        type: text
  IncidentComplexity:
    meaning: "A classification indicating the level of difficulty in resolving an incident, based on factors such as technology, services involved, and underlying issues."
    aliases: []
    properties:
      complexityName:
        type: text
  IncidentSeverity:
    meaning: "A measure of the impact and urgency of an incident, determining how quickly it needs to be addressed based on its consequences."
    aliases: []
    properties:
      severityName:
        type: text
relationships:
