rules:
  qualifiesForMajorIncident:
    conditions:
      - "incident status is not resolved, closed, or cancelled"
      - incident severity level is sev1-critical or sev2-high
      - at least one impacted IT service is identified with clear dependencies and business implications
      - an on-call engineer is assigned or available to lead the response
      - the incident business impact justifies enhanced coordination and communication efforts
  requiresRegulatoryNotificationRule:
    conditions:
      - a materiality assessment is completed for the incident
      - the materiality assessment outcome is potentially-reportable or reportable
      - "the incident involves significant business impact, such as affecting critical services or customer data"
      - the reporting timeline must meet the regulatory deadline based on the materiality assessment classification
  assignResolverGroupAndOnCallEngineer:
    conditions:
      - identify the affected IT service and use its ownership and support mapping to determine the responsible resolver group
      - "for sev1-critical incidents, assign the most experienced resolver group and on-call engineer"
      - "for sev2-high incidents, assign an appropriate resolver group based on availability"
      - "if the incident complexity is high, select a resolver group with the necessary specialized expertise"
      - "if the incident occurs outside business hours, assign an on-call engineer from a resolver group that supports after-hours operations"
      - include technical specialists with expertise in the relevant technology stack in the assignment decision
actions:
  assessIncidentImpact:
    input: Incident
    preconditions: []
    effect: Identify the business services and customer channels affected by the incident.
    verification: Confirm the affected services and channels are recorded for the incident.
  traceDependencies:
    input: ITService
    preconditions: []
    effect: Identify the technical and third-party dependencies associated with the affected IT service.
    verification: Confirm the dependency path is recorded or retrievable for the service.
  correlateAlertsAndEvents:
    input: Incident
    preconditions: []
    effect: Identify active alerts and events related to the incident for investigation.
    verification: Confirm correlated alerts and events are linked to the incident.
  assignOwnershipAndResources:
    input: Incident
    preconditions: []
    effect: Identify the service owner and assign or recommend the appropriate resolver group and on-call engineer.
    verification: Confirm the ownership and assignment recommendation or assignment is recorded.
  evaluateMajorIncidentCriteria:
    input: Incident
    preconditions:
      - qualifiesForMajorIncident
    effect: Determine whether the incident qualifies for major-incident status.
    verification: "Confirm the incident's major-incident evaluation result is recorded."
  accessOperationalResponseAssets:
    input: Incident
    preconditions: []
    effect: "Identify runbooks, workarounds, backup sets, or recovery plans relevant to the incident."
    verification: Confirm the selected operational response assets are linked or presented for the incident.
  checkChangeRelationships:
    input: Incident
    preconditions: []
    effect: Identify recent changes or deployments that may have contributed to the incident.
    verification: Confirm any related changes or deployments are linked to the incident.
  conductMaterialityAssessment:
    input: Incident
    preconditions: []
    effect: Determine whether regulatory notification is required and identify related due dates.
    verification: Confirm the materiality assessment result and any notification requirement are recorded.
