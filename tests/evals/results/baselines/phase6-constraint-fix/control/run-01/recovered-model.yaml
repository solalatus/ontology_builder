    aliases: []
  - name: hasEvidenceRequirement
    from: Incident
    to: EvidenceRequirement
    meaning: The incident has evidence requirements that must be satisfied based on its characteristics for effective incident handling and reporting.
    aliases: []
rules:
  qualifiesAsMajorIncident:
    conditions:
      - "incident status is not resolved, closed, or cancelled"
      - incident severity is sev1-critical or sev2-high
      - at least one impacted IT service is identified
      - an incident commander is assigned to the incident
  requiresRegulatoryNotification:
    conditions:
      - the incident is assessed by a materiality assessment
      - the materiality assessment result is reportable
      - the incident occurs within a region or legal entity that has reporting obligations
      - the regulatory notification is submitted within the required timeframe set by regulatory guidelines
  runbookIsSafeToImplement:
    conditions:
      - the runbook status is active
      - the runbook explicitly outlines the steps required to handle the incident type
      - any prerequisites or dependencies mentioned in the runbook are met before implementation
      - the runbook has been tested in a similar environment
  workaroundIsSafeToImplement:
    conditions:
      - the workaround effectively mitigates the impact of the incident without introducing new risks
      - the workaround is documented and confirmed to be applicable for the incident type
      - the workaround does not conflict with other operational procedures or policies already in place
actions:
  declareMajorIncident:
    input: Incident
    preconditions:
      - qualifiesAsMajorIncident
    effect: "The incident is classified as a major incident, and major-incident response protocols are activated."
    verification: Check the incident record to confirm that it is flagged as a major incident and that the appropriate response cadence is established.
  assignIncident:
    input: Incident
    preconditions: []
    effect: The incident is assigned to a specific resolver group for resolution and management.
    verification: Review the incident record to confirm that the resolver group is recorded as assigned.
  initiateRunbook:
    input: Incident
    preconditions:
      - runbookIsSafeToImplement
    effect: The actions outlined in the runbook are begun to address the incident.
    verification: Check that the runbook execution steps have started and are being followed as documented.
  executeWorkaround:
    input: Incident
    preconditions:
      - workaroundIsSafeToImplement
    effect: "The workaround is implemented, reducing the incident's impact while a permanent fix is developed."
    verification: Verify that the workaround is operational and has been documented as applied to the incident.
  updateIncidentStatus:
    input: Incident
    preconditions: []
    effect: The status of the incident is changed to reflect its current state within the incident management lifecycle.
    verification: Review the incident record to confirm that the status has been successfully updated to the intended new state.
  linkIncidentToEvidence:
    input: Incident
    preconditions: []
    effect: The specified evidence items are officially connected to the incident for documentation and accountability.
    verification: Check the incident record to confirm that the linked evidence items are listed and associated correctly.
  collectEvidence:
    input: Incident
    preconditions: []
    effect: Evidence related to the incident is gathered and documented for analysis.
    verification: Review the evidence record to ensure that evidence items are documented as collected and their integrity is confirmed.
  submitRegulatoryNotification:
    input: Incident
    preconditions:
      - requiresRegulatoryNotification
    effect: "The regulatory notification is submitted to the designated authority regarding the incident, and the regulatory notification status is recorded as submitted."
    verification: Confirm that the regulatory notification status is recorded as submitted and that a receipt or acknowledgment from the regulator is obtained.
  reviewPostIncident:
    input: Incident
    preconditions: []
    effect: "A structured review meeting is conducted to analyze the incident response, effectiveness, and lessons learned."
    verification: "Verify that the post-incident review meeting notes, findings, and any identified follow-up actions are documented and stored."
  produceCorrectiveAction:
    input: PostIncidentReview
    preconditions: []
    effect: A corrective action is created from the post-incident review findings and documented with an owner and due date.
    verification: "Check that the corrective action is recorded, assigned to an owner, and has a due date for implementation."
