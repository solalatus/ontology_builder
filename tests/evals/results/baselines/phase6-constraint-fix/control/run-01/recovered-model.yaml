    to: Workaround
    meaning: The impact of the incident is reduced by implementing a workaround that temporarily addresses the issue.
    aliases: []
  - name: isResolvedBy
    from: Incident
    to: Change
    meaning: The incident is resolved through a planned change that addresses the underlying cause of the issue.
    aliases: []
  - name: mayBeLinkedTo
    from: Incident
    to: Deployment
