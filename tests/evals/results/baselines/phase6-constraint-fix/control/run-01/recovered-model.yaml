competency_questions:
  - id: cq1
    text: Which business services are affected by an incident?
  - id: cq2
    text: Which customer channels are affected by an incident?
  - id: cq3
    text: What configuration items are on the dependency path of an impacted IT service?
  - id: cq4
    text: What third-party services are on the dependency path of an impacted IT service?
  - id: cq5
    text: Who owns an affected service?
  - id: cq6
    text: Which resolver group should be assigned to an incident?
  - id: cq7
    text: Which on-call engineer should be assigned to an incident?
  - id: cq8
    text: Does an incident meet the criteria for declaring a major incident according to policy?
  - id: cq9
    text: What alerts are correlated with an incident?
  - id: cq10
    text: What events are correlated with an incident?
  - id: cq11
    text: Which runbook can be used to address an incident?
  - id: cq12
    text: Which workaround can be used to address an incident?
  - id: cq13
    text: Is a proposed runbook or workaround safe to implement for an incident?
  - id: cq14
    text: Was an incident triggered by a recent change?
  - id: cq15
    text: Was an incident triggered by a recent deployment?
  - id: cq16
    text: Is the materiality assessment for an incident complete?
  - id: cq17
    text: Does an incident require a regulatory notification?
  - id: cq18
    text: Are all required evidence items collected for an incident?
  - id: cq19
    text: Is the integrity of incident evidence verified?
  - id: cq20
    text: Which open corrective actions from previous post-incident reviews may be relevant to an incident?
classes:
  Incident:
    meaning: "An unplanned disruption, degradation, or security condition requiring a managed response to restore service."
    aliases:
      - ticket
      - issue
    properties:
      incidentId:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - investigating
          - contained
          - recovering
          - monitoring
          - resolved
          - closed
          - cancelled
      summary:
        type: text
      openedAt:
        type: date
      priority:
        type: text
        allowed:
          - p1-critical
          - p2-high
          - p3-medium
          - p4-low
      environment:
        type: text
        allowed:
          - production
          - disaster-recovery
          - pre-production
          - test
          - development
          - management
      region:
        type: text
      legalEntity:
        type: text
      type:
        type: text
  ITService:
    meaning: A managed technology capability that supports one or more business services delivered by the bank.
    aliases:
      - informatics service
    properties:
      serviceId:
        type: text
      name:
        type: text
      description:
        type: text
      criticalityTier:
        type: text
        allowed:
          - tier-1-critical
          - tier-2-important
          - tier-3-standard
          - tier-4-supporting
      healthState:
        type: text
        allowed:
          - healthy
          - degraded
          - partially-unavailable
          - unavailable
          - recovering
          - unknown
      availabilityTarget:
        type: text
  BusinessService:
    meaning: A customer- or business-facing capability provided by the bank to meet customer needs and drive business outcomes.
    aliases: []
    properties:
      serviceId:
        type: text
      name:
        type: text
      description:
        type: text
      criticalityTier:
        type: text
      healthState:
        type: text
      availabilityTarget:
        type: text
  CustomerChannel:
    meaning: "The various channels through which customers access banking services, such as online banking, mobile apps, and physical branches."
    aliases: []
    properties:
      channelId:
        type: text
      name:
        type: text
      description:
        type: text
      accessMethod:
        type: text
  ConfigurationItem:
    meaning: "A managed component within the IT environment, including hardware, software, and documentation, that supports services."
    aliases:
      - CI
    properties:
      ciId:
        type: text
      name:
        type: text
      type:
        type: text
      version:
        type: text
      status:
        type: text
        allowed:
          - operational
          - under maintenance
          - deprecated
          - retired
      criticalityTier:
        type: text
      location:
        type: text
  ThirdPartyService:
    meaning: An externally provided service that the bank relies on to support its IT operations and services.
    aliases:
      - outsourced service
    properties:
      serviceName:
        type: text
      description:
        type: text
      criticalityTier:
        type: text
      availabilityTarget:
        type: text
      provider:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
          - under review
      isCriticalProvider:
        type: boolean
  ServiceOwner:
    meaning: The individual accountable for the overall delivery and management of a specific IT service across its lifecycle.
    aliases: []
    properties: {}
  ApplicationOwner:
    meaning: The person responsible for the operational fitness and performance of a specific application used within the organization.
    aliases: []
    properties: {}
  TechnicalOwner:
    meaning: "The individual accountable for the engineering, maintenance, and technical health of a configuration item or technology component."
    aliases: []
    properties: {}
  ResolverGroup:
    meaning: A designated team responsible for diagnosing and resolving incidents related to a specific technology or service area.
    aliases:
      - support group
    properties:
      groupId:
        type: text
      name:
        type: text
      description:
        type: text
      status:
        type: text
        allowed:
          - active
          - on-call
          - inactive
  OnCallEngineer:
    meaning: A technical specialist available for immediate response to operational incidents during off-hours or emergencies.
    aliases: []
    properties:
      engineerId:
        type: text
      name:
        type: text
      availabilityStatus:
        type: text
        allowed:
          - available
          - unavailable
          - off-duty
      contactInformation:
        type: text
  SupportEngineer:
    meaning: A technical professional who provides assistance and troubleshooting for technology-related issues within their area of expertise.
    aliases: []
    properties: {}
  TechnicalSpecialist:
    meaning: An expert in a specific technology or domain who assists resolver groups in addressing complex issues.
    aliases: []
    properties: {}
  Alert:
    meaning: "A notification generated by monitoring systems that indicates a condition requiring attention, typically related to performance or security."
    aliases: []
    properties:
      alertId:
        type: text
      type:
        type: text
      severity:
        type: text
        allowed:
          - sev1-critical
          - sev2-high
          - sev3-medium
          - sev4-low
      status:
        type: text
        allowed:
          - new
          - acknowledged
          - suppressed
          - escalated
          - closed
      raisedAt:
        type: date
      summary:
        type: text
  Event:
    meaning: "An observable occurrence in the IT environment, which may signify a state change or noteworthy activity."
    aliases: []
    properties:
      eventId:
        type: text
      type:
        type: text
      detectionSource:
        type: text
      observedAt:
        type: date
      summary:
        type: text
  Runbook:
    meaning: "A documented operational procedure that outlines steps to be followed for diagnosing, responding to, or recovering from incidents."
    aliases:
      - operational procedure
      - playbook
    properties:
      runbookId:
        type: text
      title:
        type: text
      description:
        type: text
      version:
        type: text
      status:
        type: text
        allowed:
          - active
          - deprecated
      supportedIncidentTypes:
        type: text
      prerequisites:
        type: text
      testedEnvironments:
        type: text
  Workaround:
    meaning: A temporary solution that mitigates the impact of an incident or problem without fully resolving the underlying issue.
    aliases: []
    properties:
      workaroundId:
        type: text
      summary:
        type: text
      description:
        type: text
      status:
        type: text
        allowed:
          - effective
          - ineffective
          - under review
  Change:
    meaning: "A planned alteration to the IT environment, such as adding, modifying, or removing configuration items that may affect services."
    aliases: []
    properties:
      changeId:
        type: text
      summary:
        type: text
      status:
        type: text
        allowed:
          - draft
          - assessed
          - approved
          - scheduled
          - implementing
          - implemented
          - failed
          - rolled-back
          - closed
          - cancelled
      riskLevel:
        type: text
        allowed:
          - low
          - medium
          - high
          - critical
      plannedStart:
        type: date
      plannedEnd:
        type: date
  Deployment:
    meaning: The process of implementing changes or updates to IT services and applications in a controlled manner.
    aliases: []
    properties:
      deploymentId:
        type: text
      version:
        type: text
      status:
        type: text
        allowed:
          - planned
          - running
          - succeeded
          - failed
          - rolled-back
          - cancelled
      targetEnvironment:
        type: text
      startedAt:
        type: date
      completedAt:
        type: date
  MaterialityAssessment:
    meaning: An evaluation determining the significance of an incident and whether it requires regulatory reporting.
    aliases:
      - reportability assessment
    properties:
      assessmentId:
        type: text
      result:
        type: text
        allowed:
          - not-reportable
          - potentially-reportable
          - reportable
          - undetermined
      rationale:
        type: text
      assessedAt:
        type: date
      reportingDueTime:
        type: date
      isCompleted:
        type: boolean
  RegulatoryNotification:
    meaning: A formal report submitted to a regulator concerning an incident that meets specific reporting criteria.
    aliases:
      - supervisory notification
    properties:
      notificationId:
        type: text
      status:
        type: text
        allowed:
          - draft
          - pending-approval
          - approved
          - submitted
          - accepted
          - rejected
          - withdrawn
      dueDate:
        type: date
      submissionTime:
        type: date
      evidenceIncluded:
        type: boolean
      recipientRegulator:
        type: text
  EvidenceItem:
    meaning: A preserved record or artifact that supports analysis and accountability during incident investigations and reviews.
    aliases: []
    properties:
      evidenceId:
        type: text
      type:
        type: text
      collectedAt:
        type: date
      integrityStatus:
        type: text
        allowed:
          - collected
          - hashed
          - verified
          - sealed
          - compromised
      storageLocation:
        type: text
      verificationStatus:
        type: text
        allowed:
          - verified
          - not verified
  PostIncidentReview:
    meaning: "A structured meeting following an incident to analyze its causes, assess the response effectiveness, and identify improvements."
    aliases:
      - PIR
      - RCA review
    properties:
      reviewId:
        type: text
      incidentId:
        type: text
      dateHeld:
        type: date
      findings:
        type: text
      status:
        type: text
  CorrectiveAction:
    meaning: An action taken to eliminate the cause of a detected non-conformity or incident to prevent recurrence.
    aliases:
      - remediation action
    properties:
      actionId:
        type: text
      status:
        type: text
      dueDate:
        type: date
      owner:
        type: text
      description:
        type: text
      implementationDate:
        type: date
  Policy:
    meaning: An established guideline or rule that governs operational procedures and decision-making within the organization.
    aliases: []
    properties:
      policyId:
        type: text
      title:
        type: text
      description:
        type: text
      version:
        type: text
      status:
        type: text
        allowed:
          - active
          - inactive
  IncidentCommander:
    meaning: "The individual responsible for overseeing and coordinating the response to a major incident, ensuring effective resolution and communication."
    aliases: []
    properties: {}
  EvidenceRequirement:
    meaning: A specification that outlines the evidence items needed to support compliance and validity based on the type and severity of an incident.
    aliases: []
    properties:
      requirementId:
        type: text
      incidentType:
        type: text
      severity:
        type: text
      isMandatory:
        type: boolean
      description:
        type: text
relationships:
  - name: impacts
    from: Incident
    to: ITService
    meaning: The incident negatively affects the operation or performance of the IT service.
    aliases:
      - affects
  - name: supports
    from: ITService
    to: BusinessService
    meaning: The IT service provides the necessary technology capability for the business service to function effectively.
    aliases: []
  - name: isDeliveredThrough
    from: ITService
    to: CustomerChannel
    meaning: The IT service is made accessible to customers through specific channels such as online platforms or physical locations.
    aliases: []
  - name: isImplementedBy
    from: ITService
    to: ConfigurationItem
    meaning: The IT service is realized through specific configuration items that comprise its technical infrastructure.
    aliases: []
  - name: dependsOn
    from: ITService
    to: ThirdPartyService
    meaning: The IT service relies on external third-party services to perform its functions and deliver value.
    aliases: []
  - name: isOwnedBy
    from: ITService
    to: ServiceOwner
    meaning: The service owner is responsible for the overall management and delivery of the IT service.
    aliases: []
  - name: isOwnedBy
