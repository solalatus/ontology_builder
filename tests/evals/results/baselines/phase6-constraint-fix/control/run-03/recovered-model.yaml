    meaning: A resolver group comprises support engineers who are responsible for troubleshooting and resolving incidents related to the services they manage.
    aliases:
      - contains
  - name: includes
    from: ResolverGroup
    to: TechnicalSpecialist
    meaning: A resolver group includes technical specialists who provide expert knowledge and support for complex incidents requiring advanced technical skills.
    aliases:
      - contains
  - name: assignedTo
    from: Incident
    to: OnCallEngineer
    meaning: An incident is formally assigned to an on-call engineer who is responsible for addressing the issue during the on-call period.
    aliases: []
  - name: supportedBy
    from: ITService
    to: ResolverGroup
    meaning: An IT service is backed by a resolver group that is responsible for diagnosing and resolving incidents related to that service.
    aliases: []
  - name: uses
    from: Incident
    to: Runbook
    meaning: "An incident utilizes a runbook to follow defined procedures and guidelines for diagnosis, response, and resolution."
    aliases: []
  - name: uses
    from: Incident
    to: Workaround
    meaning: An incident employs a workaround to temporarily mitigate its impact until a permanent solution can be implemented.
    aliases: []
  - name: uses
    from: Incident
    to: BackupSet
    meaning: An incident relies on a backup set to restore data or services affected by data loss or corruption.
    aliases: []
  - name: uses
    from: Incident
    to: RecoveryPlan
    meaning: An incident implements a recovery plan to outline the steps necessary for restoring services and operations following the incident.
    aliases: []
  - name: causedBy
    from: Incident
    to: Change
    meaning: "An incident arises from a change that has been made to the IT environment, indicating a potential link between the two."
    aliases: []
  - name: causedBy
    from: Incident
    to: Deployment
    meaning: "An incident is triggered by a deployment that introduces new changes into the production environment, potentially leading to issues."
    aliases: []
  - name: includes
    from: Incident
    to: MaterialityAssessment
    meaning: An incident encompasses a materiality assessment to evaluate its significance and determine whether reporting to regulatory bodies is required.
    aliases: []
  - name: requires
    from: MaterialityAssessment
    to: RegulatoryNotification
    meaning: A materiality assessment indicates the need for a regulatory notification if the incident is deemed significant enough to warrant reporting.
    aliases: []
  - name: managedBy
    from: Incident
    to: IncidentResponseTeam
    meaning: "An incident is overseen and coordinated by the incident response team, which is responsible for managing the response to significant incidents."
    aliases:
      - overseenBy
  - name: assignedTo
    from: Incident
    to: ResolverGroup
    meaning: An incident is allocated to a specific resolver group tasked with managing and resolving the issue.
    aliases: []
  - name: for
    from: RegulatoryNotification
    to: Incident
    meaning: A regulatory notification is for the incident that it reports to the relevant authority.
    aliases: []
  - name: basedOn
    from: RegulatoryNotification
    to: MaterialityAssessment
    meaning: A regulatory notification is based on the materiality assessment used to justify reporting the incident.
    aliases: []
rules:
  qualifiesForMajorIncidentDeclaration:
    conditions:
      - "incident current status is not resolved, closed, or cancelled"
      - incident severity is sev1-critical or sev2-high
      - at least one impacted IT service has criticality tier tier-1-critical
      - incident causes significant disruption to business processes or customer services
      - incident has potential regulatory significance
      - incident impacts multiple customer channels or business services
      - incident duration exceeds defined thresholds for response and resolution
      - incident requires executive-level attention or communication with senior management
  requiresRegulatoryNotification:
    conditions:
      - materiality assessment status is completed
      - materiality assessment result is reportable
      - incident regulatorySignificanceFlag is true
actions:
  acknowledgeAlert:
    input: Alert
    preconditions: []
    effect: The alert status is set to acknowledged.
    verification: Confirm that the alert status is updated to acknowledged.
  assignIncident:
    input: Incident
    preconditions: []
    effect: The incident is assigned to the appropriate resolver group based on the affected IT service.
    verification: Confirm that the incident has an assigned resolver group.
  declareMajorIncident:
    input: Incident
    preconditions:
      - qualifiesForMajorIncidentDeclaration
    effect: The incident major-incident declared flag is set to true and major-incident handling is initiated.
    verification: Confirm that the major-incident declared flag is true.
  documentMaterialityAssessment:
    input: MaterialityAssessment
    preconditions: []
    effect: The materiality assessment status and result are recorded.
    verification: Confirm that the materiality assessment status and result are recorded.
  submitRegulatoryNotification:
    input: RegulatoryNotification
    preconditions:
      - requiresRegulatoryNotification
    effect: The regulatory notification status is set to submitted.
    verification: Confirm that the regulatory notification status is submitted.
  activateRecoveryPlan:
    input: RecoveryPlan
    preconditions: []
    effect: The recovery plan status is set to in-progress.
    verification: Confirm that the recovery plan status is updated to in-progress.
  notifyStakeholders:
    input: Incident
    preconditions: []
    effect: Stakeholders are notified about the current incident status and impact.
    verification: Confirm that the incident communication has been sent through the designated channel.
  updateIncidentStatus:
    input: Incident
    preconditions: []
    effect: The incident current status is updated to the intended lifecycle stage.
    verification: Confirm that the incident current status matches the intended lifecycle stage.
