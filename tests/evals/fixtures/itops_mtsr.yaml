metadata:
  title: IT Operations and Incident Response Ontology for a Medium-sized Hungarian Bank
  profile: Minimal Typed Semantic Representation (MTSR), levels 0-2
  canonicalLanguage: en
  lexicalLanguages:
  - en
  - hu
  jurisdictionContext: Hungary / European Union banking operations
  version: 1.0.0
  generatedOn: '2026-07-29'
  scope: IT service operations, observability, incident response, problem/change/recovery management, stakeholder communication,
    evidence, and regulatory reporting workflow.
  governanceNote: Value sets, materiality logic, authorization rules, and mappings must be reviewed against the bank's approved
    policies and current legal obligations before production use.
classes:
  bank:
    label: Bank
    aliases:
    - bank
    - hitelintézet
    definition: The regulated financial institution whose IT services and incidents are managed.
  organizationalUnit:
    label: Organizational Unit
    aliases:
    - szervezeti egység
    definition: A governed unit of the bank with defined responsibilities.
  itOperationsTeam:
    label: IT Operations Team
    aliases:
    - IT üzemeltetés
    - üzemeltetési csapat
    definition: The team responsible for reliable day-to-day operation of IT services.
  serviceDesk:
    label: Service Desk
    aliases:
    - help desk
    - ügyfélszolgálati IT pult
    - hibabejelentő
    definition: The first-line function that receives, records, triages, and routes user-reported issues.
  networkOperationsCentre:
    label: Network Operations Centre
    aliases:
    - NOC
    - hálózatüzemeltetési központ
    definition: The function that monitors and operates network and infrastructure services.
  securityOperationsCentre:
    label: Security Operations Centre
    aliases:
    - SOC
    - biztonsági műveleti központ
    definition: The function that monitors, investigates, and coordinates response to cyber threats.
  incidentResponseTeam:
    label: Incident Response Team
    aliases:
    - IRT
    - incidenskezelő csapat
    definition: The cross-functional team responsible for coordinating significant incident response.
  resolverGroup:
    label: Resolver Group
    aliases:
    - megoldócsoport
    - support group
    definition: A team assigned to diagnose and restore a specific technology or service area.
  onCallEngineer:
    label: On-call Engineer
    aliases:
    - ügyeletes mérnök
    - on-call
    definition: A technical specialist available for time-critical operational response.
  incidentCommander:
    label: Incident Commander
    aliases:
    - incident manager
    - incidensparancsnok
    - MIM lead
    definition: The person accountable for command, coordination, and decision cadence during a major incident.
  serviceOwner:
    label: Service Owner
    aliases:
    - szolgáltatásgazda
    definition: The role accountable for an IT service across its lifecycle.
  applicationOwner:
    label: Application Owner
    aliases:
    - alkalmazásgazda
    definition: The role accountable for an application and its operational fitness.
  technicalOwner:
    label: Technical Owner
    aliases:
    - technikai gazda
    definition: The role accountable for the engineering and maintenance of a configuration item.
  businessOwner:
    label: Business Owner
    aliases:
    - üzleti gazda
    definition: The business role accountable for a business service or process.
  vendor:
    label: Vendor
    aliases:
    - supplier
    - szállító
    - beszállító
    definition: An external organization supplying or supporting technology or services.
  regulator:
    label: Regulator
    aliases:
    - supervisory authority
    - felügyeleti hatóság
    definition: A competent authority that supervises the bank or receives required notifications.
  stakeholder:
    label: Stakeholder
    aliases:
    - érintett
    definition: A person, group, or organization affected by or responsible for an operational outcome.
  businessService:
    label: Business Service
    aliases:
    - üzleti szolgáltatás
    definition: A customer- or business-facing capability delivered by the bank.
  businessProcess:
    label: Business Process
    aliases:
    - üzleti folyamat
    definition: A coordinated set of activities producing a business outcome.
  customerChannel:
    label: Customer Channel
    aliases:
    - ügyfélcsatorna
    definition: A channel through which customers access banking services.
  itService:
    label: IT Service
    aliases:
    - informatics service
    - informatikai szolgáltatás
    definition: A managed technology capability supporting one or more business services.
  serviceLevelObjective:
    label: Service Level Objective
    aliases:
    - SLO
    - szolgáltatási célszint
    definition: A measurable target for availability, response, or restoration of an IT service.
  configurationItem:
    label: Configuration Item
    aliases:
    - CI
    - konfigurációs elem
    definition: A managed component recorded in the configuration-management scope.
  application:
    label: Application
    aliases:
    - alkalmazás
    - app
    definition: A software system that implements business or operational functionality.
  database:
    label: Database
    aliases:
    - adatbázis
    - DB
    definition: A managed persistent data store used by an application or service.
  infrastructureComponent:
    label: Infrastructure Component
    aliases:
    - infrastruktúra-elem
    definition: A technical component providing compute, network, platform, endpoint, or storage capability.
  server:
    label: Server
    aliases:
    - kiszolgáló
    definition: A physical compute host providing processing capacity.
  virtualMachine:
    label: Virtual Machine
    aliases:
    - VM
    - virtuális gép
    definition: A virtualized compute instance hosted on infrastructure.
  containerPlatform:
    label: Container Platform
    aliases:
    - Kubernetes platform
    - konténerplatform
    definition: A managed platform used to run containerized workloads.
  cloudService:
    label: Cloud Service
    aliases:
    - felhőszolgáltatás
    definition: A technology capability consumed from an external or group cloud provider.
  networkDevice:
    label: Network Device
    aliases:
    - hálózati eszköz
    definition: A managed device that routes, switches, filters, or terminates network traffic.
  networkSegment:
    label: Network Segment
    aliases:
    - hálózati szegmens
    - VLAN
    definition: A logically or physically bounded portion of the bank network.
  endpoint:
    label: Endpoint
    aliases:
    - végpont
    - munkaállomás
    definition: A managed user or administrative computing endpoint.
  storageSystem:
    label: Storage System
    aliases:
    - tárolórendszer
    definition: A managed system providing persistent block, file, or object storage.
  backupSet:
    label: Backup Set
    aliases:
    - mentéskészlet
    - backup
    definition: A defined collection of recoverable backup data for protected components.
  dataCentre:
    label: Data Centre
    aliases:
    - DC
    - adatközpont
    definition: A facility hosting managed technology infrastructure.
  site:
    label: Site
    aliases:
    - telephely
    - location
    definition: A physical bank, supplier, or hosting location.
  environment:
    label: Environment
    aliases:
    - környezet
    definition: A deployment context such as production, test, development, or disaster recovery.
  dataAsset:
    label: Data Asset
    aliases:
    - adatvagyon-elem
    definition: A governed collection of information processed or stored by services.
  integrationInterface:
    label: Integration Interface
    aliases:
    - interface
    - API
    - integrációs interfész
    definition: A defined technical interface through which systems exchange data or commands.
  thirdPartyService:
    label: Third-party Service
    aliases:
    - outsourced service
    - külső szolgáltatás
    definition: An externally provided service on which the bank depends.
  monitoringTool:
    label: Monitoring Tool
    aliases:
    - monitoring platform
    - felügyeleti eszköz
    definition: A platform that collects telemetry and evaluates operational conditions.
  monitoringRule:
    label: Monitoring Rule
    aliases:
    - alert rule
    - riasztási szabály
    definition: A deterministic condition that evaluates telemetry and may generate an alert.
  metric:
    label: Metric
    aliases:
    - mérőszám
    definition: A time-stamped quantitative observation about a component or service.
  logSource:
    label: Log Source
    aliases:
    - naplóforrás
    definition: A system or component that emits operational or security records.
  event:
    label: Event
    aliases:
    - esemény
    definition: A time-stamped observation representing a state change or noteworthy occurrence.
  securityEvent:
    label: Security Event
    aliases:
    - biztonsági esemény
    definition: An event relevant to confidentiality, integrity, availability, authenticity, or cyber threat activity.
  alert:
    label: Alert
    aliases:
    - riasztás
    definition: A monitoring or security signal requiring triage or acknowledgement.
  incident:
    label: Incident
    aliases:
    - incidens
    - hibajegy
    definition: An unplanned interruption, degradation, or security condition requiring managed response.
  majorIncident:
    label: Major Incident
    aliases:
    - MI
    - kiemelt incidens
    - súlyos incidens
    definition: An incident requiring exceptional coordination because of high business or regulatory impact.
  cybersecurityIncident:
    label: Cybersecurity Incident
    aliases:
    - cyber incident
    - kiberbiztonsági incidens
    definition: An incident caused by or involving malicious, unauthorized, or security-relevant activity.
  problem:
    label: Problem
    aliases:
    - probléma
    definition: The underlying cause or potential cause of one or more incidents.
  knownError:
    label: Known Error
    aliases:
    - ismert hiba
    definition: A diagnosed problem with a documented cause or workaround.
  change:
    label: Change
    aliases:
    - változás
    - módosítás
    definition: A controlled addition, modification, or removal that may affect an IT service.
  emergencyChange:
    label: Emergency Change
    aliases:
    - sürgősségi változás
    - emergency fix
    definition: A change processed under an accelerated path to address an urgent operational need.
  release:
    label: Release
    aliases:
    - kiadás
    - release
    definition: A governed package of approved changes introduced together.
  deployment:
    label: Deployment
    aliases:
    - telepítés
    - élesítés
    definition: The technical execution that installs or activates a release or change.
  workaround:
    label: Workaround
    aliases:
    - kerülőmegoldás
    definition: A temporary method that reduces or bypasses the impact of an incident or problem.
  runbook:
    label: Runbook
    aliases:
    - üzemeltetési eljárás
    - playbook
    definition: A maintained operational procedure for diagnosis, response, recovery, or verification.
  recoveryPlan:
    label: Recovery Plan
    aliases:
    - helyreállítási terv
    - DR plan
    definition: A documented plan for restoring an IT service and its dependencies.
  businessContinuityPlan:
    label: Business Continuity Plan
    aliases:
    - BCP
    - üzletmenet-folytonossági terv
    definition: A plan for maintaining or resuming critical business services during disruption.
  disasterRecoveryTest:
    label: Disaster Recovery Test
    aliases:
    - DR test
    - katasztrófa-helyreállítási teszt
    definition: A controlled exercise that validates recovery procedures, timings, and dependencies.
  evidenceItem:
    label: Evidence Item
    aliases:
    - evidence
    - bizonyíték
    definition: A preserved record, artifact, or observation supporting incident analysis and accountability.
  communication:
    label: Communication
    aliases:
    - értesítés
    - tájékoztatás
    definition: A controlled message sent to operational, business, customer, vendor, or regulatory audiences.
  materialityAssessment:
    label: Materiality Assessment
    aliases:
    - reportability assessment
    - lényegességi értékelés
    definition: A documented determination of incident significance and reporting implications.
  regulatoryNotification:
    label: Regulatory Notification
    aliases:
    - supervisory notification
    - felügyeleti bejelentés
    definition: A formal incident-related submission to a competent authority.
  postIncidentReview:
    label: Post-Incident Review
    aliases:
    - PIR
    - RCA review
    - incidens utóelemzés
    definition: A structured review of causes, response effectiveness, lessons, and follow-up work.
  correctiveAction:
    label: Corrective Action
    aliases:
    - remediation action
    - helyesbítő intézkedés
    definition: A tracked action intended to remove a cause, reduce risk, or improve response capability.
datatypes:
  identifier:
    label: Identifier
    base: string
    definition: A stable unique identifier in an authoritative system.
  text:
    label: Text
    base: string
    definition: Human-readable free text.
  timestamp:
    label: Timestamp
    base: date-time
    definition: A date and time with timezone.
  date:
    label: Date
    base: date
    definition: A calendar date.
  durationMinutes:
    label: Duration Minutes
    base: integer
    unit: min
    minimum: 0
    definition: A non-negative duration measured in minutes.
  integer:
    label: Integer
    base: integer
    definition: A whole number.
  decimal:
    label: Decimal
    base: number
    definition: A decimal numeric value.
  percentage:
    label: Percentage
    base: number
    unit: '%'
    minimum: 0
    maximum: 100
    definition: A percentage from 0 to 100.
  boolean:
    label: Boolean
    base: boolean
    definition: A true or false value.
  uri:
    label: URI
    base: string
    format: uri
    definition: A resolvable or persistent resource reference.
valueSets:
  incidentStatus:
    label: Incident Status
    values: &id003
    - new
    - acknowledged
    - investigating
    - contained
    - recovering
    - monitoring
    - resolved
    - closed
    - cancelled
  alertStatus:
    label: Alert Status
    values: &id001
    - new
    - acknowledged
    - suppressed
    - escalated
    - closed
  severityLevel:
    label: Severity Level
    values: &id002
    - sev1-critical
    - sev2-high
    - sev3-medium
    - sev4-low
  priorityLevel:
    label: Priority Level
    values: &id004
    - p1-critical
    - p2-high
    - p3-medium
    - p4-low
  impactLevel:
    label: Impact Level
    values:
    - enterprise-wide
    - multiple-services
    - single-service
    - limited-users
    - no-observed-impact
  urgencyLevel:
    label: Urgency Level
    values:
    - immediate
    - high
    - normal
    - low
  incidentCategory:
    label: Incident Category
    values:
    - availability
    - performance
    - capacity
    - network
    - application
    - database
    - infrastructure
    - data-integrity
    - cybersecurity
    - third-party
    - change-induced
    - other
  detectionSourceType:
    label: Detection Source Type
    values:
    - monitoring
    - siem
    - service-desk
    - user-report
    - vendor-report
    - automated-control
    - regulator
    - other
  environmentType:
    label: Environment Type
    values:
    - production
    - disaster-recovery
    - pre-production
    - test
    - development
    - management
  criticalityTier:
    label: Criticality Tier
    values:
    - tier-1-critical
    - tier-2-important
    - tier-3-standard
    - tier-4-supporting
  dataClassification:
    label: Data Classification
    values:
    - public
    - internal
    - confidential
    - restricted
  serviceHealthState:
    label: Service Health State
    values:
    - healthy
    - degraded
    - partially-unavailable
    - unavailable
    - recovering
    - unknown
  recoveryState:
    label: Recovery State
    values:
    - not-started
    - in-progress
    - restored
    - verified
    - failed
  changeStatus:
    label: Change Status
    values: &id005
    - draft
    - assessed
    - approved
    - scheduled
    - implementing
    - implemented
    - failed
    - rolled-back
    - closed
    - cancelled
  changeRiskLevel:
    label: Change Risk Level
    values: &id006
    - low
    - medium
    - high
    - critical
  communicationAudience:
    label: Communication Audience
    values:
    - technical
    - management
    - business
    - customer
    - vendor
    - regulator
    - all-staff
  notificationStatus:
    label: Notification Status
    values: &id008
    - draft
    - pending-approval
    - approved
    - submitted
    - accepted
    - rejected
    - withdrawn
  materialityResult:
    label: Materiality Result
    values:
    - not-reportable
    - potentially-reportable
    - reportable
    - undetermined
  evidenceIntegrityStatus:
    label: Evidence Integrity Status
    values: &id007
    - collected
    - hashed
    - verified
    - sealed
    - compromised
  rootCauseCategory:
    label: Root Cause Category
    values:
    - software-defect
    - configuration-error
    - capacity-shortage
    - hardware-failure
    - network-failure
    - human-error
    - process-failure
    - third-party-failure
    - cyber-attack
    - unknown
  correctiveActionStatus:
    label: Corrective Action Status
    values: &id009
    - open
    - in-progress
    - blocked
    - implemented
    - verified
    - closed
    - cancelled
  testResult:
    label: Test Result
    values:
    - passed
    - passed-with-observations
    - failed
    - not-completed
  problemStatus:
    label: Problem Status
    values:
    - new
    - investigating
    - root-cause-known
    - known-error
    - resolved
    - closed
  deploymentStatus:
    label: Deployment Status
    values:
    - planned
    - running
    - succeeded
    - failed
    - rolled-back
    - cancelled
  backupStatus:
    label: Backup Status
    values:
    - scheduled
    - running
    - successful
    - failed
    - expired
    - corrupted
    - verified
predicates:
