      type: date
actions:
  acknowledgeAlert:
    label: Acknowledge alert
    inputs:
      alert: alert
    preconditions:
    - alert.status == new
    - operator is authorized for the responsible resolver group
    effects:
    - alert.status := acknowledged
    - acknowledgement timestamp is recorded
    authorization:
    - operator is on duty or explicitly delegated
    verification:
    - read alert and confirm status == acknowledged
  declareMajorIncident:
    label: Declare major incident
    inputs:
      incident: incident
    preconditions:
    - incident.status not in [resolved, closed, cancelled]
    - incident.severity in [sev1-critical, sev2-high]
    - at least one impacted IT service is identified
    - commander is assigned
    effects:
    - incident is classified as Major Incident
    - major-incident coordination and communication cadence start
    authorization:
    - commander or designated duty manager is authorized
    verification:
    - read incident and confirm major-incident flag, commander, declaration time, and communication record
  assignIncident:
    label: Assign incident
    inputs:
      incident: incident
    preconditions:
    - incident.status not in [closed, cancelled]
    - resolver group supports an affected service or configuration item
    effects:
    - incident is assigned to resolver group
    authorization:
    - service desk, incident commander, or routing automation is authorized
    verification:
    - read incident and confirm resolver group assignment
  containIncident:
    label: Contain incident
    inputs:
      incident: incident
    preconditions:
    - incident.status in [acknowledged, investigating]
    - containment scope and expected side effects are recorded
    effects:
    - approved containment steps are executed
    - incident.status := contained when containment is verified
    authorization:
    - incident commander and relevant technical owner authorize consequential steps
    verification:
    - verify containment indicators and service impact
  isolateConfigurationItem:
    label: Isolate configuration item
    inputs:
      incident: incident
    preconditions:
    - configuration item is linked to the incident
    - isolation impact is assessed
    - rollback or reconnection method is available
    effects:
    - configuration item is isolated from defined networks or dependencies
    authorization:
    - incident commander and technical owner authorize isolation, subject to emergency policy
    verification:
    - confirm isolation and check remaining service health
  failOverService:
    label: Fail over service
    inputs:
      incident: incident
    preconditions:
    - recovery plan applies to the service
    - target recovery environment is available
    - data-recovery point is acceptable
    effects:
    - service workload is moved to the recovery environment
    authorization:
    - incident commander and service owner authorize failover
    verification:
    - confirm service health and critical business transactions in the recovery environment
  restoreBackup:
    label: Restore backup
    inputs:
      backupSet: backupSet
    preconditions:
    - backup status in [successful, verified]
    - backup protects the target
    - restore point and target environment are approved
    effects:
    - backup data is restored to the target
    authorization:
    - technical owner or recovery lead authorizes restore
    verification:
    - validate data integrity and application functionality after restore
  executeEmergencyChange:
    label: Execute emergency change
    inputs:
      change: emergencyChange
    preconditions:
    - change is linked to an active incident
    - implementation and backout plans are present
    - affected configuration items are identified
    - risk is explicitly accepted
    effects:
    - approved emergency change is implemented and status is updated
    authorization:
    - emergency-change authority approves according to bank policy
    verification:
    - run technical checks, verify service health, and record implementation evidence
  sendStakeholderCommunication:
    label: Send stakeholder communication
    inputs:
      incident: incident
    preconditions:
    - audience, message, owner, and approval state are recorded
    - message content matches the latest verified incident state
    effects:
    - communication is sent and timestamped
    authorization:
    - communication owner or incident commander approves the message
    verification:
    - confirm delivery status and archive the final message
  submitRegulatoryNotification:
    label: Submit regulatory notification
    inputs:
      notification: regulatoryNotification
    preconditions:
    - assessment.result == reportable
    - notification is linked to the incident and regulator
    - required fields and supporting evidence are complete
    - notification.status == approved
    - submission occurs before notification.dueAt
    effects:
    - notification.status := submitted
    - submission receipt is stored
    authorization:
    - designated regulatory-reporting authority approves submission
    verification:
    - confirm accepted submission or record rejection and remediation
  closeIncident:
    label: Close incident
    inputs:
      incident: incident
    preconditions:
    - incident.status in [resolved, monitoring]
    - impacted services have health state healthy or an accepted residual condition
    - resolution and restoration evidence are recorded
    - required stakeholder communications are complete
    - major and cybersecurity incidents have a scheduled or completed post-incident review
    effects:
    - incident.status := closed
    - closure timestamp is recorded
    authorization:
    - incident owner or incident commander authorizes closure
    verification:
    - read incident and linked services; confirm closure state and retained evidence
mappings:
  incident:
    authoritativeSource: ITSM.Incident
    notes: Incident record and lifecycle state.
  alert:
    authoritativeSource: MonitoringOrSIEM.Alert
    notes: Operational and security alert records.
  securityEvent:
    authoritativeSource: SIEM.SecurityEvent
    notes: Correlated security telemetry.
  configurationItem:
    authoritativeSource: CMDB.ConfigurationItem
    notes: Managed asset identity and relationships.
  itService:
    authoritativeSource: ServiceCatalogue.ITService
    notes: Service ownership, criticality, and dependencies.
  change:
    authoritativeSource: ITSM.Change
    notes: Change assessment, approval, and implementation state.
  recoveryPlan:
    authoritativeSource: ContinuityRepository.RecoveryPlan
    notes: Approved recovery procedures and objectives.
  runbook:
    authoritativeSource: OperationsKnowledgeBase.Runbook
    notes: Version-controlled operational procedures.
  evidenceItem:
    authoritativeSource: EvidenceRepository.Item
    notes: Immutable or controlled evidence storage.
  regulatoryNotification:
    authoritativeSource: RegulatoryReporting.Notification
    notes: Submission workflow and receipts.
  correctiveAction:
    authoritativeSource: GRC.Action
    notes: Tracked remediation and verification.
competencyQuestions:
- Which business services and customer channels are impacted by this incident?
- Which configuration items and third-party services are on the dependency path of the affected IT service?
- Which active alerts and events are correlated with the incident?
- Who owns the affected service and which resolver group and on-call engineer should be assigned?
- Does the incident meet the bank-defined criteria for major-incident declaration?
- Which runbook, workaround, backup set, and recovery plan can be used safely?
- Was the incident caused by a recent change or deployment?
- Is a materiality assessment complete and is a regulatory notification required and due?
- Are evidence integrity, stakeholder communications, and closure conditions complete?
- Which corrective actions from prior post-incident reviews remain open for the affected service?
