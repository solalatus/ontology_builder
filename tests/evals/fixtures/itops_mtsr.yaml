    label: contains
    from: bank
    to: organizationalUnit
    kind: object
    definition: Relates Bank to Organizational Unit by "contains".
  bank_provides_businessService:
    label: provides
    from: bank
    to: businessService
    kind: object
    definition: Relates Bank to Business Service by "provides".
  bank_is_supervised_by_regulator:
