constraints:
  alert:
    has_identifier:
      required: true
      maximumCount: 1
      type: identifier
    is_raised_at:
      required: true
      maximumCount: 1
      type: timestamp
    has_status:
      required: true
      maximumCount: 1
      allowed: *id001
    has_severity:
      required: true
      maximumCount: 1
      allowed: *id002
  incident:
    has_identifier:
      required: true
      maximumCount: 1
      type: identifier
    has_summary:
      required: true
      maximumCount: 1
      type: text
    is_opened_at:
      required: true
      maximumCount: 1
      type: timestamp
    has_status:
      required: true
      maximumCount: 1
      allowed: *id003
    has_severity:
      required: true
      maximumCount: 1
      allowed: *id002
    has_priority:
      required: true
      maximumCount: 1
      allowed: *id004
    impacts:
      minimumCount: 1
      targetClass: itService
      appliesAt:
