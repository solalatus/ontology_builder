rules:
  nemHallucinálhat:
    conditions:
      - az ágens nem találhat ki nem létező ellenállás-számítási eljárást vagy méretezési képletet
      - minden állításnak visszavezethetőnek kell lennie egy megjelölt forrásra
      - csak megbízható és jól dokumentált forrásra támaszkodhat
  csakElfogadottForrástHasznál:
    conditions:
      - "a felhasználható források halmazát ember jelöli ki, nem az ágens dönti el a forrás hitelességét"
      - a kijelölt forrásokat validnak kell tekinteni
      - predátor folyóiratban megjelent közlemény nem használható fel
      - "a forrás régióját jelezni kell, mert az európai, amerikai, ausztrál és japán szabvány méretezési elvei eltérnek"
  hivatkozásKötelező:
    conditions:
      - minden felhasznált képlethez és adathoz meg kell jeleníteni a hivatkozást
      - "a hivatkozásnak meg kell mutatnia, hogy pontosan honnan származik a képlet vagy az adat"
  körkörösHivatkozástVégigJár:
    conditions:
      - a szabványok egymás fejezeteire és bekezdéseire körkörösen hivatkoznak
      - "a hivatkozási utat végig kell járni addig, amíg a tényleges alapinformáció elő nem kerül"
      - a megtalált szabványszöveget helyesen kell értelmezni
  ellentmondástJelez:
    conditions:
      - "sem a szabvány, sem a tankönyv, sem a szakirodalom nem 100 százalékig megbízható"
      - "ha az ágens két forrás vagy két dokumentumrész között ellentmondást talál, arra minden esetben fel kell hívnia a figyelmet"
  humanInTheLoopVisszajelzés:
    conditions:
      - "a modellezés megkezdése előtt az ágensnek tervezési fázist kell tartania és be kell mutatnia, hogyan értette a feladatot"
      - "a tervezési fázisban meg kell neveznie, mely elemeket tekinti statikailag határozottnak és határozatlannak"
      - "meg kell neveznie, milyen modellt szándékozik használni"
      - a tervezési fázis végén és az eredmény átadásakor is visszajelzést kell kérnie a vezető tervezőtől
      - a vezető tervező visszajelzése kötelező validációs pont
  vezetőTervezőModellválasztásátKöveti:
    conditions:
      - "a vezető tervező mondja meg, hogy rúdmodell, héjmodell vagy testmodell szükséges"
      - az ágensnek a vezető tervező által kijelölt modellezési szintet kell követnie
  nagyságrendiEllenőrzésKötelező:
    conditions:
      - a kapott eredményeket nagyságrendileg ellenőrizni kell
      - "a Newton és kilonewton összekeverése ezerszeres hiba, ez súlyosabb, mint néhány százalék pontatlanság"
      - az elmozdulások irányhelyességét ellenőrizni kell
      - szimmetrikus teherre szimmetrikus elmozdulást kell kapni
  modelldokumentációKötelezőElemei:
    conditions:
      - a dokumentációnak tartalmaznia kell a geometriát
      - a dokumentációnak tartalmaznia kell a megtámasztásokat
      - a dokumentációnak tartalmaznia kell a terheket és a teheresetéket
      - a dokumentációnak tartalmaznia kell az igénybevételeket
      - a dokumentációnak tartalmaznia kell az alakváltozásokat és lehajlásokat
      - a dokumentációnak tartalmaznia kell a validációkat
  dokumentációÁttekinthető:
    conditions:
      - "nem elég a képlethalmaz, magyarázó szöveget is kell írni"
      - "meg kell adni, honnan származik a képlet és az adat"
      - "részletet bemutató ábrát kell mellékelni, hogy azonosítható legyen, melyik elemről van szó"
      - tartalomjegyzékkel navigálhatóvá kell tenni a dokumentumot
      - "tankönyvszerűen el kell magyarázni, hogy miért az a képlet és milyen sorrendben"
      - a számítást évekkel később is reprodukálhatóvá kell tenni
  semmiKihagyásaTilos:
    conditions:
      - több száz elemre és keresztmetszetre kell minden számítást elvégezni
      - tilos bármely elemet vagy tönkremeneteli módot kihagyni
      - "kötelező ellenőrizni, hogy minden számítás minden elemre megtörtént"
  hatásKisebbMintEllenállás:
    conditions:
      - "az igénybevétel oldalnak kisebbnek kell lennie, mint az ellenállás oldal"
      - "mindkét oldal valószínűségi eloszlás, ezért mindkét oldalon parciális tényezőt kell alkalmazni"
      - "ha a kihasználtság 1 fölött van, a szerkezet a szabvány szerint nem felel meg"
      - "ha nem felel meg, változtatni kell a szerkezeten, például nagyobb szelvényt, több vasat vagy jobb anyagminőséget kell felvenni"
  tönkremeneteliMódokKiegyenlítettKihasználtsága:
    conditions:
      - "ki kell számolni, hogy az egyes tönkremeneteli módokkal szembeni kihasználtságok közel legyenek egymáshoz"
      - "nem jó, ha az egyik móddal szemben az ellenállás 100, minden mással szemben 10, mert akkor nem egyenletes a kihasználtság"
      - "a szelvényt úgy kell megválasztani, hogy szilárdságilag, stabilitásilag és alakváltozás szempontjából is megfelelő legyen"
