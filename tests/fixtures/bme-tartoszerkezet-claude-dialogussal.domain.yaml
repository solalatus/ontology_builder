# =====================================================================
# Tartoszerkezet-tervezo agens - domain ontologia (v1.0)
#
# Forras: "Ontologia" interju, Dr. Joo Attila Laszlo (BME) mint domain
#   szakerto, Lev (interjuztato) es Ferenczy Gergo reszvetelevel.
#   Alapanyagok: Ontologia_1_clean.txt + Ontologia_2_clean.txt (teljes
#   atirat), FG_jegyzet.pdf, BME_ontologia_interju_jegyzet.pdf,
#   Ontology_Interview_One_Page_Guide.pdf (6 epitoelem).
#
# Formatum: Domain Model YAML (agent_ontology_spec.md 5. es 11. szakasz).
#   Betoltes: "Import" gomb vagy a fajl rahuzasa a vaszonra -> Merge.
#
# Fedettseg: 50 osztaly, 82 kapcsolat, 19 szabaly, 10 akcio.
#   Minden elem az atiratbol vagy a ket jegyzetbol szarmazik; nincs
#   kitalalt fogalom. A tetelek forrashelyet a kiserodokumentum tartalmazza.
#
# Nyelv: a cimkek es a jelentesek magyarul, a szakerto sajat szohasznalata
#   szerint; az aliasok kozott angol megfelelok is szerepelnek.
# =====================================================================

classes:
  Kezdő mérnök ágens:
    meaning: "Az AI ágens, amely egy tervezőirodában dolgozó kezdő mérnök szerepét tölti be és egy létező vezető tervező munkavégzését támogatja."
    aliases:
      - ágens
      - agent
      - kezdő mérnök
      - junior engineer agent
    properties:
      tudásszint:
        type: text
        allowed:
          - BSc
          - MSc
          - PhD
          - egyetemi docens
          - professzor
  Vezető tervező:
    meaning: "A tervezési jogosultsággal rendelkező tapasztalt mérnök, aki a feladatot kiadja, a modellezési elvet meghatározza, visszajelzést ad és aláírásával a felelősséget vállalja."
    aliases:
      - felelős tervező
      - lead designer
      - tapasztalt mérnök
    properties:
      kamaraiJogosultság:
        type: boolean
      tapasztalat:
        type: text
  Tervezőiroda:
    meaning: "A tervezőiroda mint szervezet, amelynek évtizedek alatt kialakult saját tervezési szokásai, gyártástechnológiai adottságai és céges kultúrája vannak."
    aliases:
      - tervező iroda
      - cég
      - design office
    properties:
      cégesKultúra:
        type: text
  Kivitelező:
    meaning: "A szerkezetet beáraztató és megépítő vállalkozó, akinek saját gyártástechnológiája gazdaságossági okból áttervezést válthat ki."
    aliases:
      - kivitelező cég
      - contractor
    properties:
      gyártástechnológia:
        type: text
      beszerzésiEljárás:
        type: text
        allowed:
          - hagyományos
          - design and build
  Tervezési feladat:
    meaning: "A vezető tervező által az ágensnek kiadott konkrét mérnöki feladat, amely megnevezi az érintett szerkezeti elemet és az alkalmazandó szabványt."
    aliases:
      - mérnöki feladat
      - feladatkiadás
      - design task
    properties:
      feladattípus:
        type: text
        allowed:
          - irodalomkutatás
          - igénybevétel-számítás
          - ellenállás-számítás
          - megrajzolás
  Szerkezet:
    meaning: "A megtervezendő teherhordó szerkezet egésze, például egy vasbeton csarnok vagy egy híd, amelynek biztonságos és gazdaságos kialakítása a tervezés célja."
    aliases:
      - tartószerkezet
      - épület
      - structure
    properties:
      statikaiHatározottság:
        type: text
        allowed:
          - statikailag határozott
          - statikailag határozatlan
      fesztáv:
        type: number
        unit: m
      hossz:
        type: number
        unit: m
  Szerkezeti elem:
    meaning: "A szerkezet egy önállóan méretezendő eleme, például egy csarnok egy oszlopa vagy egy gerendája."
    aliases:
      - elem
      - oszlop
      - gerenda
      - structural element
    properties:
      elemAzonosító:
        type: text
      elemtípus:
        type: text
        allowed:
          - oszlop
          - gerenda
          - lemez
  Csomópont:
    meaning: "A szerkezeti elemek kapcsolata, például csavarozott acélkapcsolat vagy vasalási csomópont, amelynek kialakítása gyakran a tervezőiroda szokásjogát követi."
    aliases:
      - kapcsolat
      - connection
      - joint
    properties:
      kapcsolattípus:
        type: text
  Szelvény:
    meaning: "A szerkezeti elem felvett keresztmetszete, amely az ellenállás-számítás kötelező bemenete és az iteráció során változtatható."
    aliases:
      - keresztmetszet
      - szelvényméret
      - cross-section
    properties:
      szelvényméret:
        type: text
      vasmennyiség:
        type: number
  Anyagminőség:
    meaning: "A felhasznált anyag szabvány szerinti minősége, például betonminőség vagy acélminőség, amelynek folyáshatára közvetlenül befolyásolja az ellenállást."
    aliases:
      - anyagjellemző
      - betonminőség
      - acélminőség
      - material grade
    properties:
      jel:
        type: text
      folyáshatár:
        type: number
      gyártóiTanúsítvány:
        type: boolean
  Geometria:
    meaning: A szerkezet tényleges kialakításának méretei; az igénybevétel-számítás kötelező bemenete és a modelldokumentáció kötelező eleme.
    aliases:
      - geometry
    properties: {}
  Statikai váz:
    meaning: "A szerkezet megtámasztási és kapcsolati viszonyait leíró egyszerűsített váz, amely megmondja, hogy egy elem befogott vagy csuklós."
    aliases:
      - statikai modell
      - structural scheme
    properties:
      peremfeltételek:
        type: text
  Megtámasztás:
    meaning: "A szerkezet alátámasztási viszonya, amely megszabja, hogy egy pont hat szabadságfokából hány van megkötve."
    aliases:
      - támasz
      - megtámasztási viszony
      - support
    properties:
      megtámasztástípus:
        type: text
        allowed:
          - befogott
          - csuklós
          - görgős
      megkötöttSzabadságfokokSzáma:
        type: number
  Teher:
    meaning: "A szerkezetre ható terhelés, amelyet szabvány szerint kell felvenni és amelynek nagysága valószínűségi eloszlást követ."
    aliases:
      - terhelés
      - load
    properties:
      teherfajta:
        type: text
        allowed:
          - önsúly
          - hasznos teher
          - hóteher
          - szélteher
          - földrengés
      alulmaradásiValószínűség:
        type: number
        unit: "%"
  Teheresét:
    meaning: "A terhek egy vizsgált kombinációja, amelyet a végeselemes modelldokumentációban fel kell tüntetni."
    aliases:
      - teherkombináció
      - load case
    properties: {}
  Igénybevétel:
    meaning: "A terhek hatására a szerkezetben ébredő belső erő, azaz a méretezés hatásoldala, amelyet a szerkezet ellenállásával kell összevetni."
    aliases:
      - hatásoldal
      - hatás
      - belső erő
      - action effect
    properties:
      igénybevételfajta:
        type: text
        allowed:
          - nyomaték
          - nyíróerő
          - normálerő
      érték:
        type: number
      mértékegység:
        type: text
        allowed:
          - N
          - kN
  Alakváltozás:
    meaning: "A szerkezet terhelés hatására bekövetkező elmozdulása vagy lehajlása, amelyet az igénybevételekkel együtt kell meghatározni és ellenőrizni."
    aliases:
      - elmozdulás
      - lehajlás
      - deformation
    properties:
      alakváltozásfajta:
        type: text
        allowed:
          - lehajlás
          - elmozdulás
          - elfordulás
      irány:
        type: text
  Ellenállás:
    meaning: A szerkezeti elem szabvány vagy kísérlet alapján meghatározott teherbírása egy adott tönkremeneteli móddal szemben.
    aliases:
      - teherbírás
      - ellenállás oldal
      - resistance
    properties:
      érték:
        type: number
      meghatározásMódja:
        type: text
        allowed:
          - szabványos képlet
          - kísérlettel segített tervezés
          - virtuális kísérlet
  Tönkremeneteli mód:
    meaning: "Az a mód, ahogyan a szerkezeti elem adott teherszinten tönkremehet; minden releváns módra külön ellenállást kell számítani."
    aliases:
      - tönkremenetel
      - failure mode
    properties:
      módcsoport:
        type: text
        allowed:
          - szilárdsági
          - stabilitási
          - alakváltozási
      megnevezés:
        type: text
        allowed:
          - húzás
          - nyomás
          - hajlítás
          - nyírás
          - interakció
          - kihajlás
          - kifordulás
      domináns:
        type: boolean
  Kihasználtság:
    meaning: "Az igénybevétel és az ellenállás hányadosa; 1 esetén a kettő pontosan egyenlő, 1 fölött a szerkezet a szabvány szerint nem felel meg."
    aliases:
      - kihasználtsági mutató
      - utilisation
    properties:
      érték:
        type: number
  Parciális tényező:
    meaning: "A hatásoldalon és az anyagoldalon egyaránt alkalmazott biztonsági tényező, amely a valószínűségi eloszlások szórását fedi le."
    aliases:
      - biztonsági tényező
      - partial factor
    properties:
      oldal:
        type: text
        allowed:
          - hatásoldal
          - anyagoldal
      érték:
        type: number
      tervezésiÉlettartam:
        type: number
        unit: év
  Méretezési képlet:
    meaning: "A fizikai viselkedés matematikai leképezése, amely egy adott tönkremeneteli móddal szembeni ellenállási szintet ad meg."
    aliases:
      - képlet
      - méretezési összefüggés
      - design formula
    properties:
      forrásmegjelölés:
        type: text
      alkalmazhatóságiFeltétel:
        type: text
  Fizikai viselkedés:
    meaning: "A szerkezet valóságos viselkedése terhelés alatt, azaz a rugalmas tartomány és a tönkremenetel módja; a méretezési képletet ehhez kell illeszteni."
    aliases:
      - szerkezeti viselkedés
      - physical behaviour
    properties:
      tartomány:
        type: text
        allowed:
          - rugalmas
          - tönkremenő
      maradandóAlakváltozás:
        type: boolean
  Végeselem modell:
    meaning: "Numerikus modell, amely a szerkezetet csomópontokra és elemekre bontva, mátrix-elmozdulás módszerrel határozza meg az igénybevételeket és az alakváltozásokat."
    aliases:
      - numerikus modell
      - végeselemes modell
      - FE modell
      - finite element model
    properties:
      modelltípus:
        type: text
        allowed:
          - rúdmodell
          - héjmodell
          - testmodell
      elemtípus:
        type: text
      linearitás:
        type: text
        allowed:
          - lineáris
          - nemlineáris
      csomópontokSzáma:
        type: number
  Kézi modell:
    meaning: "Kézzel számítható egyszerű modell, például kéttámaszú tartó vagy Cross-módszer, amely statikailag határozott esetben önállóan is elég, egyébként a végeselemes eredmény validálására szolgál."
    aliases:
      - kézi számítás
      - kézi módszer
      - Cross-módszer
    properties: {}
  Tervezőszoftver:
    meaning: "A modellezésre és a dokumentálásra használt szoftver, amelynek koordináta-rendszere és előjelkonvenciója önmagában is hibaforrás."
    aliases:
      - szoftver
      - végeselemes szoftver
      - Tekla
      - Mathcad
    properties:
      koordinátarendszer:
        type: text
      előjelkonvenció:
        type: text
      beépítettSzabványosEllenőrzés:
        type: boolean
  Forrás:
    meaning: "Bármely tudásforrás, amelyre az ágens állítása visszavezethető; a felhasználható forráshalmazt ember jelöli ki."
    aliases:
      - tudásforrás
      - source
    properties:
      megbízható:
        type: boolean
      régió:
        type: text
        allowed:
          - Európa
          - Amerika
          - Ausztrália
          - Japán
      nyilvános:
        type: boolean
  Szabvány:
    meaning: "A tervezés konszenzusos, validált szabályrendszere, amely a biztonsági szintet garantálja, de a kutatásoknak csak szűkebb, lassan frissülő halmazát tartalmazza."
    aliases:
      - Eurocode
      - eurokód
      - EN szabvány
      - standard
    properties:
      szabványrész:
        type: text
        allowed:
          - EN 1990 - tervezés alapjai
          - EN 1991 - terhek és hatások
          - EN 1992 - vasbeton szerkezetek
      frissítésiCiklus:
        type: number
        unit: év
      hibátTartalmazhat:
        type: boolean
  Szakirodalom:
    meaning: "A szabványon túlmutató tudományos irodalom, azaz kísérlettel vagy numerikus modellel alátámasztott kutatási eredmények nemzetközi folyóiratokban."
    aliases:
      - tudományos cikk
      - publikáció
      - folyóiratcikk
      - literature
    properties:
      folyóiratMegbízhatósága:
        type: text
        allowed:
          - megbízható
          - predátor
      kísérlettelAlátámasztott:
        type: boolean
      paraméteresVizsgálatotTartalmaz:
        type: boolean
  Tankönyv és oktatási anyag:
    meaning: "Egyetemi jegyzet, tankönyv és előadásanyag, amely részben a szabványt magyarázza, nagyobb részt viszont a szabványtól függetlenül a fizikai viselkedést tanítja."
    aliases:
      - tankönyv
      - egyetemi jegyzet
      - oktatási anyag
      - előadásanyag
    properties:
      szabványtólFüggetlen:
        type: boolean
  Mérnöki szokásjog:
    meaning: "A tervezőiroda kialakult, gyakran tacit gyakorlata, amelyet saját gyártógépsora és tapasztalata alakított ki; az első körben nem része az ágens tudásbázisának."
    aliases:
      - szokásjog
      - céges gyakorlat
      - mérnöki szokás
      - tacit tudás
    properties:
      explicit:
        type: boolean
      azÁgensTudásbázisábanSzerepel:
        type: boolean
  Esettanulmány:
    meaning: "Megvalósult, hasonló szerkezetek dokumentált példái, amelyekkel a tervezett szerkezet empirikusan összevethető."
    aliases:
      - mintapélda
      - case study
    properties: {}
  Referenciaszerkezet:
    meaning: "Már megépült, álló hasonló szerkezet, amelynek mérettartományával a tervezett szerkezet empirikusan összevethető."
    aliases:
      - hasonló szerkezet
      - referencia
    properties:
      darabszám:
        type: number
  Kísérlet:
    meaning: "Fizikai vagy virtuális kísérlet, amely a szerkezet teherbírását vagy a numerikus modell helyességét igazolja."
    aliases:
      - teszt
      - virtuális kísérlet
      - szimuláció
      - experiment
    properties:
      kísérletfajta:
        type: text
        allowed:
          - fizikai kísérlet
          - virtuális kísérlet
      kísérletekSzáma:
        type: number
      középérték:
        type: number
      szórás:
        type: number
  Kísérlettel segített tervezés:
    meaning: "Szabványban rögzített eljárás arra az esetre, ha egy szerkezet ellenállása képletből nem határozható meg; az ellenállást előírt számú kísérlet középértékéből, szórásából és parciális tényezőjéből képzik."
    aliases:
      - kísérlettel segített méretezés
      - design assisted by testing
    properties: {}
  Szabványon kívüli méretezési eljárás:
    meaning: "Szabványban nem szereplő, de kísérlettel vagy numerikus modellel igazolt méretezési eljárás, amely a szabványos biztonsági szintet hozza és később a szabványba is bekerülhet."
    aliases:
      - szabványon túlmutató eljárás
    properties:
      nyilvános:
        type: boolean
  Hivatkozás:
    meaning: "Egy állítás vagy képlet forrásának pontos megjelölése; a szabványok gyakran körkörösen hivatkoznak egymásra, ezt az utat végig kell járni."
    aliases:
      - forrásmegjelölés
      - reference
      - citation
    properties:
      körkörös:
        type: boolean
      bejárva:
        type: boolean
  Ellentmondás:
    meaning: "Két forrás vagy két dokumentumrész egymásnak ellentmondó állítása, amelyre az ágensnek minden esetben fel kell hívnia a figyelmet."
    aliases:
      - forrásellentmondás
      - contradiction
    properties:
      érintettForrások:
        type: text
      jelezve:
        type: boolean
  Visszajelzés:
    meaning: A vezető tervező emberi ellenőrzése és visszajelzése az ágens tervére vagy eredményére; kötelező validációs pont.
    aliases:
      - feedback
      - human-in-the-loop
      - emberi ellenőrzés
    properties:
      fázis:
        type: text
        allowed:
          - tervezési fázis
          - eredmény átadása
      elfogadva:
        type: boolean
  Ellenőrzési lista:
    meaning: "Az irodalomkutatás outputjaként előálló, hivatkozásokkal ellátott lista arról, hogy mely tönkremeneteli módokat és szerkesztési szabályokat kell végigszámolni."
    aliases:
      - checklista
      - feladatlista
      - checklist
    properties:
      tételekSzáma:
        type: number
  Irodalomkutatási tanulmány:
    meaning: "Az irodalomkutatás összefoglaló dokumentuma, amely az ellenőrzési listát, a hivatkozásokat és az összefoglalót együtt tartalmazza."
    aliases:
      - tanulmány
      - összefoglaló
      - irodalomkutatási összefoglaló
    properties: {}
  Modelldokumentáció:
    meaning: "A végeselemes modellt leíró dokumentáció, amelynek kötelező elemei a geometria, a megtámasztás, a terhek, az igénybevételek, az alakváltozások és a validációk."
    aliases:
      - modell dokumentáció
      - model documentation
    properties: {}
  Statikai dokumentáció:
    meaning: "A szerkezet megfelelőségét igazoló teljes számítási dokumentáció, amely az igénybevételi és az ellenállási oldalt egyaránt tartalmazza."
    aliases:
      - statikai számítás
      - méretezési dokumentáció
      - számítási dokumentáció
    properties:
      tartalomjegyzékkelEllátott:
        type: boolean
      reprodukálható:
        type: boolean
      oldalszám:
        type: number
  Műszaki leírás:
    meaning: "A szerkezetet bemutató vezető dokumentum, amelynek mellékletei a tervlapok és a számítások, és amely gyártási és szerelési információt is tartalmaz."
    aliases:
      - technical description
    properties: {}
  BIM modell:
    meaning: "A szerkezet 3D digitális ikre, amely az utolsó csavarjáig ugyanazt tartalmazza, mint a megvalósuló valóság; ebből származnak a 2D rajzok."
    aliases:
      - IFC modell
      - digitális iker
      - BIM
      - IFC
    properties:
      fájlformátum:
        type: text
  Tervrajz:
    meaning: "A BIM modellből származtatott 2D vetület, amelynek hibamentesnek, ellentmondásmentesnek és a gyártáshoz éppen elegendően informatívnak kell lennie."
    aliases:
      - rajz
      - tervlap
      - drawing
    properties:
      tervfajta:
        type: text
        allowed:
          - koncepcióterv
          - engedélyes terv
          - kiviteli terv
          - gyártmányterv
          - vasalási terv
      tintafedettség:
        type: number
        unit: "%"
  Tervdokumentáció:
    meaning: "A kivitelezőnek átadott teljes tervcsomag, amely alapján a szerkezet beárazható és megépíthető."
    aliases:
      - tervcsomag
      - terv dokumentáció
      - plan documentation
    properties: {}
  Technológiai sorrend:
    meaning: "A gyártás és a szerelés technológiai sorrendje, amely megszabja, melyik információnak melyik rajzon kell szerepelnie; a rajzolás sorrendje ennek fordítottja."
    aliases:
      - gyártási sorrend
      - szerelési sorrend
      - gyártási ütem
    properties: {}
  Validáció:
    meaning: "A modell és az eredmény helyességének ellenőrzése kézi számítással, szimmetriavizsgálattal, előjel- és nagyságrendi ellenőrzéssel."
    aliases:
      - ellenőrzés
      - validációs kör
      - validation
    properties:
      validációmódszer:
        type: text
        allowed:
          - kézi ellenőrzés
