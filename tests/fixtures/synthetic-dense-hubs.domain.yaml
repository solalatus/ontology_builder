# =====================================================================
# Synthetic layout-bench fixture: dense hub-and-spoke, 20 nodes.
#
# Purpose: guards the layout-algorithm experiments for issue #64 against
# overfitting to the dense BME reference ontology's specific shape — this
# fixture instead stresses a small number of very-high-degree hub nodes
# plus deliberate cross-hub spoke sharing, which is what actually produces
# edge crossings and label crowding around a few nodes rather than the
# BME graph's more evenly-distributed relationship density.
# =====================================================================

classes:
  Hub1:
    meaning: "First high-degree hub."
  Hub2:
    meaning: "Second high-degree hub."
  Hub3:
    meaning: "Third high-degree hub."
  S1:
    meaning: "Spoke 1."
  S2:
    meaning: "Spoke 2."
  S3:
    meaning: "Spoke 3."
  S4:
    meaning: "Spoke 4."
  S5:
    meaning: "Spoke 5, shared between Hub1 and Hub2."
  S6:
    meaning: "Spoke 6, shared between Hub1 and Hub2."
  S7:
    meaning: "Spoke 7, shared between Hub1 and Hub2."
  S8:
    meaning: "Spoke 8."
  S9:
    meaning: "Spoke 9."
  S10:
    meaning: "Spoke 10, shared between Hub2 and Hub3."
  S11:
    meaning: "Spoke 11, shared between Hub2 and Hub3."
  S12:
    meaning: "Spoke 12, shared between Hub2 and Hub3."
  S13:
    meaning: "Spoke 13."
  S14:
    meaning: "Spoke 14."
  S15:
    meaning: "Spoke 15."
  S16:
    meaning: "Spoke 16."
  S17:
    meaning: "Spoke 17."

